<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      파비콘은 SVG를 먼저 준다 — 탭 막대가 어두우면 흰 마크, 밝으면 검은 마크로
      스스로 뒤집는다. ICO는 SVG를 모르는 브라우저 몫이라 흰 마크에 검은 바탕이다.
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      본문 글꼴. 경로를 두 군데 고쳤습니다 — jsDelivr의 gh 배포는 이 저장소가
      50MB를 넘어 통째로 막혀 있고(403), 디렉터리 이름도 webfontaggregated가
      아니라 webfonts입니다. 예전 URL은 404를 받아 왔고, 그동안 사이트 전체가
      styles.css의 폴백(system-ui)으로 그려지고 있었습니다.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/variable/complete/WantedSansVariable.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!--app-head-->

    <script>
      // 페인트 전에 테마를 확정합니다. 저장된 선택이 없으면 OS 설정을 따릅니다.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('paldyn-ai-theme');
        } catch (error) {
          // 저장소 접근이 막힌 환경에서는 OS 설정만 봅니다.
        }
        var theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
