<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="글로벌 AI 뉴스와 모델, 수학, 논문, 실험을 탐구하는 Paldyn AI Lab"
    />
    <meta property="og:title" content="Paldyn AI Lab" />
    <meta
      property="og:description"
      content="AI의 변화를 읽고 모델, 수학, 논문과 실험을 직접 탐구합니다."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/logo-symbol-light.png" />
    <title>Paldyn AI Lab</title>
    <script>
      (function () {
        var saved = localStorage.getItem('paldyn-ai-theme');
        var theme = saved || 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
