<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="12" fill="#0a0a0a"/>
  <g font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
    <text x="440" y="46" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">--max-batch-total-tokens는 남은 메모리다</text>
    <text x="440" y="72" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">Llama 3.1 8B · bf16 · A100 80GB 한 장</text>

    <!-- 80GB bar: 760px => 9.5px/GB, x0=60 -->
    <rect x="60" y="104" width="152" height="44" fill="#1c1c3a" stroke="#7777cc"/>
    <text x="136" y="131" font-size="14" font-weight="600" fill="#7777cc" text-anchor="middle">가중치 16GB</text>
    <rect x="212" y="104" width="57" height="44" fill="#1a1a1a" stroke="#555"/>
    <text x="240" y="131" font-size="13" fill="#888" text-anchor="middle">여유 6</text>
    <rect x="269" y="104" width="551" height="44" fill="#0f2430" stroke="#7ec8e3"/>
    <text x="544" y="131" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">KV 캐시 약 58GB</text>

    <!-- per token -->
    <rect x="60" y="184" width="760" height="60" rx="8" fill="#141414" stroke="#555"/>
    <text x="440" y="209" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">토큰 하나 = 2 (K·V) × 32층 × KV 헤드 8 × 차원 128 × 2바이트 = 128KB</text>
    <text x="440" y="231" font-size="13" fill="#888" text-anchor="middle">58GB ÷ 128KB ≈ 47만 토큰 — TGI가 기동할 때 이 값을 스스로 잰다</text>
    <line x1="544" y1="148" x2="544" y2="184" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>

    <!-- two outcomes -->
    <line x1="250" y1="244" x2="250" y2="280" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="630" y1="244" x2="630" y2="280" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="60" y="280" width="380" height="84" rx="8" fill="#141414" stroke="#e05555" stroke-width="2"/>
    <text x="250" y="307" font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">최악의 요청으로 채우면 약 58개</text>
    <text x="250" y="329" font-size="13" fill="#888" text-anchor="middle">요청마다 --max-total-tokens 8,192를</text>
    <text x="250" y="349" font-size="13" fill="#888" text-anchor="middle">꽉 채운다고 볼 때</text>
    <rect x="480" y="280" width="340" height="84" rx="8" fill="#141414" stroke="#55c555" stroke-width="2"/>
    <text x="650" y="307" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">실제 길이면 200개 넘게</text>
    <text x="650" y="329" font-size="13" fill="#888" text-anchor="middle">요청 대부분이 2,000토큰 안팎일 때</text>
    <text x="650" y="349" font-size="13" fill="#888" text-anchor="middle">연속 배칭이 빈자리를 채운다</text>

    <text x="440" y="404" font-size="13" fill="#888" text-anchor="middle">--kv-cache-dtype을 fp8로 두면 토큰당 64KB가 되어 두 수가 모두 두 배가 된다</text>
  </g>
</svg>
