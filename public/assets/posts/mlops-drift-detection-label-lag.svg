<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">정확도가 알려 줄 때는 이미 6주가 지나 있다</text>
  <text x="62" y="68" font-size="13" fill="#888">정답 라벨이 6주 뒤에 붙는 서비스에서, 같은 사건을 두 지표가 각각 언제 보여 주는지.</text>

  <text x="62" y="96" font-size="13" font-weight="600" fill="#7ec8e3">입력 분포 거리 (PSI) — 라벨 없이 매일 잰다</text>
  <text x="497" y="96" font-size="13" font-weight="600" fill="#e05555">라벨은 여기까지 왔다</text>

  <line x1="150" y1="110" x2="820" y2="110" stroke="#222222" stroke-width="1"/>
  <line x1="150" y1="165" x2="820" y2="165" stroke="#222222" stroke-width="1"/>
  <line x1="150" y1="220" x2="820" y2="220" stroke="#444444" stroke-width="1.5"/>
  <line x1="150" y1="110" x2="150" y2="220" stroke="#444444" stroke-width="1.5"/>

  <text x="136" y="115" font-size="12" fill="#888" text-anchor="end">0.5</text>
  <text x="136" y="170" font-size="12" fill="#888" text-anchor="end">0.25</text>
  <text x="136" y="225" font-size="12" fill="#888" text-anchor="end">0</text>

  <line x1="150" y1="176" x2="820" y2="176" stroke="#e05555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="160" y="196" font-size="12" fill="#e05555">경보 기준 0.2</text>

  <polyline points="150,216 206,213 262,216 318,211 373,213 429,194 485,174 541,158 597,147 653,141 708,136 764,132 820,130" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="150" cy="216" r="4" fill="#7ec8e3"/>
  <circle cx="206" cy="213" r="4" fill="#7ec8e3"/>
  <circle cx="262" cy="216" r="4" fill="#7ec8e3"/>
  <circle cx="318" cy="211" r="4" fill="#7ec8e3"/>
  <circle cx="373" cy="213" r="4" fill="#7ec8e3"/>
  <circle cx="429" cy="194" r="4" fill="#7ec8e3"/>
  <circle cx="485" cy="174" r="4" fill="#7ec8e3"/>
  <circle cx="541" cy="158" r="4" fill="#7ec8e3"/>
  <circle cx="597" cy="147" r="4" fill="#7ec8e3"/>
  <circle cx="653" cy="141" r="4" fill="#7ec8e3"/>
  <circle cx="708" cy="136" r="4" fill="#7ec8e3"/>
  <circle cx="764" cy="132" r="4" fill="#7ec8e3"/>
  <circle cx="820" cy="130" r="4" fill="#7ec8e3"/>

  <text x="62" y="246" font-size="13" font-weight="600" fill="#55c555">실제 정확도 — 라벨이 와야 잰다</text>

  <line x1="150" y1="260" x2="820" y2="260" stroke="#222222" stroke-width="1"/>
  <line x1="150" y1="308" x2="820" y2="308" stroke="#222222" stroke-width="1"/>
  <line x1="150" y1="356" x2="820" y2="356" stroke="#222222" stroke-width="1"/>
  <line x1="150" y1="380" x2="820" y2="380" stroke="#444444" stroke-width="1.5"/>
  <line x1="150" y1="260" x2="150" y2="380" stroke="#444444" stroke-width="1.5"/>

  <text x="136" y="265" font-size="12" fill="#888" text-anchor="end">95%</text>
  <text x="136" y="313" font-size="12" fill="#888" text-anchor="end">85%</text>
  <text x="136" y="361" font-size="12" fill="#888" text-anchor="end">75%</text>
  <text x="136" y="385" font-size="12" fill="#888" text-anchor="end">70%</text>

  <polyline points="150,279 206,279 262,284 318,279 373,284 429,294 485,313" fill="none" stroke="#55c555" stroke-width="2.5"/>
