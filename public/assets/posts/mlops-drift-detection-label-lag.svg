  <circle cx="820" cy="366" r="4" fill="#e05555"/>

  <text x="545" y="290" font-size="12" fill="#e05555">라벨이 아직 안 온 구간</text>

  <line x1="485" y1="104" x2="485" y2="386" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>

  <text x="150" y="400" font-size="12" fill="#888" text-anchor="middle">0주</text>
  <text x="262" y="400" font-size="12" fill="#888" text-anchor="middle">2주</text>
  <text x="373" y="400" font-size="12" fill="#888" text-anchor="middle">4주</text>
  <text x="485" y="400" font-size="12" fill="#888" text-anchor="middle">6주</text>
  <text x="597" y="400" font-size="12" fill="#888" text-anchor="middle">8주</text>
  <text x="708" y="400" font-size="12" fill="#888" text-anchor="middle">10주</text>
  <text x="820" y="400" font-size="12" fill="#888" text-anchor="middle">12주</text>
  <text x="485" y="424" font-size="13" fill="#aaaaaa" text-anchor="middle">모델을 배포하고 지난 주차</text>

  <text x="62" y="452" font-size="12" fill="#888">5주차에 입력이 흔들린 것을 PSI는 6주차에 알려 주지만, 그 주의 실제 정확도는 12주차에나 손에 들어온다.</text>
</svg>
