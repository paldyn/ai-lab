<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 556" width="880" height="556">
  <rect width="880" height="556" fill="#0a0a0a" rx="12"/>
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <g font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
    <text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">무중단 재색인 절차</text>
    <rect x="140" y="76" width="600" height="56" rx="8" fill="#111520" stroke="#3a4a6e" stroke-width="1.5"/>
    <circle cx="176" cy="104" r="15" fill="none" stroke="#7777cc" stroke-width="1.5"/>
    <text x="176" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e8">1</text>
    <text x="212" y="100" font-size="14" font-weight="600" fill="#e8e8e8">새 색인을 옆에 만든다</text>
    <text x="212" y="120" font-size="13" fill="#888">옛 색인은 그대로 질문을 받는다</text>
    <line x1="440" y1="132" x2="440" y2="154" stroke="#7777cc" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="140" y="154" width="600" height="56" rx="8" fill="#111520" stroke="#3a4a6e" stroke-width="1.5"/>
    <circle cx="176" cy="182" r="15" fill="none" stroke="#7777cc" stroke-width="1.5"/>
    <text x="176" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e8">2</text>
    <text x="212" y="178" font-size="14" font-weight="600" fill="#e8e8e8">이중 쓰기를 켠다</text>
    <text x="212" y="198" font-size="13" fill="#888">이후의 문서 변경은 두 색인에 함께 쓴다</text>
    <line x1="440" y1="210" x2="440" y2="232" stroke="#7777cc" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="140" y="232" width="600" height="56" rx="8" fill="#111520" stroke="#3a4a6e" stroke-width="1.5"/>
    <circle cx="176" cy="260" r="15" fill="none" stroke="#7777cc" stroke-width="1.5"/>
    <text x="176" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e8">3</text>
    <text x="212" y="256" font-size="14" font-weight="600" fill="#e8e8e8">기존 문서를 채운다</text>
    <text x="212" y="276" font-size="13" fill="#888">청크 200만 개 × 400토큰 = 8억 토큰을 다시 임베딩</text>
    <line x1="440" y1="288" x2="440" y2="310" stroke="#7777cc" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="140" y="310" width="600" height="56" rx="8" fill="#111520" stroke="#3a4a6e" stroke-width="1.5"/>
    <circle cx="176" cy="338" r="15" fill="none" stroke="#7777cc" stroke-width="1.5"/>
    <text x="176" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e8">4</text>
    <text x="212" y="334" font-size="14" font-weight="600" fill="#e8e8e8">그림자로 비교한다</text>
    <text x="212" y="354" font-size="13" fill="#888">골든셋·실제 질문을 두 색인에 던져 견준다, 사용자에게는 옛 결과</text>
    <line x1="440" y1="366" x2="440" y2="388" stroke="#7777cc" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="140" y="388" width="600" height="56" rx="8" fill="#1a1010" stroke="#e05555" stroke-width="1.5"/>
    <circle cx="176" cy="416" r="15" fill="none" stroke="#e05555" stroke-width="1.5"/>
    <text x="176" y="421" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e8">5</text>
    <text x="212" y="412" font-size="14" font-weight="600" fill="#e8e8e8">별칭을 바꾼다</text>
    <text x="212" y="432" font-size="13" fill="#e05555">색인과 질문 쪽 임베딩 모델을 같은 순간에 바꾼다</text>
    <line x1="440" y1="444" x2="440" y2="466" stroke="#7777cc" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="140" y="466" width="600" height="56" rx="8" fill="#111520" stroke="#3a4a6e" stroke-width="1.5"/>
    <circle cx="176" cy="494" r="15" fill="none" stroke="#7777cc" stroke-width="1.5"/>
    <text x="176" y="499" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e8">6</text>
    <text x="212" y="490" font-size="14" font-weight="600" fill="#e8e8e8">옛 색인을 며칠 남긴다</text>
    <text x="212" y="510" font-size="13" fill="#888">문제가 보이면 별칭만 되돌린다</text>
  </g>
</svg>
