<rect x="101.2" y="204" width="170.0" height="42" rx="4" fill="#e05555" fill-opacity="0.35" stroke="#e05555" stroke-width="1.5"/>
<text x="186.2" y="231" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">지수 8</text>
<rect x="271.2" y="204" width="148.8" height="42" rx="4" fill="#7ec8e3" fill-opacity="0.35" stroke="#7ec8e3" stroke-width="1.5"/>
