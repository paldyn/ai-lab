<text x="436.0" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">범위 ±3.4e38</text>
<text x="80" y="196" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">16비트</text>
<rect x="80.0" y="296" width="21.2" height="42" rx="4" fill="#7777cc" fill-opacity="0.35" stroke="#7777cc" stroke-width="1.5"/>
<rect x="101.2" y="296" width="106.2" height="42" rx="4" fill="#e05555" fill-opacity="0.35" stroke="#e05555" stroke-width="1.5"/>
<text x="154.4" y="323" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">지수 5</text>
<rect x="207.5" y="296" width="212.5" height="42" rx="4" fill="#7ec8e3" fill-opacity="0.35" stroke="#7ec8e3" stroke-width="1.5"/>
