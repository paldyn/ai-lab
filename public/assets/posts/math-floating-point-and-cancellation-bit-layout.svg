<rect x="80" y="388" width="720" height="0" fill="none"/>
<text x="440" y="396" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">bf16은 fp32의 지수를 그대로 쓰고 가수만 잘랐다</text>
<text x="440" y="424" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">그래서 fp16이 넘치는 자리에서 안 넘치고, fp16이 버티는 자리에서 먼저 뭉갠다</text>
</svg>