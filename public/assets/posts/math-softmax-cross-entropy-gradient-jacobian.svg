  <text x="445" y="348" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">J 는 대칭이고 각 열의 합이 0이다 — 로짓 하나를 흔들어도 확률의 총합은 1로 남기 때문이다</text>
