<text x="60" y="374" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">곡선이 천장에 닿는 자리는 q가 사후분포와 같아지는 한 점뿐이고, 거기서 간극이 정확히 0이다.</text>
<text x="60" y="396" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">q를 좁은 족에서만 고르면 곡선의 최고점이 천장 아래에 머문다 — 그 남은 높이가 하한의 헐거움이다.</text>
