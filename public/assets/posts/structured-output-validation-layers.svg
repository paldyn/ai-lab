<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <rect x="0" y="0" width="880" height="520" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">검증은 네 층이고 층마다 대응이 다르다</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">위 두 층은 제약으로 없앨 수 있고, 아래 두 층은 받은 뒤에 코드가 봐야 한다</text>

  <rect x="50" y="110" width="780" height="76" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="74" y="140" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13.5" font-weight="600" fill="#55c555">1. 파싱</text>
  <text x="74" y="166" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">문자열이 JSON으로 읽히는가 — 따옴표, 쉼표, 괄호 짝</text>
  <line x1="580" y1="124" x2="580" y2="172" stroke="#2a2a35" stroke-width="1"/>
  <text x="604" y="154" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#55c555">제약을 걸면 사라진다</text>

  <rect x="50" y="196" width="780" height="76" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="74" y="226" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13.5" font-weight="600" fill="#55c555">2. 스키마 검증</text>
  <text x="74" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">필수 필드, 타입, enum 값, 배열 원소의 모양</text>
  <line x1="580" y1="210" x2="580" y2="258" stroke="#2a2a35" stroke-width="1"/>
  <text x="604" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#55c555">제약을 걸면 사라진다</text>

  <rect x="50" y="282" width="780" height="76" rx="8" fill="#12121a" stroke="#e0a555" stroke-width="1"/>
  <text x="74" y="312" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13.5" font-weight="600" fill="#e0a555">3. 의미 검증</text>
  <text x="74" y="338" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">존재하는 ID인가, 날짜가 실재하는가, 필드끼리 모순은 없는가</text>
  <line x1="580" y1="296" x2="580" y2="344" stroke="#2a2a35" stroke-width="1"/>
  <text x="604" y="326" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e0a555">코드가 직접 본다</text>

  <rect x="50" y="368" width="780" height="76" rx="8" fill="#12121a" stroke="#e05555" stroke-width="1"/>
  <text x="74" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13.5" font-weight="600" fill="#e05555">4. 근거 검증</text>
  <text x="74" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">이 값이 실제로 원문에 있었는가 — 인용문 대조, 출처 확인</text>
  <line x1="580" y1="382" x2="580" y2="430" stroke="#2a2a35" stroke-width="1"/>
  <text x="604" y="412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e05555">설계가 없으면 못 본다</text>

  <text x="50" y="482" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">4번은 나중에 붙일 수 없다. 인용문을 함께 뽑도록 스키마를 짜 두어야 대조할 것이 생긴다.</text>
</svg>
