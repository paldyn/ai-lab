<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">A를 랭크 1 조각 둘의 합으로 읽기</text>
  <text x="60" y="70" font-size="13" fill="#888">A = σ₁u₁v₁ᵀ + σ₂u₂v₂ᵀ. 조각마다 열이 전부 한 방향(u₁ 또는 u₂)의 배수다.</text>
  <path d="M 78 120 L 70 120 L 70 214 L 78 214" fill="none" stroke="#888" stroke-width="1.5"/>
  <path d="M 172 120 L 180 120 L 180 214 L 172 214" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="103" y="150" font-size="15" fill="#e8e8e8" text-anchor="middle">3</text>
  <text x="147" y="150" font-size="15" fill="#e8e8e8" text-anchor="middle">0</text>
  <text x="103" y="176" font-size="15" fill="#e8e8e8" text-anchor="middle">4</text>
  <text x="147" y="176" font-size="15" fill="#e8e8e8" text-anchor="middle">5</text>
  <text x="103" y="202" font-size="15" fill="#e8e8e8" text-anchor="middle">0</text>
  <text x="147" y="202" font-size="15" fill="#e8e8e8" text-anchor="middle">0</text>
  <text x="125" y="112" font-size="13" fill="#888" text-anchor="middle">A</text>
  <text x="220" y="170" font-size="22" fill="#e8e8e8" text-anchor="middle">=</text>
  <text x="276" y="170" font-size="16" fill="#7ec8e3" text-anchor="middle">1.5 ·</text>
  <path d="M 318 120 L 310 120 L 310 214 L 318 214" fill="none" stroke="#888" stroke-width="1.5"/>
  <path d="M 412 120 L 420 120 L 420 214 L 412 214" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="343" y="150" font-size="15" fill="#7ec8e3" text-anchor="middle">1</text>
  <text x="387" y="150" font-size="15" fill="#7ec8e3" text-anchor="middle">1</text>
  <text x="343" y="176" font-size="15" fill="#7ec8e3" text-anchor="middle">3</text>
  <text x="387" y="176" font-size="15" fill="#7ec8e3" text-anchor="middle">3</text>
  <text x="343" y="202" font-size="15" fill="#7ec8e3" text-anchor="middle">0</text>
  <text x="387" y="202" font-size="15" fill="#7ec8e3" text-anchor="middle">0</text>
  <text x="365" y="112" font-size="13" fill="#7ec8e3" text-anchor="middle">σ₁u₁v₁ᵀ</text>
  <text x="470" y="170" font-size="22" fill="#e8e8e8" text-anchor="middle">+</text>
  <text x="526" y="170" font-size="16" fill="#7777cc" text-anchor="middle">0.5 ·</text>
  <path d="M 568 120 L 560 120 L 560 214 L 568 214" fill="none" stroke="#888" stroke-width="1.5"/>
  <path d="M 662 120 L 670 120 L 670 214 L 662 214" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="593" y="150" font-size="15" fill="#7777cc" text-anchor="middle">3</text>
  <text x="637" y="150" font-size="15" fill="#7777cc" text-anchor="middle">−3</text>
  <text x="593" y="176" font-size="15" fill="#7777cc" text-anchor="middle">−1</text>
  <text x="637" y="176" font-size="15" fill="#7777cc" text-anchor="middle">1</text>
  <text x="593" y="202" font-size="15" fill="#7777cc" text-anchor="middle">0</text>
  <text x="637" y="202" font-size="15" fill="#7777cc" text-anchor="middle">0</text>
  <text x="615" y="112" font-size="13" fill="#7777cc" text-anchor="middle">σ₂u₂v₂ᵀ</text>
  <text x="760" y="156" font-size="13" fill="#888" text-anchor="middle">1.5 = 3√5 / √20</text>
  <text x="760" y="180" font-size="13" fill="#888" text-anchor="middle">0.5 = √5 / √20</text>
  <rect x="60" y="244" width="360" height="150" rx="10" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="84" y="274" font-size="16" font-weight="600" fill="#e8e8e8">첫 조각만 남기면</text>
  <text x="84" y="302" font-size="14" fill="#9aa4b8">(1.5, 1.5 / 4.5, 4.5 / 0, 0)</text>
  <text x="84" y="328" font-size="14" fill="#9aa4b8">제곱합 45 — A의 제곱합 50 가운데 90%</text>
  <text x="84" y="354" font-size="14" fill="#9aa4b8">열 둘이 모두 (1, 3, 0) 방향이다</text>
  <text x="84" y="378" font-size="14" fill="#7ec8e3">σ₁² = 45가 그 90%를 그대로 말한다</text>
  <rect x="460" y="244" width="360" height="150" rx="10" fill="#101820" stroke="#7777cc" stroke-width="1.5"/>
  <text x="484" y="274" font-size="16" font-weight="600" fill="#e8e8e8">둘째 조각이 채우는 것</text>
  <text x="484" y="302" font-size="14" fill="#9aa4b8">(1.5, −1.5 / −0.5, 0.5 / 0, 0)</text>
  <text x="484" y="328" font-size="14" fill="#9aa4b8">제곱합 5 — 나머지 10%</text>
  <text x="484" y="354" font-size="14" fill="#9aa4b8">열 둘이 모두 (3, −1, 0) 방향이다</text>
  <text x="484" y="378" font-size="14" fill="#7777cc">두 조각을 더하면 A가 정확히 돌아온다</text>
</svg>
