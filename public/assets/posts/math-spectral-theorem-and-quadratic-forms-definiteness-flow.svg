<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">2×2 대칭 행렬은 두 수만으로 판정된다</text>
  <text x="60" y="70" font-size="13" fill="#888">곱이 행렬식, 합이 대각합이므로 고윳값을 풀지 않아도 부호 조합이 정해진다</text>

  <defs>
    <marker id="df-arr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="340" y="96" width="200" height="60" rx="10" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="120" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">det A 의 부호는?</text>
  <text x="440" y="140" font-size="13" fill="#9aa4b8" text-anchor="middle">두 고윳값의 곱이다</text>

  <path d="M 380 156 L 200 208" fill="none" stroke="#888" stroke-width="2" marker-end="url(#df-arr)"/>
  <text x="250" y="180" font-size="13" font-weight="600" fill="#e05555">음수</text>

  <path d="M 440 156 L 440 208" fill="none" stroke="#888" stroke-width="2" marker-end="url(#df-arr)"/>
  <text x="454" y="186" font-size="13" font-weight="600" fill="#7ec8e3">0</text>

  <path d="M 500 156 L 680 208" fill="none" stroke="#888" stroke-width="2" marker-end="url(#df-arr)"/>
  <text x="608" y="180" font-size="13" font-weight="600" fill="#55c555">양수</text>

  <rect x="70" y="216" width="230" height="72" rx="10" fill="#101820" stroke="#e05555" stroke-width="1.5"/>
  <text x="185" y="244" font-size="15" font-weight="600" fill="#e05555" text-anchor="middle">부정부호</text>
  <text x="185" y="266" font-size="13" fill="#9aa4b8" text-anchor="middle">부호가 다른 두 고윳값</text>
  <text x="185" y="282" font-size="13" fill="#e8e8e8" text-anchor="middle">→ 안장</text>

  <rect x="340" y="216" width="200" height="72" rx="10" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="244" font-size="15" font-weight="600" fill="#7ec8e3" text-anchor="middle">반정치</text>
  <text x="440" y="266" font-size="13" fill="#9aa4b8" text-anchor="middle">고윳값 하나가 0</text>
  <text x="440" y="282" font-size="13" fill="#e8e8e8" text-anchor="middle">→ 판정 보류</text>

  <rect x="580" y="216" width="230" height="60" rx="10" fill="#101820" stroke="#55c555" stroke-width="1.5"/>
  <text x="695" y="240" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">tr A 의 부호는?</text>
  <text x="695" y="260" font-size="13" fill="#9aa4b8" text-anchor="middle">두 고윳값의 합이다</text>

  <path d="M 640 276 L 610 322" fill="none" stroke="#888" stroke-width="2" marker-end="url(#df-arr)"/>
  <text x="556" y="304" font-size="13" font-weight="600" fill="#55c555">양수</text>
  <path d="M 750 276 L 780 322" fill="none" stroke="#888" stroke-width="2" marker-end="url(#df-arr)"/>
  <text x="790" y="304" font-size="13" font-weight="600" fill="#7777cc">음수</text>

  <rect x="480" y="330" width="180" height="66" rx="10" fill="#101820" stroke="#55c555" stroke-width="1.5"/>
  <text x="570" y="356" font-size="15" font-weight="600" fill="#55c555" text-anchor="middle">양정치</text>
  <text x="570" y="378" font-size="13" fill="#e8e8e8" text-anchor="middle">→ 국소 최소</text>

  <rect x="680" y="330" width="180" height="66" rx="10" fill="#101820" stroke="#7777cc" stroke-width="1.5"/>
  <text x="770" y="356" font-size="15" font-weight="600" fill="#7777cc" text-anchor="middle">음정치</text>
  <text x="770" y="378" font-size="13" fill="#e8e8e8" text-anchor="middle">→ 국소 최대</text>

  <rect x="70" y="330" width="230" height="66" rx="10" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="92" y="354" font-size="13" fill="#9aa4b8">3×3 부터는 두 수로 부족하다.</text>
  <text x="92" y="376" font-size="13" fill="#9aa4b8">고윳값을 실제로 구해야 한다.</text>
</svg>
