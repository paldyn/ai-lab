<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="crArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="crArr2" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">환율은 이어 붙이면 곱해진다</text>
  <text x="60" y="76" font-size="13" fill="#888">y = 2x, z = y² 를 x = 3 에서</text>

  <rect x="90" y="140" width="150" height="70" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="165" y="168" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">입력 x</text>
  <text x="165" y="190" font-size="13" fill="#9aa4b8" text-anchor="middle">x = 3</text>

  <rect x="365" y="140" width="150" height="70" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="440" y="168" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">중간값 y</text>
  <text x="440" y="190" font-size="13" fill="#9aa4b8" text-anchor="middle">y = 6</text>

  <rect x="640" y="140" width="150" height="70" rx="6" fill="#000000" stroke="#7ec8e3" stroke-width="2"/>
  <text x="715" y="168" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">출력 z</text>
  <text x="715" y="190" font-size="13" fill="#9aa4b8" text-anchor="middle">z = 36</text>

  <line x1="240" y1="175" x2="365" y2="175" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#crArr)"/>
  <text x="302" y="153" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">dy/dx = 2</text>
  <text x="302" y="200" font-size="13" fill="#888" text-anchor="middle">흔들림 ×2</text>

  <line x1="515" y1="175" x2="640" y2="175" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#crArr)"/>
  <text x="577" y="153" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">dz/dy = 12</text>
  <text x="577" y="200" font-size="13" fill="#888" text-anchor="middle">흔들림 ×12</text>

  <path d="M 165 220 L 165 268 L 715 268 L 715 226" fill="none" stroke="#7777cc" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#crArr2)"/>
  <rect x="330" y="244" width="220" height="48" rx="6" fill="#0a0a0a"/>
  <text x="440" y="274" font-size="16" font-weight="600" fill="#7777cc" text-anchor="middle">dz/dx = 12 × 2 = 24</text>

  <text x="60" y="322" font-size="13" fill="#888">중간을 거치는 두 비율을 곱하면 처음과 끝 사이의 비율이 된다 — z = 4x² 를 직접 미분해도 8x = 24다</text>
</svg>
