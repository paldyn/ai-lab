<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="back" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="530" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">증상은 걸음 4에, 어긋난 자리는 걸음 2에</text>
  <text x="60" y="72" font-size="13" fill="#888">「72시간 넘은 환불 건을 담당자별로」 요청의 트레이스</text>

  <rect x="60" y="104" width="560" height="70" rx="10" fill="#0d1117" stroke="#2a2a2a" stroke-width="1"/>
  <text x="84" y="134" font-size="13" font-weight="600" fill="#7ec8e3">걸음 1 · 계획</text>
  <text x="84" y="156" font-size="13" fill="#e8e8e8">환불 요청 조회 → 처리 시간 계산 → 담당자별 묶기</text>

  <rect x="60" y="198" width="560" height="70" rx="10" fill="#0d1117" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="228" font-size="13" font-weight="600" fill="#7ec8e3">걸음 2 · 인자 채우기</text>
  <text x="84" y="250" font-size="13" fill="#e8e8e8">search_tickets(status="환불") → 빈 배열, 성공 응답</text>

  <rect x="60" y="292" width="560" height="70" rx="10" fill="#0d1117" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="322" font-size="13" font-weight="600" fill="#7ec8e3">걸음 3 · 결과 해석</text>
  <text x="84" y="344" font-size="13" fill="#e8e8e8">0건을 「지난 분기에 환불 요청 없음」으로 기록</text>

  <rect x="60" y="386" width="560" height="70" rx="10" fill="#0d1117" stroke="#7777cc" stroke-width="1.5"/>
  <text x="84" y="416" font-size="13" font-weight="600" fill="#7ec8e3">걸음 4 · 답</text>
  <text x="84" y="438" font-size="13" fill="#e8e8e8">「72시간을 넘긴 환불 건은 없습니다」</text>

  <line x1="340" y1="174" x2="340" y2="198" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="268" x2="340" y2="292" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="362" x2="340" y2="386" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <path d="M 620 421 C 690 421 690 233 620 233" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#back)"/>

  <text x="712" y="238" font-size="13" font-weight="600" fill="#e05555">어긋난 자리</text>
  <text x="712" y="332" font-size="13" font-weight="600" fill="#e05555">굳은 자리</text>
  <text x="712" y="426" font-size="13" font-weight="600" fill="#7777cc">증상</text>

  <text x="60" y="496" font-size="13" fill="#888">걸음 4는 받은 사실대로 답했다. 고칠 곳은 걸음 2의 인자와 그것을 0건으로 읽은 걸음 3이다.</text>
</svg>
