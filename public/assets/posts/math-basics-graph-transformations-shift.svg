<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="shAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="shMove" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">−2 인데 왜 오른쪽으로 가는가</text>
  <text x="60" y="82" font-size="13" fill="#888">같은 값이 나오려면 x 가 그만큼 더 커져야 하기 때문이다</text>

  <line x1="120" y1="320" x2="530" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#shAx)"/>
  <line x1="300" y1="380" x2="300" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#shAx)"/>
  <text x="536" y="324" font-size="13" fill="#888">x</text>
  <text x="306" y="114" font-size="13" fill="#888">y</text>
  <line x1="350" y1="314" x2="350" y2="326" stroke="#888" stroke-width="1.5"/>
  <line x1="400" y1="314" x2="400" y2="326" stroke="#888" stroke-width="1.5"/>
  <line x1="450" y1="314" x2="450" y2="326" stroke="#888" stroke-width="1.5"/>
  <text x="350" y="344" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="400" y="344" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="450" y="344" font-size="12" fill="#888" text-anchor="middle">3</text>

  <polyline points="200,120 225,208 250,270 275,308 300,320 325,308 350,270 375,208 400,120" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <polyline points="300,120 325,208 350,270 375,308 400,320 425,308 450,270 475,208 500,120" fill="none" stroke="#7777cc" stroke-width="2.5"/>

  <circle cx="350" cy="270" r="5" fill="#7ec8e3"/>
  <circle cx="450" cy="270" r="5" fill="#7777cc"/>
  <line x1="358" y1="256" x2="442" y2="256" stroke="#55c555" stroke-width="2" marker-end="url(#shMove)"/>
  <rect x="346" y="226" width="108" height="20" fill="#0a0a0a"/>
  <text x="400" y="241" font-size="13" fill="#55c555" text-anchor="middle">오른쪽으로 2</text>

  <text x="140" y="176" font-size="14" fill="#7ec8e3">y = x²</text>
  <text x="362" y="104" font-size="14" fill="#7777cc">y = (x−2)²</text>

  <rect x="560" y="120" width="260" height="230" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="584" y="152" font-size="14" font-weight="600" fill="#e8e8e8">대입으로 읽으면 헷갈리지 않는다</text>
  <text x="584" y="186" font-size="13" fill="#888">원래 곡선은 x = 1 에서 값이 1이다.</text>
  <text x="584" y="212" font-size="13" fill="#888">새 곡선이 같은 1을 내놓으려면</text>
  <text x="584" y="238" font-size="13" fill="#888">괄호 안이 1이 되어야 하므로</text>
  <text x="584" y="266" font-size="16" fill="#e8e8e8">x − 2 = 1, 즉 x = 3</text>
  <text x="584" y="300" font-size="13" fill="#7ec8e3">같은 값을 얻는 자리가 뒤로 밀린다</text>
  <text x="584" y="326" font-size="13" fill="#7ec8e3">= 그래프가 오른쪽으로 간다</text>

  <rect x="60" y="386" width="760" height="44" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="414" font-size="13" fill="#e8e8e8">y = f(x) + k 는 위아래, y = f(x − a) 는 좌우. 괄호 안에 든 것은 늘 예상과 반대로 움직인다.</text>
</svg>
