<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">RRF의 k 하나가 순위를 얼마나 믿을지를 정한다</text>
  <text x="60" y="72" font-size="13" fill="#888">1위의 기여도를 1로 놓았을 때, 아래 순위가 얼마나 남는지를 그린 것이다.</text>

  <line x1="100" y1="300" x2="820" y2="300" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="100" y1="94" x2="100" y2="300" stroke="#3a4a6e" stroke-width="1"/>

  <line x1="100" y1="200" x2="820" y2="200" stroke="#222a38" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="88" y="105" font-size="12" fill="#888" text-anchor="end">1.0</text>
  <text x="88" y="205" font-size="12" fill="#888" text-anchor="end">0.5</text>
  <text x="88" y="305" font-size="12" fill="#888" text-anchor="end">0.0</text>

  <text x="100" y="324" font-size="12" fill="#888" text-anchor="middle">1위</text>
  <text x="284" y="324" font-size="12" fill="#888" text-anchor="middle">6위</text>
  <text x="468" y="324" font-size="12" fill="#888" text-anchor="middle">11위</text>
  <text x="653" y="324" font-size="12" fill="#888" text-anchor="middle">16위</text>
  <text x="800" y="324" font-size="12" fill="#888" text-anchor="middle">20위</text>

  <path d="M 100 100 L 137 117 L 174 131 L 211 143 L 247 153 L 284 162 L 321 171 L 358 178 L 395 184 L 432 190 L 468 195 L 505 200 L 542 204 L 579 208 L 616 212 L 653 215 L 689 219 L 726 221 L 763 224 L 800 227" fill="none" stroke="#e05555" stroke-width="2.5"/>
  <path d="M 100 100 L 137 103 L 174 106 L 211 109 L 247 112 L 284 115 L 321 118 L 358 121 L 395 123 L 432 126 L 468 128 L 505 131 L 542 133 L 579 135 L 616 137 L 653 139 L 689 142 L 726 144 L 763 146 L 800 148" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>

  <circle cx="800" cy="227" r="4" fill="#e05555"/>
  <circle cx="800" cy="148" r="4" fill="#7ec8e3"/>

  <rect x="140" y="214" width="280" height="72" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1"/>
  <text x="160" y="242" font-size="13" fill="#7ec8e3">k = 60 · 순위 차이를 눌러 준다</text>
  <text x="160" y="268" font-size="13" fill="#e05555">k = 10 · 상위 몇 개만 강하게 민다</text>

  <text x="60" y="360" font-size="13" fill="#e8e8e8">k를 키우면 두 검색기가 「함께 뽑았는지」가, 줄이면 「몇 위로 뽑았는지」가 중요해진다.</text>
  <text x="60" y="382" font-size="13" fill="#888">기본값 60은 출발점일 뿐이다. 검색기 하나가 확연히 정확하면 k를 줄이는 쪽이 맞는다.</text>
</svg>
