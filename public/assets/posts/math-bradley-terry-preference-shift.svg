<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="btS" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">모두에 같은 수를 더해도 데이터는 구별하지 못한다</text>
  <text x="60" y="72" font-size="14" fill="#888">확률에 들어가는 것은 차이뿐이라 세 답의 점수를 통째로 올려도 모든 쌍의 확률이 같다.</text>

  <text x="50" y="112" font-size="16" font-weight="600" fill="#7ec8e3">점수 (2, 1, 0)</text>
  <line x1="70" y1="290" x2="390" y2="290" stroke="#888" stroke-width="1.5"/>
  <rect x="100" y="182" width="60" height="108" fill="#7ec8e3" fill-opacity="0.25" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="200" y="218" width="60" height="72" fill="#7ec8e3" fill-opacity="0.25" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="300" y="254" width="60" height="36" fill="#7ec8e3" fill-opacity="0.25" stroke="#7ec8e3" stroke-width="2"/>
  <text x="120" y="172" font-size="14" fill="#e8e8e8">2</text>
  <text x="220" y="208" font-size="14" fill="#e8e8e8">1</text>
  <text x="320" y="244" font-size="14" fill="#e8e8e8">0</text>
  <text x="116" y="314" font-size="14" fill="#888">답 A</text>
  <text x="216" y="314" font-size="14" fill="#888">답 B</text>
  <text x="316" y="314" font-size="14" fill="#888">답 C</text>

  <line x1="404" y1="236" x2="466" y2="236" stroke="#7777cc" stroke-width="2.5" marker-end="url(#btS)"/>
  <text x="392" y="212" font-size="13" fill="#7777cc">셋 다 +3</text>

  <text x="490" y="112" font-size="16" font-weight="600" fill="#7777cc">점수 (5, 4, 3)</text>
  <line x1="490" y1="290" x2="810" y2="290" stroke="#888" stroke-width="1.5"/>
  <rect x="520" y="110" width="60" height="180" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="2"/>
  <rect x="620" y="146" width="60" height="144" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="2"/>
  <rect x="720" y="182" width="60" height="108" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="2"/>
  <text x="540" y="136" font-size="14" fill="#e8e8e8">5</text>
  <text x="640" y="172" font-size="14" fill="#e8e8e8">4</text>
  <text x="740" y="208" font-size="14" fill="#e8e8e8">3</text>
  <text x="536" y="314" font-size="14" fill="#888">답 A</text>
  <text x="636" y="314" font-size="14" fill="#888">답 B</text>
  <text x="736" y="314" font-size="14" fill="#888">답 C</text>

  <rect x="60" y="340" width="760" height="102" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="370" font-size="14" font-weight="600" fill="#e8e8e8">양쪽에서 나오는 확률이 완전히 같다</text>
  <text x="84" y="398" font-size="14" fill="#55c555">P(A ≻ B) = σ(1) = 0.731</text>
  <text x="320" y="398" font-size="14" fill="#55c555">P(A ≻ C) = σ(2) = 0.881</text>
  <text x="556" y="398" font-size="14" fill="#55c555">P(B ≻ C) = σ(1) = 0.731</text>
  <text x="84" y="424" font-size="13" fill="#888">가능도가 같으므로 최적해가 하나가 아니라 한 줄로 이어져 있다.</text>
</svg>
