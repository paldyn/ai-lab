  <text x="536" y="478" font-size="13" fill="#55c555">메모리와 지연이 실제로 줄어든다.</text>
  <text x="536" y="504" font-size="12" fill="#888">대신 지울 단위가 굵어서 정확도 손실이 더 크다.</text>

  <text x="62" y="548" font-size="12" fill="#888">희소도가 같아도 배포에서 체감되는 것은 오른쪽뿐이다. 어느 쪽을 고를지는 실행 환경이 정한다.</text>
