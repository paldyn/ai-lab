  <text x="280" y="176" font-size="13" fill="#9aa4b8">행렬의 모양은 그대로 8×8이므로 메모리에 올라가는</text>
  <text x="280" y="198" font-size="13" fill="#9aa4b8">크기도, 곱셈 커널이 도는 횟수도 그대로다.</text>
