<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="320" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">절댓값은 0에서 떨어진 거리다</text>
  <text x="60" y="82" font-size="13" fill="#888">방향은 묻지 않고 거리만 본다. 그래서 음수가 될 수 없다</text>

  <line x1="80" y1="180" x2="800" y2="180" stroke="#888" stroke-width="1.5"/>
  <line x1="180" y1="172" x2="180" y2="188" stroke="#888" stroke-width="1"/>
  <line x1="260" y1="172" x2="260" y2="188" stroke="#888" stroke-width="1"/>
  <line x1="340" y1="172" x2="340" y2="188" stroke="#888" stroke-width="1"/>
  <line x1="420" y1="168" x2="420" y2="192" stroke="#e8e8e8" stroke-width="2"/>
  <line x1="500" y1="172" x2="500" y2="188" stroke="#888" stroke-width="1"/>
  <line x1="580" y1="172" x2="580" y2="188" stroke="#888" stroke-width="1"/>
  <line x1="660" y1="172" x2="660" y2="188" stroke="#888" stroke-width="1"/>
  <text x="180" y="210" font-size="13" fill="#888" text-anchor="middle">−3</text>
  <text x="260" y="210" font-size="13" fill="#888" text-anchor="middle">−2</text>
  <text x="340" y="210" font-size="13" fill="#888" text-anchor="middle">−1</text>
  <text x="420" y="212" font-size="14" font-weight="700" fill="#e8e8e8" text-anchor="middle">0</text>
  <text x="500" y="210" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="580" y="210" font-size="13" fill="#888" text-anchor="middle">2</text>
  <text x="660" y="210" font-size="13" fill="#888" text-anchor="middle">3</text>

  <circle cx="180" cy="180" r="5" fill="#e05555"/>
  <circle cx="660" cy="180" r="5" fill="#7ec8e3"/>

  <path d="M 180 148 L 420 148" fill="none" stroke="#e05555" stroke-width="2"/>
  <line x1="180" y1="142" x2="180" y2="154" stroke="#e05555" stroke-width="2"/>
  <line x1="420" y1="142" x2="420" y2="154" stroke="#e05555" stroke-width="2"/>
  <text x="300" y="134" font-size="15" font-weight="600" fill="#e05555" text-anchor="middle">|−3| = 3</text>

  <path d="M 420 148 L 660 148" fill="none" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="660" y1="142" x2="660" y2="154" stroke="#7ec8e3" stroke-width="2"/>
  <text x="540" y="134" font-size="15" font-weight="600" fill="#7ec8e3" text-anchor="middle">|3| = 3</text>

  <path d="M 180 250 L 500 250" fill="none" stroke="#55c555" stroke-width="2"/>
  <line x1="180" y1="244" x2="180" y2="256" stroke="#55c555" stroke-width="2"/>
  <line x1="500" y1="244" x2="500" y2="256" stroke="#55c555" stroke-width="2"/>
  <text x="340" y="274" font-size="15" font-weight="600" fill="#55c555" text-anchor="middle">|−3 − 1| = 4 &#160;— 두 수 사이의 거리</text>

  <text x="60" y="300" font-size="13" fill="#7777cc">어느 쪽에서 재도 같으므로 |1 − (−3)| 로 적어도 값은 4다</text>
</svg>
