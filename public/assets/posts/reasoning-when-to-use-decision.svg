<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <defs>
    <marker id="wtArrY" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="wtArrN" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="520" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">추론 모델을 켤지 정하는 세 가지 질문</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">하나라도 아니오가 나오면 더 싼 답이 있다. 셋을 모두 통과할 때만 사고 비용이 값을 한다</text>

  <rect x="60" y="100" width="320" height="44" rx="6" fill="#12121a" stroke="#2a2a35" stroke-width="1"/>
  <text x="220" y="126" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">이 작업에 추론 모델이 필요한가</text>
  <line x1="220" y1="144" x2="220" y2="166" stroke="#7ec8e3" stroke-width="2" marker-end="url(#wtArrY)"/>

  <rect x="60" y="166" width="320" height="48" rx="6" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="220" y="194" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">정답을 기계적으로 검증할 수 있나</text>
  <line x1="380" y1="190" x2="500" y2="190" stroke="#888" stroke-width="2" marker-end="url(#wtArrN)"/>
  <text x="440" y="176" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">아니오</text>
  <line x1="220" y1="214" x2="220" y2="246" stroke="#7ec8e3" stroke-width="2" marker-end="url(#wtArrY)"/>
  <text x="234" y="234" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7ec8e3">예</text>

  <rect x="500" y="166" width="320" height="48" rx="6" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="518" y="186" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">일반 모델 + 루브릭 평가</text>
  <text x="518" y="204" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">정답이 없으면 검증기도 못 만든다</text>

  <rect x="60" y="246" width="320" height="48" rx="6" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="220" y="274" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">한 번에 못 맞히는 비율이 높나</text>
  <line x1="380" y1="270" x2="500" y2="270" stroke="#888" stroke-width="2" marker-end="url(#wtArrN)"/>
  <text x="440" y="256" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">아니오</text>
  <line x1="220" y1="294" x2="220" y2="326" stroke="#7ec8e3" stroke-width="2" marker-end="url(#wtArrY)"/>
  <text x="234" y="314" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7ec8e3">예</text>

  <rect x="500" y="246" width="320" height="48" rx="6" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="518" y="266" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">일반 모델 그대로</text>
  <text x="518" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">대부분 맞히면 사고 비용이 낭비다</text>

  <rect x="60" y="326" width="320" height="48" rx="6" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="220" y="354" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">지연 5초 이상을 감당할 수 있나</text>
  <line x1="380" y1="350" x2="500" y2="350" stroke="#888" stroke-width="2" marker-end="url(#wtArrN)"/>
  <text x="440" y="336" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">아니오</text>
  <line x1="220" y1="374" x2="220" y2="406" stroke="#7ec8e3" stroke-width="2" marker-end="url(#wtArrY)"/>
  <text x="234" y="394" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7ec8e3">예</text>

  <rect x="500" y="326" width="320" height="48" rx="6" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="518" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">일반 모델 + 병렬 샘플링</text>
  <text x="518" y="364" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">지연은 그대로 두고 비용만 N배</text>

  <rect x="60" y="406" width="320" height="58" rx="6" fill="#12121a" stroke="#55c555" stroke-width="2"/>
  <text x="220" y="430" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">추론 모델 · 예산 등급 분리</text>
  <text x="220" y="450" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">쉬운 요청은 사고를 끄고 흘려보낸다</text>

  <text x="50" y="496" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">세 질문은 모두 측정 가능한 값이다. 감이 아니라 정답률 로그와 지연 예산으로 답해야 한다.</text>
</svg>
