  <text x="340" y="344" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">+6개월</text>
  <text x="570" y="344" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">+12개월</text>
  <text x="795" y="344" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">+18개월</text>

  <text x="50" y="384" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">공개 점수는 시간이 지날수록 능력보다 노출량을 반영한다. 도입 판단은 직접 만든 문항으로 다시 재야 한다.</text>
