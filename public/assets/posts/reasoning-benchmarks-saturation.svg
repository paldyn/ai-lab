  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">추론 벤치마크에는 수명이 있다</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">공개된 순간부터 유출이 시작되고, 점수가 천장에 붙으면 모델을 가르는 힘을 잃는다</text>

  <text x="50" y="102" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">최고 정확도 (%)</text>

