  <text x="96" y="219" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">50</text>
  <text x="96" y="271" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">25</text>
  <text x="96" y="324" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">0</text>

  <path d="M 110 299 C 180 296, 270 250, 340 215 C 410 180, 500 143, 570 134 C 650 124, 720 117, 800 115" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>

  <circle cx="340" cy="215" r="5" fill="#0a0a0a" stroke="#e05555" stroke-width="2"/>
  <line x1="340" y1="222" x2="340" y2="258" stroke="#888" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="348" y="268" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">문항이 학습 데이터로 새어 들어간다</text>
  <text x="348" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">풀이 블로그 · 리포지터리 · 재배포 데이터셋</text>

  <circle cx="600" cy="128" r="5" fill="#0a0a0a" stroke="#e05555" stroke-width="2"/>
  <line x1="600" y1="135" x2="600" y2="182" stroke="#888" stroke-width="1.5" stroke-dasharray="4,4"/>
