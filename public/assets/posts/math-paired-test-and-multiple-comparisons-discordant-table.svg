<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
    <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
  </marker>
</defs>
<rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>
<text x="440.0" y="48.0" font-size="22" fill="#e8e8e8" text-anchor="middle" font-weight="700">같은 500문항을 두 모델의 결과로 나눈 네 칸 표</text>
<text x="440.0" y="76.0" font-size="13" fill="#888" text-anchor="middle">정답률 82.0%와 84.0% 뒤에 숨은 문항별 결과</text>
<text x="285.0" y="134.0" font-size="16" fill="#e8e8e8" text-anchor="middle" font-weight="600">B 정답</text>
<text x="455.0" y="134.0" font-size="16" fill="#e8e8e8" text-anchor="middle" font-weight="600">B 오답</text>
<text x="182.0" y="208.5" font-size="16" fill="#e8e8e8" text-anchor="end" font-weight="600">A 정답</text>
<text x="182.0" y="313.5" font-size="16" fill="#e8e8e8" text-anchor="end" font-weight="600">A 오답</text>
<rect x="200" y="150" width="170" height="105" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
<text x="285.0" y="198.0" font-size="30" fill="#e8e8e8" text-anchor="middle" font-weight="700">405</text>
<text x="285.0" y="228.0" font-size="14" fill="#aaa" text-anchor="middle">둘 다 정답</text>
<rect x="370" y="150" width="170" height="105" fill="#1c1c33" stroke="#7777cc" stroke-width="2"/>
<text x="455.0" y="198.0" font-size="30" fill="#7777cc" text-anchor="middle" font-weight="700">5</text>
<text x="455.0" y="228.0" font-size="14" fill="#aaa" text-anchor="middle">A만 정답</text>
<rect x="200" y="255" width="170" height="105" fill="#10262e" stroke="#7ec8e3" stroke-width="2"/>
<text x="285.0" y="303.0" font-size="30" fill="#7ec8e3" text-anchor="middle" font-weight="700">15</text>
<text x="285.0" y="333.0" font-size="14" fill="#aaa" text-anchor="middle">B만 정답</text>
<rect x="370" y="255" width="170" height="105" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
<text x="455.0" y="303.0" font-size="30" fill="#e8e8e8" text-anchor="middle" font-weight="700">75</text>
<text x="455.0" y="333.0" font-size="14" fill="#aaa" text-anchor="middle">둘 다 오답</text>
<text x="554.0" y="208.5" font-size="14" fill="#e8e8e8" text-anchor="start">410 (82%)</text>
<text x="554.0" y="313.5" font-size="14" fill="#888" text-anchor="start">90</text>
<text x="285.0" y="388.0" font-size="14" fill="#e8e8e8" text-anchor="middle">420 (84%)</text>
<text x="455.0" y="388.0" font-size="14" fill="#888" text-anchor="middle">80</text>
<rect x="640" y="150" width="190" height="210" rx="10" fill="#111" stroke="#333"/>
<text x="735.0" y="188.0" font-size="16" fill="#e8e8e8" text-anchor="middle" font-weight="600">엇갈린 문항</text>
<text x="735.0" y="226.0" font-size="18" fill="#7ec8e3" text-anchor="middle" font-weight="700">15 + 5 = 20</text>
<text x="735.0" y="262.0" font-size="14" fill="#aaa" text-anchor="middle">정답률의 차</text>
<text x="735.0" y="290.0" font-size="16" fill="#e8e8e8" text-anchor="middle">(15 − 5) / 500</text>
<text x="735.0" y="320.0" font-size="16" fill="#e8e8e8" text-anchor="middle" font-weight="700">= 2.0%p</text>
<text x="440.0" y="440.0" font-size="13" fill="#888" text-anchor="middle">대각선 480문항은 두 모델을 가르지 못하고, 차이는 엇갈린 20문항에서만 생긴다</text>
</svg>
