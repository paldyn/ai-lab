<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<defs><marker id="arr0" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/></marker><marker id="arr1" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker></defs>
<rect x="0" y="0" width="880" height="430" rx="12" fill="#0a0a0a"/>
<text x="440" y="44" text-anchor="middle" font-size="22" fill="#e8e8e8" font-weight="700">커널 · RKHS · 특징 사상</text>
<rect x="70" y="90" width="260" height="96" rx="10" fill="#111a22" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="200.0" y="122.0" text-anchor="middle" font-size="16" fill="#e8e8e8" font-weight="600">양반정치 커널 k</text>
<text x="200.0" y="146.0" text-anchor="middle" font-size="13" fill="#aaa">모든 그람 행렬이 PSD</text>
<text x="200.0" y="166.0" text-anchor="middle" font-size="13" fill="#aaa">k(x, x′) 는 수 하나</text>
<rect x="550" y="90" width="260" height="96" rx="10" fill="#111a22" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="680.0" y="122.0" text-anchor="middle" font-size="16" fill="#e8e8e8" font-weight="600">RKHS  H_k</text>
<text x="680.0" y="146.0" text-anchor="middle" font-size="13" fill="#aaa">평가 f ↦ f(x) 가 유계</text>
<text x="680.0" y="166.0" text-anchor="middle" font-size="13" fill="#aaa">f(x) = ⟨f, k(x,·)⟩</text>
<rect x="310" y="290" width="260" height="96" rx="10" fill="#111a22" stroke="#7777cc" stroke-width="1.5"/>
<text x="440.0" y="322.0" text-anchor="middle" font-size="16" fill="#e8e8e8" font-weight="600">특징 사상 φ : X → F</text>
<text x="440.0" y="346.0" text-anchor="middle" font-size="13" fill="#aaa">k(x, x′) = ⟨φ(x), φ(x′)⟩</text>
<text x="440.0" y="366.0" text-anchor="middle" font-size="13" fill="#aaa">여러 개가 같은 k 를 준다</text>
<line x1="330" y1="122" x2="550" y2="122" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr1)"/>
<text x="440.0" y="110.0" text-anchor="middle" font-size="13" fill="#7ec8e3">무어–아론자인: 짓기</text>
<line x1="550" y1="156" x2="330" y2="156" stroke="#888" stroke-width="2" marker-end="url(#arr0)"/>
<text x="440.0" y="178.0" text-anchor="middle" font-size="13" fill="#aaa">k(x, x′) = ⟨k(x,·), k(x′,·)⟩</text>
<line x1="370" y1="290" x2="250" y2="186" stroke="#7777cc" stroke-width="2" marker-end="url(#arr0)"/>
<text x="196.0" y="248.0" text-anchor="middle" font-size="13" fill="#aaa">내적을 계산하면 커널</text>
<line x1="510" y1="290" x2="630" y2="186" stroke="#7777cc" stroke-width="2" marker-end="url(#arr0)"/>
<text x="686.0" y="236.0" text-anchor="middle" font-size="13" fill="#aaa">f(x) = ⟨w, φ(x)⟩</text>
<text x="686.0" y="256.0" text-anchor="middle" font-size="13" fill="#aaa">‖f‖ = 가장 짧은 ‖w‖</text>
<text x="440.0" y="414.0" text-anchor="middle" font-size="13" fill="#888">커널과 RKHS 는 일대일, 특징 사상은 그 둘을 보는 좌표계 하나</text>
</svg>
