<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">r 은 감이 아니라 이 곡선에서 읽는다</text>
  <text x="60" y="70" font-size="13" fill="#888">ΔW의 특잇값(막대)과 누적 에너지(보라 곡선). 목표 비율을 그어 만나는 자리가 r 이다.</text>

  <line x1="96" y1="330" x2="800" y2="330" stroke="#888" stroke-width="1.5"/>
  <line x1="96" y1="352" x2="96" y2="120" stroke="#888" stroke-width="1.5"/>

  <line x1="96" y1="130" x2="806" y2="130" stroke="#444" stroke-width="1"/>
  <line x1="96" y1="230" x2="806" y2="230" stroke="#444" stroke-width="1"/>

  <text x="814" y="134" font-size="13" fill="#7777cc">100%</text>
  <text x="814" y="234" font-size="13" fill="#7777cc">50%</text>

  <rect x="110" y="130.0" width="32" height="200.0" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="162" y="185.9" width="32" height="144.1" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="214" y="226.1" width="32" height="103.9" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="266" y="255.1" width="32" height="74.9" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="318" y="276.0" width="32" height="54.0" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="370" y="291.0" width="32" height="39.0" fill="#666666" fill-opacity="0.7" stroke="#666666" stroke-width="1"/>
  <rect x="422" y="301.8" width="32" height="28.2" fill="#666666" fill-opacity="0.7" stroke="#666666" stroke-width="1"/>
  <rect x="474" y="309.6" width="32" height="20.4" fill="#666666" fill-opacity="0.7" stroke="#666666" stroke-width="1"/>
  <rect x="526" y="315.2" width="32" height="14.8" fill="#666666" fill-opacity="0.7" stroke="#666666" stroke-width="1"/>
  <rect x="578" y="319.2" width="32" height="10.8" fill="#666666" fill-opacity="0.7" stroke="#666666" stroke-width="1"/>
  <rect x="630" y="322.1" width="32" height="7.9" fill="#666666" fill-opacity="0.7" stroke="#666666" stroke-width="1"/>
  <rect x="682" y="324.2" width="32" height="5.8" fill="#666666" fill-opacity="0.7" stroke="#666666" stroke-width="1"/>

  <polyline fill="none" stroke="#7777cc" stroke-width="2.5"
            points="126,234.0 178,184.2 230,158.3 282,144.8 334,137.8 386,134.1 438,132.2 490,131.2 542,130.7 594,130.4 646,130.3 698,130.2"/>

  <line x1="96" y1="150" x2="290" y2="150" stroke="#55c555" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="282" y1="150" x2="282" y2="344" stroke="#55c555" stroke-width="2" stroke-dasharray="5,3"/>

  <line x1="96" y1="140" x2="342" y2="140" stroke="#7ec8e3" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="334" y1="140" x2="334" y2="344" stroke="#7ec8e3" stroke-width="2" stroke-dasharray="5,3"/>

  <line x1="96" y1="132" x2="498" y2="132" stroke="#e05555" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="490" y1="132" x2="490" y2="344" stroke="#e05555" stroke-width="2" stroke-dasharray="5,3"/>

  <rect x="552" y="176" width="248" height="118" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="578" y="202" font-size="14" font-weight="600" fill="#e8e8e8">목표 에너지 → r</text>
  <line x1="578" y1="226" x2="608" y2="226" stroke="#55c555" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="620" y="231" font-size="13" fill="#55c555">90%  →  r = 4</text>
  <line x1="578" y1="252" x2="608" y2="252" stroke="#7ec8e3" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="620" y="257" font-size="13" fill="#7ec8e3">95%  →  r = 5</text>
  <line x1="578" y1="278" x2="608" y2="278" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="620" y="283" font-size="13" fill="#e05555">99%  →  r = 8</text>

  <text x="126" y="366" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="282" y="366" font-size="13" fill="#888" text-anchor="middle">4</text>
  <text x="334" y="366" font-size="13" fill="#888" text-anchor="middle">5</text>
  <text x="490" y="366" font-size="13" fill="#888" text-anchor="middle">8</text>
  <text x="698" y="366" font-size="13" fill="#888" text-anchor="middle">12</text>

  <rect x="60" y="386" width="760" height="42" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="82" y="408" font-size="14" fill="#e8e8e8">90%에서 95%로 가는 데는 축 하나면 되는데 99%까지는 셋이 더 든다. 이 「올라가는 비용」이</text>
  <text x="82" y="424" font-size="14" fill="#e8e8e8">급해지는 자리가 r 을 정하는 지점이고, 곡선이 완만하면 그 층은 저계수와 맞지 않는다.</text>
</svg>
