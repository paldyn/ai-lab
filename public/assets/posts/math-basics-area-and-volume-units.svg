<svg xmlns="http://www.w3.org/2000/svg" width="880" height="476" viewBox="0 0 880 476" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="476" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="unArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">1 m² 는 100 cm² 가 아니라 10,000 cm² 다</text>
  <text x="60" y="82" font-size="13" fill="#888">길이가 100배가 되면 넓이는 100 × 100 배가 된다</text>

  <rect x="115" y="115" width="250" height="250" fill="#7ec8e3" fill-opacity="0.08" stroke="#7ec8e3" stroke-width="2.5"/>
  <rect x="115" y="340" width="25" height="25" fill="#7ec8e3" fill-opacity="0.35" stroke="#7ec8e3" stroke-width="1.5"/>

  <line x1="140" y1="115" x2="140" y2="365" stroke="#444" stroke-width="1"/>
  <line x1="165" y1="115" x2="165" y2="365" stroke="#444" stroke-width="1"/>
  <line x1="190" y1="115" x2="190" y2="365" stroke="#444" stroke-width="1"/>
  <line x1="215" y1="115" x2="215" y2="365" stroke="#444" stroke-width="1"/>
  <line x1="240" y1="115" x2="240" y2="365" stroke="#444" stroke-width="1"/>
  <line x1="265" y1="115" x2="265" y2="365" stroke="#444" stroke-width="1"/>
  <line x1="290" y1="115" x2="290" y2="365" stroke="#444" stroke-width="1"/>
  <line x1="315" y1="115" x2="315" y2="365" stroke="#444" stroke-width="1"/>
  <line x1="340" y1="115" x2="340" y2="365" stroke="#444" stroke-width="1"/>
  <line x1="115" y1="140" x2="365" y2="140" stroke="#444" stroke-width="1"/>
  <line x1="115" y1="165" x2="365" y2="165" stroke="#444" stroke-width="1"/>
  <line x1="115" y1="190" x2="365" y2="190" stroke="#444" stroke-width="1"/>
  <line x1="115" y1="215" x2="365" y2="215" stroke="#444" stroke-width="1"/>
  <line x1="115" y1="240" x2="365" y2="240" stroke="#444" stroke-width="1"/>
  <line x1="115" y1="265" x2="365" y2="265" stroke="#444" stroke-width="1"/>
  <line x1="115" y1="290" x2="365" y2="290" stroke="#444" stroke-width="1"/>
  <line x1="115" y1="315" x2="365" y2="315" stroke="#444" stroke-width="1"/>
  <line x1="115" y1="340" x2="365" y2="340" stroke="#444" stroke-width="1"/>

  <line x1="92" y1="115" x2="92" y2="365" stroke="#888" stroke-width="1.5" marker-end="url(#unArr)"/>
  <text x="76" y="245" font-size="13" fill="#888" text-anchor="end">1 m</text>
  <line x1="115" y1="392" x2="365" y2="392" stroke="#888" stroke-width="1.5" marker-end="url(#unArr)"/>
  <text x="240" y="414" font-size="13" fill="#888" text-anchor="middle">1 m = 100 cm</text>

  <rect x="430" y="130" width="390" height="90" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="454" y="156" font-size="14" font-weight="600" fill="#e8e8e8">한 변이 100배가 되면</text>
  <text x="454" y="180" font-size="13" fill="#888">가로로 100칸, 세로로도 100칸이 들어간다</text>
  <text x="454" y="204" font-size="14" fill="#7ec8e3">1 m² = 100 × 100 = 10,000 cm²</text>

  <rect x="430" y="240" width="390" height="90" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="454" y="266" font-size="14" font-weight="600" fill="#e8e8e8">부피는 세 방향 모두 100배다</text>
  <text x="454" y="290" font-size="13" fill="#888">가로 100 × 세로 100 × 높이 100</text>
  <text x="454" y="314" font-size="14" fill="#7ec8e3">1 m³ = 1,000,000 cm³</text>

  <rect x="430" y="350" width="390" height="64" rx="6" fill="#101010" stroke="#7777cc" stroke-width="1"/>
  <text x="454" y="375" font-size="13" font-weight="600" fill="#e8e8e8">칠한 칸 하나가 10 cm × 10 cm = 100 cm²</text>
  <text x="454" y="397" font-size="13" fill="#888">그런 칸이 가로 10 세로 10, 모두 100개다</text>
</svg>
