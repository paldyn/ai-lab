<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
<rect width="880" height="420" rx="12" fill="#0a0a0a"/>
<defs><marker id="ar" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/></marker><marker id="arg" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/></marker></defs>
<text x="440" y="42" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">같은 그람 행렬에 이르는 두 갈래 길</text>
<rect x="60" y="90" width="180" height="72" rx="8" fill="#111820" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="150" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">원본 벡터</text>
<text x="150" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">n개 × d차원</text>
<rect x="360" y="90" width="180" height="72" rx="8" fill="#111820" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="450" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">특징 벡터 φ(x)</text>
<text x="450" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">n개 × D차원 (D는 거대)</text>
<rect x="660" y="90" width="160" height="72" rx="8" fill="#111820" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="740" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">그람 행렬 G</text>
<text x="740" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">n × n</text>
<line x1="240" y1="126" x2="360" y2="126" stroke="#7777cc" stroke-width="2" marker-end="url(#ar)"/>
<text x="300" y="112" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">사상 φ</text>
<line x1="540" y1="126" x2="660" y2="126" stroke="#7777cc" stroke-width="2" marker-end="url(#ar)"/>
<text x="600" y="112" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">내적</text>
<path d="M 150 162 L 150 310 L 640 310 L 640 172" fill="none" stroke="#55c555" stroke-width="2.5" marker-end="url(#arg)"/>
<text x="395" y="272" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">커널 k(x, y) 한 번 — φ를 만들지 않는다</text>
<rect x="200" y="332" width="480" height="60" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="440" y="356" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">G[i][j] = k(x_i, x_j) = &#966;(x_i) &#183; &#966;(x_j)</text>
<text x="440" y="378" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8">두 길의 결과는 같은 n × n 행렬이다</text>
</svg>