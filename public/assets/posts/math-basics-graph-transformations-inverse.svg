<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="580" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="invAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">역함수의 그래프는 y = x 에 비친 모습이다</text>
  <text x="60" y="82" font-size="13" fill="#888">점 (4, 3) 이 (3, 4) 로 옮겨 간다 — 두 좌표를 맞바꾼 것이다</text>

  <line x1="140" y1="290" x2="760" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#invAx)"/>
  <line x1="440" y1="460" x2="440" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#invAx)"/>
  <text x="766" y="294" font-size="13" fill="#888">x</text>
  <text x="446" y="134" font-size="13" fill="#888">y</text>

  <line x1="280" y1="450" x2="600" y2="130" stroke="#888" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="610" y="134" font-size="14" fill="#888">y = x</text>

  <line x1="280" y1="330" x2="600" y2="170" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="146" y="326" font-size="14" fill="#7ec8e3">y = x/2 + 1</text>

  <line x1="400" y1="450" x2="560" y2="130" stroke="#7777cc" stroke-width="2.5"/>
  <text x="300" y="472" font-size="14" fill="#7777cc">y = 2x − 2</text>

  <circle cx="600" cy="170" r="5" fill="#7ec8e3"/>
  <text x="614" y="192" font-size="13" fill="#7ec8e3">(4, 3)</text>
  <circle cx="560" cy="130" r="5" fill="#7777cc"/>
  <text x="472" y="122" font-size="13" fill="#7777cc">(3, 4)</text>

  <rect x="60" y="496" width="760" height="66" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="524" font-size="13" font-weight="600" fill="#e8e8e8">구하는 절차는 두 줄이다 — x 에 대해 푼 뒤 문자를 맞바꾼다</text>
  <text x="84" y="546" font-size="13" fill="#888">y = x/2 + 1  →  x = 2y − 2  →  문자를 맞바꾸어  y = 2x − 2</text>
</svg>
