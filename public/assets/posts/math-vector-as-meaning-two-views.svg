<svg xmlns="http://www.w3.org/2000/svg" width="880" height="558" viewBox="0 0 880 558" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="tvblue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect width="880" height="558" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">벡터를 보는 두 관점</text>
  <text x="60" y="82" font-size="13" fill="#888">기저를 고정하면 화살표 하나와 숫자 목록 하나가 정확히 대응한다</text>

  <line x1="440" y1="102" x2="440" y2="404" stroke="#333" stroke-width="1"/>

  <text x="60" y="126" font-size="16" font-weight="600" fill="#e8e8e8">① 화살표로 보기</text>
  <text x="470" y="126" font-size="16" font-weight="600" fill="#e8e8e8">② 숫자로 보기</text>

  <line x1="100" y1="360" x2="410" y2="360" stroke="#888" stroke-width="1.5"/>
  <line x1="130" y1="390" x2="130" y2="170" stroke="#888" stroke-width="1.5"/>
  <text x="418" y="365" font-size="13" fill="#888">x</text>
  <text x="124" y="162" font-size="13" fill="#888" text-anchor="end">y</text>

  <line x1="190" y1="356" x2="190" y2="364" stroke="#444" stroke-width="1"/>
  <line x1="250" y1="356" x2="250" y2="364" stroke="#444" stroke-width="1"/>
  <line x1="310" y1="356" x2="310" y2="364" stroke="#444" stroke-width="1"/>
  <line x1="126" y1="300" x2="134" y2="300" stroke="#444" stroke-width="1"/>
  <line x1="126" y1="240" x2="134" y2="240" stroke="#444" stroke-width="1"/>

  <path d="M 310 240 L 310 360" stroke="#444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 310 240 L 130 240" stroke="#444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

  <line x1="130" y1="360" x2="310" y2="240" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#tvblue)"/>
  <text x="326" y="228" font-size="16" font-weight="700" fill="#7ec8e3">v</text>

  <text x="310" y="384" font-size="13" fill="#888" text-anchor="middle">3</text>
  <text x="118" y="245" font-size="13" fill="#888" text-anchor="end">2</text>

  <text x="524" y="252" font-size="18" fill="#e8e8e8" text-anchor="end">v =</text>
  <path d="M 552 196 L 542 196 L 542 288 L 552 288" stroke="#7ec8e3" stroke-width="2" fill="none"/>
  <path d="M 618 196 L 628 196 L 628 288 L 618 288" stroke="#7ec8e3" stroke-width="2" fill="none"/>
  <text x="585" y="230" font-size="18" fill="#ffffff" text-anchor="middle">3</text>
  <text x="585" y="270" font-size="18" fill="#ffffff" text-anchor="middle">2</text>

  <text x="470" y="334" font-size="13" fill="#888">축 e1, e2 를 정하는 순간</text>
  <text x="470" y="356" font-size="13" fill="#888">화살표 하나가 숫자 두 개가 된다</text>

  <rect x="60" y="430" width="760" height="68" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="456" font-size="13" font-weight="600" fill="#e8e8e8">두 관점은 같은 대상을 다르게 적은 것이다</text>
  <text x="84" y="478" font-size="13" fill="#888">임베딩의 숫자 768개는 768차원 공간의 화살표 하나다 — 그릴 수 없을 뿐 규칙은 같다</text>
</svg>
