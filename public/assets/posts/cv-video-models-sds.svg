<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <defs>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">SDS 최적화 한 바퀴</text>
  <text x="440" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">3D 데이터 없이 2D 확산 모델을 심판으로 쓴다</text>

  <!-- row 1 -->
  <rect x="80" y="110" width="200" height="84" rx="8" fill="#0d1b24" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="180" y="138" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">① 랜덤 시점 렌더</text>
  <text x="180" y="157" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">3D 표현을 한 각도에서</text>
  <text x="180" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">이미지 x로 그린다</text>

  <line x1="280" y1="152" x2="340" y2="152" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="340" y="110" width="200" height="84" rx="8" fill="#0d1b24" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="138" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">② 노이즈 섞기</text>
  <text x="440" y="157" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">t는 50~950에서 뽑는다</text>
  <text x="440" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">양 끝 타임스텝은 뺀다</text>

  <line x1="540" y1="152" x2="600" y2="152" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="600" y="110" width="200" height="84" rx="8" fill="#2a1a0a" stroke="#ce9178" stroke-width="1.5"/>
  <text x="700" y="138" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#ce9178" text-anchor="middle">③ 확산 모델에 묻기</text>
  <text x="700" y="157" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">조건부·무조건부 두 번</text>
  <text x="700" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">CFG 100으로 증폭</text>

  <line x1="700" y1="194" x2="700" y2="246" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- row 2 -->
  <rect x="600" y="246" width="200" height="84" rx="8" fill="#0d1b24" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="700" y="274" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">④ 방향 계산</text>
  <text x="700" y="293" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">예측 노이즈 − 실제 노이즈</text>
  <text x="700" y="312" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">상수로 떼어 놓는다</text>

  <line x1="600" y1="288" x2="540" y2="288" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="340" y="246" width="200" height="84" rx="8" fill="#0d2410" stroke="#55c555" stroke-width="1.5"/>
  <text x="440" y="274" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">⑤ 3D 파라미터 갱신</text>
  <text x="440" y="293" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">대리 손실을 미분한다</text>
  <text x="440" y="312" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">심판은 그대로 둔다</text>

  <path d="M 340 288 L 180 288 L 180 194" fill="none" stroke="#55c555" stroke-width="2"
        stroke-dasharray="4,4" marker-end="url(#arrG)"/>
  <text x="250" y="316" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">시점을 바꿔 수천 번</text>

  <text x="440" y="370" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">확산 모델에는 기울기가 흐르지 않는다 — 배우는 것은 3D 표현뿐이다</text>
</svg>
