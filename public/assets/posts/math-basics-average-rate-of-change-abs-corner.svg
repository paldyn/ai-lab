<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>
  <text x="60" y="54" font-size="22" font-weight="700" fill="#e8e8e8">꺾인 자리에서는 양쪽이 서로 다른 값에 붙는다</text>
  <text x="60" y="80" font-size="13" fill="#888">y = |x| 를 원점에서 좁혀 본 것 — 오른쪽에서 오면 1, 왼쪽에서 오면 −1</text>
  <line x1="240" y1="300" x2="700" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="440" y1="110" x2="440" y2="330" stroke="#888" stroke-width="1.5"/>
  <text x="708" y="305" font-size="13" fill="#888">x</text>
  <text x="450" y="118" font-size="13" fill="#888">y</text>
  <line x1="440" y1="300" x2="608.0" y2="132.0" stroke="#55c555" stroke-width="2.5"/>
  <line x1="272.0" y1="132.0" x2="440" y2="300" stroke="#e05555" stroke-width="2.5"/>
  <line x1="440" y1="300" x2="545.0" y2="300" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="545.0" y1="300" x2="545.0" y2="195.0" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="492.5" y="320" font-size="13" fill="#55c555" text-anchor="middle">가로 h</text>
  <text x="555.0" y="247.5" font-size="13" fill="#55c555">세로 h</text>
  <line x1="440" y1="300" x2="335.0" y2="300" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="335.0" y1="300" x2="335.0" y2="195.0" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="387.5" y="320" font-size="13" fill="#e05555" text-anchor="middle">가로 h</text>
  <text x="325.0" y="247.5" font-size="13" fill="#e05555" text-anchor="end">세로 |h|</text>
  <circle cx="440" cy="300" r="5" fill="#e8e8e8"/>
  <text x="628" y="126" font-size="14" font-weight="600" fill="#55c555">h &gt; 0 이면 값이 1</text>
  <text x="252" y="126" font-size="14" font-weight="600" fill="#e05555" text-anchor="end">h &lt; 0 이면 값이 −1</text>
  <text x="60" y="378" font-size="14" fill="#7777cc">x² 에서는 양쪽이 같은 곳에 붙었다 — 여기서는 h 를 아무리 줄여도 두 값이 만나지 않는다</text>
</svg>
