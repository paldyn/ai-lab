<svg xmlns="http://www.w3.org/2000/svg" width="880" height="366" viewBox="0 0 880 366" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrOC" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="366" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">스캔 이미지가 청크가 되기까지</text>
  <text x="60" y="72" font-size="13" fill="#888">앞 단계의 실수는 뒤에서 못 고친다. 그래서 인식률을 올리는 일보다 앞 단계를 바로잡는 일이 크다.</text>

  <line x1="208" y1="170" x2="260" y2="170" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrOC)"/>
  <line x1="412" y1="170" x2="464" y2="170" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrOC)"/>
  <line x1="616" y1="170" x2="668" y2="170" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrOC)"/>

  <circle r="6" fill="#7ec8e3">
    <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"
      path="M 60 170 L 820 170"
      keyPoints="0;0.097;0.097;0.366;0.366;0.634;0.634;0.903;0.903;1"
      keyTimes="0;0.06;0.14;0.30;0.38;0.54;0.62;0.78;0.86;1"/>
  </circle>

  <rect x="60" y="130" width="148" height="80" rx="8" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="134" y="156" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">전처리</text>
  <text x="134" y="176" font-size="11" fill="#888" text-anchor="middle">기울기 보정</text>
  <text x="134" y="194" font-size="11" fill="#888" text-anchor="middle">이진화 · 잡티 제거</text>

  <rect x="264" y="130" width="148" height="80" rx="8" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="338" y="156" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">영역 검출</text>
  <text x="338" y="176" font-size="11" fill="#888" text-anchor="middle">글자 줄 찾기</text>
  <text x="338" y="194" font-size="11" fill="#888" text-anchor="middle">표 · 그림 가려내기</text>

  <rect x="468" y="130" width="148" height="80" rx="8" fill="#101418" stroke="#e05555" stroke-width="1.5"/>
  <text x="542" y="156" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">글자 인식</text>
  <text x="542" y="176" font-size="11" fill="#888" text-anchor="middle">이미지를 글자로</text>
  <text x="542" y="194" font-size="11" fill="#888" text-anchor="middle">여기서 오류가 난다</text>

  <rect x="672" y="130" width="148" height="80" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="746" y="156" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">후처리</text>
  <text x="746" y="176" font-size="11" fill="#888" text-anchor="middle">사전 · 규칙 교정</text>
  <text x="746" y="194" font-size="11" fill="#888" text-anchor="middle">일부만 되살아난다</text>

  <text x="134" y="252" font-size="12.5" font-weight="600" fill="#7777cc" text-anchor="middle">기울기가 남으면</text>
  <text x="134" y="274" font-size="11.5" fill="#888" text-anchor="middle">줄 검출이 흔들린다</text>

  <text x="338" y="252" font-size="12.5" font-weight="600" fill="#7777cc" text-anchor="middle">표 선을 글자로 보면</text>
  <text x="338" y="274" font-size="11.5" fill="#888" text-anchor="middle">줄이 통째로 밀린다</text>

  <text x="542" y="252" font-size="12.5" font-weight="600" fill="#e05555" text-anchor="middle">글자 정확도 92~99%</text>
  <text x="542" y="274" font-size="11.5" fill="#888" text-anchor="middle">한글 세로획·받침에서 갈린다</text>

  <text x="746" y="252" font-size="12.5" font-weight="600" fill="#55c555" text-anchor="middle">낱말은 고친다</text>
  <text x="746" y="274" font-size="11.5" fill="#888" text-anchor="middle">숫자·고유명사는 못 고친다</text>

  <text x="60" y="322" font-size="13" fill="#888">글자 정확도 98%는 100자 청크마다 두 글자가 틀린다는 뜻이다 — 하필 그 두 글자가 금액이면 답이 바뀐다.</text>
  <text x="60" y="346" font-size="13" fill="#888">후처리 사전은 있는 낱말만 되살린다. 사전에 없는 숫자와 이름이 끝까지 남는 오류다.</text>
</svg>
