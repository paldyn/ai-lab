<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="clc-split-arr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">길면 쪼개서 읽고, 중간 결과만 모아 판단한다</text>
  <text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">구간마다 같은 질문을 병렬로 던진 뒤, 마지막 호출 하나가 종합한다</text>

  <text x="120" y="102" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">입력</text>
  <text x="300" y="102" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">구간 처리 (병렬)</text>
  <text x="500" y="102" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">중간 결과</text>
  <text x="715" y="102" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">종합</text>

  <rect x="60" y="200" width="120" height="60" rx="8" fill="#141414" stroke="#888" stroke-width="1"/>
  <text x="120" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">문서 전체</text>
  <text x="120" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle">200K 토큰</text>

  <rect x="230" y="116" width="140" height="48" rx="8" fill="#14303a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="300" y="136" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">구간 1</text>
  <text x="300" y="154" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">2만 토큰</text>
  <rect x="230" y="186" width="140" height="48" rx="8" fill="#14303a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="300" y="206" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">구간 2</text>
  <text x="300" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">2만 토큰</text>
  <circle cx="300" cy="252" r="2.5" fill="#888"/>
  <circle cx="300" cy="262" r="2.5" fill="#888"/>
  <circle cx="300" cy="272" r="2.5" fill="#888"/>
  <rect x="230" y="296" width="140" height="48" rx="8" fill="#14303a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="300" y="316" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">구간 10</text>
  <text x="300" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">2만 토큰</text>

  <rect x="420" y="116" width="160" height="48" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1"/>
