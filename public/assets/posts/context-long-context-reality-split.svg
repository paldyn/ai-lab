  <text x="500" y="154" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">찾은 것 + 참조</text>
  <rect x="420" y="186" width="160" height="48" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1"/>
  <text x="500" y="206" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">중간 결과 2</text>
  <text x="500" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">찾은 것 + 참조</text>
  <circle cx="500" cy="252" r="2.5" fill="#888"/>
  <circle cx="500" cy="262" r="2.5" fill="#888"/>
  <circle cx="500" cy="272" r="2.5" fill="#888"/>
  <rect x="420" y="296" width="160" height="48" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1"/>
  <text x="500" y="316" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">중간 결과 10</text>
  <text x="500" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">찾은 것 + 참조</text>

  <rect x="630" y="200" width="170" height="60" rx="8" fill="#22224a" stroke="#7777cc" stroke-width="1"/>
  <text x="715" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">종합 호출</text>
  <text x="715" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle">중간 결과만 읽는다</text>

  <line x1="180" y1="230" x2="230" y2="140" stroke="#888" stroke-width="1.5" marker-end="url(#clc-split-arr)"/>
  <line x1="180" y1="230" x2="230" y2="210" stroke="#888" stroke-width="1.5" marker-end="url(#clc-split-arr)"/>
  <line x1="180" y1="230" x2="230" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#clc-split-arr)"/>
  <line x1="370" y1="140" x2="420" y2="140" stroke="#888" stroke-width="1.5" marker-end="url(#clc-split-arr)"/>
  <line x1="370" y1="210" x2="420" y2="210" stroke="#888" stroke-width="1.5" marker-end="url(#clc-split-arr)"/>
  <line x1="370" y1="320" x2="420" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#clc-split-arr)"/>
  <line x1="580" y1="140" x2="630" y2="218" stroke="#888" stroke-width="1.5" marker-end="url(#clc-split-arr)"/>
  <line x1="580" y1="210" x2="630" y2="230" stroke="#888" stroke-width="1.5" marker-end="url(#clc-split-arr)"/>
  <line x1="580" y1="320" x2="630" y2="242" stroke="#888" stroke-width="1.5" marker-end="url(#clc-split-arr)"/>

  <rect x="60" y="374" width="760" height="64" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#7ec8e3">중간 결과에 적을 것: 찾은 것 · 그것이 가리키는 다른 자리 · 보류한 판단</text>
  <text x="84" y="422" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8">구간을 넘는 관계는 여기 적어 두지 않으면 종합 단계에서 사라진다</text>
