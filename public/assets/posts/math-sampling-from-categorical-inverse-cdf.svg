<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
<rect width="880" height="400" rx="12" fill="#0a0a0a"/>
<text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">역변환 표집 — 확률을 자로 펴서 한 점을 찍는다</text>
<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">확률 0.40 0.25 0.15 0.10 0.06 0.04 을 길이로 이어 붙이면 길이 1짜리 자가 된다.</text>
<defs><marker id="v1" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/></marker></defs>
<rect x="70.0" y="220" width="296.0" height="62" fill="#7ec8e3" fill-opacity="0.35" stroke="#7ec8e3" stroke-width="2"/>
<text x="218.0" y="258" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" fill="#e8e8e8" font-weight="600" text-anchor="middle">t₁</text>
<text x="366.0" y="306" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">0.40</text>
