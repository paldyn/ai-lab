<text x="586.8" y="172" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555" text-anchor="end">0.65 은 넘고 0.80 은 안 넘었다 → t₃</text>
<text x="60" y="372" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">u 를 0과 1 사이에서 고르게 뽑으면 어떤 칸에 떨어질 확률이 그 칸의 길이, 곧 그 토큰의 확률이 된다.</text>
