<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="sa-blue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">어댑터 배포 파이프라인 — 학습이 끝난 뒤에 남는 일</text>
  <text x="62" y="72" font-size="13" fill="#888">가중치를 만드는 것과 그 가중치가 트래픽을 받는 것은 다른 일이다.</text>

  <rect x="62" y="104" width="320" height="60" rx="6" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="86" y="128" font-size="13" font-weight="600" fill="#e8e8e8">1 · 학습 산출물</text>
  <text x="86" y="148" font-size="11" fill="#aaaaaa">adapter_model.safetensors</text>
  <text x="432" y="128" font-size="12" fill="#888">베이스 모델 ID와 랭크가 이 파일에 적혀 있다</text>
  <text x="432" y="148" font-size="12" fill="#888">베이스가 다르면 아예 올라가지 않는다</text>

  <line x1="222" y1="164" x2="222" y2="196" stroke="#7ec8e3" stroke-width="2" marker-end="url(#sa-blue)"/>

  <rect x="62" y="196" width="320" height="60" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="86" y="220" font-size="13" font-weight="600" fill="#e8e8e8">2 · 레지스트리 등록</text>
  <text x="86" y="240" font-size="11" fill="#aaaaaa">support-ko@v3 처럼 이름과 버전</text>
  <text x="432" y="220" font-size="12" fill="#888">베이스 가중치 해시와 데이터 커밋을 같이 적는다</text>
  <text x="432" y="240" font-size="12" fill="#888">적어 두지 않으면 반년 뒤에 재현이 안 된다</text>

  <line x1="222" y1="256" x2="222" y2="288" stroke="#7ec8e3" stroke-width="2" marker-end="url(#sa-blue)"/>

  <rect x="62" y="288" width="320" height="60" rx="6" fill="#1a1a2e" stroke="#7777cc" stroke-width="1.5"/>
  <text x="86" y="312" font-size="13" font-weight="600" fill="#e8e8e8">3 · 서버 적재</text>
  <text x="86" y="332" font-size="11" fill="#aaaaaa">미리 올리거나 첫 요청에 올린다</text>
  <text x="432" y="312" font-size="12" fill="#888">어댑터 수 × 크기만큼 KV 캐시 자리가 줄어든다</text>
  <text x="432" y="332" font-size="12" fill="#888">처음 올리는 수백 ms가 그 요청에 그대로 얹힌다</text>

  <line x1="222" y1="348" x2="222" y2="380" stroke="#7ec8e3" stroke-width="2" marker-end="url(#sa-blue)"/>

  <rect x="62" y="380" width="320" height="60" rx="6" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="86" y="404" font-size="13" font-weight="600" fill="#e8e8e8">4 · 트래픽 전환</text>
  <text x="86" y="424" font-size="11" fill="#aaaaaa">5% → 50% → 100%</text>
  <text x="432" y="404" font-size="12" fill="#888">이전 버전을 내리지 않고 그대로 남겨 둔다</text>
  <text x="432" y="424" font-size="12" fill="#888">되돌리기가 재배포가 아니라 라우팅 변경이 된다</text>

  <text x="62" y="474" font-size="13" fill="#e8e8e8">네 단계 중 가장 자주 쓰게 되는 것은 되돌리기다 — 그 길을 먼저 뚫어 둔다.</text>
</svg>
