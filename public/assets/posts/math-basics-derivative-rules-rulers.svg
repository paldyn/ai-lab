  <text x="222" y="210" font-size="14" font-weight="600" fill="#7777cc">u = 2x + 1 이라 배율 2</text>
  <path d="M 200 280 L 200 328" fill="none" stroke="#7777cc" stroke-width="2.5" marker-end="url(#rr)"/>
  <text x="222" y="310" font-size="14" font-weight="600" fill="#7777cc">y = u² 이라 u = 3 에서 배율 6</text>
  <text x="60" y="420" font-size="13" fill="#7777cc">x 가 1칸 가면 u 는 2칸, 그 1칸마다 y 가 6칸이니 2 × 6 = 12칸이다</text>
