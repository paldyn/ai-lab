  <text x="646" y="198" font-size="13" font-weight="600" fill="#55c555">어텐션 계수</text>
  <text x="646" y="220" font-size="13" fill="#e8e8e8">0.629 · 0.231 · 0.140</text>
  <text x="646" y="242" font-size="13" fill="#888">모두 양수, 합 1</text>
  <rect x="630" y="290" width="190" height="96" rx="8" fill="#101010" stroke="#e05555" stroke-width="1.5"/>
  <text x="646" y="318" font-size="13" font-weight="600" fill="#e05555">아핀결합 계수</text>
  <text x="646" y="340" font-size="13" fill="#e8e8e8">1.5 · −0.5 · 0</text>
  <text x="646" y="362" font-size="13" fill="#888">합은 1, 음수가 있음</text>
  <rect x="60" y="520" width="760" height="48" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="549" font-size="13" fill="#e8e8e8">세 벡터의 생성 공간은 평면 전체지만, 어텐션 출력은 색칠한 삼각형을 못 벗어난다</text>
