<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrLse" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#0a0a0a" rx="12"/>

  <text x="50" y="46" font-size="22" font-weight="700" fill="#e8e8e8">log-sum-exp — 최댓값을 밖으로 빼면 폭발이 사라진다</text>
  <text x="440" y="82" font-size="15" fill="#7777cc" text-anchor="middle">x = (1000, 1001, 1002),  m = max xᵢ = 1002</text>

  <rect x="50" y="110" width="220" height="150" fill="none" stroke="#e05555" stroke-width="1.5" rx="10"/>
  <text x="74" y="142" font-size="15" font-weight="600" fill="#e8e8e8">① 그대로 더한다</text>
  <text x="74" y="176" font-size="14" fill="#7ec8e3">e<tspan font-size="11" dy="-5">1000</tspan><tspan dy="5">+e</tspan><tspan font-size="11" dy="-5">1001</tspan><tspan dy="5">+e</tspan><tspan font-size="11" dy="-5">1002</tspan></text>
  <text x="74" y="210" font-size="13" fill="#888">한 항이 이미 10⁴³⁴</text>
  <text x="74" y="240" font-size="15" font-weight="600" fill="#e05555">→ inf</text>

  <rect x="330" y="110" width="220" height="150" fill="none" stroke="#7ec8e3" stroke-width="1.5" rx="10"/>
  <text x="354" y="142" font-size="15" font-weight="600" fill="#e8e8e8">② m을 빼고 더한다</text>
  <text x="354" y="176" font-size="14" fill="#7ec8e3">e<tspan font-size="11" dy="-5">−2</tspan><tspan dy="5">+e</tspan><tspan font-size="11" dy="-5">−1</tspan><tspan dy="5">+e</tspan><tspan font-size="11" dy="-5">0</tspan></text>
  <text x="354" y="210" font-size="13" fill="#888">어깨가 전부 0 이하</text>
  <text x="354" y="240" font-size="15" font-weight="600" fill="#e8e8e8">= 1.5032</text>

  <rect x="610" y="110" width="220" height="150" fill="none" stroke="#55c555" stroke-width="1.5" rx="10"/>
  <text x="634" y="142" font-size="15" font-weight="600" fill="#e8e8e8">③ m을 되돌린다</text>
  <text x="634" y="176" font-size="14" fill="#7ec8e3">m + log(1.5032)</text>
  <text x="634" y="210" font-size="13" fill="#888">1002 + 0.4076</text>
  <text x="634" y="240" font-size="15" font-weight="600" fill="#55c555">= 1002.408</text>

  <line x1="274" y1="185" x2="326" y2="185" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#arrLse)"/>
  <line x1="554" y1="185" x2="606" y2="185" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#arrLse)"/>

  <text x="50" y="302" font-size="13" fill="#888">가장 큰 항은 정확히 e⁰ = 1이므로 합이 1보다 작아지지도 않는다 — 오버플로와 언더플로가 동시에 막힌다.</text>
</svg>
