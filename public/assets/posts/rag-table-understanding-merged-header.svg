  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">다단 헤더는 색인 전에 한 줄로 편다</text>
  <text x="60" y="72" font-size="13" fill="#888">「72」의 뜻은 위 두 줄을 합쳐 읽어야 생긴다. 합치는 일은 모델이 아니라 파싱 단계가 한다.</text>

  <text x="60" y="106" font-size="13" fill="#888">원래 표 — 헤더가 두 줄, 「2025년」이 두 칸에 걸쳐 있다</text>

