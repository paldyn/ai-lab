<text x="184" y="364" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">꼬리에서는 안쪽을 가리킨다</text>
<text x="584" y="364" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">봉우리 위에서는 화살표가 짧아진다</text>
<circle cx="312" cy="330" r="4" fill="#e8e8e8"/>
<circle cx="584" cy="330" r="4" fill="#e8e8e8"/>
<text x="60" y="392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">봉우리에서 스코어는 0이다 — 로그밀도의 기울기가 0인 자리이기 때문이다.</text>
<text x="60" y="414" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">이 화살표장만 알면 어디서 출발하든 밀도가 높은 쪽으로 따라 올라갈 수 있다. 샘플링이 그 일이다.</text>
