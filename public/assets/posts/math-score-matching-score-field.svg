<text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">스코어는 밀도가 높아지는 쪽을 가리키는 화살표다</text>
