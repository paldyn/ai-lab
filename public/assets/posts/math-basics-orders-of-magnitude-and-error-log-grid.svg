  <text x="440.0" y="312" text-anchor="middle" font-size="13" fill="#888">√10 ≈ 3.16</text>
  <rect x="60" y="340" width="760" height="76" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="84" y="370" font-size="16" font-weight="600" fill="#e8e8e8">10과 100 사이 칸의 60% 지점은 10 × 10<tspan dy="-7" font-size="12">0.6</tspan><tspan dy="7"> ≈ 40</tspan></text>
  <text x="84" y="394" font-size="13" fill="#888">log₁₀ 4 ≈ 0.602 라 4의 눈금이 칸의 60.2% 지점에 서 있다. 8과 9 사이는 칸의 5%뿐이다</text>
