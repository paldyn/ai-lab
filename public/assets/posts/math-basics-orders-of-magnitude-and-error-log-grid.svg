  <text x="440.0" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">39.8%</text>
  <path d="M 578.3 140 L 578.3 128 L 777.0 128 L 777.0 140" stroke="#7777cc" stroke-width="1.5" fill="none"/>
  <text x="677.6" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">30.1%</text>
  <line x1="100" y1="200" x2="780" y2="200" stroke="#888" stroke-width="1.5"/>
