  <text x="202.4" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#7ec8e3">1과 2의 한가운데</text>
  <text x="202.4" y="312" text-anchor="middle" font-size="13" fill="#888">√2 ≈ 1.41 (1.5가 아니다)</text>
