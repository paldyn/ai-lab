  <text x="60" y="74" font-size="13" fill="#888">각 수는 log₁₀ 값의 자리에 선다 — 1·2·5·10이 칸을 셋으로 나눈다</text>
  <path d="M 103.0 140 L 103.0 128 L 301.7 128 L 301.7 140" stroke="#7777cc" stroke-width="1.5" fill="none"/>
