<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="sbarr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">치환적분은 연쇄법칙을 거꾸로 돌린 것이다</text>

  <text x="60" y="92" font-size="16" font-weight="600" fill="#e05555">미분할 때 — 속을 미분한 2x가 붙어 나왔다</text>
  <rect x="60" y="106" width="300" height="60" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="210" y="142" font-size="18" font-weight="600" fill="#e8e8e8" text-anchor="middle">e^(x²)</text>
  <line x1="360" y1="136" x2="420" y2="136" stroke="#888" stroke-width="2" marker-end="url(#sbarr)"/>
  <text x="366" y="122" font-size="13" fill="#888">미분</text>
  <rect x="430" y="106" width="300" height="60" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="580" y="142" font-size="18" font-weight="600" fill="#e8e8e8" text-anchor="middle">2x · e^(x²)</text>

  <text x="60" y="216" font-size="16" font-weight="600" fill="#55c555">적분할 때 — 그 2x를 보고 속을 알아본다</text>

  <rect x="60" y="230" width="240" height="100" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="260" font-size="16" font-weight="600" fill="#7ec8e3">① 속을 u로 둔다</text>
  <text x="84" y="286" font-size="13" fill="#888">u = x²</text>
  <text x="84" y="312" font-size="13" fill="#888">du = 2x dx</text>

  <line x1="300" y1="280" x2="352" y2="280" stroke="#888" stroke-width="2" marker-end="url(#sbarr)"/>

  <rect x="362" y="230" width="240" height="100" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="386" y="260" font-size="16" font-weight="600" fill="#7ec8e3">② 통째로 바꿔 쓴다</text>
  <text x="386" y="286" font-size="13" fill="#888">∫ 2x e^(x²) dx</text>
  <text x="386" y="312" font-size="13" fill="#888">= ∫ e^u du</text>

  <line x1="602" y1="280" x2="654" y2="280" stroke="#888" stroke-width="2" marker-end="url(#sbarr)"/>

  <rect x="664" y="230" width="156" height="100" rx="8" fill="#0e1b12" stroke="#55c555" stroke-width="1.5"/>
  <text x="688" y="260" font-size="16" font-weight="600" fill="#55c555">③ 되돌린다</text>
  <text x="688" y="286" font-size="13" fill="#888">= e^u + C</text>
  <text x="688" y="312" font-size="13" fill="#888">= e^(x²) + C</text>

  <text x="60" y="372" font-size="13" fill="#888">식 안에 '무엇의 도함수'가 곱해져 있으면 그 무엇이 u입니다. 여기서는 2x가 x²의 도함수라 x²이 u입니다.</text>
</svg>
