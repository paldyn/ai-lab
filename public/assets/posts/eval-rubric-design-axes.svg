<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">평균이 같아도 모양이 다르다</text>
  <text x="60" y="72" font-size="13" fill="#888">같은 질문에 대한 두 답을 네 축으로 따로 채점한 결과. 둘 다 평균 3.5점이다.</text>

  <rect x="600" y="88" width="14" height="14" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="622" y="100" font-size="12" fill="#e8e8e8">답 A</text>
  <rect x="690" y="88" width="14" height="14" rx="3" fill="#33260f" stroke="#c58a55" stroke-width="1.5"/>
  <text x="712" y="100" font-size="12" fill="#e8e8e8">답 B</text>

  <line x1="140" y1="320" x2="820" y2="320" stroke="#555" stroke-width="1.5"/>
  <line x1="140" y1="280" x2="820" y2="280" stroke="#222" stroke-width="1"/>
  <line x1="140" y1="240" x2="820" y2="240" stroke="#222" stroke-width="1"/>
  <line x1="140" y1="200" x2="820" y2="200" stroke="#222" stroke-width="1"/>
  <line x1="140" y1="160" x2="820" y2="160" stroke="#222" stroke-width="1"/>
  <line x1="140" y1="120" x2="820" y2="120" stroke="#222" stroke-width="1"/>

  <text x="128" y="325" font-size="12" fill="#888" text-anchor="end">0</text>
  <text x="128" y="245" font-size="12" fill="#888" text-anchor="end">2</text>
  <text x="128" y="165" font-size="12" fill="#888" text-anchor="end">4</text>
  <text x="128" y="125" font-size="12" fill="#888" text-anchor="end">5</text>

  <rect x="168" y="160" width="50" height="160" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="193" y="150" font-size="12" font-weight="600" fill="#7ec8e3" text-anchor="middle">4</text>
  <rect x="232" y="240" width="50" height="80" rx="3" fill="#33260f" stroke="#c58a55" stroke-width="1.5"/>
  <text x="257" y="230" font-size="12" font-weight="600" fill="#c58a55" text-anchor="middle">2</text>
  <text x="225" y="344" font-size="13" fill="#e8e8e8" text-anchor="middle">사실 정확성</text>

  <rect x="338" y="240" width="50" height="80" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="363" y="230" font-size="12" font-weight="600" fill="#7ec8e3" text-anchor="middle">2</text>
  <rect x="402" y="120" width="50" height="200" rx="3" fill="#33260f" stroke="#c58a55" stroke-width="1.5"/>
  <text x="427" y="110" font-size="12" font-weight="600" fill="#c58a55" text-anchor="middle">5</text>
  <text x="395" y="344" font-size="13" fill="#e8e8e8" text-anchor="middle">지시 준수</text>

  <rect x="508" y="120" width="50" height="200" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="533" y="110" font-size="12" font-weight="600" fill="#7ec8e3" text-anchor="middle">5</text>
  <rect x="572" y="200" width="50" height="120" rx="3" fill="#33260f" stroke="#c58a55" stroke-width="1.5"/>
  <text x="597" y="190" font-size="12" font-weight="600" fill="#c58a55" text-anchor="middle">3</text>
  <text x="565" y="344" font-size="13" fill="#e8e8e8" text-anchor="middle">형식</text>

  <rect x="678" y="200" width="50" height="120" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="703" y="190" font-size="12" font-weight="600" fill="#7ec8e3" text-anchor="middle">3</text>
  <rect x="742" y="160" width="50" height="160" rx="3" fill="#33260f" stroke="#c58a55" stroke-width="1.5"/>
  <text x="767" y="150" font-size="12" font-weight="600" fill="#c58a55" text-anchor="middle">4</text>
  <text x="735" y="344" font-size="13" fill="#e8e8e8" text-anchor="middle">안전</text>

  <text x="60" y="380" font-size="13" fill="#e8e8e8">한 축으로 합치면 두 답이 같은 답이 된다. 나눠 두면 사실이 틀린 답을 지시를 잘 따랐다는 이유로 고르는 일이 없다.</text>
</svg>
