<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="330" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="rat" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">유리화는 위아래에 같은 것을 곱하는 일</text>
  <text x="60" y="82" font-size="13" fill="#888">값은 그대로 두고 분모의 근호만 없앤다 — 통분에 쓰던 성질 그대로다</text>

  <text x="110" y="152" font-size="22" fill="#e8e8e8" text-anchor="middle">3</text>
  <line x1="80" y1="164" x2="140" y2="164" stroke="#888" stroke-width="1.5"/>
  <text x="110" y="194" font-size="22" fill="#e05555" text-anchor="middle">√6</text>

  <text x="170" y="176" font-size="20" fill="#888">×</text>

  <text x="240" y="152" font-size="22" fill="#7ec8e3" text-anchor="middle">√6</text>
  <line x1="205" y1="164" x2="275" y2="164" stroke="#888" stroke-width="1.5"/>
  <text x="240" y="194" font-size="22" fill="#7ec8e3" text-anchor="middle">√6</text>
  <text x="240" y="228" font-size="13" fill="#7ec8e3" text-anchor="middle">= 1 이므로 값이 안 변한다</text>

  <line x1="310" y1="172" x2="370" y2="172" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rat)"/>

  <text x="440" y="152" font-size="22" fill="#e8e8e8" text-anchor="middle">3√6</text>
  <line x1="400" y1="164" x2="480" y2="164" stroke="#888" stroke-width="1.5"/>
  <text x="440" y="194" font-size="22" fill="#55c555" text-anchor="middle">6</text>
  <text x="440" y="228" font-size="13" fill="#55c555" text-anchor="middle">√6 × √6 = 6</text>

  <line x1="510" y1="172" x2="570" y2="172" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rat)"/>

  <text x="640" y="152" font-size="22" fill="#e8e8e8" text-anchor="middle">√6</text>
  <line x1="605" y1="164" x2="675" y2="164" stroke="#888" stroke-width="1.5"/>
  <text x="640" y="194" font-size="22" fill="#e8e8e8" text-anchor="middle">2</text>
  <text x="640" y="228" font-size="13" fill="#888" text-anchor="middle">약분해서 마무리</text>

  <text x="60" y="286" font-size="14" fill="#7777cc">분모가 √5 − √3 처럼 두 항이면 부호만 바꾼 짝(켤레)을 곱한다. (a+b)(a−b) = a² − b² 가 근호를 지운다</text>
  <text x="60" y="312" font-size="14" fill="#888">1 / (√5 − √3) 은 위아래에 √5 + √3 을 곱해 (√5 + √3) / 2 가 된다</text>
</svg>
