<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 440" style="background:#0a0a0a">
  <rect width="880" height="440" fill="#0a0a0a" rx="12"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">!pip과 %pip이 패키지를 까는 곳</text>

  <!-- 1행: 셀에 친 명령 -->
  <rect x="60" y="76" width="350" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="103" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">!pip</tspan><tspan fill="#ffffff"> install peft</tspan></text>

  <rect x="470" y="76" width="350" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="486" y="103" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">%pip</tspan><tspan fill="#ffffff"> install peft</tspan></text>

  <line x1="235" y1="120" x2="235" y2="156" stroke="#e05555" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="645" y1="120" x2="645" y2="156" stroke="#55c555" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- 2행: 누가 pip을 부르나 -->
  <rect x="60" y="156" width="350" height="64" rx="8" fill="#111827" stroke="#888" stroke-width="1.5"/>
  <text x="235" y="184" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">셸이 PATH에서 찾은 pip</text>
  <text x="235" y="204" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">먼저 걸리는 pip이 가리키는 파이썬</text>

  <rect x="470" y="156" width="350" height="64" rx="8" fill="#111827" stroke="#888" stroke-width="1.5"/>
  <text x="645" y="184" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">커널을 띄운 파이썬의 pip</text>
  <text x="645" y="204" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">sys.executable -m pip 과 같다</text>

  <line x1="235" y1="220" x2="235" y2="256" stroke="#e05555" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="645" y1="220" x2="645" y2="256" stroke="#55c555" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- 3행: 설치된 곳 -->
  <rect x="60" y="256" width="350" height="64" rx="8" fill="#111827" stroke="#e05555" stroke-width="1.5"/>
  <text x="235" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#e05555" text-anchor="middle">/usr/bin/python3</text>
  <text x="235" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">시스템 파이썬 · 커널이 안 보는 곳</text>

  <rect x="470" y="256" width="350" height="64" rx="8" fill="#111827" stroke="#55c555" stroke-width="1.5"/>
  <text x="645" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#55c555" text-anchor="middle">~/envs/llm/bin/python</text>
  <text x="645" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">가상환경 · 커널이 쓰는 곳</text>

  <line x1="235" y1="320" x2="235" y2="356" stroke="#e05555" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="645" y1="320" x2="645" y2="356" stroke="#55c555" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- 4행: 커널에서 import -->
  <rect x="60" y="356" width="350" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="383" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan><tspan fill="#ffffff"> peft  </tspan><tspan fill="#e05555"># ModuleNotFoundError</tspan></text>

  <rect x="470" y="356" width="350" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="486" y="383" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan><tspan fill="#ffffff"> peft  </tspan><tspan fill="#55c555"># 성공</tspan></text>
</svg>
