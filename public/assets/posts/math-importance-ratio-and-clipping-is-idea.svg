<text x="60" y="382" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">무게는 w(x) = p(x) / q(x). 오른쪽으로 갈수록 q가 얇아져 무게가 지수적으로 커진다.</text>
<text x="60" y="402" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">추정값은 무게를 곱한 평균 하나로 나오지만, 그 평균을 몇 개의 점이 떠받치는지는 무게가 정한다.</text>
