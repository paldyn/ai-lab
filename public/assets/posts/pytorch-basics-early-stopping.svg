<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <rect width="880" height="400" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">조기 종료와 최선 체크포인트</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#888">검증 손실이 최선을 못 넘긴 에폭이 patience만큼 이어지면 멈춘다</text>

  <!-- patience bracket -->
  <path d="M350 126 L350 118 L650 118 L650 126" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="500" y="104" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">개선 없음 5에폭</text>

  <!-- axes -->
  <line x1="110" y1="140" x2="110" y2="300" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="110" y1="300" x2="760" y2="300" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="86" y="134" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">손실</text>
  <text x="772" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">에폭</text>

  <!-- markers for best / stop -->
  <line x1="350" y1="150" x2="350" y2="300" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="650" y1="150" x2="650" y2="300" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="350" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">최선 · best_model.pt 저장</text>
  <text x="650" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">학습 중단</text>

  <!-- train loss -->
  <polyline points="110,175 170,205 230,228 290,245 350,258 410,268 470,276 530,282 590,287 650,291" fill="none" stroke="#7777cc" stroke-width="2.5"/>
  <!-- validation loss -->
  <polyline points="110,168 170,198 230,220 290,236 350,248 410,240 470,244 530,236 590,230 650,234" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>

  <circle cx="350" cy="248" r="5" fill="#55c555"/>
  <circle cx="650" cy="234" r="5" fill="#e05555"/>

  <!-- legend -->
  <line x1="110" y1="336" x2="140" y2="336" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="150" y="340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8">검증 손실 — 멈출 때를 정한다</text>
  <line x1="360" y1="336" x2="390" y2="336" stroke="#7777cc" stroke-width="2.5"/>
  <text x="400" y="340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8">학습 손실 — 거의 항상 내려간다</text>
</svg>
