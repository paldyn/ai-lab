<text x="60" y="406" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">역행렬은 n³ = 3.4×10²⁹ 연산이라 H100 한 대로 천만 년이 걸린다. 대각선만 들면 56 GB 에 O(n) 이다.</text>
