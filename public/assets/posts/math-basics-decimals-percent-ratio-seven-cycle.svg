<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="450" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="cyArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="cyBack" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">1 ÷ 7 — 나머지가 돌아오면 몫도 되풀이된다</text>
  <text x="60" y="82" font-size="13" fill="#888">나머지에 0을 붙여 내릴 때마다 몫이 한 자리씩 나온다</text>
  <rect x="62" y="120" width="106" height="110" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="115" y="148" font-size="13" fill="#888" text-anchor="middle">10 ÷ 7</text>
  <text x="115" y="186" font-size="28" font-weight="700" fill="#e8e8e8" text-anchor="middle">1</text>
  <text x="115" y="214" font-size="13" fill="#7ec8e3" text-anchor="middle">나머지 3</text>
  <line x1="168" y1="175" x2="192" y2="175" stroke="#888" stroke-width="2" marker-end="url(#cyArr)"/>
  <rect x="192" y="120" width="106" height="110" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="245" y="148" font-size="13" fill="#888" text-anchor="middle">30 ÷ 7</text>
  <text x="245" y="186" font-size="28" font-weight="700" fill="#e8e8e8" text-anchor="middle">4</text>
  <text x="245" y="214" font-size="13" fill="#7ec8e3" text-anchor="middle">나머지 2</text>
  <line x1="298" y1="175" x2="322" y2="175" stroke="#888" stroke-width="2" marker-end="url(#cyArr)"/>
  <rect x="322" y="120" width="106" height="110" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="375" y="148" font-size="13" fill="#888" text-anchor="middle">20 ÷ 7</text>
  <text x="375" y="186" font-size="28" font-weight="700" fill="#e8e8e8" text-anchor="middle">2</text>
  <text x="375" y="214" font-size="13" fill="#7ec8e3" text-anchor="middle">나머지 6</text>
  <line x1="428" y1="175" x2="452" y2="175" stroke="#888" stroke-width="2" marker-end="url(#cyArr)"/>
  <rect x="452" y="120" width="106" height="110" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="505" y="148" font-size="13" fill="#888" text-anchor="middle">60 ÷ 7</text>
  <text x="505" y="186" font-size="28" font-weight="700" fill="#e8e8e8" text-anchor="middle">8</text>
  <text x="505" y="214" font-size="13" fill="#7ec8e3" text-anchor="middle">나머지 4</text>
  <line x1="558" y1="175" x2="582" y2="175" stroke="#888" stroke-width="2" marker-end="url(#cyArr)"/>
  <rect x="582" y="120" width="106" height="110" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="635" y="148" font-size="13" fill="#888" text-anchor="middle">40 ÷ 7</text>
  <text x="635" y="186" font-size="28" font-weight="700" fill="#e8e8e8" text-anchor="middle">5</text>
  <text x="635" y="214" font-size="13" fill="#7ec8e3" text-anchor="middle">나머지 5</text>
  <line x1="688" y1="175" x2="712" y2="175" stroke="#888" stroke-width="2" marker-end="url(#cyArr)"/>
  <rect x="712" y="120" width="106" height="110" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="765" y="148" font-size="13" fill="#888" text-anchor="middle">50 ÷ 7</text>
  <text x="765" y="186" font-size="28" font-weight="700" fill="#e8e8e8" text-anchor="middle">7</text>
  <text x="765" y="214" font-size="13" fill="#7ec8e3" text-anchor="middle">나머지 1</text>
  <path d="M 765 230 L 765 290 L 115 290 L 115 230" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#cyBack)"/>
  <text x="440" y="330" font-size="13" fill="#7ec8e3" text-anchor="middle">나머지 1은 처음 나눈 수 1과 같다 — 다시 10 ÷ 7부터 똑같이 되밟는다</text>
  <rect x="60" y="360" width="760" height="64" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="386" font-size="15" font-weight="600" fill="#e8e8e8">1/7 = 0.142857 142857 …  순환마디 여섯 자리</text>
  <text x="84" y="408" font-size="13" fill="#888">7로 나눈 나머지는 1~6 여섯 가지뿐이라 일곱 걸음 안에 반드시 한 번 겹친다</text>
</svg>
