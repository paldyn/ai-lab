  <text x="440" y="238" text-anchor="middle" fill="#888" font-size="13">창 격자를 절반만큼 민다</text>

  <text x="202" y="392" text-anchor="middle" fill="#888" font-size="12">두 패치가 다른 창에 있어 서로를 보지 못한다</text>
  <text x="678" y="392" text-anchor="middle" fill="#888" font-size="12">같은 창에 들어와 어텐션이 걸린다</text>
  <text x="440" y="422" text-anchor="middle" fill="#888" font-size="12">그림은 8×8 격자에 4×4 창으로 줄여 그렸다. 실제 Swin은 7×7 창을 쓴다.</text>
  <text x="440" y="446" text-anchor="middle" fill="#888" font-size="12">비용: 전역 어텐션은 토큰 수의 제곱, 창 어텐션은 토큰 수에 비례한다.</text>
