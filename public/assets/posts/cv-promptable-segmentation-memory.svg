  <text x="720.0" y="207.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">지금 대상의 경계</text>
  <line x1="300" y1="123" x2="360" y2="170" stroke="#e8e8e8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="245" x2="360" y2="210" stroke="#e8e8e8" stroke-width="2" marker-end="url(#arr)"/>
