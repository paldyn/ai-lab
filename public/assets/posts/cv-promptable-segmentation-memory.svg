  <rect x="80" y="230" width="56" height="52" rx="6" fill="#0d0d12" stroke="#55c555" stroke-width="1"/>
  <text x="108" y="261" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8" text-anchor="middle">t−3</text>
  <rect x="152" y="230" width="56" height="52" rx="6" fill="#0d0d12" stroke="#55c555" stroke-width="1"/>
  <text x="180" y="261" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8" text-anchor="middle">t−2</text>
  <rect x="224" y="230" width="56" height="52" rx="6" fill="#0d0d12" stroke="#55c555" stroke-width="1"/>
  <text x="252" y="261" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8" text-anchor="middle">t−1</text>
  <rect x="360" y="150" width="200" height="80" rx="8" fill="#111418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="460.0" y="186.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">메모리 참조</text>
  <text x="460.0" y="207.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">기억 속 모양과 견주기</text>
  <rect x="620" y="150" width="200" height="80" rx="8" fill="#111418" stroke="#e8e8e8" stroke-width="1.5"/>
