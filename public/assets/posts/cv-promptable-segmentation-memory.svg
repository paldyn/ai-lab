  <rect width="880" height="430" fill="#0a0a0a" rx="12"/>
  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">영상 분할의 메모리 — 두 종류의 기억</text>
  <rect x="60" y="85" width="240" height="76" rx="8" fill="#111418" stroke="#7ec8e3" stroke-width="1.5"/>
