  <text x="180.0" y="140.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">사람이 점을 찍은 프레임 · 끝까지 보관</text>
  <rect x="60" y="190" width="240" height="110" rx="8" fill="#111418" stroke="#55c555" stroke-width="1.5"/>
