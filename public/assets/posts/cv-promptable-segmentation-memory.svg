  <text x="440" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">최근 기억은 지금 모양을 따라가고, 지시 프레임은 무엇을 찾으라 했는지를 붙든다</text>
