<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="ivAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="ivBlue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">부등식의 해는 값이 아니라 구간이다</text>
  <text x="60" y="82" font-size="13" fill="#888">속이 찬 점은 그 값을 포함하고, 빈 점은 포함하지 않는다</text>

  <text x="60" y="132" font-size="15" fill="#e8e8e8">x ≥ 2</text>
  <text x="740" y="132" font-size="15" fill="#7ec8e3">[2, ∞)</text>
  <line x1="360" y1="152" x2="800" y2="152" stroke="#7ec8e3" stroke-width="5" marker-end="url(#ivBlue)"/>
  <line x1="120" y1="152" x2="820" y2="152" stroke="#888" stroke-width="1.5"/>
  <circle cx="360" cy="152" r="7" fill="#7ec8e3"/>
  <line x1="140" y1="146" x2="140" y2="158" stroke="#888" stroke-width="1.5"/>
  <line x1="250" y1="146" x2="250" y2="158" stroke="#888" stroke-width="1.5"/>
  <line x1="360" y1="146" x2="360" y2="158" stroke="#888" stroke-width="1.5"/>
  <line x1="470" y1="146" x2="470" y2="158" stroke="#888" stroke-width="1.5"/>
  <line x1="580" y1="146" x2="580" y2="158" stroke="#888" stroke-width="1.5"/>
  <line x1="690" y1="146" x2="690" y2="158" stroke="#888" stroke-width="1.5"/>
  <line x1="800" y1="146" x2="800" y2="158" stroke="#888" stroke-width="1.5"/>
  <text x="140" y="178" font-size="12" fill="#888" text-anchor="middle">0</text>
  <text x="250" y="178" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="360" y="178" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="470" y="178" font-size="12" fill="#888" text-anchor="middle">3</text>
  <text x="580" y="178" font-size="12" fill="#888" text-anchor="middle">4</text>
  <text x="690" y="178" font-size="12" fill="#888" text-anchor="middle">5</text>
  <text x="800" y="178" font-size="12" fill="#888" text-anchor="middle">6</text>

  <text x="60" y="248" font-size="15" fill="#e8e8e8">x &lt; 3</text>
  <text x="740" y="248" font-size="15" fill="#7ec8e3">(−∞, 3)</text>
  <line x1="470" y1="268" x2="126" y2="268" stroke="#7ec8e3" stroke-width="5" marker-end="url(#ivBlue)"/>
  <line x1="120" y1="268" x2="820" y2="268" stroke="#888" stroke-width="1.5"/>
  <circle cx="470" cy="268" r="7" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="3"/>
  <line x1="140" y1="262" x2="140" y2="274" stroke="#888" stroke-width="1.5"/>
  <line x1="250" y1="262" x2="250" y2="274" stroke="#888" stroke-width="1.5"/>
  <line x1="360" y1="262" x2="360" y2="274" stroke="#888" stroke-width="1.5"/>
  <line x1="470" y1="262" x2="470" y2="274" stroke="#888" stroke-width="1.5"/>
  <line x1="580" y1="262" x2="580" y2="274" stroke="#888" stroke-width="1.5"/>
  <line x1="690" y1="262" x2="690" y2="274" stroke="#888" stroke-width="1.5"/>
  <line x1="800" y1="262" x2="800" y2="274" stroke="#888" stroke-width="1.5"/>
  <text x="140" y="294" font-size="12" fill="#888" text-anchor="middle">0</text>
  <text x="250" y="294" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="360" y="294" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="470" y="294" font-size="12" fill="#888" text-anchor="middle">3</text>
  <text x="580" y="294" font-size="12" fill="#888" text-anchor="middle">4</text>
  <text x="690" y="294" font-size="12" fill="#888" text-anchor="middle">5</text>
  <text x="800" y="294" font-size="12" fill="#888" text-anchor="middle">6</text>

  <text x="60" y="364" font-size="15" fill="#e8e8e8">1 &lt; x ≤ 4</text>
  <text x="740" y="364" font-size="15" fill="#7ec8e3">(1, 4]</text>
  <line x1="250" y1="384" x2="580" y2="384" stroke="#7ec8e3" stroke-width="5"/>
  <line x1="120" y1="384" x2="820" y2="384" stroke="#888" stroke-width="1.5"/>
  <circle cx="250" cy="384" r="7" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="3"/>
  <circle cx="580" cy="384" r="7" fill="#7ec8e3"/>
  <line x1="140" y1="378" x2="140" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="250" y1="378" x2="250" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="360" y1="378" x2="360" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="470" y1="378" x2="470" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="580" y1="378" x2="580" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="690" y1="378" x2="690" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="800" y1="378" x2="800" y2="390" stroke="#888" stroke-width="1.5"/>
  <text x="140" y="410" font-size="12" fill="#888" text-anchor="middle">0</text>
  <text x="250" y="410" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="360" y="410" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="470" y="410" font-size="12" fill="#888" text-anchor="middle">3</text>
  <text x="580" y="410" font-size="12" fill="#888" text-anchor="middle">4</text>
  <text x="690" y="410" font-size="12" fill="#888" text-anchor="middle">5</text>
  <text x="800" y="410" font-size="12" fill="#888" text-anchor="middle">6</text>

  <text x="60" y="446" font-size="13" fill="#888">∞ 쪽은 값이 아니라 방향이므로 늘 둥근 괄호로 닫는다</text>
</svg>
