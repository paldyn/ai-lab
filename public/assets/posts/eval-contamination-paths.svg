<svg xmlns="http://www.w3.org/2000/svg" width="880" height="474" viewBox="0 0 880 474" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="ecarr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="ecred" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="474" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">시험 문제가 모델에 닿는 네 갈래 길</text>
  <text x="60" y="72" font-size="13" fill="#888">공개된 벤치마크가 어떤 경로로 모델 쪽에 흘러드는가.</text>

  <rect x="60" y="204" width="150" height="64" rx="8" fill="#141414" stroke="#c58a55" stroke-width="1.5"/>
  <text x="76" y="230" font-size="13" font-weight="600" fill="#e8e8e8">공개된 벤치마크</text>
  <text x="76" y="250" font-size="11" fill="#888">문제와 정답이 한 곳에</text>

  <line x1="212" y1="228" x2="266" y2="146" stroke="#888" stroke-width="2" marker-end="url(#ecarr)"/>
  <line x1="212" y1="236" x2="266" y2="206" stroke="#888" stroke-width="2" marker-end="url(#ecarr)"/>
  <line x1="212" y1="244" x2="266" y2="272" stroke="#888" stroke-width="2" marker-end="url(#ecarr)"/>
  <line x1="212" y1="252" x2="266" y2="334" stroke="#888" stroke-width="2" marker-end="url(#ecarr)"/>

  <rect x="270" y="112" width="290" height="52" rx="8" fill="#141414" stroke="#444" stroke-width="1"/>
  <text x="286" y="133" font-size="13" font-weight="600" fill="#e8e8e8">① 웹 크롤</text>
  <text x="286" y="150" font-size="11" fill="#888">저장소·블로그·풀이 글에 원문 그대로 올라 있다</text>

  <rect x="270" y="180" width="290" height="52" rx="8" fill="#141414" stroke="#444" stroke-width="1"/>
  <text x="286" y="201" font-size="13" font-weight="600" fill="#e8e8e8">② 합성 데이터</text>
  <text x="286" y="218" font-size="11" fill="#888">문제를 흉내 내 만든 학습 데이터에 원문이 섞인다</text>

  <rect x="270" y="248" width="290" height="52" rx="8" fill="#141414" stroke="#444" stroke-width="1"/>
  <text x="286" y="269" font-size="13" font-weight="600" fill="#e8e8e8">③ 사람을 거친 과적합</text>
  <text x="286" y="286" font-size="11" fill="#888">점수를 보며 고르고 다시 학습하기를 반복한다</text>

  <rect x="270" y="316" width="290" height="52" rx="8" fill="#141414" stroke="#e05555" stroke-width="1.5"/>
  <text x="286" y="337" font-size="13" font-weight="600" fill="#e8e8e8">④ 평가 중의 검색·도구</text>
  <text x="286" y="354" font-size="11" fill="#888">모델이 채점 도중 정답 페이지를 직접 읽는다</text>

  <line x1="562" y1="138" x2="616" y2="200" stroke="#888" stroke-width="2" marker-end="url(#ecarr)"/>
  <line x1="562" y1="206" x2="616" y2="206" stroke="#888" stroke-width="2" marker-end="url(#ecarr)"/>
  <line x1="562" y1="274" x2="616" y2="216" stroke="#888" stroke-width="2" marker-end="url(#ecarr)"/>
  <line x1="562" y1="342" x2="616" y2="342" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#ecred)"/>

  <rect x="620" y="180" width="200" height="52" rx="8" fill="#141414" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="636" y="212" font-size="13" font-weight="600" fill="#e8e8e8">학습 코퍼스</text>

  <line x1="720" y1="232" x2="720" y2="314" stroke="#888" stroke-width="2" marker-end="url(#ecarr)"/>
  <text x="736" y="278" font-size="12" fill="#888">학습</text>

  <rect x="620" y="316" width="200" height="52" rx="8" fill="#141414" stroke="#55c555" stroke-width="1.5"/>
  <text x="636" y="348" font-size="13" font-weight="600" fill="#e8e8e8">점수를 받는 모델</text>

  <text x="60" y="416" font-size="13" fill="#e8e8e8">①~③은 학습이 끝난 뒤에는 손댈 수 없고, ④만 평가를 돌리는 쪽에서 막을 수 있다.</text>
  <text x="60" y="440" font-size="12" fill="#888">③은 가중치에 문제가 안 들어가도 생긴다 — 같은 테스트 세트로 수십 번 고르는 동안 사람이 그 세트에 맞춰 간다.</text>
</svg>
