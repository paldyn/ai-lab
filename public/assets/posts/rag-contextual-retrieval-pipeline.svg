<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrCR" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arrCRg" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="350" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">맥락은 검색할 때가 아니라 색인할 때 붙인다</text>
  <text x="60" y="72" font-size="13" fill="#888">청크마다 한 번씩, 문서 전체와 함께 모델에 넣어 「이 조각이 무엇에 관한 것인지」 한두 문장을 받는다.</text>

  <circle r="6" fill="#7ec8e3">
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear"
      path="M 210 250 L 245 250 L 245 200 L 355 200 L 575 200 L 672 200"
      keyPoints="0;0.381;0.381;0.811;0.811;1"
      keyTimes="0;0.30;0.45;0.70;0.82;1"/>
    <animate attributeName="fill" values="#7ec8e3;#7ec8e3;#55c555;#55c555"
      keyTimes="0;0.30;0.45;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <rect x="60" y="110" width="150" height="60" rx="8" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="135" y="134" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">문서 전체</text>
  <text x="135" y="154" font-size="11" fill="#888" text-anchor="middle">보고서 한 편</text>

  <rect x="60" y="220" width="150" height="60" rx="8" fill="#101418" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="135" y="244" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">청크 하나</text>
  <text x="135" y="264" font-size="11" fill="#888" text-anchor="middle">잘려 나온 조각</text>

  <rect x="280" y="170" width="150" height="60" rx="8" fill="#101418" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="355" y="194" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">작은 모델</text>
  <text x="355" y="214" font-size="11" fill="#888" text-anchor="middle">둘을 함께 읽는다</text>

  <rect x="500" y="160" width="150" height="80" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="575" y="192" font-size="12" font-weight="600" fill="#55c555" text-anchor="middle">맥락 한두 문장 +</text>
  <text x="575" y="216" font-size="12" fill="#e8e8e8" text-anchor="middle">원본 청크 그대로</text>

  <rect x="700" y="130" width="120" height="56" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="760" y="152" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">키워드 색인</text>
  <text x="760" y="174" font-size="11" fill="#888" text-anchor="middle">BM25</text>

  <rect x="700" y="214" width="120" height="56" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="760" y="236" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">벡터 색인</text>
  <text x="760" y="258" font-size="11" fill="#888" text-anchor="middle">임베딩</text>

  <path d="M 210 140 L 250 140 L 250 194 L 276 194" fill="none" stroke="#7777cc" stroke-width="2" marker-end="url(#arrCR)"/>
  <path d="M 210 250 L 245 250 L 245 206 L 276 206" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrCR)"/>
  <line x1="430" y1="200" x2="496" y2="200" stroke="#55c555" stroke-width="2" marker-end="url(#arrCRg)"/>
  <path d="M 650 200 L 675 200 L 675 158 L 696 158" fill="none" stroke="#55c555" stroke-width="2" marker-end="url(#arrCRg)"/>
  <path d="M 675 200 L 675 242 L 696 242" fill="none" stroke="#55c555" stroke-width="2" marker-end="url(#arrCRg)"/>

  <text x="463" y="184" font-size="11.5" fill="#888" text-anchor="middle">생성</text>

  <text x="60" y="308" font-size="13" fill="#888">문서 전체는 캐시에 한 번만 올리고 청크만 바꿔 가며 부르면, 같은 문서를 청크 수만큼 다시 읽지 않아도 된다.</text>
  <text x="60" y="332" font-size="13" fill="#888">색인에 들어가는 글자가 달라졌을 뿐이라 키워드 쪽과 벡터 쪽이 함께 좋아진다.</text>
</svg>
