<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="480" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="dcAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">|z − (1 + 2i)| = 3 은 중심 1 + 2i, 반지름 3인 원이다</text>
  <text x="60" y="74" font-size="13" fill="#888">두 점 사이의 거리는 빼서 절댓값을 잡으면 나온다</text>

  <line x1="80" y1="380" x2="440" y2="380" stroke="#888" stroke-width="1.5" marker-end="url(#dcAx)"/>
  <line x1="200" y1="450" x2="200" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#dcAx)"/>
  <text x="446" y="384" font-size="13" fill="#888">x</text>
  <text x="208" y="114" font-size="13" fill="#888">y</text>

  <line x1="240" y1="376" x2="240" y2="384" stroke="#444" stroke-width="1.5"/>
  <line x1="280" y1="376" x2="280" y2="384" stroke="#444" stroke-width="1.5"/>
  <line x1="320" y1="376" x2="320" y2="384" stroke="#444" stroke-width="1.5"/>
  <line x1="360" y1="376" x2="360" y2="384" stroke="#444" stroke-width="1.5"/>
  <text x="240" y="400" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="280" y="400" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="320" y="400" font-size="12" fill="#888" text-anchor="middle">3</text>
  <text x="360" y="400" font-size="12" fill="#888" text-anchor="middle">4</text>
  <line x1="196" y1="340" x2="204" y2="340" stroke="#444" stroke-width="1.5"/>
  <line x1="196" y1="300" x2="204" y2="300" stroke="#444" stroke-width="1.5"/>
  <line x1="196" y1="260" x2="204" y2="260" stroke="#444" stroke-width="1.5"/>
  <line x1="196" y1="220" x2="204" y2="220" stroke="#444" stroke-width="1.5"/>
  <text x="188" y="344" font-size="12" fill="#888" text-anchor="end">1</text>
  <text x="188" y="304" font-size="12" fill="#888" text-anchor="end">2</text>
  <text x="188" y="264" font-size="12" fill="#888" text-anchor="end">3</text>
  <text x="188" y="224" font-size="12" fill="#888" text-anchor="end">4</text>

  <circle cx="240" cy="300" r="120" fill="#7ec8e3" fill-opacity="0.08" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="240" y1="300" x2="360" y2="300" stroke="#55c555" stroke-width="2"/>
  <text x="300" y="290" font-size="13" fill="#55c555" text-anchor="middle">3</text>
  <line x1="240" y1="300" x2="320" y2="220" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="246" y="240" font-size="13" fill="#e05555">√8</text>

  <circle cx="240" cy="300" r="5" fill="#e8e8e8"/>
  <text x="248" y="322" font-size="13" fill="#e8e8e8">1 + 2i</text>
  <circle cx="360" cy="300" r="5" fill="#e8e8e8"/>
  <text x="374" y="322" font-size="13" fill="#e8e8e8">4 + 2i</text>
  <circle cx="320" cy="220" r="5" fill="#e8e8e8"/>
  <text x="334" y="214" font-size="13" fill="#e8e8e8">3 + 4i</text>

  <rect x="480" y="130" width="340" height="250" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="504" y="160" font-size="14" font-weight="600" fill="#e8e8e8">원 위인가, 안인가</text>
  <line x1="504" y1="174" x2="796" y2="174" stroke="#333" stroke-width="1"/>
  <text x="504" y="200" font-size="13" fill="#888">4 + 2i 에서 중심을 빼면</text>
  <text x="504" y="224" font-size="13" fill="#e8e8e8">(4 + 2i) − (1 + 2i) = 3</text>
  <text x="504" y="248" font-size="13" fill="#55c555">거리 3 — 원 위에 있다</text>
  <line x1="504" y1="266" x2="796" y2="266" stroke="#333" stroke-width="1"/>
  <text x="504" y="292" font-size="13" fill="#888">3 + 4i 에서 중심을 빼면</text>
  <text x="504" y="316" font-size="13" fill="#e8e8e8">(3 + 4i) − (1 + 2i) = 2 + 2i</text>
  <text x="504" y="340" font-size="13" fill="#e05555">거리 √8 &lt; 3 — 원 안쪽이다</text>
</svg>
