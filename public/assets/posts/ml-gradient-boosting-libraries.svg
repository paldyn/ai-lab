<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 460" style="background:#0a0a0a;border-radius:12px">
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>

  <!-- Header -->
  <rect x="0" y="0" width="880" height="68" rx="12" fill="#0d1a2a"/>
  <rect x="0" y="56" width="880" height="12" fill="#0d1a2a"/>
  <text x="60" y="38" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">XGBoost · LightGBM · CatBoost 비교</text>
  <text x="60" y="60" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">캐글을 지배한 세 라이브러리의 핵심 차이</text>

  <!-- ===== Comparison Table ===== -->
  <!-- Table header row -->
  <rect x="60" y="88" width="760" height="34" rx="6" fill="#131a2e"/>
  <text x="155" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#e8e8e8" text-anchor="middle">항목</text>
  <line x1="250" y1="88" x2="250" y2="122" stroke="#3a4a6e" stroke-width="1"/>
  <text x="345" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#7777cc" text-anchor="middle">XGBoost</text>
  <line x1="440" y1="88" x2="440" y2="122" stroke="#3a4a6e" stroke-width="1"/>
  <text x="535" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#7ec8e3" text-anchor="middle">LightGBM</text>
  <line x1="630" y1="88" x2="630" y2="122" stroke="#3a4a6e" stroke-width="1"/>
  <text x="725" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#55c555" text-anchor="middle">CatBoost</text>

  <!-- Row 1: 트리 성장 방식 -->
  <rect x="60" y="122" width="760" height="36" rx="0" fill="#0e1420"/>
  <text x="155" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">트리 성장 방식</text>
  <line x1="250" y1="122" x2="250" y2="158" stroke="#3a4a6e" stroke-width="1"/>
  <text x="345" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">Level-wise</text>
  <line x1="440" y1="122" x2="440" y2="158" stroke="#3a4a6e" stroke-width="1"/>
  <text x="535" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3" text-anchor="middle">Leaf-wise ★빠름</text>
  <line x1="630" y1="122" x2="630" y2="158" stroke="#3a4a6e" stroke-width="1"/>
  <text x="725" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">Symmetric</text>

  <!-- Row 2: 속도 -->
  <rect x="60" y="158" width="760" height="36" rx="0" fill="#0a0f1c"/>
  <text x="155" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">학습 속도</text>
  <line x1="250" y1="158" x2="250" y2="194" stroke="#3a4a6e" stroke-width="1"/>
  <text x="345" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#b5cea8" text-anchor="middle">★★★</text>
  <line x1="440" y1="158" x2="440" y2="194" stroke="#3a4a6e" stroke-width="1"/>
  <text x="535" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555" text-anchor="middle">★★★★★ 최고속</text>
  <line x1="630" y1="158" x2="630" y2="194" stroke="#3a4a6e" stroke-width="1"/>
  <text x="725" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#b5cea8" text-anchor="middle">★★★★</text>

  <!-- Row 3: 범주형 -->
  <rect x="60" y="194" width="760" height="36" rx="0" fill="#0e1420"/>
  <text x="155" y="216" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">범주형 처리</text>
  <line x1="250" y1="194" x2="250" y2="230" stroke="#3a4a6e" stroke-width="1"/>
  <text x="345" y="216" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">수동 인코딩 필요</text>
  <line x1="440" y1="194" x2="440" y2="230" stroke="#3a4a6e" stroke-width="1"/>
  <text x="535" y="216" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">부분 지원</text>
  <line x1="630" y1="194" x2="630" y2="230" stroke="#3a4a6e" stroke-width="1"/>
  <text x="725" y="216" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555" text-anchor="middle">자동 처리 ★</text>

  <!-- Row 4: 메모리 -->
  <rect x="60" y="230" width="760" height="36" rx="0" fill="#0a0f1c"/>
  <text x="155" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">메모리 효율</text>
  <line x1="250" y1="230" x2="250" y2="266" stroke="#3a4a6e" stroke-width="1"/>
  <text x="345" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#b5cea8" text-anchor="middle">보통</text>
  <line x1="440" y1="230" x2="440" y2="266" stroke="#3a4a6e" stroke-width="1"/>
  <text x="535" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555" text-anchor="middle">히스토그램 기법 ★</text>
  <line x1="630" y1="230" x2="630" y2="266" stroke="#3a4a6e" stroke-width="1"/>
  <text x="725" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" text-anchor="middle" font-size="13" fill="#b5cea8">보통</text>

  <!-- Row 5: 정규화 -->
  <rect x="60" y="266" width="760" height="36" rx="0" fill="#0e1420"/>
  <text x="155" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">내장 정규화</text>
  <line x1="250" y1="266" x2="250" y2="302" stroke="#3a4a6e" stroke-width="1"/>
  <text x="345" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555" text-anchor="middle">L1 + L2 (α, λ)</text>
  <line x1="440" y1="266" x2="440" y2="302" stroke="#3a4a6e" stroke-width="1"/>
  <text x="535" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#b5cea8" text-anchor="middle">lambda, min_data</text>
  <line x1="630" y1="266" x2="630" y2="302" stroke="#3a4a6e" stroke-width="1"/>
  <text x="725" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#b5cea8" text-anchor="middle">depth, l2</text>
  <rect x="60" y="122" width="760" height="180" rx="0" fill="none" stroke="#3a4a6e" stroke-width="1"/>

  <!-- Code block -->
  <rect x="60" y="315" width="760" height="118" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="333" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># XGBoost / LightGBM 학습 예시</tspan></text>
  <text x="76" y="351" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> xgboost </tspan><tspan fill="#7ec8e3">as</tspan><tspan fill="#ffffff"> xgb</tspan></text>
  <text x="76" y="369" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">model = xgb.XGBClassifier(</tspan></text>
  <text x="76" y="387" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    n_estimators=</tspan><tspan fill="#b5cea8">500</tspan><tspan fill="#ffffff">, learning_rate=</tspan><tspan fill="#b5cea8">0.05</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="76" y="405" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    max_depth=</tspan><tspan fill="#b5cea8">6</tspan><tspan fill="#ffffff">, subsample=</tspan><tspan fill="#b5cea8">0.8</tspan><tspan fill="#ffffff">, tree_method=</tspan><tspan fill="#ce9178">&quot;hist&quot;</tspan><tspan fill="#ffffff">)</tspan></text>

  <!-- Footer -->
</svg>
