<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370">
  <defs>
    <marker id="kl-axis" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="880" height="370" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">KL 페널티와 β</text>
  <text x="440" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#888" text-anchor="middle">가로축은 정책이 SFT 모델에서 멀어진 거리</text>

  <!-- Origin -->
  <text x="110" y="116" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8" text-anchor="middle">SFT 모델</text>
  <line x1="110" y1="124" x2="110" y2="214" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bands -->
  <rect x="110" y="132" width="410" height="52" rx="8" fill="#101a10" stroke="#2a5a2a" stroke-width="1.5"/>
  <text x="315" y="163" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#55c555" text-anchor="middle">보상 모델이 믿을 만한 영역 — 라벨러가 본 분포</text>

  <rect x="520" y="132" width="270" height="52" rx="8" fill="#1a1010" stroke="#5a2a2a" stroke-width="1.5"/>
  <text x="655" y="163" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e05555" text-anchor="middle">분포 밖 — 점수가 무의미하다</text>

  <!-- Connectors -->
  <line x1="167" y1="184" x2="167" y2="208" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="440" y1="184" x2="440" y2="208" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="713" y1="184" x2="713" y2="208" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Axis -->
  <line x1="90" y1="214" x2="800" y2="214" stroke="#888" stroke-width="2" marker-end="url(#kl-axis)"/>
  <circle cx="167" cy="214" r="6" fill="#e05555"/>
  <circle cx="440" cy="214" r="6" fill="#55c555"/>
  <circle cx="713" cy="214" r="6" fill="#e05555"/>

  <text x="167" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">β가 크다</text>
  <text x="440" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">β = 0.02 (InstructGPT)</text>
  <text x="713" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">β = 0</text>

  <!-- Outcomes -->
  <rect x="60" y="266" width="213" height="64" rx="8" fill="#1a1010" stroke="#e05555" stroke-width="1"/>
  <text x="166" y="292" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#e05555" text-anchor="middle">정렬 안 됨</text>
  <text x="166" y="314" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">거의 움직이지 못한다</text>

  <rect x="333" y="266" width="213" height="64" rx="8" fill="#0d1a0d" stroke="#55c555" stroke-width="1"/>
  <text x="439" y="292" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#55c555" text-anchor="middle">정렬</text>
  <text x="439" y="314" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">아는 영역 안에서 움직인다</text>

  <rect x="606" y="266" width="213" height="64" rx="8" fill="#1a1010" stroke="#e05555" stroke-width="1"/>
  <text x="712" y="292" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#e05555" text-anchor="middle">보상 해킹</text>
  <text x="712" y="314" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">장황한 답으로 달아난다</text>
</svg>
