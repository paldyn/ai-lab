<svg xmlns="http://www.w3.org/2000/svg" width="880" height="594" viewBox="0 0 880 594" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="rl-flow" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="rl-out" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="594" rx="12" fill="#0a0a0a"/>

  <text x="60" y="50" font-size="22" font-weight="700" fill="#e8e8e8">실행 오류를 되먹이는 교정 루프</text>
  <text x="60" y="76" font-size="13" fill="#888">재시도 상한은 두 번이고, 고쳐지지 않는 오류는 즉시 사람에게 넘긴다</text>

  <rect x="60" y="100" width="460" height="72" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="84" y="130" font-size="15" font-weight="600" fill="#e8e8e8">1차 시도</text>
  <text x="84" y="152" font-size="13" fill="#888">질문 → SQL 생성 → 실행</text>

  <line x1="290" y1="172" x2="290" y2="198" stroke="#7777cc" stroke-width="2" marker-end="url(#rl-flow)"/>

  <rect x="60" y="198" width="460" height="72" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="84" y="228" font-size="15" font-weight="600" fill="#e05555">실행 실패</text>
  <text x="84" y="250" font-size="13" fill="#888">데이터베이스가 오류 메시지를 돌려준다</text>

  <line x1="520" y1="234" x2="580" y2="234" stroke="#e05555" stroke-width="2" marker-end="url(#rl-out)"/>
  <line x1="290" y1="270" x2="290" y2="296" stroke="#7777cc" stroke-width="2" marker-end="url(#rl-flow)"/>

  <rect x="60" y="296" width="460" height="146" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="84" y="326" font-size="15" font-weight="600" fill="#e8e8e8">오류 메시지를 붙여 재요청</text>
  <text x="496" y="326" font-size="13" fill="#7ec8e3" text-anchor="end">RetryableError</text>
  <rect x="84" y="340" width="412" height="60" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="100" y="364" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">column "region" does not exist</text>
  <text x="100" y="384" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">Perhaps you meant "orders.region"</text>
  <text x="84" y="422" font-size="13" fill="#888">문법 · 컬럼 · 타입 오류만 다시 시도한다</text>

  <line x1="290" y1="442" x2="290" y2="468" stroke="#7777cc" stroke-width="2" marker-end="url(#rl-flow)"/>

  <rect x="60" y="468" width="460" height="72" rx="10" fill="#12141a" stroke="#55c555" stroke-width="1.5"/>
  <text x="84" y="498" font-size="15" font-weight="600" fill="#55c555">2차 시도</text>
  <text x="84" y="520" font-size="13" fill="#888">첫 시도에서 실패한 쿼리가 대개 여기서 살아난다</text>

  <line x1="520" y1="504" x2="580" y2="504" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#rl-out)"/>

  <rect x="580" y="198" width="240" height="342" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="604" y="228" font-size="15" font-weight="600" fill="#e8e8e8">사람에게 넘긴다</text>
  <line x1="604" y1="246" x2="796" y2="246" stroke="#2a2f3a" stroke-width="1"/>
  <text x="604" y="276" font-size="13" font-weight="600" fill="#e05555">FatalError</text>
  <text x="604" y="298" font-size="12" fill="#888">권한 · 타임아웃</text>
  <text x="604" y="338" font-size="13" font-weight="600" fill="#e05555">2회에서도 실패</text>
  <text x="604" y="360" font-size="12" fill="#888">세 번째는 토큰만 쓴다</text>
  <line x1="604" y1="380" x2="796" y2="380" stroke="#2a2f3a" stroke-width="1"/>
  <text x="604" y="406" font-size="13" font-weight="600" fill="#e8e8e8">함께 보내는 것</text>
  <text x="604" y="430" font-size="12" fill="#888">원 질문 · 마지막 SQL</text>
  <text x="604" y="452" font-size="12" fill="#888">오류 메시지</text>
  <text x="604" y="474" font-size="12" fill="#888">자동 처리 안 된다는 한 줄</text>
  <text x="604" y="512" font-size="13" fill="#55c555">그 짝이 골든 질문이 된다</text>

  <text x="60" y="570" font-size="13" fill="#7777cc">두 번째에서도 실패한 것은 세 번째·네 번째에서도 거의 안 살아난다</text>
</svg>
