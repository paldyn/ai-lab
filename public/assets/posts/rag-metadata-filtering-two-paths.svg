<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">품질 조건과 권한 조건을 다른 통로로 넘긴다</text>
  <text x="60" y="72" font-size="13" fill="#888">모델이 만든 조건은 떼고 고칠 수 있다. 세션이 만든 조건은 검색 함수 안에서만 붙는다.</text>

  <text x="60" y="112" font-size="16" font-weight="600" fill="#7ec8e3">품질 조건 — 모델이 질문에서 뽑는다</text>

  <rect x="60" y="128" width="160" height="64" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="140" y="155" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">질문</text>
  <text x="140" y="175" font-size="11" fill="#888" text-anchor="middle">지난달 계약서</text>

  <rect x="260" y="128" width="160" height="64" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="340" y="155" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">조건 추출</text>
  <text x="340" y="175" font-size="11" fill="#888" text-anchor="middle">모델 · 후보일 뿐</text>

  <rect x="460" y="128" width="160" height="64" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="540" y="155" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">허용 목록 대조</text>
  <text x="540" y="175" font-size="11" fill="#888" text-anchor="middle">0건이면 떼고 재시도</text>

  <line x1="220" y1="160" x2="260" y2="160" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="420" y1="160" x2="460" y2="160" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="660" y="200" width="160" height="96" rx="8" fill="#101418" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="740" y="232" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">검색 함수</text>
  <text x="740" y="254" font-size="11" fill="#888" text-anchor="middle">품질 조건 AND</text>
  <text x="740" y="272" font-size="11" fill="#888" text-anchor="middle">권한 조건</text>

  <path d="M 620 160 L 740 160 L 740 200" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <text x="60" y="352" font-size="16" font-weight="600" fill="#55c555">권한 조건 — 서버가 세션에서 만든다</text>

  <rect x="60" y="368" width="160" height="64" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="140" y="395" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">로그인 세션</text>
  <text x="140" y="415" font-size="11" fill="#888" text-anchor="middle">사용자 · 소속</text>

  <rect x="260" y="368" width="360" height="64" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="440" y="395" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">볼 수 있는 범위</text>
  <text x="440" y="415" font-size="11" fill="#888" text-anchor="middle">모델이 닿지 않는다 · 0건이어도 떼지 않는다</text>

  <line x1="220" y1="400" x2="260" y2="400" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M 620 400 L 740 400 L 740 296" fill="none" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>
</svg>
