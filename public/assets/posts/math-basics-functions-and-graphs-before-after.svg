<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="340" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="flow" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">넣기 전에 손대는가, 나온 뒤에 손대는가</text>
  <text x="60" y="82" font-size="13" fill="#888">f(x) = 3x + 1 로 두 길을 나란히 따라간다</text>

  <text x="60" y="130" font-size="15" font-weight="600" fill="#7ec8e3">f(x + 1)</text>
  <rect x="150" y="108" width="120" height="44" rx="6" fill="#7ec8e3" fill-opacity="0.12" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="210" y="136" font-size="15" fill="#e8e8e8" text-anchor="middle">x + 1</text>
  <line x1="270" y1="130" x2="330" y2="130" stroke="#888" stroke-width="2" marker-end="url(#flow)"/>
  <rect x="340" y="108" width="120" height="44" rx="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="400" y="136" font-size="15" fill="#e8e8e8" text-anchor="middle">f 에 넣는다</text>
  <line x1="460" y1="130" x2="520" y2="130" stroke="#888" stroke-width="2" marker-end="url(#flow)"/>
  <text x="540" y="136" font-size="17" font-weight="700" fill="#7ec8e3">3(x + 1) + 1 = 3x + 4</text>
  <text x="150" y="172" font-size="13" fill="#888">먼저 1을 더한 것을 x 자리에 통째로 넣는다</text>

  <text x="60" y="240" font-size="15" font-weight="600" fill="#7777cc">f(x) + 1</text>
  <rect x="150" y="218" width="120" height="44" rx="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="210" y="246" font-size="15" fill="#e8e8e8" text-anchor="middle">f 에 넣는다</text>
  <line x1="270" y1="240" x2="330" y2="240" stroke="#888" stroke-width="2" marker-end="url(#flow)"/>
  <rect x="340" y="218" width="120" height="44" rx="6" fill="#7777cc" fill-opacity="0.12" stroke="#7777cc" stroke-width="1.5"/>
  <text x="400" y="246" font-size="15" fill="#e8e8e8" text-anchor="middle">+ 1</text>
  <line x1="460" y1="240" x2="520" y2="240" stroke="#888" stroke-width="2" marker-end="url(#flow)"/>
  <text x="540" y="246" font-size="17" font-weight="700" fill="#7777cc">(3x + 1) + 1 = 3x + 2</text>
  <text x="150" y="282" font-size="13" fill="#888">나온 값에 1을 더한다</text>

  <text x="60" y="318" font-size="14" fill="#e05555">같은 1을 더했는데 결과가 다르다. 순서가 결과를 바꾼다</text>
</svg>
