<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="jlArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="jlArrP" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">작은 사각형은 평행사변형으로 간다</text>
  <text x="60" y="76" font-size="13" fill="#888">f(x₁, x₂) = (x₁²x₂, x₁ + 3x₂) 를 a = (2, 3) 에서 — 같은 눈금으로 그렸다</text>

  <text x="110" y="126" font-size="16" font-weight="600" fill="#e8e8e8">입력 평면</text>
  <text x="110" y="148" font-size="13" fill="#888">a = (2, 3) 근처</text>

  <text x="460" y="126" font-size="16" font-weight="600" fill="#e8e8e8">출력 평면</text>
  <text x="460" y="148" font-size="13" fill="#888">f(a) = (12, 11) 근처</text>

  <rect x="170" y="288" width="22" height="22" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2"/>
  <circle cx="170" cy="310" r="5" fill="#e8e8e8"/>
  <text x="150" y="330" font-size="13" fill="#888" text-anchor="end">a</text>

  <path d="M 460 310 L 724 288 L 812 222 L 548 244 Z" fill="#7777cc" fill-opacity="0.18" stroke="#7777cc" stroke-width="2"/>
  <line x1="460" y1="310" x2="724" y2="288" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#jlArr)"/>
  <line x1="460" y1="310" x2="548" y2="244" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#jlArr)"/>
  <circle cx="460" cy="310" r="5" fill="#e8e8e8"/>
  <text x="440" y="330" font-size="13" fill="#888" text-anchor="end">f(a)</text>

  <text x="640" y="326" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">J 의 1열 = (12, 1)</text>
  <text x="576" y="228" font-size="13" font-weight="600" fill="#7ec8e3">J 의 2열 = (4, 3)</text>

  <line x1="250" y1="200" x2="400" y2="200" stroke="#7777cc" stroke-width="2.5" marker-end="url(#jlArrP)"/>
  <text x="325" y="186" font-size="16" font-weight="700" fill="#7777cc" text-anchor="middle">f</text>

  <text x="110" y="360" font-size="13" fill="#e8e8e8">한 변이 1 인 사각형 · 넓이 1</text>
  <text x="460" y="360" font-size="13" fill="#e8e8e8">평행사변형 · 넓이 |det J| = 32</text>
</svg>
