  <text x="350" y="235" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">L</text>

  <line x1="526" y1="185" x2="614" y2="226" stroke="#555" stroke-width="1.5"/>
