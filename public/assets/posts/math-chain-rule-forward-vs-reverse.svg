  <text x="510" y="190" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">w₁</text>
  <text x="510" y="235" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">w₂</text>
  <text x="510" y="280" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">w₃</text>
  <text x="630" y="235" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">층</text>
  <text x="750" y="235" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">L</text>

  <line x1="94" y1="330" x2="366" y2="330" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#fwd)"/>
  <line x1="766" y1="330" x2="494" y2="330" stroke="#55c555" stroke-width="2.5" marker-end="url(#rev)"/>

  <text x="60" y="368" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">한 번에 입력 하나 — 파라미터 수만큼 훑어야 한다</text>
  <text x="460" y="368" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">한 번에 출력 하나 — 손실이 하나라 한 번이면 끝</text>
