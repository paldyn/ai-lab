<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392">
  <rect x="0" y="0" width="880" height="392" rx="12" fill="#0a0a0a"/>

  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">근호 안의 덧셈은 밖으로 나오지 않는다</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">질러가는 길과 돌아가는 길을 같은 자로 잰다</text>

  <!-- 왼쪽: 직각삼각형 -->
  <path d="M 120 290 L 280 290 L 120 170 Z" fill="#7ec8e3" fill-opacity="0.10" stroke="#7ec8e3" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="120" y="276" width="14" height="14" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="200" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">4</text>
  <text x="106" y="236" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">3</text>
  <text x="216" y="218" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555">5</text>
  <text x="200" y="352" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888">다리 3과 4, 빗변 5</text>

  <!-- 오른쪽: 두 길이를 같은 자로 -->
  <text x="500" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e05555">√9 + √16 = 3 + 4 = 7</text>
  <rect x="500" y="190" width="120" height="16" fill="#e05555" fill-opacity="0.55" stroke="#e05555" stroke-width="1.5"/>
  <rect x="620" y="190" width="160" height="16" fill="#e05555" fill-opacity="0.25" stroke="#e05555" stroke-width="1.5"/>
  <text x="560" y="228" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">3</text>
  <text x="662" y="228" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">4</text>

  <text x="500" y="272" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">√(9 + 16) = √25 = 5</text>
  <rect x="500" y="286" width="200" height="16" fill="#55c555" fill-opacity="0.45" stroke="#55c555" stroke-width="1.5"/>
  <text x="600" y="324" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">5</text>

  <line x1="700" y1="190" x2="700" y2="338" stroke="#888" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="780" y1="190" x2="780" y2="338" stroke="#888" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="700" y1="338" x2="780" y2="338" stroke="#e8e8e8" stroke-width="2"/>
  <text x="740" y="360" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8">차이 2</text>
</svg>
