<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">약수는 짝지어 찾으면 빠뜨리지 않는다</text>
  <text x="60" y="82" font-size="13" fill="#888">36을 1부터 나눠 보되, 나누어떨어질 때마다 몫도 함께 적는다</text>

  <text x="200" y="118" font-size="13" fill="#888" text-anchor="middle">나눈 수</text>
  <text x="680" y="118" font-size="13" fill="#888" text-anchor="middle">몫</text>

  <rect x="150" y="134" width="100" height="40" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="200" y="160" font-size="17" fill="#e8e8e8" text-anchor="middle">1</text>
  <rect x="630" y="134" width="100" height="40" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="680" y="160" font-size="17" fill="#e8e8e8" text-anchor="middle">36</text>
  <line x1="250" y1="154" x2="630" y2="154" stroke="#7777cc" stroke-width="1.5"/>

  <rect x="150" y="184" width="100" height="40" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="200" y="210" font-size="17" fill="#e8e8e8" text-anchor="middle">2</text>
  <rect x="630" y="184" width="100" height="40" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="680" y="210" font-size="17" fill="#e8e8e8" text-anchor="middle">18</text>
  <line x1="250" y1="204" x2="630" y2="204" stroke="#7777cc" stroke-width="1.5"/>

  <rect x="150" y="234" width="100" height="40" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="200" y="260" font-size="17" fill="#e8e8e8" text-anchor="middle">3</text>
  <rect x="630" y="234" width="100" height="40" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="680" y="260" font-size="17" fill="#e8e8e8" text-anchor="middle">12</text>
  <line x1="250" y1="254" x2="630" y2="254" stroke="#7777cc" stroke-width="1.5"/>

  <rect x="150" y="284" width="100" height="40" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="200" y="310" font-size="17" fill="#e8e8e8" text-anchor="middle">4</text>
  <rect x="630" y="284" width="100" height="40" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="680" y="310" font-size="17" fill="#e8e8e8" text-anchor="middle">9</text>
  <line x1="250" y1="304" x2="630" y2="304" stroke="#7777cc" stroke-width="1.5"/>

  <rect x="380" y="334" width="120" height="40" rx="6" fill="#55c555" fill-opacity="0.14" stroke="#55c555" stroke-width="2"/>
  <text x="440" y="360" font-size="17" font-weight="700" fill="#55c555" text-anchor="middle">6 × 6</text>
  <text x="520" y="360" font-size="14" fill="#55c555">나눈 수와 몫이 만났다 — 여기서 멈춘다</text>

  <text x="200" y="360" font-size="13" fill="#888" text-anchor="middle">5는 나누어떨어지지 않아 건너뛴다</text>
</svg>
