<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="klDown" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">같은 식이 세 자리에서 다른 이름으로 불린다</text>

  <rect x="60" y="100" width="240" height="90" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="180" y="128" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">RLHF·DPO 페널티</text>
  <text x="180" y="150" font-size="13" fill="#7ec8e3" text-anchor="middle">β · D_KL(π ‖ π_ref)</text>
  <text x="180" y="172" font-size="13" fill="#9aa4b8" text-anchor="middle">역방향 · 봉우리에 붙듦</text>

  <rect x="320" y="100" width="240" height="90" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="440" y="128" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">지식 증류</text>
  <text x="440" y="150" font-size="13" fill="#7ec8e3" text-anchor="middle">D_KL(p_교사 ‖ q_학생)</text>
  <text x="440" y="172" font-size="13" fill="#9aa4b8" text-anchor="middle">정방향 · 다 덮게 한다</text>

  <rect x="580" y="100" width="240" height="90" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="700" y="128" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">ELBO의 간격</text>
  <text x="700" y="150" font-size="13" fill="#7ec8e3" text-anchor="middle">D_KL(q(z) ‖ p(z|x))</text>
  <text x="700" y="172" font-size="13" fill="#9aa4b8" text-anchor="middle">역방향 · 0이면 닿는다</text>

  <line x1="180" y1="190" x2="180" y2="258" stroke="#7ec8e3" stroke-width="2" marker-end="url(#klDown)"/>
  <line x1="440" y1="190" x2="440" y2="258" stroke="#7ec8e3" stroke-width="2" marker-end="url(#klDown)"/>
  <line x1="700" y1="190" x2="700" y2="258" stroke="#7ec8e3" stroke-width="2" marker-end="url(#klDown)"/>

  <rect x="60" y="260" width="760" height="70" rx="6" fill="#000000" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="288" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">D_KL(p ‖ q) = Σ p log(p / q)</text>
  <text x="440" y="310" font-size="13" fill="#888" text-anchor="middle">앞에 오는 분포가 벌점의 무게를 정한다 — 그 순서가 곧 학습의 성격이다</text>

  <text x="60" y="358" font-size="13" fill="#888">셋을 가르는 것은 계수의 크기가 아니라 어느 분포를 앞에 두었는가다</text>
</svg>
