<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#ce9178"/>
    </marker>
  </defs>

  <rect width="880" height="480" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">google-genai: 호출과 응답 읽기</text>

  <!-- 상단 흐름 -->
  <rect x="35" y="72" width="170" height="64" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="120" y="96" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">1. 클라이언트</text>
  <text x="120" y="116" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="11" fill="#9aa4b8" text-anchor="middle">genai.Client()</text>

  <line x1="205" y1="104" x2="245" y2="104" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="245" y="72" width="180" height="64" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="335" y="96" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">2. 생성 설정</text>
  <text x="335" y="116" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="11" fill="#9aa4b8" text-anchor="middle">GenerateContentConfig</text>

  <line x1="425" y1="104" x2="465" y2="104" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="465" y="72" width="190" height="64" rx="8" fill="#0f1a0f" stroke="#3a6e3a" stroke-width="1.5"/>
  <text x="560" y="96" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">3. 생성 호출</text>
  <text x="560" y="116" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="11" fill="#9aa4b8" text-anchor="middle">models.generate_content</text>

  <line x1="655" y1="104" x2="695" y2="104" stroke="#55c555" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="695" y="72" width="150" height="64" rx="8" fill="#1a0f0a" stroke="#6e5a3a" stroke-width="1.5"/>
  <text x="770" y="96" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#ce9178" text-anchor="middle">4. 응답 객체</text>
  <text x="770" y="116" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="11" fill="#9aa4b8" text-anchor="middle">candidates[0]</text>

  <!-- 코드 블록 -->
  <rect x="35" y="164" width="440" height="262" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="51" y="190" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">from</tspan><tspan fill="#ffffff"> google </tspan><tspan fill="#7ec8e3" font-weight="600">import</tspan><tspan fill="#ffffff"> genai</tspan></text>
  <text x="51" y="210" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">from</tspan><tspan fill="#ffffff"> google.genai </tspan><tspan fill="#7ec8e3" font-weight="600">import</tspan><tspan fill="#ffffff"> types</tspan></text>
  <text x="51" y="230" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">client = genai.Client()</tspan></text>
  <text x="51" y="250" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">MODEL = </tspan><tspan fill="#ce9178">"gemini-flash-latest"</tspan></text>
  <text x="51" y="270" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">cfg = types.GenerateContentConfig(</tspan></text>
  <text x="51" y="290" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    temperature=</tspan><tspan fill="#b5cea8">0.2</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="51" y="310" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    max_output_tokens=</tspan><tspan fill="#b5cea8">1024</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="51" y="330" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">r = client.models.generate_content(</tspan></text>
  <text x="51" y="350" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    model=MODEL, config=cfg,</tspan></text>
  <text x="51" y="370" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    contents=</tspan><tspan fill="#ce9178">"딥러닝이란?"</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="51" y="390" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">print</tspan><tspan fill="#ffffff">(r.candidates[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">].finish_reason)</tspan></text>
  <text x="51" y="410" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">print</tspan><tspan fill="#ffffff">(r.usage_metadata)</tspan></text>

  <!-- 응답 읽는 순서 -->
  <text x="675" y="184" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">응답을 읽는 순서</text>

  <rect x="515" y="200" width="330" height="60" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="680" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">① candidates가 있는가</text>
  <text x="680" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">없으면 입력 차단 · prompt_feedback.block_reason</text>

  <line x1="680" y1="260" x2="680" y2="290" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="515" y="290" width="330" height="60" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="680" y="314" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">② finish_reason은 무엇인가</text>
  <text x="680" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">STOP · MAX_TOKENS(잘림) · SAFETY(출력 차단)</text>

  <line x1="680" y1="350" x2="680" y2="380" stroke="#ce9178" stroke-width="2" marker-end="url(#arr-o)"/>

  <rect x="515" y="380" width="330" height="60" rx="8" fill="#1a0f0a" stroke="#6e5a3a" stroke-width="1.5"/>
  <text x="680" y="404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#ce9178" text-anchor="middle">③ text · parsed를 쓴다</text>
  <text x="680" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">None일 수 있다 · usage_metadata를 기록</text>
</svg>
