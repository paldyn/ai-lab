<svg xmlns="http://www.w3.org/2000/svg" width="880" height="636" viewBox="0 0 880 636" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="636" rx="12" fill="#0a0a0a"/>

  <text x="110" y="46" font-size="22" font-weight="700" fill="#e8e8e8">따라서 · 즉 · 한편이 앞 줄과 잇는 방식</text>
  <text x="110" y="70" font-size="13" fill="#888">연속한 두 자연수의 곱 n(n+1)은 짝수다 — 본문의 일곱 줄</text>

  <rect x="170" y="96" width="420" height="40" rx="6" fill="#111418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="194" y="121" font-size="14" fill="#e8e8e8">① n이 짝수인 경우, n = 2k</text>
  <rect x="170" y="148" width="420" height="40" rx="6" fill="#111418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="194" y="173" font-size="14" fill="#e8e8e8">② <tspan fill="#7ec8e3" font-weight="600">따라서</tspan> n(n+1) = 2k(n+1)</text>
  <rect x="170" y="200" width="420" height="40" rx="6" fill="#111418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="194" y="225" font-size="14" fill="#e8e8e8">③ <tspan fill="#55c555" font-weight="600">즉</tspan> n(n+1)은 2의 배수</text>

  <line x1="110" y1="262" x2="440" y2="262" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="456" y="267" font-size="14" font-weight="600" fill="#7777cc">한편 — 새 갈래</text>

  <rect x="170" y="284" width="420" height="40" rx="6" fill="#111418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="194" y="309" font-size="14" fill="#e8e8e8">④ <tspan fill="#7777cc" font-weight="600">한편</tspan> n이 홀수인 경우, n+1 = 2k</text>
  <rect x="170" y="336" width="420" height="40" rx="6" fill="#111418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="194" y="361" font-size="14" fill="#e8e8e8">⑤ <tspan fill="#7ec8e3" font-weight="600">따라서</tspan> n(n+1) = 2kn</text>
  <rect x="170" y="388" width="420" height="40" rx="6" fill="#111418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="194" y="413" font-size="14" fill="#e8e8e8">⑥ <tspan fill="#55c555" font-weight="600">즉</tspan> n(n+1)은 2의 배수</text>

  <rect x="170" y="464" width="420" height="40" rx="6" fill="#0f1a10" stroke="#55c555" stroke-width="1.5"/>
  <text x="194" y="489" font-size="14" fill="#e8e8e8">⑦ <tspan fill="#7ec8e3" font-weight="600">따라서</tspan> 어느 경우든 n(n+1)은 짝수</text>

  <!-- 따라서: 근거 줄에서 오는 화살표 -->
  <path d="M 590 112 C 626 112 626 168 590 168" stroke="#7ec8e3" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <text x="634" y="145" font-size="13" fill="#7ec8e3">①에서</text>
  <path d="M 590 300 C 626 300 626 356 590 356" stroke="#7ec8e3" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <text x="634" y="333" font-size="13" fill="#7ec8e3">④에서</text>
  <path d="M 590 220 C 770 220 770 478 590 478" stroke="#7ec8e3" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <path d="M 590 408 C 660 408 660 490 590 490" stroke="#7ec8e3" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <text x="742" y="392" font-size="13" font-weight="600" fill="#7ec8e3">근거 둘</text>
  <text x="742" y="412" font-size="13" fill="#7ec8e3">③과 ⑥</text>

  <!-- 즉: 같은 내용을 묶는 괄호 -->
  <path d="M 170 162 H 142 V 226 H 170" stroke="#55c555" stroke-width="2.5" fill="none"/>
  <text x="128" y="199" font-size="15" font-weight="600" fill="#55c555" text-anchor="end">즉</text>
  <path d="M 170 350 H 142 V 414 H 170" stroke="#55c555" stroke-width="2.5" fill="none"/>
  <text x="128" y="387" font-size="15" font-weight="600" fill="#55c555" text-anchor="end">즉</text>

  <!-- 범례 -->
  <line x1="110" y1="540" x2="160" y2="540" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="178" y="545" font-size="13" fill="#e8e8e8">따라서 · 그러므로 — 화살표가 시작하는 줄이 근거다 (하나일 수도 여럿일 수도)</text>
  <path d="M 160 560 H 134 V 580 H 160" stroke="#55c555" stroke-width="2.5" fill="none"/>
  <text x="178" y="575" font-size="13" fill="#e8e8e8">즉 · 다시 말해 — 묶인 두 줄은 같은 내용을 다른 꼴로 적은 것</text>
  <line x1="110" y1="602" x2="160" y2="602" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="178" y="607" font-size="13" fill="#e8e8e8">한편 — 앞 줄과 끊고 새 갈래를 연다. 갈래는 뒤에서 다시 합쳐진다</text>
</svg>
