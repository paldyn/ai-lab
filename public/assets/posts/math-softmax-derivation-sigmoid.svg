<text x="582" y="194" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">p₁ = e^z₁ / (e^z₁ + e^z₀)</text>
<text x="582" y="222" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">  = 1 / (1 + e^−(z₁−z₀))</text>
<text x="582" y="254" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" fill="#7ec8e3" font-weight="600">  = σ(d)</text>
<text x="60" y="412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">d = 0 이면 0.5 — 점수가 같으면 반반이다. d 가 커질수록 1에 다가가지만 결코 1이 되지는 않는다.</text>
