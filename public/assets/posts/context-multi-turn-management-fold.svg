<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330">
  <rect x="0" y="0" width="880" height="330" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">턴이 쌓이고, 한계에 닿으면 접고, 다시 채운다</text>

  <rect x="60" y="120" width="770" height="90" rx="10" fill="#101010" stroke="#333333" stroke-width="1.5"/>

