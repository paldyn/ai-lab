  <text x="60" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">시스템 블록은 어느 단계에서도 접지 않는다. 접히는 것은 오래된 턴뿐이고, 최근 턴은 원문 그대로 남는다.</text>
