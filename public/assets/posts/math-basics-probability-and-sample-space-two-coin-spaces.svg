<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<rect x="0" y="0" width="880" height="380" rx="12" fill="#0a0a0a"/>
<text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">동전 두 개 — 같은 시행, 두 표본공간</text>
<text x="440" y="70" text-anchor="middle" font-size="13" fill="#888">상자의 폭이 그 원소가 나올 확률이다 · 초록은 「하나씩」</text>
<text x="230" y="118" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">셋으로 잡으면</text>
<rect x="60" y="140" width="85" height="90" rx="6" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="102.5" y="179" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">앞앞</text>
<text x="102.5" y="203" text-anchor="middle" font-size="13" fill="#e8e8e8">1/4</text>
<rect x="145" y="140" width="170" height="90" rx="6" fill="#55c555" fill-opacity="0.18" stroke="#55c555" stroke-width="1.5"/>
<text x="230.0" y="179" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">앞뒤</text>
<text x="230.0" y="203" text-anchor="middle" font-size="13" fill="#e8e8e8">1/2</text>
<rect x="315" y="140" width="85" height="90" rx="6" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="357.5" y="179" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">뒤뒤</text>
<text x="357.5" y="203" text-anchor="middle" font-size="13" fill="#e8e8e8">1/4</text>
<text x="230" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#e05555">등확률이 아니다</text>
<text x="230" y="300" text-anchor="middle" font-size="13" fill="#888">세어서 나누면 1/3 — 틀린 값</text>
<text x="230" y="322" text-anchor="middle" font-size="13" fill="#888">앞뒤 한 칸에 길이 둘 들어 있다</text>
<text x="650" y="118" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">넷으로 잡으면</text>
<rect x="480" y="140" width="85" height="90" rx="6" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="522.5" y="179" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">앞앞</text>
<text x="522.5" y="203" text-anchor="middle" font-size="13" fill="#e8e8e8">1/4</text>
<rect x="565" y="140" width="85" height="90" rx="6" fill="#55c555" fill-opacity="0.18" stroke="#55c555" stroke-width="1.5"/>
<text x="607.5" y="179" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">앞뒤</text>
<text x="607.5" y="203" text-anchor="middle" font-size="13" fill="#e8e8e8">1/4</text>
<rect x="650" y="140" width="85" height="90" rx="6" fill="#55c555" fill-opacity="0.18" stroke="#55c555" stroke-width="1.5"/>
<text x="692.5" y="179" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">뒤앞</text>
<text x="692.5" y="203" text-anchor="middle" font-size="13" fill="#e8e8e8">1/4</text>
<rect x="735" y="140" width="85" height="90" rx="6" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="777.5" y="179" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">뒤뒤</text>
<text x="777.5" y="203" text-anchor="middle" font-size="13" fill="#e8e8e8">1/4</text>
<text x="650" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">등확률이다</text>
<text x="650" y="300" text-anchor="middle" font-size="13" fill="#888">세어서 나누면 2/4 = 1/2</text>
<text x="650" y="322" text-anchor="middle" font-size="13" fill="#888">동전을 첫째·둘째로 구별했다</text>
</svg>
