<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
  <rect width="880" height="460" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">훈련 길이 밖으로 나갈 때의 회전 각도</text>
  <text x="440" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#888" text-anchor="middle">d = 128 · 훈련 4,096 → 확장 32,768 · 막대 전체가 한 바퀴 360°</text>

  <text x="385" y="100" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e8e8e8" text-anchor="middle">빠른 대역 (i = 0)</text>
  <text x="685" y="100" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e8e8e8" text-anchor="middle">느린 대역 (i = 63)</text>

  <!-- 1행 · 그대로 외삽 -->
  <rect x="60" y="112" width="160" height="80" fill="#0d1117" rx="6" stroke="#e05555" stroke-width="1.2"/>
  <text x="140" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">그대로 외삽</text>
  <text x="140" y="166" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">4,096 → 32,768</text>

  <rect x="250" y="112" width="270" height="80" fill="#111827" rx="6"/>
  <rect x="266" y="128" width="238" height="14" fill="#1a2a4a" rx="3"/>
  <rect x="266" y="128" width="238" height="14" fill="#55c555" opacity="0.7" rx="3"/>
  <text x="266" y="160" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e8e8e8">훈련 중 수백 바퀴를 돌아</text>
  <text x="266" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">모든 각도를 겪었다</text>

  <rect x="550" y="112" width="270" height="80" fill="#111827" rx="6"/>
  <rect x="566" y="128" width="238" height="14" fill="#1a2a4a" rx="3"/>
  <rect x="566" y="128" width="18" height="14" fill="#55c555" opacity="0.7"/>
  <rect x="584" y="128" width="125" height="14" fill="#e05555" opacity="0.7"/>
  <text x="566" y="160" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e8e8e8">훈련 0° ~ 27°, 확장 217°</text>
  <text x="566" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555">본 적 없는 각도 영역</text>

  <!-- 2행 · PI -->
  <rect x="60" y="200" width="160" height="80" fill="#0d1117" rx="6" stroke="#ce9178" stroke-width="1.2"/>
  <text x="140" y="232" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#ce9178" text-anchor="middle">PI</text>
  <text x="140" y="254" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">위치를 1/8로 축소</text>

  <rect x="250" y="200" width="270" height="80" fill="#111827" rx="6"/>
  <rect x="266" y="216" width="238" height="14" fill="#1a2a4a" rx="3"/>
  <rect x="266" y="216" width="30" height="14" fill="#ce9178" opacity="0.85" rx="3"/>
  <text x="266" y="248" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e8e8e8">간격 1라디안 → 0.125라디안</text>
  <text x="266" y="266" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#ce9178">짧은 거리 구별력이 준다</text>

  <rect x="550" y="200" width="270" height="80" fill="#111827" rx="6"/>
  <rect x="566" y="216" width="238" height="14" fill="#1a2a4a" rx="3"/>
  <rect x="566" y="216" width="18" height="14" fill="#55c555" opacity="0.7"/>
  <text x="566" y="248" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e8e8e8">217° → 27°</text>
  <text x="566" y="266" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">훈련 범위 안으로 들어온다</text>

  <!-- 3행 · YaRN -->
  <rect x="60" y="288" width="160" height="80" fill="#0d1117" rx="6" stroke="#55c555" stroke-width="1.2"/>
  <text x="140" y="320" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">YaRN</text>
  <text x="140" y="342" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">대역별 다른 스케일</text>

  <rect x="250" y="288" width="270" height="80" fill="#111827" rx="6"/>
  <rect x="266" y="304" width="238" height="14" fill="#1a2a4a" rx="3"/>
  <rect x="266" y="304" width="238" height="14" fill="#55c555" opacity="0.7" rx="3"/>
  <text x="266" y="336" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e8e8e8">거의 손대지 않고 그대로 외삽</text>
  <text x="266" y="354" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555">짧은 거리 구별력을 지킨다</text>

  <rect x="550" y="288" width="270" height="80" fill="#111827" rx="6"/>
  <rect x="566" y="304" width="238" height="14" fill="#1a2a4a" rx="3"/>
  <rect x="566" y="304" width="18" height="14" fill="#55c555" opacity="0.7"/>
  <text x="566" y="336" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e8e8e8">주기가 훈련 길이보다 긴</text>
  <text x="566" y="354" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">느린 대역만 눌러 담는다</text>

  <text x="440" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">세 방법 모두 RoPE 수식은 그대로 두고 위치 인덱스나 주파수만 다시 잰다</text>
</svg>
