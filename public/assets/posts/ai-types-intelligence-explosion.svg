<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 540"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <defs>
    <marker id="loopArr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">지능 폭발 논증 — 되먹임과 네 전제</text>
  <text x="440" y="74" text-anchor="middle" font-size="13" fill="#888">발산은 결론이 아니라 가정을 다시 쓴 것입니다</text>

  <!-- Left: the feedback loop -->
  <text x="235" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#e05555">재귀적 자기 개선</text>

  <rect x="95" y="128" width="280" height="60" fill="#1f0f0f" rx="8" stroke="#e05555" stroke-width="1.5"/>
  <text x="235" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">사람보다 뛰어난 기계</text>
  <text x="235" y="172" text-anchor="middle" font-size="11.5" fill="#888">할 수 있는 일에 기계 설계도 든다</text>

  <line x1="235" y1="188" x2="235" y2="216" stroke="#e05555" stroke-width="2" marker-end="url(#loopArr)"/>

  <rect x="95" y="216" width="280" height="60" fill="#1f0f0f" rx="8" stroke="#e05555" stroke-width="1.5"/>
  <text x="235" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">더 나은 기계를 설계한다</text>
  <text x="235" y="260" text-anchor="middle" font-size="11.5" fill="#888">다음 세대가 만들어진다</text>

  <line x1="235" y1="276" x2="235" y2="304" stroke="#e05555" stroke-width="2" marker-end="url(#loopArr)"/>

  <rect x="95" y="304" width="280" height="60" fill="#1f0f0f" rx="8" stroke="#e05555" stroke-width="1.5"/>
  <text x="235" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">다음 세대는 더 빨리 만든다</text>
  <text x="235" y="348" text-anchor="middle" font-size="11.5" fill="#888">능력이 짧은 기간에 커진다</text>

  <path d="M 375 334 C 415 334, 415 158, 375 158" fill="none" stroke="#e05555" stroke-width="2" marker-end="url(#loopArr)"/>

  <text x="235" y="390" text-anchor="middle" font-size="12" fill="#888">되먹임 — 다음 세대가 그다음을 더 빨리 만든다</text>

  <!-- Right: the four premises -->
  <text x="645" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#7ec8e3">식이 서려면 필요한 넷</text>

  <rect x="470" y="128" width="350" height="60" fill="#0f1a1f" rx="8" stroke="#7ec8e3" stroke-width="1.2"/>
  <text x="494" y="152" font-size="13" fill="#e8e8e8">① 지능이 하나의 축 위의 양이다</text>
  <text x="494" y="172" font-size="11.5" fill="#888">여러 능력이면 하나로 못 묶는다</text>

  <rect x="470" y="196" width="350" height="60" fill="#0f1a1f" rx="8" stroke="#7ec8e3" stroke-width="1.2"/>
  <text x="494" y="220" font-size="13" fill="#e8e8e8">② 개선 속도가 그 양에 비례한다</text>
  <text x="494" y="240" font-size="11.5" fill="#888">이 가정이 곧 폭발이라는 결론이다</text>

  <rect x="470" y="264" width="350" height="60" fill="#0f1a1f" rx="8" stroke="#7ec8e3" stroke-width="1.2"/>
  <text x="494" y="288" font-size="13" fill="#e8e8e8">③ 개선 난이도가 세대마다 일정하다</text>
  <text x="494" y="308" font-size="11.5" fill="#888">수확이 체감하면 곡선은 완만해진다</text>

  <rect x="470" y="332" width="350" height="60" fill="#0f1a1f" rx="8" stroke="#7ec8e3" stroke-width="1.2"/>
  <text x="494" y="356" font-size="13" fill="#e8e8e8">④ 자원이 함께 늘지 않는다</text>
  <text x="494" y="376" font-size="11.5" fill="#888">데이터 · 계산 장비 · 전력 · 실험</text>

  <!-- Bottom note -->
  <rect x="60" y="424" width="760" height="64" fill="#141414" rx="8" stroke="#333" stroke-width="1"/>
  <text x="440" y="446" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">넷 가운데 하나라도 깨지면 곡선은 발산하지 않는다</text>
  <text x="440" y="466" text-anchor="middle" font-size="12" fill="#888">I(n+1) = I(n) + α I(n)²  —  가정을 넣었으니 폭발이 나온 것입니다.</text>
</svg>
