<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="450" rx="12" fill="#0a0a0a"/>
  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">첨자가 나타나는 횟수로 읽기</text>
  <text x="60" y="82" font-size="13" fill="#888">아인슈타인 규약은 한 항 안에서 같은 글자를 센다</text>
  <rect x="60" y="106" width="760" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="440" y="145" font-size="20" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono','Menlo','Consolas',monospace">y[<tspan fill="#55c555" font-weight="600">i</tspan>] = A[<tspan fill="#55c555" font-weight="600">i</tspan>, <tspan fill="#e05555" font-weight="600">j</tspan>] · x[<tspan fill="#e05555" font-weight="600">j</tspan>]</text>
  <rect x="60" y="196" width="214" height="138" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="84" y="232" font-size="16" font-weight="600" fill="#e8e8e8">한 번</text>
  <text x="84" y="260" font-size="15" font-weight="600" fill="#55c555">자유 첨자</text>
  <text x="84" y="286" font-size="13" fill="#e8e8e8">결과에 남는다</text>
  <text x="84" y="310" font-size="13" fill="#888" font-family="'JetBrains Mono','Menlo','Consolas',monospace">i — A[i,j]의 i</text>
  <rect x="333" y="196" width="214" height="138" rx="6" fill="#101010" stroke="#e05555" stroke-width="1.5"/>
  <text x="357" y="232" font-size="16" font-weight="600" fill="#e8e8e8">두 번</text>
  <text x="357" y="260" font-size="15" font-weight="600" fill="#e05555">더미 첨자</text>
  <text x="357" y="286" font-size="13" fill="#e8e8e8">자동으로 합한다</text>
  <text x="357" y="310" font-size="13" fill="#888" font-family="'JetBrains Mono','Menlo','Consolas',monospace">j — A[i,j]·x[j]</text>
  <rect x="606" y="196" width="214" height="138" rx="6" fill="#101010" stroke="#7777cc" stroke-width="1.5"/>
  <text x="630" y="232" font-size="16" font-weight="600" fill="#e8e8e8">세 번 이상</text>
  <text x="630" y="260" font-size="15" font-weight="600" fill="#7777cc">규약 밖의 식</text>
  <text x="630" y="286" font-size="13" fill="#e8e8e8">einsum은 그대로 합</text>
  <text x="630" y="310" font-size="13" fill="#888" font-family="'JetBrains Mono','Menlo','Consolas',monospace">'i,i,i->' → 270</text>
  <rect x="60" y="358" width="760" height="64" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="385" font-size="13" font-weight="600" fill="#e8e8e8">규약은 횟수로 합을 정하고, einsum은 -&gt; 오른쪽에 적혔는지로 정한다</text>
  <text x="84" y="406" font-size="13" fill="#888">그래서 einsum에서는 세 번 나온 글자도 오른쪽에 없으면 합쳐진다</text>
</svg>
