<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="stArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#c58a55"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">비율을 베끼면 드문 갈래가 사라진다</text>
  <text x="60" y="72" font-size="13" fill="#888">같은 300건을 뽑아도 나누는 방식에 따라 볼 수 있는 것이 달라진다.</text>

  <text x="140" y="118" font-size="13" font-weight="600" fill="#e8e8e8">운영 로그에 실제로 오는 비율</text>

  <rect x="140" y="128" width="397" height="56" rx="3" fill="#2b2b52" stroke="#7777cc" stroke-width="1"/>
  <text x="338" y="162" font-size="13" fill="#e8e8e8" text-anchor="middle">배송 조회 62%</text>
  <rect x="537" y="128" width="134" height="56" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <text x="604" y="162" font-size="13" fill="#e8e8e8" text-anchor="middle">반품 21%</text>
  <rect x="671" y="128" width="58" height="56" rx="3" fill="#3a1f1f" stroke="#e05555" stroke-width="1"/>
  <rect x="729" y="128" width="19" height="56" rx="3" fill="#33260f" stroke="#c58a55" stroke-width="1"/>
  <rect x="748" y="128" width="32" height="56" rx="3" fill="#1c1c1c" stroke="#555" stroke-width="1"/>

  <path d="M 700 184 L 700 210 L 492 210 L 492 280" fill="none" stroke="#c58a55" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#stArr)"/>
  <path d="M 738 184 L 738 232 L 620 232 L 620 280" fill="none" stroke="#c58a55" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#stArr)"/>

  <text x="140" y="270" font-size="13" font-weight="600" fill="#e8e8e8">골든 데이터셋에서 준 자리</text>

  <rect x="140" y="280" width="160" height="56" rx="3" fill="#2b2b52" stroke="#7777cc" stroke-width="1"/>
  <text x="220" y="314" font-size="13" fill="#e8e8e8" text-anchor="middle">배송 조회 25%</text>
  <rect x="300" y="280" width="128" height="56" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <text x="364" y="314" font-size="13" fill="#e8e8e8" text-anchor="middle">반품 20%</text>
  <rect x="428" y="280" width="128" height="56" rx="3" fill="#3a1f1f" stroke="#e05555" stroke-width="1"/>
  <text x="492" y="314" font-size="13" fill="#e8e8e8" text-anchor="middle">결제 오류 20%</text>
  <rect x="556" y="280" width="128" height="56" rx="3" fill="#33260f" stroke="#c58a55" stroke-width="1"/>
  <text x="620" y="314" font-size="13" fill="#e8e8e8" text-anchor="middle">규정 문의 20%</text>
  <rect x="684" y="280" width="96" height="56" rx="3" fill="#1c1c1c" stroke="#555" stroke-width="1"/>
  <text x="732" y="314" font-size="13" fill="#e8e8e8" text-anchor="middle">그 외 15%</text>

  <text x="60" y="382" font-size="13" fill="#e8e8e8">위에서 무작위로 300건을 뽑으면 규정 문의는 아홉 건이다. 아홉 건으로는 그 갈래가 좋아졌는지 나빠졌는지 말할 수 없다.</text>
  <text x="60" y="408" font-size="13" fill="#888">층을 나눠 뽑으면 같은 300건 안에서 규정 문의가 60건이 된다. 대신 배송 조회의 자리가 그만큼 줄어든다.</text>
</svg>
