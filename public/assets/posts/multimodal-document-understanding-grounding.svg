<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="duArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">값만 뽑지 말고 어디서 나왔는지 함께 뽑는다</text>
  <text x="62" y="68" font-size="13" fill="#888">좌표가 붙어 있으면 사람이 3초 만에 확인한다. 없으면 문서를 다시 열어야 한다.</text>

  <rect x="62" y="100" width="278" height="270" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="86" y="124" font-size="11" fill="#5a6472">세금계산서 · 3쪽</text>
  <line x1="86" y1="132" x2="316" y2="132" stroke="#2a3550" stroke-width="1"/>

  <rect x="86" y="148" width="180" height="5" rx="2" fill="#2a3550"/>
  <rect x="86" y="162" width="150" height="5" rx="2" fill="#2a3550"/>

  <rect x="86" y="186" width="230" height="34" rx="4" fill="#16202c" stroke="#2a3550" stroke-width="1"/>
  <text x="98" y="207" font-size="11" fill="#8a94a8">공급가액</text>
  <rect x="196" y="190" width="116" height="26" rx="4" fill="#14261a" stroke="#55c555" stroke-width="2"/>
  <text x="254" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#55c555">12,500,000</text>

  <rect x="86" y="232" width="230" height="34" rx="4" fill="#16202c" stroke="#2a3550" stroke-width="1"/>
  <text x="98" y="253" font-size="11" fill="#8a94a8">세액</text>
  <text x="254" y="253" text-anchor="middle" font-size="12" fill="#8a94a8">1,250,000</text>

  <rect x="86" y="290" width="230" height="5" rx="2" fill="#232c3d"/>
  <rect x="86" y="304" width="196" height="5" rx="2" fill="#232c3d"/>
  <rect x="86" y="318" width="210" height="5" rx="2" fill="#232c3d"/>
  <text x="201" y="356" text-anchor="middle" font-size="10" fill="#5a6472">— 3 —</text>

  <line x1="396" y1="203" x2="320" y2="203" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#duArr)"/>

  <rect x="400" y="100" width="418" height="212" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="418" y="128" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">{</tspan></text>
  <text x="418" y="147" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">"field"</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">"공급가액"</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="418" y="166" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">"value"</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#b5cea8">12500000</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="418" y="185" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">"page"</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#b5cea8">3</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="418" y="204" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">"bbox"</tspan><tspan fill="#ffffff">: [</tspan><tspan fill="#b5cea8">412</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">688</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">553</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">706</tspan><tspan fill="#ffffff">],</tspan></text>
  <text x="418" y="223" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">"source"</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">"table"</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="418" y="242" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">"confidence"</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#b5cea8">0.94</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="418" y="261" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">"verbatim"</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">"12,500,000"</tspan></text>
  <text x="418" y="280" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">}</tspan></text>
  <text x="418" y="299" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">// 필드 하나에 근거 하나</tspan></text>

  <text x="400" y="344" font-size="13" font-weight="600" fill="#e8e8e8">이 네 칸이 사람 검수를 가능하게 만든다</text>
  <text x="400" y="368" font-size="12" fill="#9aa4b8">page · bbox — 어디를 보면 되는지 알려 준다</text>
  <text x="400" y="388" font-size="12" fill="#9aa4b8">confidence — 낮은 것만 골라 사람에게 보낸다</text>
  <text x="400" y="408" font-size="12" fill="#9aa4b8">verbatim — 모델이 손댄 값인지 원문 그대로인지 가른다</text>
</svg>
