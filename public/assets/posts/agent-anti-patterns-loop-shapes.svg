<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <marker id="aplArr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect width="880" height="440" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">무한 루프의 세 모양</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">모양마다 걸리는 상한이 다르다</text>

  <text x="84" y="104" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#888">루프가 도는 모양</text>
  <text x="740" y="104" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#888">잡는 상한</text>

  <!-- Row 1 -->
  <rect x="60" y="118" width="560" height="70" rx="8" fill="#1a0a0a" stroke="#e05555" stroke-width="2"/>
  <text x="84" y="140" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">① 같은 인자로 같은 도구 반복</text>
  <text x="84" y="158" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">빈 결과가 「없음」인지 「아직」인지 안 적혀 있다</text>
  <text x="84" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">모델은 판단이 안 바뀌므로 같은 호출을 다시 낸다</text>
  <line x1="620" y1="153" x2="660" y2="153" stroke="#7ec8e3" stroke-width="2" marker-end="url(#aplArr)"/>
  <rect x="660" y="118" width="160" height="70" rx="8" fill="#0a1a1a" stroke="#7ec8e3" stroke-width="2"/>
  <text x="740" y="148" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">중복 해시</text>
  <text x="740" y="168" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">3회에서 차단</text>

  <!-- Row 2 -->
  <rect x="60" y="212" width="560" height="70" rx="8" fill="#1a0a0a" stroke="#e05555" stroke-width="2"/>
  <text x="84" y="234" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">② 인자를 조금씩 바꿔 돌기</text>
  <text x="84" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">「2026년 매출」·「2026 년 매출」·「매출 2026년」</text>
  <text x="84" y="270" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">문자열이 달라 다른 호출로 세어진다</text>
  <line x1="620" y1="247" x2="660" y2="247" stroke="#7ec8e3" stroke-width="2" marker-end="url(#aplArr)"/>
  <rect x="660" y="212" width="160" height="70" rx="8" fill="#0a1a1a" stroke="#7ec8e3" stroke-width="2"/>
  <text x="740" y="242" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">정규화 후 해시</text>
  <text x="740" y="262" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">공백·대소문자까지만</text>

  <!-- Row 3 -->
  <rect x="60" y="306" width="560" height="70" rx="8" fill="#1a0a0a" stroke="#e05555" stroke-width="2"/>
  <text x="84" y="328" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">③ 에이전트 핑퐁</text>
  <text x="84" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">리서치가 데이터로 넘기고 데이터가 되넘긴다</text>
  <text x="84" y="364" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">각자는 2회뿐이라 에이전트별 상한에 안 걸린다</text>
  <line x1="620" y1="341" x2="660" y2="341" stroke="#7ec8e3" stroke-width="2" marker-end="url(#aplArr)"/>
  <rect x="660" y="306" width="160" height="70" rx="8" fill="#0a1a1a" stroke="#7ec8e3" stroke-width="2"/>
  <text x="740" y="336" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">세션 전체 상한</text>
  <text x="740" y="356" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">넘김 횟수를 따로</text>

  <!-- Footer note -->
  <rect x="60" y="396" width="760" height="30" rx="8" fill="#111111" stroke="#7777cc" stroke-width="1"/>
  <text x="440" y="416" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">상한 셋(호출 수 · 벽시계 시간 · 중복 해시)은 실행기를 만드는 한 함수에 모아 둔다</text>
</svg>
