<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
<text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">충돌 확률은 각도에 정확히 선형이다</text>
<line x1="140" y1="340" x2="800" y2="340" stroke="#888" stroke-width="1.5"/>
<line x1="140" y1="340" x2="140" y2="95" stroke="#888" stroke-width="1.5"/>
<line x1="140.0" y1="105" x2="800.0" y2="340" stroke="#7777cc" stroke-width="2.5"/>
<circle cx="177" cy="118" r="5" fill="#e8e8e8"/>
<circle cx="250" cy="144" r="5" fill="#e8e8e8"/>
<circle cx="305" cy="164" r="5" fill="#e8e8e8"/>
<circle cx="360" cy="183" r="5" fill="#e8e8e8"/>
<circle cx="470" cy="222" r="5" fill="#e8e8e8"/>
<circle cx="580" cy="262" r="5" fill="#e8e8e8"/>
<line x1="140" y1="340" x2="140" y2="346" stroke="#444" stroke-width="1.5"/>
<text x="140" y="364" font-size="13" fill="#888" text-anchor="middle">0°</text>
<line x1="250" y1="340" x2="250" y2="346" stroke="#444" stroke-width="1.5"/>
<text x="250" y="364" font-size="13" fill="#888" text-anchor="middle">30°</text>
<line x1="360" y1="340" x2="360" y2="346" stroke="#444" stroke-width="1.5"/>
<text x="360" y="364" font-size="13" fill="#888" text-anchor="middle">60°</text>
<line x1="470" y1="340" x2="470" y2="346" stroke="#444" stroke-width="1.5"/>
<text x="470" y="364" font-size="13" fill="#888" text-anchor="middle">90°</text>
<line x1="580" y1="340" x2="580" y2="346" stroke="#444" stroke-width="1.5"/>
<text x="580" y="364" font-size="13" fill="#888" text-anchor="middle">120°</text>
<line x1="690" y1="340" x2="690" y2="346" stroke="#444" stroke-width="1.5"/>
<text x="690" y="364" font-size="13" fill="#888" text-anchor="middle">150°</text>
<line x1="800" y1="340" x2="800" y2="346" stroke="#444" stroke-width="1.5"/>
<text x="800" y="364" font-size="13" fill="#888" text-anchor="middle">180°</text>
<text x="470" y="390" font-size="13" fill="#888" text-anchor="middle">두 벡터 사이의 각 θ</text>
<line x1="134" y1="340" x2="140" y2="340" stroke="#444" stroke-width="1.5"/>
<text x="128" y="345" font-size="13" fill="#888" text-anchor="end">0</text>
<line x1="134" y1="281" x2="140" y2="281" stroke="#444" stroke-width="1.5"/>
<text x="128" y="286" font-size="13" fill="#888" text-anchor="end">0.25</text>
<line x1="134" y1="222" x2="140" y2="222" stroke="#444" stroke-width="1.5"/>
<text x="128" y="228" font-size="13" fill="#888" text-anchor="end">0.5</text>
<line x1="134" y1="164" x2="140" y2="164" stroke="#444" stroke-width="1.5"/>
<text x="128" y="169" font-size="13" fill="#888" text-anchor="end">0.75</text>
<line x1="134" y1="105" x2="140" y2="105" stroke="#444" stroke-width="1.5"/>
<text x="128" y="110" font-size="13" fill="#888" text-anchor="end">1.0</text>
<text x="100" y="91" font-size="13" fill="#888">충돌 확률 p</text>
<text x="507" y="194" font-size="13" fill="#7777cc">이론 p = 1 − θ/π</text>
<text x="213" y="138" font-size="13" fill="#e8e8e8">점은 초평면 200만 개로 잰 실측</text>
<text x="140" y="410" font-size="13" fill="#888">128차원에서 쟀고 여섯 각도 모두 소수 넷째 자리까지 이론과 맞았다 — 코사인이 아니라 각도에 선형이다</text>
</svg>