<svg width="880" height="380" viewBox="0 0 880 380"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">NLLB-200으로 한국어 번역 구현</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">200개 언어 지원 Meta 다국어 번역 모델</text>

  <!-- Left: Basic translation -->
  <text x="220" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">① KO→EN 번역</text>
  <rect x="40" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="56" y="129" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> transformers </tspan><tspan fill="#7ec8e3">import</tspan></text>
  <text x="56" y="147" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    pipeline</tspan></text>
  <text x="56" y="171" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">translator = pipeline(</tspan></text>
  <text x="56" y="189" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#ce9178">&quot;translation&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="56" y="207" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  model=</tspan><tspan fill="#ce9178">&quot;facebook/nllb-200-distilled-600M&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="56" y="225" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  src_lang=</tspan><tspan fill="#ce9178">&quot;kor_Hang&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="56" y="243" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  tgt_lang=</tspan><tspan fill="#ce9178">&quot;eng_Latn&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="56" y="261" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">)</tspan></text>
  <text x="56" y="285" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">out = translator(</tspan></text>
  <text x="56" y="303" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#ce9178">&quot;안녕하세요, 반갑습니다.&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="56" y="321" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">)[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">][&quot;translation_text&quot;]</tspan></text>
  <text x="56" y="339" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># &quot;Hello, nice to meet you.&quot;</tspan></text>



  <!-- Right: BLEU evaluation -->
  <text x="660" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">② BLEU 평가</text>
  <rect x="480" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="496" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">sacrebleu </tspan><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">corpus_bleu</tspan></text>

  <text x="496" y="153" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">hypothesis </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">[</tspan></text>
  <text x="496" y="171" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    "Hello nice to meet you"</text>
  <text x="496" y="189" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">]</text>

  <text x="496" y="213" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">references </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">[[</tspan></text>
  <text x="496" y="231" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    "Hello, nice to meet you."</text>
  <text x="496" y="249" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">]]</text>

  <text x="496" y="273" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">bleu </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">corpus_bleu(hypothesis,references)</tspan></text>
  <text x="496" y="297" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">print(bleu.score)</text>
  <text x="496" y="315" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># 73.58 (0~100 스케일)</text>
  <text x="496" y="333" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># WMT 기준 SOTA ~30~45</text>

  <!-- Bottom -->
  <text x="440" y="362" text-anchor="middle" fill="#888" font-size="12">BLEU는 n-gram 겹침 기반 — ChrF, COMET 등 보완 지표 병용 권장</text>
</svg>
