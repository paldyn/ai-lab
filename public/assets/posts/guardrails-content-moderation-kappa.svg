<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">일치율 94%가 카파 0.75가 되는 자리</text>
  <text x="60" y="70" font-size="13" fill="#888">표본 200건을 두 사람이 따로 판정한 결과다.</text>

  <text x="235" y="112" font-size="13" fill="#888" text-anchor="middle">B: 위반</text>
  <text x="365" y="112" font-size="13" fill="#888" text-anchor="middle">B: 정상</text>
  <text x="160" y="164" font-size="13" fill="#e8e8e8" text-anchor="end">A: 위반</text>
  <text x="160" y="234" font-size="13" fill="#e8e8e8" text-anchor="end">A: 정상</text>

  <rect x="170" y="124" width="130" height="70" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="235" y="156" font-size="20" font-weight="700" fill="#55c555" text-anchor="middle">22</text>
  <text x="235" y="176" font-size="11" fill="#888" text-anchor="middle">둘 다 위반</text>

  <rect x="300" y="124" width="130" height="70" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="365" y="156" font-size="20" font-weight="700" fill="#e05555" text-anchor="middle">8</text>
  <text x="365" y="176" font-size="11" fill="#888" text-anchor="middle">A만 위반</text>

  <rect x="170" y="194" width="130" height="70" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="235" y="226" font-size="20" font-weight="700" fill="#e05555" text-anchor="middle">4</text>
  <text x="235" y="246" font-size="11" fill="#888" text-anchor="middle">B만 위반</text>

  <rect x="300" y="194" width="130" height="70" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="365" y="226" font-size="20" font-weight="700" fill="#55c555" text-anchor="middle">166</text>
  <text x="365" y="246" font-size="11" fill="#888" text-anchor="middle">둘 다 정상</text>

  <text x="300" y="294" font-size="13" fill="#e8e8e8" text-anchor="middle">일치 188건 · 어긋남 12건</text>
  <text x="300" y="318" font-size="12" fill="#888" text-anchor="middle">위반이 드물어 「둘 다 정상」이 저절로 쌓였다</text>

  <rect x="490" y="124" width="330" height="240" rx="10" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="514" y="150" font-size="13" fill="#888">실제 일치율</text>
  <text x="514" y="176" font-size="16" fill="#e8e8e8">(22 + 166) / 200 = 0.94</text>
  <text x="514" y="212" font-size="13" fill="#888">우연 일치</text>
  <text x="514" y="238" font-size="16" fill="#e8e8e8">0.15 × 0.13 + 0.85 × 0.87</text>
  <text x="514" y="260" font-size="16" fill="#e8e8e8">= 0.759</text>
  <text x="514" y="296" font-size="13" fill="#888">카파</text>
  <text x="514" y="322" font-size="16" fill="#e8e8e8">(0.94 − 0.759) / (1 − 0.759)</text>
  <text x="514" y="344" font-size="17" font-weight="700" fill="#7ec8e3">≈ 0.75</text>

  <text x="60" y="396" font-size="13" fill="#888">일치율만 보면 94%로 훌륭한데 카파는 0.75다 — 드문 라벨일수록 둘이 벌어진다.</text>
</svg>
