<text x="440" y="452" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">bf16 가중치에 학습률 1e−4 짜리 갱신을 천 번 더해도 값이 1.0에서 한 번도 안 움직인다</text>
