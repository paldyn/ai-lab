<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="510" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="nmAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="nmVec" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">계수쌍 (a, b) 는 그 직선에 수직인 방향이다</text>
  <text x="60" y="74" font-size="13" fill="#888">절댓값을 벗기면 남는 부호가 직선의 어느 쪽인지 답한다</text>

  <line x1="150" y1="350" x2="510" y2="350" stroke="#888" stroke-width="1.5" marker-end="url(#nmAx)"/>
  <line x1="200" y1="400" x2="200" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#nmAx)"/>
  <text x="516" y="354" font-size="13" fill="#888">x</text>
  <text x="206" y="134" font-size="13" fill="#888">y</text>

  <line x1="245" y1="344" x2="245" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="290" y1="344" x2="290" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="335" y1="344" x2="335" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="425" y1="344" x2="425" y2="356" stroke="#888" stroke-width="1.5"/>
  <text x="245" y="368" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="290" y="368" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="335" y="368" font-size="12" fill="#888" text-anchor="middle">3</text>
  <text x="425" y="368" font-size="12" fill="#888" text-anchor="middle">5</text>

  <line x1="194" y1="305" x2="206" y2="305" stroke="#444" stroke-width="1.5"/>
  <line x1="194" y1="215" x2="206" y2="215" stroke="#444" stroke-width="1.5"/>
  <text x="188" y="309" font-size="12" fill="#888" text-anchor="end">1</text>
  <text x="188" y="219" font-size="12" fill="#888" text-anchor="end">3</text>

  <line x1="177.5" y1="198" x2="425" y2="384" stroke="#7777cc" stroke-width="2.5"/>
  <text x="440" y="390" font-size="13" fill="#7777cc">3x + 4y − 12 = 0</text>

  <line x1="380" y1="170" x2="293.6" y2="285.2" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 303.2 292.4 L 310.4 282.8 L 300.8 275.6" fill="none" stroke="#888" stroke-width="1.5"/>

  <line x1="380" y1="350" x2="461" y2="242" stroke="#e05555" stroke-width="2.5" marker-end="url(#nmVec)"/>
  <text x="470" y="238" font-size="13" fill="#e05555">(a, b) = (3, 4)</text>

  <circle cx="380" cy="170" r="5" fill="#e8e8e8"/>
  <circle cx="245" cy="305" r="5" fill="#e8e8e8"/>
  <text x="392" y="166" font-size="13" fill="#e8e8e8">P(4, 4)</text>
  <text x="255" y="328" font-size="13" fill="#e8e8e8">R(1, 1)</text>
  <text x="352" y="224" font-size="13" fill="#55c555">d = 3.2</text>

  <rect x="560" y="130" width="260" height="176" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="584" y="156" font-size="14" font-weight="600" fill="#e8e8e8">점과 직선 사이 거리</text>
  <text x="584" y="186" font-size="13" fill="#e8e8e8">|ax₀ + by₀ + c| / √(a² + b²)</text>
  <text x="584" y="216" font-size="13" fill="#e8e8e8">P(4, 4) → (12+16−12)/5 = +3.2</text>
  <text x="584" y="240" font-size="13" fill="#e8e8e8">R(1, 1) → (3+4−12)/5 = −1</text>
  <text x="584" y="270" font-size="13" fill="#7ec8e3">부호가 어느 쪽인지 답한다</text>
  <text x="584" y="294" font-size="13" fill="#e05555">(a, b) 를 법선이라 부른다</text>

  <rect x="60" y="430" width="760" height="44" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="458" font-size="13" fill="#e8e8e8">P 와 R 은 직선을 사이에 두고 반대쪽에 있다 — 그래서 값의 부호도 반대다.</text>
</svg>
