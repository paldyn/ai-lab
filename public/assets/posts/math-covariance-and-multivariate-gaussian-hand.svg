<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
<rect width="880" height="470" rx="12" fill="#0a0a0a"/>
<text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">다섯 점으로 공분산 행렬 한 개 만들기</text>
<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">자료 (5,3) (5,11) (10,10) (15,9) (15,17). 평균은 둘 다 10이다.</text>
