<text x="269.0" y="246.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">(10,10)</text>
<circle cx="327.5" cy="274.5" r="5" fill="#e05555"/>
<text x="341.5" y="298.5" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">(15,9)</text>
<circle cx="327.5" cy="158.5" r="5" fill="#55c555"/>
<text x="341.5" y="146.5" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">(15,17)</text>
<rect x="560" y="120" width="260" height="250" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="580" y="148" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" fill="#e8e8e8" font-weight="600">편차의 곱</text>
<text x="580" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">(−5)(−7)</text>
<text x="710" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">= +35</text>
<text x="580" y="204" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">(−5)(+1)</text>
<text x="710" y="204" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">= −5</text>
<text x="580" y="230" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">( 0)( 0)</text>
<text x="710" y="230" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">=  0</text>
<text x="580" y="256" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">(+5)(−1)</text>
<text x="710" y="256" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">= −5</text>
<text x="580" y="282" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">(+5)(+7)</text>
<text x="710" y="282" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">= +35</text>
<line x1="580" y1="300" x2="800" y2="300" stroke="#2a2a2a" stroke-width="1"/>
<text x="580" y="324" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">합 = 60</text>
<text x="580" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3" font-weight="600">60 ÷ 4 = 15 → 공분산</text>
<text x="60" y="445" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">초록 점은 곱이 양수, 빨간 점은 음수. 양수 쪽이 크게 이겨서 공분산이 +15로 남았다.</text>
</svg>
