<line x1="110.0" y1="260.0" x2="400.0" y2="260.0" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
<text x="263.0" y="119.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">x̄ = 10</text>
<text x="408.0" y="265.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">ȳ = 10</text>
