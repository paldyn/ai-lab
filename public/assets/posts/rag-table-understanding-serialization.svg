<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">표를 색인에 넣는 세 가지 방식</text>
  <text x="60" y="72" font-size="13" fill="#888">하나를 고르는 것이 아니라 표의 크기와 질문의 종류로 나눠 쓴다 — 셋을 함께 두는 저장소가 많다.</text>

  <rect x="60" y="104" width="213" height="48" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="166" y="133" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">마크다운 표 그대로</text>

  <rect x="333" y="104" width="213" height="48" rx="8" fill="#101418" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="439" y="133" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">행마다 한 문장으로</text>

  <rect x="606" y="104" width="214" height="48" rx="8" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="713" y="133" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">표는 표로 두고 질의</text>

  <rect x="60" y="168" width="213" height="94" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">| 구분 | 2025년 |</text>
  <text x="76" y="220" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">| 매출 | 138 |</text>
  <text x="76" y="240" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">| 영업이익 | 11 |</text>

  <rect x="333" y="168" width="213" height="94" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="349" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># 실적표 · 영업이익</text>
  <text x="349" y="220" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">2025년 영업이익은</text>
  <text x="349" y="240" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">11억 원입니다.</text>

  <rect x="606" y="168" width="214" height="94" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="622" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> 영업이익</tspan></text>
  <text x="622" y="220" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> 실적</tspan></text>
  <text x="622" y="240" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan><tspan fill="#ffffff"> 연도=</tspan><tspan fill="#b5cea8">2025</tspan></text>

  <text x="60" y="294" font-size="12.5" font-weight="600" fill="#55c555">구조가 그대로 남는다</text>
  <text x="60" y="314" font-size="11.5" fill="#888">모델이 행·열을 읽는다</text>
  <text x="60" y="342" font-size="12.5" font-weight="600" fill="#e05555">표가 길면 안 들어간다</text>
  <text x="60" y="362" font-size="11.5" fill="#888">행 수백 개는 못 담는다</text>

  <text x="333" y="294" font-size="12.5" font-weight="600" fill="#55c555">행 단위로 검색된다</text>
  <text x="333" y="314" font-size="11.5" fill="#888">질의와 모양이 닮는다</text>
  <text x="333" y="342" font-size="12.5" font-weight="600" fill="#e05555">행끼리 비교를 못 한다</text>
  <text x="333" y="362" font-size="11.5" fill="#888">합계·추이 질문에 약하다</text>

  <text x="606" y="294" font-size="12.5" font-weight="600" fill="#55c555">집계·비교가 정확하다</text>
  <text x="606" y="314" font-size="11.5" fill="#888">숫자를 모델이 안 센다</text>
  <text x="606" y="342" font-size="12.5" font-weight="600" fill="#e05555">스키마를 알려 줘야 한다</text>
  <text x="606" y="362" font-size="11.5" fill="#888">표가 정형일 때만 된다</text>

  <text x="60" y="398" font-size="13" fill="#888">표 하나를 두 방식으로 함께 색인해 두어도 된다 — 색인이 두 배가 될 뿐 서로 방해하지 않는다.</text>
</svg>
