<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 320">
  <!-- 배경 -->
  <rect width="880" height="320" fill="#0a0a0a" rx="12"/>

  <!-- 제목 -->
  <text x="440" y="36" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">FAISS 기반 투타워 추론</text>
  <text x="440" y="56" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">Two-Tower Inference with FAISS ANN Search</text>

  <!-- 코드 박스 -->
  <rect x="60" y="68" width="760" height="232" fill="#000000" stroke="#3a4a6e" stroke-width="1.5" rx="6"/>

  <!-- 라인 1 -->
  <text x="76" y="88" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600"><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> faiss</tspan><tspan fill="#7ec8e3">; import</tspan><tspan fill="#ffffff"> numpy </tspan><tspan fill="#7ec8e3">as</tspan><tspan fill="#ffffff"> np; </tspan><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> torch</tspan></text>

  <!-- 라인 2: 빈 줄 + 주석 -->
  <text x="76" y="108" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># 사전 계산된 아이템 임베딩 (오프라인 배치)</text>

  <!-- 라인 3 -->
  <text x="76" y="128" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">item_embeddings = np.load(</tspan><tspan fill="#ce9178">&quot;item_embeddings.npy&quot;</tspan><tspan fill="#ffffff">)</tspan><tspan fill="#9aa4b8">  # (N, D) float32</tspan></text>

  <!-- 라인 4: 빈 줄 + 주석 -->
  <text x="76" y="148" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># FAISS 인덱스 구축</text>

  <!-- 라인 5 -->
  <text x="76" y="168" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">d = item_embeddings.shape[</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">]</tspan><tspan fill="#9aa4b8">  # 임베딩 차원 수</tspan></text>

  <!-- 라인 6 -->
  <text x="76" y="188" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">index = faiss.IndexFlatIP(d)</tspan><tspan fill="#9aa4b8">  # 내적 유사도 인덱스</tspan></text>

  <!-- 라인 7 -->
  <text x="76" y="208" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">faiss.normalize_L2(item_embeddings)</tspan><tspan fill="#9aa4b8">  # L2 정규화 → 코사인 유사도</tspan></text>

  <!-- 라인 8 -->
  <text x="76" y="228" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">index.add(item_embeddings)</text>

  <!-- 라인 9: 빈 줄 + 주석 -->
  <text x="76" y="248" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># 실시간: 사용자 임베딩 → Top-K 검색</text>

  <!-- 라인 10 -->
  <text x="76" y="268" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">user_emb = user_tower(user_features).numpy()</tspan><tspan fill="#9aa4b8">  # (1, D)</tspan></text>

  <!-- 라인 11 -->
  <text x="76" y="288" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">faiss.normalize_L2(user_emb)</tspan><tspan fill="#9aa4b8">  # 정규화</tspan><tspan fill="#ffffff">; scores, idx = index.search(user_emb, </tspan><tspan fill="#b5cea8">    100</tspan><tspan fill="#ffffff"> )</tspan></text>
</svg>
