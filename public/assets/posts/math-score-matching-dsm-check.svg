<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">x0 이 −2 또는 +2인 데이터에 abar = 0.6 만큼 잡음을 섞었다.</text>
<text x="60" y="94" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">같은 x_t 자리에 모인 표본의 −eps/sqrt(1−abar) 를 평균한 값이다.</text>
