<text x="60" y="386" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">보라색 막대는 매 스텝의 그래디언트(양쪽 다 크기 1), 굵은 선은 v ← 0.9v + g 로 누적한 값이다.</text>
<text x="60" y="410" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">선만 세로 배율을 4분의 1 로 줄여 그렸다 — 실제 차이는 이 그림보다 네 배 크다.</text>
