<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="410" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="ti-blue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">셋을 그냥 평균하면 서로 상쇄된다</text>
  <text x="62" y="72" font-size="13" fill="#888">어댑터마다 같은 자리를 반대 방향으로 밀 때가 있다. 두 단계로 그 충돌을 걷어낸다.</text>

  <rect x="62" y="140" width="200" height="84" rx="6" fill="#101c2c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="162" y="168" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">1. 덜어내기</text>
  <text x="162" y="186" font-size="11" fill="#aaaaaa" text-anchor="middle">변화가 작은 값을</text>
  <text x="162" y="204" font-size="11" fill="#aaaaaa" text-anchor="middle">0으로 만든다</text>
  <line x1="262" y1="182" x2="340" y2="182" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ti-blue)"/>

  <rect x="340" y="140" width="200" height="84" rx="6" fill="#101c2c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="168" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">2. 부호 고르기</text>
  <text x="440" y="186" font-size="11" fill="#aaaaaa" text-anchor="middle">크기 합이 큰 쪽으로</text>
  <text x="440" y="204" font-size="11" fill="#aaaaaa" text-anchor="middle">방향을 통일한다</text>
  <line x1="540" y1="182" x2="618" y2="182" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ti-blue)"/>

  <rect x="618" y="140" width="200" height="84" rx="6" fill="#12261a" stroke="#55c555" stroke-width="1.5"/>
  <text x="718" y="168" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">3. 평균 내기</text>
  <text x="718" y="186" font-size="11" fill="#aaaaaa" text-anchor="middle">고른 방향과 같은</text>
  <text x="718" y="204" font-size="11" fill="#aaaaaa" text-anchor="middle">값만 평균한다</text>

  <rect x="62" y="270" width="756" height="86" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="86" y="298" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">원래 값     +0.80   -0.10   +0.50</text>
  <text x="86" y="318" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">덜어낸 뒤   +0.80     -     +0.50</text>
  <text x="86" y="338" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555">합친 값     +0.65</text>

  <text x="62" y="388" font-size="13" fill="#888">그냥 평균하면 −0.10까지 섞여 +0.40이 된다. 세 어댑터가 서로를 깎는 자리가 여기다.</text>
</svg>
