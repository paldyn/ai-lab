<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="cca" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker>
    <marker id="ccr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/></marker>
  </defs>
  <rect width="880" height="560" rx="12" fill="#0a0a0a"/>
  <text x="60" y="56" font-size="22" fill="#e8e8e8" font-weight="700">길이가 1인 두 벡터의 거리는 코사인으로 정해진다</text>
  <text x="60" y="82" font-size="13" fill="#888">a = (1, 0), b = (0.6, 0.8) — 둘 다 단위원 위에 있다</text>
  <line x1="120" y1="400" x2="430" y2="400" stroke="#888" stroke-width="1.5"/>
  <line x1="150" y1="430" x2="150" y2="120" stroke="#888" stroke-width="1.5"/>
  <path d="M 390 400 A 240 240 0 0 0 150 160" fill="none" stroke="#7777cc" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="150" y1="400" x2="390" y2="400" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#cca)"/>
  <line x1="150" y1="400" x2="294.0" y2="208.0" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#cca)"/>
  <line x1="390" y1="400" x2="294.0" y2="208.0" stroke="#e05555" stroke-width="2.5"/>
  <path d="M 206 400 A 56 56 0 0 0 183.6 355.2" fill="none" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="216" y="376" font-size="16" fill="#e8e8e8" font-weight="600">θ</text>
  <text x="380" y="426" font-size="13" fill="#e8e8e8">a = (1, 0)</text>
  <text x="264.0" y="198.0" font-size="13" fill="#e8e8e8" text-anchor="end">b = (0.6, 0.8)</text>
  <text x="384.0" y="308.0" font-size="13" fill="#e05555" font-weight="600">a − b = (0.4, −0.8)</text>
  <text x="136" y="422" font-size="12" fill="#888">0</text>
  <rect x="530" y="140" width="290" height="96" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="554" y="170" font-size="16" fill="#e8e8e8" font-weight="600">각의 코사인</text>
  <text x="554" y="200" font-size="13" fill="#888">cos θ = 1×0.6 + 0×0.8 = 0.6</text>
  <rect x="530" y="256" width="290" height="96" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="554" y="286" font-size="16" fill="#e05555" font-weight="600">거리의 제곱</text>
  <text x="554" y="316" font-size="13" fill="#888">0.4² + 0.8² = 0.16 + 0.64 = 0.8</text>
  <rect x="530" y="372" width="290" height="96" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="554" y="402" font-size="16" fill="#e8e8e8" font-weight="600">두 값을 잇는 식</text>
  <text x="554" y="432" font-size="13" fill="#888">2 − 2 cos θ = 2 − 1.2 = 0.8</text>
  <text x="60" y="520" font-size="13" fill="#888">코사인이 클수록 거리가 짧다 — 길이를 1로 맞춘 벡터끼리는 두 순위가 정확히 같다</text>
</svg>
