<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
<rect width="880" height="400" rx="12" fill="#0a0a0a"/>
<text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">차원이 늘면 두 추정량이 갈라진다</text>
<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">f(x) = ‖x‖² 의 μ에 대한 그래디언트를 표본 20만 개로 추정했을 때 첫 성분의 표준편차</text>
<text x="76" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">차원</text>
<text x="200" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">재매개변수화</text>
<text x="360" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">로그 미분</text>
<text x="520" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">분산 비</text>
<rect x="56" y="128" width="768" height="56" rx="8" fill="#111318" stroke="#2a2f3a" stroke-width="1"/>
<text x="76" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">d = 1</text>
<text x="200" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600" fill="#55c555">2.00</text>
<text x="360" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600" fill="#e05555">5.45</text>
<text x="520" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">7.4배</text>
<rect x="56" y="196" width="768" height="56" rx="8" fill="#111318" stroke="#2a2f3a" stroke-width="1"/>
<text x="76" y="230" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">d = 10</text>
<text x="200" y="230" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600" fill="#55c555">2.00</text>
<text x="360" y="230" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600" fill="#e05555">23.4</text>
<text x="520" y="230" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">137배</text>
<rect x="56" y="264" width="768" height="56" rx="8" fill="#111318" stroke="#2a2f3a" stroke-width="1"/>
<text x="76" y="298" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">d = 100</text>
<text x="200" y="298" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600" fill="#55c555">2.00</text>
<text x="360" y="298" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600" fill="#e05555">203.0</text>
<text x="520" y="298" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">10,343배</text>
<text x="60" y="352" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">재매개변수화 쪽은 차원과 무관하게 2σ에 머문다.</text>
<text x="60" y="376" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">로그 미분 쪽은 ‖x‖² 이 d개 항의 합이라 그 흔들림을 그대로 받는다.</text>
</svg>