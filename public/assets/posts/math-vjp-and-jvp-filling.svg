<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">한 번 굴리면 한 줄이 채워진다</text>
  <text x="60" y="76" font-size="13" fill="#888">입력 n = 4, 출력 m = 3 인 함수의 야코비안 — 같은 표를 서로 다른 방향으로 훑는다</text>

  <text x="90" y="126" font-size="16" font-weight="600" fill="#7ec8e3">전방 모드 (JVP) — 열을 하나씩</text>

  <rect x="90" y="150" width="300" height="150" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="90" y="150" width="75" height="150" fill="#7ec8e3" fill-opacity="0.30"/>
  <rect x="165" y="150" width="75" height="150" fill="#7ec8e3" fill-opacity="0.22"/>
  <rect x="240" y="150" width="75" height="150" fill="#7ec8e3" fill-opacity="0.14"/>
  <rect x="315" y="150" width="75" height="150" fill="#7ec8e3" fill-opacity="0.07"/>
  <line x1="165" y1="150" x2="165" y2="300" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="240" y1="150" x2="240" y2="300" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="315" y1="150" x2="315" y2="300" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="90" y1="200" x2="390" y2="200" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="90" y1="250" x2="390" y2="250" stroke="#3a4a6e" stroke-width="1"/>
  <text x="127" y="232" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">1</text>
  <text x="202" y="232" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">2</text>
  <text x="277" y="232" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">3</text>
  <text x="352" y="232" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">4</text>

  <text x="90" y="330" font-size="14" font-weight="600" fill="#7ec8e3">v = e₁, e₂, e₃, e₄ 를 넣어 n = 4 번</text>
  <text x="90" y="354" font-size="13" fill="#888">굴리기 한 번이 순전파 한 번 값이다</text>

  <text x="490" y="126" font-size="16" font-weight="600" fill="#7777cc">역방향 모드 (VJP) — 행을 하나씩</text>

  <rect x="490" y="150" width="300" height="150" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="490" y="150" width="300" height="50" fill="#7777cc" fill-opacity="0.30"/>
  <rect x="490" y="200" width="300" height="50" fill="#7777cc" fill-opacity="0.20"/>
  <rect x="490" y="250" width="300" height="50" fill="#7777cc" fill-opacity="0.10"/>
  <line x1="565" y1="150" x2="565" y2="300" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="640" y1="150" x2="640" y2="300" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="715" y1="150" x2="715" y2="300" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="490" y1="200" x2="790" y2="200" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="490" y1="250" x2="790" y2="250" stroke="#3a4a6e" stroke-width="1"/>
  <text x="640" y="182" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">1</text>
  <text x="640" y="232" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">2</text>
  <text x="640" y="282" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">3</text>

  <text x="490" y="330" font-size="14" font-weight="600" fill="#7777cc">u = e₁, e₂, e₃ 를 넣어 m = 3 번</text>
  <text x="490" y="354" font-size="13" fill="#888">대신 순전파 중간값을 전부 보관해야 한다</text>
</svg>
