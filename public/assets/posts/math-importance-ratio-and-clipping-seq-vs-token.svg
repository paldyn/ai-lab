<text x="80" y="209" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">토큰당 KL 0.01이 200번 쌓여 시퀀스 KL 2가 된다. 무게의 중앙값은 0.14, 위쪽 5%는 3.6을 넘는다.</text>
<text x="80" y="229" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">유효 표본은 e⁻⁴ ≈ 1.8% — 답 1,000개 중 열여덟 개만 일한다.</text>
