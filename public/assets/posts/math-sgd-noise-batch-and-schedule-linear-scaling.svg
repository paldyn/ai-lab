<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 430">
<rect x="0" y="0" width="880" height="430" rx="12" fill="#0a0a0a"/>
<defs><marker id="ls1" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker></defs>
<text x="60" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">작은 배치 k 스텝과 큰 배치 한 스텝을 맞추는 법</text>
<text x="60" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">학습률을 k 배로 올리면 이동량의 평균과 분산이 동시에 맞는다</text>
<text x="60" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3">배치 B 로 k 스텝, 학습률 η</text>
<text x="470" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e0a355">배치 kB 로 1 스텝, 학습률 kη</text>
<rect x="60" y="130" width="350" height="60" rx="8" fill="#111827" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="78" y="154" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">이동량 = −η (g₁ + g₂ + … + g_k)</text>
<text x="78" y="174" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">같은 자리에서 잰 그래디언트 k 개를 더한다</text>
<rect x="60" y="214" width="350" height="60" rx="8" fill="#111827" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="78" y="238" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">평균 = −k η ∇L</text>
<text x="78" y="258" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">각 항의 평균이 −η∇L 이므로 k 배</text>
<rect x="60" y="298" width="350" height="60" rx="8" fill="#111827" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="78" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">분산 = k η² σ² / B</text>
<text x="78" y="342" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">독립인 k 개의 분산이 더해진다</text>
<rect x="470" y="130" width="350" height="60" rx="8" fill="#111827" stroke="#e0a355" stroke-width="1.5"/>
<text x="488" y="154" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">이동량 = −kη · g</text>
<text x="488" y="174" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">배치가 k 배라 잡음이 √k 배 작다</text>
<rect x="470" y="214" width="350" height="60" rx="8" fill="#111827" stroke="#e0a355" stroke-width="1.5"/>
<text x="488" y="238" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">평균 = −k η ∇L</text>
<text x="488" y="258" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">왼쪽과 같다</text>
<rect x="470" y="298" width="350" height="60" rx="8" fill="#111827" stroke="#e0a355" stroke-width="1.5"/>
<text x="488" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">분산 = (kη)² σ²/(kB) = k η² σ² / B</text>
<text x="488" y="342" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">왼쪽과 같다</text>
<line x1="235" y1="190" x2="235" y2="212" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ls1)"/>
<line x1="645" y1="190" x2="645" y2="212" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ls1)"/>
<line x1="235" y1="274" x2="235" y2="296" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ls1)"/>
<line x1="645" y1="274" x2="645" y2="296" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ls1)"/>
<text x="440" y="218" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="24" font-weight="700" fill="#55c555" text-anchor="middle">=</text>
<text x="440" y="302" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="24" font-weight="700" fill="#55c555" text-anchor="middle">=</text>
<rect x="60" y="356" width="760" height="44" rx="8" fill="#0f1a0f" stroke="#55c555" stroke-width="1.5"/>
<text x="80" y="384" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">전제: k 스텝 동안 ∇L 이 거의 그대로여야 한다 — 곡률이 크면 이 등식이 깨진다.</text>
</svg>
