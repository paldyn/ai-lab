  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">새로 가르치는 동안 원래 알던 것이 내려간다</text>
  <text x="62" y="72" font-size="13" fill="#888">목표 과제 점수만 보면 계속 좋아지는 것처럼 보인다. 같은 축에 나머지를 얹어야 보인다.</text>

  <text x="460" y="96" font-size="12" fill="#e05555" text-anchor="middle">이 근처에서 합이 가장 크다</text>

