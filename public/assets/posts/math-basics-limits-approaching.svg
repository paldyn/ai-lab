<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="360" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="apAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="apGo" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">1/n 은 0 에 붙지만 0 이 되지는 않는다</text>
  <text x="60" y="74" font-size="13" fill="#888">n 을 키울수록 점이 0 쪽으로 몰리되 결코 0 에 닿지 않는다</text>

  <line x1="120" y1="220" x2="800" y2="220" stroke="#888" stroke-width="1.5" marker-end="url(#apAx)"/>
  <line x1="150" y1="212" x2="150" y2="228" stroke="#888" stroke-width="1.5"/>
  <line x1="750" y1="212" x2="750" y2="228" stroke="#888" stroke-width="1.5"/>
  <text x="150" y="248" font-size="13" fill="#888" text-anchor="middle">0</text>
  <text x="750" y="248" font-size="13" fill="#888" text-anchor="middle">1</text>

  <circle cx="750" cy="220" r="5" fill="#e8e8e8"/>
  <text x="750" y="196" font-size="12" fill="#e8e8e8" text-anchor="middle">n=1</text>
  <circle cx="450" cy="220" r="5" fill="#e8e8e8"/>
  <text x="450" y="196" font-size="12" fill="#e8e8e8" text-anchor="middle">n=2</text>
  <circle cx="350" cy="220" r="5" fill="#e8e8e8"/>
  <text x="350" y="196" font-size="12" fill="#e8e8e8" text-anchor="middle">n=3</text>
  <circle cx="300" cy="220" r="5" fill="#e8e8e8"/>
  <text x="296" y="176" font-size="12" fill="#e8e8e8" text-anchor="middle">n=4</text>
  <circle cx="270" cy="220" r="4" fill="#7ec8e3"/>
  <circle cx="250" cy="220" r="4" fill="#7ec8e3"/>
  <circle cx="225" cy="220" r="4" fill="#7ec8e3"/>
  <circle cx="210" cy="220" r="4" fill="#7ec8e3"/>
  <text x="222" y="196" font-size="12" fill="#7ec8e3" text-anchor="middle">n=10</text>
  <circle cx="180" cy="220" r="3" fill="#7777cc"/>
  <circle cx="162" cy="220" r="3" fill="#7777cc"/>
  <circle cx="156" cy="220" r="3" fill="#7777cc"/>

  <line x1="330" y1="288" x2="164" y2="288" stroke="#55c555" stroke-width="2.5" marker-end="url(#apGo)"/>
  <text x="344" y="293" font-size="13" fill="#55c555">n 이 커지는 방향</text>

  <rect x="500" y="262" width="320" height="52" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="524" y="284" font-size="13" fill="#e8e8e8">0 과의 차이를 원하는 만큼 작게 만들 수 있다</text>
  <text x="524" y="304" font-size="13" fill="#7ec8e3">— 그것이 「0 에 붙는다」의 뜻이다</text>

  <text x="60" y="126" font-size="13" fill="#888">n = 100 이면 0.01, n = 10000 이면 0.0001 — 눈금 왼쪽 끝에 겹쳐 보일 만큼 몰린다</text>
</svg>
