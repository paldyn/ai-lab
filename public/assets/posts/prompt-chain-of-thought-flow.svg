<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#666666"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">한 번에 답하기와 나눠 쓰기</text>
  <text x="440" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">같은 문제, 같은 모델 — 답 앞에 무엇이 쓰이는가</text>

  <!-- 문제 -->
  <rect x="60" y="96" width="760" height="56" rx="8" fill="#111827" stroke="#3a4a6e"/>
  <text x="440" y="120" text-anchor="middle" font-size="14" fill="#e8e8e8">식당에 사과가 23개 있었다. 점심에 20개를 쓰고 6개를 더 샀다.</text>
  <text x="440" y="140" text-anchor="middle" font-size="14" fill="#e8e8e8">지금 몇 개인가?</text>

  <!-- 왼쪽: 답만 -->
  <text x="220" y="186" text-anchor="middle" font-size="16" font-weight="600" fill="#7ec8e3">답만 내게 할 때</text>
  <rect x="80" y="204" width="280" height="56" rx="8" fill="#111111" stroke="#3a4a6e"/>
  <text x="220" y="237" text-anchor="middle" font-size="14" fill="#e8e8e8">「답:」 다음 첫 토큰</text>
  <line x1="220" y1="260" x2="220" y2="300" stroke="#666666" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="80" y="300" width="280" height="70" rx="8" fill="#1a1111" stroke="#e05555"/>
  <text x="220" y="330" text-anchor="middle" font-size="16" font-weight="600" fill="#e05555">답: 27</text>
  <text x="220" y="352" text-anchor="middle" font-size="13" fill="#888">빼기·더하기가 한 토큰에 접힌다</text>
  <text x="220" y="402" text-anchor="middle" font-size="13" fill="#888">문제의 수를 엮은 그럴듯한 오답</text>

  <!-- 가운데 구분선 -->
  <line x1="440" y1="172" x2="440" y2="470" stroke="#333333" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 오른쪽: CoT -->
  <text x="660" y="186" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">단계를 쓰게 할 때</text>
  <rect x="520" y="204" width="280" height="44" rx="8" fill="#111111" stroke="#3a4a6e"/>
  <text x="660" y="231" text-anchor="middle" font-size="14" fill="#7ec8e3">단계별로 생각해 보자.</text>
  <line x1="660" y1="248" x2="660" y2="270" stroke="#666666" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="520" y="270" width="280" height="44" rx="8" fill="#0d1117" stroke="#55c555"/>
  <text x="660" y="297" text-anchor="middle" font-size="14" fill="#e8e8e8">① 23개에서 20개를 쓰면 3개</text>
  <line x1="660" y1="314" x2="660" y2="336" stroke="#666666" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="520" y="336" width="280" height="44" rx="8" fill="#0d1117" stroke="#55c555"/>
  <text x="660" y="363" text-anchor="middle" font-size="14" fill="#e8e8e8">② 3개에 6개를 사면 3 + 6 = 9</text>
  <line x1="660" y1="380" x2="660" y2="402" stroke="#666666" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="520" y="402" width="280" height="44" rx="8" fill="#0d1117" stroke="#55c555"/>
  <text x="660" y="429" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">답: 9</text>

  <!-- 아래 요약 -->
  <rect x="60" y="484" width="760" height="52" rx="8" fill="#111111" stroke="#3a4a6e"/>
  <text x="440" y="515" text-anchor="middle" font-size="14" fill="#e8e8e8">앞서 쓴 단계가 뒤 토큰의 조건이 된다 — 걸음마다 연산은 하나뿐이다</text>
</svg>
