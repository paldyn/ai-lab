<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="lrArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">연산별 국소 규칙</text>
  <text x="60" y="76" font-size="13" fill="#888">빨간 점선은 출력 쪽에서 거슬러 오는 기울기, g 는 그 노드가 받은 상류 기울기</text>
  <rect x="71" y="100" width="226" height="330" rx="10" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text x="184" y="132" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">덧셈</text>
  <line x1="184" y1="150" x2="184" y2="188" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <text x="196" y="174" font-size="13" font-weight="600" fill="#e05555">g = 5</text>
  <rect x="134" y="188" width="100" height="44" rx="6" fill="#000000" stroke="#7ec8e3" stroke-width="2"/>
  <text x="184.0" y="215" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">z = u + v</text>
  <line x1="154" y1="232" x2="119" y2="318" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <line x1="214" y1="232" x2="249" y2="318" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <rect x="89" y="318" width="60" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="119.0" y="345" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">u</text>
  <rect x="219" y="318" width="60" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="249.0" y="345" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">v</text>
  <text x="119" y="386" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">g × 1 = 5</text>
  <text x="249" y="386" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">g × 1 = 5</text>
  <text x="184" y="414" font-size="13" font-weight="400" fill="#888" text-anchor="middle">그대로 나눠 준다</text>
  <rect x="327" y="100" width="226" height="330" rx="10" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text x="440" y="132" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">곱셈</text>
  <line x1="440" y1="150" x2="440" y2="188" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <text x="452" y="174" font-size="13" font-weight="600" fill="#e05555">g = 1</text>
  <rect x="390" y="188" width="100" height="44" rx="6" fill="#000000" stroke="#7ec8e3" stroke-width="2"/>
  <text x="440.0" y="215" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">z = u × v</text>
  <line x1="410" y1="232" x2="375" y2="318" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <line x1="470" y1="232" x2="505" y2="318" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <rect x="345" y="318" width="60" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="375.0" y="345" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">u = 4</text>
  <rect x="475" y="318" width="60" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="505.0" y="345" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">v = 6</text>
  <text x="375" y="386" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">g × v = 6</text>
  <text x="505" y="386" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">g × u = 4</text>
  <text x="440" y="414" font-size="13" font-weight="400" fill="#888" text-anchor="middle">상대 값을 곱해 보낸다</text>
  <rect x="583" y="100" width="226" height="330" rx="10" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text x="696" y="132" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">분기</text>
  <line x1="631" y1="150" x2="631" y2="188" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <text x="643" y="174" font-size="13" font-weight="600" fill="#e05555">24</text>
  <line x1="761" y1="150" x2="761" y2="188" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <text x="773" y="174" font-size="13" font-weight="600" fill="#e05555">12</text>
  <rect x="601" y="188" width="60" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="631.0" y="215" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">u</text>
  <rect x="731" y="188" width="60" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="761.0" y="215" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">v</text>
  <line x1="631" y1="232" x2="672" y2="318" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <line x1="761" y1="232" x2="720" y2="318" stroke="#e05555" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#lrArr)"/>
  <rect x="646" y="318" width="100" height="44" rx="6" fill="#000000" stroke="#7ec8e3" stroke-width="2"/>
  <text x="696.0" y="345" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">t</text>
  <text x="696" y="386" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">24 + 12 = 36</text>
  <text x="696" y="414" font-size="13" font-weight="400" fill="#888" text-anchor="middle">모아서 더한다</text>
</svg>
