  <text x="712" y="224" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="26" font-weight="700" fill="#e8e8e8">1</text>

  <text x="104" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#7ec8e3">1×10 + 3×1 = 13</text>
  <text x="488" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#7ec8e3">1×8 + 1×4 + 0×2 + 1×1 = 13</text>
