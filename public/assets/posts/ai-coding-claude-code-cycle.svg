<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350">
  <defs>
    <marker id="cc-fwd" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="cc-back" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="350" rx="12" fill="#0a0a0a"/>

  <text x="60" y="54" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">에이전트가 도는 한 사이클</text>
  <text x="60" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888">검증 결과가 다음 판단의 입력이 된다 — 확인할 수단이 없으면 이 되풀이가 돌지 않는다</text>

  <rect x="60" y="150" width="160" height="56" rx="8" fill="none" stroke="#7ec8e3" stroke-width="2"/>
  <text x="140" y="182" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" fill="#e8e8e8">탐색·읽기</text>

  <line x1="220" y1="178" x2="260" y2="178" stroke="#7ec8e3" stroke-width="2" marker-end="url(#cc-fwd)"/>

  <rect x="260" y="150" width="160" height="56" rx="8" fill="none" stroke="#7ec8e3" stroke-width="2"/>
  <text x="340" y="182" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" fill="#e8e8e8">편집</text>

  <line x1="420" y1="178" x2="460" y2="178" stroke="#7ec8e3" stroke-width="2" marker-end="url(#cc-fwd)"/>

  <rect x="460" y="150" width="160" height="56" rx="8" fill="none" stroke="#7ec8e3" stroke-width="2"/>
  <text x="540" y="182" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" fill="#e8e8e8">검증 실행</text>

  <line x1="620" y1="178" x2="660" y2="178" stroke="#7ec8e3" stroke-width="2" marker-end="url(#cc-fwd)"/>

  <rect x="660" y="150" width="160" height="56" rx="8" fill="none" stroke="#7ec8e3" stroke-width="2"/>
  <text x="740" y="182" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" fill="#e8e8e8">결과 판단</text>

  <text x="660" y="234" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#55c555">통과 → 멈춘다</text>

  <path d="M 740 206 L 740 282 L 140 282 L 140 214" fill="none" stroke="#e05555" stroke-width="2"
        stroke-dasharray="4,4" marker-end="url(#cc-back)"/>

  <text x="300" y="308" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e05555">실패 → 출력을 읽고 원인을 다시 짚는다</text>
</svg>
