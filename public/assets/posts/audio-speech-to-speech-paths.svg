<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="s2s-a" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="s2s-b" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="392" rx="12" fill="#0a0a0a"/>

  <text x="60" y="42" font-size="22" font-weight="700" fill="#e8e8e8">소리에서 소리로 가는 두 갈래 길</text>

  <text x="60" y="80" font-size="16" font-weight="600" fill="#e8e8e8">연결형 — 글자를 거쳐 간다</text>

  <rect x="60" y="94" width="120" height="60" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="120" y="118" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">들어온 소리</text>
  <text x="120" y="138" font-size="11" fill="#9aa4b8" text-anchor="middle">파형</text>

  <rect x="220" y="94" width="120" height="60" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="280" y="118" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">음성 인식</text>
  <text x="280" y="138" font-size="11" fill="#9aa4b8" text-anchor="middle">소리 → 글자</text>

  <rect x="380" y="94" width="120" height="60" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="440" y="118" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">번역·생성</text>
  <text x="440" y="138" font-size="11" fill="#9aa4b8" text-anchor="middle">글자 → 글자</text>

  <rect x="540" y="94" width="120" height="60" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="600" y="118" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">음성 합성</text>
  <text x="600" y="138" font-size="11" fill="#9aa4b8" text-anchor="middle">글자 → 소리</text>

  <rect x="700" y="94" width="120" height="60" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="760" y="118" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">나가는 소리</text>
  <text x="760" y="138" font-size="11" fill="#9aa4b8" text-anchor="middle">파형</text>

  <line x1="180" y1="124" x2="220" y2="124" stroke="#7ec8e3" stroke-width="2" marker-end="url(#s2s-a)"/>
  <line x1="340" y1="124" x2="380" y2="124" stroke="#7ec8e3" stroke-width="2" marker-end="url(#s2s-a)"/>
  <line x1="500" y1="124" x2="540" y2="124" stroke="#7ec8e3" stroke-width="2" marker-end="url(#s2s-a)"/>
  <line x1="660" y1="124" x2="700" y2="124" stroke="#7ec8e3" stroke-width="2" marker-end="url(#s2s-a)"/>

  <text x="60" y="186" font-size="13" fill="#e05555">가운데 두 칸이 글자라서, 억양 · 감정 · 목소리의 결이 여기서 버려진다. 대신 그 글자를 읽고 고칠 수 있다.</text>

  <text x="60" y="234" font-size="16" font-weight="600" fill="#e8e8e8">직결형 — 글자를 거치지 않는다</text>

  <rect x="60" y="248" width="120" height="70" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="120" y="278" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">들어온 소리</text>
  <text x="120" y="298" font-size="11" fill="#9aa4b8" text-anchor="middle">파형</text>

  <rect x="220" y="248" width="440" height="70" rx="8" fill="#111318" stroke="#55c555" stroke-width="1"/>
  <text x="440" y="270" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">하나의 음성 모델</text>
  <text x="440" y="288" font-size="11" fill="#9aa4b8" text-anchor="middle">소리를 잘게 나눈 조각을 그대로 받아 조각으로 낸다</text>
  <text x="440" y="306" font-size="11" fill="#9aa4b8" text-anchor="middle">억양 · 쉼 · 웃음이 입력에서 출력으로 이어진다</text>

  <rect x="700" y="248" width="120" height="70" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="760" y="278" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">나가는 소리</text>
  <text x="760" y="298" font-size="11" fill="#9aa4b8" text-anchor="middle">파형</text>

  <line x1="180" y1="283" x2="220" y2="283" stroke="#55c555" stroke-width="2" marker-end="url(#s2s-b)"/>
  <line x1="660" y1="283" x2="700" y2="283" stroke="#55c555" stroke-width="2" marker-end="url(#s2s-b)"/>

  <text x="60" y="350" font-size="13" fill="#9aa4b8">읽고 고칠 글자가 중간에 없다. 검수 · 필터 · 용어 교정을 끼울 자리가 사라진다는 뜻이기도 하다.</text>
  <text x="60" y="374" font-size="13" fill="#9aa4b8">그래서 실무에서는 직결형을 쓰면서 전사 텍스트를 따로 받아 두는 절충이 흔하다.</text>
</svg>
