<svg xmlns="http://www.w3.org/2000/svg" width="880" height="402" viewBox="0 0 880 402" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="402" rx="12" fill="#0a0a0a"/>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">보상은 계속 오르는데 답은 나빠진다</text>
  <text x="62" y="72" font-size="13" fill="#888">정책이 보상 모델의 학습 분포 밖으로 나가면 두 곡선이 갈라진다.</text>

  <text x="420" y="112" font-size="13" fill="#7777cc" text-anchor="middle">여기서부터 갈린다</text>

  <line x1="110" y1="120" x2="110" y2="300" stroke="#444444" stroke-width="1"/>
  <line x1="110" y1="300" x2="790" y2="300" stroke="#444444" stroke-width="1"/>
  <line x1="420" y1="126" x2="420" y2="300" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>

  <polyline points="110,292 200,258 290,228 380,204 470,186 560,172 670,160 780,150" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <polyline points="110,294 200,260 290,226 380,200 420,192 470,200 560,224 670,250 780,272" fill="none" stroke="#e05555" stroke-width="2.5"/>

  <line x1="500" y1="136" x2="536" y2="136" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="546" y="140" font-size="13" fill="#e8e8e8">보상 모델이 매긴 점수</text>
  <line x1="500" y1="160" x2="536" y2="160" stroke="#e05555" stroke-width="2.5"/>
  <text x="546" y="164" font-size="13" fill="#e8e8e8">사람이 매긴 점수</text>

  <text x="62" y="126" font-size="12" fill="#888">점수</text>
  <text x="450" y="326" font-size="12" fill="#888" text-anchor="middle">학습 스텝</text>

  <text x="62" y="360" font-size="13" fill="#e8e8e8">보상 모델은 학습 때 본 답의 범위에서만 믿을 수 있다. 정책은 그 범위를 벗어나며 학습한다.</text>
  <text x="62" y="384" font-size="13" fill="#888">그래서 갈라지는 지점을 사람이 보지 않으면 알 수 없다. 곡선 하나만 보면 성공으로 보인다.</text>
</svg>
