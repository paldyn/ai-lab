<text x="60" y="416" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">엔트로피를 지수로 되돌린 값이 perplexity 다. 「몇 개 중에 고민하고 있는가」로 읽힌다.</text>
