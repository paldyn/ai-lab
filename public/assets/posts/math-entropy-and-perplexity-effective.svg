<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
<rect width="880" height="440" rx="12" fill="#0a0a0a"/>
<text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">perplexity 는 «실질 후보 수»다</text>
<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">확률 0.5 0.25 0.125 0.125 은 후보가 넷이지만, 고르는 어려움은 균등한 3.36 개와 같다.</text>
<defs><marker id="e4" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker></defs>
<rect x="95.0" y="210.0" width="46" height="120.0" rx="3" fill="#7ec8e3" fill-opacity="0.85"/>
<text x="118.0" y="200.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">0.5</text>
<text x="118.0" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">A</text>
<rect x="163.0" y="270.0" width="46" height="60.0" rx="3" fill="#7ec8e3" fill-opacity="0.85"/>
