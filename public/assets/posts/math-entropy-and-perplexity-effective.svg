<text x="186.0" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">B</text>
<rect x="231.0" y="300.0" width="46" height="30.0" rx="3" fill="#7ec8e3" fill-opacity="0.85"/>
<text x="254.0" y="290.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">0.125</text>
<text x="254.0" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">C</text>
<rect x="299.0" y="300.0" width="46" height="30.0" rx="3" fill="#7ec8e3" fill-opacity="0.85"/>
<text x="322.0" y="290.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">0.125</text>
<text x="322.0" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">D</text>
<line x1="85.0" y1="330" x2="355.0" y2="330" stroke="#888" stroke-width="1.5"/>
<text x="220" y="122" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" fill="#7ec8e3" font-weight="600" text-anchor="middle">치우친 분포 — 후보 4개</text>
<text x="220" y="384" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" font-weight="600" text-anchor="middle">H = 1.75 비트</text>
<rect x="535.0" y="258.6" width="46" height="71.4" rx="3" fill="#55c555" fill-opacity="0.85"/>
<rect x="603.0" y="258.6" width="46" height="71.4" rx="3" fill="#55c555" fill-opacity="0.85"/>
<rect x="671.0" y="258.6" width="46" height="71.4" rx="3" fill="#55c555" fill-opacity="0.85"/>
<rect x="739.0" y="304.3" width="46" height="25.7" rx="3" fill="#2f6b2f" fill-opacity="0.85"/>
<line x1="525.0" y1="330" x2="795.0" y2="330" stroke="#888" stroke-width="1.5"/>
<text x="660" y="122" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" fill="#55c555" font-weight="600" text-anchor="middle">균등 3.36 개와 같은 어려움</text>
<text x="660" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">1/3.36 씩</text>
<text x="660" y="384" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" font-weight="600" text-anchor="middle">H = log₂ 3.36 = 1.75 비트</text>
