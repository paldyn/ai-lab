<rect x="596" y="120" width="224" height="300" rx="8" fill="none" stroke="#333" stroke-width="1"/>
<text x="620.0" y="156.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="start">k = 8 일 때 바꾸는 값</text>
<text x="620.0" y="196.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="start">SGD</text>
<text x="620.0" y="220.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#e8e8e8" text-anchor="start">η → 8η</text>
<text x="620.0" y="260.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7777cc" text-anchor="start">Adam</text>
<text x="620.0" y="284.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#e8e8e8" text-anchor="start">η → √8·η ≈ 2.83η</text>
<text x="620.0" y="306.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#e8e8e8" text-anchor="start">1−β₁, 1−β₂ → 8배</text>
<text x="620.0" y="328.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#e8e8e8" text-anchor="start">ε → ε / √8</text>
<text x="620.0" y="376.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888" text-anchor="start">β₂ = 0.999 였다면</text>
<text x="620.0" y="396.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888" text-anchor="start">8배 뒤에는 β₂ = 0.992</text>
<text x="60.0" y="478.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888" text-anchor="start">SGD는 걸음이 그래디언트 크기를 그대로 따라가 k스텝치를 한 번에 가려면 k배가 필요하다. Adam은 √v̂로 나누어</text>
<text x="60.0" y="500.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888" text-anchor="start">크기가 약분되므로 큰 배치의 한 걸음이 이미 √k배 커져 있고, 나머지 √k배만 학습률이 채운다.</text>
