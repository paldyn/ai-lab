<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
<rect width="880" height="380" rx="12" fill="#0a0a0a"/>
<defs>
<marker id="a1" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker>
<marker id="a2" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/></marker>
</defs>
<text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">한 번 모은 배치를 몇 번까지 다시 쓸 수 있는가</text>
<rect x="60" y="90" width="240" height="72" rx="10" fill="#111318" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="78" y="120" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">① 정책 πold 로 수집</text>
<text x="78" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">배치 하나를 모은다</text>
<rect x="320" y="90" width="240" height="72" rx="10" fill="#111318" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="338" y="120" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">② 같은 배치로 K번</text>
<text x="338" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">r을 다시 계산해 한 걸음</text>
<rect x="580" y="90" width="240" height="72" rx="10" fill="#111318" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="598" y="120" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">③ KL을 잰다</text>
<text x="598" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">예산을 넘었나</text>
<line x1="300" y1="126" x2="320" y2="126" stroke="#7ec8e3" stroke-width="2" marker-end="url(#a1)"/>
<line x1="560" y1="126" x2="580" y2="126" stroke="#7ec8e3" stroke-width="2" marker-end="url(#a1)"/>
<path d="M 440 162 L 440 200 L 380 200 L 380 162" stroke="#7ec8e3" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#a1)"/>
<text x="452" y="205" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">아직 예산 안이면 다시</text>
<path d="M 700 162 L 700 250 L 180 250 L 180 166" stroke="#e05555" stroke-width="2.5" fill="none" stroke-dasharray="5,3" marker-end="url(#a2)"/>
<text x="360" y="272" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e05555">예산을 넘으면 남은 반복을 버리고 다시 수집한다 (KL 조기 중단)</text>
<rect x="56" y="292" width="768" height="60" rx="10" fill="#111318" stroke="#2a2f3a" stroke-width="1"/>
<text x="76" y="316" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">clip은 한 걸음의 크기를 막고, KL 조기 중단은 걸음이 몇 번 쌓였는지를 막는다.</text>
<text x="76" y="338" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">clip만으로는 여러 번 반복하는 동안 비율이 조금씩 밀려 나가는 것을 못 잡는다.</text>
</svg>