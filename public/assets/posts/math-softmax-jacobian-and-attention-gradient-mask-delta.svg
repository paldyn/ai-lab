<text x="440" y="374" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">회색 칸은 가린 자리다. P = 0 이라 U 가 무엇이든 Δ = 0 — 역전파에서 마스크를 다시 걸 필요가 없다</text>
<text x="440" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">Δ 의 파란 칸은 가중평균보다 U 가 큰 자리, 붉은 칸은 작은 자리다. 어느 행이든 합은 0이다</text>
