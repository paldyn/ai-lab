<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="360" fill="#0a0a0a" rx="12"/>
  <text x="60" y="46" fill="#e8e8e8" font-size="22" font-weight="700">2×2 연립: 두 직선의 교점</text>
  <text x="60" y="72" fill="#888" font-size="13">$$x + y = 5$$ 와 $$2x - y = 1$$ 의 해가 $$(x, y) = (2, 3)$$ 인 것은 두 직선이 그 점에서 만나기 때문입니다.</text>

  <!-- axes: center at (440, 210), 1 unit = 30px -->
  <line x1="200" y1="210" x2="680" y2="210" stroke="#888" stroke-width="1.5"/>
  <line x1="440" y1="90" x2="440" y2="330" stroke="#888" stroke-width="1.5"/>
  <text x="686" y="215" fill="#888" font-size="13">x</text>
  <text x="446" y="88" fill="#888" font-size="13">y</text>

  <!-- ticks -->
  <g stroke="#444" stroke-width="0.8">
    <line x1="380" y1="207" x2="380" y2="213"/><line x1="410" y1="207" x2="410" y2="213"/>
    <line x1="470" y1="207" x2="470" y2="213"/><line x1="500" y1="207" x2="500" y2="213"/>
    <line x1="530" y1="207" x2="530" y2="213"/><line x1="560" y1="207" x2="560" y2="213"/>
    <line x1="437" y1="180" x2="443" y2="180"/><line x1="437" y1="150" x2="443" y2="150"/>
    <line x1="437" y1="120" x2="443" y2="120"/>
    <line x1="437" y1="240" x2="443" y2="240"/><line x1="437" y1="270" x2="443" y2="270"/>
  </g>
  <g fill="#888" font-size="11" text-anchor="middle">
    <text x="470" y="228">1</text><text x="500" y="228">2</text><text x="530" y="228">3</text><text x="560" y="228">4</text>
    <text x="433" y="184" text-anchor="end">1</text><text x="433" y="154" text-anchor="end">2</text><text x="433" y="124" text-anchor="end">3</text>
  </g>

  <!-- Line 1: x + y = 5 -> y = 5 - x. At x=-2, y=7 (390,0). At x=6, y=-1 (620, 240) -->
  <line x1="290" y1="30" x2="620" y2="240" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="580" y="120" fill="#7ec8e3" font-size="13" font-weight="700">x + y = 5</text>

  <!-- Line 2: 2x - y = 1 -> y = 2x - 1. At x=-1, y=-3 (410, 300). At x=4, y=7 (560, 0) -->
  <line x1="380" y1="240" x2="590" y2="30" stroke="#e59866" stroke-width="2.5"/>
  <text x="560" y="60" fill="#e59866" font-size="13" font-weight="700">2x - y = 1</text>

  <!-- Intersection at (2, 3) -> (500, 120) -->
  <circle cx="500" cy="120" r="5" fill="#55c555"/>
  <text x="510" y="112" fill="#55c555" font-size="14" font-weight="700">(2, 3)</text>

  <!-- Side note -->
  <rect x="60" y="270" width="760" height="70" fill="#111827" stroke="#3a4a6e" stroke-width="1" rx="6"/>
  <text x="80" y="295" fill="#7ec8e3" font-size="13" font-weight="700">교점이 곧 연립방정식의 해입니다.</text>
  <text x="80" y="318" fill="#e8e8e8" font-size="13">두 식을 동시에 만족하는 점 하나가 있으면 해가 하나, 두 직선이 나란하면 해가 없거나 무한히 많습니다.</text>
</svg>
