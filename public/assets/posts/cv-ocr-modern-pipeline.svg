<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="ocA" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>
  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">OCR은 두 단계였고, 지금은 그 경계가 흐려진다</text>
  <text x="62" y="68" font-size="13" fill="#888">글자를 찾는 일과 읽는 일은 원래 다른 모델이었다.</text>

  <text x="62" y="104" font-size="13" font-weight="600" fill="#7ec8e3">단계형 — 찾고, 읽고, 고친다</text>

  <rect x="62" y="114" width="170" height="81" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="78" y="140" font-size="13" font-weight="600" fill="#e8e8e8">① 전처리</text>
  <text x="78" y="160" font-size="11" fill="#9aa4b8">기울기 보정 · 이진화</text>
  <text x="78" y="178" font-size="11" fill="#9aa4b8">해상도 맞추기</text>
  <line x1="232" y1="155" x2="254" y2="155" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ocA)"/>

  <rect x="254" y="114" width="170" height="81" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="270" y="140" font-size="13" font-weight="600" fill="#e8e8e8">② 텍스트 검출</text>
  <text x="270" y="160" font-size="11" fill="#9aa4b8">DBNet · CRAFT</text>
  <text x="270" y="178" font-size="11" fill="#9aa4b8">글자 영역을 찾는다</text>
  <line x1="424" y1="155" x2="446" y2="155" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ocA)"/>

  <rect x="446" y="114" width="170" height="81" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="462" y="140" font-size="13" font-weight="600" fill="#e8e8e8">③ 문자 인식</text>
  <text x="462" y="160" font-size="11" fill="#9aa4b8">CRNN+CTC · TrOCR</text>
  <text x="462" y="178" font-size="11" fill="#9aa4b8">영역마다 한 줄 읽기</text>
  <line x1="616" y1="155" x2="638" y2="155" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ocA)"/>

  <rect x="638" y="114" width="170" height="81" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="654" y="140" font-size="13" font-weight="600" fill="#e8e8e8">④ 후처리</text>
  <text x="654" y="160" font-size="11" fill="#9aa4b8">사전 · 정규식으로</text>
  <text x="654" y="178" font-size="11" fill="#9aa4b8">혼동 글자 교정</text>

  <text x="62" y="250" font-size="13" font-weight="600" fill="#55c555">끝까지 한 모델 — 보고 바로 답한다</text>

  <rect x="62" y="260" width="746" height="81" rx="8" fill="#12151c" stroke="#55c555" stroke-width="1.5"/>
  <text x="86" y="286" font-size="13" font-weight="600" fill="#e8e8e8">이미지와 지시를 함께 VLM에 넣는다</text>
  <text x="86" y="306" font-size="11" fill="#9aa4b8">「이 영수증에서 품목과 금액을 뽑아 JSON으로」 — 검출·인식·후처리가 한 번에 일어난다</text>
  <text x="86" y="324" font-size="11" fill="#e05555">대신 어디를 읽었는지 좌표가 안 남고, 안 보이는 글자를 조용히 지어낼 수 있다</text>

  <text x="62" y="382" font-size="12" fill="#9aa4b8">좌표가 필요하면 단계형을, 형식 있는 값만 필요하면 끝까지 한 모델을 쓴다.</text>
  <text x="62" y="402" font-size="12" fill="#9aa4b8">둘을 겹쳐 쓰는 것이 가장 흔하다 — 검출로 영역을 잡고, 그 조각만 VLM에 넘긴다.</text>
</svg>
