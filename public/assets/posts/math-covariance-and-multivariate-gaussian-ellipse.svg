<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">Σ = [[25,15],[15,25]] 의 고유값은 40과 10, 고유벡터는 45도 방향 둘. 타원의 반지름이 √40 과 √10 이다.</text>
