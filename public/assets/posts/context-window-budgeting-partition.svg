<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>
  <text x="60" y="48" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">창 하나를 여섯 칸으로 나눈다</text>
  <text x="60" y="74" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">예시: 20만 토큰 창. 칸 폭은 비례가 아니다 — 작은 칸도 읽히게 넓혔다</text>

  <path d="M 60 122 L 60 112 L 580 112 L 580 122" fill="none" stroke="#7ec8e3" stroke-width="2"/>
  <text x="320" y="102" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">입력 예산 182,000</text>
  <path d="M 590 122 L 590 112 L 820 112 L 820 122" fill="none" stroke="#e05555" stroke-width="2"/>
  <text x="705" y="102" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">입력이 못 쓰는 자리 18,000</text>

  <rect x="60" y="132" width="70" height="56" rx="6" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="95" y="165" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">시스템</text>
  <rect x="134" y="132" width="86" height="56" rx="6" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="177" y="165" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">도구 스키마</text>
  <rect x="224" y="132" width="200" height="56" rx="6" fill="#14141c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="324" y="165" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">대화 이력</text>
  <rect x="428" y="132" width="152" height="56" rx="6" fill="#14141c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="504" y="165" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">근거 문서</text>
  <rect x="590" y="132" width="100" height="56" rx="6" fill="#1c1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="640" y="165" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">출력 상한</text>
  <rect x="694" y="132" width="126" height="56" rx="6" fill="#1c1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="757" y="165" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">안전 여유</text>

  <text x="95" y="212" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">3,000</text>
  <text x="177" y="212" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">6,000</text>
  <text x="414" y="212" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">둘이 나눠 쓰는 몫 173,000</text>
  <text x="640" y="212" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">8,000</text>
  <text x="757" y="212" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">10,000 (5%)</text>

  <text x="60" y="262" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">떼는 순서</text>
  <rect x="60" y="280" width="240" height="70" rx="8" fill="#14141c" stroke="#e05555" stroke-width="1.5"/>
  <text x="80" y="309" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">1. 출력 상한과 안전 여유</text>
  <text x="80" y="331" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">답이 끊기는 실패는 되돌릴 수 없다</text>
  <rect x="320" y="280" width="240" height="70" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="340" y="309" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">2. 시스템 지시와 도구 스키마</text>
  <text x="340" y="331" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">거의 고정이라 경로마다 한 번 잰다</text>
  <rect x="580" y="280" width="240" height="70" rx="8" fill="#14141c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="600" y="309" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">3. 이력과 문서에 칸별 상한</text>
  <text x="600" y="331" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">먼저 차는 쪽이 남의 자리를 못 먹게</text>

  <text x="60" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">남는 몫을 처음부터 넘겨 주지 않는다 — 고정 분할로 시작해야 강등이 어디서 시작될지 예측된다</text>
  <text x="60" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">예산을 넘으면 이력·문서 칸이 줄어들고, 출력·여유 칸은 어떤 강등에서도 그대로다</text>
</svg>
