<text x="60" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">이차함수라면 뉴턴법은 한 스텝에 최소점에 닿는다</text>
<text x="60" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">f(x,y) = ½(10x² + y²) 의 등고선. 곡률이 두 방향에서 10 배 다르다</text>
