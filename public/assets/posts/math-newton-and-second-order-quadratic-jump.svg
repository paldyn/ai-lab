<text x="86" y="124" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">뉴턴 — d = −H⁻¹∇f, 한 스텝</text>
<rect x="60" y="138" width="16" height="14" rx="3" fill="#e0a355"/>
<text x="86" y="150" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e0a355">경사하강 — 최선의 η 로도 9 스텝 뒤 여기</text>
<text x="60" y="396" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">H⁻¹ 이 두 방향의 곡률 차이를 정확히 지운다. 이차함수에서는 근사가 곧 원함수라 한 번에 닿는다.</text>
<text x="60" y="418" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">학습률이라는 손잡이가 없다는 점도 눈여겨볼 것 — 걸음의 길이를 곡률이 정한다.</text>
