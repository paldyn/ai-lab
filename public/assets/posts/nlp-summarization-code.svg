<svg width="880" height="400" viewBox="0 0 880 400"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">T5 / BART로 한국어 요약 구현</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">추상적 요약 모델 파인튜닝</text>

  <!-- Left: model loading &amp; inference -->
  <text x="220" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">① 추론 (BART 기반)</text>
  <rect x="40" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="56" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">transformers </tspan><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">pipeline</tspan></text>

  <text x="56" y="147" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">summarizer </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">pipeline(</tspan></text>
  <text x="56" y="165" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    "summarization",</text>
  <text x="56" y="183" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    # 한국어 BART 파인튜닝 모델</text>
  <text x="56" y="201" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    model=</tspan><tspan fill="#ce9178">&quot;digit82/kobart-summarization&quot;</tspan></text>
  <text x="56" y="219" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>

  <text x="56" y="243" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">result </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">summarizer(</tspan></text>
  <text x="56" y="261" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    article_text,</text>
  <text x="56" y="279" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    max_length=</tspan><tspan fill="#b5cea8">128</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="56" y="297" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    min_length=</tspan><tspan fill="#b5cea8">30</tspan></text>
  <text x="56" y="315" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">)[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">][</tspan><tspan fill="#ce9178">&quot;summary_text&quot;</tspan><tspan fill="#ffffff"> ]</tspan></text>

  <!-- Right: ROUGE evaluation -->
  <text x="660" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">② ROUGE 평가</text>
  <rect x="480" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="496" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">rouge_score </tspan><tspan fill="#7ec8e3">import</tspan></text>
  <text x="496" y="147" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    rouge_scorer</text>

  <text x="496" y="171" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">scorer </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">rouge_scorer.RougeScorer(</tspan></text>
  <text x="496" y="189" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    [</tspan><tspan fill="#ce9178">'rouge1','rouge2','rougeL'</tspan><tspan fill="#ffffff">],</tspan></text>
  <text x="496" y="207" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    use_stemmer=</tspan><tspan fill="#7ec8e3">False</tspan><tspan fill="#9aa4b8">  # 한국어</tspan></text>
  <text x="496" y="225" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>

  <text x="496" y="249" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">scores </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">scorer.score(</tspan></text>
  <text x="496" y="267" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    reference, hypothesis)</text>
  <text x="496" y="291" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># scores['rouge1'].fmeasure</text>
  <text x="496" y="309" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># → 0.68 (unigram overlap)</text>
  <text x="496" y="327" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># scores['rougeL'].fmeasure</text>
  <text x="496" y="345" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># → 0.61 (LCS overlap)</text>

  <!-- Bottom note -->
  <text x="440" y="372" text-anchor="middle" fill="#888" font-size="12">BERTScore: 의미 유사도 기반 보완 지표 — ROUGE의 어휘 겹침 한계를 극복</text>
</svg>
