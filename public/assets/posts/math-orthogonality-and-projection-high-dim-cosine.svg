<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">차원이 커질수록 무작위 두 벡터는 직교에 가까워진다</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#7ec8e3">코사인의 전형적 크기 = 1 / √d</text>
  <line x1="120" y1="300.0" x2="812" y2="300.0" stroke="#444" stroke-width="1"/>
  <text x="108" y="305.0" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0.0</text>
  <line x1="120" y1="250.0" x2="812" y2="250.0" stroke="#444" stroke-width="1"/>
  <text x="108" y="255.0" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0.2</text>
  <line x1="120" y1="200.0" x2="812" y2="200.0" stroke="#444" stroke-width="1"/>
  <text x="108" y="205.0" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0.4</text>
  <line x1="120" y1="150.0" x2="812" y2="150.0" stroke="#444" stroke-width="1"/>
  <text x="108" y="155.0" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0.6</text>
  <line x1="120" y1="100.0" x2="812" y2="100.0" stroke="#444" stroke-width="1"/>
  <text x="108" y="105.0" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0.8</text>
  <line x1="120" y1="86" x2="120" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="120" y1="300" x2="812" y2="300" stroke="#888" stroke-width="1.5"/>
  <text x="120" y="76" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">코사인</text>
  <polyline points="170,123.2 320,220.9 470,275.0 620,292.1 770,297.5" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="170" cy="123.2" r="5" fill="#e8e8e8"/>
  <text x="170" y="107.2" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">0.707</text>
  <text x="170" y="326" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8">d = 2</text>
  <text x="170" y="350" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">사잇각 45.0°</text>
  <circle cx="320" cy="220.9" r="5" fill="#e8e8e8"/>
  <text x="320" y="204.9" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">0.316</text>
  <text x="320" y="326" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8">d = 10</text>
  <text x="320" y="350" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">사잇각 71.6°</text>
  <circle cx="470" cy="275.0" r="5" fill="#e8e8e8"/>
  <text x="470" y="259.0" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">0.100</text>
  <text x="470" y="326" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8">d = 100</text>
  <text x="470" y="350" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">사잇각 84.3°</text>
  <circle cx="620" cy="292.1" r="5" fill="#e8e8e8"/>
  <text x="620" y="276.1" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">0.032</text>
  <text x="620" y="326" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8">d = 1,000</text>
  <text x="620" y="350" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">사잇각 88.2°</text>
  <circle cx="770" cy="297.5" r="5" fill="#e8e8e8"/>
  <text x="770" y="281.5" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">0.010</text>
  <text x="770" y="326" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8">d = 10,000</text>
  <text x="770" y="350" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">사잇각 89.4°</text>
  <text x="440" y="384" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">코사인 0이 직각이다 — 차원 1만에서는 아무렇게나 고른 두 벡터가 89.4도로 만난다</text>
</svg>
