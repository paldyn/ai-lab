<svg width="880" height="380" viewBox="0 0 880 380"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">LLM 사전학습: 데이터 처리 파이프라인</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">원시 텍스트 → 품질 필터링 → 토큰화 → 학습 배치</text>

  <!-- Left: data processing -->
  <text x="220" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">① 데이터 전처리</text>
  <rect x="40" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="56" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">re</tspan></text>
  <text x="56" y="147" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">datasets </tspan><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">load_dataset</tspan></text>

  <text x="56" y="171" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">def </tspan><tspan fill="#ffffff">quality_filter(doc: str) -&gt; bool:</tspan></text>

  <text x="56" y="189" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    # 너무 짧은 문서 제거</text>
  <text x="56" y="207" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">    if </tspan><tspan fill="#ffffff">len(doc.split()) </tspan><tspan fill="#7ec8e3">&lt; </tspan><tspan fill="#b5cea8">100</tspan></text>
  <text x="56" y="225" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">        return </tspan><tspan fill="#7ec8e3">False</tspan></text>

  <text x="56" y="243" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    # 알파벳 비율 체크</text>
  <text x="56" y="261" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    alpha_ratio </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">sum(c.isalpha()</tspan></text>
  <text x="56" y="279" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">        for c in doc) / len(doc)</text>
  <text x="56" y="297" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">    if </tspan><tspan fill="#ffffff">alpha_ratio </tspan><tspan fill="#7ec8e3">&lt; </tspan><tspan fill="#b5cea8">0.5</tspan></text>
  <text x="56" y="315" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">        return </tspan><tspan fill="#7ec8e3">False</tspan></text>
  <text x="56" y="333" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">    return </tspan><tspan fill="#7ec8e3">True</tspan></text>

  <!-- Right: tokenization + batching -->
  <text x="660" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">② 토큰화 + 배치 구성</text>
  <rect x="480" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="496" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">transformers </tspan><tspan fill="#7ec8e3">import</tspan></text>
  <text x="496" y="147" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    AutoTokenizer</text>

  <text x="496" y="171" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">tok </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">AutoTokenizer.from_pretrained(</tspan></text>
  <text x="496" y="189" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    "meta-llama/Llama-3.1-8B"</text>
  <text x="496" y="207" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>

  <text x="496" y="231" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">def </tspan><tspan fill="#ffffff">pack_sequences(texts, ctx_len=</tspan><tspan fill="#b5cea8">4096</tspan><tspan fill="#ffffff">):</tspan></text>
  <text x="496" y="249" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    # 여러 문서를 이어붙여</text>
  <text x="496" y="267" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    # ctx_len 길이 청크로 분할</text>
  <text x="496" y="285" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    all_ids </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">[]</tspan></text>
  <text x="496" y="303" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">    for </tspan><tspan fill="#ffffff">text </tspan><tspan fill="#7ec8e3">in </tspan><tspan fill="#ffffff">texts:</tspan></text>
  <text x="496" y="321" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">        all_ids </tspan><tspan fill="#7ec8e3">+= </tspan><tspan fill="#ffffff">tok.encode(text)</tspan></text>
  <text x="496" y="339" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">    return </tspan><tspan fill="#ffffff">[all_ids[i:i+ctx_len]</tspan></text>

  <!-- Bottom note -->
  <text x="440" y="362" text-anchor="middle" fill="#888" font-size="12">Document Packing: 패딩 없이 여러 문서를 이어붙여 GPU 효율 극대화 (GPT-3 방식)</text>
</svg>
