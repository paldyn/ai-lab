<svg xmlns="http://www.w3.org/2000/svg" width="880" height="424" viewBox="0 0 880 424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="424" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">무엇을 넘길 것인가</text>
  <text x="60" y="72" font-size="13" fill="#888">같은 일감을 넘기는 두 방식이다. 왼쪽은 넘기는 쪽이 편하고, 오른쪽은 받는 쪽이 잘한다.</text>

  <rect x="60" y="100" width="350" height="280" rx="10" fill="#0d1117" stroke="#e05555" stroke-width="1.5"/>
  <text x="80" y="128" font-size="15" font-weight="600" fill="#e8e8e8">대화를 통째로 넘긴다</text>
  <rect x="80" y="146" width="310" height="26" rx="6" fill="#101418" stroke="#444444" stroke-width="1"/>
  <text x="94" y="164" font-size="12" fill="#888">시스템 프롬프트</text>
  <rect x="80" y="178" width="310" height="26" rx="6" fill="#101418" stroke="#444444" stroke-width="1"/>
  <text x="94" y="196" font-size="12" fill="#888">사용자의 첫 질문</text>
  <rect x="80" y="210" width="310" height="26" rx="6" fill="#101418" stroke="#444444" stroke-width="1"/>
  <text x="94" y="228" font-size="12" fill="#888">도구 결과 · 표 전체</text>
  <rect x="80" y="242" width="310" height="26" rx="6" fill="#101418" stroke="#444444" stroke-width="1"/>
  <text x="94" y="260" font-size="12" fill="#888">도구 결과 · 로그 전체</text>
  <rect x="80" y="274" width="310" height="26" rx="6" fill="#101418" stroke="#444444" stroke-width="1"/>
  <text x="94" y="292" font-size="12" fill="#888">여기까지 모델이 한 말</text>
  <text x="80" y="330" font-size="12.5" fill="#e05555">31,000 토큰</text>
  <text x="80" y="352" font-size="12.5" fill="#888">무엇이 목표인지 어디에도 안 적혀 있다</text>

  <rect x="470" y="100" width="350" height="280" rx="10" fill="#0d1117" stroke="#55c555" stroke-width="1.5"/>
  <text x="490" y="128" font-size="15" font-weight="600" fill="#e8e8e8">필요한 것만 담아 넘긴다</text>
  <text x="490" y="156" font-size="12" font-weight="600" fill="#888">해낼 것</text>
  <text x="490" y="176" font-size="12.5" fill="#e8e8e8">8월 반품 사유 상위 다섯을 표로</text>
  <text x="490" y="206" font-size="12" font-weight="600" fill="#888">이미 알아낸 것</text>
  <text x="490" y="226" font-size="12.5" fill="#e8e8e8">주문은 orders 테이블에 있다</text>
  <text x="490" y="256" font-size="12" font-weight="600" fill="#888">하면 안 되는 것</text>
  <text x="490" y="276" font-size="12.5" fill="#e8e8e8">고객 이름과 연락처는 꺼내지 않는다</text>
  <text x="490" y="306" font-size="12" font-weight="600" fill="#888">돌려줄 모양</text>
  <text x="490" y="326" font-size="12.5" fill="#e8e8e8">사유 · 건수 · 비율 세 칸짜리 목록</text>
  <text x="490" y="360" font-size="12.5" fill="#55c555">900 토큰</text>

  <text x="60" y="404" font-size="13" fill="#7ec8e3">넘기는 쪽이 고르는 수고를 한 번 하면, 받는 쪽이 매번 추측하지 않아도 된다.</text>
</svg>
