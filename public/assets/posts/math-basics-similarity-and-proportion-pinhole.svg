<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="530" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">핀홀 카메라 속 두 삼각형</text>
  <text x="60" y="82" font-size="13" fill="#888">빛줄기가 구멍에서 엇갈려 바깥과 안쪽에 닮은 삼각형이 생긴다 (길이의 비율은 실제와 다르게 그렸다)</text>

  <polygon points="150,160 150,300 560,300" fill="#7ec8e3" fill-opacity="0.10"/>
  <polygon points="560,300 700,300 700,347.8" fill="#7ec8e3" fill-opacity="0.18"/>

  <rect x="560" y="230" width="140" height="140" fill="none" stroke="#888" stroke-width="1.5"/>
  <line x1="560" y1="294" x2="560" y2="306" stroke="#0a0a0a" stroke-width="3"/>
  <text x="630" y="216" font-size="13" fill="#888" text-anchor="middle">앞면 가운데 작은 구멍</text>

  <line x1="150" y1="300" x2="700" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="150" y1="160" x2="700" y2="347.8" stroke="#7ec8e3" stroke-width="2"/>

  <line x1="150" y1="300" x2="150" y2="160" stroke="#e8e8e8" stroke-width="5"/>
  <line x1="700" y1="300" x2="700" y2="347.8" stroke="#55c555" stroke-width="5"/>
  <circle cx="560" cy="300" r="4" fill="#e8e8e8"/>

  <text x="136" y="236" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="end">건물 30 m</text>
  <text x="355" y="326" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">거리 60 m</text>
  <text x="712" y="330" font-size="14" font-weight="600" fill="#55c555">상 10 cm</text>
  <text x="630" y="394" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">깊이 20 cm</text>

  <rect x="60" y="420" width="760" height="70" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="449" font-size="14" font-weight="600" fill="#e8e8e8">60 m = 6,000 cm 는 20 cm 의 300배 → 상은 건물 3,000 cm 를 300으로 나눈 10 cm</text>
  <text x="84" y="471" font-size="13" fill="#888">구멍에서 엇갈린 두 각은 맞꼭지각이라 같고, 건물과 상은 나란하다 — 그래서 닮음이고 상은 거꾸로 선다</text>
</svg>
