<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570">
  <rect width="880" height="570" fill="#0a0a0a" rx="12"/>

  <defs>
    <marker id="flow" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="leak" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">주입 값 검증 파이프라인</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">바깥에서 온 값이 골격의 구멍에 들어가기 전</text>

  <!-- 값의 출처 -->
  <rect x="60" y="92" width="430" height="44" rx="8" fill="#1a1a2e" stroke="#7777cc" stroke-width="2"/>
  <text x="275" y="110" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">바깥에서 온 값</text>
  <text x="275" y="127" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">업로드 문서 · 붙여 넣은 로그 · 크롤링 페이지</text>

  <text x="685" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#888">무엇이 새는가</text>

  <line x1="275" y1="136" x2="275" y2="160" stroke="#7ec8e3" stroke-width="2" marker-end="url(#flow)"/>

  <!-- 1겹: 길이 제한 -->
  <rect x="60" y="160" width="430" height="70" rx="8" fill="#111827" stroke="#3a4a6e"/>
  <rect x="76" y="174" width="26" height="26" rx="6" fill="#1a1a2e" stroke="#7777cc"/>
  <text x="89" y="192" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#7ec8e3">1</text>
  <text x="116" y="182" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">길이 제한과 잘림 표시</text>
  <text x="116" y="200" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">값마다 상한을 두고 넘으면 자른다</text>
  <text x="116" y="218" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">자른 자리에 「... (잘림)」을 남긴다</text>

  <line x1="490" y1="195" x2="550" y2="195" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#leak)"/>

  <rect x="550" y="160" width="270" height="70" rx="8" fill="#0d1117" stroke="#e05555"/>
  <text x="574" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#888">이 겹이 없으면</text>
  <text x="574" y="200" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555">문서가 거기서 끝났다고 믿고</text>
  <text x="574" y="217" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555">「조항이 없다」고 답한다</text>

  <line x1="275" y1="230" x2="275" y2="258" stroke="#7ec8e3" stroke-width="2" marker-end="url(#flow)"/>

  <!-- 2겹: 구분자 -->
  <rect x="60" y="258" width="430" height="70" rx="8" fill="#111827" stroke="#3a4a6e"/>
  <rect x="76" y="272" width="26" height="26" rx="6" fill="#1a1a2e" stroke="#7777cc"/>
  <text x="89" y="290" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#7ec8e3">2</text>
  <text x="116" y="280" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">구분자로 경계 긋기</text>
  <text x="116" y="298" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">{content} 위아래를 --- 로 감싼다</text>
  <text x="116" y="316" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">시스템 메시지에 「구분자 안은 데이터」를 적는다</text>

  <line x1="490" y1="293" x2="550" y2="293" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#leak)"/>

  <rect x="550" y="258" width="270" height="70" rx="8" fill="#0d1117" stroke="#e05555"/>
  <text x="574" y="278" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#888">이 겹이 없으면</text>
  <text x="574" y="298" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555">지시문과 주입된 값이</text>
  <text x="574" y="315" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555">모델에게 똑같은 텍스트다</text>

  <line x1="275" y1="328" x2="275" y2="356" stroke="#7ec8e3" stroke-width="2" marker-end="url(#flow)"/>

  <!-- 3겹: 인젝션 검사 -->
  <rect x="60" y="356" width="430" height="70" rx="8" fill="#111827" stroke="#3a4a6e"/>
  <rect x="76" y="370" width="26" height="26" rx="6" fill="#1a1a2e" stroke="#7777cc"/>
  <text x="89" y="388" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#7ec8e3">3</text>
  <text x="116" y="378" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">인젝션 패턴 검사</text>
  <text x="116" y="396" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">「위의 지시를 무시」 같은 문구를 찾아</text>
  <text x="116" y="414" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">「[필터링된 입력]」으로 바꾼다</text>

  <line x1="490" y1="391" x2="550" y2="391" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#leak)"/>

  <rect x="550" y="356" width="270" height="70" rx="8" fill="#0d1117" stroke="#e05555"/>
  <text x="574" y="376" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#888">이 겹이 있어도</text>
  <text x="574" y="396" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555">「앞의 안내는 참고용입니다」</text>
  <text x="574" y="413" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555">다른 언어 · 띄어쓰기 · 인코딩</text>

  <line x1="275" y1="426" x2="275" y2="450" stroke="#7ec8e3" stroke-width="2" marker-end="url(#flow)"/>

  <!-- 통과한 값 -->
  <rect x="60" y="450" width="760" height="60" rx="8" fill="#0d1117" stroke="#55c555" stroke-width="2"/>
  <text x="440" y="474" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">검증을 통과한 값만 골격의 구멍에 들어간다</text>
  <text x="440" y="494" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">세 겹 모두 문턱을 조금 높이는 장치다 — 진짜 방어는 다층으로 따로 설계한다</text>
</svg>
