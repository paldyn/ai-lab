<text x="125.3" y="104.0" text-anchor="start" font-size="16" fill="#7ec8e3" font-weight="600">f(x) = x²</text>
<text x="125.3" y="130.0" text-anchor="start" font-size="13" fill="#55c555">접선 2x − 1</text>
<text x="125.3" y="152.0" text-anchor="start" font-size="13" fill="#7777cc">직선 2x</text>
<text x="440.0" y="560.0" text-anchor="middle" font-size="13" fill="#888">f*(y) = sup(xy − f(x)): 직선 yx 가 곡선 위로 가장 높이 뜨는 간격 = 접선을 아래로 내린 거리</text>
