<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="dsArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">추론 증류는 데이터 파이프라인이다</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">교사의 사고 궤적을 모으고, 정답으로 거르고, 남은 것만 학생에게 지도 학습으로 먹인다</text>

  <rect x="60" y="104" width="150" height="46" rx="6" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="135" y="132" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">교사 모델</text>

  <rect x="263" y="104" width="150" height="46" rx="6" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="338" y="132" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">사고 궤적 생성</text>

  <rect x="466" y="104" width="150" height="46" rx="6" fill="#12121a" stroke="#e05555" stroke-width="1"/>
  <text x="541" y="132" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">정답 필터</text>

  <rect x="669" y="104" width="150" height="46" rx="6" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="744" y="132" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">학생 지도 학습</text>

  <line x1="210" y1="127" x2="263" y2="127" stroke="#7ec8e3" stroke-width="2" marker-end="url(#dsArr)"/>
  <line x1="413" y1="127" x2="466" y2="127" stroke="#7ec8e3" stroke-width="2" marker-end="url(#dsArr)"/>
  <line x1="616" y1="127" x2="669" y2="127" stroke="#7ec8e3" stroke-width="2" marker-end="url(#dsArr)"/>

  <circle cx="212" cy="127" r="4" fill="#e8e8e8" opacity="0">
    <animate attributeName="cx" values="212;259" dur="1.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="1.5s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="415" cy="127" r="4" fill="#e8e8e8" opacity="0">
    <animate attributeName="cx" values="415;462" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="618" cy="127" r="4" fill="#e8e8e8" opacity="0">
    <animate attributeName="cx" values="618;665" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <text x="135" y="180" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">사고가 강한 큰 모델</text>
  <text x="135" y="198" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">라이선스부터 확인</text>

  <text x="338" y="180" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">문항당 k회 샘플링</text>
  <text x="338" y="198" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">사고와 답을 함께 저장</text>

  <text x="541" y="180" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">정답 일치분만 통과</text>
  <text x="541" y="198" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555">나머지는 폐기</text>

  <text x="744" y="180" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">작은 모델을 SFT</text>
  <text x="744" y="198" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">사고 형식까지 모방</text>

  <rect x="60" y="232" width="760" height="140" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="260" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">{</text>
  <text x="76" y="279" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#ce9178">"prompt"</tspan>: <tspan fill="#ce9178">"..."</tspan>,</text>
  <text x="76" y="298" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#ce9178">"thinking"</tspan>: <tspan fill="#ce9178">"조건을 정리하면 ..."</tspan>,</text>
  <text x="76" y="317" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#ce9178">"answer"</tspan>: <tspan fill="#ce9178">"24"</tspan>,</text>
  <text x="76" y="336" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#ce9178">"verified"</tspan>: <tspan fill="#b5cea8">true</tspan>   <tspan fill="#9aa4b8">// 필터 통과분만 남는다</tspan></text>
  <text x="76" y="355" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>

  <text x="50" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">필터가 없으면 학생은 교사의 실수까지 그대로 배운다. 증류 품질의 대부분은 이 한 단계에서 갈린다.</text>
</svg>
