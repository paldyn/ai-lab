<svg xmlns="http://www.w3.org/2000/svg" width="880" height="414" viewBox="0 0 880 414" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="fw" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="bk" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="414" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">넘기는 봉투와 돌려받는 봉투</text>
  <text x="60" y="72" font-size="13" fill="#888">핸드오프는 한 방향이 아니다. 돌아오는 쪽에 담기는 것을 정해 두지 않으면 관리자가 결과를 믿을 수 없다.</text>

  <rect x="60" y="110" width="150" height="100" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="135" y="155" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">관리자</text>
  <text x="135" y="176" font-size="12" fill="#888" text-anchor="middle">일감을 쪼갠다</text>
  <line x1="210" y1="160" x2="280" y2="160" stroke="#7ec8e3" stroke-width="2" marker-end="url(#fw)"/>

  <rect x="280" y="110" width="320" height="100" rx="8" fill="#0d1117" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="300" y="135" font-size="13" font-weight="600" fill="#7ec8e3">넘기는 봉투</text>
  <text x="300" y="157" font-size="12" fill="#e8e8e8">해낼 것과 「됐다」의 조건</text>
  <text x="300" y="175" font-size="12" fill="#e8e8e8">지금까지 확인된 사실</text>
  <text x="300" y="193" font-size="12" fill="#e8e8e8">금지·예산과 돌려줄 모양</text>

  <line x1="600" y1="160" x2="670" y2="160" stroke="#7ec8e3" stroke-width="2" marker-end="url(#fw)"/>
  <rect x="670" y="110" width="150" height="100" rx="8" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="745" y="155" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">일꾼</text>
  <text x="745" y="176" font-size="12" fill="#888" text-anchor="middle">그 일만 한다</text>

  <rect x="670" y="250" width="150" height="100" rx="8" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="745" y="295" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">일꾼</text>
  <text x="745" y="316" font-size="12" fill="#888" text-anchor="middle">끝났거나 막혔다</text>
  <line x1="670" y1="300" x2="600" y2="300" stroke="#55c555" stroke-width="2" marker-end="url(#bk)"/>

  <rect x="280" y="250" width="320" height="100" rx="8" fill="#0d1117" stroke="#55c555" stroke-width="1.5"/>
  <text x="300" y="275" font-size="13" font-weight="600" fill="#55c555">돌려받는 봉투</text>
  <text x="300" y="297" font-size="12" fill="#e8e8e8">정해진 모양 그대로의 결과</text>
  <text x="300" y="315" font-size="12" fill="#e8e8e8">못 한 것과 그 이유</text>
  <text x="300" y="333" font-size="12" fill="#e8e8e8">확신이 낮은 자리 · 쓴 값</text>

  <line x1="280" y1="300" x2="210" y2="300" stroke="#55c555" stroke-width="2" marker-end="url(#bk)"/>
  <rect x="60" y="250" width="150" height="100" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="135" y="295" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">관리자</text>
  <text x="135" y="316" font-size="12" fill="#888" text-anchor="middle">받아서 검사한다</text>

  <text x="60" y="390" font-size="13" fill="#7ec8e3">「못 했다」가 돌아올 자리가 없으면 일꾼은 못 한 것을 지어내서라도 채워 온다.</text>
</svg>
