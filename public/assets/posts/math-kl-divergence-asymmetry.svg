  <line x1="632" y1="240" x2="678" y2="240" stroke="#e05555" stroke-width="2.5" marker-end="url(#klArr)"/>

  <text x="60" y="362" font-size="13" fill="#888">같은 두 분포인데 0.531과 0.737이다. 순서를 바꿀 수 없다는 표시가 ‖ 기호다.</text>
