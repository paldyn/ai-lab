  <rect x="270" y="225" width="45" height="75" fill="#7777cc"/>
  <rect x="340" y="225" width="45" height="75" fill="#7777cc"/>
  <text x="102" y="157" font-size="13" fill="#888" text-anchor="middle">0.9</text>
