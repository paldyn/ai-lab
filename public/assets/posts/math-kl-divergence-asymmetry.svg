  <text x="137" y="322" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">p</text>
  <text x="327" y="322" font-size="14" font-weight="600" fill="#7777cc" text-anchor="middle">q</text>
  <line x1="212" y1="240" x2="258" y2="240" stroke="#e05555" stroke-width="2.5" marker-end="url(#klArr)"/>

  <!-- right -->
  <text x="470" y="90" font-size="16" font-weight="600" fill="#7777cc">D_KL(q ‖ p) = 0.737</text>
  <text x="470" y="112" font-size="13" fill="#888">앞에 오는 q 가 벌점의 무게를 정한다</text>
  <line x1="490" y1="300" x2="820" y2="300" stroke="#888" stroke-width="1.5"/>
  <rect x="500" y="225" width="45" height="75" fill="#7777cc"/>
  <rect x="570" y="225" width="45" height="75" fill="#7777cc"/>
  <rect x="690" y="165" width="45" height="135" fill="#7ec8e3"/>
