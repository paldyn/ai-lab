  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">행마다 구간 하나, 고윳값은 그 안에 있다</text>
  <text x="60" y="74" font-size="13" fill="#888">A 의 열이 (4,1),(1,2) 일 때 — 가운데는 대각 성분, 반지름은 그 행의 나머지 합</text>
