<svg xmlns="http://www.w3.org/2000/svg" width="880" height="418" viewBox="0 0 880 418" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="418" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">셋은 서로 다른 질문에 답한다</text>
  <text x="62" y="68" font-size="13" fill="#888">하나로 나머지 둘을 대신할 수 없다. 트레이스를 안 남기면 가운데 질문에 답할 방법이 없다.</text>

  <rect x="62" y="100" width="756" height="78" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
  <rect x="82" y="121" width="110" height="36" rx="8" fill="#1a2438" stroke="#7777cc" stroke-width="1.5"/>
  <text x="137" y="145" font-size="14" font-weight="600" fill="#8f8fdd" text-anchor="middle">메트릭</text>
  <text x="212" y="132" font-size="15" font-weight="600" fill="#e8e8e8">지금 시스템이 어떤 상태인가</text>
  <text x="212" y="156" font-size="13" fill="#9aa4b8">초당 요청 수, p95 지연, 오류율, 토큰 소모량. 가볍고 오래 보관한다.</text>

  <rect x="62" y="194" width="756" height="78" rx="10" fill="#101820" stroke="#4a90a8" stroke-width="1.5"/>
  <rect x="82" y="215" width="110" height="36" rx="8" fill="#12242c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="137" y="239" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">트레이스</text>
  <text x="212" y="226" font-size="15" font-weight="600" fill="#e8e8e8">이 요청 한 건이 어디를 어떻게 지났는가</text>
  <text x="212" y="250" font-size="13" fill="#9aa4b8">스팬의 부모·자식 관계와 각 구간의 시간. 느린 요청 하나를 집어 원인을 좁힐 때 쓴다.</text>

  <rect x="62" y="288" width="756" height="78" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
  <rect x="82" y="309" width="110" height="36" rx="8" fill="#1a2418" stroke="#55c555" stroke-width="1.5"/>
  <text x="137" y="333" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">로그</text>
  <text x="212" y="320" font-size="15" font-weight="600" fill="#e8e8e8">그 순간 정확히 무슨 값이 오갔는가</text>
  <text x="212" y="344" font-size="13" fill="#9aa4b8">보낸 프롬프트, 받은 원문, 예외 메시지. 가장 무겁고 가장 민감해서 보관 기간을 따로 정한다.</text>

  <text x="62" y="396" font-size="12" fill="#888">메트릭이 "느려졌다"를 알려 주고, 트레이스가 "여기서 느려졌다"로 좁히고, 로그가 "이 입력이었다"를 보여 준다.</text>
</svg>
