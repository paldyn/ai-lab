<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <defs>
    <marker id="arrPick" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>

  <text x="60" y="52" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">어느 지표를 쓸 것인가</text>
  <text x="60" y="80" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">모델이 아니라 가진 라벨이 먼저 답을 좁힌다</text>

  <rect x="60" y="110" width="380" height="60" rx="6" fill="#111111" stroke="#7777cc" stroke-width="1.5"/>
  <text x="84" y="146" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">관련도가 등급(0~3)으로 매겨져 있는가</text>

  <line x1="440" y1="140" x2="560" y2="140" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrPick)"/>
  <text x="478" y="126" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">예</text>

  <rect x="560" y="110" width="260" height="60" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="584" y="134" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555">NDCG</text>
  <text x="584" y="154" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">등급과 순위를 함께 본다</text>

  <line x1="250" y1="170" x2="250" y2="220" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrPick)"/>
  <text x="266" y="200" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">아니오</text>

  <rect x="60" y="220" width="380" height="60" rx="6" fill="#111111" stroke="#7777cc" stroke-width="1.5"/>
  <text x="84" y="256" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">한 쿼리에 정답이 여럿 있는가</text>

  <line x1="440" y1="250" x2="560" y2="250" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrPick)"/>
  <text x="478" y="236" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">예</text>

  <rect x="560" y="220" width="260" height="60" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="584" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555">MAP</text>
  <text x="584" y="264" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">정답 전체의 자리를 본다</text>

  <line x1="250" y1="280" x2="250" y2="330" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrPick)"/>
  <text x="266" y="310" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">아니오</text>

  <rect x="60" y="330" width="380" height="60" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="84" y="354" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555">MRR</text>
  <text x="84" y="374" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">첫 정답의 순위만 본다</text>

  <rect x="60" y="420" width="760" height="56" rx="6" fill="#111111" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="444" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e05555">순서를 뒤집지 말 것</text>
  <text x="84" y="466" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">쓰고 싶은 지표에 맞춰 라벨을 만드는 것이 아니라, 가진 라벨이 쓸 수 있는 지표를 정한다</text>
</svg>
