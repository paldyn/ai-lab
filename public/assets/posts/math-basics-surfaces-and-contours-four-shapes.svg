  <text x="80" y="758" font-size="12" fill="#9aa4b8">늘어진 타원. 두 축의 비가 √10 ≈ 3.16이다</text>
  <text x="500" y="472" font-size="15" font-weight="600" fill="#e8e8e8">봉우리</text>
  <text x="500" y="492" font-size="12" fill="#888">z = exp(−(x² + y²)/2)</text>
