  <text x="500" y="398" font-size="12" fill="#9aa4b8">가로로는 오르고(하늘색) 세로로는 내려간다(보라색)</text>
  <text x="80" y="472" font-size="15" font-weight="600" fill="#e8e8e8">길쭉한 골짜기</text>
  <text x="80" y="492" font-size="12" fill="#888">z = x² + 10y²</text>
