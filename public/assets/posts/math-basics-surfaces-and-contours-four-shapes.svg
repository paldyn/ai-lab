  <text x="80" y="398" font-size="12" fill="#9aa4b8">동심원. 바깥으로 갈수록 촘촘해진다 = 가팔라진다</text>
  <text x="500" y="112" font-size="15" font-weight="600" fill="#e8e8e8">안장</text>
