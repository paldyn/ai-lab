  <rect width="880" height="806" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">같은 높이를 이은 선 하나로 곡면을 읽는다</text>
  <text x="60" y="82" font-size="13" fill="#888">등고선의 간격이 가파름이고, 등고선의 모양이 그 지점의 지형이다</text>

  <text x="80" y="112" font-size="15" font-weight="600" fill="#e8e8e8">그릇</text>
  <text x="80" y="132" font-size="12" fill="#888">z = x² + y²</text>
