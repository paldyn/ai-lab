  <text x="500" y="758" font-size="12" fill="#9aa4b8">꼭대기도 바깥도 평평하고, 중간 띠에서만 가파르다</text>

  <text x="60" y="786" font-size="13" fill="#9aa4b8">네 그림 모두 높이 눈금은 같다. 달라 보이는 것은 등고선의 간격과 모양뿐이다</text>
