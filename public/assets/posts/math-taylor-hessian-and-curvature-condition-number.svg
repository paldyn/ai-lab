<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 384">
<rect x="0" y="0" width="880" height="384" rx="12" fill="#0a0a0a"/>
<text x="60" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">조건수 κ 가 커질수록 등고선이 √κ 배 길쭉해진다</text>
<rect x="60" y="82" width="213" height="200" rx="10" fill="#0f1116" stroke="#2a2f3a" stroke-width="1"/>
<ellipse cx="166.5" cy="182" rx="37.0" ry="37.0" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-opacity="0.95"/>
<ellipse cx="166.5" cy="182" rx="29.1" ry="29.1" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-opacity="0.7"/>
<ellipse cx="166.5" cy="182" rx="20.9" ry="20.9" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-opacity="0.45"/>
<circle cx="166.5" cy="182" r="5" fill="#e8e8e8"/>
<text x="166.5" y="250" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">λ = 4, 4</text>
<text x="166.5" y="306" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3" text-anchor="middle">κ = 1</text>
<text x="166.5" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888" text-anchor="middle">길이 비 √κ = 1</text>
<rect x="333" y="82" width="213" height="200" rx="10" fill="#0f1116" stroke="#2a2f3a" stroke-width="1"/>
<ellipse cx="439.5" cy="182" rx="52.3" ry="26.2" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-opacity="0.95"/>
<ellipse cx="439.5" cy="182" rx="41.2" ry="20.6" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-opacity="0.7"/>
<ellipse cx="439.5" cy="182" rx="29.6" ry="14.8" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-opacity="0.45"/>
<circle cx="439.5" cy="182" r="5" fill="#e8e8e8"/>
<text x="439.5" y="250" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">λ = 8, 2</text>
<text x="439.5" y="306" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3" text-anchor="middle">κ = 4</text>
<text x="439.5" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888" text-anchor="middle">길이 비 √κ = 2</text>
<rect x="606" y="82" width="213" height="200" rx="10" fill="#0f1116" stroke="#2a2f3a" stroke-width="1"/>
<ellipse cx="712.5" cy="182" rx="74.0" ry="14.8" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-opacity="0.95"/>
<ellipse cx="712.5" cy="182" rx="58.3" ry="11.7" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-opacity="0.7"/>
<ellipse cx="712.5" cy="182" rx="41.9" ry="8.4" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-opacity="0.45"/>
<circle cx="712.5" cy="182" r="5" fill="#e8e8e8"/>
<text x="712.5" y="250" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">λ = 25, 1</text>
<text x="712.5" y="306" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3" text-anchor="middle">κ = 25</text>
<text x="712.5" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888" text-anchor="middle">길이 비 √κ = 5</text>
<text x="60" y="366" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">가파른 방향의 축이 짧다 — 반축 길이가 √(2c/λ) 라서 큰 λ 쪽이 먼저 등고선에 닿는다.</text>
</svg>
