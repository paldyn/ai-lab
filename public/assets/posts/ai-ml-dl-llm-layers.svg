<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450">
  <defs>
    <style>
      text { font-family: 'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif; }
      .layer-title { font-size: 16px; font-weight: 700; fill: #e8e8e8; }
      .layer-sub { font-size: 12px; font-weight: 600; fill: #888888; letter-spacing: 0.08em; }
      .layer-desc { font-size: 13px; fill: #aaaaaa; }
    </style>
    <marker id="layerArrow" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="880" height="450" fill="#0a0a0a" rx="12"/>

  <text x="60" y="52" font-size="22" font-weight="700" fill="#e8e8e8">딥러닝 레이어 구조</text>
  <text x="60" y="80" font-size="15" fill="#888888">원시 입력이 층을 지날수록 더 추상적인 특징으로 바뀝니다</text>

  <!-- 입력층 -->
  <rect x="60" y="118" width="160" height="220" rx="8" fill="#111417" stroke="#555555" stroke-width="1.5"/>
  <text x="140" y="152" class="layer-title" text-anchor="middle">입력층</text>
  <text x="140" y="176" class="layer-sub" text-anchor="middle">INPUT LAYER</text>
  <line x1="84" y1="194" x2="196" y2="194" stroke="#333333" stroke-width="1"/>
  <text x="140" y="224" class="layer-desc" text-anchor="middle">픽셀, 텍스트,</text>
  <text x="140" y="248" class="layer-desc" text-anchor="middle">숫자 등 원시 데이터</text>
  <circle cx="100" cy="290" r="7" fill="#181c20" stroke="#777777" stroke-width="1.5"/>
  <circle cx="120" cy="290" r="7" fill="#181c20" stroke="#777777" stroke-width="1.5"/>
  <circle cx="140" cy="290" r="7" fill="#181c20" stroke="#777777" stroke-width="1.5"/>
  <circle cx="160" cy="290" r="7" fill="#181c20" stroke="#777777" stroke-width="1.5"/>
  <circle cx="180" cy="290" r="7" fill="#181c20" stroke="#777777" stroke-width="1.5"/>

  <line x1="220" y1="228" x2="260" y2="228" stroke="#8a8a8a" stroke-width="1.5"
        marker-end="url(#layerArrow)"/>

  <!-- 은닉층 1 -->
  <rect x="260" y="118" width="160" height="220" rx="8" fill="#111820" stroke="#6b7f92" stroke-width="1.5"/>
  <text x="340" y="152" class="layer-title" text-anchor="middle">은닉층 1</text>
  <text x="340" y="176" class="layer-sub" text-anchor="middle">HIDDEN LAYER 1</text>
  <line x1="284" y1="194" x2="396" y2="194" stroke="#34404a" stroke-width="1"/>
  <text x="340" y="224" class="layer-desc" text-anchor="middle">선, 모양, 음소 등</text>
  <text x="340" y="248" class="layer-desc" text-anchor="middle">저수준 특징 추출</text>
  <circle cx="300" cy="290" r="7" fill="#14202a" stroke="#7ec8e3" stroke-width="1.5"/>
  <circle cx="320" cy="290" r="7" fill="#14202a" stroke="#7ec8e3" stroke-width="1.5"/>
  <circle cx="340" cy="290" r="7" fill="#14202a" stroke="#7ec8e3" stroke-width="1.5"/>
  <circle cx="360" cy="290" r="7" fill="#14202a" stroke="#7ec8e3" stroke-width="1.5"/>
  <circle cx="380" cy="290" r="7" fill="#14202a" stroke="#7ec8e3" stroke-width="1.5"/>

  <line x1="420" y1="228" x2="460" y2="228" stroke="#8a8a8a" stroke-width="1.5"
        marker-end="url(#layerArrow)"/>

  <!-- 은닉층 2 -->
  <rect x="460" y="118" width="160" height="220" rx="8" fill="#151426" stroke="#7777cc" stroke-width="1.5"/>
  <text x="540" y="152" class="layer-title" text-anchor="middle">은닉층 2</text>
  <text x="540" y="176" class="layer-sub" text-anchor="middle">HIDDEN LAYER 2</text>
  <line x1="484" y1="194" x2="596" y2="194" stroke="#3d3a62" stroke-width="1"/>
  <text x="540" y="224" class="layer-desc" text-anchor="middle">얼굴, 단어, 패턴 등</text>
  <text x="540" y="248" class="layer-desc" text-anchor="middle">고수준 특징 조합</text>
  <circle cx="500" cy="290" r="7" fill="#1c1b36" stroke="#a79dff" stroke-width="1.5"/>
  <circle cx="520" cy="290" r="7" fill="#1c1b36" stroke="#a79dff" stroke-width="1.5"/>
  <circle cx="540" cy="290" r="7" fill="#1c1b36" stroke="#a79dff" stroke-width="1.5"/>
  <circle cx="560" cy="290" r="7" fill="#1c1b36" stroke="#a79dff" stroke-width="1.5"/>
  <circle cx="580" cy="290" r="7" fill="#1c1b36" stroke="#a79dff" stroke-width="1.5"/>

  <line x1="620" y1="228" x2="660" y2="228" stroke="#8a8a8a" stroke-width="1.5"
        marker-end="url(#layerArrow)"/>

  <!-- 출력층 -->
  <rect x="660" y="118" width="160" height="220" rx="8" fill="#101c16" stroke="#55c555" stroke-width="1.5"/>
  <text x="740" y="152" class="layer-title" text-anchor="middle">출력층</text>
  <text x="740" y="176" class="layer-sub" text-anchor="middle">OUTPUT LAYER</text>
  <line x1="684" y1="194" x2="796" y2="194" stroke="#315139" stroke-width="1"/>
  <text x="684" y="228" font-size="14" font-weight="700" fill="#e8e8e8">고양이</text>
  <text x="796" y="228" font-size="14" font-weight="700" fill="#55c555" text-anchor="end">92%</text>
  <rect x="684" y="244" width="112" height="8" rx="4" fill="#233027"/>
  <rect x="684" y="244" width="103" height="8" rx="4" fill="#55c555"/>
  <text x="684" y="286" class="layer-desc">강아지</text>
  <text x="796" y="286" class="layer-desc" text-anchor="end">7%</text>
  <text x="684" y="316" class="layer-desc">기타</text>
  <text x="796" y="316" class="layer-desc" text-anchor="end">1%</text>

  <line x1="60" y1="374" x2="820" y2="374" stroke="#2f2f2f" stroke-width="1"/>
  <text x="60" y="414" font-size="14" fill="#aaaaaa">각 층은 이전 층의 출력을 입력으로 받아 더 추상적인 특징을 학습합니다</text>
</svg>
