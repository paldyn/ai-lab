<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410">
  <defs>
    <marker id="ind-arr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <rect width="880" height="410" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">독립 장애와 상관 장애</text>

  <!-- 왼쪽: 독립 -->
  <rect x="50" y="84" width="360" height="270" rx="10" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="230" y="116" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#55c555" text-anchor="middle">독립 — 공유하는 것이 없다</text>

  <rect x="74" y="132" width="312" height="56" rx="8" fill="#1a1a2a" stroke="#7777cc" stroke-width="1.5"/>
  <text x="98" y="156" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7777cc">1차 — 제공자 A</text>
  <text x="98" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">실패 확률 1%</text>

  <line x1="230" y1="188" x2="230" y2="208" stroke="#7777cc" stroke-width="2" marker-end="url(#ind-arr)"/>
  <text x="246" y="203" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">실패하면</text>

  <rect x="74" y="210" width="312" height="56" rx="8" fill="#1a1a2a" stroke="#7777cc" stroke-width="1.5"/>
  <text x="98" y="234" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7777cc">2차 — 제공자 B</text>
  <text x="98" y="254" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">실패 확률 1%</text>

  <rect x="74" y="284" width="312" height="54" rx="8" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="230" y="308" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">둘 다 실패 0.01%</text>
  <text x="230" y="328" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">만 번에 한 번</text>

  <!-- 오른쪽: 상관 -->
  <rect x="470" y="84" width="360" height="270" rx="10" fill="#111111" stroke="#e05555" stroke-width="1.5"/>
  <text x="650" y="116" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#e05555" text-anchor="middle">상관 — 제공자를 공유한다</text>

  <rect x="494" y="132" width="312" height="56" rx="8" fill="#1a1a2a" stroke="#7777cc" stroke-width="1.5"/>
  <text x="518" y="156" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7777cc">1차 — 제공자 A의 큰 모델</text>
  <text x="518" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">실패 확률 1%</text>

  <line x1="650" y1="188" x2="650" y2="208" stroke="#7777cc" stroke-width="2" marker-end="url(#ind-arr)"/>
  <text x="666" y="203" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">실패하면</text>

  <rect x="494" y="210" width="312" height="56" rx="8" fill="#1a1a2a" stroke="#7777cc" stroke-width="1.5"/>
  <text x="518" y="234" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7777cc">2차 — 제공자 A의 작은 모델</text>
  <text x="518" y="254" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">실패 확률 1%</text>

  <rect x="494" y="284" width="312" height="54" rx="8" fill="#2a1a1a" stroke="#e05555" stroke-width="1.5"/>
  <text x="650" y="308" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">둘 다 실패 1%</text>
  <text x="650" y="328" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">자리를 붙이기 전과 같다</text>

  <text x="440" y="386" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">체인의 값어치는 자리의 개수가 아니라 자리들 사이의 독립성에서 나온다</text>
</svg>
