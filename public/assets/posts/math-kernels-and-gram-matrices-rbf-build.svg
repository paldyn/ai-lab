<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
<rect width="880" height="560" rx="12" fill="#0a0a0a"/>
<defs><marker id="b1" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/></marker></defs>
<text x="440" y="42" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">선형 커널에서 RBF 커널까지 세 걸음</text>
<rect x="140" y="76" width="600" height="64" rx="8" fill="#111820" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="440" y="103" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="16" font-weight="600" fill="#e8e8e8" xml:space="preserve">x · y</text>
<text x="440" y="124" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">선형 커널 — φ(x) = x</text>
<rect x="140" y="186" width="600" height="64" rx="8" fill="#111820" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="440" y="213" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="16" font-weight="600" fill="#e8e8e8" xml:space="preserve">2γ · (x · y)</text>
<text x="440" y="234" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">양수배한 커널</text>
<rect x="140" y="296" width="600" height="64" rx="8" fill="#111820" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="440" y="323" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="16" font-weight="600" fill="#e8e8e8" xml:space="preserve">exp(2γ x · y)</text>
<text x="440" y="344" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">지수를 씌운 커널</text>
<rect x="140" y="406" width="600" height="92" rx="8" fill="#111820" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="440" y="436" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="15" font-weight="600" fill="#e8e8e8" xml:space="preserve">exp(-γ‖x‖²) · exp(2γ x · y) · exp(-γ‖y‖²)</text>
<text x="440" y="460" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="16" font-weight="600" fill="#7ec8e3" xml:space="preserve">= exp(-γ‖x − y‖²)</text>
<text x="440" y="482" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">RBF 커널</text>
<line x1="300" y1="140" x2="300" y2="186" stroke="#7777cc" stroke-width="2" marker-end="url(#b1)"/>
<text x="320" y="168" text-anchor="start" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">규칙 2 · 양수배 (2γ &gt; 0)</text>
<line x1="300" y1="250" x2="300" y2="296" stroke="#7777cc" stroke-width="2" marker-end="url(#b1)"/>
<text x="320" y="278" text-anchor="start" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">지수 · 급수 계수가 전부 양수</text>
<line x1="300" y1="360" x2="300" y2="406" stroke="#7777cc" stroke-width="2" marker-end="url(#b1)"/>
<text x="320" y="388" text-anchor="start" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">규칙 4 · 양쪽에 f(x) = exp(-γ‖x‖²)</text>
<text x="440" y="534" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8">합 · 양수배 · 곱 · 양쪽 곱하기는 커널을 보존한다 — 세 걸음 모두 그 안이다</text>
</svg>