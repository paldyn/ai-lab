    <rect x="746" y="226" width="14" height="14" rx="3"/>
    <rect x="762" y="226" width="14" height="14" rx="3"/>
  </g>
  <g fill="#e05555">
    <rect x="650" y="206" width="14" height="14" rx="3"/>
    <rect x="714" y="206" width="14" height="14" rx="3"/>
    <rect x="778" y="206" width="14" height="14" rx="3"/>
    <rect x="666" y="226" width="14" height="14" rx="3"/>
    <rect x="730" y="226" width="14" height="14" rx="3"/>
    <rect x="778" y="226" width="14" height="14" rx="3"/>
