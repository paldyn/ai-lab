  <text x="634" y="268" font-size="12" fill="#888">같은 원리의 표현 20개 중</text>
  <text x="634" y="286" font-size="12" fill="#888">패치 전에 통한 것</text>

  <text x="60" y="340" font-size="13" fill="#888">원본 하나만 막으면 정확히 그 하나만 막힌다 — 패치의 합격 기준은 변형군이다.</text>
</svg>
