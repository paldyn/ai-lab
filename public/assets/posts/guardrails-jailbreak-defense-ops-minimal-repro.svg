  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0a0a0a"/>

  <text x="60" y="50" font-size="22" font-weight="700" fill="#e8e8e8">스무 턴을 줄였다가 변형군으로 넓힌다</text>
  <text x="60" y="76" font-size="13" fill="#888">올라온 통짜 기록을 다음 단계가 기계적으로 소화할 모양으로 바꾸는 자리다.</text>

  <rect x="60" y="110" width="210" height="196" rx="10" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="84" y="142" font-size="16" font-weight="600" fill="#e8e8e8">올라온 기록</text>
  <text x="84" y="180" font-size="24" font-weight="700" fill="#e8e8e8">20턴</text>
