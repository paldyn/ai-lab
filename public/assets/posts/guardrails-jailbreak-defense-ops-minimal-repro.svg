  <rect x="415" y="200" width="5" height="46" rx="2" fill="#7777cc"/>
  <rect x="479" y="200" width="5" height="46" rx="2" fill="#7777cc"/>
  <text x="359" y="268" font-size="12" fill="#888">절반씩 잘라 네다섯 번에</text>
  <text x="359" y="286" font-size="12" fill="#888">n번 중 k번으로 판정</text>

  <line x1="545" y1="215" x2="610" y2="215" stroke="#e05555" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="577" y="199" font-size="12" fill="#888" text-anchor="middle">넓힌다</text>

  <rect x="610" y="110" width="210" height="196" rx="10" fill="#101418" stroke="#e05555" stroke-width="1.5"/>
  <text x="634" y="142" font-size="16" font-weight="600" fill="#e8e8e8">변형군</text>
  <text x="634" y="180" font-size="24" font-weight="700" fill="#e05555">6개 통과</text>
  <g fill="#101418" stroke="#3a4a6e" stroke-width="1">
