  <text x="84" y="268" font-size="12" fill="#888">신고·표본에서 올라온</text>
  <text x="84" y="286" font-size="12" fill="#888">대화 통짜 기록</text>

  <line x1="270" y1="215" x2="335" y2="215" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="302" y="199" font-size="12" fill="#888" text-anchor="middle">줄인다</text>

  <rect x="335" y="110" width="210" height="196" rx="10" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="359" y="142" font-size="16" font-weight="600" fill="#e8e8e8">최소 재현 케이스</text>
  <text x="359" y="180" font-size="24" font-weight="700" fill="#7777cc">2~3턴</text>
  <g fill="#242a35">
