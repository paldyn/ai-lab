<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">같은 특잇값 10·6·3·1, 세는 법에 따라 다른 비율</text>
  <text x="60" y="70" font-size="13" fill="#888">앞에서 k개를 남겼을 때 전체의 몇 %를 채웠나. 회색은 σ의 합으로, 파랑은 σ²의 합(에너지)으로 센 값이다.</text>
  <line x1="100" y1="330" x2="560" y2="330" stroke="#888" stroke-width="1.5"/>
  <line x1="100" y1="340" x2="100" y2="112" stroke="#888" stroke-width="1.5"/>
  <line x1="94" y1="120" x2="106" y2="120" stroke="#444" stroke-width="1"/>
  <line x1="94" y1="225" x2="106" y2="225" stroke="#444" stroke-width="1"/>
  <text x="92" y="124" font-size="13" fill="#888" text-anchor="end">100%</text>
  <text x="92" y="229" font-size="13" fill="#888" text-anchor="end">50%</text>
  <rect x="128" y="225.0" width="34" height="105.0" fill="#888888" fill-opacity="0.7" stroke="#888888" stroke-width="1"/>
  <text x="145" y="217.0" font-size="12" fill="#888888" text-anchor="middle">50</text>
  <rect x="168" y="186.2" width="34" height="143.8" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3" stroke-width="1"/>
  <text x="185" y="178.2" font-size="12" fill="#7ec8e3" text-anchor="middle">68.5</text>
  <text x="165" y="354" font-size="13" fill="#888" text-anchor="middle">k = 1</text>
  <rect x="238" y="162.0" width="34" height="168.0" fill="#888888" fill-opacity="0.7" stroke="#888888" stroke-width="1"/>
  <text x="255" y="154.0" font-size="12" fill="#888888" text-anchor="middle">80</text>
  <rect x="278" y="134.3" width="34" height="195.7" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3" stroke-width="1"/>
  <text x="295" y="126.3" font-size="12" fill="#7ec8e3" text-anchor="middle">93.2</text>
  <text x="275" y="354" font-size="13" fill="#888" text-anchor="middle">k = 2</text>
  <rect x="348" y="130.5" width="34" height="199.5" fill="#888888" fill-opacity="0.7" stroke="#888888" stroke-width="1"/>
  <text x="365" y="122.5" font-size="12" fill="#888888" text-anchor="middle">95</text>
  <rect x="388" y="121.5" width="34" height="208.5" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3" stroke-width="1"/>
  <text x="405" y="113.5" font-size="12" fill="#7ec8e3" text-anchor="middle">99.3</text>
  <text x="385" y="354" font-size="13" fill="#888" text-anchor="middle">k = 3</text>
  <rect x="458" y="120.0" width="34" height="210.0" fill="#888888" fill-opacity="0.7" stroke="#888888" stroke-width="1"/>
  <text x="475" y="112.0" font-size="12" fill="#888888" text-anchor="middle">100</text>
  <rect x="498" y="120.0" width="34" height="210.0" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3" stroke-width="1"/>
  <text x="515" y="112.0" font-size="12" fill="#7ec8e3" text-anchor="middle">100</text>
  <text x="495" y="354" font-size="13" fill="#888" text-anchor="middle">k = 4</text>
  <line x1="100" y1="141.0" x2="560" y2="141.0" stroke="#e05555" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="92" y="145.0" font-size="13" fill="#e05555" text-anchor="end">90%</text>
  <rect x="600" y="140" width="220" height="168" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="624" y="163" width="14" height="14" fill="#888888" fill-opacity="0.7" stroke="#888888"/>
  <text x="648" y="175" font-size="13" fill="#e8e8e8">σ의 합으로 센 비율</text>
  <rect x="624" y="191" width="14" height="14" fill="#7ec8e3" fill-opacity="0.7" stroke="#7ec8e3"/>
  <text x="648" y="203" font-size="13" fill="#e8e8e8">σ²의 합으로 센 비율</text>
  <text x="624" y="240" font-size="13" font-weight="600" fill="#e05555">90%를 처음 넘는 k</text>
  <text x="624" y="264" font-size="13" fill="#9aa4b8">σ의 합으로 세면  k = 3</text>
  <text x="624" y="288" font-size="13" fill="#7ec8e3">σ²의 합으로 세면  k = 2</text>
  <rect x="60" y="378" width="760" height="44" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="82" y="405" font-size="14" fill="#e8e8e8">프로베니우스 오차 공식에 들어가는 것은 σ²이다 — 그 오차와 맞물리는 비율은 제곱합 쪽이다.</text>
</svg>
