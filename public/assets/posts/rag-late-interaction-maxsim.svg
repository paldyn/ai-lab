<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="370" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">MaxSim — 행마다 최댓값 하나씩만 가져간다</text>
  <text x="60" y="72" font-size="13" fill="#888">질의 토큰(행)과 문서 토큰(열)의 유사도를 다 재고, 행마다 가장 큰 값 하나만 골라 더한다.</text>

  <text x="180" y="132" font-size="12" fill="#888" text-anchor="end">문서 →</text>
  <text x="221" y="132" font-size="12" fill="#888" text-anchor="middle">저희</text>
  <text x="283" y="132" font-size="12" fill="#888" text-anchor="middle">는</text>
  <text x="345" y="132" font-size="12" fill="#888" text-anchor="middle">환불</text>
  <text x="407" y="132" font-size="12" fill="#888" text-anchor="middle">규정</text>
  <text x="469" y="132" font-size="12" fill="#888" text-anchor="middle">상</text>
  <text x="531" y="132" font-size="12" fill="#888" text-anchor="middle">7일</text>

  <text x="180" y="173" font-size="13" fill="#e8e8e8" text-anchor="end">환불</text>
  <text x="180" y="219" font-size="13" fill="#e8e8e8" text-anchor="end">정책</text>
  <text x="180" y="265" font-size="13" fill="#e8e8e8" text-anchor="end">며칠</text>

  <rect x="190" y="145" width="372" height="138" rx="6" fill="#101418" stroke="#3a4a6e" stroke-width="1"/>

  <line x1="252" y1="145" x2="252" y2="283" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="314" y1="145" x2="314" y2="283" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="376" y1="145" x2="376" y2="283" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="438" y1="145" x2="438" y2="283" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="500" y1="145" x2="500" y2="283" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="190" y1="191" x2="562" y2="191" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="190" y1="237" x2="562" y2="237" stroke="#3a4a6e" stroke-width="1"/>

  <rect x="315" y="146" width="60" height="44" fill="#1a3a1a" stroke="#55c555" stroke-width="1.5"/>
  <rect x="377" y="192" width="60" height="44" fill="#1a3a1a" stroke="#55c555" stroke-width="1.5"/>
  <rect x="501" y="238" width="60" height="44" fill="#1a3a1a" stroke="#55c555" stroke-width="1.5"/>

  <text x="221" y="173" font-size="13" fill="#888" text-anchor="middle">0.12</text>
  <text x="283" y="173" font-size="13" fill="#888" text-anchor="middle">0.18</text>
  <text x="345" y="173" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">0.71</text>
  <text x="407" y="173" font-size="13" fill="#888" text-anchor="middle">0.24</text>
  <text x="469" y="173" font-size="13" fill="#888" text-anchor="middle">0.15</text>
  <text x="531" y="173" font-size="13" fill="#888" text-anchor="middle">0.09</text>

  <text x="221" y="219" font-size="13" fill="#888" text-anchor="middle">0.21</text>
  <text x="283" y="219" font-size="13" fill="#888" text-anchor="middle">0.14</text>
  <text x="345" y="219" font-size="13" fill="#888" text-anchor="middle">0.33</text>
  <text x="407" y="219" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">0.68</text>
  <text x="469" y="219" font-size="13" fill="#888" text-anchor="middle">0.19</text>
  <text x="531" y="219" font-size="13" fill="#888" text-anchor="middle">0.11</text>

  <text x="221" y="265" font-size="13" fill="#888" text-anchor="middle">0.08</text>
  <text x="283" y="265" font-size="13" fill="#888" text-anchor="middle">0.10</text>
  <text x="345" y="265" font-size="13" fill="#888" text-anchor="middle">0.16</text>
  <text x="407" y="265" font-size="13" fill="#888" text-anchor="middle">0.22</text>
  <text x="469" y="265" font-size="13" fill="#888" text-anchor="middle">0.13</text>
  <text x="531" y="265" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">0.64</text>

  <rect x="620" y="145" width="200" height="138" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="720" y="175" font-size="12" fill="#888" text-anchor="middle">행마다 최댓값을 고르고</text>
  <text x="720" y="200" font-size="12" fill="#888" text-anchor="middle">그 셋만 더한다</text>
  <text x="720" y="235" font-size="13" fill="#e8e8e8" text-anchor="middle">0.71 + 0.68 + 0.64</text>
  <text x="720" y="263" font-size="16" font-weight="700" fill="#55c555" text-anchor="middle">= 2.03</text>

  <text x="60" y="322" font-size="13" fill="#888">질의 토큰마다 가장 잘 맞는 문서 토큰 하나를 찾는 셈이다 — 「환불」은 「환불」에, 「며칠」은 「7일」에 걸린다.</text>
  <text x="60" y="346" font-size="13" fill="#888">문서 쪽 토큰이 남아도 벌점이 없다. 그래서 짧은 질의로 긴 문서를 찾는 데 잘 맞는다.</text>
</svg>
