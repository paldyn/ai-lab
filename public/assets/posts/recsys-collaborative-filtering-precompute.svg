  <line x1="550" y1="315" x2="600" y2="315" stroke="#e8e8e8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 710 175 L 710 220 L 440 220 L 440 280" fill="none" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-b)"/>
  <text x="575" y="204" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc" text-anchor="middle">미리 계산한 이웃 목록</text>
  <text x="440" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">무거운 계산은 배치에 두고, 요청 시점에는 조회와 합치기만 한다</text>
