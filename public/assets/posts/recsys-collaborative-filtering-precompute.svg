  <rect width="880" height="430" fill="#0a0a0a" rx="12"/>
  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">아이템 기반 CF — 미리 계산하고 요청 때는 조회만</text>
  <text x="60" y="92" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="start">배치 · 하루 한 번</text>
  <rect x="60" y="105" width="220" height="70" rx="8" fill="#111418" stroke="#7ec8e3" stroke-width="1.5"/>
