  <text x="170.0" y="332.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">사용자의 최근 10개</text>
  <rect x="330" y="280" width="220" height="70" rx="8" fill="#111418" stroke="#55c555" stroke-width="1.5"/>
