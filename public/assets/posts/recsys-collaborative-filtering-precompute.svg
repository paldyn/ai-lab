  <text x="710.0" y="157.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">아이템마다 상위 100개</text>
  <text x="60" y="267" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555" text-anchor="start">실시간 · 요청마다</text>
  <rect x="60" y="280" width="220" height="70" rx="8" fill="#111418" stroke="#55c555" stroke-width="1.5"/>
