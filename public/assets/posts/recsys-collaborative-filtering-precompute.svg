  <text x="710.0" y="332.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">유사도로 가중해 수백 개</text>
  <line x1="280" y1="140" x2="330" y2="140" stroke="#e8e8e8" stroke-width="2" marker-end="url(#arr)"/>
