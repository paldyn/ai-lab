  <text x="440.0" y="157.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">함께 평가한 사용자로 계산</text>
  <rect x="600" y="105" width="220" height="70" rx="8" fill="#111418" stroke="#7ec8e3" stroke-width="1.5"/>
