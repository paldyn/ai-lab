<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="grArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">모델이 낸 좌표는 모델이 본 그림의 좌표다</text>
  <text x="62" y="68" font-size="13" fill="#888">원본으로 되돌리지 않으면 조금씩 어긋난 자리를 가리킨다.</text>

  <text x="62" y="104" font-size="13" font-weight="600" fill="#7ec8e3">① 원본 — 가로가 긴 사진</text>
  <rect x="62" y="116" width="240" height="135" rx="6" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <rect x="170" y="150" width="80" height="60" rx="4" fill="none" stroke="#55c555" stroke-width="2"/>
  <text x="62" y="274" font-size="12" fill="#9aa4b8">1600 × 900 — 우리가 좌표를 찍고 싶은 곳</text>

  <line x1="302" y1="184" x2="340" y2="184" stroke="#7ec8e3" stroke-width="2" marker-end="url(#grArr)"/>

  <text x="340" y="104" font-size="13" font-weight="600" fill="#7ec8e3">② 모델 입력 — 정사각</text>
  <rect x="340" y="116" width="200" height="200" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <rect x="340" y="160" width="200" height="112" fill="#12151c"/>
  <rect x="430" y="188" width="67" height="50" rx="4" fill="none" stroke="#55c555" stroke-width="2"/>
  <text x="350" y="142" font-size="11" fill="#e05555">여백</text>
  <text x="350" y="300" font-size="11" fill="#e05555">여백</text>
  <text x="340" y="336" font-size="12" fill="#9aa4b8">896 × 896 — 위아래에 여백이 붙는다</text>

  <text x="580" y="104" font-size="13" font-weight="600" fill="#7ec8e3">③ 되돌리기</text>
  <text x="580" y="130" font-size="12" fill="#9aa4b8">모델이 내는 좌표는</text>
  <text x="580" y="152" font-size="12" fill="#9aa4b8">여백까지 포함한 정사각을</text>
  <text x="580" y="174" font-size="12" fill="#9aa4b8">0~1000으로 나눈 값이다.</text>
  <text x="580" y="204" font-size="12" fill="#9aa4b8">그래서 세로는 여백을 빼고,</text>
  <text x="580" y="226" font-size="12" fill="#9aa4b8">가로세로 모두 배율로</text>
  <text x="580" y="248" font-size="12" fill="#9aa4b8">나눠야 원본 픽셀이 된다.</text>

  <text x="62" y="374" font-size="13" font-weight="600" fill="#e8e8e8">역변환은 네 줄이면 끝난다</text>

  <rect x="62" y="386" width="756" height="104" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="80" y="412" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">scale = 896 / 1600            </tspan><tspan fill="#9aa4b8"># 0.56</tspan></text>
  <text x="80" y="432" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">padY  = (896 - 900*scale) / 2 </tspan><tspan fill="#9aa4b8"># 196</tspan></text>
  <text x="80" y="452" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">x_src = a/1000*896 / scale</tspan></text>
  <text x="80" y="472" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">y_src = (b/1000*896 - padY) / scale</tspan></text>
</svg>
