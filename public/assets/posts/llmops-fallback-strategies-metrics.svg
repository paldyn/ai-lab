<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <rect width="880" height="420" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">자리별 처리 비율과 오류율</text>
  <text x="440" y="74" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">폴백이 잘 동작하면 아무도 장애를 눈치채지 못한다</text>

  <text x="200" y="104" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888">자리별 처리 비율</text>
  <text x="760" y="104" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">대시보드</text>

  <!-- 평시 -->
  <text x="60" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">평시</text>
  <rect x="200" y="116" width="480" height="44" rx="4" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="440" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">1차 100%</text>
  <rect x="700" y="116" width="120" height="44" rx="4" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="760" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">오류율 0%</text>

  <!-- 폴백 10% -->
  <text x="60" y="214" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">폴백 10%</text>
  <rect x="200" y="186" width="432" height="44" rx="4" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="416" y="214" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">1차 90%</text>
  <rect x="632" y="186" width="48" height="44" rx="4" fill="#1a2a2a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="656" y="214" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" font-weight="600" fill="#7ec8e3" text-anchor="middle">10%</text>
  <rect x="700" y="186" width="120" height="44" rx="4" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="760" y="214" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">오류율 0%</text>

  <!-- 3차가 전부 -->
  <text x="60" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">3차가 전부</text>
  <rect x="200" y="256" width="480" height="44" rx="4" fill="#1a1a2a" stroke="#7777cc" stroke-width="1.5"/>
  <text x="440" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7777cc" text-anchor="middle">3차 소형 모델 100%</text>
  <rect x="700" y="256" width="120" height="44" rx="4" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="760" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">오류율 0%</text>

  <rect x="60" y="326" width="760" height="60" rx="8" fill="#2a1a1a" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e05555">세 줄 다 오류율은 0%다 — 폴백은 장애를 오류가 아니라 품질 저하로 바꾼다</text>
  <text x="84" y="370" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888">reason까지 갈라 두면 rate_limit이면 한도를, timeout이면 기한을 다시 볼 일이 된다</text>
</svg>
