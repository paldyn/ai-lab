<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="240" fill="#0a0a0a" rx="12"/>
  <text x="60" y="46" fill="#e8e8e8" font-size="22" font-weight="700">가우스-조던으로 역행렬 구하기</text>
  <text x="60" y="72" fill="#888" font-size="13">[A | I]에서 행 연산으로 왼쪽을 I로 만들면 오른쪽이 A⁻¹이 됩니다.</text>

  <!-- Left: [A|I] -->
  <text x="180" y="115" fill="#7ec8e3" font-size="14" font-weight="700" text-anchor="middle">시작</text>
  <path d="M 120,130 L 100,130 L 100,210 L 120,210" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 260,130 L 280,130 L 280,210 L 260,210" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <line x1="190" y1="130" x2="190" y2="210" stroke="#888" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e8e8e8" text-anchor="middle">
    <text x="145" y="152">A</text>
    <text x="235" y="152">I</text>
    <text x="145" y="180">(주어진 행렬)</text>
    <text x="235" y="180">(단위행렬)</text>
  </g>

  <!-- Arrow -->
  <defs>
    <marker id="arrgj" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <line x1="330" y1="170" x2="470" y2="170" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrgj)"/>
  <text x="400" y="158" fill="#7ec8e3" font-size="13" font-weight="700" text-anchor="middle">행 연산</text>
  <text x="400" y="192" fill="#888" font-size="11" text-anchor="middle">(왼쪽을 I로)</text>

  <!-- Right: [I|A^-1] -->
  <text x="620" y="115" fill="#55c555" font-size="14" font-weight="700" text-anchor="middle">끝</text>
  <path d="M 520,130 L 500,130 L 500,210 L 520,210" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 720,130 L 740,130 L 740,210 L 720,210" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <line x1="620" y1="130" x2="620" y2="210" stroke="#888" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e8e8e8" text-anchor="middle">
    <text x="570" y="152">I</text>
    <text x="680" y="152">A⁻¹</text>
    <text x="570" y="180">(단위행렬)</text>
    <text x="680" y="180">(역행렬)</text>
  </g>

  <text x="780" y="175" fill="#55c555" font-size="14" font-weight="700">= A⁻¹</text>
</svg>
