<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
<rect width="880" height="430" rx="12" fill="#0a0a0a"/>
<text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">상수를 빼도 답이 같다 — 그래서 최댓값을 뺀다</text>
<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">모든 점수에서 같은 수를 빼면 exp 의 비가 그대로라 확률이 변하지 않는다.</text>
<defs><marker id="s3" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker><marker id="s3g" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/></marker><marker id="s3r" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/></marker></defs>
<text x="60" y="120" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" fill="#7ec8e3" font-weight="600">그대로 계산</text>
<rect x="60" y="134" width="470" height="60" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
<text x="76" y="158" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">z      = [   2,     1,    -1]</text>
<text x="76" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">exp(z) = [7.389, 2.718, 0.368]</text>
<line x1="548" y1="164" x2="624" y2="164" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#s3)"/>
<text x="640" y="169" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" font-weight="600">p = [.705 .259 .035]</text>
<text x="60" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" fill="#55c555" font-weight="600">최댓값 2를 빼고 계산</text>
<rect x="60" y="238" width="470" height="60" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
<text x="76" y="262" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">z - 2  = [   0,    -1,    -3]</text>
<text x="76" y="282" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">exp    = [1.000, 0.368, 0.050]</text>
<line x1="548" y1="268" x2="624" y2="268" stroke="#55c555" stroke-width="2.5" marker-end="url(#s3g)"/>
<text x="640" y="273" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" font-weight="600">p = [.705 .259 .035]</text>
<text x="60" y="328" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" fill="#e05555" font-weight="600">점수가 클 때 그대로 계산하면</text>
<rect x="60" y="342" width="470" height="60" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
<text x="76" y="366" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">z      = [1000,   999,   997]</text>
<text x="76" y="386" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">exp(z) = [  inf,   inf,   inf]</text>
<line x1="548" y1="372" x2="624" y2="372" stroke="#e05555" stroke-width="2.5" marker-end="url(#s3r)"/>
<text x="640" y="377" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555" font-weight="600">p = [ nan nan nan]</text>
</svg>
