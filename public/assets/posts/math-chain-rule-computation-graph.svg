<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="cgF" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="cgB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="cgP" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">순전파로 값을 채우고, 역방향으로 미분을 채운다</text>
  <text x="60" y="76" font-size="13" fill="#888">x = 1, w₁ = 2, b = −1, w₂ = 3, t = 1, λ = 0.5</text>

  <text x="60" y="118" font-size="16" font-weight="600" fill="#7ec8e3">순전파 →</text>

  <rect x="70" y="132" width="140" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="140" y="156" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">a = w₁x + b</text>
  <text x="140" y="178" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">a = 1</text>

  <rect x="265" y="132" width="140" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="335" y="156" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">h = a²</text>
  <text x="335" y="178" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">h = 1</text>

  <rect x="460" y="132" width="140" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="530" y="156" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">y = w₂h</text>
  <text x="530" y="178" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">y = 3</text>

  <rect x="655" y="132" width="140" height="64" rx="6" fill="#000000" stroke="#7ec8e3" stroke-width="2"/>
  <text x="725" y="156" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">L = (y−t)² + λw₁²</text>
  <text x="725" y="178" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">L = 6</text>

  <line x1="210" y1="164" x2="265" y2="164" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#cgF)"/>
  <line x1="405" y1="164" x2="460" y2="164" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#cgF)"/>
  <line x1="600" y1="164" x2="655" y2="164" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#cgF)"/>

  <text x="60" y="250" font-size="16" font-weight="600" fill="#55c555">← 역전파</text>

  <rect x="70" y="264" width="140" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="140" y="288" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">∂L/∂a</text>
  <text x="140" y="310" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">12 × 2a = 24</text>

  <rect x="265" y="264" width="140" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="335" y="288" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">∂L/∂h</text>
  <text x="335" y="310" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">4 × w₂ = 12</text>

  <rect x="460" y="264" width="140" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="530" y="288" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">∂L/∂y</text>
  <text x="530" y="310" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">2(y−t) = 4</text>

  <rect x="655" y="264" width="140" height="64" rx="6" fill="#000000" stroke="#55c555" stroke-width="2"/>
  <text x="725" y="288" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">∂L/∂L</text>
  <text x="725" y="310" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">1</text>

  <line x1="655" y1="296" x2="600" y2="296" stroke="#55c555" stroke-width="2.5" marker-end="url(#cgB)"/>
  <line x1="460" y1="296" x2="405" y2="296" stroke="#55c555" stroke-width="2.5" marker-end="url(#cgB)"/>
  <line x1="265" y1="296" x2="210" y2="296" stroke="#55c555" stroke-width="2.5" marker-end="url(#cgB)"/>

  <text x="440" y="228" font-size="13" fill="#888" text-anchor="middle">각 걸음은 「받은 값 × 이 자리의 국소 비율」 곱셈 하나다</text>

  <rect x="70" y="366" width="725" height="62" rx="6" fill="#000000" stroke="#7777cc" stroke-width="2"/>
  <text x="432" y="392" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">w₁ 은 손실에 두 경로로 닿는다 — 신경망 경로와 벌점 경로</text>
  <text x="432" y="414" font-size="15" font-weight="700" fill="#7777cc" text-anchor="middle">∂L/∂w₁ = (24 × x) + (2λw₁) = 24 + 2 = 26</text>

  <line x1="140" y1="328" x2="140" y2="366" stroke="#7777cc" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#cgP)"/>
</svg>
