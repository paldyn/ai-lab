<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="452" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">정규화하면 코사인과 거리가 한 직선으로 묶인다</text>
  <text x="60" y="70" font-size="13" fill="#888">‖a‖ = ‖b‖ = 1 일 때 ‖a − b‖² = 2 − 2s,  s = cos_sim(a, b)</text>

  <line x1="140" y1="210" x2="620" y2="210" stroke="#444" stroke-width="1"/>
  <line x1="380" y1="330" x2="380" y2="100" stroke="#444" stroke-width="1"/>
  <line x1="140" y1="320" x2="620" y2="320" stroke="#888" stroke-width="1.5"/>
  <line x1="140" y1="320" x2="140" y2="96" stroke="#888" stroke-width="1.5"/>

  <text x="128" y="325" text-anchor="end" font-size="13" fill="#888">0</text>
  <text x="128" y="215" text-anchor="end" font-size="13" fill="#888">2</text>
  <text x="128" y="105" text-anchor="end" font-size="13" fill="#888">4</text>
  <text x="140" y="344" text-anchor="middle" font-size="13" fill="#888">−1</text>
  <text x="380" y="344" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="620" y="344" text-anchor="middle" font-size="13" fill="#888">1</text>
  <text x="628" y="325" font-size="13" fill="#888">s</text>
  <text x="112" y="90" font-size="13" fill="#888">‖a − b‖²</text>

  <line x1="140" y1="100" x2="620" y2="320" stroke="#7ec8e3" stroke-width="2.5"/>

  <circle cx="524" cy="276" r="5" fill="#e8e8e8"/>
  <circle cx="550" cy="288" r="5" fill="#e8e8e8"/>
  <circle cx="620" cy="320" r="5" fill="#55c555"/>

  <text x="500" y="256" text-anchor="end" font-size="13" fill="#e8e8e8">û  s = 0.600</text>
  <text x="574" y="304" font-size="13" fill="#e8e8e8">ŵ  s = 0.707</text>
  <text x="640" y="300" font-size="13" fill="#55c555">v̂  s = 1</text>

  <rect x="660" y="120" width="160" height="112" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="680" y="148" font-size="13" fill="#7777cc">이 직선의 성질</text>
  <text x="680" y="176" font-size="15" font-weight="600" fill="#e8e8e8">기울기 −2</text>
  <text x="680" y="200" font-size="13" fill="#888">엄격히 감소한다</text>
  <text x="680" y="220" font-size="13" fill="#888">뒤집을 자리가 없다</text>

  <rect x="60" y="372" width="760" height="60" rx="8" fill="#0f1a10" stroke="#55c555" stroke-width="2"/>
  <text x="84" y="398" font-size="15" font-weight="600" fill="#e8e8e8">s 가 커지면 거리의 제곱이 정확히 그만큼 작아진다</text>
  <text x="84" y="420" font-size="13" fill="#888">그래서 내적 내림차순 · 코사인 내림차순 · L2 오름차순이 동점까지 같은 순위가 된다.</text>
</svg>
