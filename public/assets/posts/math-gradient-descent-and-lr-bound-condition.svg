<text x="60" y="344" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">조건수가 10배가 되면 같은 정확도에 필요한 스텝도 10배가 된다 — 학습률은 이미 최선이다.</text>
