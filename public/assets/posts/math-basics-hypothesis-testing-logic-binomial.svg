<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="440" fill="#0a0a0a" rx="12"/>
  <text x="60" y="46" fill="#e8e8e8" font-size="22" font-weight="700">공정한 동전을 20번 던졌을 때 앞면 개수의 분포</text>
  <text x="60" y="72" fill="#888" font-size="13">$$P(X=k) = C(20,k) / 2^{20}$$ · 15 이상은 붉게 칠했습니다</text>

  <!-- axes -->
  <line x1="80" y1="380" x2="820" y2="380" stroke="#888" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="80" y2="100" stroke="#888" stroke-width="1.5"/>
  <text x="820" y="400" fill="#888" font-size="13" text-anchor="middle">k</text>
  <text x="60" y="105" fill="#888" font-size="13" text-anchor="end">확률</text>

  <!-- bars: 21 bars for k=0..20, bar width 32, gap 2. Start at x=88. Baseline y=380 -->
  <!-- Heights precomputed: scale so max ~0.176 -> 260px -->
  <!-- k, C(20,k)/2^20 -->
  <!-- 0: 0.0000010 -->
  <g fill="#7ec8e3">
    <rect x="88" y="379.6" width="32" height="0.4"/>
    <rect x="122" y="378.9" width="32" height="1.1"/>
    <rect x="156" y="374.7" width="32" height="5.3"/>
    <rect x="190" y="363.2" width="32" height="16.8"/>
    <rect x="224" y="343.4" width="32" height="36.6"/>
    <rect x="258" y="315.8" width="32" height="64.2"/>
    <rect x="292" y="284.0" width="32" height="96.0"/>
    <rect x="326" y="253.2" width="32" height="126.8"/>
    <rect x="360" y="228.5" width="32" height="151.5"/>
    <rect x="394" y="212.9" width="32" height="167.1"/>
    <rect x="428" y="207.5" width="32" height="172.5"/>
    <rect x="462" y="212.9" width="32" height="167.1"/>
    <rect x="496" y="228.5" width="32" height="151.5"/>
    <rect x="530" y="253.2" width="32" height="126.8"/>
    <rect x="564" y="284.0" width="32" height="96.0"/>
  </g>
  <g fill="#e05555">
    <rect x="598" y="315.8" width="32" height="64.2"/>
    <rect x="632" y="343.4" width="32" height="36.6"/>
    <rect x="666" y="363.2" width="32" height="16.8"/>
    <rect x="700" y="374.7" width="32" height="5.3"/>
    <rect x="734" y="378.9" width="32" height="1.1"/>
    <rect x="768" y="379.6" width="32" height="0.4"/>
  </g>

  <!-- k labels every other -->
  <g fill="#888" font-size="12" text-anchor="middle">
    <text x="104" y="398">0</text>
    <text x="172" y="398">2</text>
    <text x="240" y="398">4</text>
    <text x="308" y="398">6</text>
    <text x="376" y="398">8</text>
    <text x="444" y="398">10</text>
    <text x="512" y="398">12</text>
    <text x="580" y="398">14</text>
    <text x="614" y="398" fill="#e05555" font-weight="700">15</text>
    <text x="648" y="398">16</text>
    <text x="716" y="398">18</text>
    <text x="784" y="398">20</text>
  </g>

  <!-- annotation -->
  <text x="700" y="140" fill="#e05555" font-size="14" font-weight="700">P(X≥15) ≈ 0.021</text>
  <text x="700" y="160" fill="#e8e8e8" font-size="12">붉은 부분 전체를 더한 값</text>
  <line x1="700" y1="145" x2="640" y2="330" stroke="#e05555" stroke-width="1.2" stroke-dasharray="4,4"/>
</svg>
