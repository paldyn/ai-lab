<text x="60.0" y="70.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">f′(x) = arctan x 인 볼록함수를 x₀ = 1.5 에서 시작. 접선이 축과 만나는 곳이 다음 점이다</text>
