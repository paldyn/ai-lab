<text x="60.0" y="436.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">1.5 → −1.69 → 2.32 → −5.11 → 32.3 … 점이 멀어질수록 arctan 이 납작해져 접선이 더 멀리 던진다.</text>
<text x="60.0" y="458.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">경계 1.39 에서는 x₁ = −x₀ 이 되어 두 점을 영원히 오간다. 그 안쪽에서만 이차수렴이 선다.</text>
