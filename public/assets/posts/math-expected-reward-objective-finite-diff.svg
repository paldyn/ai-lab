<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 430">
<rect x="0" y="0" width="880" height="430" rx="12" fill="#0a0a0a"/>
<text x="60" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">유한차분으로 때우려면 표본이 이만큼 든다</text>
<text x="60" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">답이 셋뿐인 장난감 문제에서, 샘플로 잰 J 의 차분이 참 그래디언트와 얼마나 어긋나는가</text>
