<text x="560.0" y="228.19308771928257" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e0a355">표본 수의 제곱근에 반비례해 줄어든다</text>
<text x="60" y="386" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">10% 에 닿는 데 파라미터 하나당 10 억 번이다. 그리고 파라미터마다 따로 해야 한다.</text>
<text x="60" y="408" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">파라미터가 70 억 개인 모델에서 이 길은 열려 있지 않다.</text>
