<svg width="880" height="380" viewBox="0 0 880 380"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">LLM API 첫 호출: Claude + OpenAI</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">두 대표 LLM API 사용법 비교</text>

  <!-- Left: Claude API -->
  <text x="220" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">① Anthropic Claude</text>
  <rect x="40" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="56" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">anthropic </tspan><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">Anthropic</tspan></text>

  <text x="56" y="153" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">client </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">Anthropic()</tspan></text>

  <text x="56" y="177" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">message </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">client.messages.create(</tspan></text>
  <text x="56" y="195" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    model=</tspan><tspan fill="#ce9178">&quot;claude-sonnet-4-6&quot;</tspan></text>
  <text x="56" y="213" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    max_tokens=</tspan><tspan fill="#b5cea8">1024</tspan></text>
  <text x="56" y="231" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    system=</tspan><tspan fill="#ce9178">&quot;당신은 전문 AI 강사입니다.&quot;</tspan></text>
  <text x="56" y="249" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    messages=[{</text>
  <text x="56" y="267" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ce9178">        &quot;role&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;user&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="56" y="285" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ce9178">        &quot;content&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;LLM이란?&quot;</tspan></text>
  <text x="56" y="303" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    }]</text>
  <text x="56" y="321" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>
  <text x="56" y="339" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">print(message.content[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">].text)</tspan></text>

  <!-- Right: OpenAI API -->
  <text x="660" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">② OpenAI GPT</text>
  <rect x="480" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="496" y="129" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> openai </tspan><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> OpenAI</tspan></text>
  <text x="496" y="153" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">client = OpenAI()</tspan></text>
  <text x="496" y="177" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">response = client.chat.completions.create(</tspan></text>
  <text x="496" y="195" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    model=</tspan><tspan fill="#ce9178">&quot;gpt-4o&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="496" y="213" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    messages=[</tspan></text>
  <text x="496" y="231" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  {</tspan><tspan fill="#ce9178">&quot;role&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;system&quot;</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">&quot;content&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;AI 강사&quot;</tspan><tspan fill="#ffffff">},</tspan></text>
  <text x="496" y="249" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  {</tspan><tspan fill="#ce9178">&quot;role&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;user&quot;</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">&quot;content&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;LLM이란?&quot;</tspan><tspan fill="#ffffff">}]</tspan></text>
  <text x="496" y="267" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">)</tspan></text>
  <text x="496" y="285" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">print(response.choices[</tspan><tspan fill="#ce9178">0</tspan><tspan fill="#ffffff">].message.content)</tspan></text>




  <!-- Bottom note -->
  <text x="440" y="362" text-anchor="middle" fill="#888" font-size="12">두 API 모두 system + user 메시지 구조 — 모델만 다르고 인터페이스 유사</text>
</svg>
