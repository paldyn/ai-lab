<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="460" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="nlArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">수직선 위에는 빈자리가 없다</text>
  <text x="60" y="82" font-size="13" fill="#888">정수 사이사이를 분수가 채우고, 분수로도 안 되는 자리를 무리수가 채운다</text>

  <line x1="180" y1="190" x2="540" y2="190" stroke="#7777cc" stroke-width="1.5" marker-end="url(#nlArr)"/>
  <line x1="540" y1="190" x2="180" y2="190" stroke="#7777cc" stroke-width="1.5" marker-end="url(#nlArr)"/>
  <text x="360" y="176" font-size="13" fill="#7777cc" text-anchor="middle">−3 과 1 사이의 거리 = 4</text>

  <circle cx="135" cy="250" r="5" fill="#e8e8e8"/>
  <circle cx="423" cy="250" r="5" fill="#e8e8e8"/>
  <circle cx="577" cy="250" r="5" fill="#e8e8e8"/>
  <circle cx="693" cy="250" r="5" fill="#e8e8e8"/>
  <text x="135" y="228" font-size="14" fill="#7ec8e3" text-anchor="middle">−7/2</text>
  <text x="423" y="228" font-size="14" fill="#7ec8e3" text-anchor="middle">−0.3</text>
  <text x="577" y="228" font-size="14" fill="#7ec8e3" text-anchor="middle">√2</text>
  <text x="693" y="228" font-size="14" fill="#7ec8e3" text-anchor="middle">2.7</text>

  <line x1="90" y1="250" x2="810" y2="250" stroke="#888" stroke-width="1.5" marker-end="url(#nlArr)"/>
  <line x1="810" y1="250" x2="90" y2="250" stroke="#888" stroke-width="1.5" marker-end="url(#nlArr)"/>
  <line x1="90" y1="242" x2="90" y2="258" stroke="#888" stroke-width="1.5"/>
  <line x1="180" y1="242" x2="180" y2="258" stroke="#888" stroke-width="1.5"/>
  <line x1="270" y1="242" x2="270" y2="258" stroke="#888" stroke-width="1.5"/>
  <line x1="360" y1="242" x2="360" y2="258" stroke="#888" stroke-width="1.5"/>
  <line x1="450" y1="238" x2="450" y2="262" stroke="#e8e8e8" stroke-width="2"/>
  <line x1="540" y1="242" x2="540" y2="258" stroke="#888" stroke-width="1.5"/>
  <line x1="630" y1="242" x2="630" y2="258" stroke="#888" stroke-width="1.5"/>
  <line x1="720" y1="242" x2="720" y2="258" stroke="#888" stroke-width="1.5"/>
  <line x1="810" y1="242" x2="810" y2="258" stroke="#888" stroke-width="1.5"/>

  <text x="90" y="280" font-size="13" fill="#888" text-anchor="middle">−4</text>
  <text x="180" y="280" font-size="13" fill="#888" text-anchor="middle">−3</text>
  <text x="270" y="280" font-size="13" fill="#888" text-anchor="middle">−2</text>
  <text x="360" y="280" font-size="13" fill="#888" text-anchor="middle">−1</text>
  <text x="450" y="280" font-size="13" fill="#e8e8e8" text-anchor="middle">0</text>
  <text x="540" y="280" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="630" y="280" font-size="13" fill="#888" text-anchor="middle">2</text>
  <text x="720" y="280" font-size="13" fill="#888" text-anchor="middle">3</text>
  <text x="810" y="280" font-size="13" fill="#888" text-anchor="middle">4</text>

  <text x="450" y="322" font-size="15" fill="#7ec8e3" text-anchor="middle">왼쪽으로 갈수록 작다</text>

  <rect x="60" y="344" width="760" height="54" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="366" font-size="13" font-weight="600" fill="#e8e8e8">대소 비교는 이 한 문장으로 끝난다 — 수직선에서 오른쪽에 있는 수가 크다</text>
  <text x="84" y="386" font-size="13" fill="#888">−7 이 −3 보다 작은 것도 7 이 3 보다 크기 때문이 아니라, 더 왼쪽에 있기 때문이다</text>
</svg>
