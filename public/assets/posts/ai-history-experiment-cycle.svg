  <circle cx="598" cy="358" r="7" fill="#55c555"/>
  <text x="650" y="317" font-size="18" font-weight="700" fill="#55c555">1년에 쉰 번</text>

  <!-- Conclusion band -->
  <rect x="60" y="400" width="760" height="110" fill="#141414" rx="8" stroke="#333" stroke-width="1"/>
  <text x="440" y="430" text-anchor="middle" font-size="15" font-weight="600" fill="#e8e8e8">하드웨어는 모형을 좋게 만든 것이 아니라 시행착오를 싸게 만들었다</text>
  <line x1="88" y1="444" x2="792" y2="444" stroke="#222" stroke-width="1"/>
  <text x="440" y="466" text-anchor="middle" font-size="13" fill="#888">학습률과 층 수와 초기화를 바꿔 가며 쉰 번 돌려 본 사람이 네 번 돌려 본 사람을 이긴다</text>
  <text x="440" y="488" text-anchor="middle" font-size="13" fill="#555">딥러닝이 이론보다 경험칙이 앞서는 분야가 된 이유</text>
