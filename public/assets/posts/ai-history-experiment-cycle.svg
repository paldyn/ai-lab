<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 570"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <!-- Background -->
  <rect width="880" height="570" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">GPU가 바꾼 것은 실험 주기</text>
  <text x="440" y="74" text-anchor="middle" font-size="13" fill="#888">AlexNet은 GPU 두 장으로 엿새 학습했다 — 같은 것을 그 시절 CPU로 돌리면 몇 달이다</text>

  <text x="310" y="130" font-size="12" fill="#555">점 하나가 학습 한 번</text>

  <!-- CPU row -->
  <rect x="60" y="125" width="210" height="90" fill="#1f0f0f" rx="8" stroke="#e05555" stroke-width="1.5"/>
  <text x="165" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#e05555">CPU · 몇 달</text>
  <text x="165" y="186" text-anchor="middle" font-size="12" fill="#888">한 번 학습에 석 달</text>
  <circle cx="310" cy="170" r="7" fill="#e05555"/>
  <circle cx="342" cy="170" r="7" fill="#e05555"/>
  <circle cx="374" cy="170" r="7" fill="#e05555"/>
  <circle cx="406" cy="170" r="7" fill="#e05555"/>
  <text x="460" y="177" font-size="18" font-weight="700" fill="#e05555">1년에 네 번</text>

  <!-- GPU row -->
  <rect x="60" y="265" width="210" height="90" fill="#0f1f12" rx="8" stroke="#55c555" stroke-width="1.5"/>
  <text x="165" y="302" text-anchor="middle" font-size="15" font-weight="600" fill="#55c555">GPU 두 장 · 엿새</text>
  <text x="165" y="326" text-anchor="middle" font-size="12" fill="#888">한 번 학습에 엿새</text>
  <circle cx="310" cy="262" r="7" fill="#55c555"/>
