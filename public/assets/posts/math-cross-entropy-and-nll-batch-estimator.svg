<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0a0a0a"/>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">배치 손실은 참값을 겨냥해 흔들리는 추정값이다</text>

  <!-- standard error band -->
  <rect x="362" y="118" width="176" height="144" fill="#7ec8e3" fill-opacity="0.18"/>

  <!-- true value line -->
  <line x1="450" y1="112" x2="450" y2="262" stroke="#55c555" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="450" y="102" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">참값 L = H(p_data, q)</text>

  <!-- axis -->
  <line x1="180" y1="250" x2="740" y2="250" stroke="#888" stroke-width="1.5"/>
  <line x1="250" y1="250" x2="250" y2="258" stroke="#444" stroke-width="1.5"/>
  <line x1="350" y1="250" x2="350" y2="258" stroke="#444" stroke-width="1.5"/>
  <line x1="450" y1="250" x2="450" y2="258" stroke="#444" stroke-width="1.5"/>
  <line x1="550" y1="250" x2="550" y2="258" stroke="#444" stroke-width="1.5"/>
  <line x1="650" y1="250" x2="650" y2="258" stroke="#444" stroke-width="1.5"/>
  <text x="250" y="276" font-size="13" fill="#888" text-anchor="middle">2.00</text>
  <text x="350" y="276" font-size="13" fill="#888" text-anchor="middle">2.05</text>
  <text x="450" y="276" font-size="13" fill="#888" text-anchor="middle">2.10</text>
  <text x="550" y="276" font-size="13" fill="#888" text-anchor="middle">2.15</text>
  <text x="650" y="276" font-size="13" fill="#888" text-anchor="middle">2.20</text>
  <text x="760" y="255" font-size="13" fill="#888">손실</text>

  <!-- batch estimates -->
  <circle cx="418" cy="232" r="5" fill="#e8e8e8"/>
  <circle cx="472" cy="212" r="5" fill="#e8e8e8"/>
  <circle cx="437" cy="192" r="5" fill="#e8e8e8"/>
  <circle cx="498" cy="172" r="5" fill="#e8e8e8"/>
  <circle cx="404" cy="152" r="5" fill="#e8e8e8"/>
  <circle cx="461" cy="132" r="5" fill="#e8e8e8"/>
  <circle cx="556" cy="212" r="5" fill="#e8e8e8"/>
  <circle cx="352" cy="172" r="5" fill="#e8e8e8"/>

  <text x="60" y="122" font-size="13" fill="#888">각 점 = 배치 하나의 평균 손실</text>
  <text x="60" y="316" font-size="13" fill="#888">표준오차 = s / √N = 2.0 / √2048 = 0.044 — 이 폭 안의 오르내림은 학습이 아니라 표본이 바뀐 것이다</text>
  <text x="450" y="300" font-size="13" fill="#7ec8e3" text-anchor="middle">±1 표준오차</text>
</svg>
