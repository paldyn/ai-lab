<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="412" rx="12" fill="#0a0a0a"/>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">학습 중에 봐야 할 곡선 두 개</text>
  <text x="62" y="72" font-size="13" fill="#888">DPO는 손실이 잘 내려가면서도 답이 나빠질 수 있다. 로그확률을 따로 봐야 알아챈다.</text>

  <rect x="62" y="110" width="340" height="246" rx="8" fill="#101820" stroke="#55c555" stroke-width="1.5"/>
  <text x="82" y="136" font-size="14" font-weight="600" fill="#55c555">정상</text>
  <line x1="240" y1="132" x2="262" y2="132" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="268" y="136" font-size="11" fill="#888">chosen</text>
  <line x1="240" y1="150" x2="262" y2="150" stroke="#e05555" stroke-width="2.5"/>
  <text x="268" y="154" font-size="11" fill="#888">rejected</text>

  <line x1="100" y1="195" x2="382" y2="195" stroke="#555" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="94" y="199" font-size="11" fill="#888" text-anchor="end">0</text>
  <polyline points="100,195 170,197 240,201 310,204 382,208" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <polyline points="100,195 170,225 240,256 310,281 382,300" fill="none" stroke="#e05555" stroke-width="2.5"/>
  <text x="241" y="322" font-size="11" fill="#888" text-anchor="middle">학습 스텝</text>
  <text x="82" y="344" font-size="11" fill="#e8e8e8">chosen은 제자리고 rejected만 내려간다.</text>

  <rect x="478" y="110" width="340" height="246" rx="8" fill="#1a1408" stroke="#e05555" stroke-width="1.5"/>
  <text x="498" y="136" font-size="14" font-weight="600" fill="#e05555">주의</text>
  <line x1="656" y1="132" x2="678" y2="132" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="684" y="136" font-size="11" fill="#888">chosen</text>
  <line x1="656" y1="150" x2="678" y2="150" stroke="#e05555" stroke-width="2.5"/>
  <text x="684" y="154" font-size="11" fill="#888">rejected</text>

  <line x1="516" y1="195" x2="798" y2="195" stroke="#555" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="510" y="199" font-size="11" fill="#888" text-anchor="end">0</text>
  <polyline points="516,195 586,215 656,240 726,262 798,280" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <polyline points="516,195 586,224 656,254 726,282 798,306" fill="none" stroke="#e05555" stroke-width="2.5"/>
  <text x="657" y="322" font-size="11" fill="#888" text-anchor="middle">학습 스텝</text>
  <text x="498" y="344" font-size="11" fill="#e8e8e8">둘 다 내려간다. 답 품질이 같이 떨어진다.</text>

  <text x="62" y="386" font-size="13" fill="#e8e8e8">두 곡선의 차이만 보면 오른쪽도 벌어지고 있어 정상으로 보인다. 손실 곡선도 마찬가지다.</text>
</svg>
