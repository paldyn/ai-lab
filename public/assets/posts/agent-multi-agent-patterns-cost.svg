<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>
<text x="440" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">나누면 토큰은 늘고, 지연은 일에 따라 갈린다</text>
<text x="440" y="74" text-anchor="middle" font-size="13" fill="#888">본문의 예 — 하나로 열 걸음 vs 관리자 하나 + 일꾼 셋. 일꾼 하나의 조사는 40초</text>
<text x="60" y="118" font-size="16" font-weight="600" fill="#e8e8e8">입력 토큰</text>
<text x="60" y="166" font-size="13" fill="#888">하나로 둔다</text>
<rect x="60" y="178" width="100" height="30" rx="4" fill="#7777cc"/>
<text x="170" y="198" font-size="13" fill="#e8e8e8">10만</text>
<text x="60" y="240" font-size="13" fill="#888">나눈다</text>
<rect x="60" y="252" width="246" height="30" rx="4" fill="#e05555"/>
<text x="316" y="272" font-size="13" fill="#e8e8e8">24.6만 — 두 배 반</text>
<text x="480" y="118" font-size="16" font-weight="600" fill="#e8e8e8">끝까지 걸리는 시간</text>
<text x="480" y="166" font-size="13" fill="#888">하나로 둔다</text>
<rect x="480" y="178" width="212" height="30" rx="4" fill="#7777cc"/>
<text x="702" y="198" font-size="13" fill="#e8e8e8">120초</text>
<text x="480" y="240" font-size="13" fill="#888">나눠서 차례로</text>
<rect x="480" y="252" width="247" height="30" rx="4" fill="#e05555"/>
<text x="737" y="272" font-size="13" fill="#e8e8e8">140초 안팎</text>
<text x="480" y="314" font-size="13" fill="#888">나눠서 동시에</text>
<rect x="480" y="326" width="106" height="30" rx="4" fill="#55c555"/>
<text x="596" y="346" font-size="13" fill="#e8e8e8">60초 안팎</text>
<line x1="440" y1="100" x2="440" y2="370" stroke="#222" stroke-width="1"/>
<text x="440" y="396" text-anchor="middle" font-size="13" fill="#888">토큰은 어느 경우에나 늘고, 시간은 일꾼이 서로 기다리지 않을 때만 준다</text>
</svg>