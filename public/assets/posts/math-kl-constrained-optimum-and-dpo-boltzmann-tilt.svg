<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">최적 정책은 참조 모델을 보상 쪽으로 기울인 것이다</text>
  <text x="60" y="72" font-size="14" fill="#888">세 답의 점수는 (1, 0, −1)이다. β를 내릴수록 크게 기운다.</text>

  <text x="60" y="104" font-size="15" font-weight="600" fill="#7777cc">참조 모델</text>
  <rect x="74" y="210" width="42" height="90" fill="#7777cc" fill-opacity="0.3" stroke="#7777cc" stroke-width="2"/>
  <rect x="126" y="246" width="42" height="54" fill="#7777cc" fill-opacity="0.3" stroke="#7777cc" stroke-width="2"/>
  <rect x="178" y="264" width="42" height="36" fill="#7777cc" fill-opacity="0.3" stroke="#7777cc" stroke-width="2"/>
  <text x="78" y="200" font-size="13" fill="#7777cc">0.50</text>
  <text x="130" y="236" font-size="13" fill="#7777cc">0.30</text>
  <text x="182" y="254" font-size="13" fill="#7777cc">0.20</text>
  <line x1="60" y1="300" x2="235" y2="300" stroke="#888" stroke-width="1.5"/>
  <text x="74" y="324" font-size="13" fill="#888">1</text>
  <text x="126" y="324" font-size="13" fill="#888">0</text>
  <text x="178" y="324" font-size="13" fill="#888">−1</text>

  <text x="255" y="104" font-size="15" font-weight="600" fill="#7ec8e3">β = 2</text>
  <rect x="269" y="181" width="42" height="119" fill="#7ec8e3" fill-opacity="0.3" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="321" y="257" width="42" height="43" fill="#7ec8e3" fill-opacity="0.3" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="373" y="282" width="42" height="18" fill="#7ec8e3" fill-opacity="0.3" stroke="#7ec8e3" stroke-width="2"/>
  <text x="273" y="171" font-size="13" fill="#7ec8e3">0.66</text>
  <text x="325" y="247" font-size="13" fill="#7ec8e3">0.24</text>
  <text x="377" y="272" font-size="13" fill="#7ec8e3">0.10</text>
  <line x1="255" y1="300" x2="430" y2="300" stroke="#888" stroke-width="1.5"/>
  <text x="269" y="324" font-size="13" fill="#888">1</text>
  <text x="321" y="324" font-size="13" fill="#888">0</text>
  <text x="373" y="324" font-size="13" fill="#888">−1</text>

  <text x="450" y="104" font-size="15" font-weight="600" fill="#7ec8e3">β = 1</text>
  <rect x="464" y="159" width="42" height="141" fill="#7ec8e3" fill-opacity="0.3" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="516" y="269" width="42" height="31" fill="#7ec8e3" fill-opacity="0.3" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="568" y="292" width="42" height="8" fill="#7ec8e3" fill-opacity="0.3" stroke="#7ec8e3" stroke-width="2"/>
  <text x="468" y="149" font-size="13" fill="#7ec8e3">0.78</text>
  <text x="520" y="259" font-size="13" fill="#7ec8e3">0.17</text>
  <text x="572" y="282" font-size="13" fill="#7ec8e3">0.04</text>
  <line x1="450" y1="300" x2="625" y2="300" stroke="#888" stroke-width="1.5"/>
  <text x="464" y="324" font-size="13" fill="#888">1</text>
  <text x="516" y="324" font-size="13" fill="#888">0</text>
  <text x="568" y="324" font-size="13" fill="#888">−1</text>

  <text x="645" y="104" font-size="15" font-weight="600" fill="#55c555">β = 0.5</text>
  <rect x="659" y="135" width="42" height="165" fill="#55c555" fill-opacity="0.3" stroke="#55c555" stroke-width="2"/>
  <rect x="711" y="287" width="42" height="13" fill="#55c555" fill-opacity="0.3" stroke="#55c555" stroke-width="2"/>
  <rect x="763" y="298" width="42" height="2" fill="#55c555" fill-opacity="0.3" stroke="#55c555" stroke-width="2"/>
  <text x="663" y="127" font-size="13" fill="#55c555">0.92</text>
  <text x="715" y="277" font-size="13" fill="#55c555">0.07</text>
  <text x="767" y="288" font-size="13" fill="#55c555">0.01</text>
  <line x1="645" y1="300" x2="820" y2="300" stroke="#888" stroke-width="1.5"/>
  <text x="659" y="324" font-size="13" fill="#888">1</text>
  <text x="711" y="324" font-size="13" fill="#888">0</text>
  <text x="763" y="324" font-size="13" fill="#888">−1</text>

  <text x="60" y="348" font-size="13" fill="#888">가로축의 숫자는 그 답의 점수 r 이다.</text>

  <rect x="60" y="364" width="760" height="66" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="392" font-size="14" font-weight="600" fill="#e8e8e8">두 정보가 곱으로 섞인다</text>
  <text x="84" y="414" font-size="13" fill="#888">점수가 높으면 exp(r/β) 배로 커지지만, 참조 모델이 애초에 거의 안 내던 답은 여전히 잘 안 나온다.</text>
</svg>
