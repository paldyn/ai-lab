<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 480" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<rect width="880" height="480" rx="12" fill="#0a0a0a"/>
<text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">2-3-1 신경망의 순전파</text>
<text x="440" y="72" text-anchor="middle" fill="#888" font-size="13">입력 (1, 2) · 은닉층 ReLU · 출력층은 활성화 없음</text>
<line x1="180" y1="190" x2="300" y2="150" stroke="#444" stroke-width="1.5"/>
<line x1="180" y1="190" x2="300" y2="260" stroke="#444" stroke-width="1.5"/>
<line x1="180" y1="190" x2="300" y2="370" stroke="#444" stroke-width="1.5"/>
<line x1="180" y1="330" x2="300" y2="150" stroke="#444" stroke-width="1.5"/>
<line x1="180" y1="330" x2="300" y2="260" stroke="#444" stroke-width="1.5"/>
<line x1="180" y1="330" x2="300" y2="370" stroke="#444" stroke-width="1.5"/>
<line x1="560" y1="150" x2="660" y2="260" stroke="#7ec8e3" stroke-width="2"/>
<line x1="560" y1="260" x2="660" y2="260" stroke="#7ec8e3" stroke-width="2"/>
<line x1="560" y1="370" x2="660" y2="260" stroke="#555" stroke-width="2" stroke-dasharray="4,4"/>
<text x="596" y="182" fill="#7ec8e3" font-size="13">×1</text>
<text x="590" y="250" fill="#7ec8e3" font-size="13">×2</text>
<text x="596" y="352" fill="#888" font-size="13">×3</text>
<rect x="60" y="162" width="120" height="56" rx="8" fill="#111111" stroke="#7777cc" stroke-width="1.5"/>
<text x="120" y="195" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="600">x₁ = 1</text>
<rect x="60" y="302" width="120" height="56" rx="8" fill="#111111" stroke="#7777cc" stroke-width="1.5"/>
<text x="120" y="335" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="600">x₂ = 2</text>
<rect x="300" y="118" width="260" height="64" rx="8" fill="#111111" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="430" y="144" text-anchor="middle" fill="#e8e8e8" font-size="14">1·1 + 0·2 + 0 = 1</text>
<text x="430" y="167" text-anchor="middle" fill="#55c555" font-size="13">ReLU → 1</text>
<rect x="300" y="228" width="260" height="64" rx="8" fill="#111111" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="430" y="254" text-anchor="middle" fill="#e8e8e8" font-size="14">0·1 + 1·2 − 1 = 1</text>
<text x="430" y="277" text-anchor="middle" fill="#55c555" font-size="13">ReLU → 1</text>
<rect x="300" y="338" width="260" height="64" rx="8" fill="#111111" stroke="#e05555" stroke-width="1.5"/>
<text x="430" y="364" text-anchor="middle" fill="#e8e8e8" font-size="14">1·1 − 1·2 + 0.5 = −0.5</text>
<text x="430" y="387" text-anchor="middle" fill="#e05555" font-size="13">ReLU → 0 · 꺼짐</text>
<rect x="660" y="222" width="160" height="76" rx="8" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
<text x="740" y="256" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="600">y = 2</text>
<text x="740" y="279" text-anchor="middle" fill="#888" font-size="12">1·1 + 2·1 + 3·0 − 1</text>
<text x="440" y="446" text-anchor="middle" fill="#7777cc" font-size="13">파라미터 13개 — 은닉층 가중치 6 · 편향 3, 출력층 가중치 3 · 편향 1</text>
</svg>
