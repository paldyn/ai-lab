  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">조건이 좁아지면 근사 탐색의 길이 끊긴다</text>
  <text x="60" y="72" font-size="13" fill="#888">근사 최근접 탐색은 이웃을 타고 걸어가며 답을 찾는다. 통과하지 못한 노드는 길목까지 함께 사라진다.</text>
  <text x="60" y="110" font-size="16" font-weight="600" fill="#e8e8e8">필터가 없을 때</text>
  <text x="470" y="110" font-size="16" font-weight="600" fill="#e8e8e8">조건 통과분만 남겼을 때</text>
