  <text x="60" y="368" font-size="12.5" fill="#888">어느 노드에서 출발해도 이웃을 타고 전체를 훑을 수 있다.</text>
  <text x="60" y="390" font-size="12.5" fill="#888">가까운 것 열 개를 달라고 하면 열 개가 나온다.</text>
  <text x="470" y="368" font-size="12.5" fill="#888">남은 노드가 두 덩어리로 갈라졌다. 출발점에서 걸어가면</text>
  <text x="470" y="390" font-size="12.5" fill="#e05555">붉은 점선 안쪽에는 영영 못 닿는다 — 있는데 안 나온다.</text>
  <text x="60" y="428" font-size="13" fill="#7ec8e3">그래서 후보가 아주 적을 때는 그래프를 버리고 전부 비교하는 편이 오히려 빠르고 정확하다.</text>
