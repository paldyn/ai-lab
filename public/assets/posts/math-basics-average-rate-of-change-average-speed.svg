<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="490" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="asAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">같은 운동인데 구간마다 답이 다르다</text>
  <text x="60" y="74" font-size="13" fill="#888">붉은 선이 각 구간의 할선이고, 그 옆의 수가 그 구간의 평균속도다</text>

  <line x1="120" y1="400" x2="770" y2="400" stroke="#888" stroke-width="1.5" marker-end="url(#asAx)"/>
  <line x1="150" y1="430" x2="150" y2="120" stroke="#888" stroke-width="1.5" marker-end="url(#asAx)"/>
  <text x="776" y="404" font-size="13" fill="#888">시간 t (초)</text>
  <text x="158" y="122" font-size="13" fill="#888">거리 s (m)</text>

  <path d="M 150 400 L 220 396 L 290 384 L 360 364 L 430 336 L 500 300 L 570 256 L 640 204 L 710 144"
        fill="none" stroke="#7ec8e3" stroke-width="2.5"/>

  <line x1="150" y1="400" x2="290" y2="384" stroke="#e05555" stroke-width="2.5"/>
  <line x1="290" y1="384" x2="430" y2="336" stroke="#e05555" stroke-width="2.5"/>
  <line x1="430" y1="336" x2="570" y2="256" stroke="#e05555" stroke-width="2.5"/>
  <line x1="570" y1="256" x2="710" y2="144" stroke="#e05555" stroke-width="2.5"/>

  <line x1="150" y1="400" x2="710" y2="144" stroke="#55c555" stroke-width="2.5" stroke-dasharray="6,4"/>

  <text x="212" y="378" font-size="13" fill="#e05555" text-anchor="middle">5</text>
  <text x="356" y="342" font-size="13" fill="#e05555" text-anchor="middle">15</text>
  <text x="496" y="278" font-size="13" fill="#e05555" text-anchor="middle">25</text>
  <text x="636" y="182" font-size="13" fill="#e05555" text-anchor="middle">35</text>
  <text x="300" y="304" font-size="13" fill="#55c555">전체 [0, 4] 는 20</text>

  <circle cx="150" cy="400" r="5" fill="#e8e8e8"/>
  <circle cx="290" cy="384" r="5" fill="#e8e8e8"/>
  <circle cx="430" cy="336" r="5" fill="#e8e8e8"/>
  <circle cx="570" cy="256" r="5" fill="#e8e8e8"/>
  <circle cx="710" cy="144" r="5" fill="#e8e8e8"/>

  <line x1="290" y1="396" x2="290" y2="404" stroke="#444" stroke-width="1.5"/>
  <line x1="430" y1="396" x2="430" y2="404" stroke="#444" stroke-width="1.5"/>
  <line x1="570" y1="396" x2="570" y2="404" stroke="#444" stroke-width="1.5"/>
  <line x1="710" y1="396" x2="710" y2="404" stroke="#444" stroke-width="1.5"/>
  <text x="290" y="422" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="430" y="422" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="570" y="422" font-size="12" fill="#888" text-anchor="middle">3</text>
  <text x="710" y="422" font-size="12" fill="#888" text-anchor="middle">4</text>

  <rect x="60" y="440" width="760" height="34" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="462" font-size="13" fill="#e8e8e8">전체 구간의 20 m/s 는 네 구간 어디의 값도 아니다 — 전부를 하나로 뭉갠 값이다.</text>
</svg>
