<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">승수는 예산 한 단위의 가격이다</text>
  <text x="60" y="72" font-size="14" fill="#888">제약을 x² + y² = c 로 두면 최적값은 f*(c) = √(2c) 다. c = 1 에서의 기울기가 λ 다.</text>

  <line x1="120" y1="380" x2="800" y2="380" stroke="#888" stroke-width="1.5"/>
  <line x1="120" y1="380" x2="120" y2="120" stroke="#888" stroke-width="1.5"/>
  <line x1="120" y1="280" x2="800" y2="280" stroke="#444" stroke-width="1"/>
  <line x1="120" y1="180" x2="800" y2="180" stroke="#444" stroke-width="1"/>
  <text x="98" y="385" font-size="13" fill="#888">0</text>
  <text x="98" y="285" font-size="13" fill="#888">1</text>
  <text x="98" y="185" font-size="13" fill="#888">2</text>
  <text x="82" y="110" font-size="13" fill="#888">f*(c)</text>
  <text x="812" y="385" font-size="13" fill="#888">c</text>

  <line x1="333" y1="380" x2="333" y2="388" stroke="#444" stroke-width="1"/>
  <line x1="547" y1="380" x2="547" y2="388" stroke="#444" stroke-width="1"/>
  <line x1="760" y1="380" x2="760" y2="388" stroke="#444" stroke-width="1"/>
  <text x="116" y="406" font-size="13" fill="#888">0</text>
  <text x="329" y="406" font-size="13" fill="#888">1</text>
  <text x="543" y="406" font-size="13" fill="#888">2</text>
  <text x="756" y="406" font-size="13" fill="#888">3</text>

  <polyline points="120,380 141,335 163,317 184,303 205,291 227,280 248,270 269,262 291,254 312,246 333,239 355,232 376,225 397,219 419,213 440,207 461,201 483,196 504,190 525,185 547,180 568,175 589,170 611,166 632,161 653,156 675,152 696,148 717,143 739,139 760,135"
            fill="none" stroke="#7ec8e3" stroke-width="2.5"/>

  <line x1="223" y1="275" x2="483" y2="189" stroke="#55c555" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="333" cy="239" r="5" fill="#55c555"/>
  <line x1="333" y1="245" x2="333" y2="380" stroke="#555" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="352" y="226" font-size="14" fill="#55c555">기울기 = λ = 0.7071</text>
  <text x="196" y="232" font-size="13" fill="#888">f*(1) = √2</text>

  <rect x="560" y="240" width="260" height="102" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="584" y="270" font-size="14" font-weight="600" fill="#e8e8e8">읽는 법</text>
  <text x="584" y="296" font-size="13" fill="#888">예산 c 를 0.1 늘려 주면</text>
  <text x="584" y="316" font-size="13" fill="#888">최적값이 약 0.071 오른다.</text>
  <text x="584" y="336" font-size="13" fill="#55c555">그 교환 비율이 곧 λ 다.</text>

  <rect x="60" y="418" width="760" height="30" rx="8" fill="#12161f" stroke="#3a4a6e" stroke-width="1"/>
  <text x="86" y="438" font-size="13" fill="#888">예산을 정하는 문제와 가격을 정하는 문제는 같은 문제의 앞뒤 면이다.</text>
</svg>
