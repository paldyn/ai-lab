<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="510" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="cdAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">직각삼각형 하나에서 거리와 기울기가 함께 나온다</text>
  <text x="60" y="74" font-size="13" fill="#888">두 변이 x 좌표의 차와 y 좌표의 차다</text>

  <line x1="350" y1="380" x2="740" y2="380" stroke="#888" stroke-width="1.5" marker-end="url(#cdAx)"/>
  <line x1="380" y1="410" x2="380" y2="90" stroke="#888" stroke-width="1.5" marker-end="url(#cdAx)"/>
  <text x="746" y="384" font-size="13" fill="#888">x</text>
  <text x="386" y="94" font-size="13" fill="#888">y</text>

  <line x1="435" y1="374" x2="435" y2="386" stroke="#888" stroke-width="1.5"/>
  <line x1="490" y1="374" x2="490" y2="386" stroke="#888" stroke-width="1.5"/>
  <line x1="545" y1="374" x2="545" y2="386" stroke="#888" stroke-width="1.5"/>
  <line x1="600" y1="374" x2="600" y2="386" stroke="#888" stroke-width="1.5"/>
  <line x1="655" y1="374" x2="655" y2="386" stroke="#888" stroke-width="1.5"/>
  <text x="435" y="398" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="490" y="398" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="545" y="398" font-size="12" fill="#888" text-anchor="middle">3</text>
  <text x="600" y="398" font-size="12" fill="#888" text-anchor="middle">4</text>
  <text x="655" y="398" font-size="12" fill="#888" text-anchor="middle">5</text>

  <line x1="374" y1="325" x2="386" y2="325" stroke="#444" stroke-width="1.5"/>
  <line x1="374" y1="270" x2="386" y2="270" stroke="#444" stroke-width="1.5"/>
  <line x1="374" y1="215" x2="386" y2="215" stroke="#444" stroke-width="1.5"/>
  <line x1="374" y1="160" x2="386" y2="160" stroke="#444" stroke-width="1.5"/>
  <line x1="374" y1="105" x2="386" y2="105" stroke="#444" stroke-width="1.5"/>
  <text x="368" y="329" font-size="12" fill="#888" text-anchor="end">1</text>
  <text x="368" y="274" font-size="12" fill="#888" text-anchor="end">2</text>
  <text x="368" y="219" font-size="12" fill="#888" text-anchor="end">3</text>
  <text x="368" y="164" font-size="12" fill="#888" text-anchor="end">4</text>
  <text x="368" y="109" font-size="12" fill="#888" text-anchor="end">5</text>

  <line x1="435" y1="270" x2="655" y2="270" stroke="#7777cc" stroke-width="2.5"/>
  <line x1="655" y1="270" x2="655" y2="105" stroke="#7777cc" stroke-width="2.5"/>
  <line x1="435" y1="270" x2="655" y2="105" stroke="#7ec8e3" stroke-width="2.5"/>
  <path d="M 641 270 L 641 256 L 655 256" fill="none" stroke="#888" stroke-width="1.5"/>

  <circle cx="435" cy="270" r="5" fill="#e8e8e8"/>
  <circle cx="655" cy="105" r="5" fill="#e8e8e8"/>
  <circle cx="655" cy="270" r="5" fill="#888"/>

  <text x="435" y="296" font-size="13" fill="#e8e8e8" text-anchor="middle">A(1, 2)</text>
  <text x="667" y="98" font-size="13" fill="#e8e8e8">B(5, 5)</text>
  <text x="667" y="288" font-size="13" fill="#888">(5, 2)</text>
  <text x="545" y="292" font-size="13" fill="#7777cc" text-anchor="middle">Δx = 4</text>
  <text x="667" y="191" font-size="13" fill="#7777cc">Δy = 3</text>
  <text x="510" y="172" font-size="13" fill="#7ec8e3" text-anchor="end">거리 5</text>

  <rect x="60" y="140" width="270" height="152" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="166" font-size="14" font-weight="600" fill="#e8e8e8">한 그림에서 둘 다 나온다</text>
  <text x="84" y="196" font-size="13" fill="#888">Δx = 5 − 1 = 4</text>
  <text x="84" y="220" font-size="13" fill="#888">Δy = 5 − 2 = 3</text>
  <text x="84" y="250" font-size="14" fill="#7ec8e3">거리 = √(4² + 3²) = 5</text>
  <text x="84" y="280" font-size="14" fill="#55c555">기울기 = Δy / Δx = 3/4</text>

  <rect x="60" y="430" width="760" height="44" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="458" font-size="13" fill="#e8e8e8">기울기는 가로로 한 칸 갈 때 세로로 얼마나 오르는가다 — 여기서는 가로로 4 갈 때 세로로 3 오른다.</text>
</svg>
