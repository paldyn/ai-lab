<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 500" style="background:#0a0a0a;border-radius:12px">
  <!-- Header -->
  <rect x="0" y="0" width="880" height="72" rx="12" fill="#0d1a2a"/>
  <rect x="0" y="60" width="880" height="12" fill="#0d1a2a"/>
  <text x="60" y="40" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">주요 손실 함수 PyTorch 구현</text>
  <text x="60" y="62" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">직접 구현과 내장 함수 비교</text>
  <line x1="60" y1="82" x2="820" y2="82" stroke="#3a4a6e" stroke-width="1"/>

  <!-- Left code: regression -->
  <text x="60" y="108" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">회귀 손실 함수</text>
  <rect x="60" y="115" width="380" height="190" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="137" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> torch, torch.nn as nn</tspan></text>
  <text x="76" y="155" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">pred = torch.tensor([</tspan><tspan fill="#b5cea8">2.5, 0.0, 2.0</tspan><tspan fill="#ffffff">  ])</tspan></text>
  <text x="76" y="173" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">true = torch.tensor([</tspan><tspan fill="#b5cea8">3.0, -0.5, 2.0</tspan><tspan fill="#ffffff">  ])</tspan></text>
  <text x="76" y="191" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># MSE</text>
  <text x="76" y="209" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">mse = nn.MSELoss()(pred, true)</text>
  <text x="76" y="227" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># MAE</text>
  <text x="76" y="245" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">mae = nn.L1Loss()(pred, true)</text>
  <text x="76" y="263" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># Huber (delta=1.0)</text>
  <text x="76" y="281" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">huber = nn.HuberLoss(delta=</tspan><tspan fill="#b5cea8">1.0</tspan><tspan fill="#ffffff">)(pred, true)</tspan></text>
  <text x="76" y="299" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">print(f</tspan><tspan fill="#ce9178">"MSE={mse:.3f} MAE={mae:.3f}"</tspan><tspan fill="#ffffff">)</tspan></text>

  <!-- Right code: classification -->
  <text x="460" y="108" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">분류 손실 함수</text>
  <rect x="460" y="115" width="360" height="190" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="476" y="137" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># 이진 분류 BCE</text>
  <text x="476" y="155" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">logits = torch.tensor([</tspan><tspan fill="#b5cea8">2.0, -1.0, 0.5</tspan><tspan fill="#ffffff">  ])</tspan></text>
  <text x="476" y="173" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">labels = torch.tensor([</tspan><tspan fill="#b5cea8">1., 0., 1.</tspan><tspan fill="#ffffff"> ])</tspan></text>
  <text x="476" y="191" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">bce = nn.BCEWithLogitsLoss()</text>
  <text x="476" y="209" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">loss = bce(logits, labels)</text>

  <text x="476" y="227" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># 다중 분류 CE</text>
  <text x="476" y="245" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">logits_mc = torch.randn(</tspan><tspan fill="#b5cea8">4, 10</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="476" y="263" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">targets  = torch.randint(</tspan><tspan fill="#b5cea8">0, 10</tspan><tspan fill="#ffffff">, (</tspan><tspan fill="#b5cea8">4</tspan><tspan fill="#ffffff">,))</tspan></text>
  <text x="476" y="281" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">ce = nn.CrossEntropyLoss()(logits, targets)</text>
  <text x="476" y="299" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># 내부: softmax → log → NLL</text>

  <!-- Bottom: LLM loss -->
  <text x="60" y="326" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">LLM 언어 모델링 손실 (다음 토큰 예측)</text>
  <rect x="60" y="333" width="760" height="116" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="355" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># 입력: "The cat sat" → 예측: "cat sat on"</text>
  <text x="76" y="373" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">B, T, V = </tspan><tspan fill="#b5cea8">2, 10, 50257</tspan><tspan fill="#9aa4b8">  # batch, seq_len, vocab</tspan></text>
  <text x="76" y="391" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">logits  = model(input_ids)          </text>
  <text x="424" y="391" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># [B, T, V]</text>
  <text x="76" y="409" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">shift_logits = logits[:, :-</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">].contiguous()</tspan><tspan fill="#9aa4b8"># 마지막 토큰 제외</tspan></text>

  <text x="76" y="427" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">shift_labels = input_ids[:, </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">:].contiguous()</tspan><tspan fill="#9aa4b8"># 다음 토큰이 정답</tspan></text>

  <text x="76" y="445" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">loss = F.cross_entropy(shift_logits.view(-</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">, V), shift_labels.view(-</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">))</tspan></text>

  <!-- Footer -->
</svg>
