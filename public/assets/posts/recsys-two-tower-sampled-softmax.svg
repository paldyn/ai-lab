<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 460">
  <defs>
    <marker id="arr-green" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="460" fill="#0a0a0a" rx="12"/>

  <!-- 제목 -->
  <text x="440" y="40" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">Sampled Softmax: 분모를 K개 샘플로 대신한다</text>

  <!-- 왼쪽: 전체 소프트맥스 -->
  <rect x="60" y="68" width="350" height="116" fill="#1a0f0f" rx="8" stroke="#e05555" stroke-width="1.5"/>
  <text x="235" y="94" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">전체 소프트맥스</text>
  <text x="235" y="122" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8" text-anchor="middle">분모 = 아이템 1억 개 전부</text>
  <text x="235" y="148" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">손실 한 번에 점수 1억 개</text>
  <text x="235" y="170" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#e05555" text-anchor="middle">계산할 수 없다</text>

  <!-- 근사 화살표 -->
  <line x1="410" y1="126" x2="468" y2="126" stroke="#55c555" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="440" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">근사</text>

  <!-- 오른쪽: Sampled Softmax -->
  <rect x="470" y="68" width="350" height="116" fill="#0f1a10" rx="8" stroke="#55c555" stroke-width="1.5"/>
  <text x="645" y="94" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">Sampled Softmax</text>
  <text x="645" y="122" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8" text-anchor="middle">분모 = 정답 1개 + 네거티브 K개</text>
  <text x="645" y="148" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">K+1 지 선다형, 정답은 0번 자리</text>
  <text x="645" y="170" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#55c555" text-anchor="middle">무작위로 뽑은 몇 개로 대신한다</text>

  <!-- 아래: 네거티브를 어떻게 뽑는가 -->
  <text x="440" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">네거티브를 어떻게 뽑는가 — p ∝ 인기도^지수</text>

  <!-- 눈금 -->
  <line x1="150" y1="310" x2="730" y2="310" stroke="#888" stroke-width="1.5"/>
  <line x1="150" y1="302" x2="150" y2="318" stroke="#e05555" stroke-width="2"/>
  <line x1="440" y1="302" x2="440" y2="318" stroke="#55c555" stroke-width="2"/>
  <line x1="730" y1="302" x2="730" y2="318" stroke="#e05555" stroke-width="2"/>

  <text x="150" y="294" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">지수 0</text>
  <text x="440" y="294" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">지수 0.75</text>
  <text x="730" y="294" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">지수 1</text>

  <text x="150" y="340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">균등 추출</text>
  <text x="150" y="360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">롱테일만 뽑힌다</text>

  <text x="440" y="340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">큰 값을 더 많이 눌러</text>
  <text x="440" y="360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">그 사이를 잡는다</text>

  <text x="730" y="340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">인기도 그대로</text>
  <text x="730" y="360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">상위 몇 개가 독점</text>

  <text x="440" y="404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">인기 아이템이 네거티브로 자주 나와야 「인기 있으니 높은 점수」 지름길이 막힌다</text>
</svg>
