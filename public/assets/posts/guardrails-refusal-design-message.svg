<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">같은 거절, 다른 결과</text>
  <text x="60" y="72" font-size="13" fill="#888">사용자가 다음에 무엇을 해야 할지 아느냐가 갈린다.</text>

  <rect x="60" y="100" width="350" height="192" rx="10" fill="#101418" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="134" font-size="16" font-weight="600" fill="#e05555">막다른 거절</text>
  <text x="84" y="166" font-size="13" fill="#e8e8e8">죄송합니다. 해당 요청은 정책상</text>
  <text x="84" y="188" font-size="13" fill="#e8e8e8">도와드릴 수 없습니다. 다른</text>
  <text x="84" y="210" font-size="13" fill="#e8e8e8">질문이 있으시면 말씀해 주세요.</text>
  <text x="84" y="246" font-size="12" fill="#888">· 무엇이 걸렸는지 모른다</text>
  <text x="84" y="268" font-size="12" fill="#888">· 다시 시도할 방법이 없다</text>

  <rect x="470" y="100" width="350" height="238" rx="10" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="494" y="134" font-size="16" font-weight="600" fill="#55c555">경로가 남는 거절</text>
  <text x="494" y="166" font-size="13" fill="#e8e8e8">올려 주신 파일에 다른 분의</text>
  <text x="494" y="188" font-size="13" fill="#e8e8e8">주민등록번호가 있어 그대로는</text>
  <text x="494" y="210" font-size="13" fill="#e8e8e8">처리하지 못합니다. 그 열을 지운</text>
  <text x="494" y="232" font-size="13" fill="#e8e8e8">파일을 올려 주시면 나머지는</text>
  <text x="494" y="254" font-size="13" fill="#e8e8e8">그대로 분석해 드릴게요.</text>
  <text x="494" y="292" font-size="12" fill="#888">· 막힌 지점이 특정되어 있다</text>
  <text x="494" y="314" font-size="12" fill="#888">· 다음 행동이 문장 안에 있다</text>

  <text x="60" y="372" font-size="13" fill="#888">사유를 밝히는 것과 우회법을 알려 주는 것은 다르다 — 걸린 대상은 말하되 판정 규칙은 말하지 않는다.</text>
</svg>
