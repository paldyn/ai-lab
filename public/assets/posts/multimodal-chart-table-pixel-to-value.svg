<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>
  <text x="60" y="52" font-size="22" font-weight="700" fill="#e8e8e8">픽셀 높이를 값으로 되돌리는 세 단계</text>
  <text x="60" y="80" font-size="13" fill="#888">원본 {Q1: 62, Q2: 88, Q3: 104, Q4: 141} — 축 눈금은 0과 150 둘뿐</text>

  <!-- 그리드 -->
  <line x1="110" y1="233" x2="410" y2="233" stroke="#444" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- 축 -->
  <line x1="110" y1="140" x2="110" y2="400" stroke="#888" stroke-width="1.5"/>
  <line x1="110" y1="400" x2="410" y2="400" stroke="#888" stroke-width="1.5"/>
  <text x="98" y="405" font-size="13" fill="#888" text-anchor="end">0</text>
  <text x="98" y="238" font-size="13" fill="#888" text-anchor="end">150</text>

  <!-- 막대: 1단위 = 167/150 px -->
  <rect x="140" y="331" width="50" height="69" fill="#7ec8e3"/>
  <rect x="210" y="302" width="50" height="98" fill="#7777cc"/>
  <rect x="280" y="284" width="50" height="116" fill="#7777cc"/>
  <rect x="350" y="243" width="50" height="157" fill="#7777cc"/>
  <text x="165" y="370" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">69px</text>
  <text x="165" y="424" font-size="13" fill="#888" text-anchor="middle">Q1</text>
  <text x="235" y="424" font-size="13" fill="#888" text-anchor="middle">Q2</text>
  <text x="305" y="424" font-size="13" fill="#888" text-anchor="middle">Q3</text>
  <text x="375" y="424" font-size="13" fill="#888" text-anchor="middle">Q4</text>

  <!-- 단계 상자 -->
  <rect x="460" y="120" width="360" height="80" rx="8" fill="#141414" stroke="#3a3a3a"/>
  <text x="484" y="153" font-size="16" font-weight="600" fill="#e8e8e8">① 눈금 둘로 비례 세우기</text>
  <text x="484" y="177" font-size="13" fill="#888">0 → y 400px · 150 → y 233px (167px = 150)</text>

  <rect x="460" y="230" width="360" height="80" rx="8" fill="#141414" stroke="#3a3a3a"/>
  <text x="484" y="263" font-size="16" font-weight="600" fill="#e8e8e8">② 막대 밑변·윗변 재기</text>
  <text x="484" y="287" font-size="13" fill="#888">Q1 밑변 y 400px · 윗변 y 331px → 69px</text>

  <rect x="460" y="340" width="360" height="80" rx="8" fill="#141414" stroke="#55c555"/>
  <text x="484" y="373" font-size="16" font-weight="600" fill="#e8e8e8">③ 비례로 되돌리기</text>
  <text x="484" y="397" font-size="13" fill="#55c555">69 ÷ 167 × 150 = 61.98 → 62</text>

  <line x1="640" y1="200" x2="640" y2="230" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="310" x2="640" y2="340" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
</svg>
