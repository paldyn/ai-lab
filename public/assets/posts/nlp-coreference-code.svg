<svg width="880" height="380" viewBox="0 0 880 380"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">지시 해소 구현: spaCy + LLM</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">영어 neuralcoref / GPT-4o 한국어 접근</text>

  <!-- Left: spaCy + neuralcoref (English) -->
  <text x="220" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">① 영어 (spaCy + neuralcoref)</text>
  <rect x="40" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="56" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">spacy</tspan></text>
  <text x="56" y="147" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">neuralcoref</tspan></text>

  <text x="56" y="171" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">nlp </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">spacy.load(</tspan><tspan fill="#ce9178">&quot;en_core_web_sm&quot;</tspan><tspan fill="#ffffff">   )</tspan></text>
  <text x="56" y="189" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">neuralcoref.add_to_pipe(nlp)</text>

  <text x="56" y="213" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">doc </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">nlp(</tspan></text>
  <text x="56" y="231" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    "John works at a company.</text>
  <text x="56" y="249" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">     He loves his job."</text>
  <text x="56" y="267" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>
  <text x="56" y="291" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">for </tspan><tspan fill="#ffffff">cluster </tspan><tspan fill="#7ec8e3">in </tspan><tspan fill="#ffffff">doc._.coref_clusters:</tspan></text>
  <text x="56" y="309" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    print(cluster)</text>
  <text x="56" y="327" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    # [John: [John, He, his]]</text>

  <!-- Right: Korean via LLM -->
  <text x="660" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">② 한국어 (LLM 프롬프팅)</text>
  <rect x="480" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="496" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">anthropic </tspan><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">Anthropic</tspan></text>

  <text x="496" y="153" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">client </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">Anthropic()</tspan></text>

  <text x="496" y="177" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">prompt </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">f</tspan><tspan fill="#ce9178">&quot;&quot;&quot;</tspan></text>
  <text x="496" y="195" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">다음 문장에서 동일 개체를</text>
  <text x="496" y="213" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">가리키는 표현을 JSON으로:</text>
  <text x="496" y="231" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">{text}</text>
  <text x="496" y="249" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">"""</text>
  <text x="496" y="273" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">resp </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">client.messages.create(</tspan></text>
  <text x="496" y="291" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    model=</tspan><tspan fill="#ce9178">&quot;claude-sonnet-4-6&quot;</tspan></text>
  <text x="496" y="309" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    max_tokens=</tspan><tspan fill="#b5cea8">512</tspan><tspan fill="#ffffff">, ...)</tspan></text>

  <!-- Bottom -->
  <text x="440" y="362" text-anchor="middle" fill="#888" font-size="12">MUC / B³ / CEAF / LEA — 지시 해소 평가 지표 (OntoNotes 벤치마크)</text>
</svg>
