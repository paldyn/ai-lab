<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="vpA" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="vpB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>
  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">긴 영상은 두 번 본다</text>
  <text x="62" y="68" font-size="13" fill="#888">먼저 전체를 얕게, 그다음 필요한 토막만 깊게.</text>

  <rect x="62" y="104" width="168" height="81" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="78" y="130" font-size="13" font-weight="600" fill="#7ec8e3">① 구간으로 자른다</text>
  <text x="78" y="150" font-size="11" fill="#9aa4b8">장면 전환 경계로</text>
  <text x="78" y="168" font-size="11" fill="#9aa4b8">30~60초 토막을</text>
  <line x1="230" y1="145" x2="256" y2="145" stroke="#7ec8e3" stroke-width="2" marker-end="url(#vpA)"/>

  <rect x="256" y="104" width="168" height="81" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="272" y="130" font-size="13" font-weight="600" fill="#7ec8e3">② 토막마다 요약</text>
  <text x="272" y="150" font-size="11" fill="#9aa4b8">프레임 8장 + 자막</text>
  <text x="272" y="168" font-size="11" fill="#9aa4b8">한 줄 요약을 남김</text>
  <line x1="424" y1="145" x2="450" y2="145" stroke="#7ec8e3" stroke-width="2" marker-end="url(#vpA)"/>

  <rect x="450" y="104" width="168" height="81" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="466" y="130" font-size="13" font-weight="600" fill="#7ec8e3">③ 시각을 붙인다</text>
  <text x="466" y="150" font-size="11" fill="#9aa4b8">요약마다 시작·끝</text>
  <text x="466" y="168" font-size="11" fill="#9aa4b8">타임스탬프를 함께</text>
  <line x1="618" y1="145" x2="644" y2="145" stroke="#7ec8e3" stroke-width="2" marker-end="url(#vpA)"/>

  <rect x="644" y="104" width="168" height="81" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="660" y="130" font-size="13" font-weight="600" fill="#7ec8e3">④ 토막 고르기</text>
  <text x="660" y="150" font-size="11" fill="#9aa4b8">질문과 요약을 맞춰</text>
  <text x="660" y="168" font-size="11" fill="#9aa4b8">두세 개로 좁힌다</text>

  <path d="M 728 185 L 728 212 L 234 212 L 234 242" fill="none" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#vpB)"/>

  <rect x="62" y="242" width="345" height="81" rx="8" fill="#12151c" stroke="#55c555" stroke-width="1.5"/>
  <text x="86" y="268" font-size="13" font-weight="600" fill="#55c555">⑤ 고른 토막만 다시 읽는다</text>
  <text x="86" y="288" font-size="11" fill="#9aa4b8">그 구간만 초당 2프레임으로 촘촘히 뽑아</text>
  <text x="86" y="306" font-size="11" fill="#9aa4b8">1차에서 놓친 짧은 사건을 잡는다</text>
  <line x1="407" y1="282" x2="473" y2="282" stroke="#55c555" stroke-width="2" marker-end="url(#vpB)"/>

  <rect x="473" y="242" width="345" height="81" rx="8" fill="#12151c" stroke="#55c555" stroke-width="1.5"/>
  <text x="497" y="268" font-size="13" font-weight="600" fill="#55c555">⑥ 답과 근거 시각을 낸다</text>
  <text x="497" y="288" font-size="11" fill="#9aa4b8">「00:22:14에 상자가 떨어졌습니다」처럼</text>
  <text x="497" y="306" font-size="11" fill="#9aa4b8">사람이 그 지점을 눌러 확인할 수 있다</text>

  <text x="62" y="366" font-size="12" fill="#9aa4b8">①~④는 전체를 훑되 얕게 본다. 요약만 남기므로 두 시간짜리도 토큰 예산에 들어간다.</text>
  <text x="62" y="386" font-size="12" fill="#9aa4b8">⑤~⑥은 좁힌 두세 토막만 깊게 본다. 전체를 촘촘히 읽는 비용의 수십 분의 일이다.</text>
</svg>
