<svg xmlns="http://www.w3.org/2000/svg" width="880" height="622" viewBox="0 0 880 622">
<rect width="880" height="622" rx="12" fill="#0a0a0a"/>
<text x="440" y="42" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">기울기 검사 다섯 걸음</text>
<defs><marker id="m4" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker></defs>
<rect x="90" y="112" width="700" height="66" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<circle cx="128" cy="145" r="18" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="128" y="150" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#7ec8e3" font-weight="700" text-anchor="middle">1</text>
<text x="166" y="139" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#ffffff" font-weight="600">검사할 자리를 고른다</text>
<text x="166" y="161" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">꺾인 점과 그 근처는 빼고, 무작위 좌표 몇 개만</text>
<line x1="440" y1="178" x2="440" y2="204" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#m4)"/>
<rect x="90" y="206" width="700" height="66" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<circle cx="128" cy="239" r="18" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="128" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#7ec8e3" font-weight="700" text-anchor="middle">2</text>
<text x="166" y="233" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#ffffff" font-weight="600">해석적 기울기를 받는다</text>
<text x="166" y="255" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">손으로 유도한 식 또는 backward의 결과</text>
<line x1="440" y1="272" x2="440" y2="298" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#m4)"/>
<rect x="90" y="300" width="700" height="66" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<circle cx="128" cy="333" r="18" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="128" y="338" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#7ec8e3" font-weight="700" text-anchor="middle">3</text>
<text x="166" y="327" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#ffffff" font-weight="600">중심차분으로 잰다</text>
<text x="166" y="349" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">h = 10⁻⁵, 좌표 하나마다 함수를 두 번 부른다</text>
<line x1="440" y1="366" x2="440" y2="392" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#m4)"/>
<rect x="90" y="394" width="700" height="66" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<circle cx="128" cy="427" r="18" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="128" y="432" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#7ec8e3" font-weight="700" text-anchor="middle">4</text>
<text x="166" y="421" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#ffffff" font-weight="600">상대오차를 계산한다</text>
<text x="166" y="443" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">|a − n| ÷ max(10⁻⁸, |a| + |n|)</text>
<line x1="440" y1="460" x2="440" y2="486" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#m4)"/>
<rect x="90" y="488" width="700" height="66" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<circle cx="128" cy="521" r="18" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="128" y="526" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#7ec8e3" font-weight="700" text-anchor="middle">5</text>
<text x="166" y="515" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#ffffff" font-weight="600">가장 큰 값 하나만 본다</text>
<text x="166" y="537" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">평균이 아니다 — 한 자리만 틀려도 유도가 틀린 것이다</text>
<text x="440" y="590" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">이 다섯 걸음이 이 사이트의 유도 글이 마지막 절에서 쓰는 검증 규약이다</text>
</svg>
