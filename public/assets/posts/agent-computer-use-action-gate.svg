<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="540" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">동작을 코드가 두 갈래로 가른다</text>
  <text x="60" y="72" font-size="13" fill="#888">모델은 동작을 내놓기만 하고, 그 동작이 어느 갈래인지는 화면이 아니라 코드가 정한다.</text>
  <rect x="290" y="100" width="300" height="50" rx="8" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="440" y="130" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">모델이 낸 동작 하나</text>
  <line x1="440" y1="150" x2="440" y2="180" stroke="#888888" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="230" y="180" width="420" height="60" rx="8" fill="#101418" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="204" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">코드가 가른다</text>
  <text x="440" y="226" font-size="13" fill="#888" text-anchor="middle">버튼 이름 목록 · 여는 주소 목록으로 판정</text>
  <line x1="360" y1="240" x2="250" y2="290" stroke="#888888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="240" x2="630" y2="290" stroke="#888888" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="290" width="340" height="86" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="230" y="317" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">되돌릴 수 있는 동작</text>
  <text x="230" y="340" font-size="13" fill="#888" text-anchor="middle">읽기 · 이동 · 검색 · 칸 입력</text>
  <text x="230" y="361" font-size="13" fill="#55c555" text-anchor="middle">바로 실행한다</text>
  <rect x="480" y="290" width="340" height="86" rx="8" fill="#101418" stroke="#e05555" stroke-width="1.5"/>
  <text x="650" y="317" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">되돌릴 수 없는 동작</text>
  <text x="650" y="340" font-size="13" fill="#888" text-anchor="middle">결재 · 발송 · 확정 · 삭제</text>
  <text x="650" y="361" font-size="13" fill="#e05555" text-anchor="middle">멈추고 사람이 확인한다</text>
  <line x1="230" y1="376" x2="340" y2="430" stroke="#888888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="650" y1="376" x2="540" y2="430" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <rect x="230" y="430" width="420" height="50" rx="8" fill="#101418" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="460" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">실행 뒤 성공 조건을 확인한다</text>
  <text x="60" y="514" font-size="13" fill="#888">점선은 사람이 승인했을 때만 이어진다. 판정이 애매한 동작은 오른쪽 갈래에 넣는다.</text>
</svg>
