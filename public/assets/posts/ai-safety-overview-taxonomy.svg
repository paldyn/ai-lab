<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <defs>
    <style>text { font-family: 'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif; }</style>
    <marker id="taxonomy-arrow" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#9aa4b8"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">AI 안전성 문제 분류 체계</text>
  <text x="440" y="69" font-size="13" fill="#9aa4b8" text-anchor="middle">겉으로 비슷한 실패도 원인에 따라 대응 방법이 달라진다</text>

  <!-- Root -->
  <rect x="315" y="86" width="250" height="56" rx="8" fill="#18151d" stroke="#d5dae2" stroke-width="1.5"/>
  <text x="440" y="110" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">AI 시스템의 안전 위험</text>
  <text x="440" y="130" font-size="12" fill="#9aa4b8" text-anchor="middle">위험이 생기는 뿌리를 기준으로 구분</text>

  <!-- Root to category cards -->
  <line x1="370" y1="142" x2="165" y2="178" stroke="#9aa4b8" stroke-width="1.75" marker-end="url(#taxonomy-arrow)"/>
  <line x1="440" y1="142" x2="440" y2="178" stroke="#9aa4b8" stroke-width="1.75" marker-end="url(#taxonomy-arrow)"/>
  <line x1="510" y1="142" x2="715" y2="178" stroke="#9aa4b8" stroke-width="1.75" marker-end="url(#taxonomy-arrow)"/>

  <!-- 기술적 위험 -->
  <rect x="60" y="178" width="210" height="254" rx="10" fill="#0f181c" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="60" y="178" width="210" height="62" rx="10" fill="#13232a"/>
  <path d="M 60 230 L 60 188 Q 60 178 70 178 L 260 178 Q 270 178 270 188 L 270 230 Z" fill="#13232a"/>
  <text x="165" y="205" font-size="16" font-weight="700" fill="#8dd5ef" text-anchor="middle">기술적 위험</text>
  <text x="165" y="225" font-size="12" fill="#a9c6d0" text-anchor="middle">모델의 성질과 견고성</text>

  <rect x="76" y="258" width="178" height="60" rx="7" fill="#111e24" stroke="#315564" stroke-width="1"/>
  <text x="90" y="282" font-size="14" font-weight="600" fill="#e4edf1">환각</text>
  <text x="90" y="303" font-size="12" fill="#aebac0">사실과 다른 출력을 생성</text>

  <rect x="76" y="330" width="178" height="60" rx="7" fill="#111e24" stroke="#315564" stroke-width="1"/>
  <text x="90" y="354" font-size="14" font-weight="600" fill="#e4edf1">취약한 견고성</text>
  <text x="90" y="375" font-size="12" fill="#aebac0">조금 비튼 입력에도 흔들림</text>
  <text x="165" y="416" font-size="12" fill="#7ec8e3" text-anchor="middle">성능·검증으로 줄이는 위험</text>

  <!-- 사회적 위험 -->
  <rect x="335" y="178" width="210" height="254" rx="10" fill="#1b1111" stroke="#e05555" stroke-width="1.5"/>
  <rect x="335" y="178" width="210" height="62" rx="10" fill="#271515"/>
  <path d="M 335 230 L 335 188 Q 335 178 345 178 L 535 178 Q 545 178 545 188 L 545 230 Z" fill="#271515"/>
  <text x="440" y="205" font-size="16" font-weight="700" fill="#ef7474" text-anchor="middle">사회적 위험</text>
  <text x="440" y="225" font-size="12" fill="#d1aaaa" text-anchor="middle">사회 패턴의 증폭과 노출</text>

  <rect x="351" y="254" width="178" height="44" rx="7" fill="#211313" stroke="#643131" stroke-width="1"/>
  <text x="365" y="273" font-size="13" font-weight="600" fill="#f0e2e2">편향·차별</text>
  <text x="365" y="290" font-size="12" fill="#c2abab">불평등을 증폭·재생산</text>

  <rect x="351" y="309" width="178" height="44" rx="7" fill="#211313" stroke="#643131" stroke-width="1"/>
  <text x="365" y="328" font-size="13" font-weight="600" fill="#f0e2e2">유해 콘텐츠</text>
  <text x="365" y="345" font-size="12" fill="#c2abab">자해 조장·착취물 등</text>

  <rect x="351" y="364" width="178" height="44" rx="7" fill="#211313" stroke="#643131" stroke-width="1"/>
  <text x="365" y="383" font-size="13" font-weight="600" fill="#f0e2e2">개인정보 노출</text>
  <text x="365" y="400" font-size="12" fill="#c2abab">민감 정보의 생성·유출</text>
  <text x="440" y="423" font-size="12" fill="#e98383" text-anchor="middle">데이터·정책·감사로 줄이는 위험</text>

  <!-- 정렬 위험 -->
  <rect x="610" y="178" width="210" height="254" rx="10" fill="#151426" stroke="#8585d6" stroke-width="1.5"/>
  <rect x="610" y="178" width="210" height="62" rx="10" fill="#1d1c32"/>
  <path d="M 610 230 L 610 188 Q 610 178 620 178 L 810 178 Q 820 178 820 188 L 820 230 Z" fill="#1d1c32"/>
  <text x="715" y="205" font-size="16" font-weight="700" fill="#a1a1ec" text-anchor="middle">정렬 위험</text>
  <text x="715" y="225" font-size="12" fill="#b5b5d4" text-anchor="middle">의도와 최적화 목표의 간극</text>

  <rect x="626" y="254" width="178" height="44" rx="7" fill="#19182d" stroke="#47477a" stroke-width="1"/>
  <text x="640" y="273" font-size="13" font-weight="600" fill="#e8e8f2">목적 불일치</text>
  <text x="640" y="290" font-size="12" fill="#b8b8cd">뜻과 다른 목표를 추구</text>

  <rect x="626" y="309" width="178" height="44" rx="7" fill="#19182d" stroke="#47477a" stroke-width="1"/>
  <text x="640" y="328" font-size="13" font-weight="600" fill="#e8e8f2">보상 해킹</text>
  <text x="640" y="345" font-size="12" fill="#b8b8cd">지표만 올리고 뜻은 놓침</text>

  <rect x="626" y="364" width="178" height="44" rx="7" fill="#19182d" stroke="#47477a" stroke-width="1"/>
  <text x="640" y="383" font-size="13" font-weight="600" fill="#e8e8f2">명세 게임</text>
  <text x="640" y="400" font-size="12" fill="#b8b8cd">규칙의 빈틈을 최적화</text>
  <text x="715" y="423" font-size="12" fill="#a1a1ec" text-anchor="middle">정렬 학습·감독으로 줄이는 위험</text>

  <rect x="210" y="452" width="460" height="30" rx="15" fill="#141414" stroke="#343840" stroke-width="1"/>
  <text x="440" y="472" font-size="13" font-weight="600" fill="#c6ccd5" text-anchor="middle">원인을 나누면, 어디에 방어를 세울지도 선명해진다</text>
</svg>
