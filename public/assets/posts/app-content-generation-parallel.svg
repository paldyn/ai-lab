<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="cg-arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="cg-warn" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>

  <text x="60" y="50" font-size="22" font-weight="700" fill="#e8e8e8">병렬 작성이 빠른 이유와 새는 자리</text>

  <rect x="60" y="80" width="180" height="60" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="150" y="106" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">아웃라인</text>
  <text x="150" y="126" font-size="13" fill="#888" text-anchor="middle">절 4개와 논지</text>

  <line x1="240" y1="110" x2="300" y2="110" stroke="#7777cc" stroke-width="2" marker-end="url(#cg-arr)"/>

  <rect x="300" y="80" width="230" height="60" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="415" y="106" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">절별 호출 4개 동시에</text>
  <text x="415" y="126" font-size="13" fill="#888" text-anchor="middle">벽시계 시간 1/4</text>

  <line x1="415" y1="140" x2="415" y2="178" stroke="#7777cc" stroke-width="2" marker-end="url(#cg-arr)"/>

  <rect x="60" y="178" width="180" height="96" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="150" y="206" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">1절</text>
  <text x="150" y="230" font-size="13" fill="#7ec8e3" text-anchor="middle">파인튜닝</text>
  <text x="150" y="252" font-size="13" fill="#888" text-anchor="middle">~합니다 · 챗봇 예시</text>

  <rect x="255" y="178" width="180" height="96" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="345" y="206" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">2절</text>
  <text x="345" y="230" font-size="13" fill="#e05555" text-anchor="middle">미세조정</text>
  <text x="345" y="252" font-size="13" fill="#888" text-anchor="middle">~한다 · 챗봇 예시</text>

  <rect x="450" y="178" width="180" height="96" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="540" y="206" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">3절</text>
  <text x="540" y="230" font-size="13" fill="#e05555" text-anchor="middle">fine-tuning</text>
  <text x="540" y="252" font-size="13" fill="#888" text-anchor="middle">~합니다 · 챗봇 예시</text>

  <rect x="645" y="178" width="175" height="96" rx="10" fill="#12141a" stroke="#2a2f3a" stroke-width="1"/>
  <text x="732" y="206" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">4절</text>
  <text x="732" y="230" font-size="13" fill="#7ec8e3" text-anchor="middle">파인튜닝</text>
  <text x="732" y="252" font-size="13" fill="#888" text-anchor="middle">~한다 · 번역 예시</text>

  <text x="60" y="300" font-size="13" fill="#e05555">각 호출은 다른 절의 문장을 못 본다 — 용어 표기, 어미, 예시가 절마다 따로 정해진다</text>

  <line x1="440" y1="316" x2="440" y2="348" stroke="#7777cc" stroke-width="2" marker-end="url(#cg-arr)"/>

  <rect x="60" y="348" width="760" height="66" rx="10" fill="#12141a" stroke="#55c555" stroke-width="1.5"/>
  <text x="82" y="375" font-size="15" font-weight="600" fill="#e8e8e8">통합 편집 한 번 — 글 전체를 한 호출에 넣는다</text>
  <text x="82" y="397" font-size="13" fill="#888">용어와 어미는 여기서 잡힌다. 예시 중복은 아웃라인의 not_here로 미리 갈라 둔다</text>

  <text x="60" y="446" font-size="13" fill="#7777cc">호출 한 번을 더 쓰고 병렬 이득은 그대로 남긴다</text>
</svg>
