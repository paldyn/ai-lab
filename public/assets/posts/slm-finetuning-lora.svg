<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
  <defs>
    <marker id="loraArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#8a8a8a"/>
    </marker>
    <marker id="loraArrBlue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="loraArrGrad" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">LoRA는 원본을 건드리지 않고 옆길을 하나 낸다</text>

  <rect x="60" y="150" width="110" height="60" rx="8" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="115" y="186" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">입력</text>

  <rect x="250" y="88" width="210" height="72" rx="8" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="355" y="118" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">사전학습 가중치 W · 동결</text>
  <text x="355" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">기울기도 옵티마이저 상태도 없다</text>

  <rect x="250" y="228" width="95" height="62" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="297" y="252" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">A</text>
  <text x="297" y="276" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">d × r</text>

  <rect x="365" y="228" width="95" height="62" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="412" y="252" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">B</text>
  <text x="412" y="276" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">r × d</text>

  <circle cx="560" cy="180" r="24" fill="#12161c" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="560" y="187" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="18" font-weight="700" fill="#e8e8e8">+</text>

  <rect x="650" y="150" width="170" height="60" rx="8" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="735" y="186" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">출력</text>

  <path d="M 170 180 L 210 180 L 210 124 L 250 124" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#loraArr)"/>
  <path d="M 170 180 L 210 180 L 210 259 L 250 259" fill="none" stroke="#7ec8e3" stroke-width="1.5" marker-end="url(#loraArrBlue)"/>
  <line x1="345" y1="259" x2="365" y2="259" stroke="#7ec8e3" stroke-width="1.5" marker-end="url(#loraArrBlue)"/>
  <path d="M 460 124 L 560 124 L 560 156" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#loraArr)"/>
  <path d="M 460 259 L 560 259 L 560 204" fill="none" stroke="#7ec8e3" stroke-width="1.5" marker-end="url(#loraArrBlue)"/>
  <line x1="584" y1="180" x2="650" y2="180" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#loraArr)"/>

  <circle r="5" fill="#e8e8e8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 170 180 L 210 180 L 210 124 L 560 124 L 560 180 L 650 180"/>
  </circle>
  <circle r="5" fill="#7ec8e3">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 170 180 L 210 180 L 210 259 L 560 259 L 560 180 L 650 180"/>
  </circle>

  <path d="M 545 322 L 320 322" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#loraArrGrad)">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="565" y="327" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">역전파는 이 옆길로만 되돌아온다</text>

  <text x="60" y="358" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">갱신되는 값은 A와 B뿐이다. 원본은 그대로 남아 있으므로 배포할 때도 이 둘만 따로 얹었다 뗐다 할 수 있다.</text>
</svg>
