<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 480" style="background:#0a0a0a;border-radius:12px">
  <!-- Header -->
  <rect x="0" y="0" width="880" height="72" rx="12" fill="#0d1a2a"/>
  <rect x="0" y="60" width="880" height="12" fill="#0d1a2a"/>
  <text x="60" y="40" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">선형 회귀 scikit-learn / PyTorch 구현</text>
  <text x="60" y="62" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">최소 제곱법, 정규화 회귀, 신경망 회귀 비교</text>
  <line x1="60" y1="82" x2="820" y2="82" stroke="#3a4a6e" stroke-width="1"/>

  <text x="60" y="108" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">scikit-learn: 기본 및 정규화 회귀</text>
  <rect x="60" y="115" width="370" height="246" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="152" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> sklearn.linear_model</tspan><tspan fill="#7ec8e3"> import</tspan><tspan fill="#ffffff"> *</tspan></text>
  <text x="76" y="170" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> sklearn.metrics</tspan><tspan fill="#7ec8e3"> import</tspan><tspan fill="#ffffff"> r2_score</tspan></text>
  <text x="76" y="188" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># 기본 선형 회귀 (OLS)</tspan></text>
  <text x="76" y="206" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">lr = LinearRegression()</tspan></text>
  <text x="76" y="224" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">lr.fit(X_train, y_train)</tspan></text>
  <text x="76" y="242" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">pred = lr.predict(X_test)</tspan></text>
  <text x="76" y="260" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">print(f</tspan><tspan fill="#ce9178">&quot;R² = {r2_score(y_test, pred):.3f}&quot;</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="76" y="278" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># Ridge (L2) — 다중공선성 해결</tspan></text>
  <text x="76" y="296" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">ridge = Ridge(alpha=</tspan><tspan fill="#b5cea8">1.0</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="76" y="314" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># Lasso (L1) — 특성 선택 효과</tspan></text>
  <text x="76" y="332" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">lasso = Lasso(alpha=</tspan><tspan fill="#b5cea8">0.1</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="76" y="350" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># ElasticNet: Ridge + Lasso 결합</tspan></text>

  <text x="460" y="108" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">PyTorch: 경사 하강법으로 선형 회귀</text>
  <rect x="460" y="115" width="360" height="246" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="476" y="152" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> torch, torch.nn </tspan><tspan fill="#7ec8e3">as</tspan><tspan fill="#ffffff"> nn</tspan></text>
  <text x="476" y="170" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># nn.Linear = wX + b 자동 구현</tspan></text>
  <text x="476" y="188" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">model = nn.Linear(</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">)</tspan><tspan fill="#9aa4b8">  # y=wx+b</tspan></text>
  <text x="476" y="206" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">loss_fn = nn.MSELoss()</tspan></text>
  <text x="476" y="224" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">opt = torch.optim.SGD(</tspan></text>
  <text x="476" y="242" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    model.parameters(), lr=</tspan><tspan fill="#b5cea8">0.01</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="476" y="260" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">for</tspan><tspan fill="#ffffff"> epoch </tspan><tspan fill="#7ec8e3">in</tspan><tspan fill="#ffffff"> range(</tspan><tspan fill="#b5cea8">1000</tspan><tspan fill="#ffffff">):</tspan></text>
  <text x="476" y="278" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    opt.zero_grad()</tspan></text>
  <text x="476" y="296" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    loss = loss_fn(model(X_t), y_t)</tspan></text>
  <text x="476" y="314" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    loss.backward()</tspan></text>
  <text x="476" y="332" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    opt.step()</tspan></text>
  <text x="476" y="350" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># w와 b가 자동으로 최적화됨</tspan></text>

  <!-- 평가 지표 -->
  <rect x="60" y="383" width="760" height="86" rx="8" fill="#0d1a2a" stroke="#3a4a6e"/>
  <text x="80" y="407" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#7ec8e3">회귀 모델 평가 지표</text>
  <text x="80" y="429" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">MSE: 평균 제곱 오차 | RMSE: √MSE (원래 단위) | MAE: 평균 절대 오차</text>
  <text x="80" y="447" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">R² (결정계수): 0~1, 1에 가까울수록 좋음 | Adjusted R²: 특성 수가 늘면 감점</text>
  <text x="80" y="465" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">R²=0: y 평균과 같은 성능 | R²=1: 완벽한 예측 | R²&lt;0: 평균보다 나쁨</text>
</svg>
