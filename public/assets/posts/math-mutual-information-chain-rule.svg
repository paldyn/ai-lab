  <line x1="520" y1="254" x2="520" y2="270" stroke="#888" stroke-width="1.5"/>
  <line x1="778" y1="254" x2="778" y2="270" stroke="#888" stroke-width="1.5"/>
  <text x="649" y="292" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">H(X, Y) = 0.922</text>

  <text x="520" y="340" font-size="13" fill="#888">I(X;Y) = 0.469 − 0.200 = 0.269</text>
