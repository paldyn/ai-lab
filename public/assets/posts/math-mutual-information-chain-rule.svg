  <text x="120" y="236" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">0.469</text>

  <line x1="187" y1="339" x2="243" y2="339" stroke="#7ec8e3" stroke-width="3"/>
  <text x="215" y="326" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">0</text>

  <rect x="282" y="140" width="56" height="200" fill="#e05555" fill-opacity="0.55"/>
  <text x="310" y="130" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">1.000</text>

  <rect x="377" y="300" width="56" height="40" fill="#55c555" fill-opacity="0.55"/>
  <text x="405" y="290" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">0.200</text>

