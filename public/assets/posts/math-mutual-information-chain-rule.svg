  <text x="120" y="362" font-size="13" fill="#e8e8e8" text-anchor="middle">H(X)</text>
  <text x="215" y="362" font-size="13" fill="#e8e8e8" text-anchor="middle">H(X|Y=1)</text>
  <text x="310" y="362" font-size="13" fill="#e8e8e8" text-anchor="middle">H(X|Y=2)</text>
  <text x="405" y="362" font-size="13" fill="#e8e8e8" text-anchor="middle">H(X|Y)</text>
  <text x="120" y="382" font-size="13" fill="#888" text-anchor="middle">모를 때</text>
