  <text x="405" y="382" font-size="13" fill="#888" text-anchor="middle">평균</text>

  <text x="520" y="112" font-size="16" font-weight="600" fill="#e8e8e8">사슬 규칙 (비트)</text>

  <text x="520" y="188" font-size="13" font-weight="600" fill="#7777cc">H(Y) = 0.722</text>
  <text x="778" y="188" font-size="13" font-weight="600" fill="#55c555" text-anchor="end">H(X|Y) = 0.200</text>
  <rect x="520" y="200" width="202" height="44" fill="#7777cc" fill-opacity="0.55"/>
  <rect x="722" y="200" width="56" height="44" fill="#55c555" fill-opacity="0.55"/>

