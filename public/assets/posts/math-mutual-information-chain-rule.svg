<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">특정 y에서는 놀람이 커져도 평균은 줄어든다</text>
  <text x="60" y="72" font-size="13" fill="#888">결합분포 세 칸: (Y=1, A) 0.8 · (Y=2, A) 0.1 · (Y=2, B) 0.1</text>

  <text x="92" y="112" font-size="16" font-weight="600" fill="#e8e8e8">조건부 엔트로피 (비트)</text>

