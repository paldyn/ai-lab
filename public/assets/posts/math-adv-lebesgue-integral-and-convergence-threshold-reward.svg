<text x="674.0" y="140.0" font-size="16" fill="#e05555" text-anchor="start" font-weight="600">붉은 띠 [0.4, 0.5]</text>
<text x="674.0" y="162.0" font-size="13" fill="#e8e8e8" text-anchor="start">질량 0.0360</text>
<text x="674.0" y="184.0" font-size="13" fill="#e8e8e8" text-anchor="start">≈ φ(0.5) × Δθ</text>
<text x="674.0" y="206.0" font-size="13" fill="#e8e8e8" text-anchor="start">= 0.3521 × 0.1</text>
<text x="674.0" y="250.0" font-size="13" fill="#888" text-anchor="start">띠 밖의 ε 마다</text>
<text x="674.0" y="272.0" font-size="13" fill="#888" text-anchor="start">보상 변화는 0</text>
<text x="674.0" y="294.0" font-size="13" fill="#888" text-anchor="start">띠 안에서는 1/Δθ</text>
<text x="674.0" y="316.0" font-size="13" fill="#888" text-anchor="start">= 10 으로 치솟는다</text>
<text x="440.0" y="440.0" font-size="13" fill="#888" text-anchor="middle">표본마다 미분하면 0, 띠를 통째로 보면 0.3521 — 차분몫이 지배되지 않는 자리다</text>
