<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="520" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="cpArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">잘라 붙이면 전부 직사각형이 된다</text>
  <text x="60" y="82" font-size="13" fill="#888">공식을 외우는 대신, 이미 아는 직사각형으로 되돌린다</text>

  <polygon points="90,205 230,205 270,135 130,135" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
