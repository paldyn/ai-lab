  <line x1="330" y1="425" x2="385" y2="425" stroke="#888" stroke-width="2" marker-end="url(#cpArr)"/>
  <rect x="400" y="390" width="180" height="70" fill="none" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="400,460 520,460 500,390 440,390" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="620" y="418" font-size="15" font-weight="600" fill="#e8e8e8">사다리꼴</text>
  <text x="620" y="441" font-size="13" fill="#7ec8e3">(윗변+아랫변) × 높이 ÷ 2</text>
