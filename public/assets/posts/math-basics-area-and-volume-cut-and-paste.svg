  <line x1="300" y1="170" x2="380" y2="170" stroke="#888" stroke-width="2" marker-end="url(#cpArr)"/>
  <rect x="400" y="135" width="140" height="70" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="620" y="163" font-size="15" font-weight="600" fill="#e8e8e8">평행사변형</text>
  <text x="620" y="186" font-size="13" fill="#7ec8e3">밑변 × 높이</text>

  <polygon points="90,330 230,330 160,260" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <polygon points="230,330 300,260 160,260" fill="none" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="330" y1="295" x2="385" y2="295" stroke="#888" stroke-width="2" marker-end="url(#cpArr)"/>
  <rect x="400" y="260" width="140" height="70" fill="none" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="400,330 540,330 470,260" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="620" y="288" font-size="15" font-weight="600" fill="#e8e8e8">삼각형</text>
  <text x="620" y="311" font-size="13" fill="#7ec8e3">밑변 × 높이 ÷ 2</text>

  <polygon points="90,460 210,460 190,390 130,390" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
