<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
<text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">{A, B, C}의 부분집합 8개를 원소 개수로 묶기</text>
<text x="440" y="70" text-anchor="middle" font-size="13" fill="#888">묶음마다 개수가 파스칼 삼각형 n = 3 줄의 1 · 3 · 3 · 1이다</text>
<rect x="72" y="96" width="165" height="210" rx="10" fill="#7ec8e3" fill-opacity="0.06" stroke="#7ec8e3" stroke-opacity="0.5" stroke-width="1.5"/>
<text x="154.5" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">원소 0개</text>
<rect x="94" y="146" width="121" height="36" rx="18" fill="#7777cc" fill-opacity="0.18" stroke="#7777cc" stroke-width="1.5"/>
<text x="154.5" y="169" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">{ }</text>
<text x="154.5" y="342" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">C(3, 0) = 1</text>
<rect x="262" y="96" width="165" height="210" rx="10" fill="#7ec8e3" fill-opacity="0.06" stroke="#7ec8e3" stroke-opacity="0.5" stroke-width="1.5"/>
<text x="344.5" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">원소 1개</text>
<rect x="284" y="146" width="121" height="36" rx="18" fill="#7777cc" fill-opacity="0.18" stroke="#7777cc" stroke-width="1.5"/>
<text x="344.5" y="169" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">{A}</text>
<rect x="284" y="194" width="121" height="36" rx="18" fill="#7777cc" fill-opacity="0.18" stroke="#7777cc" stroke-width="1.5"/>
<text x="344.5" y="217" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">{B}</text>
<rect x="284" y="242" width="121" height="36" rx="18" fill="#7777cc" fill-opacity="0.18" stroke="#7777cc" stroke-width="1.5"/>
<text x="344.5" y="265" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">{C}</text>
<text x="344.5" y="342" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">C(3, 1) = 3</text>
<rect x="452" y="96" width="165" height="210" rx="10" fill="#7ec8e3" fill-opacity="0.06" stroke="#7ec8e3" stroke-opacity="0.5" stroke-width="1.5"/>
<text x="534.5" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">원소 2개</text>
<rect x="474" y="146" width="121" height="36" rx="18" fill="#7777cc" fill-opacity="0.18" stroke="#7777cc" stroke-width="1.5"/>
<text x="534.5" y="169" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">{A, B}</text>
<rect x="474" y="194" width="121" height="36" rx="18" fill="#7777cc" fill-opacity="0.18" stroke="#7777cc" stroke-width="1.5"/>
<text x="534.5" y="217" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">{A, C}</text>
<rect x="474" y="242" width="121" height="36" rx="18" fill="#7777cc" fill-opacity="0.18" stroke="#7777cc" stroke-width="1.5"/>
<text x="534.5" y="265" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">{B, C}</text>
<text x="534.5" y="342" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">C(3, 2) = 3</text>
<rect x="642" y="96" width="165" height="210" rx="10" fill="#7ec8e3" fill-opacity="0.06" stroke="#7ec8e3" stroke-opacity="0.5" stroke-width="1.5"/>
<text x="724.5" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">원소 3개</text>
<rect x="664" y="146" width="121" height="36" rx="18" fill="#7777cc" fill-opacity="0.18" stroke="#7777cc" stroke-width="1.5"/>
<text x="724.5" y="169" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">{A, B, C}</text>
<text x="724.5" y="342" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">C(3, 3) = 1</text>
<text x="440" y="386" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">1 + 3 + 3 + 1 = 8 = 2 × 2 × 2</text>
<text x="440" y="412" text-anchor="middle" font-size="13" fill="#888">원소 A · B · C마다 넣는다 · 뺀다 두 갈래이므로 곱의 법칙으로도 8이다</text>
</svg>
