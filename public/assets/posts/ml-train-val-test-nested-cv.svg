<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="ncvArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>

  <text x="62" y="44" font-size="22" font-weight="700" fill="#e8e8e8">중첩 교차 검증 — 튜닝과 평가를 다른 데이터로 가른다</text>
  <text x="62" y="70" font-size="13" fill="#888">바깥 폴드의 검증 부분은 하이퍼파라미터를 고르는 데 한 번도 쓰이지 않는다.</text>

  <text x="62" y="104" font-size="14" font-weight="600" fill="#e8e8e8">바깥 루프 — 5-겹</text>

  <rect x="62" y="118" width="58" height="28" rx="4" fill="#3a1a0a"/>
  <text x="91" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#e07030">검증</text>
  <rect x="125" y="118" width="58" height="28" rx="4" fill="#1a3a5c"/>
  <rect x="188" y="118" width="58" height="28" rx="4" fill="#1a3a5c"/>
  <rect x="251" y="118" width="58" height="28" rx="4" fill="#1a3a5c"/>
  <rect x="314" y="118" width="58" height="28" rx="4" fill="#1a3a5c"/>
  <text x="280" y="137" text-anchor="middle" font-size="11" fill="#7ec8e3">훈련 부분</text>

  <g opacity="0.4">
    <rect x="62" y="152" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="125" y="152" width="58" height="28" rx="4" fill="#3a1a0a"/>
    <rect x="188" y="152" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="251" y="152" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="314" y="152" width="58" height="28" rx="4" fill="#1a3a5c"/>

    <rect x="62" y="186" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="125" y="186" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="188" y="186" width="58" height="28" rx="4" fill="#3a1a0a"/>
    <rect x="251" y="186" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="314" y="186" width="58" height="28" rx="4" fill="#1a3a5c"/>

    <rect x="62" y="220" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="125" y="220" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="188" y="220" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="251" y="220" width="58" height="28" rx="4" fill="#3a1a0a"/>
    <rect x="314" y="220" width="58" height="28" rx="4" fill="#1a3a5c"/>

    <rect x="62" y="254" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="125" y="254" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="188" y="254" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="251" y="254" width="58" height="28" rx="4" fill="#1a3a5c"/>
    <rect x="314" y="254" width="58" height="28" rx="4" fill="#3a1a0a"/>
  </g>

  <text x="62" y="302" font-size="12" fill="#888">폴드 1의 훈련 부분만 오른쪽에 펼쳐 그렸다</text>

  <line x1="372" y1="132" x2="440" y2="132" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ncvArr)"/>

  <rect x="440" y="100" width="378" height="196" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="464" y="126" font-size="15" font-weight="600" fill="#e8e8e8">안쪽 루프 — 3-겹으로 24조합 평가</text>

  <rect x="464" y="144" width="100" height="28" rx="4" fill="#3a1a0a"/>
  <text x="514" y="163" text-anchor="middle" font-size="11" font-weight="600" fill="#e07030">검증</text>
  <rect x="570" y="144" width="100" height="28" rx="4" fill="#1a3a5c"/>
  <rect x="676" y="144" width="100" height="28" rx="4" fill="#1a3a5c"/>

  <rect x="464" y="178" width="100" height="28" rx="4" fill="#1a3a5c"/>
  <rect x="570" y="178" width="100" height="28" rx="4" fill="#3a1a0a"/>
  <text x="620" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#e07030">검증</text>
  <rect x="676" y="178" width="100" height="28" rx="4" fill="#1a3a5c"/>

  <rect x="464" y="212" width="100" height="28" rx="4" fill="#1a3a5c"/>
  <rect x="570" y="212" width="100" height="28" rx="4" fill="#1a3a5c"/>
  <rect x="676" y="212" width="100" height="28" rx="4" fill="#3a1a0a"/>
  <text x="726" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#e07030">검증</text>

  <text x="464" y="262" font-size="13" fill="#9aa4b8">24조합을 3-겹으로 재고 최적 조합 하나를 고른다</text>
  <text x="464" y="282" font-size="13" fill="#9aa4b8">바깥 폴드의 검증 부분은 여기에 들어오지 않는다</text>

  <line x1="629" y1="296" x2="629" y2="322" stroke="#7ec8e3" stroke-width="2" marker-end="url(#ncvArr)"/>

  <rect x="440" y="322" width="378" height="64" rx="10" fill="#12242c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="464" y="348" font-size="14" font-weight="600" fill="#7ec8e3">바깥 검증 부분에서 점수 하나</text>
  <text x="464" y="370" font-size="12" fill="#9aa4b8">튜닝에 한 번도 쓰이지 않은 데이터라 낙관이 없다</text>

  <rect x="62" y="322" width="310" height="64" rx="10" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="80" y="348" font-size="13" fill="#ffffff" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">GridSearchCV  5 x 24 + 1 = 121</text>
  <text x="80" y="370" font-size="13" fill="#e05555" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">Nested CV  5 x (3 x 24 + 1) = 365</text>

  <text x="62" y="418" font-size="12" fill="#888">중첩 CV가 돌려주는 것은 모델이 아니라 성능 추정치다. 배포할 모델은 추정을 마친 뒤 전체 데이터로 한 번 더 만든다.</text>
</svg>
