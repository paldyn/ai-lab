<svg xmlns="http://www.w3.org/2000/svg" width="880" height="368" viewBox="0 0 880 368" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="368" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">사용자가 말을 멈춘 뒤 첫 소리가 나오기까지</text>
  <text x="62" y="68" font-size="13" fill="#888">단계마다 걸리는 시간을 예로 넣어 본 예산이다. 절대값은 구현마다 다르다.</text>

  <text x="62" y="139" font-size="14" font-weight="600" fill="#e05555">이어 붙인 구성</text>
  <rect x="190" y="110" width="194" height="46" rx="6" fill="#1a2030" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="287" y="139" text-anchor="middle" font-size="12" fill="#c8d0e0">발화 끝 감지 500</text>
  <rect x="384" y="110" width="116" height="46" rx="6" fill="#12242c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="442" y="139" text-anchor="middle" font-size="12" fill="#7ec8e3">ASR 300</text>
  <rect x="500" y="110" width="155" height="46" rx="6" fill="#20203a" stroke="#7777cc" stroke-width="1.5"/>
  <text x="577" y="139" text-anchor="middle" font-size="12" fill="#9a9ade">LLM 첫 토큰 400</text>
  <rect x="655" y="110" width="78" height="46" rx="6" fill="#2a2416" stroke="#c8a55a" stroke-width="1.5"/>
  <text x="694" y="139" text-anchor="middle" font-size="12" fill="#c8a55a">TTS 200</text>
  <text x="749" y="139" font-size="14" font-weight="600" fill="#e05555">1,400 ms</text>

  <text x="62" y="225" font-size="14" font-weight="600" fill="#55c555">음성 대 음성 모델</text>
  <rect x="190" y="196" width="116" height="46" rx="6" fill="#1a2030" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="248" y="225" text-anchor="middle" font-size="12" fill="#c8d0e0">끝 감지 300</text>
  <rect x="306" y="196" width="116" height="46" rx="6" fill="#14261a" stroke="#55c555" stroke-width="1.5"/>
  <text x="364" y="225" text-anchor="middle" font-size="12" fill="#55c555">음성 응답 300</text>
  <text x="438" y="225" font-size="14" font-weight="600" fill="#55c555">600 ms</text>

  <line x1="190" y1="272" x2="810" y2="272" stroke="#4a5568" stroke-width="1.5"/>
  <g stroke="#4a5568" stroke-width="1.5">
    <line x1="190" y1="272" x2="190" y2="280"/>
    <line x1="345" y1="272" x2="345" y2="280"/>
    <line x1="500" y1="272" x2="500" y2="280"/>
    <line x1="655" y1="272" x2="655" y2="280"/>
    <line x1="810" y1="272" x2="810" y2="280"/>
  </g>
  <text x="190" y="298" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="345" y="298" text-anchor="middle" font-size="11" fill="#888">400</text>
  <text x="500" y="298" text-anchor="middle" font-size="11" fill="#888">800</text>
  <text x="655" y="298" text-anchor="middle" font-size="11" fill="#888">1200</text>
  <text x="810" y="298" text-anchor="middle" font-size="11" fill="#888">1600 ms</text>

  <text x="62" y="332" font-size="12" fill="#9aa4b8">사람의 대화에서 차례가 넘어가는 간격은 대체로 200~500 ms다. 800 ms를 넘기면 상대가 멈칫한 것처럼 들린다.</text>
  <text x="62" y="354" font-size="12" fill="#9aa4b8">그래서 이어 붙인 구성에서는 발화 끝을 언제로 볼 것인가가 가장 큰 항목이 된다.</text>
</svg>
