  <text x="759" y="271" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">20%</text>

  <text x="60" y="352" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">상한은 감이 아니라 지금 들어오는 요청 길이의 99번째 백분위수를 재서 정한다.</text>
