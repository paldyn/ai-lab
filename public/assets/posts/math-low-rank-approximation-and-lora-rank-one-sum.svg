<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="430" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">행렬은 랭크 1짜리 층을 겹쳐 쌓은 것이다</text>
  <text x="60" y="70" font-size="13" fill="#888">각 층의 두께가 σᵢ다. 큰 것부터 놓았으니 뒤로 갈수록 얇아진다.</text>

  <text x="60" y="112" font-size="15" fill="#e8e8e8">A  =</text>

  <rect x="118" y="132" width="126" height="126" rx="6" fill="#7ec8e3" fill-opacity="0.55" stroke="#7ec8e3" stroke-width="2"/>
  <text x="181" y="200" font-size="15" font-weight="600" fill="#0a0a0a" text-anchor="middle">σ₁u₁v₁ᵀ</text>
  <text x="181" y="282" font-size="13" fill="#7ec8e3" text-anchor="middle">σ₁ = 10</text>

  <text x="256" y="200" font-size="18" fill="#888" text-anchor="middle">+</text>

  <rect x="278" y="132" width="126" height="126" rx="6" fill="#7ec8e3" fill-opacity="0.34" stroke="#7ec8e3" stroke-width="2"/>
  <text x="341" y="200" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">σ₂u₂v₂ᵀ</text>
  <text x="341" y="282" font-size="13" fill="#7ec8e3" text-anchor="middle">σ₂ = 6</text>

  <text x="416" y="200" font-size="18" fill="#888" text-anchor="middle">+</text>

  <rect x="438" y="132" width="126" height="126" rx="6" fill="#7777cc" fill-opacity="0.20" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="501" y="200" font-size="15" font-weight="600" fill="#9aa4b8" text-anchor="middle">σ₃u₃v₃ᵀ</text>
  <text x="501" y="282" font-size="13" fill="#9aa4b8" text-anchor="middle">σ₃ = 3</text>

  <text x="576" y="200" font-size="18" fill="#888" text-anchor="middle">+</text>

  <rect x="598" y="132" width="126" height="126" rx="6" fill="#7777cc" fill-opacity="0.10" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="661" y="200" font-size="15" font-weight="600" fill="#9aa4b8" text-anchor="middle">σ₄u₄v₄ᵀ</text>
  <text x="661" y="282" font-size="13" fill="#9aa4b8" text-anchor="middle">σ₄ = 1</text>

  <line x1="424" y1="112" x2="424" y2="300" stroke="#e05555" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="434" y="112" font-size="14" font-weight="600" fill="#e05555">여기서 자른다 (k = 2)</text>

  <rect x="118" y="316" width="286" height="42" rx="8" fill="#101820" stroke="#55c555" stroke-width="1.5"/>
  <text x="261" y="343" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">남긴 것 A₂ — 에너지 93.2%</text>

  <rect x="438" y="316" width="286" height="42" rx="8" fill="#101820" stroke="#e05555" stroke-width="1.5"/>
  <text x="581" y="343" font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">버린 것 — ‖A−A₂‖_F = √(9+1) = 3.16</text>

  <rect x="60" y="376" width="760" height="34" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="82" y="398" font-size="14" fill="#e8e8e8">uvᵀ는 열벡터 곱하기 행벡터라 원래 크기의 행렬이 되고, 모든 행이 같은 벡터의 배수라 랭크가 1이다.</text>
</svg>
