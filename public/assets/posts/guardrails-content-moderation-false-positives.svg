<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888888"/>
    </marker>
    <marker id="arrGrayBack" viewBox="0 0 14 14" refX="2" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 14 0 L 1 7 L 14 14 z" fill="#888888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="410" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">같은 임계값이 400건을 흘리고 84명을 막는다</text>
  <text x="60" y="70" font-size="13" fill="#888">하루 요청 20만 건, 위반 1%, 재현율 0.8, 정밀도 0.95일 때.</text>

  <rect x="249" y="88" width="380" height="52" rx="10" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="439" y="120" font-size="16" fill="#e8e8e8" text-anchor="middle">하루 요청 200,000건 · 위반 2,000건</text>

  <path d="M 439 140 L 439 162" fill="none" stroke="#888888" stroke-width="2"/>
  <path d="M 235 162 L 645 162" fill="none" stroke="#888888" stroke-width="2"/>
  <line x1="235" y1="162" x2="235" y2="184" stroke="#888888" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="645" y1="162" x2="645" y2="184" stroke="#888888" stroke-width="2" marker-end="url(#arrGray)"/>

  <rect x="60" y="184" width="350" height="172" rx="10" fill="#101418" stroke="#e05555" stroke-width="1.5"/>
  <text x="235" y="214" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">놓치는 쪽</text>
  <text x="235" y="240" font-size="13" fill="#888" text-anchor="middle">재현율 0.8</text>
  <text x="235" y="284" font-size="28" font-weight="700" fill="#e05555" text-anchor="middle">400건</text>
  <text x="235" y="312" font-size="12" fill="#888" text-anchor="middle">위반인데 그대로 나간다</text>
  <text x="235" y="336" font-size="12" fill="#888" text-anchor="middle">2,000건 × (1 − 0.8)</text>

  <rect x="470" y="184" width="350" height="172" rx="10" fill="#101418" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="645" y="214" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">잘못 막는 쪽</text>
  <text x="645" y="240" font-size="13" fill="#888" text-anchor="middle">정밀도 0.95</text>
  <text x="645" y="284" font-size="28" font-weight="700" fill="#7ec8e3" text-anchor="middle">84명</text>
  <text x="645" y="312" font-size="12" fill="#888" text-anchor="middle">정상인데 막힌다 — 198,000건의 0.04%</text>
  <text x="645" y="336" font-size="12" fill="#888" text-anchor="middle">차단 1,684건 − 잡은 1,600건</text>

  <line x1="414" y1="270" x2="466" y2="270" stroke="#888888" stroke-width="2" marker-start="url(#arrGrayBack)" marker-end="url(#arrGray)"/>

  <text x="60" y="390" font-size="13" fill="#888">임계값을 움직이면 한쪽이 줄고 다른 쪽이 는다 — 비율로만 보면 이 저울이 안 보인다.</text>
</svg>
