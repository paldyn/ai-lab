  <path d="M 657 255 L 618 278" stroke="#444" stroke-width="1"/>

  <text x="60" y="300" font-size="13" fill="#888">차의 차</text>
  <text x="280" y="300" font-size="18" font-weight="600" fill="#55c555" text-anchor="middle">2</text>
  <text x="390" y="300" font-size="18" font-weight="600" fill="#55c555" text-anchor="middle">2</text>
  <text x="500" y="300" font-size="18" font-weight="600" fill="#55c555" text-anchor="middle">2</text>
  <text x="610" y="300" font-size="18" font-weight="600" fill="#55c555" text-anchor="middle">2</text>
  <text x="700" y="300" font-size="13" fill="#55c555">← 전부 같다</text>

  <text x="60" y="334" font-size="14" fill="#7777cc">차가 일정하면 일차식, 차의 차가 일정하면 이차식 — x 를 일정한 간격으로 넣었을 때만 성립한다</text>
