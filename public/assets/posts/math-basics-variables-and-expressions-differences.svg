  <text x="60" y="243" font-size="13" fill="#888">차</text>
  <text x="225" y="243" font-size="18" font-weight="600" fill="#7777cc" text-anchor="middle">−5</text>
  <text x="335" y="243" font-size="18" font-weight="600" fill="#7777cc" text-anchor="middle">−3</text>
  <text x="445" y="243" font-size="18" font-weight="600" fill="#7777cc" text-anchor="middle">−1</text>
  <text x="555" y="243" font-size="18" font-weight="600" fill="#7777cc" text-anchor="middle">1</text>
  <text x="665" y="243" font-size="18" font-weight="600" fill="#7777cc" text-anchor="middle">3</text>

  <path d="M 233 255 L 272 278" stroke="#444" stroke-width="1"/>
