<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="cu-a1" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"><animate attributeName="fill" values="#7777cc;#7777cc;#55c555;#55c555;#7777cc;#7777cc" keyTimes="0;0.147;0.167;0.25;0.26;1" dur="6s" repeatCount="indefinite"/></path>
    </marker>
    <marker id="cu-a2" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"><animate attributeName="fill" values="#7777cc;#7777cc;#55c555;#55c555;#7777cc;#7777cc" keyTimes="0;0.397;0.417;0.5;0.51;1" dur="6s" repeatCount="indefinite"/></path>
    </marker>
    <marker id="cu-a3" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"><animate attributeName="fill" values="#7777cc;#7777cc;#55c555;#55c555;#7777cc;#7777cc" keyTimes="0;0.647;0.667;0.75;0.76;1" dur="6s" repeatCount="indefinite"/></path>
    </marker>
    <marker id="cu-a4" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"><animate attributeName="fill" values="#7777cc;#7777cc;#55c555;#55c555;#7777cc;#7777cc" keyTimes="0;0.897;0.917;0.98;0.99;1" dur="6s" repeatCount="indefinite"/></path>
    </marker>
  </defs>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">화면을 찍고, 정하고, 누르고, 다시 찍는다</text>
  <text x="60" y="72" font-size="13" fill="#888">사람이 화면을 쓰는 방식을 그대로 흉내 낸다. 한 바퀴가 몇 초씩 걸리고, 그 바퀴를 수십 번 돈다.</text>
  <rect x="170" y="110" width="200" height="70" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5">
    <animate attributeName="stroke" values="#55c555;#55c555;#3a4a6e;#3a4a6e" keyTimes="0;0.167;0.187;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="270" y="132" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">① 화면을 찍는다</text>
  <text x="270" y="150" font-size="11" fill="#888" text-anchor="middle">지금 무엇이 떠 있는지</text>
  <text x="270" y="168" font-size="11" fill="#888" text-anchor="middle">스크린샷 한 장</text>
  <rect x="510" y="110" width="200" height="70" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a4a6e;#3a4a6e;#55c555;#55c555;#3a4a6e;#3a4a6e" keyTimes="0;0.230;0.25;0.417;0.437;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="610" y="132" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">② 무엇을 할지 정한다</text>
  <text x="610" y="150" font-size="11" fill="#888" text-anchor="middle">목표와 화면을 견주어</text>
  <text x="610" y="168" font-size="11" fill="#888" text-anchor="middle">다음 한 동작을 고른다</text>
  <rect x="510" y="250" width="200" height="70" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a4a6e;#3a4a6e;#55c555;#55c555;#3a4a6e;#3a4a6e" keyTimes="0;0.480;0.5;0.667;0.687;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="610" y="272" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">③ 클릭·입력을 보낸다</text>
  <text x="610" y="290" font-size="11" fill="#888" text-anchor="middle">좌표나 요소를 지정해</text>
  <text x="610" y="308" font-size="11" fill="#888" text-anchor="middle">마우스·키보드로</text>
  <rect x="170" y="250" width="200" height="70" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a4a6e;#3a4a6e;#55c555;#55c555;#3a4a6e;#3a4a6e" keyTimes="0;0.730;0.75;0.917;0.937;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="270" y="272" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">④ 바뀐 화면을 본다</text>
  <text x="270" y="290" font-size="11" fill="#888" text-anchor="middle">의도한 대로 됐는지</text>
  <text x="270" y="308" font-size="11" fill="#888" text-anchor="middle">안 됐으면 다시 정한다</text>
  <line x1="372" y1="145" x2="506" y2="145" stroke="#7777cc" stroke-width="2" marker-end="url(#cu-a1)">
    <animate attributeName="stroke" values="#7777cc;#7777cc;#55c555;#55c555;#7777cc;#7777cc" keyTimes="0;0.147;0.167;0.25;0.260;1" dur="6s" repeatCount="indefinite"/>
  </line>
  <line x1="610" y1="182" x2="610" y2="248" stroke="#7777cc" stroke-width="2" marker-end="url(#cu-a2)">
    <animate attributeName="stroke" values="#7777cc;#7777cc;#55c555;#55c555;#7777cc;#7777cc" keyTimes="0;0.397;0.417;0.5;0.510;1" dur="6s" repeatCount="indefinite"/>
  </line>
  <line x1="508" y1="285" x2="374" y2="285" stroke="#7777cc" stroke-width="2" marker-end="url(#cu-a3)">
    <animate attributeName="stroke" values="#7777cc;#7777cc;#55c555;#55c555;#7777cc;#7777cc" keyTimes="0;0.647;0.667;0.75;0.760;1" dur="6s" repeatCount="indefinite"/>
  </line>
  <line x1="270" y1="248" x2="270" y2="182" stroke="#7777cc" stroke-width="2" marker-end="url(#cu-a4)">
    <animate attributeName="stroke" values="#7777cc;#7777cc;#55c555;#55c555;#7777cc;#7777cc" keyTimes="0;0.897;0.917;0.98;0.990;1" dur="6s" repeatCount="indefinite"/>
  </line>
  <text x="440" y="204" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">한 바퀴 3~8초</text>
  <text x="440" y="228" font-size="11.5" fill="#888" text-anchor="middle">스크린샷 한 장이 입력 1,000토큰 남짓</text>
  <text x="60" y="368" font-size="13" fill="#888">스무 걸음짜리 일이면 스크린샷을 스무 장 넣는다는 뜻이다. 걸음 수가 그대로 비용이 된다.</text>
  <text x="60" y="396" font-size="13" fill="#7ec8e3">④를 건너뛰면 못 눌린 버튼을 눌렀다고 믿고 다음으로 넘어간다 — 가장 흔한 실패가 여기서 난다.</text>
</svg>
