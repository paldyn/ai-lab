<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <defs>
    <marker id="ar" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/></marker>
    <marker id="ag" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="540" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">병렬로 묶어도 되는지 가르는 순서</text>
  <text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">세 물음 중 하나라도 「예」면 묶지 않는다</text>
  <rect x="60" y="100" width="460" height="60" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="84" y="125" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">뒤 호출이 앞 호출의 결과를 인자로 쓰나</text>
  <text x="84" y="145" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">사용자 조회 → 그 사용자의 주문 조회</text>
  <line x1="520" y1="130" x2="600" y2="130" stroke="#e05555" stroke-width="2" marker-end="url(#ar)"/>
  <text x="548" y="116" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">예</text>
  <rect x="600" y="100" width="220" height="60" rx="8" fill="#1a1010" stroke="#e05555" stroke-width="1.5"/>
  <text x="624" y="125" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">순차로 둔다</text>
  <text x="624" y="145" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">데이터 의존</text>
  <line x1="290" y1="160" x2="290" y2="210" stroke="#55c555" stroke-width="2" marker-end="url(#ag)"/>
  <text x="304" y="190" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">아니오</text>
  <rect x="60" y="210" width="460" height="60" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="84" y="235" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">앞이 실패하면 뒤를 하면 안 되나</text>
  <text x="84" y="255" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">결제 승인 + 포인트 적립</text>
  <line x1="520" y1="240" x2="600" y2="240" stroke="#e05555" stroke-width="2" marker-end="url(#ar)"/>
  <text x="548" y="226" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">예</text>
  <rect x="600" y="210" width="220" height="60" rx="8" fill="#1a1010" stroke="#e05555" stroke-width="1.5"/>
  <text x="624" y="235" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">순차로 둔다</text>
  <text x="624" y="255" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">실패 의존</text>
  <line x1="290" y1="270" x2="290" y2="320" stroke="#55c555" stroke-width="2" marker-end="url(#ag)"/>
  <text x="304" y="300" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">아니오</text>
  <rect x="60" y="320" width="460" height="60" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="84" y="345" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">순서가 바뀌면 결과의 의미가 바뀌나</text>
  <text x="84" y="365" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">재고 확인 → 주문 생성</text>
  <line x1="520" y1="350" x2="600" y2="350" stroke="#e05555" stroke-width="2" marker-end="url(#ar)"/>
  <text x="548" y="336" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">예</text>
  <rect x="600" y="320" width="220" height="60" rx="8" fill="#1a1010" stroke="#e05555" stroke-width="1.5"/>
  <text x="624" y="345" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">순차로 둔다</text>
  <text x="624" y="365" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">순서 의존</text>
  <line x1="290" y1="380" x2="290" y2="430" stroke="#55c555" stroke-width="2" marker-end="url(#ag)"/>
  <text x="304" y="410" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">아니오</text>
  <rect x="60" y="430" width="460" height="60" rx="8" fill="#101a10" stroke="#55c555" stroke-width="1.5"/>
  <text x="84" y="455" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">한 응답에 묶어 동시에 실행한다</text>
  <text x="84" y="475" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">쓰기 도구라면 멱등 키를 붙인 뒤에</text>
</svg>
