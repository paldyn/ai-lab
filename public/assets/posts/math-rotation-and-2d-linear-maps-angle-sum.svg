<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="asG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#666"/>
    </marker>
    <marker id="asS" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="asP" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">두 번 돌리면 각이 더해진다 — 덧셈정리는 행렬 항등식이다</text>

  <circle cx="270" cy="250" r="120" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="120" y1="250" x2="420" y2="250" stroke="#888" stroke-width="1.5"/>
  <line x1="270" y1="396" x2="270" y2="112" stroke="#888" stroke-width="1.5"/>
  <text x="414" y="272" font-size="13" fill="#888">x</text>
  <text x="252" y="122" font-size="13" fill="#888">y</text>

  <line x1="270" y1="250" x2="390" y2="250" stroke="#666" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#asG)"/>
  <line x1="270" y1="250" x2="374" y2="190" stroke="#55c555" stroke-width="2.5" marker-end="url(#asS)"/>
  <line x1="270" y1="250" x2="330" y2="146" stroke="#7777cc" stroke-width="2.5" marker-end="url(#asP)"/>

  <path d="M 330 250 A 60 60 0 0 0 322 220" fill="none" stroke="#55c555" stroke-width="2"/>
  <path d="M 344 208 A 85 85 0 0 0 313 176" fill="none" stroke="#7777cc" stroke-width="2"/>

  <text x="340" y="240" font-size="13" font-weight="600" fill="#55c555">β</text>
  <text x="316" y="196" font-size="13" font-weight="600" fill="#7777cc">α</text>

  <text x="398" y="244" font-size="13" fill="#666">시작</text>
  <text x="382" y="182" font-size="13" fill="#55c555">β만큼 돌린 뒤</text>
  <text x="242" y="132" font-size="13" fill="#7777cc">다시 α만큼</text>

  <text x="270" y="414" text-anchor="middle" font-size="13" fill="#888">α = β = 30도인 경우</text>

  <rect x="470" y="130" width="350" height="118" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="492" y="158" font-size="13" fill="#7ec8e3">R(α)R(β) 의 1열을 곱셈으로 구하면</text>
  <text x="492" y="188" font-size="14" font-weight="600" fill="#e8e8e8">cos α cos β − sin α sin β</text>
  <text x="492" y="214" font-size="14" font-weight="600" fill="#e8e8e8">sin α cos β + cos α sin β</text>
  <text x="492" y="238" font-size="13" fill="#9aa4b8">두 성분이 이렇게 나온다</text>

  <rect x="470" y="268" width="350" height="118" rx="8" fill="#0f1a10" stroke="#55c555" stroke-width="1.5"/>
  <text x="492" y="296" font-size="13" fill="#55c555">R(α+β) 의 1열은 정의상</text>
  <text x="492" y="326" font-size="14" font-weight="600" fill="#e8e8e8">cos(α + β)</text>
  <text x="492" y="352" font-size="14" font-weight="600" fill="#e8e8e8">sin(α + β)</text>
  <text x="492" y="376" font-size="13" fill="#9aa4b8">둘이 같아야 하므로 덧셈정리가 나온다</text>
</svg>
