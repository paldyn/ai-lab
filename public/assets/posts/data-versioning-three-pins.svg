<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="dvArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="372" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">셋 중 하나만 안 고정돼도 재현은 안 된다</text>
  <text x="62" y="68" font-size="13" fill="#888">코드만 태그를 붙이는 팀이 많다. 그러면 반년 뒤에 같은 명령이 다른 모델을 만든다.</text>

  <rect x="62" y="100" width="250" height="62" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
