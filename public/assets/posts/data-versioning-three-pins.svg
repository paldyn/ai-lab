  <text x="82" y="146" font-size="12" fill="#b5cea8" font-family="'JetBrains Mono','Menlo','Consolas',monospace">git rev 9c4a1f2</text>

  <rect x="62" y="178" width="250" height="62" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="82" y="203" font-size="15" font-weight="600" fill="#e8e8e8">데이터셋 버전</text>
  <text x="82" y="224" font-size="12" fill="#b5cea8" font-family="'JetBrains Mono','Menlo','Consolas',monospace">md5 8f3a1c...d92b</text>

  <rect x="62" y="256" width="250" height="62" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="82" y="281" font-size="15" font-weight="600" fill="#e8e8e8">설정과 난수 시드</text>
  <text x="82" y="302" font-size="12" fill="#b5cea8" font-family="'JetBrains Mono','Menlo','Consolas',monospace">params.yaml, seed 42</text>

  <path d="M 312 131 C 350 131, 356 190, 392 190" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#dvArr)"/>
  <path d="M 312 209 L 392 209" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#dvArr)"/>
  <path d="M 312 287 C 350 287, 356 228, 392 228" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#dvArr)"/>

  <rect x="392" y="170" width="200" height="78" rx="10" fill="#12242c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="412" y="194" font-size="15" font-weight="600" fill="#7ec8e3">실행 기록</text>
  <text x="412" y="214" font-size="12" fill="#9aa4b8">이 셋이 모두 고정돼야</text>
  <text x="412" y="232" font-size="12" fill="#9aa4b8">같은 결과가 다시 나온다</text>

  <line x1="592" y1="209" x2="662" y2="209" stroke="#7ec8e3" stroke-width="2" marker-end="url(#dvArr)"/>

  <rect x="662" y="170" width="156" height="78" rx="10" fill="#14261a" stroke="#55c555" stroke-width="1.5"/>
  <text x="682" y="204" font-size="15" font-weight="600" fill="#55c555">모델 아티팩트</text>
  <text x="682" y="225" font-size="12" fill="#9aa4b8">재현 가능</text>

  <text x="62" y="352" font-size="12" fill="#888">데이터가 자리에서 조용히 바뀌면 코드 해시는 그대로인데 결과만 달라진다. 원인이 가장 안 보이는 형태다.</text>
