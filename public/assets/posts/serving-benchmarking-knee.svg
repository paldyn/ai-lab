<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">처리량과 지연은 한 곡선 위의 두 좌표다</text>
  <text x="60" y="72" font-size="13" fill="#888">부하를 조금씩 올리며 잰 결과. 점 하나가 부하 단계 하나다.</text>

  <line x1="130" y1="340" x2="820" y2="340" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="110" x2="130" y2="340" stroke="#333" stroke-width="1"/>
  <text x="130" y="368" font-size="12" fill="#888">낮음</text>
  <text x="820" y="368" font-size="12" fill="#888" text-anchor="end">높음 — 처리량(초당 요청)</text>
  <text x="60" y="106" font-size="12" fill="#888">P95 지연</text>

  <rect x="560" y="110" width="260" height="230" fill="#e05555" opacity="0.06"/>
  <line x1="560" y1="110" x2="560" y2="340" stroke="#666" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="560" y="102" font-size="12" fill="#e05555" text-anchor="middle">무릎</text>

  <path d="M 130 322 C 280 316, 420 300, 520 278 C 610 256, 672 208, 706 128" stroke="#55c555" stroke-width="2.5" fill="none"/>

  <circle cx="400" cy="302" r="6" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="400" y="282" font-size="12" fill="#7ec8e3" text-anchor="middle">운영점 A</text>
  <circle cx="672" cy="208" r="6" fill="#0a0a0a" stroke="#e05555" stroke-width="2.5"/>
  <text x="690" y="196" font-size="12" fill="#e05555">운영점 B</text>

  <text x="160" y="152" font-size="13" fill="#55c555">여유 구간</text>
  <text x="160" y="174" font-size="12" fill="#888">부하를 올려도 지연이 거의 그대로다.</text>
  <text x="160" y="194" font-size="12" fill="#888">여기서 잰 지연은 서버가 한가할 때의 값이다.</text>

  <text x="60" y="400" font-size="13" fill="#e8e8e8">「처리량 초당 40건」과 「P95 지연 900ms」를 따로 적으면 둘이 같은 점에서 나온 값인지 알 수 없다.</text>
  <text x="60" y="422" font-size="12" fill="#888">한 부하 단계에서 나온 값끼리 묶어 적는다 — 「부하 40 req/s에서 P95 900ms, GPU 이용률 82%」처럼.</text>
</svg>
