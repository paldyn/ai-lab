<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">기록이 먼저인가, 발송이 먼저인가</text>
  <text x="60" y="72" font-size="13" fill="#888">멱등으로 못 만드는 동작에서는 두 걸음의 순서가 어느 쪽 위험을 질지 정한다.</text>

  <text x="240" y="112" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">기록 먼저</text>
  <text x="640" y="112" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">발송 먼저</text>

  <rect x="100" y="130" width="280" height="44" rx="6" fill="#101418" stroke="#333333" stroke-width="1"/>
  <text x="240" y="157" font-size="13" fill="#e8e8e8" text-anchor="middle">① 작업 기록에 「보냄」을 적는다</text>
  <line x1="240" y1="174" x2="240" y2="204" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="100" y="204" width="280" height="44" rx="6" fill="#101418" stroke="#333333" stroke-width="1"/>
  <text x="240" y="231" font-size="13" fill="#e8e8e8" text-anchor="middle">② 메일을 보낸다</text>
  <line x1="240" y1="248" x2="240" y2="278" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="100" y="278" width="280" height="44" rx="6" fill="#101418" stroke="#333333" stroke-width="1"/>
  <text x="240" y="305" font-size="13" fill="#e8e8e8" text-anchor="middle">③ 「완료」를 적는다</text>

  <rect x="500" y="130" width="280" height="44" rx="6" fill="#101418" stroke="#333333" stroke-width="1"/>
  <text x="640" y="157" font-size="13" fill="#e8e8e8" text-anchor="middle">① 메일을 보낸다</text>
  <line x1="640" y1="174" x2="640" y2="204" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="500" y="204" width="280" height="44" rx="6" fill="#101418" stroke="#333333" stroke-width="1"/>
  <text x="640" y="231" font-size="13" fill="#e8e8e8" text-anchor="middle">② 작업 기록에 「보냄」을 적는다</text>

  <line x1="256" y1="181" x2="270" y2="195" stroke="#e05555" stroke-width="3"/>
  <line x1="270" y1="181" x2="256" y2="195" stroke="#e05555" stroke-width="3"/>
  <line x1="656" y1="181" x2="670" y2="195" stroke="#e05555" stroke-width="3"/>
  <line x1="670" y1="181" x2="656" y2="195" stroke="#e05555" stroke-width="3"/>

  <rect x="60" y="350" width="360" height="78" rx="8" fill="#101418" stroke="#e05555" stroke-width="1"/>
  <text x="84" y="374" font-size="13" fill="#e05555">①과 ② 사이에서 죽으면</text>
  <text x="84" y="394" font-size="13" fill="#e8e8e8">재개는 「보냄」을 보고 건너뛴다</text>
  <text x="84" y="414" font-size="13" font-weight="600" fill="#7ec8e3">→ 한 번도 안 보낸다(누락)</text>

  <rect x="460" y="350" width="360" height="78" rx="8" fill="#101418" stroke="#e05555" stroke-width="1"/>
  <text x="484" y="374" font-size="13" fill="#e05555">①과 ② 사이에서 죽으면</text>
  <text x="484" y="394" font-size="13" fill="#e8e8e8">재개는 기록이 없어 다시 보낸다</text>
  <text x="484" y="414" font-size="13" font-weight="600" fill="#7ec8e3">→ 두 번 보낸다(중복)</text>

  <text x="60" y="466" font-size="13" fill="#7ec8e3">누락은 나중에 발송 기록과 대조해 메울 수 있지만, 중복은 받은 사람에게서 되돌릴 수 없다.</text>
</svg>
