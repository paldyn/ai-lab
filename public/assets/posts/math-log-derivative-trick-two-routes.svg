<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="trA" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="trB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">그래디언트를 얻는 두 길</text>

  <text x="50" y="98" font-size="16" font-weight="600" fill="#7ec8e3">점수 함수 추정량</text>
  <text x="470" y="98" font-size="16" font-weight="600" fill="#7777cc">재매개변수화 트릭</text>

  <rect x="50" y="116" width="360" height="60" rx="8" fill="#12161f" stroke="#3a4a6e" stroke-width="1"/>
  <text x="74" y="140" font-size="14" fill="#e8e8e8">pθ 에서 x 를 뽑는다</text>
  <text x="74" y="160" font-size="13" fill="#888">뽑는 분포 자체가 θ에 의존한다</text>

  <line x1="230" y1="176" x2="230" y2="204" stroke="#7ec8e3" stroke-width="2" marker-end="url(#trA)"/>

  <rect x="50" y="204" width="360" height="60" rx="8" fill="#12161f" stroke="#3a4a6e" stroke-width="1"/>
  <text x="74" y="228" font-size="14" fill="#e8e8e8">채점자에게서 f(x) 값 하나만 받는다</text>
  <text x="74" y="248" font-size="13" fill="#888">f 를 미분하지 않는다</text>

  <line x1="230" y1="264" x2="230" y2="292" stroke="#7ec8e3" stroke-width="2" marker-end="url(#trA)"/>

  <rect x="50" y="292" width="360" height="60" rx="8" fill="#12161f" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="74" y="316" font-size="14" fill="#e8e8e8">f(x) · ∇θ log pθ(x) 를 평균 낸다</text>
  <text x="74" y="336" font-size="13" fill="#e05555">불편이지만 분산이 크다</text>

  <rect x="470" y="116" width="360" height="60" rx="8" fill="#12161f" stroke="#3a4a6e" stroke-width="1"/>
  <text x="494" y="140" font-size="14" fill="#e8e8e8">ε ~ N(0, 1) 을 뽑는다</text>
  <text x="494" y="160" font-size="13" fill="#888">뽑는 분포가 θ와 무관하다</text>

  <line x1="650" y1="176" x2="650" y2="204" stroke="#7777cc" stroke-width="2" marker-end="url(#trB)"/>

  <rect x="470" y="204" width="360" height="60" rx="8" fill="#12161f" stroke="#3a4a6e" stroke-width="1"/>
  <text x="494" y="228" font-size="14" fill="#e8e8e8">x = μθ + σθ · ε 로 x 를 만든다</text>
  <text x="494" y="248" font-size="13" fill="#888">x 가 θ의 미분 가능한 함수다</text>

  <line x1="650" y1="264" x2="650" y2="292" stroke="#7777cc" stroke-width="2" marker-end="url(#trB)"/>

  <rect x="470" y="292" width="360" height="60" rx="8" fill="#12161f" stroke="#7777cc" stroke-width="1.5"/>
  <text x="494" y="316" font-size="14" fill="#e8e8e8">f′(x) · ∇θ x 를 평균 낸다</text>
  <text x="494" y="336" font-size="13" fill="#55c555">분산이 훨씬 작다</text>

  <rect x="50" y="382" width="780" height="62" rx="8" fill="#000000" stroke="#e05555" stroke-width="1.5"/>
  <text x="76" y="406" font-size="14" font-weight="600" fill="#e05555">언어모델이 왼쪽 길에 갇혀 있는 이유</text>
  <text x="76" y="428" font-size="13" fill="#888">토큰은 이산이라 θ의 미분 가능한 함수로 적을 수 없고, 채점자도 미분 가능하다는 보장이 없다.</text>
</svg>
