  <text x="84" y="352" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">단위를 굵게 만드는 이유</text>
  <text x="84" y="374" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">이웃한 값이 서로 비슷하면 하나를 꺼도 옆에서 메운다. 끊기려면 함께 묶인 단위를 통째로 꺼야 한다</text>
