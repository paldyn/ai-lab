  <text x="60" y="52" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">무엇을 끄는가 — 단위 셋</text>
  <text x="60" y="80" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">붉은 칸이 이번 스텝에 0이 되는 자리다. 단위가 굵어질수록 옆자리가 대신 메우기 어려워진다</text>

  <text x="60" y="126" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">Dropout — 원소</text>
