<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="460" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="br" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="22" font-weight="700" fill="#e8e8e8">ax = b 는 a와 b가 0인지로 세 갈래가 된다</text>
  <text x="60" y="78" font-size="13" fill="#888">다섯 걸음의 4번까지 가면 모든 일차방정식이 이 한 줄이 된다</text>

  <rect x="340" y="104" width="200" height="60" rx="8" fill="#7777cc" fill-opacity="0.12" stroke="#7777cc" stroke-width="1.5"/>
  <text x="440" y="140" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">ax = b</text>

  <line x1="380" y1="164" x2="170" y2="270" stroke="#7777cc" stroke-width="2" marker-end="url(#br)"/>
  <text x="266" y="206" font-size="14" font-weight="600" fill="#55c555" text-anchor="end">a ≠ 0</text>
  <line x1="440" y1="164" x2="440" y2="270" stroke="#7777cc" stroke-width="2" marker-end="url(#br)"/>
  <text x="452" y="226" font-size="14" font-weight="600" fill="#e05555">a = 0, b ≠ 0</text>
  <line x1="500" y1="164" x2="710" y2="270" stroke="#7777cc" stroke-width="2" marker-end="url(#br)"/>
  <text x="624" y="206" font-size="14" font-weight="600" fill="#7ec8e3">a = 0, b = 0</text>

  <rect x="60" y="270" width="220" height="110" rx="8" fill="#55c555" fill-opacity="0.10" stroke="#55c555" stroke-width="1.5"/>
  <text x="170" y="304" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">해가 하나</text>
  <text x="170" y="330" font-size="15" fill="#55c555" text-anchor="middle">x = b ÷ a</text>
  <text x="170" y="356" font-size="13" fill="#888" text-anchor="middle">2x = 8 → x = 4</text>

  <rect x="330" y="270" width="220" height="110" rx="8" fill="#e05555" fill-opacity="0.10" stroke="#e05555" stroke-width="1.5"/>
  <text x="440" y="304" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">해가 없다</text>
  <text x="440" y="330" font-size="15" fill="#e05555" text-anchor="middle">0 = b 는 거짓</text>
  <text x="440" y="356" font-size="13" fill="#888" text-anchor="middle">2x+3 = 2x+7 → 0·x = 4</text>

  <rect x="600" y="270" width="220" height="110" rx="8" fill="#7ec8e3" fill-opacity="0.10" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="710" y="304" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">모든 수가 해</text>
  <text x="710" y="330" font-size="15" fill="#7ec8e3" text-anchor="middle">0 = 0 은 참</text>
  <text x="710" y="356" font-size="13" fill="#888" text-anchor="middle">3(x+1) = 3x+3 → 0·x = 0</text>

  <text x="60" y="420" font-size="15" fill="#e8e8e8">먼저 a를 본다 — 5x = 0 은 b가 0이어도 a가 0이 아니라서 해가 x = 0 하나다</text>
</svg>
