<svg xmlns="http://www.w3.org/2000/svg" width="880" height="564" viewBox="0 0 880 564" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="564" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">단위구 — 길이가 1인 점들의 모양</text>
  <text x="60" y="82" font-size="13" fill="#888">무엇을 길이라 부르느냐에 따라 같은 조건이 다른 도형을 만든다</text>

  <text x="200" y="124" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">L1</text>
  <text x="440" y="124" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">L2</text>
  <text x="680" y="124" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">L∞</text>

  <text x="200" y="150" font-size="13" fill="#888" text-anchor="middle">|x1| + |x2| = 1</text>
  <text x="440" y="150" font-size="13" fill="#888" text-anchor="middle">√(x1² + x2²) = 1</text>
  <text x="680" y="150" font-size="13" fill="#888" text-anchor="middle">max(|x1|, |x2|) = 1</text>

  <line x1="105" y1="280" x2="295" y2="280" stroke="#888" stroke-width="1.5"/>
  <line x1="200" y1="375" x2="200" y2="185" stroke="#888" stroke-width="1.5"/>
  <line x1="345" y1="280" x2="535" y2="280" stroke="#888" stroke-width="1.5"/>
  <line x1="440" y1="375" x2="440" y2="185" stroke="#888" stroke-width="1.5"/>
  <line x1="585" y1="280" x2="775" y2="280" stroke="#888" stroke-width="1.5"/>
  <line x1="680" y1="375" x2="680" y2="185" stroke="#888" stroke-width="1.5"/>

  <path d="M 255 280 L 200 225 L 145 280 L 200 335 Z" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="440" cy="280" r="55" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <rect x="625" y="225" width="110" height="110" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>

  <line x1="255" y1="276" x2="255" y2="284" stroke="#444" stroke-width="1"/>
  <line x1="495" y1="276" x2="495" y2="284" stroke="#444" stroke-width="1"/>
  <line x1="735" y1="276" x2="735" y2="284" stroke="#444" stroke-width="1"/>
  <text x="272" y="302" font-size="12" fill="#888">1</text>
  <text x="512" y="302" font-size="12" fill="#888">1</text>
  <text x="752" y="302" font-size="12" fill="#888">1</text>

  <text x="200" y="406" font-size="12" fill="#888" text-anchor="middle">축 위에 뾰족한 꼭짓점이 있다</text>
  <text x="440" y="406" font-size="12" fill="#888" text-anchor="middle">어느 방향이든 똑같이 둥글다</text>
  <text x="680" y="406" font-size="12" fill="#888" text-anchor="middle">대각선 방향으로 가장 멀리 간다</text>

  <rect x="60" y="436" width="760" height="68" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="462" font-size="13" font-weight="600" fill="#e8e8e8">셋 다 '길이가 1인 점 전부'를 그린 것이다</text>
  <text x="84" y="484" font-size="13" fill="#888">같은 벡터라도 노름마다 길이가 다르다 — 어떤 노름을 쓰는지가 곧 무엇을 벌할지를 정한다</text>
</svg>
