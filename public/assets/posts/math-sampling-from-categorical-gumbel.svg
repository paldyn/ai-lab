<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">로짓마다 Gumbel 잡음을 하나씩 더하고 가장 큰 것을 고르면, 그것이 정확히 softmax 표집이다.</text>
