<text x="210" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">왼쪽은 가파르고 오른쪽 꼬리가 길다</text>
<text x="210" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">G = −log(−log U),  U ~ Uniform(0,1)</text>
<rect x="470" y="130" width="350" height="62" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="490" y="156" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3" font-weight="600">① 로짓</text>
<text x="490" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">z  = [2.0, 1.0, -1.0]</text>
