<rect x="470" y="206" width="350" height="62" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="490" y="232" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc" font-weight="600">② Gumbel 잡음</text>
<text x="490" y="254" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">G  = [0.3, 1.6,  0.4]</text>
<line x1="645" y1="268" x2="645" y2="282" stroke="#888" stroke-width="2"/>
<rect x="470" y="282" width="350" height="62" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="490" y="308" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555" font-weight="600">③ 더한다</text>
<text x="490" y="330" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">z+G= [2.3, 2.6, -0.6]</text>
<line x1="645" y1="344" x2="645" y2="358" stroke="#888" stroke-width="2"/>
<rect x="470" y="358" width="350" height="62" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="490" y="384" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555" font-weight="600">④ argmax</text>
<text x="490" y="406" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">→ t₂ 를 뽑았다</text>
<text x="60" y="450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">1등이 아닌 t₂ 가 뽑힌 것이 정상이다 — 잡음이 매번 순위를 흔든다.</text>
</svg>
