<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="320" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="cl-blue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="cl-red" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">지속 학습은 한 번의 학습이 아니라 도는 고리다</text>
  <text x="60" y="72" font-size="13" fill="#888">고리가 한 바퀴 도는 데 걸리는 시간이 곧 이 모델이 세상을 따라잡는 속도다.</text>

  <rect x="60" y="124" width="160" height="60" rx="6" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="140" y="148" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">로그 수집</text>
  <text x="140" y="168" font-size="11" fill="#aaaaaa" text-anchor="middle">요청과 응답 기록</text>
  <rect x="60" y="124" width="160" height="60" rx="6" fill="#7ec8e3" opacity="0">
    <animate attributeName="opacity" values="0.2;0.2;0;0" keyTimes="0;0.18;0.2;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <line x1="220" y1="154" x2="260" y2="154" stroke="#7ec8e3" stroke-width="2" marker-end="url(#cl-blue)"/>

  <rect x="260" y="124" width="160" height="60" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="340" y="148" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">데이터 선별</text>
  <text x="340" y="168" font-size="11" fill="#aaaaaa" text-anchor="middle">고칠 것만 고른다</text>
  <rect x="260" y="124" width="160" height="60" rx="6" fill="#7ec8e3" opacity="0">
    <animate attributeName="opacity" values="0;0;0.2;0.2;0;0" keyTimes="0;0.2;0.22;0.38;0.4;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <line x1="420" y1="154" x2="460" y2="154" stroke="#7ec8e3" stroke-width="2" marker-end="url(#cl-blue)"/>

  <rect x="460" y="124" width="160" height="60" rx="6" fill="#1a1a2e" stroke="#7777cc" stroke-width="1.5"/>
  <text x="540" y="148" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">학습</text>
  <text x="540" y="168" font-size="11" fill="#aaaaaa" text-anchor="middle">새 어댑터 하나</text>
  <rect x="460" y="124" width="160" height="60" rx="6" fill="#7ec8e3" opacity="0">
    <animate attributeName="opacity" values="0;0;0.2;0.2;0;0" keyTimes="0;0.4;0.42;0.58;0.6;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <line x1="620" y1="154" x2="660" y2="154" stroke="#7ec8e3" stroke-width="2" marker-end="url(#cl-blue)"/>

  <rect x="660" y="124" width="160" height="60" rx="6" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="740" y="148" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">평가와 배포</text>
  <text x="740" y="168" font-size="11" fill="#aaaaaa" text-anchor="middle">회귀부터 본다</text>
  <rect x="660" y="124" width="160" height="60" rx="6" fill="#7ec8e3" opacity="0">
    <animate attributeName="opacity" values="0;0;0.2;0.2;0;0" keyTimes="0;0.6;0.62;0.78;0.8;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <path d="M 740 184 L 740 232 L 140 232 L 140 184" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#cl-red)"/>
  <text x="440" y="254" font-size="12" fill="#e05555" text-anchor="middle">배포된 모델이 다시 로그를 만든다</text>

  <circle r="6" fill="#e05555" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.82;0.98;1" dur="5s" repeatCount="indefinite"/>
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1" keyTimes="0;0.8;1" path="M 740 184 L 740 232 L 140 232 L 140 184"/>
  </circle>

  <text x="60" y="294" font-size="13" fill="#e8e8e8">한 바퀴가 두 주면, 늘 두 주 전 세상에 맞춰진 모델을 쓰는 셈이다.</text>
</svg>
