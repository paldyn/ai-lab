<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="ttArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="ttAxis" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>

  <text x="62" y="44" font-size="22" font-weight="700" fill="#e8e8e8">테이블 원본 고정 — 복사냐 시점 조회냐</text>
  <text x="62" y="70" font-size="13" fill="#888">앞은 저장 비용을 치르고 확실함을 얻고, 뒤는 복사 없이 고정하는 대신 보존 기간에 묶인다.</text>

  <text x="62" y="106" font-size="14" font-weight="600" fill="#e8e8e8">파일 스냅숏 — 학습마다 결과를 파일로 떠서 해시로 고정한다</text>

  <rect x="62" y="120" width="140" height="56" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="80" y="144" font-size="13" font-weight="600" fill="#e8e8e8">1주차 파일</text>
  <text x="80" y="164" font-size="12" fill="#9aa4b8">전체 복사</text>

  <rect x="232" y="120" width="140" height="56" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="250" y="144" font-size="13" font-weight="600" fill="#e8e8e8">2주차 파일</text>
  <text x="250" y="164" font-size="12" fill="#9aa4b8">전체 복사</text>

  <rect x="402" y="120" width="140" height="56" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="420" y="144" font-size="13" font-weight="600" fill="#e8e8e8">3주차 파일</text>
  <text x="420" y="164" font-size="12" fill="#9aa4b8">전체 복사</text>

  <rect x="590" y="120" width="228" height="56" rx="10" fill="#1a1010" stroke="#6e3a3a" stroke-width="1.5"/>
  <text x="610" y="144" font-size="12" font-weight="600" fill="#e05555">행 하나만 달라져도</text>
  <text x="610" y="164" font-size="12" fill="#9aa4b8">다른 객체가 된다</text>

  <text x="62" y="204" font-size="12" fill="#888">그 시점의 바이트가 그대로 남으므로 상류가 어떻게 바뀌든 재현된다. 대가는 저장 비용이다.</text>

  <text x="62" y="244" font-size="14" font-weight="600" fill="#e8e8e8">테이블 시점 조회 — 스냅숏의 연속에 타임스탬프 하나를 적는다</text>

  <rect x="380" y="262" width="438" height="86" rx="10" fill="#12242c" stroke="#7ec8e3" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="400" y="284" font-size="12" font-weight="600" fill="#7ec8e3">보존 기간</text>

  <line x1="90" y1="316" x2="800" y2="316" stroke="#666666" stroke-width="2" marker-end="url(#ttAxis)"/>

  <circle cx="120" cy="316" r="6" fill="#333333" stroke="#555555" stroke-width="1.5"/>
  <circle cx="210" cy="316" r="6" fill="#333333" stroke="#555555" stroke-width="1.5"/>
  <circle cx="300" cy="316" r="6" fill="#333333" stroke="#555555" stroke-width="1.5"/>
  <circle cx="430" cy="316" r="6" fill="#7ec8e3"/>
  <circle cx="540" cy="316" r="6" fill="#7ec8e3"/>
  <circle cx="650" cy="316" r="8" fill="#55c555"/>
  <circle cx="760" cy="316" r="6" fill="#7ec8e3"/>

  <text x="90" y="346" font-size="11" fill="#888">유지 관리가 정리한 구간 — 읽을 수 없다</text>
  <text x="400" y="340" font-size="12" fill="#9aa4b8">이 안의 스냅숏만 다시 읽을 수 있다</text>

  <line x1="650" y1="384" x2="650" y2="330" stroke="#55c555" stroke-width="2" marker-end="url(#ttArr)"/>

  <rect x="62" y="384" width="258" height="58" rx="10" fill="#101820" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="82" y="408" font-size="12" fill="#9aa4b8">기록에 남기는 것은 한 줄</text>
  <text x="82" y="428" font-size="12" fill="#9aa4b8">데이터를 복사하지 않는다</text>

  <rect x="380" y="384" width="438" height="58" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="400" y="408" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> * </tspan><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> events</tspan></text>
  <text x="400" y="428" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">TIMESTAMP AS OF</tspan><tspan fill="#ce9178"> '2026-05-23 18:00:00'</tspan></text>
</svg>
