<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">점 하나로는 무엇을 가리키는지 정해지지 않는다</text>
  <text x="62" y="68" font-size="13" fill="#888">그래서 모델은 겹치는 답을 함께 내고 각각에 점수를 붙인다.</text>

  <text x="62" y="104" font-size="13" font-weight="600" fill="#e05555">① 여기를 눌렀다</text>
  <rect x="62" y="110" width="200" height="180" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <rect x="92" y="130" width="140" height="140" rx="18" fill="none" stroke="#7777cc" stroke-width="1.5"/>
  <rect x="110" y="175" width="104" height="62" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="140" y="192" width="36" height="28" rx="4" fill="none" stroke="#55c555" stroke-width="1.5"/>
  <circle cx="158" cy="206" r="5" fill="#e05555"/>

  <text x="300" y="104" font-size="13" font-weight="600" fill="#55c555">② 모델이 함께 내는 답들</text>

  <rect x="300" y="110" width="156" height="180" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="316" y="136" font-size="13" font-weight="600" fill="#e8e8e8">가장 좁게 — 주머니</text>
  <rect x="340" y="152" width="76" height="76" rx="10" fill="none" stroke="#444" stroke-width="1.2"/>
  <rect x="350" y="176" width="56" height="34" rx="4" fill="none" stroke="#444" stroke-width="1.2"/>
  <rect x="366" y="186" width="20" height="16" rx="3" fill="#55c555" opacity="0.6"/>
  <text x="316" y="272" font-size="11" fill="#9aa4b8">점수 0.91 · 넓이 아주 작음</text>

  <rect x="478" y="110" width="156" height="180" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="494" y="136" font-size="13" font-weight="600" fill="#e8e8e8">중간 — 셔츠</text>
  <rect x="518" y="152" width="76" height="76" rx="10" fill="none" stroke="#444" stroke-width="1.2"/>
  <rect x="528" y="176" width="56" height="34" rx="4" fill="#7ec8e3" opacity="0.5"/>
  <text x="494" y="272" font-size="11" fill="#9aa4b8">점수 0.88 · 넓이 중간</text>

  <rect x="656" y="110" width="156" height="180" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="672" y="136" font-size="13" font-weight="600" fill="#e8e8e8">가장 넓게 — 사람</text>
  <rect x="696" y="152" width="76" height="76" rx="10" fill="#7777cc" opacity="0.5"/>
  <text x="672" y="272" font-size="11" fill="#9aa4b8">점수 0.84 · 넓이 큼</text>

  <text x="62" y="326" font-size="12" fill="#9aa4b8">셋 중 무엇이 맞는지는 그림만 봐서는 정해지지 않는다 — 무엇을 하려는지가 정한다.</text>
  <text x="62" y="348" font-size="12" fill="#9aa4b8">그래서 점수 최고를 무조건 고르지 말고, 쓰임에 맞는 넓이 대역으로 한 번 거른다.</text>
  <text x="62" y="370" font-size="12" fill="#55c555">점을 하나 더 찍으면 모호함이 크게 준다 — 포함할 곳에 양수 점, 뺄 곳에 음수 점.</text>
</svg>
