<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<defs><marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker></defs>
<rect width="880" height="470" rx="12" fill="#0a0a0a"/>
<text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">순열 검정으로 임계값 얻기</text>
<rect x="70" y="80" width="340" height="104" rx="10" fill="#111827" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="94" y="114" font-size="16" font-weight="600" fill="#e8e8e8">① 합치기</text>
<text x="94" y="140" font-size="13" fill="#bbbbbb">지난달 1,000개와 이번 주 1,000개를</text>
<text x="94" y="162" font-size="13" fill="#bbbbbb">한 더미 2,000개로 · 그람 행렬은 한 번만</text>
<rect x="470" y="80" width="340" height="104" rx="10" fill="#111827" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="494" y="114" font-size="16" font-weight="600" fill="#e8e8e8">② 이름표 섞기</text>
<text x="494" y="140" font-size="13" fill="#bbbbbb">2,000개 가운데 1,000개를 무작위로 골라</text>
<text x="494" y="162" font-size="13" fill="#bbbbbb">「지난달」 이름표를 새로 붙인다</text>
<rect x="470" y="250" width="340" height="104" rx="10" fill="#111827" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="494" y="284" font-size="16" font-weight="600" fill="#e8e8e8">③ 다시 재기</text>
<text x="494" y="310" font-size="13" fill="#bbbbbb">섞은 이름표로 MMD²_u를 다시 계산</text>
<text x="494" y="332" font-size="13" fill="#bbbbbb">499번 되풀이한 값들이 귀무분포</text>
<rect x="70" y="250" width="340" height="104" rx="10" fill="#111827" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="94" y="284" font-size="16" font-weight="600" fill="#e8e8e8">④ 꼬리 세기</text>
<text x="94" y="310" font-size="13" fill="#bbbbbb">p = (1 + 관측값 이상인 개수) / (499 + 1)</text>
<text x="94" y="332" font-size="13" fill="#bbbbbb">σ = 0.15×중앙값에서 0개 → p = 0.002</text>
<line x1="410" y1="132" x2="470" y2="132" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
<line x1="640" y1="184" x2="640" y2="250" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
<line x1="470" y1="302" x2="410" y2="302" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
<text x="440" y="400" text-anchor="middle" font-size="13" fill="#888">두 분포가 같으면 원래 이름표는 섞은 이름표 499개와 바꿔 붙여도 구별되지 않는다</text>
<text x="440" y="424" text-anchor="middle" font-size="13" fill="#888">그래서 관측값의 순위가 500자리 가운데 고르게 놓이고, p ≤ α 일 확률이 α 이하다</text>
</svg>