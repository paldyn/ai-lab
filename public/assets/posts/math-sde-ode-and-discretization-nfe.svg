<text x="80" y="361" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e8e8e8">320</text>
<text x="240" y="361" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">1.24e−03</text>
<text x="470" y="361" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">9.21e−05</text>
<text x="700" y="361" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600" fill="#55c555">13.4배</text>
<text x="60" y="410" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">호출 20번에서는 오일러가 이긴다. 고차 solver의 이득은 스텝이 충분히 촘촘해진 뒤에야 나온다.</text>
