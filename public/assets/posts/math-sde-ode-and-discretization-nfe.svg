<text x="470" y="261" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">1.41e−03</text>
<text x="700" y="261" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600" fill="#55c555">3.4배</text>
<rect x="56" y="284" width="768" height="42" rx="8" fill="#111318" stroke="#2a2f3a" stroke-width="1"/>
