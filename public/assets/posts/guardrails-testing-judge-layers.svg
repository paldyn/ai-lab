<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="judgeFlow" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="judgeCheck" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="370" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">규칙으로 걸러낸 만큼 점수가 덜 흔들린다</text>
  <text x="60" y="72" font-size="13" fill="#888">형식이 정해진 것은 규칙이 판정하고, 뜻을 읽어야 하는 것만 모델로 넘긴다.</text>

  <rect x="60" y="118" width="180" height="76" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="150" y="150" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">응답</text>
  <text x="150" y="172" font-size="12" fill="#888" text-anchor="middle">세트를 돌린 결과</text>

  <rect x="300" y="118" width="250" height="76" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="425" y="142" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">규칙 판정</text>
  <text x="425" y="162" font-size="12" fill="#888" text-anchor="middle">거절 표현·도구 호출·스키마</text>
  <text x="425" y="180" font-size="12" fill="#55c555" text-anchor="middle">여기서 걸리면 모델을 안 부른다</text>

  <rect x="610" y="118" width="210" height="76" rx="8" fill="#101418" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="715" y="142" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">모델 판정</text>
  <text x="715" y="162" font-size="12" fill="#888" text-anchor="middle">뜻을 읽어야 하는 것</text>
  <text x="715" y="180" font-size="12" fill="#7ec8e3" text-anchor="middle">실행마다 흔들린다</text>

  <line x1="240" y1="156" x2="300" y2="156" stroke="#7ec8e3" stroke-width="2" marker-end="url(#judgeFlow)"/>
  <line x1="550" y1="156" x2="610" y2="156" stroke="#7ec8e3" stroke-width="2" marker-end="url(#judgeFlow)"/>
  <text x="270" y="142" font-size="11" fill="#888" text-anchor="middle">전부</text>
  <text x="580" y="142" font-size="11" fill="#888" text-anchor="middle">남은 것</text>

  <rect x="610" y="250" width="210" height="76" rx="8" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="715" y="274" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">사람 라벨 200건</text>
  <text x="715" y="294" font-size="12" fill="#888" text-anchor="middle">경계 사례를 섞어 뽑는다</text>
  <text x="715" y="312" font-size="12" fill="#7777cc" text-anchor="middle">치우친 방향을 함께 본다</text>

  <line x1="715" y1="250" x2="715" y2="194" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#judgeCheck)"/>
  <text x="733" y="226" font-size="13" fill="#888">정기 대조</text>

  <text x="60" y="272" font-size="13" fill="#e8e8e8">규칙으로 옮긴 만큼 점수의 분산이 준다.</text>
  <text x="60" y="296" font-size="13" fill="#888">판정기가 안 흔들리면 게이트 문턱을 그만큼 촘촘하게 잡을 수 있다.</text>
  <text x="60" y="320" font-size="13" fill="#888">다만 형식이 정해진 것에만 쓰고, 뜻을 읽어야 하는 판정은 모델로 넘긴다.</text>
</svg>
