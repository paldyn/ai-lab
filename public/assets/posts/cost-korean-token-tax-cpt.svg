  <rect x="300" y="154" width="355" height="18" fill="#55c555" rx="3"/>
  <text x="665" y="168" font-size="13" font-weight="600" fill="#55c555">2.15</text>

  <text x="284" y="200" font-size="13" fill="#888" text-anchor="end">intfloat/multilingual-e5-small</text>
  <rect x="300" y="188" width="295" height="18" fill="#7777cc" rx="3"/>
  <text x="605" y="202" font-size="13" fill="#9aa4b8">1.79</text>

