<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#0a0a0a" rx="12"/>

  <text x="60" y="52" font-size="22" font-weight="700" fill="#e8e8e8">한국어 설명문 366자의 자/토큰</text>
  <text x="60" y="76" font-size="13" fill="#888">클수록 싸다. 2.0자를 넘긴 둘은 모두 한국어를 따로 학습한 토크나이저다.</text>

  <!-- 눈금: x=300 이 0, 자/토큰 1.0 당 165px -->
  <line x1="300" y1="100" x2="300" y2="410" stroke="#333" stroke-width="1"/>
  <line x1="465" y1="100" x2="465" y2="410" stroke="#222" stroke-width="1"/>
  <line x1="795" y1="100" x2="795" y2="410" stroke="#222" stroke-width="1"/>
  <text x="300" y="428" font-size="12" fill="#666" text-anchor="middle">0</text>
  <text x="465" y="428" font-size="12" fill="#666" text-anchor="middle">1.0</text>
  <text x="630" y="428" font-size="12" fill="#666" text-anchor="middle">2.0</text>
  <text x="795" y="428" font-size="12" fill="#666" text-anchor="middle">3.0</text>

  <!-- 2.0 경계선 -->
  <line x1="630" y1="96" x2="630" y2="414" stroke="#55c555" stroke-width="2" stroke-dasharray="5,3"/>
