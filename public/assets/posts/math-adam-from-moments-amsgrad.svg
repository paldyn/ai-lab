<text x="60" y="444" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">β₂ = 0.9 의 창(10스텝)이 큰 그래디언트 사이 간격(100스텝)보다 짧아 v 가 그것을 잊는다.</text>
<text x="60" y="466" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">v 의 최댓값을 쥔 AMSGrad는 방향은 맞지만, 분모가 내려오지 못해 β₂ = 0.99 의 Adam보다도 두 배 느리다.</text>
