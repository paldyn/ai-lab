<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="410" rx="12" fill="#0a0a0a"/>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">같은 미분, 서로 전치된 두 배치</text>
  <text x="60" y="76" font-size="13" fill="#888">y 가 2개, x 가 3개일 때 ∂y/∂x 를 담는 표 — 무엇을 행에 두느냐만 다르다</text>

  <text x="90" y="126" font-size="16" font-weight="600" fill="#7ec8e3">분자 배치 · 분자 크기를 행에</text>
  <text x="90" y="148" font-size="13" fill="#888">모양 2 × 3</text>

  <rect x="90" y="164" width="270" height="96" rx="6" fill="#000000" stroke="#7ec8e3" stroke-width="1.5"/>
  <line x1="180" y1="164" x2="180" y2="260" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="270" y1="164" x2="270" y2="260" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="90" y1="212" x2="360" y2="212" stroke="#3a4a6e" stroke-width="1"/>
  <text x="135" y="194" font-size="13" fill="#ffffff" text-anchor="middle">∂y₁/∂x₁</text>
  <text x="225" y="194" font-size="13" fill="#ffffff" text-anchor="middle">∂y₁/∂x₂</text>
  <text x="315" y="194" font-size="13" fill="#ffffff" text-anchor="middle">∂y₁/∂x₃</text>
  <text x="135" y="242" font-size="13" fill="#ffffff" text-anchor="middle">∂y₂/∂x₁</text>
  <text x="225" y="242" font-size="13" fill="#ffffff" text-anchor="middle">∂y₂/∂x₂</text>
  <text x="315" y="242" font-size="13" fill="#ffffff" text-anchor="middle">∂y₂/∂x₃</text>

  <text x="520" y="126" font-size="16" font-weight="600" fill="#7777cc">분모 배치 · 분모 크기를 행에</text>
  <text x="520" y="148" font-size="13" fill="#888">모양 3 × 2</text>

  <rect x="520" y="164" width="180" height="144" rx="6" fill="#000000" stroke="#7777cc" stroke-width="1.5"/>
  <line x1="610" y1="164" x2="610" y2="308" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="520" y1="212" x2="700" y2="212" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="520" y1="260" x2="700" y2="260" stroke="#3a4a6e" stroke-width="1"/>
  <text x="565" y="194" font-size="13" fill="#ffffff" text-anchor="middle">∂y₁/∂x₁</text>
  <text x="655" y="194" font-size="13" fill="#ffffff" text-anchor="middle">∂y₂/∂x₁</text>
  <text x="565" y="242" font-size="13" fill="#ffffff" text-anchor="middle">∂y₁/∂x₂</text>
  <text x="655" y="242" font-size="13" fill="#ffffff" text-anchor="middle">∂y₂/∂x₂</text>
  <text x="565" y="290" font-size="13" fill="#ffffff" text-anchor="middle">∂y₁/∂x₃</text>
  <text x="655" y="290" font-size="13" fill="#ffffff" text-anchor="middle">∂y₂/∂x₃</text>

  <rect x="60" y="336" width="760" height="52" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="440" y="368" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">손실처럼 분자가 스칼라면 — 분자 배치는 1 × n 행벡터, 분모 배치는 n × 1 열벡터가 된다</text>
</svg>
