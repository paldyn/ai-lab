<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">비교 그래프의 연결과 오차</text>
  <text x="60" y="72" font-size="14" fill="#888">점은 답, 선은 실제로 비교한 쌍이다. 선이 없는 쌍의 점수차는 다른 선을 거쳐서만 정해진다.</text>

  <text x="60" y="112" font-size="16" font-weight="600" fill="#7ec8e3">끊어진 그래프</text>
  <line x1="110" y1="190" x2="220" y2="160" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="110" y1="190" x2="170" y2="280" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="220" y1="160" x2="170" y2="280" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="300" y1="200" x2="350" y2="290" stroke="#7777cc" stroke-width="2.5"/>
  <line x1="242" y1="171" x2="278" y2="189" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="268" y="224" font-size="16" font-weight="700" fill="#e05555" text-anchor="middle">?</text>
  <circle cx="110" cy="190" r="22" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2"/>
  <circle cx="220" cy="160" r="22" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2"/>
  <circle cx="170" cy="280" r="22" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2"/>
  <circle cx="300" cy="200" r="22" fill="#0a0a0a" stroke="#7777cc" stroke-width="2"/>
  <circle cx="350" cy="290" r="22" fill="#0a0a0a" stroke="#7777cc" stroke-width="2"/>
  <text x="110" y="195" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">A</text>
  <text x="220" y="165" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">B</text>
  <text x="170" y="285" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">C</text>
  <text x="300" y="205" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">D</text>
  <text x="350" y="295" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">E</text>
  <text x="160" y="336" font-size="14" fill="#7ec8e3" text-anchor="middle">덩어리 1</text>
  <text x="330" y="336" font-size="14" fill="#7777cc" text-anchor="middle">덩어리 2</text>
  <text x="60" y="370" font-size="14" fill="#888">덩어리 2를 통째로 올려도 모든 비교가 그대로다.</text>

  <text x="480" y="112" font-size="16" font-weight="600" fill="#7777cc">사슬로 이어진 그래프</text>
  <line x1="520" y1="180" x2="650" y2="250" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="650" y1="250" x2="780" y2="180" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="542" y1="180" x2="758" y2="180" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="520" cy="180" r="22" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2"/>
  <circle cx="650" cy="250" r="22" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2"/>
  <circle cx="780" cy="180" r="22" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2"/>
  <text x="520" y="185" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">A</text>
  <text x="650" y="255" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">B</text>
  <text x="780" y="185" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">C</text>
  <text x="650" y="160" font-size="14" fill="#e05555" text-anchor="middle">직접 비교 없음</text>
  <text x="556" y="262" font-size="14" fill="#e8e8e8" text-anchor="middle">100번</text>
  <text x="556" y="284" font-size="13" fill="#888" text-anchor="middle">SE 0.20</text>
  <text x="744" y="262" font-size="14" fill="#e8e8e8" text-anchor="middle">100번</text>
  <text x="744" y="284" font-size="13" fill="#888" text-anchor="middle">SE 0.20</text>
  <text x="480" y="336" font-size="14" fill="#888">셋 다 비슷한 수준이라 각 쌍의 승률이 0.5 근처다.</text>

  <rect x="60" y="398" width="760" height="72" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="428" font-size="14" font-weight="600" fill="#e8e8e8">SE(A − C) ≈ √(0.2² + 0.2²) = 0.283</text>
  <text x="84" y="454" font-size="14" fill="#888">직접 100번 비교했다면 0.20이었을 오차가 사슬 한 칸을 건너며 1.4배가 된다.</text>
</svg>
