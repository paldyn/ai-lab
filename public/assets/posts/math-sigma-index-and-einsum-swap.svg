  <rect x="60" y="396" width="760" height="68" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="422" font-size="13" font-weight="600" fill="#e8e8e8">유한한 합에서는 훑는 순서가 값을 바꾸지 않는다</text>
