<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="dv" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">노이즈 예측의 한 줄에서 기울인 분포까지, 네 걸음</text>

  <rect x="60" y="80" width="760" height="66" rx="8" fill="#111" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="106" font-size="16" font-weight="600" fill="#e8e8e8">1. 코드가 하는 일</text>
  <text x="84" y="130" font-size="13" fill="#888">두 번 예측해 차이를 w배로 밀어 준다:  ε̃ = ε_uncond + w (ε_cond − ε_uncond)</text>

  <line x1="440" y1="146" x2="440" y2="174" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#dv)"/>

  <rect x="60" y="176" width="760" height="66" rx="8" fill="#111" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="202" font-size="16" font-weight="600" fill="#e8e8e8">2. 스코어로 바꿔 읽기</text>
  <text x="84" y="226" font-size="13" fill="#888">ε 와 스코어는 s = −ε / σ 로 비례한다. 양변을 −σ 로 나누면  s̃ = (1 − w) s_uncond + w s_cond</text>

  <line x1="440" y1="242" x2="440" y2="270" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#dv)"/>

  <rect x="60" y="272" width="760" height="66" rx="8" fill="#111" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="298" font-size="16" font-weight="600" fill="#e8e8e8">3. 로그를 씌워 되돌리기</text>
  <text x="84" y="322" font-size="13" fill="#888">스코어의 선형결합은 로그밀도의 선형결합이다:  s̃ = ∇ log [ p(x)^(1−w) · p(x|y)^w ]</text>

  <line x1="440" y1="338" x2="440" y2="366" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#dv)"/>

  <rect x="60" y="368" width="760" height="66" rx="8" fill="#000" stroke="#55c555" stroke-width="1.5"/>
  <text x="84" y="394" font-size="16" font-weight="600" fill="#55c555">4. 베이즈로 정리</text>
  <text x="84" y="418" font-size="13" fill="#e8e8e8">p(x|y)/p(x) = p(y|x)/p(y) 이므로  p̃(x|y) ∝ p(x) · p(y|x)^w  — 조건의 증거를 w제곱한 분포</text>
</svg>
