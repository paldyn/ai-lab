  <line x1="150" y1="412" x2="520" y2="412" stroke="#e0a055" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#thDrift)"/>

  <text x="60" y="452" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">막으면 안 되는 입력까지 골든셋에 넣어야 두 숫자를 함께 보면서 옮길 수 있다.</text>
