<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>
  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">꺾인 점에서는 접선이 하나로 안 정해진다</text>
  <text x="60" y="74" font-size="13" fill="#888">점선은 원점을 지나면서 그래프 아래에 놓이는 직선들 — 이 기울기 전체가 서브그래디언트입니다</text>

  <!-- Panel A: |x| -->
  <text x="105" y="120" font-size="16" font-weight="600" fill="#e8e8e8">f(x) = |x| · 기울기 −1에서 1까지</text>
  <line x1="90" y1="270" x2="400" y2="270" stroke="#888" stroke-width="1.5"/>
  <line x1="240" y1="350" x2="240" y2="140" stroke="#888" stroke-width="1.5"/>
  <text x="404" y="275" font-size="13" fill="#888">x</text>
  <text x="233" y="136" font-size="13" fill="#888">y</text>
  <line x1="150" y1="315" x2="330" y2="225" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="150" y1="225" x2="330" y2="315" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="150" y1="270" x2="330" y2="270" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <polyline points="105,135 240,270 375,135" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="240" cy="270" r="5" fill="#e8e8e8"/>
  <text x="105" y="380" font-size="13" fill="#888">좌우 기울기가 −1과 1로 달라 도함수가 없습니다</text>

  <!-- Panel B: ReLU -->
  <text x="505" y="120" font-size="16" font-weight="600" fill="#e8e8e8">ReLU · 기울기 0에서 1까지</text>
  <line x1="490" y1="270" x2="800" y2="270" stroke="#888" stroke-width="1.5"/>
  <line x1="640" y1="350" x2="640" y2="140" stroke="#888" stroke-width="1.5"/>
  <text x="804" y="275" font-size="13" fill="#888">x</text>
  <text x="633" y="136" font-size="13" fill="#888">y</text>
  <line x1="572.5" y1="337.5" x2="707.5" y2="202.5" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="572.5" y1="303.75" x2="707.5" y2="236.25" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="572.5" y1="270" x2="707.5" y2="270" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <polyline points="505,270 640,270 775,135" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="640" cy="270" r="5" fill="#e8e8e8"/>
  <text x="505" y="380" font-size="13" fill="#888">프레임워크는 이 중 하나를 골라 넣습니다 (보통 0)</text>
</svg>
