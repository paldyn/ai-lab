<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>
  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">글자 정확도가 높아도 그 값은 못 쓴다</text>
  <text x="62" y="68" font-size="13" fill="#888">한 글자가 곧 값인 필드에서는 지표를 바꿔야 한다.</text>

  <rect x="62" y="104" width="380" height="114" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="80" y="128" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">정답 </tspan><tspan fill="#ffffff">서울특별시 강남구 137</tspan></text>
  <text x="80" y="146" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">인식 </tspan><tspan fill="#ffffff">서울특별시 강남구 </tspan><tspan fill="#e05555">187</tspan></text>
  <text x="80" y="182" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">치환 1 · 전체 16글자</tspan></text>
  <text x="80" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#b5cea8">CER = 1 / 16 = 0.063</tspan></text>

  <rect x="502" y="142" width="316" height="62" rx="8" fill="#12151c" stroke="#55c555" stroke-width="1.5"/>
  <text x="524" y="166" font-size="13" font-weight="600" fill="#55c555">CER 6.3%</text>
  <text x="524" y="186" font-size="11" fill="#9aa4b8">글자 단위로는 거의 다 맞았다</text>

  <rect x="502" y="220" width="316" height="62" rx="8" fill="#12151c" stroke="#e05555" stroke-width="1.5"/>
  <text x="524" y="244" font-size="13" font-weight="600" fill="#e05555">필드 완전 일치 0%</text>
  <text x="524" y="264" font-size="11" fill="#9aa4b8">이 주소는 통째로 못 쓴다</text>

  <text x="62" y="256" font-size="12" fill="#9aa4b8">숫자 1과 7, 0과 O, 5와 S는</text>
  <text x="62" y="276" font-size="12" fill="#9aa4b8">모양이 가까워 가장 자주 바뀐다.</text>

  <text x="62" y="326" font-size="12" fill="#9aa4b8">CER은 모델을 고를 때 쓰고, 필드 완전 일치율은 자동화 비율을 정할 때 쓴다.</text>
  <text x="62" y="346" font-size="12" fill="#9aa4b8">주소·계좌번호·금액처럼 한 글자가 곧 값인 필드는 앞의 지표만으로 판단하지 않는다.</text>
</svg>
