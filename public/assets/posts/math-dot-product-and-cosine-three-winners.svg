<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="twQ" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="twC" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="404" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">같은 세 후보, 서로 다른 1등</text>
  <text x="60" y="70" font-size="13" fill="#888">질의 q = (1, 0) · 한 칸 = 1</text>

  <line x1="90" y1="300" x2="430" y2="300" stroke="#444" stroke-width="1"/>
  <line x1="110" y1="330" x2="110" y2="90" stroke="#444" stroke-width="1"/>
  <text x="436" y="305" font-size="13" fill="#888">x</text>
  <text x="104" y="84" font-size="13" fill="#888">y</text>

  <line x1="110" y1="300" x2="170" y2="300" stroke="#55c555" stroke-width="3" marker-end="url(#twQ)"/>
  <line x1="110" y1="300" x2="146" y2="252" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#twC)"/>
  <line x1="110" y1="300" x2="230" y2="300" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#twC)"/>
  <line x1="110" y1="300" x2="330" y2="80" stroke="#7ec8e3" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#twC)"/>

  <text x="160" y="330" font-size="13" font-weight="600" fill="#55c555">q</text>
  <text x="126" y="238" font-size="13" font-weight="600" fill="#e8e8e8">u = (0.6, 0.8)</text>
  <text x="242" y="292" font-size="13" font-weight="600" fill="#e8e8e8">v = (2, 0)</text>
  <text x="228" y="140" font-size="13" font-weight="600" fill="#e8e8e8">w = (10, 10)</text>
  <text x="228" y="160" font-size="13" fill="#888">길이 14.1 — 그림 밖까지</text>

  <text x="490" y="106" font-size="13" fill="#888">지표</text>
  <text x="646" y="106" text-anchor="middle" font-size="13" fill="#888">1등</text>
  <text x="726" y="106" text-anchor="middle" font-size="13" fill="#888">2등</text>
  <text x="806" y="106" text-anchor="middle" font-size="13" fill="#888">3등</text>

  <rect x="470" y="118" width="350" height="56" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="490" y="152" font-size="15" font-weight="600" fill="#e8e8e8">내적</text>
  <text x="646" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#55c555">w</text>
  <text x="726" y="152" text-anchor="middle" font-size="15" fill="#888">v</text>
  <text x="806" y="152" text-anchor="middle" font-size="15" fill="#888">u</text>

  <rect x="470" y="184" width="350" height="56" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="490" y="218" font-size="15" font-weight="600" fill="#e8e8e8">코사인</text>
  <text x="646" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#55c555">v</text>
  <text x="726" y="218" text-anchor="middle" font-size="15" fill="#888">w</text>
  <text x="806" y="218" text-anchor="middle" font-size="15" fill="#888">u</text>

  <rect x="470" y="250" width="350" height="56" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="490" y="284" font-size="15" font-weight="600" fill="#e8e8e8">L2 거리</text>
  <text x="646" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#55c555">u</text>
  <text x="726" y="284" text-anchor="middle" font-size="15" fill="#888">v</text>
  <text x="806" y="284" text-anchor="middle" font-size="15" fill="#888">w</text>

  <text x="470" y="340" font-size="13" fill="#e05555">1등이 셋 다 다르다 — 정규화하지 않았기 때문이다.</text>

  <rect x="60" y="356" width="760" height="34" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="84" y="378" font-size="13" fill="#e8e8e8">내적은 방향과 크기를 함께, 코사인은 방향만, L2 거리는 두 점이 떨어진 정도를 본다.</text>
</svg>
