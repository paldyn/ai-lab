<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<defs><marker id="ar" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/></marker></defs>
<rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>
<text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">바닥 0.2519는 봉우리별 표본 수의 차이에서 온다</text>
<text x="60" y="78" font-size="13" fill="#888">두 표본을 각각 정렬해 순위끼리 잇는다 — 막대는 순위 1부터 20,000까지</text>
<text x="60" y="136" font-size="16" font-weight="600" fill="#e8e8e8">학습에 쓴 x₁</text>
<rect x="60" y="150" width="381.0" height="44" rx="4" fill="#7ec8e3" fill-opacity="0.25" stroke="#7ec8e3" stroke-width="1.5"/>
<rect x="441.0" y="150" width="379.0" height="44" rx="4" fill="#55c555" fill-opacity="0.25" stroke="#55c555" stroke-width="1.5"/>
<text x="250.5" y="177" font-size="13" fill="#e8e8e8" text-anchor="middle">왼쪽 봉우리(−4 근처) 10,026개</text>
<text x="630.5" y="177" font-size="13" fill="#e8e8e8" text-anchor="middle">오른쪽 봉우리(+4 근처) 9,974개</text>
<text x="60" y="276" font-size="16" font-weight="600" fill="#e8e8e8">참값 표본</text>
<rect x="60" y="290" width="379.1" height="44" rx="4" fill="#7ec8e3" fill-opacity="0.25" stroke="#7ec8e3" stroke-width="1.5"/>
<rect x="439.1" y="290" width="380.9" height="44" rx="4" fill="#55c555" fill-opacity="0.25" stroke="#55c555" stroke-width="1.5"/>
<text x="249.6" y="317" font-size="13" fill="#e8e8e8" text-anchor="middle">왼쪽 봉우리(−4 근처) 9,977개</text>
<text x="629.6" y="317" font-size="13" fill="#e8e8e8" text-anchor="middle">오른쪽 봉우리(+4 근처) 10,023개</text>
<line x1="440.1" y1="194" x2="440.1" y2="290" stroke="#e05555" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="454.1" y="236" font-size="13" fill="#e05555">순위 9,978~10,026의 49쌍</text>
<text x="454.1" y="256" font-size="13" fill="#e05555">왼쪽 봉우리 점이 오른쪽 봉우리 점과 짝이 된다</text>
<rect x="60" y="364" width="760" height="70" rx="8" fill="none" stroke="#444" stroke-width="1"/>
<text x="84" y="393" font-size="13" fill="#e8e8e8">49쌍은 평균 5.1 떨어져 있어 W₂² = 0.0635의 99%를 낸다</text>
<text x="84" y="415" font-size="13" fill="#888">나머지 19,951쌍만 세면 W₂ = 0.0247 — 같은 봉우리 안의 어긋남은 작다</text>
</svg>