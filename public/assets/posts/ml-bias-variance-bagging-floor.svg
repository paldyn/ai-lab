<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>

  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">평균이 나누는 분산과 남는 바닥</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">트리가 독립이면 분산이 k분의 1로 줄지만, 상관이 만든 항은 k를 키워도 남는다</text>

  <!-- axes -->
  <line x1="100" y1="96" x2="100" y2="300" stroke="#555" stroke-width="1.5"/>
  <line x1="100" y1="300" x2="620" y2="300" stroke="#555" stroke-width="1.5"/>
  <polygon points="100,96 95,106 105,106" fill="#555"/>
  <polygon points="620,300 610,295 610,305" fill="#555"/>

  <text x="92" y="119" text-anchor="end" fill="#888" font-size="13">σ²</text>
  <text x="92" y="304" text-anchor="end" fill="#888" font-size="13">0</text>
  <text x="52" y="200" text-anchor="middle" fill="#888" font-size="13" transform="rotate(-90, 52, 200)">평균 예측의 분산</text>

  <!-- x ticks -->
  <line x1="120" y1="300" x2="120" y2="306" stroke="#555" stroke-width="1.5"/>
  <line x1="330" y1="300" x2="330" y2="306" stroke="#555" stroke-width="1.5"/>
  <line x1="590" y1="300" x2="590" y2="306" stroke="#555" stroke-width="1.5"/>
  <text x="120" y="320" text-anchor="middle" fill="#888" font-size="12">1</text>
  <text x="330" y="320" text-anchor="middle" fill="#888" font-size="12">10</text>
  <text x="590" y="320" text-anchor="middle" fill="#888" font-size="12">100</text>
  <text x="628" y="305" fill="#888" font-size="13">트리 개수 k</text>

  <!-- floor -->
  <line x1="120" y1="226" x2="620" y2="226" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" opacity="0.55"/>
  <text x="628" y="230" fill="#e05555" font-size="13">바닥 ρσ²</text>

  <!-- independent: sigma^2 / k -->
  <polyline points="120,115 165,208 200,238 255,263 330,282 410,291 510,296 590,298"
    fill="none" stroke="#55c555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- correlated: rho sigma^2 + (1-rho) sigma^2 / k -->
  <polyline points="120,115 165,171 200,189 255,204 330,215 410,220 510,224 590,225"
    fill="none" stroke="#e05555" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="120" cy="115" r="4" fill="#e8e8e8"/>

  <!-- legend -->
  <rect x="296" y="120" width="310" height="76" rx="6" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
  <line x1="310" y1="140" x2="348" y2="140" stroke="#55c555" stroke-width="2.5"/>
  <text x="358" y="145" fill="#e8e8e8" font-size="13">독립일 때 · σ²/k</text>
  <line x1="310" y1="176" x2="348" y2="176" stroke="#e05555" stroke-width="2.5"/>
  <text x="358" y="181" fill="#e8e8e8" font-size="13">상관이 있을 때 · ρσ² + (1−ρ)σ²/k</text>

  <!-- notes -->
  <rect x="50" y="350" width="360" height="80" rx="8" fill="#141414" stroke="#55c555" stroke-width="1.5"/>
  <text x="74" y="374" fill="#e8e8e8" font-size="13" font-weight="600">편향은 거의 그대로다</text>
  <text x="74" y="396" fill="#9aa4b8" font-size="12">각 트리가 불편에 가까우면 그 평균도 그렇다.</text>
  <text x="74" y="416" fill="#9aa4b8" font-size="12">아래로만 내려가는 흔치 않은 이동이다.</text>

  <rect x="470" y="350" width="360" height="80" rx="8" fill="#141414" stroke="#e05555" stroke-width="1.5"/>
  <text x="494" y="374" fill="#e8e8e8" font-size="13" font-weight="600">랜덤 포레스트가 ρ를 깎는다</text>
  <text x="494" y="396" fill="#9aa4b8" font-size="12">분기마다 특성의 일부만 보게 해서</text>
  <text x="494" y="416" fill="#9aa4b8" font-size="12">트리 사이의 상관을 억지로 낮춘다.</text>
</svg>
