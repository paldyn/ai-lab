<text x="60" y="376" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">재구성만 보면 q를 1로 밀고, KL만 보면 사전분포 0.3으로 끌어당긴다.</text>
<text x="60" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">사후분포는 정확히 그 줄다리기의 균형점이다.</text>
