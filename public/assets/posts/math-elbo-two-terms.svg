<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">ELBO = 재구성 − KL(q ‖ 사전분포). 두 항의 최적점이 다르고, 합의 최고점은 그 사이에 선다.</text>
