<path d="M 80 206 L 80 216 L 316 216 L 316 206" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="198.0" y="242" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">어텐션 투영 4d²</text>
<text x="198.0" y="264" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">67,108,864개 (약 6,711만)</text>
<path d="M 320 206 L 320 216 L 796 216 L 796 206" fill="none" stroke="#7777cc" stroke-width="1.5"/>
<text x="558.0" y="242" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">FFN 8d²</text>
<text x="558.0" y="264" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">134,217,728개 (약 1억 3,422만)</text>
<line x1="80" y1="294" x2="796" y2="294" stroke="#444" stroke-width="1"/>
<text x="440" y="330" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">블록 하나 = 12d² = 201,326,592개 (약 2억)</text>
<text x="440" y="354" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">편향 9d + 정규화 4d = 13d = 53,248개 → 블록의 0.026%라 버린다</text>
<text x="440" y="378" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">32층이면 12 × 32 × d² = 6,442,450,944개</text>
