<svg xmlns="http://www.w3.org/2000/svg" width="880" height="406" viewBox="0 0 880 406">
<rect width="880" height="406" rx="12" fill="#0a0a0a"/>
<text x="440" y="42" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">블록 하나의 파라미터는 12d²이고 그중 3분의 2가 FFN이다</text>
<text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">d = 4096 · 칸 하나가 d × d 행렬 하나 = 16,777,216개</text>
