<rect x="260" y="130" width="56" height="64" rx="6" fill="#7ec8e3" fill-opacity="0.25" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="288.0" y="167.0" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">W<tspan baseline-shift="sub" font-size="11">O</tspan></text>
<rect x="320" y="130" width="236" height="64" rx="6" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
