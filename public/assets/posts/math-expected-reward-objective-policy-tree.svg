<text x="398" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">입니다</text>
<text x="398" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8" text-anchor="middle">0.71</text>
<rect x="470" y="118" width="96" height="56" rx="8" fill="#111827" stroke="#55c555" stroke-width="1.5" opacity="1.0"/>
<text x="518" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">.</text>
<text x="518" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8" text-anchor="middle">0.88</text>
