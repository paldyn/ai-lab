<text x="230" y="312" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">π = 0.04 × 0.66 × 0.90 = 0.024</text>
<text x="640" y="260" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e05555">r = −1.0</text>
<text x="640" y="280" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">채점자가 준 점수</text>
<rect x="60" y="336" width="760" height="56" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1.5" opacity="1.0"/>
<text x="80" y="360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">π_θ(y | x) = Π_t π_θ(y_t | x, y_&lt;t)   —   θ 를 바꾸면 어떤 답이 얼마나 자주 나오는지가 바뀐다</text>
<text x="80" y="380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">라벨은 어디에도 없다. 있는 것은 답마다 붙는 점수 r 뿐이다.</text>
