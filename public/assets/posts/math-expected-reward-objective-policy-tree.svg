<line x1="326" y1="146" x2="346" y2="146" stroke="#55c555" stroke-width="2" marker-end="url(#pt1)"/>
<line x1="446" y1="146" x2="466" y2="146" stroke="#55c555" stroke-width="2" marker-end="url(#pt1)"/>
<text x="230" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">π = 0.62 × 0.71 × 0.88 = 0.387</text>
<text x="640" y="146" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#55c555">r = +0.9</text>
