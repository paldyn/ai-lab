<text x="60" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">언어모델은 이미 정책이다</text>
<text x="60" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">답 하나가 나올 확률은 토큰마다의 확률을 곱한 것이다 — 그 답 전체를 궤적이라 부른다</text>
