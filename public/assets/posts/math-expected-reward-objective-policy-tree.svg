<text x="278" y="276" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8" text-anchor="middle">0.04</text>
<rect x="350" y="232" width="96" height="56" rx="8" fill="#111827" stroke="#e05555" stroke-width="1.5" opacity="1.0"/>
<text x="398" y="256" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">입니다</text>
<text x="398" y="276" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8" text-anchor="middle">0.66</text>
<rect x="470" y="232" width="96" height="56" rx="8" fill="#111827" stroke="#e05555" stroke-width="1.5" opacity="1.0"/>
