  <text x="84" y="419" font-size="13" font-weight="600" fill="#e8e8e8">Σ(i≠j) M[i,j] = 전체 합 − 대각합 = 24 − 12 = 12</text>
  <text x="84" y="441" font-size="13" fill="#888">인과 어텐션의 j ≤ i, 대조학습 분모의 j ≠ i도 같은 꼴의 마스크다</text>
