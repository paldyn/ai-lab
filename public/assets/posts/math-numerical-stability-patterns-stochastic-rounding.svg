<text x="710.64" y="156" text-anchor="end" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#e8e8e8">0.9999</text>
<text x="440" y="232" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">매번 1로 돌아간다 — 1,000번 빼도 1.0에서 안 움직인다</text>
<text x="60" y="282" text-anchor="start" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">확률적 반올림</text>
