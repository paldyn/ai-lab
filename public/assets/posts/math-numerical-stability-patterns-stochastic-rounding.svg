<text x="440" y="42" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">확률적 반올림은 기댓값을 지킨다</text>
<text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">bf16 눈금 0.99609375와 1 사이의 0.9999 — 1에서 간격(2⁻⁸)의 2.56%만큼 떨어져 있다</text>
<text x="60" y="116" text-anchor="start" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">가장 가까운 눈금</text>
