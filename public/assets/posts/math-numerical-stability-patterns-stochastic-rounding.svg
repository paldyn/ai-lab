<text x="440" y="406" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">기댓값 0.0256 × 0.99609375 + 0.9744 × 1 = 0.9999 — 갱신이 평균으로 살아남는다</text>
