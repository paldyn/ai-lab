<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="hd" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>
  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">식 한 줄에 감춰진 넷</text>
  <text x="60" y="84" font-size="13" fill="#888">위의 둘은 식이 시작하기 전과 끝난 뒤에, 아래 둘은 식의 한가운데와 학습 단계에 붙는다</text>
  <rect x="60" y="110" width="340" height="84" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="135" font-size="15" font-weight="600" fill="#e8e8e8">① 가중치 행렬</text>
  <text x="84" y="157" font-size="13" fill="#e8e8e8">Q = XW_Q,  K = XW_K,  V = XW_V</text>
  <text x="84" y="177" font-size="13" fill="#888">식 앞 · 학습되는 숫자가 여기 있다 · 9번</text>
  <rect x="480" y="110" width="340" height="84" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="504" y="135" font-size="15" font-weight="600" fill="#e8e8e8">② 멀티헤드</text>
  <text x="504" y="157" font-size="13" fill="#e8e8e8">8번 돌려 이어 붙이고 W_O를 곱한다</text>
  <text x="504" y="177" font-size="13" fill="#888">dₖ = 512 / 8 = 64 · √dₖ = 8 · 10번</text>
  <rect x="60" y="240" width="760" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="440" y="280" font-size="22" font-weight="600" fill="#7ec8e3" text-anchor="middle" xml:space="preserve">softmax( QKᵀ / √dₖ <tspan fill="#e05555">+ M</tspan> ) V</text>
  <rect x="60" y="350" width="340" height="84" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="375" font-size="15" font-weight="600" fill="#e8e8e8">③ 마스킹</text>
  <text x="84" y="397" font-size="13" fill="#e8e8e8">softmax 전에 점수에 M을 더한다</text>
  <text x="84" y="417" font-size="13" fill="#888">미래 칸에 −∞ → 가중치 0 · 18번 · 71번</text>
  <rect x="480" y="350" width="340" height="84" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="504" y="375" font-size="15" font-weight="600" fill="#e8e8e8">④ 미분</text>
  <text x="504" y="397" font-size="13" fill="#e8e8e8">학습 때 ∂L/∂W_Q를 구한다</text>
  <text x="504" y="417" font-size="13" fill="#888">softmax의 야코비안 · 34번 · 41번</text>
  <line x1="230" y1="194" x2="230" y2="240" stroke="#7777cc" stroke-width="2" marker-end="url(#hd)"/>
  <line x1="230" y1="350" x2="230" y2="304" stroke="#7777cc" stroke-width="2" marker-end="url(#hd)"/>
  <line x1="650" y1="194" x2="650" y2="240" stroke="#7777cc" stroke-width="2" marker-end="url(#hd)"/>
  <line x1="650" y1="350" x2="650" y2="304" stroke="#7777cc" stroke-width="2" marker-end="url(#hd)"/>
</svg>
