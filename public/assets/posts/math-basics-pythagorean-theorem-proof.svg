<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="512" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">같은 정사각형을 두 가지 방법으로 채운다</text>
  <text x="60" y="82" font-size="13" fill="#888">양쪽 모두 똑같은 직각삼각형 넷을 썼으므로, 남은 넓이도 서로 같다</text>

  <rect x="90" y="130" width="240" height="240" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="90" y="130" width="90" height="90" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="180" y="220" width="150" height="150" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2"/>
  <polygon points="180,130 330,130 330,220" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
  <polygon points="180,130 330,220 180,220" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
  <polygon points="90,220 180,220 180,370" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
  <polygon points="90,220 180,370 90,370" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
  <text x="135" y="120" font-size="13" fill="#888" text-anchor="middle">a</text>
  <text x="255" y="120" font-size="13" fill="#888" text-anchor="middle">b</text>
  <text x="78" y="180" font-size="13" fill="#888" text-anchor="end">a</text>
  <text x="78" y="300" font-size="13" fill="#888" text-anchor="end">b</text>
  <text x="135" y="182" font-size="17" font-weight="700" fill="#7ec8e3" text-anchor="middle">a²</text>
  <text x="255" y="302" font-size="17" font-weight="700" fill="#7ec8e3" text-anchor="middle">b²</text>
  <text x="210" y="404" font-size="15" font-weight="600" fill="#7ec8e3" text-anchor="middle">남은 넓이 = a² + b²</text>

  <rect x="550" y="130" width="240" height="240" fill="none" stroke="#888" stroke-width="1.5"/>
  <polygon points="640,130 790,220 700,370 550,280" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2"/>
  <polygon points="550,130 640,130 550,280" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
  <polygon points="640,130 790,130 790,220" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
  <polygon points="790,220 790,370 700,370" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
  <polygon points="700,370 550,370 550,280" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
  <text x="595" y="120" font-size="13" fill="#888" text-anchor="middle">a</text>
  <text x="715" y="120" font-size="13" fill="#888" text-anchor="middle">b</text>
  <text x="802" y="180" font-size="13" fill="#888">a</text>
  <text x="802" y="300" font-size="13" fill="#888">b</text>
  <text x="670" y="256" font-size="17" font-weight="700" fill="#7ec8e3" text-anchor="middle">c²</text>
  <text x="736" y="168" font-size="13" fill="#e8e8e8">c</text>
  <text x="670" y="404" font-size="15" font-weight="600" fill="#7ec8e3" text-anchor="middle">남은 넓이 = c²</text>

  <text x="440" y="458" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">a² + b² = c²</text>
</svg>
