<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 440" style="display:block">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="12" fill="#0a0a0a"/>
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">순위로 합치기 (RRF, k = 60)</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">점수 대신 각 목록의 순위 r만 보고 1/(k + r)을 더한다</text>

  <rect x="60" y="100" width="200" height="170" rx="8" fill="#13261a" stroke="#55c555" stroke-width="1.5"/>
  <text x="160" y="132" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">텍스트 색인</text>
  <text x="84" y="170" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">1위  문서 A</text>
  <text x="84" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">2위  문서 D</text>
  <text x="84" y="226" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">3위  문서 B</text>
  <text x="84" y="254" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">점수 0.82 · 0.79 · 0.77</text>

  <rect x="60" y="300" width="200" height="110" rx="8" fill="#1a1a2e" stroke="#7777cc" stroke-width="1.5"/>
  <text x="160" y="332" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7777cc">이미지 색인</text>
  <text x="84" y="364" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">1위  문서 C</text>
  <text x="84" y="392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">4위  문서 A</text>

  <line x1="260" y1="185" x2="340" y2="230" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="260" y1="355" x2="340" y2="290" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="340" y="170" width="480" height="180" rx="8" fill="#10202a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="364" y="204" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3">합친 순위</text>
  <text x="364" y="238" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">1  문서 A   1/61 + 1/64 ≈ 0.0320</text>
  <text x="364" y="266" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">2  문서 C   1/61 ≈ 0.0164</text>
  <text x="364" y="294" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">3  문서 D   1/62 ≈ 0.0161</text>
  <text x="364" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">4  문서 B   1/63 ≈ 0.0159</text>
  <text x="580" y="388" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">두 목록이 함께 가리킨 A가 한쪽 1위인 C를 넉넉히 이긴다</text>
</svg>
