<text x="480.0" y="306.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">헤세 고윳값 4 — av 가 1에서 벗어나는 방향</text>
<text x="480.0" y="358.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">가중치 감쇠</text>
<text x="480.0" y="382.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">a² + v² = α² + 1/α² 이 가장 작은 (1, 1)을 고른다</text>
<text x="480.0" y="404.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">초록 점선은 a² + v² = 2 인 원</text>
