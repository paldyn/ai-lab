<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="grow" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">수는 안 되던 계산 하나를 되게 하려고 넓어졌다</text>
  <text x="60" y="82" font-size="13" fill="#888">바깥 상자가 안쪽을 통째로 품는다 — 정수는 유리수이고, 유리수는 실수다</text>

  <rect x="60" y="110" width="640" height="230" rx="8" fill="none" stroke="#55c555" stroke-width="2"/>
  <text x="80" y="136" font-size="15" font-weight="700" fill="#55c555">실수</text>

  <rect x="100" y="150" width="480" height="170" rx="8" fill="none" stroke="#7ec8e3" stroke-width="2"/>
  <text x="120" y="176" font-size="15" font-weight="700" fill="#7ec8e3">유리수</text>

  <rect x="140" y="190" width="320" height="110" rx="8" fill="none" stroke="#7777cc" stroke-width="2"/>
  <text x="160" y="216" font-size="15" font-weight="700" fill="#7777cc">정수</text>

  <rect x="180" y="230" width="200" height="50" rx="8" fill="#e8e8e8" fill-opacity="0.06" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="280" y="261" font-size="15" font-weight="700" fill="#e8e8e8" text-anchor="middle">자연수 &#160;1, 2, 3, …</text>

  <text x="480" y="252" font-size="13" fill="#7777cc">0 과 음수</text>
  <text x="480" y="272" font-size="13" fill="#7777cc">−1, −2, …</text>
  <text x="600" y="252" font-size="13" fill="#7ec8e3">두 정수의 비</text>
  <text x="600" y="272" font-size="13" fill="#7ec8e3">3/2, −0.25</text>
  <text x="600" y="176" font-size="13" fill="#55c555">무리수</text>
  <text x="600" y="196" font-size="13" fill="#55c555">√2, π</text>

  <path d="M 740 250 L 740 200" fill="none" stroke="#7777cc" stroke-width="2" marker-end="url(#grow)"/>
  <text x="760" y="200" font-size="13" fill="#888">빼기가 늘 되게 → 정수</text>
  <text x="760" y="240" font-size="13" fill="#888">나누기가 늘 되게 → 유리수</text>
  <text x="760" y="280" font-size="13" fill="#888">길이를 빠짐없이 → 실수</text>

  <text x="60" y="366" font-size="14" fill="#7777cc">실수는 수직선을 빈틈없이 채운다. 한 변이 1인 정사각형의 대각선처럼, 그릴 수는 있는데 분수로는 못 적는 길이가 무리수다</text>
</svg>
