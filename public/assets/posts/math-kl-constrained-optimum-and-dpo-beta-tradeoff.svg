<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">가격을 내리면 보상은 오르고 KL도 함께 오른다</text>
  <text x="60" y="72" font-size="14" fill="#888">β는 KL 1 단위의 가격이다. 가격을 정하면 예산이 따라 나온다.</text>

  <line x1="120" y1="340" x2="800" y2="340" stroke="#888" stroke-width="1.5"/>
  <line x1="120" y1="340" x2="120" y2="120" stroke="#888" stroke-width="1.5"/>
  <line x1="120" y1="120" x2="800" y2="120" stroke="#444" stroke-width="1"/>
  <line x1="120" y1="230" x2="800" y2="230" stroke="#444" stroke-width="1"/>
  <text x="88" y="125" font-size="13" fill="#888">1.0</text>
  <text x="88" y="235" font-size="13" fill="#888">0.5</text>
  <text x="88" y="345" font-size="13" fill="#888">0.0</text>

  <line x1="220" y1="340" x2="220" y2="348" stroke="#444" stroke-width="1"/>
  <line x1="400" y1="340" x2="400" y2="348" stroke="#444" stroke-width="1"/>
  <line x1="580" y1="340" x2="580" y2="348" stroke="#444" stroke-width="1"/>
  <line x1="760" y1="340" x2="760" y2="348" stroke="#444" stroke-width="1"/>
  <text x="204" y="368" font-size="14" fill="#e8e8e8">β = 2</text>
  <text x="384" y="368" font-size="14" fill="#e8e8e8">β = 1</text>
  <text x="556" y="368" font-size="14" fill="#e8e8e8">β = 0.5</text>
  <text x="732" y="368" font-size="14" fill="#e8e8e8">β = 0.25</text>

  <polyline points="220,216 400,177 580,139 760,123" fill="none" stroke="#55c555" stroke-width="2.5"/>
  <circle cx="220" cy="216" r="5" fill="#55c555"/>
  <circle cx="400" cy="177" r="5" fill="#55c555"/>
  <circle cx="580" cy="139" r="5" fill="#55c555"/>
  <circle cx="760" cy="123" r="5" fill="#55c555"/>
  <text x="186" y="204" font-size="13" fill="#55c555">0.564</text>
  <text x="366" y="165" font-size="13" fill="#55c555">0.742</text>
  <text x="546" y="127" font-size="13" fill="#55c555">0.912</text>
  <text x="712" y="115" font-size="13" fill="#55c555">0.989</text>

  <polyline points="220,326 400,298 580,245 760,200" fill="none" stroke="#e05555" stroke-width="2.5"/>
  <circle cx="220" cy="326" r="5" fill="#e05555"/>
  <circle cx="400" cy="298" r="5" fill="#e05555"/>
  <circle cx="580" cy="245" r="5" fill="#e05555"/>
  <circle cx="760" cy="200" r="5" fill="#e05555"/>
  <text x="168" y="318" font-size="13" fill="#e05555">0.063</text>
  <text x="348" y="290" font-size="13" fill="#e05555">0.192</text>
  <text x="520" y="232" font-size="13" fill="#e05555">0.432</text>
  <text x="764" y="186" font-size="13" fill="#e05555">0.638</text>

  <rect x="140" y="392" width="24" height="12" fill="#55c555"/>
  <text x="176" y="404" font-size="14" fill="#888">기대 보상 E[r]</text>
  <rect x="330" y="392" width="24" height="12" fill="#e05555"/>
  <text x="366" y="404" font-size="14" fill="#888">참조 모델과의 KL</text>
  <text x="560" y="404" font-size="13" fill="#888">가격을 8분의 1로 내리면 예산이 10배가 된다.</text>
</svg>
