<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="392" rx="12" fill="#0a0a0a"/>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">스레드를 늘리면 프리필만 빨라진다</text>
  <text x="62" y="72" font-size="13" fill="#888">스레드 2개일 때를 1로 둔 상대 속도. 디코드는 4개를 넘기면 거의 움직이지 않는다.</text>

  <line x1="150" y1="100" x2="820" y2="100" stroke="#222222" stroke-width="1"/>
  <line x1="150" y1="150" x2="820" y2="150" stroke="#222222" stroke-width="1"/>
  <line x1="150" y1="200" x2="820" y2="200" stroke="#222222" stroke-width="1"/>
  <line x1="150" y1="250" x2="820" y2="250" stroke="#222222" stroke-width="1"/>
  <line x1="150" y1="300" x2="820" y2="300" stroke="#444444" stroke-width="1.5"/>

  <text x="136" y="105" font-size="12" fill="#888" text-anchor="end">5.0×</text>
  <text x="136" y="155" font-size="12" fill="#888" text-anchor="end">4.0×</text>
  <text x="136" y="205" font-size="12" fill="#888" text-anchor="end">3.0×</text>
  <text x="136" y="255" font-size="12" fill="#888" text-anchor="end">2.0×</text>
  <text x="136" y="305" font-size="12" fill="#888" text-anchor="end">1.0×</text>

  <line x1="150" y1="100" x2="150" y2="300" stroke="#444444" stroke-width="1.5"/>

  <text x="150" y="326" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="373" y="326" font-size="12" fill="#888" text-anchor="middle">4</text>
  <text x="596" y="326" font-size="12" fill="#888" text-anchor="middle">8</text>
  <text x="820" y="326" font-size="12" fill="#888" text-anchor="middle">16</text>
  <text x="485" y="352" font-size="13" fill="#aaaaaa" text-anchor="middle">쓰는 스레드 수</text>

  <polyline points="150,300 373,255 596,180 820,130" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="150" cy="300" r="4" fill="#7ec8e3"/>
  <circle cx="373" cy="255" r="4" fill="#7ec8e3"/>
  <circle cx="596" cy="180" r="4" fill="#7ec8e3"/>
  <circle cx="820" cy="130" r="4" fill="#7ec8e3"/>
  <text x="806" y="116" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="end">프리필 — 계산이 병목</text>

  <polyline points="150,300 373,275 596,265 820,263" fill="none" stroke="#e05555" stroke-width="2.5"/>
  <circle cx="150" cy="300" r="4" fill="#e05555"/>
  <circle cx="373" cy="275" r="4" fill="#e05555"/>
  <circle cx="596" cy="265" r="4" fill="#e05555"/>
  <circle cx="820" cy="263" r="4" fill="#e05555"/>
  <text x="806" y="249" font-size="13" font-weight="600" fill="#e05555" text-anchor="end">디코드 — 대역폭이 병목</text>

  <text x="62" y="378" font-size="12" fill="#888">스레드를 물리 코어 수보다 많이 잡으면 두 선 모두 내려간다. 하이퍼스레드까지 세어 잡는 것이 흔한 실수다.</text>
</svg>
