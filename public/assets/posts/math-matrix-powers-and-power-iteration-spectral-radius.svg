<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">문턱은 정확히 1이다</text>
  <text x="60" y="70" font-size="13" fill="#888">세로축은 로그 눈금 — 한 칸이 10배다. 곧은 직선으로 보이는 것이 지수라는 증거다.</text>

  <line x1="90" y1="360" x2="90" y2="86" stroke="#888" stroke-width="1.5"/>
  <line x1="90" y1="225" x2="810" y2="225" stroke="#888" stroke-width="1.5"/>

