  <line x1="90" y1="315" x2="800" y2="315" stroke="#444" stroke-width="1"/>
  <line x1="90" y1="360" x2="800" y2="360" stroke="#444" stroke-width="1"/>

  <text x="80" y="95" font-size="13" fill="#888" text-anchor="end">1000</text>
