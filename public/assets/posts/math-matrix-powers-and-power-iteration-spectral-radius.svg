  <text x="80" y="230" font-size="13" fill="#888" text-anchor="end">1</text>
  <text x="80" y="320" font-size="13" fill="#888" text-anchor="end">0.01</text>
  <text x="80" y="365" font-size="13" fill="#888" text-anchor="end">0.001</text>

  <text x="828" y="366" font-size="13" fill="#888">k</text>
  <text x="90" y="386" font-size="13" fill="#888" text-anchor="middle">0</text>
  <text x="445" y="386" font-size="13" fill="#888" text-anchor="middle">15</text>
  <text x="800" y="386" font-size="13" fill="#888" text-anchor="middle">30</text>

  <polyline fill="none" stroke="#e05555" stroke-width="2.5"
            points="90.0,225.0 137.3,217.9 184.7,210.7 232.0,203.6 279.3,196.5 326.7,189.4 374.0,182.2 421.3,175.1 468.7,168.0 516.0,160.9 563.3,153.7 610.7,146.6 658.0,139.5 705.3,132.4 752.7,125.2 800.0,118.1"/>
  <text x="640" y="112" font-size="14" font-weight="600" fill="#e05555">ρ = 1.2 — 폭발</text>

