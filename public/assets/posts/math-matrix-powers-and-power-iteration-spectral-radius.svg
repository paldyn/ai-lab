  <rect x="60" y="400" width="760" height="34" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="82" y="422" font-size="14" fill="#e8e8e8">1.2와 0.8은 1에서 같은 거리인데, 30 스텝 뒤에는 237과 0.00124 — 19만 배가 갈린다.</text>
