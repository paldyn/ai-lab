<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">같은 400 km 오차, 전혀 다른 뜻</text>
  <text x="60" y="70" font-size="13" fill="#888">절대오차는 둘 다 400 km. 상대오차는 참값으로 나눈 값이라 갈린다.</text>

  <text x="60" y="120" font-size="16" font-weight="600" fill="#e8e8e8">지구 – 달   참값 384 400 km</text>
  <line x1="60" y1="150" x2="800" y2="150" stroke="#888" stroke-width="1.5"/>
  <line x1="60" y1="142" x2="60" y2="158" stroke="#888" stroke-width="1.5"/>
  <line x1="800" y1="142" x2="800" y2="158" stroke="#888" stroke-width="1.5"/>
  <rect x="799" y="140" width="1.6" height="20" fill="#e05555"/>
  <circle cx="800" cy="150" r="5" fill="#e8e8e8"/>
  <text x="60" y="180" font-size="13" fill="#888">0</text>
  <text x="800" y="180" text-anchor="middle" font-size="13" fill="#888">384 400</text>
  <text x="560" y="204" font-size="13" fill="#e05555">400 km 는 이 자 위에서 눈에 보이지도 않는다 · 상대오차 0.1 %</text>

  <text x="60" y="256" font-size="16" font-weight="600" fill="#e8e8e8">서울 – 부산   참값 400 km</text>
  <line x1="60" y1="286" x2="800" y2="286" stroke="#888" stroke-width="1.5"/>
  <line x1="60" y1="278" x2="60" y2="294" stroke="#888" stroke-width="1.5"/>
  <line x1="800" y1="278" x2="800" y2="294" stroke="#888" stroke-width="1.5"/>
  <rect x="60" y="276" width="740" height="20" fill="#e05555" fill-opacity="0.22"/>
  <circle cx="800" cy="286" r="5" fill="#e8e8e8"/>
  <text x="60" y="316" font-size="13" fill="#888">0</text>
  <text x="800" y="316" text-anchor="middle" font-size="13" fill="#888">400</text>
  <text x="240" y="340" font-size="13" fill="#e05555">400 km 는 자 전체와 같은 길이다 · 상대오차 100 %</text>

  <rect x="60" y="360" width="740" height="42" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="84" y="386" font-size="13" fill="#e8e8e8">크기가 아주 다른 것들을 한 줄에 놓고 견줄 때는 절대오차가 아니라 상대오차를 본다.</text>
</svg>
