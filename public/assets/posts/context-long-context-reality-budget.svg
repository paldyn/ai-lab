<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">같은 200K 창, 문서에 남는 자리는 네 배 넘게 차이</text>
  <text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">가정: 출력 상한 16K · 시스템 지시와 도구 스키마 6K · 대화 이력 20K</text>

  <text x="90" y="118" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e8e8e8">광고 창만 믿을 때</text>
  <text x="790" y="118" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="end">200K</text>
  <rect x="90" y="130" width="21" height="44" fill="#22224a" stroke="#7777cc" stroke-width="1"/>
  <rect x="111" y="130" width="70" height="44" fill="#14303a" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="181" y="130" width="553" height="44" fill="#16301a" stroke="#55c555" stroke-width="1"/>
  <rect x="734" y="130" width="56" height="44" fill="#262626" stroke="#888" stroke-width="1"/>
  <text x="457" y="157" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555" text-anchor="middle">문서 158K</text>
  <text x="90" y="196" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8">시스템 6K · 이력 20K</text>
  <text x="790" y="196" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8" text-anchor="end">출력 16K</text>

  <text x="90" y="258" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e8e8e8">실효 창이 64K임을 알 때</text>
  <text x="314" y="258" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">64K</text>
  <rect x="90" y="270" width="21" height="44" fill="#22224a" stroke="#7777cc" stroke-width="1"/>
  <rect x="111" y="270" width="70" height="44" fill="#14303a" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="181" y="270" width="133" height="44" fill="#16301a" stroke="#55c555" stroke-width="1"/>
  <rect x="314" y="270" width="476" height="44" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="247" y="297" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555" text-anchor="middle">문서 38K</text>
  <text x="552" y="297" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555" text-anchor="middle">들어가기는 해도 품질이 버티지 않는 구간</text>
  <text x="90" y="336" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8">시스템 6K · 이력 20K (실효 창 안에서도 자리를 먹는다)</text>

  <rect x="60" y="374" width="760" height="64" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3">문서 몫 158K → 38K</text>
  <text x="84" y="422" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8">100K짜리 문서는 앞의 계산으로는 넉넉히 들어가고, 뒤의 계산으로는 절반도 못 넣는다</text>
</svg>
