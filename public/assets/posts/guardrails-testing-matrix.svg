<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">실패가 두 방향이라 세트도 두 벌이 필요하다</text>
  <text x="60" y="72" font-size="13" fill="#888">한 벌만 만들면 그 방향만 좋아지고 반대 방향은 조용히 나빠진다.</text>

  <text x="405" y="114" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">막아야 할 요청</text>
  <text x="675" y="114" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">막으면 안 되는 요청</text>

  <text x="250" y="186" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="end">가드가 막았다</text>
  <text x="250" y="306" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="end">가드가 통과시켰다</text>

  <rect x="280" y="130" width="250" height="100" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="304" y="162" font-size="16" font-weight="600" fill="#e8e8e8">제대로 막음</text>
  <text x="304" y="186" font-size="12" fill="#888">의도한 동작</text>
  <text x="304" y="208" font-size="12" fill="#55c555">공격 세트가 확인한다</text>

  <rect x="550" y="130" width="250" height="100" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="574" y="162" font-size="16" font-weight="600" fill="#e8e8e8">과잉 거절</text>
  <text x="574" y="186" font-size="12" fill="#888">사용자가 떠나지만 지표에 없다</text>
  <text x="574" y="208" font-size="12" fill="#e05555">정상 세트만 잡을 수 있다</text>

  <rect x="280" y="250" width="250" height="100" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="304" y="282" font-size="16" font-weight="600" fill="#e8e8e8">놓침</text>
  <text x="304" y="306" font-size="12" fill="#888">사고로 드러난다</text>
  <text x="304" y="328" font-size="12" fill="#e05555">공격 세트가 잡는다</text>

  <rect x="550" y="250" width="250" height="100" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="574" y="282" font-size="16" font-weight="600" fill="#e8e8e8">제대로 통과</text>
  <text x="574" y="306" font-size="12" fill="#888">의도한 동작</text>
  <text x="574" y="328" font-size="12" fill="#55c555">정상 세트가 확인한다</text>

  <text x="60" y="382" font-size="13" fill="#888">오른쪽 위 칸은 사고 보고서로 절대 올라오지 않는다 — 그래서 세트로만 볼 수 있다.</text>
</svg>
