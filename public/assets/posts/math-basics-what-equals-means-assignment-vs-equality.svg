<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="452" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">같은 x = x + 1, 두 가지로 읽기</text>
  <text x="60" y="82" font-size="13" fill="#888">코드는 명령으로 읽고, 수식은 주장으로 읽는다</text>

  <rect x="60" y="112" width="360" height="190" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <rect x="460" y="112" width="360" height="190" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>

  <text x="84" y="140" font-size="15" font-weight="600" fill="#e8e8e8">코드의 = — 넣어라</text>
  <text x="484" y="140" font-size="15" font-weight="600" fill="#e8e8e8">수식의 = — 같다</text>

  <rect x="84" y="154" width="312" height="78" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="100" y="180" font-size="13" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#ffffff">x = <tspan fill="#b5cea8">3</tspan></text>
  <text x="100" y="198" font-size="13" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#ffffff">x = x + <tspan fill="#b5cea8">1</tspan></text>
  <text x="100" y="216" font-size="13" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#9aa4b8"># 이제 x 는 4</text>

  <rect x="484" y="154" width="312" height="78" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="500" y="180" font-size="13" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#ffffff">x = x + <tspan fill="#b5cea8">1</tspan></text>
  <text x="500" y="198" font-size="13" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#9aa4b8">양변에서 x 를 빼면</text>
  <text x="500" y="216" font-size="13" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#e05555">0 = 1</text>

  <text x="84" y="258" font-size="13" fill="#888">오른쪽을 계산해서</text>
  <text x="84" y="278" font-size="13" fill="#888">왼쪽 이름에 덮어쓴다</text>

  <text x="484" y="258" font-size="13" fill="#888">이렇게 되는 x 는 없다</text>
  <text x="484" y="278" font-size="13" fill="#888">즉 거짓인 주장이다</text>

  <rect x="60" y="332" width="760" height="60" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="356" font-size="13" font-weight="600" fill="#e8e8e8">= 는 넣으라는 명령이 아니라 양쪽이 같은 것을 가리킨다는 선언이다</text>
  <text x="84" y="376" font-size="13" fill="#888">그래서 수식에서는 좌우를 바꿔 적어도 뜻이 같고, 코드에서는 그럴 수 없다</text>
</svg>
