<text x="60" y="374" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">같은 x에서 세 곡선의 화살표 길이가 같다. 밀도를 알려면 Z를 구해야 하지만 스코어는 Z 없이 정해진다.</text>
