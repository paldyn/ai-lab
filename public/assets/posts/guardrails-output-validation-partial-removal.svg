<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="prArrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="prArrR" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">한 문장을 빼도 뺀 자리에 따라 결과가 다르다</text>
  <text x="60" y="76" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">근거 없는 문장 하나 때문에 답 전체를 버리면 사용자는 아무것도 못 받는다</text>

  <text x="60" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">곁가지를 뺐다</text>
  <text x="480" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e05555">근거를 뺐다</text>

  <rect x="60" y="130" width="340" height="36" rx="6" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="76" y="152" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">세 번째 방법을 설명한 문장</text>
  <text x="384" y="152" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#777777">근거</text>

  <rect x="60" y="174" width="340" height="36" rx="6" fill="#14100f" stroke="#e05555" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="76" y="196" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#8a8a8a">비슷한 사례를 든 문장</text>
  <line x1="74" y1="192" x2="214" y2="192" stroke="#e05555" stroke-width="1.5"/>
  <text x="384" y="196" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#777777">곁가지</text>

  <rect x="60" y="218" width="340" height="36" rx="6" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="76" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">따라서 세 번째 방법이 가장 저렴합니다</text>
  <text x="384" y="240" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#777777">결론</text>

  <rect x="480" y="130" width="340" height="36" rx="6" fill="#14100f" stroke="#e05555" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="496" y="152" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#8a8a8a">세 번째 방법을 설명한 문장</text>
  <line x1="494" y1="148" x2="652" y2="148" stroke="#e05555" stroke-width="1.5"/>
  <text x="804" y="152" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#777777">근거</text>

  <rect x="480" y="174" width="340" height="36" rx="6" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="496" y="196" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">비슷한 사례를 든 문장</text>
  <text x="804" y="196" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#777777">곁가지</text>

  <rect x="480" y="218" width="340" height="36" rx="6" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="496" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">따라서 세 번째 방법이 가장 저렴합니다</text>
  <text x="804" y="240" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#777777">결론</text>

  <line x1="230" y1="254" x2="230" y2="286" stroke="#55c555" stroke-width="2" marker-end="url(#prArrG)"/>
  <line x1="650" y1="254" x2="650" y2="286" stroke="#e05555" stroke-width="2" marker-end="url(#prArrR)"/>

  <rect x="60" y="286" width="340" height="64" rx="8" fill="#101c10" stroke="#55c555" stroke-width="1.5"/>
  <text x="84" y="312" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">빼고 내보낸다</text>
  <text x="84" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">제외했다는 한 줄을 남긴다</text>

  <rect x="480" y="286" width="340" height="64" rx="8" fill="#1c1010" stroke="#e05555" stroke-width="1.5"/>
  <text x="504" y="312" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">재생성이나 차단으로 올린다</text>
  <text x="504" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">근거는 없어졌는데 결론만 선다</text>

  <text x="60" y="390" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">지시어로 시작하는 문장, 앞 문장의 숫자를 받는 문장, 목록의 중간 항목은 혼자 빠지면 티가 난다.</text>
