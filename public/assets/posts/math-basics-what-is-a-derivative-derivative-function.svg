<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="440" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="dfarr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">점마다 접선의 기울기를 모으면 새 함수가 된다</text>

  <text x="60" y="88" font-size="16" font-weight="600" fill="#e8e8e8">f(x) = x²  위 세 점의 접선</text>
  <text x="480" y="88" font-size="16" font-weight="600" fill="#e8e8e8">f'(x) = 2x  — 기울기를 모은 함수</text>

  <!-- left plane -->
  <line x1="90" y1="300" x2="378" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="230" y1="140" x2="230" y2="348" stroke="#888" stroke-width="1.5"/>
  <text x="384" y="305" font-size="13" fill="#888">x</text>
  <text x="222" y="134" font-size="13" fill="#888">y</text>
  <line x1="170" y1="295" x2="170" y2="305" stroke="#444" stroke-width="1.5"/>
  <line x1="290" y1="295" x2="290" y2="305" stroke="#444" stroke-width="1.5"/>
  <text x="160" y="322" font-size="13" fill="#888">−1</text>
  <text x="286" y="322" font-size="13" fill="#888">1</text>

  <path d="M 110 180 Q 230 420 350 180" stroke="#7ec8e3" stroke-width="2.5" fill="none"/>

  <line x1="145" y1="245" x2="195" y2="295" stroke="#55c555" stroke-width="2.5"/>
  <line x1="200" y1="300" x2="260" y2="300" stroke="#55c555" stroke-width="2.5"/>
  <line x1="265" y1="295" x2="315" y2="245" stroke="#55c555" stroke-width="2.5"/>

  <circle cx="170" cy="270" r="5" fill="#e8e8e8"/>
  <circle cx="230" cy="300" r="5" fill="#e8e8e8"/>
  <circle cx="290" cy="270" r="5" fill="#e8e8e8"/>

  <text x="112" y="232" font-size="13" fill="#55c555">기울기 −2</text>
  <text x="196" y="338" font-size="13" fill="#55c555">기울기 0</text>
  <text x="286" y="232" font-size="13" fill="#55c555">기울기 2</text>

  <!-- arrow -->
  <line x1="412" y1="300" x2="466" y2="300" stroke="#888" stroke-width="2" marker-end="url(#dfarr)"/>

  <!-- right plane -->
  <line x1="520" y1="300" x2="790" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="650" y1="200" x2="650" y2="396" stroke="#888" stroke-width="1.5"/>
  <text x="796" y="305" font-size="13" fill="#888">x</text>
  <text x="642" y="194" font-size="13" fill="#888">y</text>
  <line x1="590" y1="295" x2="590" y2="305" stroke="#444" stroke-width="1.5"/>
  <line x1="710" y1="295" x2="710" y2="305" stroke="#444" stroke-width="1.5"/>
  <text x="580" y="322" font-size="13" fill="#888">−1</text>
  <text x="706" y="322" font-size="13" fill="#888">1</text>

  <line x1="542" y1="379" x2="758" y2="221" stroke="#7ec8e3" stroke-width="2.5"/>

  <circle cx="590" cy="344" r="5" fill="#55c555"/>
  <circle cx="650" cy="300" r="5" fill="#55c555"/>
  <circle cx="710" cy="256" r="5" fill="#55c555"/>

  <text x="530" y="366" font-size="13" fill="#55c555">−2</text>
  <text x="660" y="290" font-size="13" fill="#55c555">0</text>
  <text x="722" y="252" font-size="13" fill="#55c555">2</text>

  <text x="60" y="424" font-size="13" fill="#888">왼쪽 세 점의 접선 기울기 −2, 0, 2가 오른쪽 그래프의 세 점이 됩니다. 점마다 기울기를 돌려주는 이 새 함수가 도함수입니다.</text>
</svg>
