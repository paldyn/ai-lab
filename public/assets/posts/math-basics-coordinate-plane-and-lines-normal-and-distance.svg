<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="530" rx="12" fill="#0a0a0a"/>

  <defs>
    <marker id="nrm" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">계수쌍 (3, 4)는 그 직선의 법선이다</text>
  <text x="60" y="82" font-size="13" fill="#888">일반형에 적힌 두 숫자가 곧 직선에 수직인 벡터이고, 거기서 점까지의 거리 공식이 나온다</text>

  <line x1="136" y1="440" x2="510" y2="440" stroke="#888" stroke-width="1.5"/>
  <line x1="170" y1="474" x2="170" y2="134" stroke="#888" stroke-width="1.5"/>
  <text x="524" y="445" font-size="13" fill="#888">x</text>
  <text x="162" y="130" font-size="13" fill="#888" text-anchor="end">y</text>

  <line x1="238" y1="436" x2="238" y2="444" stroke="#444" stroke-width="1"/>
  <line x1="306" y1="436" x2="306" y2="444" stroke="#444" stroke-width="1"/>
  <line x1="374" y1="436" x2="374" y2="444" stroke="#444" stroke-width="1"/>
  <line x1="442" y1="436" x2="442" y2="444" stroke="#444" stroke-width="1"/>
  <text x="238" y="460" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="306" y="460" font-size="12" fill="#888" text-anchor="middle">4</text>
  <text x="374" y="460" font-size="12" fill="#888" text-anchor="middle">6</text>
  <text x="442" y="460" font-size="12" fill="#888" text-anchor="middle">8</text>

  <line x1="166" y1="372" x2="174" y2="372" stroke="#444" stroke-width="1"/>
  <line x1="166" y1="304" x2="174" y2="304" stroke="#444" stroke-width="1"/>
  <line x1="166" y1="236" x2="174" y2="236" stroke="#444" stroke-width="1"/>
  <text x="158" y="376" font-size="12" fill="#888" text-anchor="end">2</text>
  <text x="158" y="308" font-size="12" fill="#888" text-anchor="end">4</text>
  <text x="158" y="240" font-size="12" fill="#888" text-anchor="end">6</text>
  <text x="158" y="456" font-size="12" fill="#888" text-anchor="end">O</text>

  <line x1="153" y1="223" x2="459" y2="453" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="322" y="418" font-size="14" fill="#7ec8e3">3x + 4y − 24 = 0</text>

  <line x1="306" y1="338" x2="357" y2="270" stroke="#e05555" stroke-width="2.5" marker-end="url(#nrm)"/>
  <text x="369" y="262" font-size="14" fill="#e05555">n = (3, 4)</text>

  <line x1="197" y1="256" x2="238" y2="202" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="197" cy="256" r="5" fill="#e8e8e8"/>
  <circle cx="238" cy="202" r="5" fill="#e8e8e8"/>
  <text x="254" y="196" font-size="13" fill="#e8e8e8">P(2, 7)</text>
  <text x="258" y="248" font-size="13" fill="#7777cc">거리 = 2</text>
  <text x="185" y="276" font-size="13" fill="#888" text-anchor="end">H</text>

  <rect x="576" y="160" width="244" height="176" rx="6" fill="#101010" stroke="#3a4a6e" stroke-width="1"/>
  <text x="596" y="186" font-size="13" font-weight="600" fill="#e8e8e8">① 계수쌍을 벡터로 본다</text>
  <text x="596" y="212" font-size="13" fill="#9aa4b8">n = (3, 4),  ‖n‖ = 5</text>
  <text x="596" y="238" font-size="13" font-weight="600" fill="#e8e8e8">② 점 P를 좌변에 대입</text>
  <text x="596" y="264" font-size="13" fill="#9aa4b8">3·2 + 4·7 − 24 = 10</text>
  <text x="596" y="290" font-size="13" font-weight="600" fill="#e8e8e8">③ 노름으로 나눈다</text>
  <text x="596" y="316" font-size="13" fill="#9aa4b8">10 / 5 = 2</text>

  <text x="60" y="506" font-size="13" fill="#9aa4b8">부호 +는 P가 n이 가리키는 쪽에 있다는 뜻이고, 항을 n개로 늘리면 그대로 초평면 공식이 된다</text>
</svg>
