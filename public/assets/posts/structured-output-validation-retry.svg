<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450">
  <defs>
    <marker id="vrArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="vrArrWarn" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e0a555"/>
    </marker>
    <marker id="vrArrBad" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">재시도는 오류를 알려 줄 때만 의미가 있다</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">같은 입력을 그대로 다시 보내면 대개 같은 답이 다시 온다</text>

  <rect x="50" y="150" width="230" height="80" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="72" y="182" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">모델 호출</text>
  <text x="72" y="208" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">스키마 강제 + 입력</text>

  <line x1="280" y1="190" x2="325" y2="190" stroke="#7ec8e3" stroke-width="2" marker-end="url(#vrArr)"/>

  <rect x="325" y="150" width="230" height="80" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="347" y="182" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">의미 검증</text>
  <text x="347" y="208" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">ID 조회 · 날짜 · 필드 간 일관성</text>

  <line x1="555" y1="190" x2="600" y2="190" stroke="#55c555" stroke-width="2" marker-end="url(#vrArr)"/>
  <text x="560" y="172" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#55c555">통과</text>

  <rect x="600" y="150" width="230" height="80" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="622" y="182" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">사용</text>
  <text x="622" y="208" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">검증 이력을 함께 기록한다</text>

  <path d="M 400 150 C 400 100 250 100 180 100 C 155 100 150 120 150 150" fill="none" stroke="#e0a555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#vrArrWarn)"/>
  <text x="230" y="88" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e0a555">실패한 값과 이유를 붙여 재시도 — 최대 2회</text>

  <path d="M 440 230 L 440 296" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#vrArrBad)"/>
  <text x="452" y="268" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e05555">2회 넘게 실패</text>

  <rect x="325" y="296" width="505" height="80" rx="8" fill="#12121a" stroke="#e05555" stroke-width="1"/>
  <text x="347" y="328" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">폴백 — 자동 처리를 포기한다</text>
  <text x="347" y="354" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">사람 검토 큐로 보내거나 부분 결과만 저장하고 나머지를 비운다</text>

  <text x="50" y="412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">3회째에 성공하는 비율은 대개 매우 낮다. 상한을 높이는 것보다 실패 유형을 모아 스키마를 고치는 편이 낫다.</text>
</svg>
