<svg width="880" height="400" viewBox="0 0 880 400"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">TRL로 SFT 파인튜닝 구현</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">Hugging Face TRL (Transformer Reinforcement Learning)</text>

  <!-- Left: SFT training -->
  <text x="220" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">① SFTTrainer 학습</text>
  <rect x="40" y="108" width="360" height="252" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="56" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">trl </tspan><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">SFTTrainer, SFTConfig</tspan></text>
  <text x="56" y="147" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">peft </tspan><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">LoraConfig, get_peft_model</tspan></text>

  <text x="56" y="171" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># LoRA 설정 (메모리 효율)</text>
  <text x="56" y="189" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">lora_cfg </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">LoraConfig(</tspan></text>
  <text x="56" y="207" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    r=</tspan><tspan fill="#b5cea8">16</tspan><tspan fill="#ffffff">,  lora_alpha=</tspan><tspan fill="#b5cea8">32</tspan></text>
  <text x="56" y="225" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    target_modules=[</tspan><tspan fill="#ce9178">&quot;q_proj&quot;,&quot;v_proj&quot;</tspan><tspan fill="#ffffff">]</tspan></text>
  <text x="56" y="243" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    lora_dropout=</tspan><tspan fill="#b5cea8">0.05</tspan></text>
  <text x="56" y="261" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>

  <text x="56" y="285" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">trainer </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">SFTTrainer(</tspan></text>
  <text x="56" y="303" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    model=model,</text>
  <text x="56" y="321" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    train_dataset=dataset,</text>
  <text x="56" y="339" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    peft_config=lora_cfg,</text>
  <text x="56" y="357" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    args=SFTConfig(max_seq_length=</tspan><tspan fill="#b5cea8">2048</tspan><tspan fill="#ffffff">))</tspan></text>
  <text x="56" y="375" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">trainer.train()</text>

  <!-- Right: DPO training -->
  <text x="660" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">② DPO 선호도 학습</text>
  <rect x="480" y="108" width="360" height="252" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="496" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">trl </tspan><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">DPOTrainer, DPOConfig</tspan></text>

  <text x="496" y="153" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># 선호 데이터 구조</text>
  <text x="496" y="171" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">dpo_dataset </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">Dataset.from_list([{</tspan></text>
  <text x="496" y="189" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ce9178">    &quot;prompt&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;파이썬 설명해줘&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="496" y="207" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ce9178">    &quot;chosen&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#55c555">&quot;상세한 좋은 답변...&quot;</tspan></text>
  <text x="496" y="225" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ce9178">    &quot;rejected&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#e05555">&quot;모르겠습니다&quot;</tspan></text>
  <text x="496" y="243" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">}])</text>

  <text x="496" y="267" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">dpo_trainer </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">DPOTrainer(</tspan></text>
  <text x="496" y="285" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    model=sft_model,</text>
  <text x="496" y="303" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    ref_model=ref_model,</text>
  <text x="496" y="321" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    args=DPOConfig(beta=</tspan><tspan fill="#b5cea8">0.1</tspan><tspan fill="#ffffff">),</tspan></text>
  <text x="496" y="339" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    train_dataset=dpo_dataset,</text>
  <text x="496" y="357" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>
  <text x="496" y="375" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">dpo_trainer.train()</text>

  <!-- Bottom note -->
  <text x="440" y="388" text-anchor="middle" fill="#888" font-size="11">DPO beta: 레퍼런스 모델에서 벗어나는 정도 제어 (높을수록 보수적)</text>
</svg>
