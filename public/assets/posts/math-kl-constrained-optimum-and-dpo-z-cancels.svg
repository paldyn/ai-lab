<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="zcA" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">같은 프롬프트에서 나온 두 답이라 분배함수가 상쇄된다</text>
  <text x="60" y="72" font-size="14" fill="#888">log Z 는 프롬프트에만 의존하고 답에는 의존하지 않는다. 그래서 차이를 내면 사라진다.</text>

  <rect x="60" y="102" width="760" height="62" rx="8" fill="#12161f" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="136" font-size="14" font-weight="600" fill="#55c555">고른 답의 보상</text>
  <text x="230" y="136" font-size="16" fill="#e8e8e8">β · log ( π*(y<tspan font-size="12" dy="4">w</tspan><tspan dy="-4">) / π</tspan><tspan font-size="12" dy="4">ref</tspan><tspan dy="-4">(y</tspan><tspan font-size="12" dy="4">w</tspan><tspan dy="-4">) )</tspan></text>
  <text x="566" y="136" font-size="16" fill="#e05555">+  β · log Z(x)</text>

  <text x="418" y="194" font-size="22" fill="#888">−</text>

  <rect x="60" y="212" width="760" height="62" rx="8" fill="#12161f" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="246" font-size="14" font-weight="600" fill="#888">버린 답의 보상</text>
  <text x="230" y="246" font-size="16" fill="#e8e8e8">β · log ( π*(y<tspan font-size="12" dy="4">l</tspan><tspan dy="-4">) / π</tspan><tspan font-size="12" dy="4">ref</tspan><tspan dy="-4">(y</tspan><tspan font-size="12" dy="4">l</tspan><tspan dy="-4">) )</tspan></text>
  <text x="566" y="246" font-size="16" fill="#e05555">+  β · log Z(x)</text>

  <line x1="556" y1="126" x2="556" y2="254" stroke="#e05555" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="600" y="194" font-size="14" font-weight="600" fill="#e05555">두 값이 정확히 같다 — 빼면 0</text>

  <line x1="440" y1="274" x2="440" y2="300" stroke="#7777cc" stroke-width="2" marker-end="url(#zcA)"/>

  <rect x="60" y="300" width="760" height="62" rx="8" fill="#12161f" stroke="#55c555" stroke-width="1.5"/>
  <text x="84" y="334" font-size="14" font-weight="600" fill="#55c555">남는 것</text>
  <text x="196" y="334" font-size="16" fill="#e8e8e8">β · log ( π*(y<tspan font-size="12" dy="4">w</tspan><tspan dy="-4">) / π</tspan><tspan font-size="12" dy="4">ref</tspan><tspan dy="-4">(y</tspan><tspan font-size="12" dy="4">w</tspan><tspan dy="-4">) )  −  β · log ( π*(y</tspan><tspan font-size="12" dy="4">l</tspan><tspan dy="-4">) / π</tspan><tspan font-size="12" dy="4">ref</tspan><tspan dy="-4">(y</tspan><tspan font-size="12" dy="4">l</tspan><tspan dy="-4">) )</tspan></text>

  <rect x="60" y="384" width="760" height="48" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="412" font-size="14" fill="#888">계산할 수 없던 항이 하필 데이터가 정하지 못하는 자유도와 같은 자리에 있었다.</text>
</svg>
