<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">점수를 매기게 하면 흩어지고, 고르게 하면 모인다</text>
  <text x="60" y="72" font-size="13" fill="#888">같은 답 두 벌을 세 사람에게 보인 결과. 왼쪽은 점수, 오른쪽은 둘 중 하나.</text>

  <line x1="440" y1="94" x2="440" y2="342" stroke="#333" stroke-width="1"/>

  <text x="230" y="118" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">답 A에 5점 척도로</text>

  <text x="70" y="163" font-size="13" fill="#888">평가자 1</text>
  <rect x="160" y="146" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="188" y="146" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="216" y="146" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="244" y="146" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="272" y="146" width="22" height="22" rx="3" fill="#141414" stroke="#333" stroke-width="1"/>
  <text x="320" y="163" font-size="13" font-weight="600" fill="#e8e8e8">4점</text>

  <text x="70" y="213" font-size="13" fill="#888">평가자 2</text>
  <rect x="160" y="196" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="188" y="196" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="216" y="196" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="244" y="196" width="22" height="22" rx="3" fill="#141414" stroke="#333" stroke-width="1"/>
  <rect x="272" y="196" width="22" height="22" rx="3" fill="#141414" stroke="#333" stroke-width="1"/>
  <text x="320" y="213" font-size="13" font-weight="600" fill="#e8e8e8">3점</text>

  <text x="70" y="263" font-size="13" fill="#888">평가자 3</text>
  <rect x="160" y="246" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="188" y="246" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="216" y="246" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="244" y="246" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="272" y="246" width="22" height="22" rx="3" fill="#16303d" stroke="#7ec8e3" stroke-width="1"/>
  <text x="320" y="263" font-size="13" font-weight="600" fill="#e8e8e8">5점</text>

  <text x="70" y="312" font-size="13" font-weight="600" fill="#e05555">3점부터 5점까지 갈렸다</text>
  <text x="70" y="334" font-size="12" fill="#888">갈린 것은 답이 아니라 기준점이다</text>

  <text x="650" y="118" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">답 A와 답 B 중 나은 쪽</text>

  <text x="490" y="163" font-size="13" fill="#888">평가자 1</text>
  <rect x="580" y="142" width="70" height="30" rx="4" fill="#141414" stroke="#333" stroke-width="1"/>
  <text x="615" y="162" font-size="13" fill="#888" text-anchor="middle">답 A</text>
  <rect x="666" y="142" width="70" height="30" rx="4" fill="#17331a" stroke="#55c555" stroke-width="1.5"/>
  <text x="701" y="162" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">답 B</text>

  <text x="490" y="213" font-size="13" fill="#888">평가자 2</text>
  <rect x="580" y="192" width="70" height="30" rx="4" fill="#141414" stroke="#333" stroke-width="1"/>
  <text x="615" y="212" font-size="13" fill="#888" text-anchor="middle">답 A</text>
  <rect x="666" y="192" width="70" height="30" rx="4" fill="#17331a" stroke="#55c555" stroke-width="1.5"/>
  <text x="701" y="212" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">답 B</text>

  <text x="490" y="263" font-size="13" fill="#888">평가자 3</text>
  <rect x="580" y="242" width="70" height="30" rx="4" fill="#141414" stroke="#333" stroke-width="1"/>
  <text x="615" y="262" font-size="13" fill="#888" text-anchor="middle">답 A</text>
  <rect x="666" y="242" width="70" height="30" rx="4" fill="#17331a" stroke="#55c555" stroke-width="1.5"/>
  <text x="701" y="262" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">답 B</text>

  <text x="490" y="312" font-size="13" font-weight="600" fill="#55c555">셋 다 같은 쪽을 골랐다</text>
  <text x="490" y="334" font-size="12" fill="#888">「어느 쪽이 나은가」만 물었기 때문이다</text>

  <text x="60" y="376" font-size="13" fill="#e8e8e8">왼쪽의 흩어짐은 답이 애매해서 생긴 것이 아니다. 사람마다 「4점」이라는 말의 뜻이 달라서 생긴다.</text>
</svg>
