<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="330" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">가깝다는 한 덩어리, 멀다는 두 덩어리</text>
  <text x="60" y="82" font-size="13" fill="#888">|x − 3| 은 x 와 3 사이의 거리다. 그 한 문장으로 그림이 그려진다</text>

  <text x="60" y="128" font-size="16" font-weight="600" fill="#7ec8e3">|x − 3| &lt; 2</text>
  <line x1="100" y1="180" x2="800" y2="180" stroke="#888" stroke-width="1.5"/>
  <line x1="300" y1="174" x2="300" y2="186" stroke="#888" stroke-width="1"/>
  <line x1="450" y1="170" x2="450" y2="190" stroke="#e8e8e8" stroke-width="2"/>
  <line x1="600" y1="174" x2="600" y2="186" stroke="#888" stroke-width="1"/>
  <text x="300" y="206" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="450" y="208" font-size="14" font-weight="700" fill="#e8e8e8" text-anchor="middle">3</text>
  <text x="600" y="206" font-size="13" fill="#888" text-anchor="middle">5</text>
  <line x1="300" y1="152" x2="600" y2="152" stroke="#7ec8e3" stroke-width="8" stroke-opacity="0.55"/>
  <circle cx="300" cy="152" r="6" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2"/>
  <circle cx="600" cy="152" r="6" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2"/>
  <text x="640" y="157" font-size="14" font-weight="600" fill="#7ec8e3">1 &lt; x &lt; 5 — 3에서 2보다 가까운 자리</text>

  <text x="60" y="248" font-size="16" font-weight="600" fill="#e05555">|x − 3| &gt; 2</text>
  <line x1="100" y1="290" x2="800" y2="290" stroke="#888" stroke-width="1.5"/>
  <line x1="300" y1="284" x2="300" y2="296" stroke="#888" stroke-width="1"/>
  <line x1="450" y1="280" x2="450" y2="300" stroke="#e8e8e8" stroke-width="2"/>
  <line x1="600" y1="284" x2="600" y2="296" stroke="#888" stroke-width="1"/>
  <text x="300" y="316" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="450" y="318" font-size="14" font-weight="700" fill="#e8e8e8" text-anchor="middle">3</text>
  <text x="600" y="316" font-size="13" fill="#888" text-anchor="middle">5</text>
  <line x1="100" y1="262" x2="300" y2="262" stroke="#e05555" stroke-width="8" stroke-opacity="0.55"/>
  <line x1="600" y1="262" x2="800" y2="262" stroke="#e05555" stroke-width="8" stroke-opacity="0.55"/>
  <circle cx="300" cy="262" r="6" fill="#0a0a0a" stroke="#e05555" stroke-width="2"/>
  <circle cx="600" cy="262" r="6" fill="#0a0a0a" stroke="#e05555" stroke-width="2"/>
  <text x="330" y="240" font-size="14" font-weight="600" fill="#e05555">x &lt; 1 또는 x &gt; 5 — 가운데가 뚫린다</text>
</svg>
