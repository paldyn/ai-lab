<svg xmlns="http://www.w3.org/2000/svg" width="880" height="576" viewBox="0 0 880 576" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="vblue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="vgreen" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>
  <rect width="880" height="576" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">임베딩 산술은 벡터 하나를 옮겨 붙이는 일이다</text>
  <text x="60" y="82" font-size="13" fill="#888">king − man 이 만드는 차이 벡터를 woman 에 더하면 queen 자리에 닿는다</text>

  <line x1="100" y1="400" x2="800" y2="400" stroke="#888" stroke-width="1.5"/>
  <line x1="140" y1="420" x2="140" y2="150" stroke="#888" stroke-width="1.5"/>
  <text x="808" y="405" font-size="13" fill="#888">x</text>
  <text x="134" y="144" font-size="13" fill="#888" text-anchor="end">y</text>

  <line x1="220" y1="396" x2="220" y2="404" stroke="#444" stroke-width="1"/>
  <line x1="300" y1="396" x2="300" y2="404" stroke="#444" stroke-width="1"/>
  <line x1="380" y1="396" x2="380" y2="404" stroke="#444" stroke-width="1"/>
  <line x1="460" y1="396" x2="460" y2="404" stroke="#444" stroke-width="1"/>
  <line x1="540" y1="396" x2="540" y2="404" stroke="#444" stroke-width="1"/>
  <line x1="620" y1="396" x2="620" y2="404" stroke="#444" stroke-width="1"/>
  <line x1="136" y1="320" x2="144" y2="320" stroke="#444" stroke-width="1"/>
  <line x1="136" y1="240" x2="144" y2="240" stroke="#444" stroke-width="1"/>
  <line x1="136" y1="160" x2="144" y2="160" stroke="#444" stroke-width="1"/>

  <path d="M 220 320 L 380 200" stroke="#444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 460 336 L 620 216" stroke="#444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 220 320 L 460 336" stroke="#444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 380 200 L 620 216" stroke="#444" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

  <line x1="220" y1="320" x2="380" y2="200" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#vblue)"/>
  <text x="270" y="224" font-size="13" fill="#7ec8e3" text-anchor="middle">king − man</text>

  <g>
    <line x1="220" y1="320" x2="380" y2="200" stroke="#55c555" stroke-width="2.5" marker-end="url(#vgreen)"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 0; 240 16; 240 16; 0 0"
                      keyTimes="0; 0.15; 0.6; 0.9; 1"
                      dur="5s" repeatCount="indefinite"/>
  </g>

  <circle cx="220" cy="320" r="5" fill="#e8e8e8"/>
  <circle cx="380" cy="200" r="5" fill="#e8e8e8"/>
  <circle cx="460" cy="336" r="5" fill="#e8e8e8"/>
  <circle cx="620" cy="216" r="5" fill="#e8e8e8"/>

  <text x="220" y="346" font-size="14" fill="#e8e8e8" text-anchor="middle">man</text>
  <text x="380" y="184" font-size="14" fill="#e8e8e8" text-anchor="middle">king</text>
  <text x="460" y="362" font-size="14" fill="#e8e8e8" text-anchor="middle">woman</text>
  <text x="620" y="200" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">queen</text>

  <rect x="60" y="448" width="760" height="68" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="474" font-size="13" font-weight="600" fill="#e8e8e8">같은 벡터를 옮겨 놓아도 벡터는 변하지 않는다</text>
  <text x="84" y="496" font-size="13" fill="#888">시작점이 아니라 방향과 길이가 벡터를 정한다 — 그래서 차이 하나를 어디에나 더할 수 있다</text>
</svg>
