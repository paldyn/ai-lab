<svg xmlns="http://www.w3.org/2000/svg" width="880" height="590" viewBox="0 0 880 590">
  <rect x="0" y="0" width="880" height="590" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">스키마를 좁히면 못 만드는 값이 늘어난다</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">타입만 적은 스키마는 사실상 아무 문자열이나 통과시킨다</text>

  <text x="50" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e0a555">타입만 적은 스키마</text>
  <text x="470" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">값의 범위까지 적은 스키마</text>

  <rect x="50" y="128" width="360" height="154" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="66" y="154" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">{</text>
  <text x="66" y="173" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  "type": <tspan fill="#ce9178">"object"</tspan>,</text>
  <text x="66" y="192" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  "properties": {</text>
  <text x="66" y="211" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    "priority": {"type": <tspan fill="#ce9178">"string"</tspan>},</text>
  <text x="66" y="230" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    "due": {"type": <tspan fill="#ce9178">"string"</tspan>}</text>
  <text x="66" y="249" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  }</text>
  <text x="66" y="268" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>

  <rect x="470" y="128" width="360" height="249" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="486" y="154" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">{</text>
  <text x="486" y="173" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  "type": <tspan fill="#ce9178">"object"</tspan>,</text>
  <text x="486" y="192" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  "properties": {</text>
  <text x="486" y="211" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    "priority": {</text>
  <text x="486" y="230" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">      <tspan fill="#7ec8e3" font-weight="600">"enum"</tspan>: [<tspan fill="#ce9178">"P1"</tspan>, <tspan fill="#ce9178">"P2"</tspan>, <tspan fill="#ce9178">"P3"</tspan>]</text>
  <text x="486" y="249" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    },</text>
  <text x="486" y="268" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    "due": {</text>
  <text x="486" y="287" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">      "type": <tspan fill="#ce9178">"string"</tspan>,</text>
  <text x="486" y="306" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">      <tspan fill="#7ec8e3" font-weight="600">"pattern"</tspan>: <tspan fill="#ce9178">"^\d{4}-\d{2}$"</tspan></text>
  <text x="486" y="325" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    }</text>
  <text x="486" y="344" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  }</text>
  <text x="486" y="363" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>

  <text x="50" y="418" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#888">이 스키마를 통과하는 값</text>
  <text x="470" y="418" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#888">이 스키마를 통과하는 값</text>

  <rect x="50" y="432" width="360" height="96" rx="8" fill="#12121a" stroke="#e05555" stroke-width="1"/>
  <text x="70" y="458" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">"높음"  "urgent!"  "P1 (아마도)"</text>
  <text x="70" y="482" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">"다음 주 화요일"  ""  "미정"</text>
  <text x="70" y="510" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">전부 유효한 JSON이고 전부 스키마를 통과한다</text>

  <rect x="470" y="432" width="360" height="96" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="490" y="458" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555">"P1"  "P2"  "P3"</text>
  <text x="490" y="482" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555">"2026-08"  "1999-01"</text>
  <text x="490" y="510" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">그 밖의 문자열은 만들어질 수 없다</text>

  <text x="50" y="562" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">오른쪽도 "1999-01"은 막지 못한다. 형식과 범위를 좁히는 일과 값이 말이 되는지 보는 일은 다른 층이다.</text>
</svg>
