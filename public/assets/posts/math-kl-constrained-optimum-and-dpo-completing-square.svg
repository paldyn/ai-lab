<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="csA" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">목적식을 다시 묶으면 최적점이 한눈에 보인다</text>

  <rect x="60" y="76" width="760" height="58" rx="8" fill="#12161f" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="110" font-size="17" fill="#e8e8e8">E<tspan font-size="12" dy="4">π</tspan><tspan dy="-4">[ r ]  −  β · KL( π ‖ π</tspan><tspan font-size="12" dy="4">ref</tspan><tspan dy="-4"> )</tspan></text>
  <text x="620" y="110" font-size="13" fill="#888">우리가 최대화하려는 것</text>

  <line x1="440" y1="134" x2="440" y2="158" stroke="#7777cc" stroke-width="2" marker-end="url(#csA)"/>
  <text x="462" y="152" font-size="13" fill="#7ec8e3">참조 모델 × exp(r/β) 를 Z · π* 로 바꿔 쓴다</text>

  <rect x="60" y="158" width="760" height="58" rx="8" fill="#12161f" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="192" font-size="17" fill="#e8e8e8">= − β · E<tspan font-size="12" dy="4">π</tspan><tspan dy="-4">[ log ( π / ( Z · π* ) ) ]</tspan></text>

  <line x1="440" y1="216" x2="440" y2="240" stroke="#7777cc" stroke-width="2" marker-end="url(#csA)"/>
  <text x="462" y="234" font-size="13" fill="#888">Z 는 상수라 로그 밖으로 나온다</text>

  <rect x="60" y="240" width="760" height="58" rx="8" fill="#12161f" stroke="#55c555" stroke-width="1.5"/>
  <text x="84" y="274" font-size="17" fill="#e8e8e8">= − β · KL( π ‖ π* )  +  β · log Z</text>
  <text x="600" y="274" font-size="13" fill="#55c555">π 에 의존하는 것은 앞 항뿐</text>

  <rect x="60" y="322" width="368" height="76" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="352" font-size="14" font-weight="600" fill="#e8e8e8">KL 은 0 이상이고</text>
  <text x="84" y="376" font-size="14" font-weight="600" fill="#e8e8e8">두 분포가 같을 때만 0 이다</text>

  <rect x="452" y="322" width="368" height="76" rx="8" fill="#000000" stroke="#55c555" stroke-width="1.5"/>
  <text x="476" y="352" font-size="14" font-weight="600" fill="#55c555">따라서 최대는 π = π* 에서,</text>
  <text x="476" y="376" font-size="14" font-weight="600" fill="#55c555">그때의 값은 β · log Z 다</text>
</svg>
