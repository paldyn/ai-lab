<text x="60" y="384" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">스텝을 열 배 늘리면 오일러는 오차가 1/10, 하이운은 1/100이 된다.</text>
<text x="60" y="406" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">스텝이 아주 적은 왼쪽 끝에서는 두 직선이 붙는다 — 거기서는 차수 이론이 아직 안 통한다.</text>
