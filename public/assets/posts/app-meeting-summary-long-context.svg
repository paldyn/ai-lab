<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 424"
     style="border-radius:12px" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="lcBlue" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="lcPurple" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <rect width="880" height="424" rx="12" fill="#0a0a0a"/>

  <text x="440" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">통째로 넣기와 구간 요약</text>

  <text x="230" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#7ec8e3">통째로 넣기</text>
  <text x="230" y="100" text-anchor="middle" font-size="12" fill="#888">회의록 전체를 한 번에</text>
  <text x="650" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#7777cc">구간 요약 후 재요약</text>
  <text x="650" y="100" text-anchor="middle" font-size="12" fill="#888">20분씩 잘라 각각 요약</text>

  <!-- 통째로 넣기 -->
  <rect x="70" y="116" width="320" height="44" rx="6" fill="#0f1a2e" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="230" y="143" text-anchor="middle" font-size="13" fill="#e8e8e8">60분 회의록 ≈ 1만 자</text>

  <line x1="230" y1="160" x2="230" y2="188" stroke="#7ec8e3" stroke-width="2" marker-end="url(#lcBlue)"/>

  <rect x="115" y="188" width="230" height="46" rx="8" fill="#0f1a2e" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="230" y="216" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">모델 호출 한 번</text>

  <line x1="230" y1="234" x2="230" y2="276" stroke="#7ec8e3" stroke-width="2" marker-end="url(#lcBlue)"/>

  <rect x="115" y="276" width="230" height="46" rx="8" fill="#0f1a2e" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="230" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">요약</text>

  <!-- 구간 요약 후 재요약 -->
  <rect x="490" y="116" width="100" height="44" rx="6" fill="#1a1030" stroke="#7777cc" stroke-width="1.5"/>
  <text x="540" y="143" text-anchor="middle" font-size="13" fill="#e8e8e8">1구간</text>
  <rect x="600" y="116" width="100" height="44" rx="6" fill="#1a1030" stroke="#7777cc" stroke-width="1.5"/>
  <text x="650" y="143" text-anchor="middle" font-size="13" fill="#e8e8e8">2구간</text>
  <rect x="710" y="116" width="100" height="44" rx="6" fill="#1a1030" stroke="#7777cc" stroke-width="1.5"/>
  <text x="760" y="143" text-anchor="middle" font-size="13" fill="#e8e8e8">3구간</text>

  <line x1="540" y1="160" x2="540" y2="188" stroke="#7777cc" stroke-width="2" marker-end="url(#lcPurple)"/>
  <line x1="650" y1="160" x2="650" y2="188" stroke="#7777cc" stroke-width="2" marker-end="url(#lcPurple)"/>
  <line x1="760" y1="160" x2="760" y2="188" stroke="#7777cc" stroke-width="2" marker-end="url(#lcPurple)"/>

  <rect x="490" y="188" width="100" height="40" rx="6" fill="#1a1030" stroke="#7777cc" stroke-width="1.5"/>
  <text x="540" y="213" text-anchor="middle" font-size="13" fill="#e8e8e8">요약</text>
  <rect x="600" y="188" width="100" height="40" rx="6" fill="#1a1030" stroke="#7777cc" stroke-width="1.5"/>
  <text x="650" y="213" text-anchor="middle" font-size="13" fill="#e8e8e8">요약</text>
  <rect x="710" y="188" width="100" height="40" rx="6" fill="#1a1030" stroke="#7777cc" stroke-width="1.5"/>
  <text x="760" y="213" text-anchor="middle" font-size="13" fill="#e8e8e8">요약</text>

  <line x1="540" y1="228" x2="540" y2="248" stroke="#7777cc" stroke-width="2"/>
  <line x1="760" y1="228" x2="760" y2="248" stroke="#7777cc" stroke-width="2"/>
  <line x1="540" y1="248" x2="760" y2="248" stroke="#7777cc" stroke-width="2"/>
  <line x1="650" y1="228" x2="650" y2="276" stroke="#7777cc" stroke-width="2" marker-end="url(#lcPurple)"/>

  <rect x="535" y="276" width="230" height="46" rx="8" fill="#1a1030" stroke="#7777cc" stroke-width="1.5"/>
  <text x="650" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">재요약</text>

  <line x1="70" y1="348" x2="810" y2="348" stroke="#222" stroke-width="1"/>

  <text x="230" y="376" text-anchor="middle" font-size="13" fill="#55c555">회의 전체를 보므로 번복을 잡는다</text>
  <text x="230" y="400" text-anchor="middle" font-size="13" fill="#e05555">가운데에서 확정된 것이 빠진다</text>

  <text x="650" y="376" text-anchor="middle" font-size="13" fill="#55c555">구간이 짧아 가운데가 성기지 않는다</text>
  <text x="650" y="400" text-anchor="middle" font-size="13" fill="#e05555">번복이 결정 목록에 둘 다 오른다</text>
</svg>
