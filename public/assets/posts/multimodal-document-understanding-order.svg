  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">문서 이해의 첫 관문은 읽는 차례다</text>
  <text x="62" y="68" font-size="13" fill="#888">글자를 다 뽑아내도 순서가 틀리면 뜻이 사라진다.</text>
