  <text x="80" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">6</text>
  <text x="522" y="120" font-size="16" font-weight="600" fill="#55c555">사람이 읽는 차례</text>
  <text x="522" y="146" font-size="12" fill="#c8d0e0">1 왼쪽 단 위 → 2 오른쪽 단 위 → 3 그림과</text>
  <text x="522" y="166" font-size="12" fill="#c8d0e0">캡션 → 4 왼쪽 단 아래 → 5 오른쪽 단 아래</text>
  <text x="522" y="186" font-size="12" fill="#c8d0e0">→ 6 각주. 머리말과 쪽 번호는 본문이 아니다.</text>
  <text x="522" y="238" font-size="16" font-weight="600" fill="#e05555">위에서 아래로 한 줄씩 훑으면</text>
  <rect x="522" y="254" width="296" height="112" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="540" y="282" font-size="13"><tspan fill="#7ec8e3">3분기 매출은</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#c8a55a">반면 고정비는</tspan></text>
  <text x="540" y="308" font-size="13"><tspan fill="#7ec8e3">전년 대비 12%</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#c8a55a">같은 기간 8%</tspan></text>
  <text x="540" y="334" font-size="13"><tspan fill="#7ec8e3">늘었습니다</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#c8a55a">줄었습니다</tspan></text>
  <text x="540" y="356" font-size="11" fill="#9aa4b8">두 단이 한 문장처럼 섞인다</text>
  <text x="522" y="396" font-size="12" fill="#9aa4b8">단 경계 · 그림의 자리 · 머리말과 각주를 먼저</text>
  <text x="522" y="416" font-size="12" fill="#9aa4b8">가려내야 글자 뽑기가 뜻을 갖는다.</text>
