  <text x="262" y="394" text-anchor="middle" font-size="10" fill="#5a6472">— 12 —</text>
  <circle cx="80" cy="160" r="9" fill="#7ec8e3"/>
  <text x="80" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">1</text>
  <circle cx="260" cy="160" r="9" fill="#7ec8e3"/>
  <text x="260" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">2</text>
