<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <defs>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arrP" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="arrO" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#ce9178"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">U-Net의 뼈대와 타임스텝 임베딩</text>
  <text x="440" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">내려가며 그림 전체를 보고, 올라오며 픽셀 자리를 되살린다</text>

  <text x="160" y="96" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">입력 x_t 와 t</text>
  <text x="720" y="96" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">출력 노이즈 예측</text>

  <!-- encoder -->
  <rect x="70" y="104" width="180" height="54" rx="8" fill="#0d1b24" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="160" y="126" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">인코더 1</text>
  <text x="160" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">입력과 같은 해상도</text>

  <rect x="70" y="184" width="180" height="54" rx="8" fill="#0d1b24" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="160" y="206" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">인코더 2</text>
  <text x="160" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">해상도 줄임</text>

  <rect x="70" y="264" width="180" height="54" rx="8" fill="#0d1b24" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="160" y="286" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">인코더 3</text>
  <text x="160" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">해상도 줄임</text>

  <line x1="160" y1="158" x2="160" y2="184" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="160" y1="238" x2="160" y2="264" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- bottleneck -->
  <path d="M 160 318 L 160 387 L 340 387" fill="none" stroke="#ce9178" stroke-width="2" marker-end="url(#arrO)"/>
  <rect x="340" y="360" width="200" height="54" rx="8" fill="#2a1a0a" stroke="#ce9178" stroke-width="1.5"/>
  <text x="440" y="382" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#ce9178" text-anchor="middle">병목</text>
  <text x="440" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">그림 전체가 무엇인가</text>
  <path d="M 540 387 L 720 387 L 720 318" fill="none" stroke="#ce9178" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- decoder -->
  <rect x="630" y="264" width="180" height="54" rx="8" fill="#0d2410" stroke="#55c555" stroke-width="1.5"/>
  <text x="720" y="286" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">디코더 3</text>
  <text x="720" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">해상도 키움</text>

  <rect x="630" y="184" width="180" height="54" rx="8" fill="#0d2410" stroke="#55c555" stroke-width="1.5"/>
  <text x="720" y="206" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">디코더 2</text>
  <text x="720" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">해상도 키움</text>

  <rect x="630" y="104" width="180" height="54" rx="8" fill="#0d2410" stroke="#55c555" stroke-width="1.5"/>
  <text x="720" y="126" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">디코더 1</text>
  <text x="720" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">노이즈 맵 출력</text>

  <line x1="720" y1="264" x2="720" y2="238" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="720" y1="184" x2="720" y2="158" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- skip connections -->
  <line x1="250" y1="131" x2="630" y2="131" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrP)"/>
  <line x1="250" y1="211" x2="630" y2="211" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrP)"/>
  <line x1="250" y1="291" x2="630" y2="291" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrP)"/>
  <text x="440" y="341" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#7777cc" text-anchor="middle">스킵 연결 — 내려가며 잃은 잔결을 넘긴다</text>

  <!-- timestep embedding rail -->
  <line x1="110" y1="444" x2="110" y2="318" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrG)"/>
  <line x1="440" y1="444" x2="440" y2="414" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrG)"/>
  <line x1="770" y1="444" x2="770" y2="318" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrG)"/>

  <rect x="70" y="444" width="740" height="54" rx="10" fill="#0d2410" stroke="#55c555" stroke-width="1.5"/>
  <text x="440" y="466" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">타임스텝 임베딩</text>
  <text x="440" y="486" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">정수 t를 사인·코사인으로 펼쳐 넣고, 각 ResNet 블록마다 특징 맵에 더한다</text>
</svg>
