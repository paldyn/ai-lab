<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="390" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="ceDim" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#444444"/>
    </marker>
    <marker id="ceLive" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">원-핫 정답은 네 항의 합을 한 항으로 접는다</text>
  <text x="60" y="76" font-size="13" fill="#888">정답이 B일 때  p = (0, 1, 0, 0),  모델 q = (0.5, 0.25, 0.125, 0.125)</text>

  <!-- column A -->
  <rect x="60" y="110" width="145" height="90" rx="6" fill="#000000" stroke="#333333" stroke-width="1"/>
  <text x="132" y="140" font-size="14" font-weight="600" fill="#555555" text-anchor="middle">A :  p₁ = 0</text>
  <text x="132" y="162" font-size="13" fill="#555555" text-anchor="middle">−log q₁ = 1.0</text>
  <text x="132" y="184" font-size="13" fill="#555555" text-anchor="middle">곱 = 0</text>
  <line x1="132" y1="200" x2="132" y2="278" stroke="#444444" stroke-width="2" marker-end="url(#ceDim)"/>

  <!-- column B -->
  <rect x="265" y="110" width="145" height="90" rx="6" fill="#000000" stroke="#7ec8e3" stroke-width="2"/>
  <text x="337" y="140" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">B :  p₂ = 1</text>
  <text x="337" y="162" font-size="13" fill="#ffffff" text-anchor="middle">−log q₂ = 2.0</text>
  <text x="337" y="184" font-size="13" fill="#ffffff" text-anchor="middle">곱 = 2.0</text>
  <line x1="337" y1="200" x2="337" y2="278" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#ceLive)"/>

  <!-- column C -->
  <rect x="470" y="110" width="145" height="90" rx="6" fill="#000000" stroke="#333333" stroke-width="1"/>
  <text x="542" y="140" font-size="14" font-weight="600" fill="#555555" text-anchor="middle">C :  p₃ = 0</text>
  <text x="542" y="162" font-size="13" fill="#555555" text-anchor="middle">−log q₃ = 3.0</text>
  <text x="542" y="184" font-size="13" fill="#555555" text-anchor="middle">곱 = 0</text>
  <line x1="542" y1="200" x2="542" y2="278" stroke="#444444" stroke-width="2" marker-end="url(#ceDim)"/>

  <!-- column D -->
  <rect x="675" y="110" width="145" height="90" rx="6" fill="#000000" stroke="#333333" stroke-width="1"/>
  <text x="747" y="140" font-size="14" font-weight="600" fill="#555555" text-anchor="middle">D :  p₄ = 0</text>
  <text x="747" y="162" font-size="13" fill="#555555" text-anchor="middle">−log q₄ = 3.0</text>
  <text x="747" y="184" font-size="13" fill="#555555" text-anchor="middle">곱 = 0</text>
  <line x1="747" y1="200" x2="747" y2="278" stroke="#444444" stroke-width="2" marker-end="url(#ceDim)"/>

  <!-- result -->
  <rect x="60" y="280" width="760" height="70" rx="6" fill="#000000" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="308" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">H(p, q) = 0 + 2.0 + 0 + 0 = 2.0 비트</text>
  <text x="440" y="330" font-size="13" fill="#888" text-anchor="middle">= −log q₂  ·  정답 자리 하나만 남는다 — 이것이 음의 로그가능도다</text>
</svg>
