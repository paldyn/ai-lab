<text x="60" y="396" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">K = 1이면 보통의 ELBO다. 간극이 0.441 → 0.140 → 0.013 → 0.001로 줄고 곡선은 내려가지 않는다.</text>
<text x="60" y="418" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">q는 그대로 두었다 — 하한을 조인 것은 q를 고친 것이 아니라 표본을 늘려 로그 안의 평균을 정확하게 만든 것이다.</text>
