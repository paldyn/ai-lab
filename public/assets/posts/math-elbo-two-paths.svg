<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
<rect width="880" height="400" rx="12" fill="#0a0a0a"/>
<defs><marker id="p1" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker>
<marker id="p2" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/></marker></defs>
<text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">같은 식에 이르는 두 갈래</text>
<rect x="300" y="80" width="280" height="68" rx="10" fill="#111318" stroke="#e8e8e8" stroke-width="1.5"/>
<text x="440" y="108" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">log p(x)</text>
<text x="440" y="130" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">구하고 싶지만 적분이 막힌 값</text>
<rect x="60" y="208" width="330" height="88" rx="10" fill="#111318" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="225" y="236" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">경로 A · 젠센 부등식</text>
<text x="225" y="258" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">로그 안의 기댓값을 밖으로 빼면</text>
<text x="225" y="278" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">log E[·] &gt;= E[log ·]</text>
<rect x="490" y="208" width="330" height="88" rx="10" fill="#111318" stroke="#7777cc" stroke-width="1.5"/>
<text x="655" y="236" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">경로 B · KL 정의</text>
<text x="655" y="258" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">q와 사후분포의 KL을 더하고 빼면</text>
<text x="655" y="278" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">log p(x) = ELBO + KL</text>
<path d="M 380 148 L 300 200" stroke="#7ec8e3" stroke-width="2" fill="none" marker-end="url(#p1)"/>
<path d="M 500 148 L 580 200" stroke="#7777cc" stroke-width="2" fill="none" marker-end="url(#p2)"/>
<rect x="240" y="326" width="400" height="58" rx="10" fill="#111318" stroke="#55c555" stroke-width="1.5"/>
<text x="440" y="354" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">ELBO = E_q[log p(x,z)] − E_q[log q(z)]</text>
<text x="440" y="376" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888"></text>
<path d="M 225 296 L 225 348 L 232 348" stroke="#7ec8e3" stroke-width="2" fill="none" marker-end="url(#p1)"/>
<path d="M 655 296 L 655 348 L 648 348" stroke="#7777cc" stroke-width="2" fill="none" marker-end="url(#p2)"/>
<text x="60" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">A는 하한이라는 것만 알려 주고, B는 하한이 얼마나 헐거운지까지 알려 준다.</text>
</svg>