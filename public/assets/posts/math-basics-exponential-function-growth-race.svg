<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="grAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">x² 이 앞서다가 2ˣ 에게 따라잡힌다</text>
  <text x="60" y="74" font-size="13" fill="#888">x = 2 와 x = 4 에서 두 번 만나고, 그 뒤로는 다시 만나지 않는다</text>

  <line x1="100" y1="360" x2="570" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#grAx)"/>
  <line x1="120" y1="380" x2="120" y2="120" stroke="#888" stroke-width="1.5" marker-end="url(#grAx)"/>
  <text x="576" y="364" font-size="13" fill="#888">x</text>
  <text x="126" y="124" font-size="13" fill="#888">y</text>

  <line x1="190" y1="354" x2="190" y2="366" stroke="#888" stroke-width="1.5"/>
  <line x1="260" y1="354" x2="260" y2="366" stroke="#888" stroke-width="1.5"/>
  <line x1="330" y1="354" x2="330" y2="366" stroke="#888" stroke-width="1.5"/>
  <line x1="400" y1="354" x2="400" y2="366" stroke="#888" stroke-width="1.5"/>
  <line x1="470" y1="354" x2="470" y2="366" stroke="#888" stroke-width="1.5"/>
  <line x1="540" y1="354" x2="540" y2="366" stroke="#888" stroke-width="1.5"/>
  <text x="190" y="380" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="260" y="380" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="330" y="380" font-size="12" fill="#888" text-anchor="middle">3</text>
  <text x="400" y="380" font-size="12" fill="#888" text-anchor="middle">4</text>
  <text x="470" y="380" font-size="12" fill="#888" text-anchor="middle">5</text>
  <text x="540" y="380" font-size="12" fill="#888" text-anchor="middle">6</text>

  <line x1="114" y1="302.4" x2="126" y2="302.4" stroke="#444" stroke-width="1.5"/>
  <line x1="114" y1="244.8" x2="126" y2="244.8" stroke="#444" stroke-width="1.5"/>
  <line x1="114" y1="129.6" x2="126" y2="129.6" stroke="#444" stroke-width="1.5"/>
  <text x="108" y="306" font-size="12" fill="#888" text-anchor="end">16</text>
  <text x="108" y="249" font-size="12" fill="#888" text-anchor="end">32</text>
  <text x="108" y="134" font-size="12" fill="#888" text-anchor="end">64</text>

  <polyline points="120,360 190,356.4 260,345.6 330,327.6 400,302.4 435,287.1 470,270 505,251.1 540,230.4" fill="none" stroke="#7777cc" stroke-width="2.5"/>
  <polyline points="120,356.4 190,352.8 260,345.6 330,331.2 365,319.3 400,302.4 435,278.5 470,244.8 505,197.1 540,129.6" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>

  <circle cx="260" cy="345.6" r="5" fill="#e8e8e8"/>
  <circle cx="400" cy="302.4" r="5" fill="#e8e8e8"/>

  <text x="548" y="222" font-size="14" fill="#7777cc">y = x²</text>
  <text x="548" y="126" font-size="14" fill="#7ec8e3">y = 2ˣ</text>

  <rect x="620" y="120" width="200" height="236" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="644" y="150" font-size="14" font-weight="600" fill="#e8e8e8">같은 x 를 두 식에</text>
  <line x1="644" y1="164" x2="796" y2="164" stroke="#333" stroke-width="1"/>
  <text x="644" y="186" font-size="13" fill="#888">x</text>
  <text x="712" y="186" font-size="13" fill="#7777cc">x²</text>
  <text x="780" y="186" font-size="13" fill="#7ec8e3" text-anchor="end">2ˣ</text>
  <text x="644" y="212" font-size="13" fill="#e8e8e8">3</text>
  <text x="712" y="212" font-size="13" fill="#e8e8e8">9</text>
  <text x="780" y="212" font-size="13" fill="#e8e8e8" text-anchor="end">8</text>
  <text x="644" y="236" font-size="13" fill="#e8e8e8">4</text>
  <text x="712" y="236" font-size="13" fill="#e8e8e8">16</text>
  <text x="780" y="236" font-size="13" fill="#e8e8e8" text-anchor="end">16</text>
  <text x="644" y="260" font-size="13" fill="#e8e8e8">5</text>
  <text x="712" y="260" font-size="13" fill="#e8e8e8">25</text>
  <text x="780" y="260" font-size="13" fill="#e8e8e8" text-anchor="end">32</text>
  <text x="644" y="284" font-size="13" fill="#e8e8e8">10</text>
  <text x="712" y="284" font-size="13" fill="#e8e8e8">100</text>
  <text x="780" y="284" font-size="13" fill="#e8e8e8" text-anchor="end">1024</text>
  <line x1="644" y1="300" x2="796" y2="300" stroke="#333" stroke-width="1"/>
  <text x="644" y="322" font-size="13" fill="#7ec8e3">x 를 두 배로 늘리면</text>
  <text x="644" y="342" font-size="13" fill="#7ec8e3">x² 은 네 배, 2ˣ 은 제곱</text>
  <rect x="60" y="400" width="760" height="44" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="428" font-size="13" fill="#e8e8e8">x = 20 에서는 400 대 1048576 이다 — x² 은 더해지는 양이 커질 뿐이고, 2ˣ 은 늘 2배씩 곱해진다.</text>
</svg>
