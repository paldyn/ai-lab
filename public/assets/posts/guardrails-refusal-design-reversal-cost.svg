<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">되돌리기 비용이 사람 검토의 경계를 정한다</text>
  <text x="60" y="72" font-size="13" fill="#888">조치의 강도를 정할 때 위험도만 보지 말고 되돌리기 비용을 함께 본다.</text>

  <text x="60" y="106" font-size="13" font-weight="600" fill="#55c555">자동으로 한다 — 싸게 되돌린다</text>

  <rect x="60" y="118" width="136" height="64" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="128" y="144" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">요청 거절</text>
  <text x="128" y="164" font-size="12" fill="#888" text-anchor="middle">문구만 나간다</text>

  <rect x="216" y="118" width="136" height="64" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="284" y="144" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">축소 수행</text>
  <text x="284" y="164" font-size="12" fill="#888" text-anchor="middle">뺀 것을 알린다</text>

  <rect x="372" y="118" width="136" height="64" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="440" y="144" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">확인 요청</text>
  <text x="440" y="164" font-size="12" fill="#888" text-anchor="middle">한 번만 되묻는다</text>

  <rect x="528" y="118" width="136" height="64" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="596" y="144" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">요청 재처리</text>
  <text x="596" y="164" font-size="12" fill="#888" text-anchor="middle">다시 돌린다</text>

  <rect x="684" y="118" width="136" height="64" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="752" y="144" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">사용량 복구</text>
  <text x="752" y="164" font-size="12" fill="#888" text-anchor="middle">차감을 되돌린다</text>

  <text x="440" y="208" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">계정에 손을 대는 것부터 사람이 본 뒤에 한다</text>
  <line x1="60" y1="224" x2="820" y2="224" stroke="#7ec8e3" stroke-width="2"/>

  <text x="60" y="258" font-size="13" font-weight="600" fill="#e05555">사람이 본 뒤에 한다 — 되돌려도 흔적이 남는다</text>

  <rect x="60" y="270" width="175" height="64" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="148" y="296" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">계정 정지</text>
  <text x="148" y="316" font-size="12" fill="#888" text-anchor="middle">취소해도 흔적이 남는다</text>

  <rect x="255" y="270" width="175" height="64" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="343" y="296" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">신고 이력</text>
  <text x="343" y="316" font-size="12" fill="#888" text-anchor="middle">기록에 그대로 남는다</text>

  <rect x="450" y="270" width="175" height="64" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="538" y="296" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">관리자 알림</text>
  <text x="538" y="316" font-size="12" fill="#888" text-anchor="middle">이미 나간 뒤다</text>

  <rect x="645" y="270" width="175" height="64" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="733" y="296" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">외부 기관 보고</text>
  <text x="733" y="316" font-size="12" fill="#888" text-anchor="middle">우리가 못 지운다</text>

  <text x="60" y="372" font-size="13" fill="#888">판정기는 5%쯤 틀리고, 계정 정지는 0%만큼만 틀려야 하는 조치다.</text>
</svg>
