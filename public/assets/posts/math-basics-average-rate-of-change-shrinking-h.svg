<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="500" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="shAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">h 를 줄이면 할선이 한 직선으로 기운다</text>
  <text x="60" y="74" font-size="13" fill="#888">f(x) = x² 위에서 왼쪽 점은 x = 1 에 고정하고 오른쪽 점만 당겨 온다</text>

  <line x1="230" y1="400" x2="620" y2="400" stroke="#888" stroke-width="1.5" marker-end="url(#shAx)"/>
  <line x1="250" y1="430" x2="250" y2="150" stroke="#888" stroke-width="1.5" marker-end="url(#shAx)"/>
  <text x="626" y="404" font-size="13" fill="#888">x</text>
  <text x="258" y="152" font-size="13" fill="#888">y</text>

  <path d="M 274 398.4 L 310 390 L 346 374.4 L 370 360 L 406 332.4 L 442 297.6 L 478 255.6 L 514 206.4 L 538 169.6"
        fill="none" stroke="#7ec8e3" stroke-width="2.5"/>

  <line x1="290" y1="413.3" x2="550" y2="240" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="562" y="238" font-size="13" fill="#7777cc">h 가 0 에 가까울 때의 자리</text>

  <line x1="290" y1="440" x2="550" y2="180" stroke="#e05555" stroke-width="2.5">
    <animate attributeName="y1" dur="4s" repeatCount="indefinite"
             keyTimes="0;0.2;0.4;0.6;0.8;1"
             values="440;429.3;421.3;416.5;414.1;414.1"/>
    <animate attributeName="y2" dur="4s" repeatCount="indefinite"
             keyTimes="0;0.2;0.4;0.6;0.8;1"
             values="180;204;222;232.8;238.2;238.2"/>
  </line>

  <circle cx="370" cy="360" r="6" fill="#55c555"/>
  <text x="356" y="386" font-size="13" fill="#55c555" text-anchor="end">x = 1 고정</text>

  <circle cx="490" cy="240" r="6" fill="#e05555">
    <animate attributeName="cx" dur="4s" repeatCount="indefinite"
             keyTimes="0;0.2;0.4;0.6;0.8;1"
             values="490;442;406;384.4;373.6;373.6"/>
    <animate attributeName="cy" dur="4s" repeatCount="indefinite"
             keyTimes="0;0.2;0.4;0.6;0.8;1"
             values="240;297.6;332.4;349.8;357.6;357.6"/>
  </circle>

  <rect x="640" y="290" width="180" height="120" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="664" y="316" font-size="14" font-weight="600" fill="#e8e8e8">기울기</text>
  <line x1="664" y1="328" x2="796" y2="328" stroke="#333" stroke-width="1"/>
  <text x="664" y="354" font-size="14" fill="#e05555">2 + h</text>
  <text x="664" y="384" font-size="13" fill="#7777cc">h 가 줄면 2 로 간다</text>

  <rect x="60" y="444" width="760" height="34" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="466" font-size="13" fill="#e8e8e8">이렇게 할선을 계속 좁혀 얻는 직선을 접선이라고 부른다. 식으로 적는 일은 다음 글이 맡는다.</text>
</svg>
