  <text x="494" y="180" font-size="16" fill="#e8e8e8" font-weight="600">두 점은 길이가 1이다</text>
  <text x="494" y="210" font-size="13" fill="#888">(√1 + √0)² = 1</text>
  <text x="494" y="236" font-size="13" fill="#888">(√0 + √1)² = 1</text>
  <rect x="470" y="290" width="350" height="118" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="494" y="320" font-size="16" fill="#e05555" font-weight="600">가운데 점은 길이가 2다</text>
  <text x="494" y="350" font-size="13" fill="#888">(√0.5 + √0.5)² = 2 &gt; 1</text>
  <text x="494" y="376" font-size="13" fill="#888">선분이 영역 밖으로 나간다 — 볼록이 아니다</text>
  <rect x="470" y="430" width="350" height="90" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="494" y="460" font-size="16" fill="#e8e8e8" font-weight="600">더하면 삼각부등식이 깨진다</text>
  <text x="494" y="492" font-size="13" fill="#888">(1, 1)의 값 (1 + 1)² = 4 &gt; 1 + 1</text>
