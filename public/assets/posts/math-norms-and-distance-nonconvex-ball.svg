  <text x="60" y="56" font-size="22" fill="#e8e8e8" font-weight="700">p = 1/2이면 길이 1 이하의 영역이 오목하다</text>
  <text x="60" y="82" font-size="13" fill="#888">(√|x1| + √|x2|)² = 1인 점들 — 두 점을 잇는 선분이 영역 밖으로 나간다</text>
