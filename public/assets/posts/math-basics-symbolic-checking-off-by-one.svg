<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="390" rx="12" fill="#0a0a0a"/>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">한 칸 어긋난 범위</text>
  <text x="60" y="68" font-size="13" fill="#888">시그마는 1부터 10까지, range(10)은 0부터 9까지 돈다</text>
  <text x="60" y="132" font-size="16" font-weight="600" fill="#e8e8e8">Σ k (k = 1…10)</text>
  <text x="60" y="152" font-size="13" fill="#888">합 55</text>
