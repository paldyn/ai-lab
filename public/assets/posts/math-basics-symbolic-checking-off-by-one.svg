  <text x="505" y="141" font-size="16" fill="#e8e8e8" text-anchor="middle">5</text>
  <rect x="536" y="110" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="561" y="141" font-size="16" fill="#e8e8e8" text-anchor="middle">6</text>
  <rect x="592" y="110" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="617" y="141" font-size="16" fill="#e8e8e8" text-anchor="middle">7</text>
  <rect x="648" y="110" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="673" y="141" font-size="16" fill="#e8e8e8" text-anchor="middle">8</text>
