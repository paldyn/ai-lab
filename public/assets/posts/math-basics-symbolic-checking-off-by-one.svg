  <text x="785" y="141" font-size="16" fill="#e8e8e8" text-anchor="middle">10</text>
  <text x="60" y="242" font-size="16" font-weight="600" fill="#e8e8e8">range(10)</text>
  <text x="60" y="262" font-size="13" fill="#888">합 45</text>
  <rect x="200" y="220" width="50" height="50" rx="6" fill="#1a0f0f" stroke="#e05555" stroke-width="2"/>
  <text x="225" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">0</text>
  <rect x="256" y="220" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="281" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">1</text>
  <rect x="312" y="220" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="337" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">2</text>
  <rect x="368" y="220" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="393" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">3</text>
  <rect x="424" y="220" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="449" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">4</text>
  <rect x="480" y="220" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="505" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">5</text>
  <rect x="536" y="220" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="561" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">6</text>
  <rect x="592" y="220" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="617" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">7</text>
  <rect x="648" y="220" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="673" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">8</text>
  <rect x="704" y="220" width="50" height="50" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="729" y="251" font-size="16" fill="#e8e8e8" text-anchor="middle">9</text>
  <rect x="760" y="220" width="50" height="50" rx="6" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="785" y="251" font-size="16" fill="#888" text-anchor="middle">10</text>
  <text x="200" y="300" font-size="13" fill="#e05555">앞에서 0이 끼고</text>
  <text x="810" y="300" font-size="13" fill="#e05555" text-anchor="end">끝에서 10이 빠진다</text>
  <text x="440" y="350" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">55 − 45 = 10 — 빠진 마지막 항만큼 모자란다</text>
</svg>
