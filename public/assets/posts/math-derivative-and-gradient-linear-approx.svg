<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="dgU" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">접선은 a 근처에서 곡선을 대신한다</text>

  <line x1="150" y1="340" x2="770" y2="134.3" stroke="#7777cc" stroke-width="2.5"/>
  <polyline fill="none" stroke="#7ec8e3" stroke-width="2.5" points="150,305.7 188.75,300.9 227.5,295 266.25,288 305,280 343.75,270.9 382.5,260.7 421.25,249.5 460,237.1 498.75,223.8 537.5,209.3 576.25,193.8 615,177.2 653.75,159.5 692.5,140.7 731.25,120.9 770,100"/>

  <text x="150" y="118" font-size="14" font-weight="600" fill="#e8e8e8">접선 하나로 f 를 대신할 수 있는 범위</text>
  <text x="150" y="146" font-size="14" font-weight="600" fill="#7ec8e3">f(3 + h) ≈ 9 + 6h</text>
  <text x="150" y="174" font-size="13" fill="#888">h = 0.1  →  오차 0.01</text>
  <text x="150" y="196" font-size="13" fill="#888">h = 0.01  →  오차 0.0001</text>
  <text x="150" y="218" font-size="13" fill="#888">h가 10분의 1이면 오차는 100분의 1</text>

  <circle cx="460" cy="237.1" r="5" fill="#e8e8e8"/>
  <text x="460" y="262" font-size="13" fill="#888" text-anchor="middle">(3, 9)</text>

  <text x="700" y="92" font-size="14" font-weight="600" fill="#7ec8e3">f(x) = x²</text>
  <text x="778" y="146" font-size="14" font-weight="600" fill="#7777cc">접선</text>
  <line x1="740" y1="144.3" x2="740" y2="120" stroke="#e05555" stroke-width="2" marker-end="url(#dgU)"/>

  <line x1="150" y1="348" x2="800" y2="348" stroke="#888" stroke-width="1.5"/>
  <line x1="150" y1="348" x2="150" y2="356" stroke="#444" stroke-width="1.5"/>
  <line x1="305" y1="348" x2="305" y2="356" stroke="#444" stroke-width="1.5"/>
  <line x1="460" y1="348" x2="460" y2="356" stroke="#444" stroke-width="1.5"/>
  <line x1="615" y1="348" x2="615" y2="356" stroke="#444" stroke-width="1.5"/>
  <line x1="770" y1="348" x2="770" y2="356" stroke="#444" stroke-width="1.5"/>
  <text x="150" y="372" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="305" y="372" font-size="13" fill="#888" text-anchor="middle">2</text>
  <text x="460" y="372" font-size="13" fill="#888" text-anchor="middle">3</text>
  <text x="615" y="372" font-size="13" fill="#888" text-anchor="middle">4</text>
  <text x="770" y="372" font-size="13" fill="#888" text-anchor="middle">5</text>
  <text x="812" y="353" font-size="13" fill="#888">x</text>

  <text x="60" y="400" font-size="13" fill="#888">가까이서는 접선과 곡선이 구별되지 않고 멀어지면 벌어진다 — 도함수는 그 «가까이서의 기울기»다</text>
</svg>
