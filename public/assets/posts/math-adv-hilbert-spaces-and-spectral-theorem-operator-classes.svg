<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<defs><marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>
<text x="440.0" y="40.0" font-size="22" fill="#e8e8e8" text-anchor="middle" font-weight="700">작용소의 네 층과 특잇값 수열</text>
<text x="440.0" y="66.0" font-size="14" fill="#888" text-anchor="middle">특잇값 σ = (σ₁, σ₂, …) 이 어느 수열 공간에 드는지가 층을 가른다</text>
<rect x="60" y="90" width="760" height="350" rx="12" fill="#888" fill-opacity="0.06" stroke="#888" stroke-width="2"/>
<text x="84.0" y="126.0" font-size="16" fill="#e8e8e8" font-weight="600">유계</text>
<text x="134.0" y="126.0" font-size="14" fill="#b0b0b0">σ ∈ ℓ∞</text>
<text x="796.0" y="126.0" font-size="13" fill="#888" text-anchor="end">예: 곱셈작용소 t f(t), 항등작용소</text>
<rect x="90" y="152" width="700" height="268" rx="12" fill="#7777cc" fill-opacity="0.06" stroke="#7777cc" stroke-width="2"/>
<text x="114.0" y="188.0" font-size="16" fill="#e8e8e8" font-weight="600">컴팩트</text>
<text x="180.0" y="188.0" font-size="14" fill="#7777cc">σₖ → 0</text>
<text x="766.0" y="188.0" font-size="13" fill="#888" text-anchor="end">예: diag(1/√k)</text>
<rect x="120" y="214" width="640" height="186" rx="12" fill="#7ec8e3" fill-opacity="0.06" stroke="#7ec8e3" stroke-width="2"/>
<text x="144.0" y="250.0" font-size="16" fill="#e8e8e8" font-weight="600">힐베르트–슈미트</text>
<text x="290.0" y="250.0" font-size="14" fill="#7ec8e3">σ ∈ ℓ²  ·  Σσₖ² &lt; ∞</text>
<text x="736.0" y="250.0" font-size="13" fill="#888" text-anchor="end">예: diag(1/k)</text>
<rect x="150" y="276" width="580" height="104" rx="12" fill="#55c555" fill-opacity="0.06" stroke="#55c555" stroke-width="2"/>
<text x="174.0" y="312.0" font-size="16" fill="#e8e8e8" font-weight="600">트레이스 클래스</text>
<text x="320.0" y="312.0" font-size="14" fill="#55c555">σ ∈ ℓ¹  ·  Σσₖ &lt; ∞</text>
<text x="706.0" y="312.0" font-size="13" fill="#888" text-anchor="end">예: min(s, t) 적분작용소</text>
<text x="174.0" y="350.0" font-size="13" fill="#888">σₖ = λₖ = 1/((k − 1/2)π)² 이라 합이 1/2 로 유한하다</text>
<text x="440.0" y="470.0" font-size="13" fill="#888" text-anchor="middle">노름의 순서 ‖T‖ ≤ ‖T‖<tspan font-size="10" dy="3">HS</tspan><tspan dy="-3"> ≤ Σσₖ — 지난 글의 ℓ¹ ⊂ ℓ² ⊂ ℓ∞ 가 그대로 작용소의 층이 된다</tspan></text>
</svg>
