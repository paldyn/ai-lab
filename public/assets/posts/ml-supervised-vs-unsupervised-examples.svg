<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 480" style="background:#0a0a0a;border-radius:12px">
  <!-- Header -->
  <rect x="0" y="0" width="880" height="72" rx="12" fill="#0d1a2a"/>
  <rect x="0" y="60" width="880" height="12" fill="#0d1a2a"/>
  <text x="60" y="40" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">실전 머신러닝 알고리즘 선택 가이드</text>
  <text x="60" y="62" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">문제 유형별 scikit-learn 코드 예시</text>
  <line x1="60" y1="82" x2="820" y2="82" stroke="#3a4a6e" stroke-width="1"/>

  <text x="60" y="108" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">지도 학습 — 레이블을 보고 배운다</text>
  <rect x="60" y="115" width="370" height="228" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="152" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> sklearn.datasets</tspan><tspan fill="#7ec8e3"> import</tspan><tspan fill="#ffffff"> load_iris</tspan></text>
  <text x="76" y="170" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> sklearn.ensemble</tspan><tspan fill="#7ec8e3"> import</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="76" y="188" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    RandomForestClassifier)</tspan></text>
  <text x="76" y="206" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># 분류: 붓꽃 종류 예측</tspan></text>
  <text x="76" y="224" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">X, y = load_iris(return_X_y=</tspan><tspan fill="#b5cea8">True</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="76" y="242" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">clf = RandomForestClassifier(</tspan></text>
  <text x="76" y="260" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    n_estimators=</tspan><tspan fill="#b5cea8">100</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="76" y="278" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">clf.fit(X_train, y_train)</tspan></text>
  <text x="76" y="296" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">acc = clf.score(X_test, y_test)</tspan></text>
  <text x="76" y="314" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">proba = clf.predict_proba(X_test)</tspan></text>
  <text x="76" y="332" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># fit → predict 이 한 쌍이 API 전부</tspan></text>

  <text x="460" y="108" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">비지도 학습 — 레이블 없이 구조를 찾는다</text>
  <rect x="460" y="115" width="360" height="228" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="476" y="152" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> sklearn.cluster</tspan><tspan fill="#7ec8e3"> import</tspan><tspan fill="#ffffff"> KMeans</tspan></text>
  <text x="476" y="170" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> sklearn.decomposition</tspan><tspan fill="#7ec8e3"> import</tspan><tspan fill="#ffffff"> PCA</tspan></text>
  <text x="476" y="188" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># 군집화: 레이블 없이 그룹 찾기</tspan></text>
  <text x="476" y="206" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">kmeans = KMeans(n_clusters=</tspan><tspan fill="#b5cea8">3</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="476" y="224" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">labels = kmeans.fit_predict(X)</tspan></text>
  <text x="476" y="242" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">centers = kmeans.cluster_centers_</tspan></text>
  <text x="476" y="260" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># 차원 축소: 2D로 줄여 그려 보기</tspan></text>
  <text x="476" y="278" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">pca = PCA(n_components=</tspan><tspan fill="#b5cea8">2</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="476" y="296" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">X_2d = pca.fit_transform(X)</tspan></text>
  <text x="476" y="314" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">ratio = pca.explained_variance_ratio_</tspan></text>
  <text x="476" y="332" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">print(f</tspan><tspan fill="#ce9178">&quot;분산 설명력: {ratio.sum():.1%}&quot;</tspan><tspan fill="#ffffff">)</tspan></text>

  <!-- 빠른 선택 -->
  <rect x="60" y="365" width="760" height="86" rx="8" fill="#0d1a2a" stroke="#3a4a6e"/>
  <text x="80" y="389" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#7ec8e3">문제 유형 → 알고리즘 빠른 선택</text>
  <text x="80" y="411" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">레이블 있음 + 연속값 예측 → 선형/다항 회귀, Gradient Boosting, DNN</text>
  <text x="80" y="429" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">레이블 있음 + 클래스 예측 → 로지스틱 회귀, Random Forest, XGBoost, CNN/Transformer</text>
  <text x="80" y="447" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">레이블 없음 + 그룹 발견 → K-Means, DBSCAN, 계층 군집화</text>
</svg>
