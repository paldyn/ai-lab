<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="mh" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <rect width="880" height="450" rx="12" fill="#0a0a0a"/>
  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">헤드로 쪼개고 다시 붙이기</text>
  <text x="60" y="84" font-size="13" fill="#888">토큰 10개 · d = 512 · 헤드 8개 — K와 V도 Q와 같은 길을 간다</text>
  <rect x="60" y="130" width="160" height="40" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="140.0" y="194" font-size="13" fill="#e8e8e8" text-anchor="middle">X</text>
  <text x="140.0" y="214" font-size="13" fill="#888" text-anchor="middle">10×512</text>
  <line x1="220" y1="150" x2="280" y2="150" stroke="#7777cc" stroke-width="2" marker-end="url(#mh)"/>
  <text x="250.0" y="134" font-size="13" fill="#888" text-anchor="middle">× W_Q</text>
  <rect x="280" y="130" width="160" height="40" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="360.0" y="194" font-size="13" fill="#e8e8e8" text-anchor="middle">Q</text>
  <text x="360.0" y="214" font-size="13" fill="#888" text-anchor="middle">10×512</text>
  <line x1="440" y1="150" x2="520" y2="150" stroke="#7777cc" stroke-width="2" marker-end="url(#mh)"/>
  <text x="480.0" y="134" font-size="13" fill="#888" text-anchor="middle">자르기</text>
  <rect x="520" y="130" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="547" y="130" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="574" y="130" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="601" y="130" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="628" y="130" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="655" y="130" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="682" y="130" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="709" y="130" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <text x="624" y="194" font-size="13" fill="#e8e8e8" text-anchor="middle">헤드 8개</text>
  <text x="624" y="214" font-size="13" fill="#888" text-anchor="middle">각 10×64</text>
  <rect x="520" y="282" width="300" height="56" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="670" y="304" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">softmax( QᵢKᵢᵀ / √64 ) Vᵢ</text>
  <text x="670" y="326" font-size="13" fill="#888" text-anchor="middle">점수 10×10 → 출력 10×64, 헤드마다</text>
  <line x1="624" y1="222" x2="624" y2="282" stroke="#7777cc" stroke-width="2" marker-end="url(#mh)"/>
  <line x1="520" y1="310" x2="440" y2="310" stroke="#7777cc" stroke-width="2" marker-end="url(#mh)"/>
  <text x="480.0" y="294" font-size="13" fill="#888" text-anchor="middle">잇기</text>
  <rect x="280" y="290" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="300" y="290" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="320" y="290" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="340" y="290" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="360" y="290" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="380" y="290" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="400" y="290" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="420" y="290" width="20" height="40" fill="#173444" stroke="#7ec8e3" stroke-width="1"/>
  <text x="360" y="354" font-size="13" fill="#e8e8e8" text-anchor="middle">Concat</text>
  <text x="360" y="374" font-size="13" fill="#888" text-anchor="middle">10×512</text>
  <line x1="280" y1="310" x2="220" y2="310" stroke="#7777cc" stroke-width="2" marker-end="url(#mh)"/>
  <text x="250.0" y="294" font-size="13" fill="#888" text-anchor="middle">× W_O</text>
  <rect x="60" y="290" width="160" height="40" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="140.0" y="354" font-size="13" fill="#e8e8e8" text-anchor="middle">출력</text>
  <text x="140.0" y="374" font-size="13" fill="#888" text-anchor="middle">10×512</text>
  <text x="440" y="424" font-size="13" fill="#888" text-anchor="middle">W_Q · W_K · W_V · W_O 각 512×512 = 262,144개, 넷 합쳐 1,048,576개 · 나누는 수는 √64 = 8</text>
</svg>
