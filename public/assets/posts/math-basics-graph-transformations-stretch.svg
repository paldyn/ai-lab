<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">밖에 곱하면 세로로, 안에 곱하면 가로로</text>
  <text x="60" y="82" font-size="13" fill="#888">그리고 안에 곱한 것은 예상과 반대로 — 2를 곱했는데 폭이 절반이 된다</text>

  <line x1="100" y1="320" x2="380" y2="320" stroke="#888" stroke-width="1.5"/>
  <line x1="120" y1="120" x2="120" y2="340" stroke="#888" stroke-width="1.5"/>
  <text x="388" y="325" font-size="13" fill="#888">x</text>
  <polyline points="120,320 170,240 220,320" fill="none" stroke="#888" stroke-width="2.5"/>
  <polyline points="120,320 170,160 220,320" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="240" y="245" font-size="14" fill="#888">y = f(x)</text>
  <text x="240" y="165" font-size="14" font-weight="600" fill="#7ec8e3">y = 2f(x)</text>
  <line x1="170" y1="320" x2="170" y2="160" stroke="#7ec8e3" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="240" y="360" font-size="15" font-weight="600" fill="#7ec8e3">세로로 2배 — 높이만 커진다</text>

  <line x1="500" y1="320" x2="780" y2="320" stroke="#888" stroke-width="1.5"/>
  <line x1="520" y1="120" x2="520" y2="340" stroke="#888" stroke-width="1.5"/>
  <text x="788" y="325" font-size="13" fill="#888">x</text>
  <polyline points="520,320 620,240 720,320" fill="none" stroke="#888" stroke-width="2.5"/>
  <polyline points="520,320 570,240 620,320" fill="none" stroke="#7777cc" stroke-width="2.5"/>
  <text x="740" y="245" font-size="14" fill="#888">y = f(x)</text>
  <text x="600" y="212" font-size="14" font-weight="600" fill="#7777cc">y = f(2x)</text>
  <line x1="620" y1="320" x2="620" y2="240" stroke="#7777cc" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="640" y="360" font-size="15" font-weight="600" fill="#7777cc">가로로 절반 — 높이는 그대로다</text>

  <text x="60" y="118" font-size="13" fill="#888">밖에 곱한 2</text>
  <text x="500" y="118" font-size="13" fill="#888">안에 곱한 2</text>
</svg>
