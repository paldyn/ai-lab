<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="440" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">같은 양을 적는 세 가지 옷</text>
  <text x="60" y="82" font-size="13" fill="#888">분수·소수·백분율은 다른 양이 아니라 같은 양의 다른 표기다</text>

  <rect x="60" y="126" width="760" height="60" rx="4" fill="none" stroke="#666" stroke-width="1.5"/>
  <rect x="60" y="126" width="570" height="60" fill="#7ec8e3" fill-opacity="0.18"/>
  <line x1="250" y1="126" x2="250" y2="186" stroke="#666" stroke-width="1.5"/>
  <line x1="440" y1="126" x2="440" y2="186" stroke="#666" stroke-width="1.5"/>
  <line x1="630" y1="126" x2="630" y2="186" stroke="#7ec8e3" stroke-width="2.5"/>

  <text x="345" y="162" font-size="15" fill="#7ec8e3" text-anchor="middle">칠한 부분</text>
  <text x="725" y="162" font-size="15" fill="#888" text-anchor="middle">남은 부분</text>

  <text x="60" y="210" font-size="13" fill="#888">0</text>
  <text x="820" y="210" font-size="13" fill="#888" text-anchor="end">전체 = 1</text>

  <rect x="60" y="242" width="230" height="86" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="175" y="268" font-size="13" fill="#888" text-anchor="middle">분수</text>
  <text x="175" y="296" font-size="24" font-weight="700" fill="#7ec8e3" text-anchor="middle">3/4</text>
  <text x="175" y="318" font-size="12" fill="#888" text-anchor="middle">4 조각 중 3 조각</text>

  <rect x="325" y="242" width="230" height="86" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="440" y="268" font-size="13" fill="#888" text-anchor="middle">소수</text>
  <text x="440" y="296" font-size="24" font-weight="700" fill="#7ec8e3" text-anchor="middle">0.75</text>
  <text x="440" y="318" font-size="12" fill="#888" text-anchor="middle">3 ÷ 4 를 끝까지 계산한 값</text>

  <rect x="590" y="242" width="230" height="86" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="705" y="268" font-size="13" fill="#888" text-anchor="middle">백분율</text>
  <text x="705" y="296" font-size="24" font-weight="700" fill="#7ec8e3" text-anchor="middle">75%</text>
  <text x="705" y="318" font-size="12" fill="#888" text-anchor="middle">100 조각으로 쳤을 때 75 조각</text>

  <rect x="60" y="356" width="760" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="380" font-size="13" font-weight="600" fill="#e8e8e8">% 기호 자체가 "÷ 100" 이라는 뜻이다</text>
  <text x="84" y="400" font-size="13" fill="#888">75% 는 75/100 을 줄여 쓴 것이므로, %를 떼면 100 으로 나누고 붙이면 100 을 곱한다</text>
</svg>
