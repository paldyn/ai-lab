<svg xmlns="http://www.w3.org/2000/svg" width="880" height="446" viewBox="0 0 880 446" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="446" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">원본에서만 잘하면 실력이 아니라 기억이다</text>
  <text x="60" y="72" font-size="13" fill="#888">같은 모델을 원본과 세 가지 변형에 각각 돌려 본 모양. 숫자는 예시다.</text>

  <line x1="100" y1="340" x2="820" y2="340" stroke="#333" stroke-width="1"/>

  <rect x="130" y="176" width="120" height="164" rx="4" fill="#3a1f1f" stroke="#e05555" stroke-width="1.5"/>
  <text x="190" y="166" font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">82점</text>
  <text x="190" y="364" font-size="13" fill="#e8e8e8" text-anchor="middle">원본 그대로</text>

  <rect x="300" y="218" width="120" height="122" rx="4" fill="#16303d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="360" y="208" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">61점</text>
  <text x="360" y="364" font-size="13" fill="#e8e8e8" text-anchor="middle">숫자만 바꿈</text>
  <text x="360" y="384" font-size="11" fill="#888" text-anchor="middle">푸는 방법은 그대로</text>

  <rect x="470" y="204" width="120" height="136" rx="4" fill="#16303d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="530" y="194" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">68점</text>
  <text x="530" y="364" font-size="13" fill="#e8e8e8" text-anchor="middle">보기 순서만 섞음</text>
  <text x="530" y="384" font-size="11" fill="#888" text-anchor="middle">정답 내용은 그대로</text>

  <rect x="640" y="222" width="120" height="118" rx="4" fill="#16303d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="700" y="212" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">59점</text>
  <text x="700" y="364" font-size="13" fill="#e8e8e8" text-anchor="middle">새로 만든 문제</text>
  <text x="700" y="384" font-size="11" fill="#888" text-anchor="middle">같은 범위·같은 난이도</text>

  <line x1="100" y1="220" x2="820" y2="220" stroke="#c58a55" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="820" y="148" font-size="12" fill="#c58a55" text-anchor="end">점선 — 변형본 셋이 모인 자리(60점대 초반)</text>

  <text x="60" y="418" font-size="13" fill="#e8e8e8">깨끗한 모델이라면 넷이 비슷하게 나온다. 원본 하나만 스물 몇 점 위로 솟아 있다면 그 격차가 곧 오염의 크기다.</text>
</svg>
