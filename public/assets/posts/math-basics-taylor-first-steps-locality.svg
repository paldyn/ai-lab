<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="340" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">전개가 통하는 범위는 0 둘레의 한 토막뿐이다</text>

  <!-- number line -->
  <line x1="100" y1="170" x2="800" y2="170" stroke="#888" stroke-width="1.5"/>
  <line x1="290" y1="170" x2="610" y2="170" stroke="#55c555" stroke-width="6"/>

  <line x1="290" y1="152" x2="290" y2="188" stroke="#e05555" stroke-width="2"/>
  <line x1="610" y1="152" x2="610" y2="188" stroke="#e05555" stroke-width="2"/>
  <circle cx="290" cy="170" r="6" fill="#0a0a0a" stroke="#e05555" stroke-width="2"/>
  <circle cx="610" cy="170" r="6" fill="#0a0a0a" stroke="#e05555" stroke-width="2"/>
  <line x1="450" y1="160" x2="450" y2="180" stroke="#444" stroke-width="1.5"/>

  <text x="282" y="212" font-size="13" fill="#e05555">−1</text>
  <text x="446" y="212" font-size="13" fill="#888">0</text>
  <text x="606" y="212" font-size="13" fill="#e05555">1</text>

  <text x="352" y="140" font-size="16" font-weight="600" fill="#55c555">여기서만 붙는다</text>
  <text x="120" y="140" font-size="13" fill="#e05555">더할수록 커진다</text>
  <text x="646" y="140" font-size="13" fill="#e05555">더할수록 커진다</text>

  <text x="60" y="262" font-size="16" font-weight="600" fill="#e8e8e8">1 + x + x² + x³ + ⋯ 는 |x| &lt; 1 일 때만 1/(1−x) 에 붙습니다.</text>
  <text x="60" y="296" font-size="13" fill="#888">x = 2 를 넣으면 1 + 2 + 4 + 8 + ⋯ 로 한없이 커지는데, 1/(1−2) = −1 이라 아예 다른 값입니다.</text>
</svg>
