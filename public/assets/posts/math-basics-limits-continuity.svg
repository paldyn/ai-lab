<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="450" rx="12" fill="#0a0a0a"/>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">연필을 떼야 하는 자리는 셋뿐이다</text>
  <text x="60" y="74" font-size="13" fill="#888">함숫값이 없거나, 양쪽이 어긋나거나, 값이 치솟거나</text>

  <text x="175" y="116" font-size="16" font-weight="600" fill="#7ec8e3" text-anchor="middle">구멍</text>
  <rect x="60" y="132" width="230" height="220" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <line x1="86" y1="300" x2="264" y2="300" stroke="#666" stroke-width="1.5"/>
  <line x1="175" y1="330" x2="175" y2="160" stroke="#666" stroke-width="1.5"/>
  <line x1="100" y1="290" x2="250" y2="190" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="175" cy="240" r="6" fill="#101010" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="175" y="330" font-size="12" fill="#888" text-anchor="middle">a</text>
  <text x="175" y="378" font-size="13" fill="#888" text-anchor="middle">극한은 있는데</text>
  <text x="175" y="398" font-size="13" fill="#888" text-anchor="middle">f(a) 가 없거나 다르다</text>

  <text x="440" y="116" font-size="16" font-weight="600" fill="#55c555" text-anchor="middle">점프</text>
  <rect x="325" y="132" width="230" height="220" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <line x1="351" y1="300" x2="529" y2="300" stroke="#666" stroke-width="1.5"/>
  <line x1="440" y1="330" x2="440" y2="160" stroke="#666" stroke-width="1.5"/>
  <line x1="365" y1="262" x2="440" y2="262" stroke="#55c555" stroke-width="2.5"/>
  <line x1="440" y1="196" x2="515" y2="196" stroke="#55c555" stroke-width="2.5"/>
  <circle cx="440" cy="262" r="6" fill="#101010" stroke="#55c555" stroke-width="2.5"/>
  <circle cx="440" cy="196" r="6" fill="#55c555"/>
  <text x="440" y="330" font-size="12" fill="#888" text-anchor="middle">a</text>
  <text x="440" y="378" font-size="13" fill="#888" text-anchor="middle">좌극한과 우극한이</text>
  <text x="440" y="398" font-size="13" fill="#888" text-anchor="middle">서로 다르다</text>

  <text x="705" y="116" font-size="16" font-weight="600" fill="#e05555" text-anchor="middle">치솟음</text>
  <rect x="590" y="132" width="230" height="220" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <line x1="616" y1="242" x2="794" y2="242" stroke="#666" stroke-width="1.5"/>
  <line x1="705" y1="330" x2="705" y2="152" stroke="#e05555" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 715 160 Q 730 232 790 238" fill="none" stroke="#e05555" stroke-width="2.5"/>
  <path d="M 620 246 Q 680 252 695 324" fill="none" stroke="#e05555" stroke-width="2.5"/>
  <text x="705" y="344" font-size="12" fill="#888" text-anchor="middle">a</text>
  <text x="705" y="378" font-size="13" fill="#888" text-anchor="middle">극한이 유한한 값이</text>
  <text x="705" y="398" font-size="13" fill="#888" text-anchor="middle">아니다</text>

  <rect x="60" y="416" width="760" height="26" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="434" font-size="13" fill="#e8e8e8">셋 다 「lim f(x) = f(a)」 한 줄이 깨진 모양이다.</text>
</svg>
