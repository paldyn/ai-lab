<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="cg" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="cb" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="520" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">활성 그래디언트가 만드는 원뿔</text>
  <text x="60" y="72" font-size="14" fill="#888">KKT의 정상성과 λ ≥ 0 을 합치면 「∇f 가 원뿔 안에 있다」가 된다</text>

  <text x="60" y="112" font-size="16" font-weight="600" fill="#e8e8e8">가로지르는 자리</text>
  <text x="60" y="134" font-size="13" fill="#888">x² + y² ≤ 1 과 x ≤ 1/2</text>
  <path d="M 240 206 A 120 120 0 1 0 240 414 Z" fill="#7777cc" fill-opacity="0.12" stroke="none"/>
  <circle cx="180" cy="310" r="120" fill="none" stroke="#7777cc" stroke-width="2"/>
  <line x1="240" y1="160" x2="240" y2="440" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="240,206 290,120 340,160 340,206" fill="#55c555" fill-opacity="0.14"/>
  <line x1="240" y1="206" x2="275" y2="146" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#cb)"/>
  <line x1="240" y1="206" x2="310" y2="206" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#cb)"/>
  <line x1="240" y1="206" x2="290" y2="156" stroke="#55c555" stroke-width="2.5" marker-end="url(#cg)"/>
  <circle cx="240" cy="206" r="5" fill="#e8e8e8"/>
  <text x="266" y="136" font-size="13" fill="#7ec8e3" text-anchor="end">∇g₁</text>
  <text x="296" y="228" font-size="13" fill="#7ec8e3">∇g₂</text>
  <text x="298" y="154" font-size="13" fill="#55c555">∇f</text>
  <text x="120" y="200" font-size="13" fill="#888">(1/2, √3/2)</text>
  <text x="60" y="470" font-size="13" fill="#888">∇f = 0.577·∇g₁ + 0.423·∇g₂</text>
  <text x="60" y="492" font-size="13" fill="#55c555">원뿔 안에 있다 → 승수가 있고 둘 다 0 이상</text>

  <line x1="440" y1="100" x2="440" y2="490" stroke="#333" stroke-width="1"/>

  <text x="480" y="112" font-size="16" font-weight="600" fill="#e8e8e8">접하는 자리</text>
  <text x="480" y="134" font-size="13" fill="#888">x² + y² ≤ 1 과 x ≥ 1</text>
  <circle cx="620" cy="310" r="120" fill="none" stroke="#7777cc" stroke-width="2"/>
  <line x1="740" y1="160" x2="740" y2="440" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="560" y="302" width="260" height="16" rx="4" fill="#55c555" fill-opacity="0.14"/>
  <line x1="740" y1="310" x2="810" y2="310" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#cb)"/>
  <line x1="740" y1="310" x2="680" y2="310" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#cb)"/>
  <line x1="740" y1="310" x2="740" y2="236" stroke="#55c555" stroke-width="3" marker-end="url(#cg)"/>
  <circle cx="740" cy="310" r="5" fill="#e8e8e8"/>
  <text x="790" y="296" font-size="13" fill="#7ec8e3">∇g₁</text>
  <text x="664" y="296" font-size="13" fill="#7ec8e3">∇g₂</text>
  <text x="750" y="238" font-size="13" fill="#55c555">∇f</text>
  <text x="752" y="336" font-size="13" fill="#888">(1, 0)</text>
  <text x="480" y="470" font-size="13" fill="#888">원뿔이 가로축으로 납작해졌다</text>
  <text x="480" y="492" font-size="13" fill="#e05555">∇f = (0, 1) 을 못 만든다 → 승수가 없다</text>
</svg>
