<svg xmlns="http://www.w3.org/2000/svg" width="880" height="424" viewBox="0 0 880 424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="424" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">GPU 이용률은 포화점에서 말을 멈춘다</text>
  <text x="60" y="72" font-size="13" fill="#888">도착 요청이 꾸준히 늘어날 때 두 지표가 그리는 모양. 가로는 시간이다.</text>

  <rect x="400" y="120" width="420" height="200" fill="#e05555" opacity="0.06"/>
  <line x1="130" y1="320" x2="820" y2="320" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="120" x2="130" y2="320" stroke="#333" stroke-width="1"/>

  <line x1="400" y1="120" x2="400" y2="320" stroke="#666" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="400" y="112" font-size="12" fill="#e05555" text-anchor="middle">포화점</text>

  <path d="M 130 290 L 820 150" stroke="#666" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M 130 260 L 400 132 L 820 132" stroke="#55c555" stroke-width="2.5" fill="none"/>
  <path d="M 130 316 L 400 316 C 530 308, 630 232, 820 142" stroke="#e05555" stroke-width="2.5" fill="none"/>

  <text x="640" y="118" font-size="12" fill="#55c555">GPU 이용률 95%에서 평평</text>
  <text x="640" y="306" font-size="12" fill="#e05555">대기열은 계속 자란다</text>

  <text x="150" y="152" font-size="12" fill="#888">여유 구간</text>
  <text x="150" y="172" font-size="12" fill="#666">지표 둘이 같은 말을 한다</text>

  <rect x="60" y="350" width="12" height="12" rx="3" fill="none" stroke="#55c555" stroke-width="2.5"/>
  <text x="82" y="361" font-size="13" fill="#e8e8e8">GPU 이용률</text>
  <rect x="200" y="350" width="12" height="12" rx="3" fill="none" stroke="#e05555" stroke-width="2.5"/>
  <text x="222" y="361" font-size="13" fill="#e8e8e8">대기 중인 요청 수</text>
  <rect x="380" y="350" width="12" height="12" rx="3" fill="none" stroke="#666" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="402" y="361" font-size="13" fill="#e8e8e8">도착 요청 수</text>

  <text x="60" y="392" font-size="13" fill="#e8e8e8">이용률을 기준으로 삼으면 95%에서 신호가 멎어, 밀리기 시작한 뒤로는 얼마나 모자란지를 알려 주지 못한다.</text>
</svg>
