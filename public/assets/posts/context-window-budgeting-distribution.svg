<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
  <text x="60" y="48" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">강등 단계 분포가 말해 주는 것</text>
  <text x="60" y="74" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">경로별로 요청이 어느 단계에서 멈췄는지 나눈 비율 (예시 수치)</text>

  <rect x="60" y="96" width="16" height="16" rx="3" fill="#55c555"/>
  <text x="84" y="109" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">강등 없음</text>
  <rect x="170" y="96" width="16" height="16" rx="3" fill="#7ec8e3"/>
  <text x="194" y="109" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">① · ②</text>
  <rect x="266" y="96" width="16" height="16" rx="3" fill="#7777cc"/>
  <text x="290" y="109" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">③</text>
  <rect x="330" y="96" width="16" height="16" rx="3" fill="#e05555"/>
  <text x="354" y="109" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">④ · ⑤</text>

  <text x="60" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">경로 A</text>
  <rect x="140" y="140" width="315" height="36" fill="#55c555"/>
  <rect x="455" y="140" width="117" height="36" fill="#7ec8e3"/>
  <rect x="572" y="140" width="13" height="36" fill="#7777cc"/>
  <rect x="585" y="140" width="5" height="36" fill="#e05555"/>
  <text x="140" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">70%</text>
  <text x="455" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">26%</text>
  <text x="620" y="155" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">건강하다</text>
  <text x="620" y="175" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">③ 이상이 드물다</text>

  <text x="60" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">경로 B</text>
  <rect x="140" y="230" width="135" height="36" fill="#55c555"/>
  <rect x="275" y="230" width="157" height="36" fill="#7ec8e3"/>
  <rect x="432" y="230" width="90" height="36" fill="#7777cc"/>
  <rect x="522" y="230" width="68" height="36" fill="#e05555"/>
  <text x="140" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">30%</text>
  <text x="275" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">35%</text>
  <text x="432" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">20%</text>
  <text x="522" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">15%</text>
  <text x="620" y="245" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">설계가 틀렸다</text>
  <text x="620" y="265" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">넣는 것을 줄인다</text>

  <text x="60" y="342" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">경로 C</text>
  <rect x="140" y="320" width="450" height="36" fill="#55c555"/>
  <text x="140" y="378" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">100%</text>
  <text x="620" y="335" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">여유가 과할 수 있다</text>
  <text x="620" y="355" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">여유·문서 상한을 다시 본다</text>

  <text x="60" y="414" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">고칠 곳은 강등 코드가 아니라 그 경로의 예산이다</text>
</svg>
