<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <defs>
    <marker id="arr-p" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#0a0a0a" rx="12"/>

  <text x="440" y="42" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">Reflexion과 LATS</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#888">다시 시도하는 두 방향 — 시간 축과 공간 축</text>

  <!-- Reflexion -->
  <rect x="50" y="94" width="360" height="300" rx="10" fill="#0f1a2e" stroke="#7777cc" stroke-width="1.5"/>
  <text x="230" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#7777cc">Reflexion — 시간 축</text>

  <rect x="72" y="136" width="316" height="54" rx="6" fill="#0a0a0a" stroke="#3a4a6e" stroke-width="1"/>
  <text x="88" y="159" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8">1차 시도</text>
  <text x="372" y="159" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e05555">실패</text>
  <text x="88" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#9aa4b8">반성: 경계 조건을 빠뜨렸다</text>

  <line x1="230" y1="192" x2="230" y2="216" stroke="#7777cc" stroke-width="2" marker-end="url(#arr-p)"/>

  <rect x="72" y="216" width="316" height="54" rx="6" fill="#0a0a0a" stroke="#3a4a6e" stroke-width="1"/>
  <text x="88" y="239" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8">2차 시도</text>
  <text x="372" y="239" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e05555">실패</text>
  <text x="88" y="258" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#9aa4b8">반성: 빈 리스트를 처리하지 않았다</text>

  <line x1="230" y1="272" x2="230" y2="296" stroke="#7777cc" stroke-width="2" marker-end="url(#arr-p)"/>

  <rect x="72" y="296" width="316" height="54" rx="6" fill="#0f1f0f" stroke="#55c555" stroke-width="1"/>
  <text x="88" y="319" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8">3차 시도</text>
  <text x="372" y="319" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555">성공</text>
  <text x="88" y="338" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#9aa4b8">앞 반성 둘이 프롬프트에 함께 실린다</text>

  <text x="230" y="376" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888">3회 시도 = 호출 8회</text>

  <!-- LATS -->
  <rect x="470" y="94" width="360" height="300" rx="10" fill="#1a1000" stroke="#e0a855" stroke-width="1.5"/>
  <text x="650" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e0a855">LATS — 공간 축</text>

  <line x1="650" y1="150" x2="566" y2="198" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="650" y1="150" x2="650" y2="198" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="650" y1="150" x2="734" y2="198" stroke="#e0a855" stroke-width="1.5"/>

  <line x1="566" y1="198" x2="538" y2="246" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="566" y1="198" x2="566" y2="246" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="566" y1="198" x2="594" y2="246" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="650" y1="198" x2="622" y2="246" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="650" y1="198" x2="650" y2="246" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="650" y1="198" x2="678" y2="246" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="734" y1="198" x2="706" y2="246" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="734" y1="198" x2="734" y2="246" stroke="#e0a855" stroke-width="1.5"/>
  <line x1="734" y1="198" x2="762" y2="246" stroke="#e0a855" stroke-width="1.5"/>

  <circle cx="650" cy="150" r="11" fill="#0a0a0a" stroke="#e0a855" stroke-width="2"/>
  <circle cx="566" cy="198" r="10" fill="#0a0a0a" stroke="#e0a855" stroke-width="1.5"/>
  <circle cx="650" cy="198" r="10" fill="#0a0a0a" stroke="#e0a855" stroke-width="1.5"/>
  <circle cx="734" cy="198" r="10" fill="#0a0a0a" stroke="#e0a855" stroke-width="1.5"/>
  <circle cx="538" cy="246" r="9" fill="#0a0a0a" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="566" cy="246" r="9" fill="#0a0a0a" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="594" cy="246" r="9" fill="#0a0a0a" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="622" cy="246" r="9" fill="#0a0a0a" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="650" cy="246" r="9" fill="#0a0a0a" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="678" cy="246" r="9" fill="#0a0a0a" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="706" cy="246" r="9" fill="#0a0a0a" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="734" cy="246" r="9" fill="#0a0a0a" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="762" cy="246" r="9" fill="#0a0a0a" stroke="#e05555" stroke-width="2"/>

  <path d="M 773 246 Q 806 222 806 190 Q 806 164 661 150" stroke="#e05555" stroke-width="2"
        stroke-dasharray="4,4" fill="none" marker-end="url(#arr-r)"/>

  <text x="650" y="290" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#e05555">막힌 가지에서 갈림길로 되돌아간다</text>
  <text x="650" y="320" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8">후보 3 · 깊이 3 → 잎 27개</text>
  <text x="650" y="346" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888">잎마다 평가 호출 한 번 = 27회</text>

  <!-- 정리 -->
  <rect x="50" y="414" width="780" height="56" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="440" y="438" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">시간 축은 같은 경로를 다시 밟고, 공간 축은 갈래를 넓힌다</text>
  <text x="440" y="458" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#9aa4b8">탐색 공간이 넓고 한 번의 답이 아주 비싼 문제가 아니면 값을 치를 이유가 없다</text>
</svg>
