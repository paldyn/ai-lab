<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">라벨 스무딩은 모델이 아니라 목표를 옮긴다</text>

  <!-- left panel : one-hot -->
  <text x="50" y="84" font-size="16" font-weight="600" fill="#e8e8e8">원-핫 목표 p</text>
  <line x1="60" y1="300" x2="400" y2="300" stroke="#888" stroke-width="1.5"/>
  <rect x="75" y="297" width="55" height="3" fill="#7777cc"/>
  <rect x="160" y="120" width="55" height="180" fill="#7777cc"/>
  <rect x="245" y="297" width="55" height="3" fill="#7777cc"/>
  <rect x="330" y="297" width="55" height="3" fill="#7777cc"/>
  <text x="102" y="287" font-size="13" fill="#888" text-anchor="middle">0</text>
  <text x="187" y="110" font-size="13" fill="#7ec8e3" text-anchor="middle">1.0</text>
  <text x="272" y="287" font-size="13" fill="#888" text-anchor="middle">0</text>
  <text x="357" y="287" font-size="13" fill="#888" text-anchor="middle">0</text>
  <text x="102" y="322" font-size="13" fill="#888" text-anchor="middle">A</text>
  <text x="187" y="322" font-size="13" fill="#888" text-anchor="middle">B</text>
  <text x="272" y="322" font-size="13" fill="#888" text-anchor="middle">C</text>
  <text x="357" y="322" font-size="13" fill="#888" text-anchor="middle">D</text>
  <rect x="50" y="345" width="360" height="64" rx="6" fill="#000000" stroke="#e05555" stroke-width="1.5"/>
  <text x="70" y="371" font-size="13" fill="#ffffff">최소는 q = (0, 1, 0, 0) 자리다.</text>
  <text x="70" y="391" font-size="13" fill="#ffffff">softmax로는 닿지 못해 로짓이 계속 벌어진다.</text>

  <!-- right panel : smoothed -->
  <text x="470" y="84" font-size="16" font-weight="600" fill="#e8e8e8">스무딩한 목표 p′  (ε = 0.1)</text>
  <line x1="480" y1="300" x2="820" y2="300" stroke="#888" stroke-width="1.5"/>
  <rect x="495" y="295" width="55" height="5" fill="#7ec8e3"/>
  <rect x="580" y="133" width="55" height="167" fill="#7ec8e3"/>
  <rect x="665" y="295" width="55" height="5" fill="#7ec8e3"/>
  <rect x="750" y="295" width="55" height="5" fill="#7ec8e3"/>
  <text x="522" y="285" font-size="13" fill="#888" text-anchor="middle">0.025</text>
  <text x="607" y="123" font-size="13" fill="#7ec8e3" text-anchor="middle">0.925</text>
  <text x="692" y="285" font-size="13" fill="#888" text-anchor="middle">0.025</text>
  <text x="777" y="285" font-size="13" fill="#888" text-anchor="middle">0.025</text>
  <text x="522" y="322" font-size="13" fill="#888" text-anchor="middle">A</text>
  <text x="607" y="322" font-size="13" fill="#888" text-anchor="middle">B</text>
  <text x="692" y="322" font-size="13" fill="#888" text-anchor="middle">C</text>
  <text x="777" y="322" font-size="13" fill="#888" text-anchor="middle">D</text>
  <rect x="470" y="345" width="360" height="64" rx="6" fill="#000000" stroke="#55c555" stroke-width="1.5"/>
  <text x="490" y="371" font-size="13" fill="#ffffff">최소는 q = p′ 자리다.</text>
  <text x="490" y="391" font-size="13" fill="#ffffff">로짓 차가 ln 37 = 3.61 이면 닿는다.</text>
</svg>
