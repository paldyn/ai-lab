<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 540" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="540" rx="12" fill="#0a0a0a"/>

  <defs>
    <marker id="ln-gray" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="ln-red" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
    <marker id="ln-green" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <text x="440" y="46" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700" xml:space="preserve">Post-LN과 Pre-LN</text>
  <text x="440" y="70" text-anchor="middle" fill="#888" font-size="13" xml:space="preserve">정규화를 잔차 덧셈 뒤에 두느냐 서브레이어 앞에 두느냐</text>

  <!-- ===== Post-LN ===== -->
  <rect x="60" y="96" width="350" height="296" rx="8" fill="#0d0d0d" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="124" fill="#e05555" font-size="16" font-weight="600" xml:space="preserve">Post-LN</text>
  <text x="84" y="146" fill="#888" font-size="12" xml:space="preserve">x ← LN(x + Sublayer(x))</text>

  <text x="290" y="178" text-anchor="middle" fill="#e8e8e8" font-size="12" xml:space="preserve">입력 x</text>
  <line x1="290" y1="186" x2="290" y2="200" stroke="#888" stroke-width="2" marker-end="url(#ln-gray)"/>
  <rect x="225" y="200" width="130" height="34" rx="6" fill="#101010" stroke="#444"/>
  <text x="290" y="222" text-anchor="middle" fill="#e8e8e8" font-size="13" xml:space="preserve">Sublayer</text>
  <line x1="290" y1="234" x2="290" y2="250" stroke="#888" stroke-width="2" marker-end="url(#ln-gray)"/>
  <circle cx="290" cy="264" r="14" fill="#101010" stroke="#e05555" stroke-width="1.5"/>
  <text x="290" y="270" text-anchor="middle" fill="#e05555" font-size="16" font-weight="600" xml:space="preserve">+</text>
  <line x1="290" y1="278" x2="290" y2="296" stroke="#888" stroke-width="2" marker-end="url(#ln-gray)"/>
  <rect x="225" y="296" width="130" height="34" rx="6" fill="#101010" stroke="#e05555"/>
  <text x="290" y="318" text-anchor="middle" fill="#e05555" font-size="13" xml:space="preserve">LayerNorm</text>
  <line x1="290" y1="330" x2="290" y2="348" stroke="#888" stroke-width="2" marker-end="url(#ln-gray)"/>
  <text x="290" y="364" text-anchor="middle" fill="#e8e8e8" font-size="12" xml:space="preserve">출력</text>

  <path d="M 290 186 L 120 186 L 120 264 L 276 264" fill="none" stroke="#e05555" stroke-width="2" marker-end="url(#ln-red)"/>
  <text x="134" y="228" fill="#e05555" font-size="12" xml:space="preserve">잔차 경로</text>

  <text x="84" y="378" fill="#e05555" font-size="12" xml:space="preserve">잔차 경로가 LN을 통과한다</text>

  <!-- ===== Pre-LN ===== -->
  <rect x="470" y="96" width="350" height="296" rx="8" fill="#0d0d0d" stroke="#55c555" stroke-width="1.5"/>
  <text x="494" y="124" fill="#55c555" font-size="16" font-weight="600" xml:space="preserve">Pre-LN</text>
  <text x="494" y="146" fill="#888" font-size="12" xml:space="preserve">x ← x + Sublayer(LN(x))</text>

  <text x="700" y="178" text-anchor="middle" fill="#e8e8e8" font-size="12" xml:space="preserve">입력 x</text>
  <line x1="700" y1="186" x2="700" y2="200" stroke="#888" stroke-width="2" marker-end="url(#ln-gray)"/>
  <rect x="635" y="200" width="130" height="34" rx="6" fill="#101010" stroke="#55c555"/>
  <text x="700" y="222" text-anchor="middle" fill="#55c555" font-size="13" xml:space="preserve">LayerNorm</text>
  <line x1="700" y1="234" x2="700" y2="254" stroke="#888" stroke-width="2" marker-end="url(#ln-gray)"/>
  <rect x="635" y="254" width="130" height="34" rx="6" fill="#101010" stroke="#444"/>
  <text x="700" y="276" text-anchor="middle" fill="#e8e8e8" font-size="13" xml:space="preserve">Sublayer</text>
  <line x1="700" y1="288" x2="700" y2="300" stroke="#888" stroke-width="2" marker-end="url(#ln-gray)"/>
  <circle cx="700" cy="314" r="14" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="700" y="320" text-anchor="middle" fill="#55c555" font-size="16" font-weight="600" xml:space="preserve">+</text>
  <line x1="700" y1="328" x2="700" y2="348" stroke="#888" stroke-width="2" marker-end="url(#ln-gray)"/>
  <text x="700" y="364" text-anchor="middle" fill="#e8e8e8" font-size="12" xml:space="preserve">출력</text>

  <path d="M 700 186 L 530 186 L 530 314 L 686 314" fill="none" stroke="#55c555" stroke-width="2" marker-end="url(#ln-green)"/>
  <text x="544" y="250" fill="#55c555" font-size="12" xml:space="preserve">잔차 경로</text>

  <text x="494" y="378" fill="#55c555" font-size="12" xml:space="preserve">잔차 경로에 아무것도 끼지 않는다</text>

  <rect x="60" y="420" width="760" height="58" rx="8" fill="#0d0d0d" stroke="#333"/>
  <text x="84" y="444" fill="#e8e8e8" font-size="13" xml:space="preserve">Post-LN은 워밍업 없이는 대개 발산한다 — 초기의 큰 갱신이 정규화를 통과하며 증폭된다</text>
  <text x="84" y="466" fill="#888" font-size="12" xml:space="preserve">Pre-LN은 워밍업 없이도 학습이 시작되고, 마지막 블록 뒤에 정규화를 한 번 더 둔다</text>
</svg>
