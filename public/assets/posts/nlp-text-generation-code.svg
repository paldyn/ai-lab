<svg width="880" height="380" viewBox="0 0 880 380"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">GPT 계열 텍스트 생성 구현</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">HuggingFace generate() 파라미터 완전 활용</text>

  <!-- Left: generation code -->
  <text x="220" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">① 텍스트 생성</text>
  <rect x="40" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="56" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">transformers </tspan><tspan fill="#7ec8e3">import</tspan></text>
  <text x="56" y="147" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    AutoTokenizer, AutoModelForCausalLM</text>

  <text x="56" y="171" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">tok </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">AutoTokenizer.from_pretrained(</tspan></text>
  <text x="56" y="189" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    "skt/ko-gpt-trinity-1.2B-v0.5"</text>
  <text x="56" y="207" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>
  <text x="56" y="225" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">lm </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">AutoModelForCausalLM.from_pretrained(</tspan></text>
  <text x="56" y="243" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    "skt/ko-gpt-trinity-1.2B-v0.5"</text>
  <text x="56" y="261" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>

  <text x="56" y="285" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">prompt </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ce9178">&quot;오늘 날씨가&quot;</tspan></text>
  <text x="56" y="303" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">ids </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">tok(prompt, return_tensors=</tspan></text>
  <text x="56" y="321" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">              "pt").input_ids</text>

  <!-- Right: generate params -->
  <text x="660" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">② 생성 파라미터</text>
  <rect x="480" y="108" width="360" height="234" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="496" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">out </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">lm.generate(</tspan></text>
  <text x="496" y="147" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    ids,</text>
  <text x="496" y="165" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    max_new_tokens=</tspan><tspan fill="#b5cea8">100</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="496" y="183" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    do_sample=</tspan><tspan fill="#7ec8e3">True</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="496" y="201" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    temperature=</tspan><tspan fill="#b5cea8">0.8</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="496" y="219" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    top_p=</tspan><tspan fill="#b5cea8">0.9</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="496" y="237" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    repetition_penalty=</tspan><tspan fill="#b5cea8">1.3</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="496" y="255" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    no_repeat_ngram_size=</tspan><tspan fill="#b5cea8">3</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="496" y="273" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    eos_token_id=tok.eos_token_id,</text>
  <text x="496" y="291" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    pad_token_id=tok.eos_token_id,</text>
  <text x="496" y="309" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>
  <text x="496" y="333" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">text </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">tok.decode(out[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">])</tspan></text>

  <!-- Bottom -->
  <text x="440" y="362" text-anchor="middle" fill="#888" font-size="12">perplexity로 언어 모델 품질 측정: PPL = exp(-1/N × Σ log P(토큰_i))</text>
</svg>
