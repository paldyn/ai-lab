<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="gcA" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="gcB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>
  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">생성 결과를 바꾸는 손잡이는 네 층에 있다</text>
  <text x="62" y="68" font-size="13" fill="#888">프롬프트 · 샘플링 · 밖에서 주는 조건 · 모델 가중치.</text>

  <rect x="62" y="118" width="140" height="64" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="132" y="144" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">시드</text>
  <text x="132" y="164" text-anchor="middle" font-size="11" fill="#9aa4b8">→ 잠재 노이즈</text>
  <line x1="202" y1="150" x2="262" y2="150" stroke="#7ec8e3" stroke-width="2" marker-end="url(#gcA)"/>

  <rect x="262" y="118" width="300" height="64" rx="8" fill="#1a2030" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="412" y="144" text-anchor="middle" font-size="13" font-weight="600" fill="#7ec8e3">노이즈 제거를 steps번 되풀이</text>
  <text x="412" y="164" text-anchor="middle" font-size="11" fill="#9aa4b8">손잡이가 실제로 작용하는 자리</text>
  <line x1="562" y1="150" x2="622" y2="150" stroke="#7ec8e3" stroke-width="2" marker-end="url(#gcA)"/>

  <rect x="622" y="118" width="196" height="64" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="720" y="144" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">디코드 → 이미지</text>
  <text x="720" y="164" text-anchor="middle" font-size="11" fill="#9aa4b8">우리가 보는 결과</text>

  <line x1="147" y1="250" x2="330" y2="184" stroke="#7777cc" stroke-width="2" marker-end="url(#gcB)"/>
  <line x1="339" y1="250" x2="390" y2="184" stroke="#7777cc" stroke-width="2" marker-end="url(#gcB)"/>
  <line x1="531" y1="250" x2="452" y2="184" stroke="#7777cc" stroke-width="2" marker-end="url(#gcB)"/>
  <line x1="723" y1="250" x2="512" y2="184" stroke="#7777cc" stroke-width="2" marker-end="url(#gcB)"/>

  <rect x="62" y="250" width="170" height="66" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="78" y="276" font-size="13" font-weight="600" fill="#e8e8e8">프롬프트 · 네거티브</text>
  <text x="78" y="296" font-size="11" fill="#9aa4b8">무엇을 그릴지 정함</text>

  <rect x="254" y="250" width="170" height="66" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="270" y="276" font-size="13" font-weight="600" fill="#e8e8e8">CFG · steps · 샘플러</text>
  <text x="270" y="296" font-size="11" fill="#9aa4b8">얼마나 따를지 정함</text>

  <rect x="446" y="250" width="170" height="66" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="462" y="276" font-size="13" font-weight="600" fill="#e8e8e8">ControlNet · 마스크</text>
  <text x="462" y="296" font-size="11" fill="#9aa4b8">형태와 영역을 고정</text>

  <rect x="638" y="250" width="170" height="66" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="654" y="276" font-size="13" font-weight="600" fill="#e8e8e8">LoRA · 파인튜닝</text>
  <text x="654" y="296" font-size="11" fill="#9aa4b8">모델 자체를 옮김</text>

  <text x="62" y="356" font-size="12" fill="#9aa4b8">왼쪽으로 갈수록 손잡이가 거칠고, 오른쪽으로 갈수록 결과를 좁게 고정한다.</text>
  <text x="62" y="376" font-size="12" fill="#9aa4b8">원하는 것이 안 나올 때 오른쪽부터 손대는 것이 흔한 실수다 — 왼쪽이 훨씬 싸다.</text>
  <text x="62" y="396" font-size="12" fill="#55c555">그리고 시드를 고정해 두어야 손잡이 하나를 바꾼 효과가 보인다.</text>
</svg>
