<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>
  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">ε이 근호 안이냐 밖이냐</text>
  <text x="60" y="82" font-size="13" fill="#888">ε = 10⁻⁵ 일 때 정규화가 곱하는 배율 — 패널마다 막대 눈금이 다르다</text>

  <rect x="60" y="106" width="760" height="124" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="134" font-size="15" font-weight="600" fill="#e8e8e8">σ² = 1</text>
  <text x="84" y="171" font-size="13" fill="#888">안쪽 1/√(σ² + ε)</text>
  <rect x="300" y="154" width="380" height="24" rx="3" fill="#7ec8e3"/>
  <text x="692" y="171" font-size="13" font-weight="600" fill="#e8e8e8">0.999995</text>
  <text x="84" y="207" font-size="13" fill="#888">바깥쪽 1/(√σ² + ε)</text>
  <rect x="300" y="190" width="380" height="24" rx="3" fill="#7777cc"/>
  <text x="692" y="207" font-size="13" font-weight="600" fill="#e8e8e8">0.99999</text>

  <rect x="60" y="250" width="760" height="124" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="278" font-size="15" font-weight="600" fill="#e8e8e8">σ² = 10⁻⁶</text>
  <text x="84" y="315" font-size="13" fill="#888">안쪽 1/√(σ² + ε)</text>
  <rect x="300" y="298" width="116" height="24" rx="3" fill="#7ec8e3"/>
  <text x="428" y="315" font-size="13" font-weight="600" fill="#e8e8e8">301.5</text>
  <text x="84" y="351" font-size="13" fill="#888">바깥쪽 1/(√σ² + ε)</text>
  <rect x="300" y="334" width="380" height="24" rx="3" fill="#7777cc"/>
  <text x="692" y="351" font-size="13" font-weight="600" fill="#e8e8e8">990.1</text>

  <rect x="60" y="394" width="760" height="52" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="425" font-size="13" fill="#e8e8e8">분산이 클 때는 ε이 묻히고, ε에 가까워지면 같은 입력에 세 배 넘게 다른 배율이 곱해진다</text>
</svg>
