<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="410" rx="12" fill="#0a0a0a"/>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">틀린 답 하나를 어느 쪽에 놓을 것인가</text>
  <text x="62" y="72" font-size="13" fill="#888">검색 지표와 생성 지표를 따로 재면 실패가 이 네 칸으로 갈린다.</text>

  <text x="360" y="104" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">검색이 근거를 가져왔다</text>
  <text x="670" y="104" font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">검색이 못 가져왔다</text>

  <text x="62" y="168" font-size="12" font-weight="600" fill="#c58a55">생성이 그 근거를</text>
  <text x="62" y="188" font-size="12" font-weight="600" fill="#c58a55">실제로 썼다</text>

  <rect x="220" y="120" width="280" height="106" rx="8" fill="#12261a" stroke="#55c555" stroke-width="1.5"/>
  <text x="236" y="144" font-size="13" font-weight="600" fill="#55c555">정상</text>
  <text x="236" y="168" font-size="11" fill="#e8e8e8">검색도 생성도 제 일을 했다.</text>
  <text x="236" y="188" font-size="11" fill="#e8e8e8">여기서 틀렸다면 남은 것은</text>
  <text x="236" y="208" font-size="11" fill="#e8e8e8">답의 완성도 문제다.</text>

  <rect x="530" y="120" width="280" height="106" rx="8" fill="#2a1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="546" y="144" font-size="13" font-weight="600" fill="#e05555">검색 문제</text>
  <text x="546" y="168" font-size="11" fill="#e8e8e8">엉뚱한 문서를 충실히</text>
  <text x="546" y="188" font-size="11" fill="#e8e8e8">요약했다. 청킹·임베딩·k를</text>
  <text x="546" y="208" font-size="11" fill="#e8e8e8">차례로 본다.</text>

  <text x="62" y="292" font-size="12" font-weight="600" fill="#c58a55">근거를 무시하고</text>
  <text x="62" y="312" font-size="12" font-weight="600" fill="#c58a55">지어냈다</text>

  <rect x="220" y="244" width="280" height="106" rx="8" fill="#33260f" stroke="#c58a55" stroke-width="1.5"/>
  <text x="236" y="268" font-size="13" font-weight="600" fill="#c58a55">생성 문제</text>
  <text x="236" y="292" font-size="11" fill="#e8e8e8">근거가 손에 있는데 안 썼다.</text>
  <text x="236" y="312" font-size="11" fill="#e8e8e8">프롬프트와 모델을 보고,</text>
  <text x="236" y="332" font-size="11" fill="#e8e8e8">근거 인용을 강제해 본다.</text>

  <rect x="530" y="244" width="280" height="106" rx="8" fill="#1a1a1a" stroke="#777777" stroke-width="1.5"/>
  <text x="546" y="268" font-size="13" font-weight="600" fill="#aaaaaa">둘 다 또는 정상</text>
  <text x="546" y="292" font-size="11" fill="#e8e8e8">근거가 없어서 모른다고</text>
  <text x="546" y="312" font-size="11" fill="#e8e8e8">답했다면 정상이다.</text>
  <text x="546" y="332" font-size="11" fill="#e8e8e8">아니면 두 구간을 다 본다.</text>

  <text x="62" y="386" font-size="13" fill="#e8e8e8">오른쪽 위 칸이 가장 위험하다. 답이 근거와 잘 맞아 보이므로 자동 채점에서 높은 점수를 받는다.</text>
</svg>
