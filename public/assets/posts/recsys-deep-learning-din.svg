<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">같은 이력, 후보마다 다른 무게</text>
  <text x="62" y="68" font-size="13" fill="#888">평균은 후보와 상관없이 늘 같다. DIN은 지금 평가하는 후보를 질의로 삼아 행동마다 무게를 다시 매긴다.</text>

  <!-- left panel -->
  <rect x="62" y="100" width="360" height="250" rx="8" fill="#12151c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="86" y="134" font-size="16" font-weight="600" fill="#e8e8e8">후보: 운동화 광고</text>

  <text x="86" y="178" font-size="13" fill="#9aa4b8">농구화 구매</text>
  <rect x="190" y="166" width="190" height="16" rx="3" fill="#7ec8e3"/>
  <text x="86" y="222" font-size="13" fill="#9aa4b8">러닝화 조회</text>
  <rect x="190" y="210" width="150" height="16" rx="3" fill="#7ec8e3"/>
  <text x="86" y="266" font-size="13" fill="#9aa4b8">요리책 구매</text>
  <rect x="190" y="254" width="14" height="16" rx="3" fill="#7ec8e3"/>

  <text x="86" y="320" font-size="13" fill="#55c555">관심 벡터 ≈ 신발 쪽</text>

  <!-- right panel -->
  <rect x="458" y="100" width="360" height="250" rx="8" fill="#12151c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="482" y="134" font-size="16" font-weight="600" fill="#e8e8e8">후보: 요리책 광고</text>

  <text x="482" y="178" font-size="13" fill="#9aa4b8">농구화 구매</text>
  <rect x="586" y="166" width="14" height="16" rx="3" fill="#7777cc"/>
  <text x="482" y="222" font-size="13" fill="#9aa4b8">러닝화 조회</text>
  <rect x="586" y="210" width="10" height="16" rx="3" fill="#7777cc"/>
  <text x="482" y="266" font-size="13" fill="#9aa4b8">요리책 구매</text>
  <rect x="586" y="254" width="190" height="16" rx="3" fill="#7777cc"/>

  <text x="482" y="320" font-size="13" fill="#55c555">관심 벡터 ≈ 요리 쪽</text>

  <text x="62" y="384" font-size="13" fill="#9aa4b8">막대 길이가 그 행동에 실린 무게다. 무게의 합을 1로 맞추지 않으므로 관련 행동이 많을수록 관심 벡터도 커진다.</text>
</svg>
