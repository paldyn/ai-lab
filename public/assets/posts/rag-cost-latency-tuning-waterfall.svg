<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">시간은 검색이 아니라 생성이 먹는다</text>
  <text x="60" y="72" font-size="13" fill="#888">한 질의 3초를 쪼갠 예. 검색 쪽을 반으로 줄여도 전체는 3% 짧아진다.</text>

  <text x="60" y="102" font-size="12.5" font-weight="600" fill="#7ec8e3">검색 전체 190ms · 6%</text>

  <rect x="60" y="112" width="48" height="44" rx="6" fill="#16202a" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="108" y="112" width="712" height="44" rx="6" fill="#1a1012" stroke="#e05555" stroke-width="1.5"/>
  <text x="464" y="140" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">생성 2,810ms · 전체의 94%</text>

  <line x1="60" y1="164" x2="60" y2="228" stroke="#3a4a6e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="108" y1="164" x2="820" y2="228" stroke="#3a4a6e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="120" y="218" font-size="12" fill="#888">앞의 190ms만 펴 보면</text>

  <rect x="60" y="236" width="80" height="44" rx="6" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <rect x="140" y="236" width="160" height="44" rx="6" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <rect x="300" y="236" width="480" height="44" rx="6" fill="#101418" stroke="#e05555" stroke-width="1.5"/>
  <rect x="780" y="236" width="40" height="44" rx="6" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>

  <text x="100" y="264" font-size="12" fill="#e8e8e8" text-anchor="middle">20ms</text>
  <text x="220" y="264" font-size="12" fill="#e8e8e8" text-anchor="middle">40ms</text>
  <text x="540" y="264" font-size="12" fill="#e8e8e8" text-anchor="middle">120ms</text>
  <text x="800" y="264" font-size="12" fill="#e8e8e8" text-anchor="middle">10</text>

  <text x="100" y="302" font-size="12.5" fill="#888" text-anchor="middle">질의 임베딩</text>
  <text x="220" y="302" font-size="12.5" fill="#888" text-anchor="middle">벡터 검색</text>
  <text x="540" y="302" font-size="12.5" font-weight="600" fill="#e05555" text-anchor="middle">재순위</text>
  <text x="820" y="302" font-size="12.5" fill="#888" text-anchor="end">프롬프트 조립</text>

  <text x="60" y="344" font-size="13" fill="#888">검색 안에서는 재순위가 3분의 2를 쓴다. 그래서 「검색이 느리다」는 대개 재순위 이야기다.</text>
  <text x="60" y="374" font-size="13" fill="#7ec8e3">다만 그 재순위 덕에 근거를 절반으로 줄일 수 있으면, 생성 쪽에서 그보다 훨씬 큰 시간을 돌려받는다.</text>
</svg>
