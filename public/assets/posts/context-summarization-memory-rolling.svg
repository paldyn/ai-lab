<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <rect x="0" y="0" width="880" height="520" rx="12" fill="#0a0a0a"/>

  <defs>
    <marker id="sum-arr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">오래된 구간은 접고, 잃으면 안 되는 것은 따로 뽑는다</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">요약은 압축이고 메모리는 저장이다. 둘을 한 덩어리로 다루면 결정 사항이 요약과 함께 뭉개진다</text>

  <text x="50" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">실제로 오간 대화</text>

  <rect x="50" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <rect x="115" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <rect x="180" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <rect x="245" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <rect x="310" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <rect x="375" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <rect x="440" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <rect x="505" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <rect x="570" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="635" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="700" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="765" y="124" width="58" height="40" rx="6" fill="#14141c" stroke="#7ec8e3" stroke-width="1.5"/>

  <text x="60" y="204" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">오래된 구간</text>
  <text x="580" y="204" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#7ec8e3">최근 구간</text>

  <line x1="306" y1="172" x2="306" y2="236" stroke="#7777cc" stroke-width="2" marker-end="url(#sum-arr)"/>
  <line x1="696" y1="172" x2="696" y2="236" stroke="#7777cc" stroke-width="2" marker-end="url(#sum-arr)"/>

  <rect x="50" y="240" width="513" height="76" rx="8" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <text x="72" y="265" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">이전 구간 요약</text>
  <text x="72" y="285" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">한 덩어리로 접는다. 이 안에서 사실이 뭉개질 수 있다</text>
  <text x="72" y="303" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#9aa4b8">되돌릴 수 없음</text>

  <rect x="570" y="240" width="253" height="76" rx="8" fill="#14141c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="592" y="265" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">최근 턴 전문</text>
  <text x="592" y="285" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">손대지 않는다</text>
  <text x="592" y="303" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#9aa4b8">원문 그대로</text>

  <line x1="306" y1="316" x2="306" y2="362" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#sum-arr)"/>

  <rect x="50" y="366" width="780" height="96" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="74" y="392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">접기 전에 따로 뽑아 두는 것 — 구조화 메모리</text>
  <text x="74" y="414" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#ffffff">확정된 결정 · 사용자가 명시한 제약 · 검증된 사실 · 실패한 시도</text>
  <text x="74" y="436" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#9aa4b8">요약본과 달리 항목 단위로 갱신·삭제되고, 대화가 끝나도 남는다</text>
</svg>
