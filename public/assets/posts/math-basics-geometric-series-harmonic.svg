<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="390" rx="12" fill="#0a0a0a"/>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">항이 0 으로 가는데도 합이 한없이 커진다</text>
  <text x="60" y="74" font-size="13" fill="#888">2 의 거듭제곱 단위로 묶고, 묶음 안의 항을 전부 마지막 값으로 낮춰 잡는다</text>

  <text x="60" y="140" font-size="14" fill="#888">1 + 1/2 + 1/3 + 1/4 + 1/5 + ⋯ 를 이렇게 묶는다</text>

  <rect x="85" y="160" width="60" height="60" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="115" y="196" font-size="15" fill="#e8e8e8" text-anchor="middle">1</text>

  <rect x="159" y="160" width="60" height="60" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="189" y="196" font-size="15" fill="#e8e8e8" text-anchor="middle">1/2</text>

  <rect x="233" y="160" width="110" height="60" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="288" y="196" font-size="15" fill="#e8e8e8" text-anchor="middle">1/3 + 1/4</text>

  <rect x="357" y="160" width="200" height="60" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="457" y="196" font-size="15" fill="#e8e8e8" text-anchor="middle">1/5 + 1/6 + 1/7 + 1/8</text>

  <rect x="571" y="160" width="160" height="60" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="651" y="196" font-size="15" fill="#e8e8e8" text-anchor="middle">1/9 + ⋯ + 1/16</text>

  <rect x="745" y="160" width="50" height="60" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="770" y="196" font-size="15" fill="#888" text-anchor="middle">⋯</text>

  <line x1="159" y1="234" x2="219" y2="234" stroke="#55c555" stroke-width="1.5"/>
  <line x1="233" y1="234" x2="343" y2="234" stroke="#55c555" stroke-width="1.5"/>
  <line x1="357" y1="234" x2="557" y2="234" stroke="#55c555" stroke-width="1.5"/>
  <line x1="571" y1="234" x2="731" y2="234" stroke="#55c555" stroke-width="1.5"/>

  <text x="189" y="256" font-size="12" fill="#55c555" text-anchor="middle">= 1/2</text>
  <text x="288" y="256" font-size="12" fill="#55c555" text-anchor="middle">&gt; 1/4 + 1/4 = 1/2</text>
  <text x="457" y="256" font-size="12" fill="#55c555" text-anchor="middle">&gt; 4 × 1/8 = 1/2</text>
  <text x="651" y="256" font-size="12" fill="#55c555" text-anchor="middle">&gt; 8 × 1/16 = 1/2</text>

  <rect x="60" y="290" width="760" height="60" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="314" font-size="13" fill="#e8e8e8">묶음은 얼마든지 더 만들 수 있고 묶음마다 1/2 을 넘는다 — 1/2 을 한없이 더하는 셈이다.</text>
  <text x="84" y="336" font-size="13" fill="#e05555">항이 0 으로 가는 것만으로는 모자라다. 얼마나 빨리 작아지는가가 갈림길이다.</text>
</svg>
