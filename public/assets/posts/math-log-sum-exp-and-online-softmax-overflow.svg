<svg xmlns="http://www.w3.org/2000/svg" width="880" height="524" viewBox="0 0 880 524">
<rect width="880" height="524" rx="12" fill="#0a0a0a"/>
<text x="440" y="42" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">exp 가 살아 있는 구간은 생각보다 좁다</text>
<text x="440" y="68" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">x = (800, 799, 795) 를 그냥 넣으면 첫 항에서 터진다</text>
<rect x="90.0" y="168" width="700.0" height="46" rx="4" fill="#e05555" fill-opacity="0.14" stroke="#e05555" stroke-width="1"/>
<rect x="407.3" y="168" width="65.4" height="46" rx="4" fill="#55c555" fill-opacity="0.22" stroke="#55c555" stroke-width="1.5"/>
<text x="64" y="197" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" font-weight="600" text-anchor="end">float32</text>
<rect x="90.0" y="246" width="700.0" height="46" rx="4" fill="#e05555" fill-opacity="0.14" stroke="#e05555" stroke-width="1"/>
<rect x="178.5" y="246" width="523.0" height="46" rx="4" fill="#55c555" fill-opacity="0.22" stroke="#55c555" stroke-width="1.5"/>
<text x="64" y="275" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" font-weight="600" text-anchor="end">float64</text>
<text x="134.21052631578948" y="146" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555" text-anchor="middle">e^x 가 0 으로 잘리는 쪽</text>
<text x="745.7894736842105" y="146" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555" text-anchor="middle">e^x 가 무한대로 넘치는 쪽</text>
<text x="440" y="344" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">초록이 e^x 를 계산할 수 있는 구간이다 — float32는 ±88.72, float64는 ±709.78</text>
<line x1="734.7" y1="160" x2="734.7" y2="300" stroke="#e8e8e8" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="734.7" cy="300" r="5" fill="#e8e8e8"/>
<text x="734.7368421052631" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8" text-anchor="middle">우리 예제의 800</text>
<line x1="90.0" y1="300" x2="790.0" y2="300" stroke="#888" stroke-width="1.5"/>
<line x1="145.3" y1="296" x2="145.3" y2="304" stroke="#888" stroke-width="1.5"/>
<text x="145.26315789473685" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">-800</text>
<line x1="292.6" y1="296" x2="292.6" y2="304" stroke="#888" stroke-width="1.5"/>
<text x="292.63157894736844" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">-400</text>
<line x1="440.0" y1="296" x2="440.0" y2="304" stroke="#888" stroke-width="1.5"/>
<text x="440.0" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">0</text>
<line x1="587.4" y1="296" x2="587.4" y2="304" stroke="#888" stroke-width="1.5"/>
<text x="587.3684210526316" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">400</text>
<line x1="734.7" y1="296" x2="734.7" y2="304" stroke="#888" stroke-width="1.5"/>
<rect x="90" y="368" width="320" height="120" rx="8" fill="#000000" stroke="#e05555" stroke-width="1.5"/>
<text x="250" y="396" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">그냥 계산하면</text>
<text x="250" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555" text-anchor="middle">exp(800) → OverflowError</text>
<text x="250" y="448" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555" text-anchor="middle">exp(−800) → 0.0</text>
<text x="250" y="472" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">분모까지 0 이 되면 0/0 = NaN</text>
<rect x="470" y="368" width="320" height="120" rx="8" fill="#000000" stroke="#55c555" stroke-width="1.5"/>
<text x="630" y="396" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">최댓값 800 을 빼면</text>
<text x="630" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555" text-anchor="middle">exp(0) = 1  ·  exp(−1) = 0.3679</text>
<text x="630" y="448" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555" text-anchor="middle">exp(−5) = 0.006738</text>
<text x="630" y="472" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">가장 큰 항이 언제나 정확히 1 이다</text>
</svg>
