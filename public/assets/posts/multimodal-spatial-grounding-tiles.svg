<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="sgtArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">통째로 줄이면 사라지는 40픽셀</text>
  <text x="62" y="68" font-size="13" fill="#888">원본 폭 4,000픽셀, 모델 입력 896. 같은 나사가 몇 픽셀로 남는가.</text>

  <!-- left: whole image -->
  <text x="62" y="108" font-size="16" font-weight="600" fill="#e8e8e8">전체를 한 번에</text>
  <rect x="62" y="122" width="340" height="190" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <rect x="300" y="200" width="4" height="4" fill="#e05555"/>
  <text x="86" y="276" font-size="13" fill="#9aa4b8">4,000 → 896으로 줄인다</text>
  <text x="86" y="298" font-size="13" fill="#e05555">나사 40px → 9px</text>

  <!-- right: tiles -->
  <text x="478" y="108" font-size="16" font-weight="600" fill="#e8e8e8">겹치게 타일로 나눠</text>
  <rect x="478" y="122" width="340" height="190" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <rect x="478" y="122" width="190" height="110" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="628" y="122" width="190" height="110" fill="none" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="640" y="180" width="16" height="16" fill="#55c555"/>
  <text x="502" y="276" font-size="13" fill="#9aa4b8">타일 1,000 → 896으로 줄인다</text>
  <text x="502" y="298" font-size="13" fill="#55c555">나사 40px → 36px</text>

  <!-- steps -->
  <rect x="62" y="346" width="230" height="84" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="86" y="380" font-size="13" font-weight="600" fill="#e8e8e8">① 입력 → 타일</text>
  <text x="86" y="402" font-size="13" fill="#9aa4b8">여백 빼고 배율 되돌리기</text>

  <line x1="292" y1="388" x2="325" y2="388" stroke="#888888" stroke-width="2" marker-end="url(#sgtArr)"/>

  <rect x="325" y="346" width="230" height="84" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="349" y="380" font-size="13" font-weight="600" fill="#e8e8e8">② 타일 → 원본</text>
  <text x="349" y="402" font-size="13" fill="#9aa4b8">타일의 원본 위치를 더한다</text>

  <line x1="555" y1="388" x2="588" y2="388" stroke="#888888" stroke-width="2" marker-end="url(#sgtArr)"/>

  <rect x="588" y="346" width="230" height="84" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="612" y="380" font-size="13" font-weight="600" fill="#e8e8e8">③ 겹친 상자 정리</text>
  <text x="612" y="402" font-size="13" fill="#9aa4b8">IoU가 높으면 하나만 남긴다</text>
</svg>
