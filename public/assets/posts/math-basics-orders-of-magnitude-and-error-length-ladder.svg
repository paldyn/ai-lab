<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">길이의 사다리 — 눈금 한 칸이 10배</text>
  <text x="60" y="74" font-size="13" fill="#888">단위는 m. 축 아래 수는 10의 지수, 이름 아래 화살표 뒤의 수는 크기의 자릿수</text>
  <line x1="60" y1="230" x2="820" y2="230" stroke="#888" stroke-width="1.5"/>
  <line x1="60" y1="224" x2="60" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="60" y="254" text-anchor="middle" font-size="13" fill="#888">−10</text>
  <line x1="100" y1="224" x2="100" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="100" y="254" text-anchor="middle" font-size="13" fill="#888">−9</text>
  <line x1="140" y1="224" x2="140" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="140" y="254" text-anchor="middle" font-size="13" fill="#888">−8</text>
  <line x1="180" y1="224" x2="180" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="180" y="254" text-anchor="middle" font-size="13" fill="#888">−7</text>
  <line x1="220" y1="224" x2="220" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="220" y="254" text-anchor="middle" font-size="13" fill="#888">−6</text>
  <line x1="260" y1="224" x2="260" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="260" y="254" text-anchor="middle" font-size="13" fill="#888">−5</text>
  <line x1="300" y1="224" x2="300" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="300" y="254" text-anchor="middle" font-size="13" fill="#888">−4</text>
  <line x1="340" y1="224" x2="340" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="340" y="254" text-anchor="middle" font-size="13" fill="#888">−3</text>
  <line x1="380" y1="224" x2="380" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="380" y="254" text-anchor="middle" font-size="13" fill="#888">−2</text>
  <line x1="420" y1="224" x2="420" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="420" y="254" text-anchor="middle" font-size="13" fill="#888">−1</text>
  <line x1="460" y1="224" x2="460" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="460" y="254" text-anchor="middle" font-size="13" fill="#888">0</text>
  <line x1="500" y1="224" x2="500" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="500" y="254" text-anchor="middle" font-size="13" fill="#888">1</text>
  <line x1="540" y1="224" x2="540" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="540" y="254" text-anchor="middle" font-size="13" fill="#888">2</text>
  <line x1="580" y1="224" x2="580" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="580" y="254" text-anchor="middle" font-size="13" fill="#888">3</text>
  <line x1="620" y1="224" x2="620" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="620" y="254" text-anchor="middle" font-size="13" fill="#888">4</text>
  <line x1="660" y1="224" x2="660" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="660" y="254" text-anchor="middle" font-size="13" fill="#888">5</text>
  <line x1="700" y1="224" x2="700" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="700" y="254" text-anchor="middle" font-size="13" fill="#888">6</text>
  <line x1="740" y1="224" x2="740" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="740" y="254" text-anchor="middle" font-size="13" fill="#888">7</text>
  <line x1="780" y1="224" x2="780" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="780" y="254" text-anchor="middle" font-size="13" fill="#888">8</text>
  <line x1="820" y1="224" x2="820" y2="236" stroke="#444" stroke-width="1.5"/>
  <text x="820" y="254" text-anchor="middle" font-size="13" fill="#888">9</text>
  <line x1="60.0" y1="142" x2="60.0" y2="224" stroke="#444" stroke-width="1"/>
  <circle cx="60.0" cy="230" r="5" fill="#e8e8e8"/>
  <text x="60.0" y="116" text-anchor="start" font-size="13" font-weight="600" fill="#e8e8e8">수소 원자 지름</text>
  <text x="60.0" y="134" text-anchor="start" font-size="13" fill="#888">1×10⁻¹⁰ m → −10</text>
  <line x1="140.0" y1="194" x2="140.0" y2="224" stroke="#444" stroke-width="1"/>
  <circle cx="140.0" cy="230" r="5" fill="#7ec8e3"/>
  <text x="140.0" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#7ec8e3">물음의 길이</text>
  <text x="140.0" y="186" text-anchor="middle" font-size="13" fill="#888">10⁻⁸ m → −8</text>
  <line x1="293.8" y1="194" x2="293.8" y2="224" stroke="#444" stroke-width="1"/>
  <circle cx="293.8" cy="230" r="5" fill="#e8e8e8"/>
  <text x="293.8" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">머리카락 굵기</text>
  <text x="293.8" y="186" text-anchor="middle" font-size="13" fill="#888">7×10⁻⁵ m → −4</text>
  <line x1="469.2" y1="194" x2="469.2" y2="224" stroke="#444" stroke-width="1"/>
  <circle cx="469.2" cy="230" r="5" fill="#e8e8e8"/>
  <text x="469.2" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">사람 키</text>
  <text x="469.2" y="186" text-anchor="middle" font-size="13" fill="#888">1.7 m → 0</text>
  <line x1="684.1" y1="194" x2="684.1" y2="224" stroke="#444" stroke-width="1"/>
  <circle cx="684.1" cy="230" r="5" fill="#e8e8e8"/>
  <text x="684.1" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">서울–부산</text>
  <text x="684.1" y="186" text-anchor="middle" font-size="13" fill="#888">4×10⁵ m → 6</text>
  <line x1="803.4" y1="142" x2="803.4" y2="224" stroke="#444" stroke-width="1"/>
  <circle cx="803.4" cy="230" r="5" fill="#e8e8e8"/>
  <text x="803.4" y="116" text-anchor="end" font-size="13" font-weight="600" fill="#e8e8e8">지구–달</text>
  <text x="803.4" y="134" text-anchor="end" font-size="13" fill="#888">3.844×10⁸ m → 9</text>
  <line x1="764.1" y1="236" x2="764.1" y2="284" stroke="#444" stroke-width="1"/>
  <circle cx="764.1" cy="230" r="5" fill="#e8e8e8"/>
  <text x="764.1" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">지구 둘레</text>
  <text x="764.1" y="318" text-anchor="middle" font-size="13" fill="#888">4.0×10⁷ m → 8</text>
  <rect x="60" y="344" width="760" height="76" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="84" y="374" font-size="16" font-weight="600" fill="#e8e8e8">10⁻⁸ m 는 원자 지름의 100배, 사람 키보다는 자릿수가 8 아래</text>
  <text x="84" y="398" font-size="13" fill="#888">몇 배인가는 지수의 차로 읽는다: −8 − (−10) = 2 이므로 10² 배</text>
</svg>
