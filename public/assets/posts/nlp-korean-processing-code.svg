<svg width="880" height="400" viewBox="0 0 880 400"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">Kiwi + KLUE-RoBERTa 한국어 NLP 실전</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">형태소 분석 → NER 파이프라인</text>

  <!-- Left: Kiwi morphological analysis -->
  <text x="220" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">① Kiwi 형태소 분석</text>
  <rect x="40" y="108" width="360" height="252" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="56" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">kiwipiepy </tspan><tspan fill="#7ec8e3">import </tspan><tspan fill="#ffffff">Kiwi</tspan></text>

  <text x="56" y="153" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">kiwi </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">Kiwi()</tspan></text>

  <text x="56" y="177" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">text </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ce9178">&quot;삼성전자가 반도체 시장을</tspan></text>
  <text x="56" y="195" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">       선도하고 있다."</text>

  <text x="56" y="219" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">result </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">kiwi.analyze(text)</tspan></text>
  <text x="56" y="237" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">for </tspan><tspan fill="#ffffff">token </tspan><tspan fill="#7ec8e3">in </tspan><tspan fill="#ffffff">result[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">][</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">]:</tspan></text>
  <text x="56" y="255" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    print(token.form, token.tag)</text>
  <text x="56" y="279" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># 삼성전자 NNP</text>
  <text x="56" y="297" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># 가 JKS</text>
  <text x="56" y="315" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># 반도체 NNG</text>
  <text x="56" y="333" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># 시장 NNG</text>
  <text x="56" y="351" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># 선도 NNG   하 XSV ...</text>

  <!-- Right: KLUE NER -->
  <text x="660" y="96" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">② KLUE-RoBERTa NER</text>
  <rect x="480" y="108" width="360" height="252" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="496" y="129" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">from </tspan><tspan fill="#ffffff">transformers </tspan><tspan fill="#7ec8e3">import</tspan></text>
  <text x="496" y="147" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    pipeline</text>

  <text x="496" y="171" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">ner </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">pipeline(</tspan></text>
  <text x="496" y="189" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    "token-classification"</text>
  <text x="496" y="207" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">    model=</tspan><tspan fill="#ce9178">&quot;snunlp/KR-FinBert&quot;</tspan></text>
  <text x="496" y="225" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    aggregation_strategy=</text>
  <text x="496" y="243" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">        "simple"</text>
  <text x="496" y="261" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>

  <text x="496" y="285" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#ffffff">entities </tspan><tspan fill="#7ec8e3">= </tspan><tspan fill="#ffffff">ner(</tspan></text>
  <text x="496" y="303" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">    "삼성전자가 서울 강남구에</text>
  <text x="496" y="321" fill="#ce9178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">     신사옥을 건립했다."</text>
  <text x="496" y="339" fill="#ffffff" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">)</text>
  <text x="496" y="351" fill="#9aa4b8" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"># 삼성전자→ORG, 서울→LOC</text>

  <!-- Bottom -->
  <text x="440" y="382" text-anchor="middle" fill="#888" font-size="12">KLUE 벤치마크: NER F1 ~0.88, DP UAS ~0.90, MRC EM ~85 (RoBERTa-large)</text>
</svg>
