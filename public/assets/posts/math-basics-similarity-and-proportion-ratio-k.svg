<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="412" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">닮음비가 k 이면 넓이비는 k², 부피비는 k³</text>
  <text x="60" y="82" font-size="13" fill="#888">길이를 2배로 늘리면 넓이는 4배, 부피는 8배가 된다</text>

  <rect x="60" y="120" width="214" height="232" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="167" y="150" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">길이</text>
  <line x1="95" y1="235" x2="145" y2="235" stroke="#7777cc" stroke-width="6"/>
  <text x="120" y="258" font-size="13" fill="#888" text-anchor="middle">1</text>
  <line x1="95" y1="285" x2="195" y2="285" stroke="#7ec8e3" stroke-width="6"/>
  <text x="145" y="308" font-size="13" fill="#888" text-anchor="middle">2</text>
  <text x="167" y="330" font-size="15" fill="#7ec8e3" text-anchor="middle">2배</text>

  <rect x="334" y="120" width="214" height="232" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="441" y="150" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">넓이</text>
  <rect x="366" y="240" width="40" height="40" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="2"/>
  <rect x="436" y="200" width="80" height="80" fill="#7ec8e3" fill-opacity="0.2" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="476" y1="200" x2="476" y2="280" stroke="#7ec8e3" stroke-width="1"/>
  <line x1="436" y1="240" x2="516" y2="240" stroke="#7ec8e3" stroke-width="1"/>
  <text x="386" y="302" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="476" y="302" font-size="13" fill="#888" text-anchor="middle">2</text>
  <text x="441" y="330" font-size="15" fill="#7ec8e3" text-anchor="middle">4배 = 2²</text>

  <rect x="606" y="120" width="214" height="232" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="713" y="150" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">부피</text>
  <polygon points="640,246 672,246 686,232 654,232" fill="#7777cc" fill-opacity="0.35" stroke="#7777cc" stroke-width="1.5"/>
  <polygon points="672,246 686,232 686,264 672,278" fill="#7777cc" fill-opacity="0.15" stroke="#7777cc" stroke-width="1.5"/>
  <rect x="640" y="246" width="32" height="32" fill="#7777cc" fill-opacity="0.25" stroke="#7777cc" stroke-width="1.5"/>
  <polygon points="712,214 776,214 804,186 740,186" fill="#7ec8e3" fill-opacity="0.3" stroke="#7ec8e3" stroke-width="1.5"/>
  <polygon points="776,214 804,186 804,250 776,278" fill="#7ec8e3" fill-opacity="0.12" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="712" y="214" width="64" height="64" fill="#7ec8e3" fill-opacity="0.2" stroke="#7ec8e3" stroke-width="1.5"/>
  <line x1="744" y1="214" x2="744" y2="278" stroke="#7ec8e3" stroke-width="1"/>
  <line x1="712" y1="246" x2="776" y2="246" stroke="#7ec8e3" stroke-width="1"/>
  <text x="663" y="302" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="744" y="302" font-size="13" fill="#888" text-anchor="middle">2</text>
  <text x="713" y="330" font-size="15" fill="#7ec8e3" text-anchor="middle">8배 = 2³</text>
</svg>
