<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="tbarr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">이름을 떼면 남는 것이 수의 직사각형</text>

  <text x="60" y="86" font-size="16" font-weight="600" fill="#e8e8e8">성적표</text>
  <text x="132" y="118" font-size="13" fill="#888" text-anchor="middle">국어</text>
  <text x="192" y="118" font-size="13" fill="#888" text-anchor="middle">영어</text>
  <text x="252" y="118" font-size="13" fill="#888" text-anchor="middle">수학</text>
  <text x="92" y="150" font-size="13" fill="#888" text-anchor="end">지수</text>
  <text x="92" y="182" font-size="13" fill="#888" text-anchor="end">민호</text>
  <text x="92" y="214" font-size="13" fill="#888" text-anchor="end">서연</text>
  <rect x="102" y="128" width="180" height="96" fill="#101820" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="162" y1="128" x2="162" y2="224" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="222" y1="128" x2="222" y2="224" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="102" y1="160" x2="282" y2="160" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="102" y1="192" x2="282" y2="192" stroke="#3a4a6e" stroke-width="1"/>
  <text x="132" y="150" font-size="15" fill="#e8e8e8" text-anchor="middle">90</text>
  <text x="192" y="150" font-size="15" fill="#e8e8e8" text-anchor="middle">75</text>
  <text x="252" y="150" font-size="15" fill="#e8e8e8" text-anchor="middle">88</text>
  <text x="132" y="182" font-size="15" fill="#e8e8e8" text-anchor="middle">70</text>
  <text x="192" y="182" font-size="15" fill="#e8e8e8" text-anchor="middle">92</text>
  <text x="252" y="182" font-size="15" fill="#e8e8e8" text-anchor="middle">64</text>
  <text x="132" y="214" font-size="15" fill="#e8e8e8" text-anchor="middle">85</text>
  <text x="192" y="214" font-size="15" fill="#e8e8e8" text-anchor="middle">80</text>
  <text x="252" y="214" font-size="15" fill="#e8e8e8" text-anchor="middle">95</text>

  <path d="M 300 176 L 372 176" stroke="#7ec8e3" stroke-width="2" marker-end="url(#tbarr)"/>
  <text x="336" y="158" font-size="13" fill="#7ec8e3" text-anchor="middle">이름을 뗀다</text>

  <text x="400" y="140" font-size="34" fill="#888">(</text>
  <text x="440" y="150" font-size="15" fill="#e8e8e8" text-anchor="middle">90</text>
  <text x="490" y="150" font-size="15" fill="#e8e8e8" text-anchor="middle">75</text>
  <text x="540" y="150" font-size="15" fill="#e8e8e8" text-anchor="middle">88</text>
  <text x="440" y="182" font-size="15" fill="#e8e8e8" text-anchor="middle">70</text>
  <text x="490" y="182" font-size="15" fill="#e8e8e8" text-anchor="middle">92</text>
  <text x="540" y="182" font-size="15" fill="#e8e8e8" text-anchor="middle">64</text>
  <text x="440" y="214" font-size="15" fill="#e8e8e8" text-anchor="middle">85</text>
  <text x="490" y="214" font-size="15" fill="#e8e8e8" text-anchor="middle">80</text>
  <text x="540" y="214" font-size="15" fill="#e8e8e8" text-anchor="middle">95</text>
  <path d="M 408 128 L 400 128 L 400 224 L 408 224" stroke="#888" stroke-width="1.5" fill="none"/>
  <path d="M 566 128 L 574 128 L 574 224 L 566 224" stroke="#888" stroke-width="1.5" fill="none"/>
  <text x="600" y="182" font-size="13" fill="#888">3 × 3 행렬</text>

  <text x="60" y="286" font-size="16" font-weight="600" fill="#e8e8e8">흑백 이미지</text>
  <rect x="102" y="300" width="60" height="30" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="162" y="300" width="60" height="30" fill="#808080" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="222" y="300" width="60" height="30" fill="#ffffff" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="102" y="330" width="60" height="30" fill="#404040" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="162" y="330" width="60" height="30" fill="#c8c8c8" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="222" y="330" width="60" height="30" fill="#1e1e1e" stroke="#3a4a6e" stroke-width="1"/>

  <path d="M 300 336 L 372 336" stroke="#7ec8e3" stroke-width="2" marker-end="url(#tbarr)"/>
  <text x="336" y="318" font-size="13" fill="#7ec8e3" text-anchor="middle">밝기를 적는다</text>

  <text x="440" y="322" font-size="15" fill="#e8e8e8" text-anchor="middle">0</text>
  <text x="490" y="322" font-size="15" fill="#e8e8e8" text-anchor="middle">128</text>
  <text x="540" y="322" font-size="15" fill="#e8e8e8" text-anchor="middle">255</text>
  <text x="440" y="352" font-size="15" fill="#e8e8e8" text-anchor="middle">64</text>
  <text x="490" y="352" font-size="15" fill="#e8e8e8" text-anchor="middle">200</text>
  <text x="540" y="352" font-size="15" fill="#e8e8e8" text-anchor="middle">30</text>
  <path d="M 408 300 L 400 300 L 400 360 L 408 360" stroke="#888" stroke-width="1.5" fill="none"/>
  <path d="M 566 300 L 574 300 L 574 360 L 566 360" stroke="#888" stroke-width="1.5" fill="none"/>
  <text x="600" y="336" font-size="13" fill="#888">2 × 3 행렬</text>

  <text x="60" y="398" font-size="13" fill="#888">둘 다 자리 자체가 뜻을 갖습니다 — 첫 행이 누구인지, 첫 열이 어느 줄인지만 밖에 적어 두면 됩니다.</text>
