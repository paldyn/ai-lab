<text x="60" y="386" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">B_crit = σ² / ‖∇L‖² 이다 — 잡음이 신호보다 얼마나 큰가로 정해진다.</text>
<text x="60" y="406" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">이 지점을 넘어서면 GPU 를 더 붙여도 스텝당 진전이 늘지 않는다. 배치가 아니라 스텝 수를 늘려야 한다.</text>
