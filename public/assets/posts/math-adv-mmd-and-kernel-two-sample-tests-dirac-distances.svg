<text x="616.0" y="150.0" font-size="13" fill="#7777cc">W₁ = |θ|</text>
<text x="610.5" y="244.6" font-size="13" fill="#7ec8e3">MMD = √(2(1 − e^(−θ²/2))) → √2</text>
