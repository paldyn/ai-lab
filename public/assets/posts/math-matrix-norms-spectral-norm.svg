<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="430" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">‖A‖₂ 는 단위원에서 가장 멀리 가는 거리다</text>
  <text x="60" y="70" font-size="13" fill="#888">길이 1인 벡터를 전부 넣어 보고 나온 것 중 가장 긴 것 — 그 값이 σ₁ 이다</text>

  <defs>
    <marker id="mn-g" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="mn-b" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="mn-a" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="50" y="96" width="330" height="240" rx="10" fill="#101820" stroke="#7777cc" stroke-width="1.5"/>
  <text x="215" y="124" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">넣는 것 — 단위원</text>
  <circle cx="215" cy="228" r="66" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="215" y1="228" x2="271" y2="193" stroke="#55c555" stroke-width="2.5" marker-end="url(#mn-g)"/>
  <line x1="215" y1="228" x2="169" y2="180" stroke="#7777cc" stroke-width="2.5" marker-end="url(#mn-b)"/>
  <text x="278" y="182" font-size="13" font-weight="600" fill="#55c555">v₁</text>
  <text x="163" y="166" font-size="13" font-weight="600" fill="#7777cc" text-anchor="end">다른 방향</text>
  <text x="215" y="318" font-size="13" fill="#9aa4b8" text-anchor="middle">전부 길이 1이다</text>

  <line x1="396" y1="216" x2="482" y2="216" stroke="#888" stroke-width="2" marker-end="url(#mn-a)"/>
  <text x="439" y="202" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">A</text>

  <rect x="500" y="96" width="330" height="240" rx="10" fill="#101820" stroke="#55c555" stroke-width="1.5"/>
  <text x="665" y="124" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">나온 것 — 타원</text>
  <g transform="rotate(-30 665 228)">
    <ellipse cx="665" cy="228" rx="118" ry="40" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
    <line x1="665" y1="228" x2="783" y2="228" stroke="#55c555" stroke-width="3" marker-end="url(#mn-g)"/>
  </g>
  <line x1="665" y1="228" x2="620" y2="180" stroke="#7777cc" stroke-width="2.5" marker-end="url(#mn-b)"/>
  <text x="816" y="150" font-size="14" font-weight="600" fill="#55c555" text-anchor="end">σ₁ — 가장 길다</text>
  <text x="606" y="164" font-size="13" font-weight="600" fill="#7777cc" text-anchor="end">더 짧다</text>
  <text x="665" y="318" font-size="13" fill="#9aa4b8" text-anchor="middle">길이가 방향마다 다르다</text>

  <rect x="50" y="352" width="780" height="62" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="74" y="376" font-size="14" fill="#e8e8e8">최댓값이 상한이 아니라 실제로 도달된다는 점이 중요하다 — x = v₁ 에서 정확히 σ₁ 이 나온다.</text>
  <text x="74" y="400" font-size="13" fill="#9aa4b8">U와 Vᵀ는 길이를 안 바꾸므로 늘이는 일은 Σ 혼자 하고, Σ의 최댓값이 곧 σ₁ 이다.</text>
</svg>
