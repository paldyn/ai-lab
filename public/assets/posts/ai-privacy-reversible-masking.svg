<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <defs>
    <marker id="arrRed" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">가역 마스킹의 왕복</text>
  <text x="440" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#888" text-anchor="middle">자리표로 바꿔 보내고, 대응표로 되돌린다</text>

  <!-- Our server (container) -->
  <rect x="316" y="110" width="248" height="330" rx="10" fill="#0d1a0a" stroke="#55c555" stroke-width="2"/>
  <text x="440" y="136" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#55c555" text-anchor="middle">우리 서버</text>

  <!-- masking -->
  <rect x="334" y="152" width="212" height="70" rx="6" fill="#0a1a0a" stroke="#55c555" stroke-width="1" stroke-opacity="0.5"/>
  <text x="440" y="174" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">2 · 마스킹</text>
  <text x="440" y="192" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">정규식 + 개체명 인식</text>
  <text x="440" y="210" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">이름을 [고객명_1]로</text>

  <!-- restore -->
  <rect x="334" y="246" width="212" height="70" rx="6" fill="#0a1a0a" stroke="#55c555" stroke-width="1" stroke-opacity="0.5"/>
  <text x="440" y="268" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">4 · 복원</text>
  <text x="440" y="286" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">대응표로 자리표를</text>
  <text x="440" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">실제 이름으로 되돌린다</text>

  <!-- lookup table -->
  <rect x="334" y="330" width="212" height="88" rx="6" fill="#100d1a" stroke="#7777cc" stroke-width="1"/>
  <text x="440" y="352" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7777cc" text-anchor="middle">대응표</text>
  <text x="440" y="372" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e8e8e8" text-anchor="middle">[고객명_1] = 김민수</text>
  <text x="440" y="390" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">원본과 같은 등급으로</text>
  <text x="440" y="408" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">수명은 짧게</text>

  <!-- 1. user input -->
  <rect x="60" y="152" width="200" height="70" rx="8" fill="#1a100a" stroke="#e05555" stroke-width="1"/>
  <text x="160" y="174" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">1 · 사용자 입력</text>
  <text x="160" y="192" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e8e8e8" text-anchor="middle">김민수 고객님이</text>
  <text x="160" y="210" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e8e8e8" text-anchor="middle">문의를 남겼다</text>

  <!-- 5. draft out -->
  <rect x="60" y="246" width="200" height="70" rx="8" fill="#0d1620" stroke="#7ec8e3" stroke-width="1"/>
  <text x="160" y="268" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">5 · 답장 초안</text>
  <text x="160" y="286" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e8e8e8" text-anchor="middle">실제 이름이 들어간</text>
  <text x="160" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e8e8e8" text-anchor="middle">초안이 나간다</text>

  <!-- 3. model -->
  <rect x="620" y="152" width="200" height="158" rx="8" fill="#100d1a" stroke="#7777cc" stroke-width="1"/>
  <text x="720" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7777cc" text-anchor="middle">3 · 모델</text>
  <text x="720" y="202" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">받는 것</text>
  <text x="720" y="222" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e8e8e8" text-anchor="middle">[고객명_1] 고객님이</text>
  <text x="720" y="242" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e8e8e8" text-anchor="middle">원본 이름은 안 나간다</text>
  <line x1="640" y1="256" x2="800" y2="256" stroke="#7777cc" stroke-width="1" stroke-opacity="0.35"/>
  <text x="720" y="272" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">돌려주는 것</text>
  <text x="720" y="296" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e8e8e8" text-anchor="middle">자리표를 그대로 쓴 답</text>

  <!-- arrows: out -->
  <line x1="260" y1="187" x2="316" y2="187" stroke="#e05555" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="288" y="171" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e05555" text-anchor="middle">원문</text>
  <line x1="564" y1="187" x2="620" y2="187" stroke="#55c555" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="592" y="171" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#55c555" text-anchor="middle">자리표</text>

  <!-- arrows: back -->
  <line x1="620" y1="281" x2="564" y2="281" stroke="#55c555" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="592" y="265" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#55c555" text-anchor="middle">응답</text>
  <line x1="316" y1="281" x2="260" y2="281" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="288" y="265" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#7ec8e3" text-anchor="middle">복원</text>

  <!-- Bottom note -->
  <text x="440" y="468" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">되돌릴 자리와 아닌 자리를 가르는 질문 하나 — 그 사람을 다시 지목해야 업무가 되는가</text>
</svg>
