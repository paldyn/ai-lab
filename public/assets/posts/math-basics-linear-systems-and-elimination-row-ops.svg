<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="400" fill="#0a0a0a" rx="12"/>
  <text x="60" y="46" fill="#e8e8e8" font-size="22" font-weight="700">해를 바꾸지 않는 세 가지 행 연산</text>
  <text x="60" y="72" fill="#888" font-size="13">이 셋만으로 어떤 연립방정식도 사다리꼴로 만들 수 있습니다.</text>

  <!-- Three boxes side by side -->
  <g>
    <rect x="60" y="110" width="240" height="260" fill="#111827" stroke="#3a4a6e" stroke-width="1" rx="8"/>
    <text x="180" y="140" fill="#7ec8e3" font-size="15" font-weight="700" text-anchor="middle">① 두 행 맞바꾸기</text>
    <text x="180" y="164" fill="#e8e8e8" font-size="12" text-anchor="middle">$$R_i \leftrightarrow R_j$$</text>
    <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="14" fill="#e8e8e8" text-anchor="middle">
      <text x="180" y="200">R₁: 1 2 3</text>
      <text x="180" y="220">R₂: 4 5 6</text>
    </g>
    <text x="180" y="248" fill="#888" font-size="18" text-anchor="middle">↓</text>
    <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="14" fill="#55c555" text-anchor="middle" font-weight="700">
      <text x="180" y="278">R₁: 4 5 6</text>
      <text x="180" y="298">R₂: 1 2 3</text>
    </g>
    <text x="180" y="340" fill="#888" font-size="11" text-anchor="middle">방정식 두 개의</text>
    <text x="180" y="357" fill="#888" font-size="11" text-anchor="middle">순서만 바꾼 것</text>
  </g>

  <g>
    <rect x="320" y="110" width="240" height="260" fill="#111827" stroke="#3a4a6e" stroke-width="1" rx="8"/>
    <text x="440" y="140" fill="#7ec8e3" font-size="15" font-weight="700" text-anchor="middle">② 한 행을 0이 아닌 수로 곱하기</text>
    <text x="440" y="164" fill="#e8e8e8" font-size="12" text-anchor="middle">$$R_i \to c \cdot R_i \ (c \ne 0)$$</text>
    <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="14" fill="#e8e8e8" text-anchor="middle">
      <text x="440" y="200">R₁: 2 4 6</text>
    </g>
    <text x="440" y="248" fill="#888" font-size="18" text-anchor="middle">× 1/2</text>
    <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="14" fill="#55c555" text-anchor="middle" font-weight="700">
      <text x="440" y="298">R₁: 1 2 3</text>
    </g>
    <text x="440" y="340" fill="#888" font-size="11" text-anchor="middle">양변에 같은 수 곱한 것</text>
    <text x="440" y="357" fill="#888" font-size="11" text-anchor="middle">(0으로 곱하면 정보가 사라짐)</text>
  </g>

  <g>
    <rect x="580" y="110" width="240" height="260" fill="#111827" stroke="#3a4a6e" stroke-width="1" rx="8"/>
    <text x="700" y="140" fill="#7ec8e3" font-size="15" font-weight="700" text-anchor="middle">③ 한 행의 몇 배를 다른 행에</text>
    <text x="700" y="164" fill="#e8e8e8" font-size="12" text-anchor="middle">$$R_j \to R_j + c \cdot R_i$$</text>
    <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="14" fill="#e8e8e8" text-anchor="middle">
      <text x="700" y="200">R₁: 1 2 3</text>
      <text x="700" y="220">R₂: 2 5 8</text>
    </g>
    <text x="700" y="248" fill="#888" font-size="14" text-anchor="middle">R₂ − 2·R₁</text>
    <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="14" fill="#55c555" text-anchor="middle" font-weight="700">
      <text x="700" y="278">R₁: 1 2 3</text>
      <text x="700" y="298">R₂: 0 1 2</text>
    </g>
    <text x="700" y="340" fill="#888" font-size="11" text-anchor="middle">한 방정식으로 다른 방정식의</text>
    <text x="700" y="357" fill="#888" font-size="11" text-anchor="middle">한 미지수를 없애는 것</text>
  </g>
</svg>
