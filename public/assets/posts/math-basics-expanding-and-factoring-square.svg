<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="580" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">(a+b)² 는 왜 a²+b² 가 아닌가</text>
  <text x="60" y="82" font-size="13" fill="#888">한 변이 a+b 인 정사각형을 잘라 보면 네 조각이 나온다 — 가운데 두 조각이 2ab 다</text>

  <text x="250" y="112" font-size="13" fill="#888" text-anchor="middle">a</text>
  <text x="410" y="112" font-size="13" fill="#888" text-anchor="middle">b</text>

  <rect x="150" y="130" width="200" height="200" fill="#7ec8e3" fill-opacity="0.18" stroke="#666" stroke-width="1.5"/>
  <rect x="350" y="130" width="120" height="200" fill="#7777cc" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
  <rect x="150" y="330" width="200" height="120" fill="#7777cc" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
  <rect x="350" y="330" width="120" height="120" fill="#55c555" fill-opacity="0.18" stroke="#666" stroke-width="1.5"/>

  <text x="250" y="238" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">a²</text>
  <text x="410" y="238" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">ab</text>
  <text x="250" y="398" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">ab</text>
  <text x="410" y="398" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">b²</text>

  <text x="128" y="236" font-size="13" fill="#888" text-anchor="end">a</text>
  <text x="128" y="396" font-size="13" fill="#888" text-anchor="end">b</text>
  <text x="250" y="480" font-size="13" fill="#888" text-anchor="middle">a</text>
  <text x="410" y="480" font-size="13" fill="#888" text-anchor="middle">b</text>

  <rect x="530" y="130" width="290" height="130" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="554" y="158" font-size="13" fill="#888">네 조각을 다 더하면</text>
  <text x="554" y="192" font-size="18" fill="#e8e8e8">a² + ab + ab + b²</text>
  <text x="554" y="228" font-size="18" font-weight="700" fill="#55c555">= a² + 2ab + b²</text>
  <text x="554" y="250" font-size="12" fill="#888">가운데 두 조각이 같은 크기다</text>

  <rect x="530" y="290" width="290" height="106" rx="6" fill="#101010" stroke="#e05555" stroke-width="1.5"/>
  <text x="554" y="318" font-size="13" fill="#e05555">a² + b² 라고 적으면</text>
  <text x="554" y="352" font-size="18" fill="#e8e8e8">2ab 만큼이 빠진다</text>
  <text x="554" y="380" font-size="12" fill="#888">그림에서 보라색 두 칸을 통째로 버린 것</text>

  <rect x="60" y="500" width="760" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="524" font-size="13" font-weight="600" fill="#e8e8e8">공식을 잊으면 이 사각형을 다시 그리면 된다</text>
  <text x="84" y="544" font-size="13" fill="#888">(a−b)² 도 같은 그림에서 나온다 — 큰 사각형에서 두 띠를 빼면 b² 를 두 번 뺀 셈이라 한 번 되돌려 준다</text>
</svg>
