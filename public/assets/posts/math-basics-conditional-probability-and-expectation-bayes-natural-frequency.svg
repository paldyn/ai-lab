<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 480" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<rect x="0" y="0" width="880" height="480" rx="12" fill="#0a0a0a"/>
<text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">만 명을 넷으로 갈라 놓고 센다</text>
<text x="440" y="70" text-anchor="middle" font-size="13" fill="#888">유병률 1%, 민감도 99%, 특이도 95%</text>
<defs><marker id="ar" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/></marker></defs>
<rect x="60" y="220" width="160" height="60" rx="8" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="140" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">검사받는 사람</text>
<text x="140" y="264" text-anchor="middle" font-size="13" fill="#888">10,000명</text>
<rect x="300" y="130" width="190" height="60" rx="8" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="395" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">병이 있다</text>
<text x="395" y="174" text-anchor="middle" font-size="13" fill="#888">100명 · 1%</text>
<rect x="300" y="300" width="190" height="60" rx="8" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="395" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">병이 없다</text>
<text x="395" y="344" text-anchor="middle" font-size="13" fill="#888">9,900명 · 99%</text>
<rect x="570" y="84" width="250" height="60" rx="8" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
<text x="695" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#7ec8e3">양성 99명</text>
<text x="695" y="128" text-anchor="middle" font-size="13" fill="#888">민감도 99% — 제대로 잡음</text>
<rect x="570" y="176" width="250" height="60" rx="8" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="695" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">음성 1명</text>
<text x="695" y="220" text-anchor="middle" font-size="13" fill="#888">놓친 사람</text>
<rect x="570" y="268" width="250" height="60" rx="8" fill="none" stroke="#e05555" stroke-width="1.5"/>
<text x="695" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#e05555">양성 495명</text>
<text x="695" y="312" text-anchor="middle" font-size="13" fill="#888">특이도 95% — 5%가 잘못 양성</text>
<rect x="570" y="360" width="250" height="60" rx="8" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="695" y="384" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">음성 9,405명</text>
<text x="695" y="404" text-anchor="middle" font-size="13" fill="#888">제대로 음성</text>
<line x1="220" y1="250" x2="300" y2="160" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>
<line x1="220" y1="250" x2="300" y2="330" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>
<line x1="490" y1="160" x2="570" y2="114" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>
<line x1="490" y1="160" x2="570" y2="206" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>
<line x1="490" y1="330" x2="570" y2="298" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>
<line x1="490" y1="330" x2="570" y2="390" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>
<text x="440" y="452" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">양성은 99 + 495 = 594명. 그중 실제로 병인 사람은 99명 — 99 ÷ 594 ≈ 16.7%</text>
</svg>
