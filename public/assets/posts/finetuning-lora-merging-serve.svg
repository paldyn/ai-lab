<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="412" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="lm-blue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="lm-green" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">얹은 채로 서빙할 것인가, 미리 더할 것인가</text>
  <text x="62" y="72" font-size="13" fill="#888">계산 결과는 같다. 다른 것은 언제 더하느냐이고, 그 차이가 서빙 구조를 가른다.</text>

  <text x="62" y="158" font-size="16" font-weight="600" fill="#7ec8e3">얹기</text>

  <rect x="170" y="120" width="180" height="64" rx="6" fill="#101c2c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="260" y="146" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">베이스 가중치</text>
  <text x="260" y="166" font-size="11" fill="#aaaaaa" text-anchor="middle">그대로 둔다</text>
  <line x1="350" y1="152" x2="400" y2="152" stroke="#7ec8e3" stroke-width="2" marker-end="url(#lm-blue)"/>

  <rect x="400" y="120" width="180" height="64" rx="6" fill="#101c2c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="490" y="146" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">어댑터 두 행렬</text>
  <text x="490" y="166" font-size="11" fill="#aaaaaa" text-anchor="middle">따로 들고 있다</text>
  <line x1="580" y1="152" x2="630" y2="152" stroke="#7ec8e3" stroke-width="2" marker-end="url(#lm-blue)"/>

  <rect x="630" y="120" width="180" height="64" rx="6" fill="#101c2c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="720" y="146" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">추론 때 더한다</text>
  <text x="720" y="166" font-size="11" fill="#aaaaaa" text-anchor="middle">요청마다 골라 쓴다</text>

  <text x="170" y="212" font-size="12" fill="#888">어댑터를 바꿔 끼울 수 있다. 대신 층마다 계산이 조금 늘고 메모리를 더 쓴다.</text>

  <text x="62" y="288" font-size="16" font-weight="600" fill="#55c555">합치기</text>

  <rect x="170" y="250" width="180" height="64" rx="6" fill="#12261a" stroke="#55c555" stroke-width="1.5"/>
  <text x="260" y="276" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">베이스 가중치</text>
  <text x="260" y="296" font-size="11" fill="#aaaaaa" text-anchor="middle">여기에 더한다</text>
  <line x1="350" y1="282" x2="400" y2="282" stroke="#55c555" stroke-width="2" marker-end="url(#lm-green)"/>

  <rect x="400" y="250" width="180" height="64" rx="6" fill="#12261a" stroke="#55c555" stroke-width="1.5"/>
  <text x="490" y="276" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">한 번만 계산</text>
  <text x="490" y="296" font-size="11" fill="#aaaaaa" text-anchor="middle">배포 전에 끝낸다</text>
  <line x1="580" y1="282" x2="630" y2="282" stroke="#55c555" stroke-width="2" marker-end="url(#lm-green)"/>

  <rect x="630" y="250" width="180" height="64" rx="6" fill="#12261a" stroke="#55c555" stroke-width="1.5"/>
  <text x="720" y="276" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">가중치 하나</text>
  <text x="720" y="296" font-size="11" fill="#aaaaaa" text-anchor="middle">평범한 모델이 된다</text>

  <text x="170" y="342" font-size="12" fill="#888">추가 연산이 없고 어떤 추론 엔진에나 올라간다. 대신 바꿔 끼울 수 없다.</text>

  <text x="62" y="390" font-size="13" fill="#e8e8e8">고르는 기준은 하나다 — 요청마다 다른 어댑터를 쓸 일이 있는가.</text>
</svg>
