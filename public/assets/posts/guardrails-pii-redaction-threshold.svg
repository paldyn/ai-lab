<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <defs>
    <marker id="thrArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">놓친 것과 과하게 지운 것은 함께 움직인다</text>
  <text x="60" y="76" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">표본 300건에 사람이 표시한 개인정보 조각 1,200개</text>

  <text x="752" y="113" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">놓친 110개</text>

  <text x="60" y="152" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">실제 1,200개</text>
  <rect x="180" y="125" width="545" height="44" rx="6" fill="#101c10" stroke="#55c555" stroke-width="1.5"/>
  <text x="452" y="152" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">탐지기가 잡은 1,090개</text>
  <rect x="725" y="125" width="55" height="44" rx="6" fill="#1c1010" stroke="#e05555" stroke-width="1.5"/>

  <text x="60" y="228" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">표시 1,150개</text>
  <rect x="180" y="201" width="545" height="44" rx="6" fill="#101c10" stroke="#55c555" stroke-width="1.5"/>
  <text x="452" y="228" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">진짜였던 1,090개</text>
  <rect x="725" y="201" width="30" height="44" rx="6" fill="#14121c" stroke="#7777cc" stroke-width="1.5"/>

  <text x="740" y="269" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">엉뚱하게 지운 60개</text>

  <text x="60" y="308" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">재현율 1,090 ÷ 1,200 = 90.8%</text>
  <text x="400" y="308" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">정밀도 1,090 ÷ 1,150 = 94.8%</text>

  <text x="60" y="344" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">탐지기는 하나를 쓰고, 그 뒤의 결정만 목적지별로 가른다</text>

  <line x1="235" y1="356" x2="235" y2="380" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#thrArr)"/>
  <line x1="645" y1="356" x2="645" y2="380" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#thrArr)"/>

  <rect x="60" y="380" width="350" height="92" rx="8" fill="#12161c" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="235" y="408" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">로그로 가는 경로</text>
  <text x="235" y="432" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">임계값을 낮춰 재현율을 올린다</text>
  <text x="235" y="454" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">60개를 더 지워도 잃는 것이 거의 없다</text>

  <rect x="470" y="380" width="350" height="92" rx="8" fill="#12161c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="645" y="408" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">모델로 가는 경로</text>
  <text x="645" y="432" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">임계값을 높여 오탐을 줄인다</text>
  <text x="645" y="454" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">오탐이 200개로 늘면 답이 망가진다</text>
</svg>
