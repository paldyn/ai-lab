<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>
  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">표는 한 줄로 펴는 순간 뜻을 잃는다</text>
  <text x="62" y="68" font-size="13" fill="#888">머리가 두 층이면 셀 하나에 붙는 이름도 둘이다.</text>

  <rect x="62" y="100" width="340" height="136" rx="6" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <rect x="62" y="100" width="340" height="68" fill="#1a2030"/>
  <line x1="142" y1="100" x2="142" y2="236" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="207" y1="134" x2="207" y2="236" stroke="#2a3550" stroke-width="1"/>
  <line x1="272" y1="100" x2="272" y2="236" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="337" y1="134" x2="337" y2="236" stroke="#2a3550" stroke-width="1"/>
  <line x1="142" y1="134" x2="402" y2="134" stroke="#2a3550" stroke-width="1"/>
  <line x1="62" y1="168" x2="402" y2="168" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="62" y1="202" x2="402" y2="202" stroke="#2a3550" stroke-width="1"/>
  <text x="102" y="139" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">지역</text>
  <text x="207" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">2025</text>
  <text x="337" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">2026</text>
  <text x="174" y="157" text-anchor="middle" font-size="12" fill="#c8d0e0">상</text>
  <text x="239" y="157" text-anchor="middle" font-size="12" fill="#c8d0e0">하</text>
  <text x="304" y="157" text-anchor="middle" font-size="12" fill="#c8d0e0">상</text>
  <text x="369" y="157" text-anchor="middle" font-size="12" fill="#c8d0e0">하</text>
  <text x="102" y="190" text-anchor="middle" font-size="12" fill="#c8d0e0">수도권</text>
  <text x="174" y="190" text-anchor="middle" font-size="12" fill="#7ec8e3">12</text>
  <text x="239" y="190" text-anchor="middle" font-size="12" fill="#c8d0e0">15</text>
  <text x="304" y="190" text-anchor="middle" font-size="12" fill="#c8d0e0">18</text>
  <text x="369" y="190" text-anchor="middle" font-size="12" fill="#c8d0e0">21</text>
  <text x="102" y="224" text-anchor="middle" font-size="12" fill="#c8d0e0">영남</text>
  <text x="174" y="224" text-anchor="middle" font-size="12" fill="#c8d0e0">8</text>
  <text x="239" y="224" text-anchor="middle" font-size="12" fill="#c8d0e0">9</text>
  <text x="304" y="224" text-anchor="middle" font-size="12" fill="#c8d0e0">11</text>
  <text x="369" y="224" text-anchor="middle" font-size="12" fill="#c8d0e0">13</text>

  <text x="62" y="282" font-size="12" fill="#9aa4b8">사람은 병합된 머리를 위아래로 이어 읽는다.</text>
  <text x="62" y="302" font-size="12" fill="#55c555">「수도권 · 2025년 상반기 · 12억」</text>

  <text x="482" y="122" font-size="16" font-weight="600" fill="#e05555">한 줄로 펴면</text>
  <rect x="482" y="138" width="336" height="122" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="500" y="162" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">| 지역 | 2025 | 2026 |</tspan></text>
  <text x="500" y="182" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">| 상 | 하 | 상 | 하 |</tspan></text>
  <text x="500" y="202" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">| 수도권 | 12 | 15 | 18 | 21 |</tspan></text>
  <text x="500" y="242" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#e05555">12는 어느 해 어느 반기인가?</tspan></text>

  <text x="482" y="292" font-size="12" fill="#9aa4b8">셀마다 머리 두 층을 「2025 상」으로 펼쳐 두거나,</text>
  <text x="482" y="312" font-size="12" fill="#9aa4b8">값마다 (행 머리, 열 머리) 쌍을 함께 뽑아야</text>
  <text x="482" y="332" font-size="12" fill="#9aa4b8">한 줄로 편 뒤에도 뜻이 남는다.</text>
</svg>
