<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="460" rx="12" fill="#0a0a0a"/>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">첫째항은 1로 두고 공비만 바꿔 부분합을 찍었다</text>
  <text x="60" y="74" font-size="13" fill="#888">점선이 합의 값이다. 네 칸의 세로 눈금은 서로 다르다</text>

  <text x="147" y="100" font-size="16" font-weight="600" fill="#55c555" text-anchor="middle">r = 1/2</text>
  <rect x="60" y="110" width="175" height="200" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <line x1="76" y1="300" x2="219" y2="300" stroke="#666" stroke-width="1.5"/>
  <line x1="76" y1="180" x2="219" y2="180" stroke="#7777cc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="85" cy="240" r="5" fill="#55c555"/>
  <circle cx="110" cy="210" r="5" fill="#55c555"/>
  <circle cx="135" cy="195" r="5" fill="#55c555"/>
  <circle cx="160" cy="187" r="5" fill="#55c555"/>
  <circle cx="185" cy="184" r="5" fill="#55c555"/>
  <circle cx="210" cy="182" r="5" fill="#55c555"/>
  <text x="147" y="340" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">합 = 2</text>
  <text x="147" y="362" font-size="12" fill="#888" text-anchor="middle">아래에서 곧장 오른다</text>

  <text x="342" y="100" font-size="16" font-weight="600" fill="#7ec8e3" text-anchor="middle">r = 1/3</text>
  <rect x="255" y="110" width="175" height="200" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <line x1="271" y1="300" x2="414" y2="300" stroke="#666" stroke-width="1.5"/>
  <line x1="271" y1="180" x2="414" y2="180" stroke="#7777cc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="280" cy="220" r="5" fill="#7ec8e3"/>
  <circle cx="305" cy="193" r="5" fill="#7ec8e3"/>
  <circle cx="330" cy="185" r="5" fill="#7ec8e3"/>
  <circle cx="355" cy="182" r="5" fill="#7ec8e3"/>
  <circle cx="380" cy="181" r="5" fill="#7ec8e3"/>
  <circle cx="405" cy="180" r="5" fill="#7ec8e3"/>
  <text x="342" y="340" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">합 = 1.5</text>
  <text x="342" y="362" font-size="12" fill="#888" text-anchor="middle">금세 붙어 버린다</text>

  <text x="537" y="100" font-size="16" font-weight="600" fill="#e05555" text-anchor="middle">r = 0.9</text>
  <rect x="450" y="110" width="175" height="200" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <line x1="466" y1="300" x2="609" y2="300" stroke="#666" stroke-width="1.5"/>
  <line x1="466" y1="180" x2="609" y2="180" stroke="#7777cc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="475" cy="288" r="5" fill="#e05555"/>
  <circle cx="500" cy="277" r="5" fill="#e05555"/>
  <circle cx="525" cy="267" r="5" fill="#e05555"/>
  <circle cx="550" cy="259" r="5" fill="#e05555"/>
  <circle cx="575" cy="251" r="5" fill="#e05555"/>
  <circle cx="600" cy="244" r="5" fill="#e05555"/>
  <text x="537" y="340" font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">합 = 10</text>
  <text x="537" y="362" font-size="12" fill="#888" text-anchor="middle">여섯 항을 가도 절반이 안 된다</text>

  <text x="732" y="100" font-size="16" font-weight="600" fill="#7777cc" text-anchor="middle">r = −1/2</text>
  <rect x="645" y="110" width="175" height="200" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <line x1="661" y1="300" x2="804" y2="300" stroke="#666" stroke-width="1.5"/>
  <line x1="661" y1="180" x2="804" y2="180" stroke="#7777cc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="670" cy="120" r="5" fill="#7777cc"/>
  <circle cx="695" cy="210" r="5" fill="#7777cc"/>
  <circle cx="720" cy="165" r="5" fill="#7777cc"/>
  <circle cx="745" cy="188" r="5" fill="#7777cc"/>
  <circle cx="770" cy="176" r="5" fill="#7777cc"/>
  <circle cx="795" cy="182" r="5" fill="#7777cc"/>
  <text x="732" y="340" font-size="14" font-weight="600" fill="#7777cc" text-anchor="middle">합 ≈ 0.667</text>
  <text x="732" y="362" font-size="12" fill="#888" text-anchor="middle">위아래로 오가며 다가간다</text>

  <rect x="60" y="386" width="760" height="44" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="414" font-size="13" fill="#e8e8e8">공비가 1 에 가까울수록 느리게, 공비가 음수이면 지나쳤다 돌아오기를 되풀이하며 다가간다.</text>
</svg>
