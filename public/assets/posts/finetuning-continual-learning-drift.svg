<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="392" rx="12" fill="#0a0a0a"/>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">이어 붙이면 싸지만 베이스에서 계속 멀어진다</text>
  <text x="62" y="72" font-size="13" fill="#888">갱신을 거듭할수록 처음 확인했던 성질이 조용히 사라진다. 두 방식의 차이가 여기서 갈린다.</text>

  <line x1="120" y1="150" x2="800" y2="150" stroke="#222222" stroke-width="1"/>
  <line x1="120" y1="200" x2="800" y2="200" stroke="#222222" stroke-width="1"/>
  <line x1="120" y1="250" x2="800" y2="250" stroke="#222222" stroke-width="1"/>

  <line x1="120" y1="100" x2="120" y2="300" stroke="#555555" stroke-width="1.5"/>
  <line x1="120" y1="300" x2="800" y2="300" stroke="#555555" stroke-width="1.5"/>

  <text x="108" y="112" font-size="11" fill="#888" text-anchor="end">멀다</text>
  <text x="108" y="298" font-size="11" fill="#888" text-anchor="end">가깝다</text>
  <text x="62" y="94" font-size="12" fill="#888">베이스에서 벌어진 거리</text>

  <path d="M 120 260 L 233 260 L 233 232 L 346 232 L 346 200 L 460 200 L 460 172 L 573 172 L 573 146 L 686 146 L 686 122 L 800 122" fill="none" stroke="#e05555" stroke-width="2.5"/>
  <path d="M 120 260 L 233 260 L 233 252 L 346 252 L 346 258 L 460 258 L 460 250 L 573 250 L 573 256 L 686 256 L 686 250 L 800 250" fill="none" stroke="#55c555" stroke-width="2.5"/>

  <text x="176" y="322" font-size="11" fill="#888" text-anchor="middle">1회</text>
  <text x="289" y="322" font-size="11" fill="#888" text-anchor="middle">2회</text>
  <text x="403" y="322" font-size="11" fill="#888" text-anchor="middle">3회</text>
  <text x="516" y="322" font-size="11" fill="#888" text-anchor="middle">4회</text>
  <text x="630" y="322" font-size="11" fill="#888" text-anchor="middle">5회</text>
  <text x="743" y="322" font-size="11" fill="#888" text-anchor="middle">6회</text>
  <text x="800" y="344" font-size="11" fill="#888" text-anchor="end">갱신 회차</text>

  <line x1="62" y1="362" x2="92" y2="362" stroke="#e05555" stroke-width="2.5"/>
  <text x="100" y="366" font-size="12" fill="#aaaaaa">이어 붙이기 — 직전 모델에 새 데이터만</text>
  <line x1="460" y1="362" x2="490" y2="362" stroke="#55c555" stroke-width="2.5"/>
  <text x="498" y="366" font-size="12" fill="#aaaaaa">다시 만들기 — 베이스에서 누적 데이터로</text>
</svg>
