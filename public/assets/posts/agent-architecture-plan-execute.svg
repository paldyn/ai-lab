<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <defs>
    <marker id="arr-b" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect width="880" height="480" fill="#0a0a0a" rx="12"/>

  <text x="440" y="42" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">Plan-and-Execute의 세 역할</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#888">Planner가 쪼개고 Executor가 실행하고 Replanner가 남은 계획만 다시 짠다</text>

  <!-- Planner -->
  <rect x="60" y="110" width="160" height="80" rx="8" fill="#0f1a2e" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="140" y="136" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#7ec8e3">Planner</text>
  <text x="140" y="156" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#9aa4b8">목표를 단계로</text>
  <text x="140" y="175" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#9aa4b8">쪼갠다</text>

  <line x1="220" y1="150" x2="280" y2="150" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- 계획 -->
  <rect x="280" y="96" width="320" height="108" rx="8" fill="#1a1000" stroke="#e0a855" stroke-width="1.5"/>
  <text x="440" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e0a855">단계 목록</text>

  <rect x="300" y="136" width="52" height="36" rx="5" fill="#0a0a0a" stroke="#e0a855" stroke-width="1"/>
  <text x="326" y="159" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">1</text>
  <rect x="357" y="136" width="52" height="36" rx="5" fill="#0a0a0a" stroke="#e0a855" stroke-width="1"/>
  <text x="383" y="159" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">2</text>
  <rect x="414" y="136" width="52" height="36" rx="5" fill="#0a0a0a" stroke="#e0a855" stroke-width="1"/>
  <text x="440" y="159" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">3</text>
  <rect x="471" y="136" width="52" height="36" rx="5" fill="#0a0a0a" stroke="#e0a855" stroke-width="1"/>
  <text x="497" y="159" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">4</text>
  <rect x="528" y="136" width="52" height="36" rx="5" fill="#0a0a0a" stroke="#e0a855" stroke-width="1"/>
  <text x="554" y="159" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">5</text>

  <text x="440" y="192" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#9aa4b8">실행 전에 사람이 읽을 수 있는 물건</text>

  <line x1="600" y1="150" x2="660" y2="150" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Executor -->
  <rect x="660" y="110" width="160" height="80" rx="8" fill="#0f1f0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="740" y="136" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#55c555">Executor</text>
  <text x="740" y="156" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#9aa4b8">단계 하나를</text>
  <text x="740" y="175" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#9aa4b8">ReAct로 실행</text>

  <!-- 실패 → Replanner -->
  <path d="M 740 190 L 740 310 L 542 310" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"
        fill="none" marker-end="url(#arr-r)"/>
  <text x="648" y="294" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e05555">단계 실패</text>

  <!-- Replanner -->
  <rect x="340" y="270" width="200" height="80" rx="8" fill="#1f0f0f" stroke="#e05555" stroke-width="1.5"/>
  <text x="440" y="296" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e05555">Replanner</text>
  <text x="440" y="316" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#9aa4b8">끝난 단계는 그대로 두고</text>
  <text x="440" y="335" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#9aa4b8">남은 단계만 다시 짠다</text>

  <path d="M 440 270 L 440 204" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"
        fill="none" marker-end="url(#arr-r)"/>
  <text x="456" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e05555">남은 단계만 교체</text>

  <!-- 비용 -->
  <rect x="60" y="386" width="760" height="58" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="440" y="411" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#e8e8e8">5단계 계획이면 Planner 1 + 실행 10 + 통합 1 = 호출 12회</text>
  <text x="440" y="431" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#9aa4b8">ReAct 하나로 밀어도 호출 수는 비슷하다 — 다른 것은 한 호출이 든 컨텍스트다</text>
</svg>
