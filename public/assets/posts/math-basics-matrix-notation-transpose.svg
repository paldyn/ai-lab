<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="320" fill="#0a0a0a" rx="12"/>
  <text x="60" y="46" fill="#e8e8e8" font-size="22" font-weight="700">전치 Aᵀ: 대각선에 대해 뒤집기</text>
  <text x="60" y="72" fill="#888" font-size="13">행과 열을 바꿉니다. m×n 행렬은 전치하면 n×m이 되고, 각 성분은 aᵢⱼ → aⱼᵢ 자리로 갑니다.</text>

  <!-- A -->
  <path d="M 130,110 L 110,110 L 110,240 L 130,240" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 320,110 L 340,110 L 340,240 L 320,240" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" text-anchor="middle">
    <text x="160" y="145" fill="#e8e8e8">1</text>
    <text x="225" y="145" fill="#55c555" font-weight="700">2</text>
    <text x="290" y="145" fill="#e8e8e8">3</text>
    <text x="160" y="180" fill="#e59866" font-weight="700">4</text>
    <text x="225" y="180" fill="#e8e8e8">5</text>
    <text x="290" y="180" fill="#e8e8e8">6</text>
    <text x="160" y="215" fill="#e8e8e8">7</text>
    <text x="225" y="215" fill="#e8e8e8">8</text>
    <text x="290" y="215" fill="#e8e8e8">9</text>
  </g>
  <text x="225" y="95" fill="#7ec8e3" font-size="14" font-weight="700" text-anchor="middle">A (3×3)</text>

  <!-- arrow -->
  <defs>
    <marker id="arrt" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <line x1="380" y1="175" x2="440" y2="175" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrt)"/>
  <text x="410" y="160" fill="#7ec8e3" font-size="13" font-weight="700" text-anchor="middle">Aᵀ</text>

  <!-- A^T -->
  <path d="M 500,110 L 480,110 L 480,240 L 500,240" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 690,110 L 710,110 L 710,240 L 690,240" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" text-anchor="middle">
    <text x="530" y="145" fill="#e8e8e8">1</text>
    <text x="595" y="145" fill="#e59866" font-weight="700">4</text>
    <text x="660" y="145" fill="#e8e8e8">7</text>
    <text x="530" y="180" fill="#55c555" font-weight="700">2</text>
    <text x="595" y="180" fill="#e8e8e8">5</text>
    <text x="660" y="180" fill="#e8e8e8">8</text>
    <text x="530" y="215" fill="#e8e8e8">3</text>
    <text x="595" y="215" fill="#e8e8e8">6</text>
    <text x="660" y="215" fill="#e8e8e8">9</text>
  </g>
  <text x="595" y="95" fill="#7ec8e3" font-size="14" font-weight="700" text-anchor="middle">Aᵀ (3×3)</text>

  <!-- Explanation -->
  <text x="740" y="145" fill="#55c555" font-size="12">a₁₂ = 2 → a₂₁ 자리</text>
  <text x="740" y="180" fill="#e59866" font-size="12">a₂₁ = 4 → a₁₂ 자리</text>
  <text x="740" y="215" fill="#888" font-size="12">대각선 1·5·9는 그대로</text>

  <!-- (AB)^T rule -->
  <text x="60" y="285" fill="#7ec8e3" font-size="14" font-weight="700">순서가 뒤집힙니다:</text>
  <text x="230" y="285" fill="#e8e8e8" font-size="16" font-family="'JetBrains Mono',monospace">(AB)ᵀ = BᵀAᵀ</text>
  <text x="470" y="285" fill="#888" font-size="12">— 곱한 뒤 뒤집는 것과 각각 뒤집어 순서를 바꿔 곱하는 것이 같습니다.</text>
</svg>
