  <text x="60" y="428" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">완화 — 청크마다 문서 제목을 함께 넣고, 병합 단계의 압축률을 낮게 잡는다</text>
