  </defs>
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>
  <text x="60" y="50" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">계층 요약과 내용이 새는 두 지점</text>

