<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">편향이 붙으면 격자가 통째로 밀린다</text>

  <!-- left panel: Ax -->
  <text x="210" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">Ax — 선형사상</text>
  <line x1="88" y1="330" x2="330" y2="330" stroke="#888" stroke-width="1.5"/>
  <line x1="110" y1="352" x2="110" y2="120" stroke="#888" stroke-width="1.5"/>
  <text x="336" y="334" font-size="13" fill="#888">x</text>
  <text x="104" y="114" font-size="13" fill="#888">y</text>
  <rect x="110" y="285" width="45" height="45" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <path d="M 110 330 L 200 330 L 245 195 L 155 195 Z" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="155" y1="330" x2="200" y2="195" stroke="#7ec8e3" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="132.5" y1="262.5" x2="222.5" y2="262.5" stroke="#7ec8e3" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="110" cy="330" r="5" fill="#e05555"/>
  <circle cx="245" cy="195" r="5" fill="#e8e8e8"/>
  <text x="259" y="190" font-size="13" fill="#e8e8e8">(1, 1) → (3, 3)</text>
  <text x="120" y="356" font-size="13" fill="#e05555">원점은 원점으로</text>

  <!-- right panel: Ax + b -->
  <text x="630" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">Ax + b — 아핀사상, b = (1, 1)</text>
  <line x1="508" y1="330" x2="750" y2="330" stroke="#888" stroke-width="1.5"/>
  <line x1="530" y1="352" x2="530" y2="120" stroke="#888" stroke-width="1.5"/>
  <text x="756" y="334" font-size="13" fill="#888">x</text>
  <text x="524" y="114" font-size="13" fill="#888">y</text>
  <path d="M 530 330 L 620 330 L 665 195 L 575 195 Z" fill="none" stroke="#7777cc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <path d="M 575 285 L 665 285 L 710 150 L 620 150 Z" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="620" y1="285" x2="665" y2="150" stroke="#7ec8e3" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="597.5" y1="217.5" x2="687.5" y2="217.5" stroke="#7ec8e3" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="530" y1="330" x2="571" y2="289" stroke="#e05555" stroke-width="2" marker-end="url(#arrB)"/>
  <circle cx="575" cy="285" r="5" fill="#e05555"/>
  <circle cx="710" cy="150" r="5" fill="#e8e8e8"/>
  <text x="640" y="134" text-anchor="middle" font-size="13" fill="#e8e8e8">(1, 1) → (4, 4)</text>
  <text x="540" y="356" font-size="13" fill="#e05555">원점이 (1, 1)로 옮겨 간다</text>

  <text x="60" y="392" font-size="13" fill="#888">점선은 편향이 붙기 전의 평행사변형이다. 모양과 넓이는 그대로이고 원점을 포함한 모든 점이 b만큼 옮겨 간다.</text>
  <text x="60" y="416" font-size="13" fill="#888">좌표 끝에 1을 붙여 (x, y, 1)로 쓰면 이 이동까지 3×3 행렬 하나의 곱으로 적힌다.</text>
</svg>
