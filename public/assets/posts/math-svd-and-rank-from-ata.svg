<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">대칭이 아닌 행렬에 스펙트럼 정리를 쓰는 우회로</text>
  <text x="60" y="70" font-size="13" fill="#888">A를 직접 다루는 대신 AᵀA를 만든다. 그것은 무슨 A에서든 대칭이고 양반정치다.</text>

  <defs>
    <marker id="ata-arr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="50" y="104" width="180" height="110" rx="10" fill="#101820" stroke="#e05555" stroke-width="1.5"/>
  <text x="140" y="134" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">A</text>
  <text x="140" y="160" font-size="13" fill="#9aa4b8" text-anchor="middle">m × n, 아무 모양</text>
  <text x="140" y="182" font-size="13" fill="#e05555" text-anchor="middle">Av = λv 를 쓸 수 없다</text>
  <text x="140" y="202" font-size="13" fill="#e05555" text-anchor="middle">양변의 차원이 다르다</text>

  <line x1="238" y1="159" x2="290" y2="159" stroke="#888" stroke-width="2" marker-end="url(#ata-arr)"/>
  <text x="264" y="96" font-size="13" fill="#888" text-anchor="middle">전치를 곱해</text>

  <rect x="300" y="104" width="200" height="110" rx="10" fill="#101820" stroke="#55c555" stroke-width="1.5"/>
  <text x="400" y="134" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">AᵀA</text>
  <text x="400" y="160" font-size="13" fill="#9aa4b8" text-anchor="middle">n × n, 언제나 대칭</text>
  <text x="400" y="182" font-size="13" fill="#55c555" text-anchor="middle">xᵀAᵀAx = ‖Ax‖² ≥ 0</text>
  <text x="400" y="202" font-size="13" fill="#55c555" text-anchor="middle">고윳값이 전부 0 이상</text>

  <line x1="508" y1="159" x2="560" y2="159" stroke="#888" stroke-width="2" marker-end="url(#ata-arr)"/>
  <text x="534" y="96" font-size="13" fill="#888" text-anchor="middle">스펙트럼 정리</text>

  <rect x="570" y="104" width="250" height="110" rx="10" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="695" y="134" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">AᵀA = VΛVᵀ</text>
  <text x="695" y="160" font-size="13" fill="#9aa4b8" text-anchor="middle">V는 직교, Λ의 값은 0 이상</text>
  <text x="695" y="182" font-size="13" fill="#7ec8e3" text-anchor="middle">음수가 없으니 제곱근을 씌운다</text>
  <text x="695" y="202" font-size="13" fill="#7ec8e3" text-anchor="middle">σᵢ = √λᵢ</text>

  <path d="M 695 222 L 695 258" fill="none" stroke="#888" stroke-width="2" marker-end="url(#ata-arr)"/>

  <rect x="300" y="266" width="520" height="46" rx="10" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="560" y="295" font-size="16" font-weight="600" fill="#7ec8e3" text-anchor="middle">uᵢ = Avᵢ / σᵢ 로 왼쪽을 채우면  A = UΣVᵀ</text>

  <rect x="50" y="266" width="230" height="46" rx="10" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="165" y="295" font-size="13" fill="#9aa4b8" text-anchor="middle">‖Avᵢ‖ = σᵢ — 늘어난 배율</text>

  <rect x="50" y="330" width="770" height="34" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="72" y="352" font-size="14" fill="#e8e8e8">조건이 하나도 없다. 정사각형이 아니어도, 대칭이 아니어도, 랭크가 모자라도 이 분해는 존재한다.</text>
</svg>
