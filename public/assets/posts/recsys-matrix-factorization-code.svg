<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310">
  <!-- 배경 -->
  <rect width="880" height="310" fill="#0a0a0a" rx="12"/>

  <!-- 제목 -->
  <text x="440" y="40" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">Surprise SVD 라이브러리 실전 코드</text>

  <!-- 코드 박스 -->
  <rect x="40" y="58" width="800" height="234" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>

  <!-- 줄 1 -->
  <text x="60" y="82" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> surprise </tspan><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> SVD, Dataset, Reader</tspan></text>

  <!-- 줄 2 -->
  <text x="60" y="101" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> surprise.model_selection </tspan></text>
  <text x="358" y="101" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="600"><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> cross_validate</tspan></text>

  <!-- 줄 3 -->
  <text x="60" y="120" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># 데이터 로드</text>

  <!-- 줄 4 -->
  <text x="60" y="139" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">ratings_df = pd.read_csv(</tspan><tspan fill="#ce9178">'ratings.csv'</tspan><tspan fill="#ffffff">)</tspan></text>

  <!-- 줄 5 -->
  <text x="60" y="158" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">reader = Reader(rating_scale=(</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">5</tspan><tspan fill="#ffffff">))</tspan></text>

  <!-- 줄 6 -->
  <text x="60" y="177" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">data = Dataset.load_from_df(</tspan><tspan fill="#ffffff">ratings_df[[</tspan><tspan fill="#ce9178">'userId','movieId','rating'</tspan><tspan fill="#ffffff">    ]], reader)</tspan></text>

  <!-- 줄 7: 빈 줄 -->

  <!-- 줄 8 -->
  <text x="60" y="206" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># SVD 모델 학습</text>

  <!-- 줄 9 -->
  <text x="60" y="225" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">algo = SVD(n_factors=</tspan><tspan fill="#b5cea8">50</tspan><tspan fill="#ffffff"> , n_epochs=</tspan><tspan fill="#b5cea8">20</tspan><tspan fill="#ffffff"> , lr_all=</tspan><tspan fill="#b5cea8">0.005</tspan><tspan fill="#ffffff"> , reg_all=</tspan><tspan fill="#b5cea8">0.02</tspan><tspan fill="#ffffff"> )</tspan></text>

  <!-- 줄 10 -->
  <text x="60" y="244" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">cv = cross_validate(algo, data, measures=[</text>
  <text x="452" y="244" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ce9178">'RMSE'</tspan><tspan fill="#ffffff">,</tspan><tspan fill="#ce9178"> 'MAE'</tspan><tspan fill="#ffffff">], cv=</tspan><tspan fill="#b5cea8">5</tspan><tspan fill="#ffffff">)</tspan></text>

  <!-- 줄 11 -->
  <text x="60" y="263" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">print(f</tspan><tspan fill="#ce9178">&quot;RMSE: {cv['test_rmse'].mean():.4f}&quot;</tspan></text>
  <text x="482" y="263" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">)</text>

  <!-- 줄 12: 결과 주석 -->
  <text x="60" y="282" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># RMSE: 0.8731  (MovieLens 100K 기준)</text>
</svg>
