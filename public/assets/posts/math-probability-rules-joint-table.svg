<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrMg" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#0a0a0a" rx="12"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">가운데는 결합확률, 가장자리 합이 주변확률</text>

  <text x="200" y="100" font-size="14" fill="#888" text-anchor="middle">cat</text>
  <text x="330" y="100" font-size="14" fill="#888" text-anchor="middle">dog</text>
  <text x="460" y="100" font-size="14" fill="#888" text-anchor="middle">car</text>
  <text x="620" y="100" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">행 합 = p(앞 토큰)</text>

  <text x="120" y="152" font-size="14" fill="#888" text-anchor="end">the</text>
  <text x="120" y="222" font-size="14" fill="#888" text-anchor="end">a</text>

  <rect x="140" y="120" width="120" height="60" fill="#7ec8e3" fill-opacity="0.22" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="270" y="120" width="120" height="60" fill="#7ec8e3" fill-opacity="0.22" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="400" y="120" width="120" height="60" fill="#7ec8e3" fill-opacity="0.22" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="140" y="190" width="120" height="60" fill="#7ec8e3" fill-opacity="0.22" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="270" y="190" width="120" height="60" fill="#7ec8e3" fill-opacity="0.22" stroke="#7ec8e3" stroke-width="1"/>
  <rect x="400" y="190" width="120" height="60" fill="#7ec8e3" fill-opacity="0.22" stroke="#7ec8e3" stroke-width="1"/>

  <text x="200" y="157" font-size="16" fill="#e8e8e8" text-anchor="middle">0.30</text>
  <text x="330" y="157" font-size="16" fill="#e8e8e8" text-anchor="middle">0.20</text>
  <text x="460" y="157" font-size="16" fill="#e8e8e8" text-anchor="middle">0.10</text>
  <text x="200" y="227" font-size="16" fill="#e8e8e8" text-anchor="middle">0.12</text>
  <text x="330" y="227" font-size="16" fill="#e8e8e8" text-anchor="middle">0.08</text>
  <text x="460" y="227" font-size="16" fill="#e8e8e8" text-anchor="middle">0.20</text>

  <line x1="530" y1="150" x2="586" y2="150" stroke="#55c555" stroke-width="2.5" marker-end="url(#arrMg)"/>
  <line x1="530" y1="220" x2="586" y2="220" stroke="#55c555" stroke-width="2.5" marker-end="url(#arrMg)"/>
  <text x="620" y="157" font-size="18" font-weight="600" fill="#55c555" text-anchor="middle">0.60</text>
  <text x="620" y="227" font-size="18" font-weight="600" fill="#55c555" text-anchor="middle">0.40</text>

  <line x1="200" y1="260" x2="200" y2="296" stroke="#55c555" stroke-width="2.5" marker-end="url(#arrMg)"/>
  <line x1="330" y1="260" x2="330" y2="296" stroke="#55c555" stroke-width="2.5" marker-end="url(#arrMg)"/>
  <line x1="460" y1="260" x2="460" y2="296" stroke="#55c555" stroke-width="2.5" marker-end="url(#arrMg)"/>
  <text x="200" y="322" font-size="18" font-weight="600" fill="#55c555" text-anchor="middle">0.42</text>
  <text x="330" y="322" font-size="18" font-weight="600" fill="#55c555" text-anchor="middle">0.28</text>
  <text x="460" y="322" font-size="18" font-weight="600" fill="#55c555" text-anchor="middle">0.30</text>
  <text x="620" y="322" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">열 합 = p(다음 토큰)</text>

  <text x="60" y="372" font-size="13" fill="#888">여섯 칸의 합은 1이다. 한 방향으로 더해 변수를 지우는 것이 주변화이고, 그 값이 표의 가장자리에 남는다.</text>
</svg>
