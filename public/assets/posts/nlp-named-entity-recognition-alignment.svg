  <text x="208" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">B-ORG</text>
  <rect x="274" y="306" width="100" height="60" fill="#1f0d0d" rx="6" stroke="#e05555" stroke-width="1.5"/>
  <text x="324" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">##대</text>
  <text x="324" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">B-ORG</text>
  <rect x="390" y="306" width="100" height="60" fill="#1f0d0d" rx="6" stroke="#e05555" stroke-width="1.5"/>
  <text x="440" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">##학</text>
  <text x="440" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">B-ORG</text>
  <rect x="506" y="306" width="100" height="60" fill="#1f0d0d" rx="6" stroke="#e05555" stroke-width="1.5"/>
  <text x="556" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">##교</text>
  <text x="556" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">B-ORG</text>
  <rect x="622" y="306" width="100" height="60" fill="#111827" rx="6" stroke="#333" stroke-width="1.5"/>
  <text x="672" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">에서</text>
  <text x="672" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#888" text-anchor="middle">O</text>
  <text x="440" y="392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555" text-anchor="middle">모델이 낱말 안에서도 B-를 배운다 → 추론에서 ORG 개체 넷으로 갈린다</text>
  <text x="440" y="428" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">-100은 PyTorch 교차 엔트로피 손실의 ignore_index 기본값 — 그 자리는 손실에서 빠진다</text>
</svg>
