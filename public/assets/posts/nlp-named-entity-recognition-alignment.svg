<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
  <rect width="880" height="460" fill="#0a0a0a" rx="12"/>
  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">서브워드 라벨 정렬</text>
  <text x="440" y="68" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888" text-anchor="middle">「서울대학교에서」 — 낱말 하나가 조각 넷으로 쪼개질 때 라벨을 다는 법</text>
  <text x="158" y="104" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">올바른 정렬 — 첫 조각에만 라벨, 나머지는 -100</text>
  <rect x="158" y="116" width="448" height="40" fill="#0d1a1a" rx="6" stroke="#55c555" stroke-width="1.5"/>
  <text x="382" y="141" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">서울대학교 (낱말 1)</text>
  <rect x="622" y="116" width="100" height="40" fill="#111827" rx="6" stroke="#333" stroke-width="1.5"/>
  <text x="672" y="141" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#888" text-anchor="middle">에서</text>
