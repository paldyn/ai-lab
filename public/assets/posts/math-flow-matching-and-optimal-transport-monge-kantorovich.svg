<path d="M 222 220 Q 290 150 330 268" fill="none" stroke="#e05555" stroke-width="2.5" marker-end="url(#r)"/>
<text x="60" y="390" font-size="13" fill="#888">T(0)은 값 하나라 +4로 다 보내면 −4가 빈다</text>
<text x="60" y="410" font-size="13" fill="#e05555">조건을 맞추는 사상이 없다</text>
<line x1="500" y1="330" x2="800" y2="330" stroke="#888" stroke-width="1.5"/>
<text x="520" y="354" font-size="13" fill="#888" text-anchor="middle">−4</text>
<text x="650" y="354" font-size="13" fill="#888" text-anchor="middle">0</text>
<text x="780" y="354" font-size="13" fill="#888" text-anchor="middle">+4</text>
