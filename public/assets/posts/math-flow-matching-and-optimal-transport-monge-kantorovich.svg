<text x="210" y="354" font-size="13" fill="#888" text-anchor="middle">0</text>
<text x="340" y="354" font-size="13" fill="#888" text-anchor="middle">+4</text>
<rect x="200" y="210" width="20" height="120" fill="#7ec8e3" fill-opacity="0.6"/>
