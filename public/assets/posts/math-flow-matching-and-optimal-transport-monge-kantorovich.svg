<rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
<text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">점 하나를 두 곳으로 보내려면 질량을 쪼개야 한다</text>
<text x="60" y="96" font-size="16" font-weight="600" fill="#e8e8e8">몽주 — 사상 T로 옮긴다</text>
