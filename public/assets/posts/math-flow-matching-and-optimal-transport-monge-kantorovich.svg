<path d="M 662 220 Q 730 150 770 268" fill="none" stroke="#55c555" stroke-width="2.5" marker-end="url(#g)"/>
<path d="M 638 220 Q 570 150 530 268" fill="none" stroke="#55c555" stroke-width="2.5" marker-end="url(#g)"/>
<text x="500" y="390" font-size="13" fill="#888">π(0, −4) = π(0, +4) = ½ — 비용 16</text>
<text x="500" y="410" font-size="13" fill="#55c555">커플링은 언제나 있다</text>
