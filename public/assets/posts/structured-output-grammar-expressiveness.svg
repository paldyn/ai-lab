<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <rect x="0" y="0" width="880" height="520" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">제약을 거는 언어의 표현력</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">바깥으로 갈수록 표현할 수 있는 형태가 늘고, 컴파일 비용도 같이 는다</text>

  <rect x="50" y="110" width="780" height="340" rx="10" fill="#0f0f16" stroke="#7777cc" stroke-width="1"/>
  <text x="74" y="140" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#7777cc">문맥자유문법 — 규칙이 자기를 다시 부를 수 있다</text>
  <text x="74" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">임의의 DSL · 연산자 우선순위 · 균형 잡힌 괄호 · 들여쓰기 없는 트리 구조</text>

  <rect x="100" y="178" width="680" height="238" rx="10" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="124" y="208" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#7ec8e3">JSON Schema — 모양이 정해진 트리</text>
  <text x="124" y="230" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">객체·배열의 중첩 · 필드 이름과 타입 · 필수 여부</text>

  <rect x="150" y="246" width="580" height="128" rx="10" fill="#161620" stroke="#55c555" stroke-width="1"/>
  <text x="174" y="276" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555">enum · 정규식 — 유한 상태로 충분한 것</text>
  <text x="174" y="298" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">고정 형식 문자열 · 날짜 · 코드 번호 · 정해진 라벨 집합</text>
  <text x="174" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e05555">여기서 못 하는 것: 괄호 짝 맞추기, 깊이가 정해지지 않은 중첩</text>
  <text x="174" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">컴파일이 가장 싸고 상태 수가 적다 — 가능하면 이 안에서 끝낸다</text>

  <text x="124" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e05555">여기서 못 하는 것: JSON이 아닌 문법 — SQL, 수식, 마크업, 사내 명령어</text>

  <text x="74" y="436" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e05555">여기서도 못 하는 것: "앞에서 선언한 이름만 쓸 것" 같은 문맥 의존 규칙 — 받은 뒤 검증할 몫이다</text>

  <text x="50" y="492" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">표현력이 큰 쪽이 항상 낫지는 않다. 안쪽으로 표현되는 문제를 바깥쪽 도구로 풀면 컴파일 비용만 더 낸다.</text>
</svg>
