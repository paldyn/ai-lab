<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="460" rx="12" fill="#0a0a0a"/>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">30°·45°·60° 의 값은 도형을 반으로 잘라 얻는다</text>
  <text x="60" y="74" font-size="13" fill="#888">나머지 한 변은 피타고라스 정리로 구한다</text>

  <text x="240" y="112" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">한 변이 2인 정삼각형의 반쪽</text>
  <polygon points="150,330 330,330 240,174" fill="none" stroke="#444" stroke-width="1.5"/>
  <polygon points="240,330 330,330 240,174" fill="#7ec8e3" fill-opacity="0.14" stroke="#7ec8e3" stroke-width="2.5"/>
  <path d="M 240 316 L 254 316 L 254 330" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="285" y="352" font-size="13" fill="#7ec8e3" text-anchor="middle">1</text>
  <text x="234" y="262" font-size="13" fill="#7ec8e3" text-anchor="end">√3</text>
  <text x="302" y="246" font-size="13" fill="#7ec8e3">2</text>
  <text x="243" y="232" font-size="12" fill="#888">30°</text>
  <text x="306" y="316" font-size="13" fill="#888" text-anchor="end">60°</text>

  <text x="638" y="112" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">한 변이 1인 정사각형의 반쪽</text>
  <rect x="560" y="180" width="156" height="156" fill="none" stroke="#444" stroke-width="1.5"/>
  <polygon points="560,336 716,336 716,180" fill="#55c555" fill-opacity="0.14" stroke="#55c555" stroke-width="2.5"/>
  <path d="M 702 336 L 702 322 L 716 322" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="638" y="358" font-size="13" fill="#55c555" text-anchor="middle">1</text>
  <text x="728" y="262" font-size="13" fill="#55c555">1</text>
  <text x="618" y="246" font-size="13" fill="#55c555" text-anchor="end">√2</text>
  <text x="580" y="322" font-size="13" fill="#888">45°</text>
  <text x="712" y="222" font-size="13" fill="#888" text-anchor="end">45°</text>

  <text x="240" y="392" font-size="13" fill="#e8e8e8" text-anchor="middle">sin 30° = 1/2 · cos 30° = √3/2</text>
  <text x="240" y="416" font-size="13" fill="#e8e8e8" text-anchor="middle">sin 60° = √3/2 · cos 60° = 1/2</text>
  <text x="638" y="392" font-size="13" fill="#e8e8e8" text-anchor="middle">sin 45° = cos 45° = 1/√2</text>
  <text x="638" y="416" font-size="13" fill="#e8e8e8" text-anchor="middle">tan 45° = 1</text>
</svg>
