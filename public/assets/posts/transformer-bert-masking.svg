<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>
  <g font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
    <text x="440" y="46" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">MLM의 80 / 10 / 10 규칙</text>
    <text x="440" y="72" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">「my dog is hairy」에서 hairy가 예측 대상으로 뽑혔을 때</text>

    <!-- root -->
    <rect x="300" y="96" width="280" height="56" rx="8" fill="#141414" stroke="#555"/>
    <text x="440" y="129" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">입력 토큰 전체</text>

    <!-- level 2 -->
    <rect x="60" y="196" width="280" height="60" rx="8" fill="#141414" stroke="#555"/>
    <text x="200" y="221" font-size="14" font-weight="600" fill="#888" text-anchor="middle">85% · 그대로 둔다</text>
    <text x="200" y="241" font-size="13" fill="#888" text-anchor="middle">손실을 계산하지 않는다</text>
    <rect x="540" y="196" width="280" height="60" rx="8" fill="#141414" stroke="#7ec8e3" stroke-width="2"/>
    <text x="680" y="221" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">15% · 예측 대상</text>
    <text x="680" y="241" font-size="13" fill="#888" text-anchor="middle">원래 토큰을 맞혀야 한다</text>
    <path d="M 400 152 L 400 174 L 200 174 L 200 196" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 480 152 L 480 174 L 680 174 L 680 196" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>

    <!-- leaves -->
    <rect x="60" y="310" width="240" height="84" rx="8" fill="#141414" stroke="#7777cc" stroke-width="2"/>
    <text x="180" y="337" font-size="14" font-weight="600" fill="#7777cc" text-anchor="middle">80% · [MASK]로</text>
    <text x="180" y="359" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e8e8e8" text-anchor="middle">my dog is [MASK]</text>
    <text x="180" y="379" font-size="13" fill="#888" text-anchor="middle">빈칸임을 알고 채운다</text>

    <rect x="320" y="310" width="240" height="84" rx="8" fill="#141414" stroke="#e05555" stroke-width="2"/>
    <text x="440" y="337" font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">10% · 무작위 토큰으로</text>
    <text x="440" y="359" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e8e8e8" text-anchor="middle">my dog is apple</text>
    <text x="440" y="379" font-size="13" fill="#888" text-anchor="middle">멀쩡해 보여도 의심한다</text>

    <rect x="580" y="310" width="240" height="84" rx="8" fill="#141414" stroke="#55c555" stroke-width="2"/>
    <text x="700" y="337" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">10% · 그대로</text>
    <text x="700" y="359" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e8e8e8" text-anchor="middle">my dog is hairy</text>
    <text x="700" y="379" font-size="13" fill="#888" text-anchor="middle">보이는 토큰도 믿고 쓴다</text>

    <line x1="680" y1="256" x2="680" y2="282" stroke="#7ec8e3" stroke-width="2"/>
    <line x1="180" y1="282" x2="700" y2="282" stroke="#7ec8e3" stroke-width="2"/>
    <line x1="180" y1="282" x2="180" y2="310" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="440" y1="282" x2="440" y2="310" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="700" y1="282" x2="700" y2="310" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>

    <text x="440" y="432" font-size="13" fill="#888" text-anchor="middle">세 경우 모두 정답은 hairy — 모델은 어느 자리가 바뀌었는지 모른 채 모든 토큰의 표현을 성실히 만들어야 한다</text>
  </g>
</svg>
