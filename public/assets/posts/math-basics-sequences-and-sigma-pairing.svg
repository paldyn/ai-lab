<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="450" rx="12" fill="#0a0a0a"/>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">앞뒤로 짝지으면 모든 짝의 합이 같다</text>
  <text x="60" y="74" font-size="13" fill="#888">앞에서 하나 오르는 만큼 뒤에서 하나 내려오기 때문이다</text>

  <text x="60" y="179" font-size="13" fill="#55c555">앞에서</text>
  <text x="60" y="285" font-size="13" fill="#7ec8e3">뒤에서</text>

  <rect x="170" y="146" width="100" height="54" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="220" y="180" font-size="20" fill="#e8e8e8" text-anchor="middle">1</text>
  <rect x="300" y="146" width="100" height="54" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="350" y="180" font-size="20" fill="#e8e8e8" text-anchor="middle">2</text>
  <rect x="430" y="146" width="100" height="54" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="480" y="180" font-size="20" fill="#e8e8e8" text-anchor="middle">3</text>
  <rect x="560" y="146" width="100" height="54" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="610" y="180" font-size="20" fill="#888" text-anchor="middle">⋯</text>
  <rect x="690" y="146" width="100" height="54" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="740" y="180" font-size="20" fill="#e8e8e8" text-anchor="middle">50</text>

  <rect x="170" y="252" width="100" height="54" rx="6" fill="#101010" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="220" y="286" font-size="20" fill="#e8e8e8" text-anchor="middle">100</text>
  <rect x="300" y="252" width="100" height="54" rx="6" fill="#101010" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="350" y="286" font-size="20" fill="#e8e8e8" text-anchor="middle">99</text>
  <rect x="430" y="252" width="100" height="54" rx="6" fill="#101010" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="480" y="286" font-size="20" fill="#e8e8e8" text-anchor="middle">98</text>
  <rect x="560" y="252" width="100" height="54" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="610" y="286" font-size="20" fill="#888" text-anchor="middle">⋯</text>
  <rect x="690" y="252" width="100" height="54" rx="6" fill="#101010" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="740" y="286" font-size="20" fill="#e8e8e8" text-anchor="middle">51</text>

  <line x1="220" y1="200" x2="220" y2="252" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="350" y1="200" x2="350" y2="252" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="480" y1="200" x2="480" y2="252" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="610" y1="200" x2="610" y2="252" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="740" y1="200" x2="740" y2="252" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>

  <text x="60" y="342" font-size="13" fill="#888">짝의 합</text>
  <text x="220" y="342" font-size="18" fill="#7777cc" text-anchor="middle">101</text>
  <text x="350" y="342" font-size="18" fill="#7777cc" text-anchor="middle">101</text>
  <text x="480" y="342" font-size="18" fill="#7777cc" text-anchor="middle">101</text>
  <text x="610" y="342" font-size="18" fill="#888" text-anchor="middle">⋯</text>
  <text x="740" y="342" font-size="18" fill="#7777cc" text-anchor="middle">101</text>

  <rect x="60" y="372" width="760" height="48" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="402" font-size="14" fill="#e8e8e8">짝이 100 ÷ 2 = 50 개이므로 1 + 2 + ⋯ + 100 = 50 × 101 = 5050</text>
</svg>
