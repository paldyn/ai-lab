<svg xmlns="http://www.w3.org/2000/svg" width="880" height="472" viewBox="0 0 880 472">
  <rect width="880" height="472" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">제로샷의 세 실패 유형</text>
  <text x="440" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#888" text-anchor="middle">실패가 무작위가 아니라 종류가 정해져 있다</text>

  <!-- 개수 세기 -->
  <rect x="50" y="104" width="246" height="216" rx="10" fill="#141414" stroke="#e05555" stroke-width="1.5"/>
  <text x="173" y="136" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e05555" text-anchor="middle">개수 세기</text>
  <rect x="66" y="152" width="214" height="34" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="80" y="174" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff">three dogs</text>
  <rect x="66" y="194" width="214" height="34" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="80" y="216" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff">five dogs</text>
  <text x="66" y="258" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">두 문장의 점수가 거의 같다</text>
  <text x="66" y="282" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">대조 학습에 개수를 세라는</text>
  <text x="66" y="300" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">신호가 들어 있지 않다</text>

  <!-- 공간 관계 -->
  <rect x="317" y="104" width="246" height="216" rx="10" fill="#141414" stroke="#e05555" stroke-width="1.5"/>
  <text x="440" y="136" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e05555" text-anchor="middle">공간 관계</text>
  <rect x="333" y="152" width="214" height="34" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="347" y="174" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff">a cat on top of a box</text>
  <rect x="333" y="194" width="214" height="34" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="347" y="216" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff">a box on top of a cat</text>
  <text x="333" y="258" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">낱말 가방처럼 취급된다</text>
  <text x="333" y="282" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">어순 차이를 벌릴 이유를</text>
  <text x="333" y="300" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">대조 학습이 주지 않았다</text>

  <!-- 세밀 분류 -->
  <rect x="584" y="104" width="246" height="216" rx="10" fill="#141414" stroke="#e05555" stroke-width="1.5"/>
  <text x="707" y="136" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e05555" text-anchor="middle">세밀 분류</text>
  <rect x="600" y="152" width="214" height="34" rx="6" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="614" y="174" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">개 품종 · 항공기 기종</text>
  <rect x="600" y="194" width="214" height="34" rx="6" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="614" y="216" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">자동차 부품</text>
  <text x="600" y="258" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">정확도가 급격히 떨어진다</text>
  <text x="600" y="282" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">웹 캡션에 그 전문 용어가</text>
  <text x="600" y="300" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888">정확히 붙는 일이 드물다</text>

  <rect x="50" y="352" width="780" height="60" rx="8" fill="#12121a" stroke="#444" stroke-width="1"/>
  <text x="74" y="376" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8">셋 다 프롬프트를 아무리 다듬어도 크게 나아지지 않는다.</text>
  <text x="74" y="396" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888">구조가 아니라 학습 신호에 없던 것이므로, 필요하면 라벨을 붙여 학습시키는 수밖에 없다.</text>
</svg>
