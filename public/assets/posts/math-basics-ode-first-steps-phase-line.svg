<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<defs>
  <marker id="up" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
    <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
  </marker>
</defs>
<rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>
<text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">위상선 — 평형해 위아래의 흐름</text>
<text x="440" y="70" text-anchor="middle" font-size="13" fill="#888">오른쪽 식이 양수인 구간은 위로, 음수인 구간은 아래로 화살표</text>

<text x="180" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">y' = y</text>
<text x="440" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">y' = −y</text>
<text x="700" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">y' = ky(1 − y/M)</text>

<line x1="180" y1="140" x2="180" y2="400" stroke="#888" stroke-width="1.5"/>
<line x1="440" y1="140" x2="440" y2="400" stroke="#888" stroke-width="1.5"/>
<line x1="700" y1="140" x2="700" y2="400" stroke="#888" stroke-width="1.5"/>
<text x="192" y="150" font-size="13" fill="#888">y</text>
<text x="452" y="150" font-size="13" fill="#888">y</text>
<text x="712" y="150" font-size="13" fill="#888">y</text>

<line x1="180" y1="250" x2="180" y2="172" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#up)"/>
<line x1="180" y1="290" x2="180" y2="368" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#up)"/>
<circle cx="180" cy="270" r="7" fill="#0a0a0a" stroke="#e05555" stroke-width="2.5"/>
<text x="160" y="275" text-anchor="end" font-size="13" fill="#888">0</text>
<text x="200" y="215" font-size="13" fill="#888">양수 → 위로</text>
<text x="200" y="335" font-size="13" fill="#888">음수 → 아래로</text>

<line x1="440" y1="172" x2="440" y2="250" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#up)"/>
<line x1="440" y1="368" x2="440" y2="290" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#up)"/>
<circle cx="440" cy="270" r="7" fill="#55c555"/>
<text x="420" y="275" text-anchor="end" font-size="13" fill="#888">0</text>
<text x="460" y="215" font-size="13" fill="#888">음수 → 아래로</text>
<text x="460" y="335" font-size="13" fill="#888">양수 → 위로</text>

<line x1="700" y1="148" x2="700" y2="190" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#up)"/>
<line x1="700" y1="318" x2="700" y2="230" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#up)"/>
<line x1="700" y1="350" x2="700" y2="392" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#up)"/>
<circle cx="700" cy="210" r="7" fill="#55c555"/>
<circle cx="700" cy="330" r="7" fill="#0a0a0a" stroke="#e05555" stroke-width="2.5"/>
<text x="680" y="215" text-anchor="end" font-size="13" fill="#888">M</text>
<text x="680" y="335" text-anchor="end" font-size="13" fill="#888">0</text>
<text x="720" y="175" font-size="13" fill="#888">음수</text>
<text x="720" y="275" font-size="13" fill="#888">양수</text>
<text x="720" y="380" font-size="13" fill="#888">음수</text>

<text x="180" y="430" text-anchor="middle" font-size="16" font-weight="600" fill="#e05555">0은 불안정</text>
<text x="440" y="430" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">0은 안정</text>
<text x="700" y="430" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">0 불안정 · M 안정</text>

<circle cx="296" cy="466" r="7" fill="#55c555"/>
<text x="312" y="471" font-size="13" fill="#888">안정 — 양쪽에서 모여든다</text>
<circle cx="530" cy="466" r="7" fill="#0a0a0a" stroke="#e05555" stroke-width="2.5"/>
<text x="546" y="471" font-size="13" fill="#888">불안정 — 양쪽으로 밀려난다</text>
</svg>
