<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="420" fill="#0a0a0a" rx="12"/>
  <text x="60" y="46" fill="#e8e8e8" font-size="22" font-weight="700">AB와 BA는 다르다</text>
  <text x="60" y="72" fill="#888" font-size="13">곱하는 순서를 바꾸면 결과가 달라집니다. 수에서는 없던 일입니다.</text>

  <!-- ===== 첫 줄: AB ===== -->
  <text x="187" y="118" fill="#7ec8e3" font-size="14" font-weight="700" text-anchor="middle">A</text>
  <text x="342" y="118" fill="#55c555" font-size="14" font-weight="700" text-anchor="middle">B</text>
  <text x="515" y="118" fill="#e8e8e8" font-size="14" font-weight="700" text-anchor="middle">AB</text>

  <path d="M 148,130 L 130,130 L 130,220 L 148,220" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 227,130 L 245,130 L 245,220 L 227,220" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" text-anchor="middle" fill="#7ec8e3">
    <text x="165" y="162">1</text>
    <text x="210" y="162">2</text>
    <text x="165" y="200">3</text>
    <text x="210" y="200">4</text>
  </g>

  <text x="265" y="182" fill="#e8e8e8" font-size="22" text-anchor="middle">×</text>

  <path d="M 303,130 L 285,130 L 285,220 L 303,220" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 382,130 L 400,130 L 400,220 L 382,220" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" text-anchor="middle" fill="#55c555">
    <text x="320" y="162">5</text>
    <text x="365" y="162">6</text>
    <text x="320" y="200">7</text>
    <text x="365" y="200">8</text>
  </g>

  <text x="420" y="182" fill="#e8e8e8" font-size="22" text-anchor="middle">=</text>

  <path d="M 458,130 L 440,130 L 440,220 L 458,220" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 572,130 L 590,130 L 590,220 L 572,220" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#e8e8e8">
    <text x="485" y="162">19</text>
    <text x="545" y="162">22</text>
    <text x="485" y="200">43</text>
    <text x="545" y="200">50</text>
  </g>

  <!-- ===== 둘째 줄: BA ===== -->
  <text x="187" y="258" fill="#55c555" font-size="14" font-weight="700" text-anchor="middle">B</text>
  <text x="342" y="258" fill="#7ec8e3" font-size="14" font-weight="700" text-anchor="middle">A</text>
  <text x="515" y="258" fill="#e8e8e8" font-size="14" font-weight="700" text-anchor="middle">BA</text>

  <path d="M 148,270 L 130,270 L 130,360 L 148,360" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 227,270 L 245,270 L 245,360 L 227,360" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" text-anchor="middle" fill="#55c555">
    <text x="165" y="302">5</text>
    <text x="210" y="302">6</text>
    <text x="165" y="340">7</text>
    <text x="210" y="340">8</text>
  </g>

  <text x="265" y="322" fill="#e8e8e8" font-size="22" text-anchor="middle">×</text>

  <path d="M 303,270 L 285,270 L 285,360 L 303,360" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 382,270 L 400,270 L 400,360 L 382,360" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" text-anchor="middle" fill="#7ec8e3">
    <text x="320" y="302">1</text>
    <text x="365" y="302">2</text>
    <text x="320" y="340">3</text>
    <text x="365" y="340">4</text>
  </g>

  <text x="420" y="322" fill="#e8e8e8" font-size="22" text-anchor="middle">=</text>

  <path d="M 458,270 L 440,270 L 440,360 L 458,360" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <path d="M 572,270 L 590,270 L 590,360 L 572,360" stroke="#e8e8e8" stroke-width="2" fill="none"/>
  <g font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#e8e8e8">
    <text x="485" y="302">23</text>
    <text x="545" y="302">34</text>
    <text x="485" y="340">31</text>
    <text x="545" y="340">46</text>
  </g>

  <!-- ===== 두 결과를 묶어 가리키는 자리 ===== -->
  <path d="M 600,175 L 625,175 L 625,315 L 600,315" stroke="#e05555" stroke-width="2" fill="none"/>
  <line x1="625" y1="245" x2="650" y2="245" stroke="#e05555" stroke-width="2"/>
  <text x="662" y="256" fill="#e05555" font-size="30" font-weight="700">≠</text>
  <text x="662" y="294" fill="#888" font-size="13">네 자리가 모두</text>
  <text x="662" y="314" fill="#888" font-size="13">다릅니다</text>

  <text x="60" y="400" fill="#888" font-size="13">이어서 하는 두 걸음이라 순서가 뜻의 일부입니다.</text>
</svg>
