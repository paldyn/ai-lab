<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">같은 세로줄이 세 자리에서 다른 뜻이다</text>
  <text x="60" y="82" font-size="13" fill="#888">기호를 외우는 것이 아니라, 안에 무엇이 들어 있는지를 보고 읽는다</text>

  <rect x="60" y="130" width="214" height="186" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="167" y="160" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">절댓값</text>
  <text x="167" y="212" font-size="22" font-weight="700" fill="#7ec8e3" text-anchor="middle">|−3| = 3</text>
  <text x="167" y="250" font-size="13" fill="#888" text-anchor="middle">0에서 떨어진 거리</text>
  <text x="167" y="292" font-size="13" fill="#7777cc" text-anchor="middle">10번에서 배운다</text>

  <rect x="334" y="130" width="214" height="186" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="441" y="160" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">원소의 개수</text>
  <text x="441" y="212" font-size="18" font-weight="700" fill="#7ec8e3" text-anchor="middle">|{2, 4, 6}| = 3</text>
  <text x="441" y="250" font-size="13" fill="#888" text-anchor="middle">집합에 든 원소의 수</text>
  <text x="441" y="292" font-size="13" fill="#7777cc" text-anchor="middle">37번에서 배운다</text>

  <rect x="606" y="130" width="214" height="186" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="713" y="160" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">행렬식</text>
  <text x="713" y="212" font-size="20" font-weight="700" fill="#7ec8e3" text-anchor="middle">|A| = ad − bc</text>
  <text x="713" y="250" font-size="13" fill="#888" text-anchor="middle">행렬에 붙는 수 하나</text>
  <text x="713" y="292" font-size="13" fill="#7777cc" text-anchor="middle">44번에서 배운다</text>
</svg>
