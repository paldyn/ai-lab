  <text x="60" y="356" font-size="13" fill="#888">첫 칸은 높이가 0이라 아예 없고,</text>
  <text x="60" y="376" font-size="13" fill="#888">나머지도 곡선 아래에만 있습니다.</text>

  <rect x="520" y="290.625" width="70" height="9.375" fill="#55c555" fill-opacity="0.22" stroke="#55c555" stroke-width="1.5"/>
  <rect x="590" y="262.5" width="70" height="37.5" fill="#55c555" fill-opacity="0.22" stroke="#55c555" stroke-width="1.5"/>
