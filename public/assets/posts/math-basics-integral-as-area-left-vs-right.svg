  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">왼쪽 끝으로 재면 모자라고, 오른쪽 끝으로 재면 넘친다</text>

  <text x="60" y="92" font-size="16" font-weight="600" fill="#7777cc">왼쪽 끝 — 합이 0.21875</text>
  <text x="470" y="92" font-size="16" font-weight="600" fill="#55c555">오른쪽 끝 — 합이 0.46875</text>

  <rect x="180" y="290.625" width="70" height="9.375" fill="#7777cc" fill-opacity="0.22" stroke="#7777cc" stroke-width="1.5"/>
