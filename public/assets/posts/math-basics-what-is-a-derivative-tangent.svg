<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="440" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">할선을 좁히면 접선이 되고, 그 기울기가 f'(a)</text>

  <line x1="120" y1="368" x2="800" y2="368" stroke="#888" stroke-width="1.5"/>
  <line x1="180" y1="96" x2="180" y2="388" stroke="#888" stroke-width="1.5"/>
  <text x="808" y="373" font-size="13" fill="#888">x</text>
  <text x="172" y="90" font-size="13" fill="#888">y</text>

  <line x1="300" y1="363" x2="300" y2="373" stroke="#444" stroke-width="1.5"/>
  <text x="294" y="390" font-size="13" fill="#888">a</text>
  <line x1="620" y1="363" x2="620" y2="373" stroke="#444" stroke-width="1.5"/>
  <text x="602" y="390" font-size="13" fill="#888">a+h</text>

  <path d="M 180 358 Q 400 350 560 250 T 740 130" stroke="#7ec8e3" stroke-width="2.5" fill="none"/>

  <line x1="252" y1="366" x2="660" y2="195" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="256" y1="359" x2="600" y2="258" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="212" y1="361" x2="700" y2="279" stroke="#55c555" stroke-width="2.5"/>

  <circle cx="620" cy="212" r="5" fill="#7777cc"/>
  <circle cx="470" cy="296" r="5" fill="#7777cc"/>
  <circle cx="300" cy="346" r="5" fill="#e8e8e8"/>
  <text x="236" y="328" font-size="13" fill="#888">(a, f(a))</text>

  <text x="672" y="192" font-size="13" fill="#7777cc">할선 — h가 클 때</text>
  <text x="612" y="255" font-size="13" fill="#7777cc">할선 — h가 작을 때</text>
  <text x="712" y="302" font-size="16" font-weight="600" fill="#55c555">접선</text>
  <text x="712" y="324" font-size="13" fill="#55c555">기울기 = f'(a)</text>

  <text x="120" y="422" font-size="13" fill="#888">h를 줄이면 오른쪽 점이 (a, f(a))로 내려오고, 할선(보라)의 기울기가 접선(초록)의 기울기 하나로 몰립니다.</text>
</svg>
