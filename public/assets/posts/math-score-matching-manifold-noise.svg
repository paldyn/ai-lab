  <text x="60" y="116" font-size="16" font-weight="600" fill="#e8e8e8">잡음 전 — 곡선 밖은 밀도 0</text>
  <text x="460" y="116" font-size="16" font-weight="600" fill="#e8e8e8">잡음 후 — q(x_t)가 어디서나 양수</text>
  <text x="60" y="398" font-size="13" fill="#888">곡선 밖(?)에서는 log p가 없어 스코어가 정의되지 않고,</text>
  <text x="60" y="418" font-size="13" fill="#888">학습 표본도 그 자리에 떨어지지 않는다</text>
  <text x="460" y="398" font-size="13" fill="#888">잡음이 곡선 둘레를 채워(띠) 어디서든 화살표가</text>
  <text x="460" y="418" font-size="13" fill="#888">곡선 쪽을 가리키며 끊김 없이 이어진다</text>
