<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="380" fill="#0a0a0a" rx="12"/>
  <text x="60" y="46" fill="#e8e8e8" font-size="22" font-weight="700">det A = 0: 두 열이 한 직선 위에 놓인다</text>
  <text x="60" y="72" fill="#888" font-size="13">한 열이 다른 열의 배수이면 평행사변형이 납작해져 넓이가 0입니다.</text>

  <!-- Left: nonzero det -->
  <text x="200" y="105" fill="#7ec8e3" font-size="14" font-weight="700" text-anchor="middle">det ≠ 0: 넓이가 있음</text>
  <line x1="80" y1="290" x2="340" y2="290" stroke="#888" stroke-width="1.2"/>
  <line x1="200" y1="130" x2="200" y2="330" stroke="#888" stroke-width="1.2"/>
  <!-- A = [[2,1],[1,2]] -->
  <polygon points="200,290 280,250 320,170 240,210" fill="#7ec8e3" fill-opacity="0.25" stroke="#7ec8e3" stroke-width="2"/>
  <circle cx="280" cy="250" r="4" fill="#e8e8e8"/>
  <circle cx="240" cy="210" r="4" fill="#e8e8e8"/>
  <text x="200" y="240" fill="#7ec8e3" font-size="13" text-anchor="middle">넓이 3</text>
  <text x="200" y="355" fill="#e8e8e8" font-size="13" text-anchor="middle">det = 2·2 − 1·1 = 3</text>

  <!-- Right: zero det -->
  <text x="620" y="105" fill="#e05555" font-size="14" font-weight="700" text-anchor="middle">det = 0: 납작함 (넓이 0)</text>
  <line x1="500" y1="290" x2="760" y2="290" stroke="#888" stroke-width="1.2"/>
  <line x1="620" y1="130" x2="620" y2="330" stroke="#888" stroke-width="1.2"/>
  <!-- A = [[2,4],[1,2]]: columns (2,1) and (4,2). Both on same line y=x/2 -->
  <line x1="620" y1="290" x2="740" y2="230" stroke="#e05555" stroke-width="3"/>
  <circle cx="680" cy="260" r="4" fill="#e8e8e8"/>
  <circle cx="740" cy="230" r="4" fill="#e8e8e8"/>
  <text x="686" y="278" fill="#e8e8e8" font-size="12">(2, 1)</text>
  <text x="746" y="228" fill="#e8e8e8" font-size="12">(4, 2)</text>
  <text x="620" y="355" fill="#e8e8e8" font-size="13" text-anchor="middle">det = 2·2 − 4·1 = 0</text>

  <!-- Bottom text -->
  <rect x="60" y="290" width="20" height="20" fill="none"/>
</svg>
