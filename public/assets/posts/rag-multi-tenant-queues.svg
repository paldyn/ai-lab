<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<defs><marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
<text x="440" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">대기열 하나와 고객사별 대기열</text>
<text x="440" y="74" text-anchor="middle" font-size="13" fill="#888">A사가 문서를 대량으로 올린 직후, B사와 C사가 한 건씩 올렸다</text>
<text x="230" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">대기열 하나</text>
<rect x="60" y="136" width="340" height="56" rx="8" fill="#111" stroke="#555" stroke-width="1.5"/>
<rect x="74" y="150" width="24" height="28" rx="3" fill="#e05555"/>
<rect x="104" y="150" width="24" height="28" rx="3" fill="#e05555"/>
<rect x="134" y="150" width="24" height="28" rx="3" fill="#e05555"/>
<rect x="164" y="150" width="24" height="28" rx="3" fill="#e05555"/>
<rect x="194" y="150" width="24" height="28" rx="3" fill="#e05555"/>
<rect x="224" y="150" width="24" height="28" rx="3" fill="#e05555"/>
<rect x="254" y="150" width="24" height="28" rx="3" fill="#e05555"/>
<rect x="284" y="150" width="24" height="28" rx="3" fill="#e05555"/>
