  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">미리 잡으면 대부분이 논다</text>
  <text x="60" y="72" font-size="13" fill="#888">한도 2,048토큰, 실제로 쓴 길이는 요청마다 다르다.</text>

  <text x="60" y="112" font-size="16" font-weight="600" fill="#e05555">① 최대 길이만큼 미리 잡는 방식</text>

  <rect x="60" y="128" width="700" height="30" rx="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <rect x="60" y="128" width="175" height="30" rx="4" fill="#22401f" stroke="#55c555" stroke-width="1"/>
  <text x="772" y="148" font-size="12" fill="#888">A · 512</text>

  <rect x="60" y="168" width="700" height="30" rx="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <rect x="60" y="168" width="103" height="30" rx="4" fill="#22401f" stroke="#55c555" stroke-width="1"/>
