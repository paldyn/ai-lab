<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="fw" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="404" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">사람이 끼어들 수 있는 세 자리</text>
  <text x="60" y="72" font-size="13" fill="#888">하나도 안 두면 위험하고, 걸음마다 두면 아무도 그 에이전트를 쓰지 않는다.</text>

  <line x1="204" y1="142" x2="270" y2="142" stroke="#7ec8e3" stroke-width="2" marker-end="url(#fw)"/>
  <line x1="406" y1="142" x2="472" y2="142" stroke="#7ec8e3" stroke-width="2" marker-end="url(#fw)"/>
  <line x1="608" y1="142" x2="674" y2="142" stroke="#7ec8e3" stroke-width="2" marker-end="url(#fw)"/>

  <rect x="68" y="110" width="136" height="64" rx="8" fill="#0d1117" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="136" y="136" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">계획</text>
  <text x="136" y="156" font-size="11.5" fill="#888" text-anchor="middle">걸음을 나열한다</text>

  <rect x="270" y="110" width="136" height="64" rx="8" fill="#0d1117" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="338" y="136" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">실행 루프</text>
  <text x="338" y="156" font-size="11.5" fill="#888" text-anchor="middle">읽기·조회 중심</text>

  <rect x="472" y="110" width="136" height="64" rx="8" fill="#0d1117" stroke="#e05555" stroke-width="1.5"/>
  <text x="540" y="136" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">쓰기·전송</text>
  <text x="540" y="156" font-size="11.5" fill="#888" text-anchor="middle">밖을 바꾼다</text>

  <rect x="674" y="110" width="136" height="64" rx="8" fill="#0d1117" stroke="#55c555" stroke-width="1.5"/>
  <text x="742" y="136" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">산출물</text>
  <text x="742" y="156" font-size="11.5" fill="#888" text-anchor="middle">사람에게 간다</text>

  <circle cx="237" cy="142" r="12" fill="#0a0a0a" stroke="#7777cc" stroke-width="2"/>
  <text x="237" y="147" font-size="13" font-weight="700" fill="#7777cc" text-anchor="middle">1</text>
  <circle cx="439" cy="142" r="12" fill="#0a0a0a" stroke="#7777cc" stroke-width="2"/>
  <text x="439" y="147" font-size="13" font-weight="700" fill="#7777cc" text-anchor="middle">2</text>
  <circle cx="641" cy="142" r="12" fill="#0a0a0a" stroke="#7777cc" stroke-width="2"/>
  <text x="641" y="147" font-size="13" font-weight="700" fill="#7777cc" text-anchor="middle">3</text>

  <rect x="60" y="230" width="220" height="92" rx="10" fill="#0d1117" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="86" cy="255" r="12" fill="#0a0a0a" stroke="#7777cc" stroke-width="2"/>
  <text x="86" y="260" font-size="13" font-weight="700" fill="#7777cc" text-anchor="middle">1</text>
  <text x="108" y="260" font-size="15" font-weight="600" fill="#e8e8e8">계획 승인</text>
  <text x="80" y="286" font-size="12.5" fill="#888">무엇을 할 셈인지</text>
  <text x="80" y="306" font-size="12.5" fill="#888">돌기 전에 보여 준다</text>

  <rect x="330" y="230" width="220" height="92" rx="10" fill="#0d1117" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="356" cy="255" r="12" fill="#0a0a0a" stroke="#7777cc" stroke-width="2"/>
  <text x="356" y="260" font-size="13" font-weight="700" fill="#7777cc" text-anchor="middle">2</text>
  <text x="378" y="260" font-size="15" font-weight="600" fill="#e8e8e8">행동 승인</text>
  <text x="350" y="286" font-size="12.5" fill="#888">되돌릴 수 없는 걸음</text>
  <text x="350" y="306" font-size="12.5" fill="#888">직전에만 멈춘다</text>

  <rect x="600" y="230" width="220" height="92" rx="10" fill="#0d1117" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="626" cy="255" r="12" fill="#0a0a0a" stroke="#7777cc" stroke-width="2"/>
  <text x="626" y="260" font-size="13" font-weight="700" fill="#7777cc" text-anchor="middle">3</text>
  <text x="648" y="260" font-size="15" font-weight="600" fill="#e8e8e8">결과 검수</text>
  <text x="620" y="286" font-size="12.5" fill="#888">내보내기 전에</text>
  <text x="620" y="306" font-size="12.5" fill="#888">사람이 한 번 본다</text>

  <text x="60" y="368" font-size="13" fill="#7ec8e3">셋 다 켜는 것이 가장 안전해 보이지만, 사람의 시간을 세 번 쓴다. 되돌릴 수 없는 자리부터 고른다.</text>
</svg>
