<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="mf-red" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
    <marker id="mf-green" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="mf-gray" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="mf-amber" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#c8a33e"/>
    </marker>
  </defs>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">실패의 종류가 다음 자리를 정한다</text>
  <text x="62" y="72" font-size="13" fill="#888">무조건 다음 모델로 넘기면 안 되는 실패가 셋 있다. 갈래를 먼저 나눈 뒤에 넘긴다.</text>

  <rect x="62" y="106" width="200" height="60" rx="6" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="162" y="130" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">1차 모델 호출</text>
  <text x="162" y="150" font-size="11" fill="#aaaaaa" text-anchor="middle">가장 좋은 모델</text>

  <line x1="262" y1="136" x2="336" y2="136" stroke="#7777cc" stroke-width="2" marker-end="url(#mf-gray)"/>

  <rect x="336" y="106" width="200" height="60" rx="6" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="436" y="130" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">실패를 분류한다</text>
  <text x="436" y="150" font-size="11" fill="#aaaaaa" text-anchor="middle">상태 코드와 본문을 본다</text>

  <path d="M 436 166 L 436 196 L 176 196 L 176 224" fill="none" stroke="#55c555" stroke-width="2" marker-end="url(#mf-green)"/>
  <path d="M 436 166 L 436 224" fill="none" stroke="#c8a33e" stroke-width="2" marker-end="url(#mf-amber)"/>
  <path d="M 436 166 L 436 196 L 700 196 L 700 224" fill="none" stroke="#e05555" stroke-width="2" marker-end="url(#mf-red)"/>

  <rect x="62" y="230" width="228" height="82" rx="6" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="176" y="254" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">한도 초과 · 과부하</text>
  <text x="176" y="274" font-size="11" fill="#aaaaaa" text-anchor="middle">429 · 503 · 연결 끊김</text>
  <text x="176" y="294" font-size="11" fill="#55c555" text-anchor="middle">다음 모델로 넘긴다</text>

  <rect x="322" y="230" width="228" height="82" rx="6" fill="#2a2414" stroke="#c8a33e" stroke-width="1.5"/>
  <text x="436" y="254" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">시간 초과</text>
  <text x="436" y="274" font-size="11" fill="#aaaaaa" text-anchor="middle">응답이 기한 안에 안 온다</text>
  <text x="436" y="294" font-size="11" fill="#c8a33e" text-anchor="middle">남은 예산이 있을 때만</text>

  <rect x="586" y="230" width="232" height="82" rx="6" fill="#2a1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="702" y="254" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">입력이 잘못됨 · 거절</text>
  <text x="702" y="274" font-size="11" fill="#aaaaaa" text-anchor="middle">400 · 401 · 안전 정책 거절</text>
  <text x="702" y="294" font-size="11" fill="#e05555" text-anchor="middle">넘기지 않고 그대로 알린다</text>

  <rect x="62" y="342" width="756" height="56" rx="6" fill="#101418" stroke="#3a4a6e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="440" y="365" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">넘기기로 한 것만 2차 모델로</text>
  <text x="440" y="385" font-size="11" fill="#aaaaaa" text-anchor="middle">다른 제공자 · 다른 리전 · 더 작은 모델 — 1차와 함께 죽지 않는 자리를 고른다</text>
</svg>
