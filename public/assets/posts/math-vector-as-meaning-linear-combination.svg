<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="lc" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">셋은 이름만 다르고 같은 계산이다</text>
  <text x="60" y="82" font-size="13" fill="#888">여러 벡터에 각각 수를 곱해 더한 것 — 선형결합 하나뿐이다</text>

  <rect x="60" y="120" width="240" height="150" rx="8" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="80" y="150" font-size="15" font-weight="700" fill="#7ec8e3">mean pooling</text>
  <text x="80" y="182" font-size="15" fill="#e8e8e8">(v₁ + v₂ + v₃) / 3</text>
  <text x="80" y="212" font-size="13" fill="#888">계수가 전부 1/3 로 같다</text>
  <text x="80" y="246" font-size="13" fill="#7777cc">토큰 벡터를 한 줄로 줄일 때</text>

  <rect x="320" y="120" width="240" height="150" rx="8" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="340" y="150" font-size="15" font-weight="700" fill="#7ec8e3">어텐션 출력</text>
  <text x="340" y="182" font-size="15" fill="#e8e8e8">α₁v₁ + α₂v₂ + α₃v₃</text>
  <text x="340" y="212" font-size="13" fill="#888">계수가 softmax 가 정한 비율</text>
  <text x="340" y="246" font-size="13" fill="#7777cc">합이 1이라는 것만 다르다</text>

  <rect x="580" y="120" width="240" height="150" rx="8" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="600" y="150" font-size="15" font-weight="700" fill="#7ec8e3">임베딩 산술</text>
  <text x="600" y="182" font-size="15" fill="#e8e8e8">king − man + woman</text>
  <text x="600" y="212" font-size="13" fill="#888">계수가 1, −1, 1</text>
  <text x="600" y="246" font-size="13" fill="#7777cc">뺄셈도 −1을 곱해 더한 것</text>

  <line x1="180" y1="286" x2="180" y2="316" stroke="#7ec8e3" stroke-width="2" marker-end="url(#lc)"/>
  <line x1="440" y1="286" x2="440" y2="316" stroke="#7ec8e3" stroke-width="2" marker-end="url(#lc)"/>
  <line x1="700" y1="286" x2="700" y2="316" stroke="#7ec8e3" stroke-width="2" marker-end="url(#lc)"/>

  <rect x="60" y="322" width="760" height="52" rx="8" fill="#7ec8e3" fill-opacity="0.08" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="354" font-size="18" font-weight="700" fill="#e8e8e8" text-anchor="middle">c₁v₁ + c₂v₂ + … + cₙvₙ &#160;— 선형결합</text>
</svg>
