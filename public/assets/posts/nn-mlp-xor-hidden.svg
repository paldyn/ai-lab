<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<rect width="880" height="450" rx="12" fill="#0a0a0a"/>
<text x="440" y="46" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">은닉층이 바꾼 좌표</text>
<text x="440" y="74" text-anchor="middle" fill="#888" font-size="13">h₁ = ReLU(x₁ + x₂),  h₂ = ReLU(x₁ + x₂ − 1)</text>
<rect x="50" y="96" width="360" height="296" rx="8" fill="#111111" stroke="#2a2a2a"/>
<text x="230" y="124" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="600">입력 공간 (x₁, x₂)</text>
<rect x="470" y="96" width="360" height="296" rx="8" fill="#111111" stroke="#2a2a2a"/>
<text x="650" y="124" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="600">은닉 공간 (h₁, h₂)</text>
<line x1="100" y1="330" x2="380" y2="330" stroke="#444" stroke-width="1"/>
<line x1="120" y1="350" x2="120" y2="140" stroke="#444" stroke-width="1"/>
<text x="384" y="334" fill="#888" font-size="13">x₁</text>
<text x="126" y="148" fill="#888" font-size="13">x₂</text>
<circle cx="120" cy="330" r="8" fill="#e05555"/>
<text x="134" y="358" text-anchor="start" fill="#888" font-size="13">(0,0)</text>
<circle cx="300" cy="330" r="8" fill="#7ec8e3"/>
<text x="300" y="358" text-anchor="middle" fill="#888" font-size="13">(1,0)</text>
<circle cx="120" cy="195" r="8" fill="#7ec8e3"/>
<text x="134" y="223" text-anchor="start" fill="#888" font-size="13">(0,1)</text>
<circle cx="300" cy="195" r="8" fill="#e05555"/>
<text x="300" y="223" text-anchor="middle" fill="#888" font-size="13">(1,1)</text>
<text x="230" y="270" text-anchor="middle" fill="#e05555" font-size="13">직선 하나로 못 가른다</text>
<line x1="520" y1="330" x2="810" y2="330" stroke="#444" stroke-width="1"/>
<line x1="540" y1="350" x2="540" y2="140" stroke="#444" stroke-width="1"/>
<text x="790" y="354" fill="#888" font-size="13">h₁</text>
<text x="546" y="148" fill="#888" font-size="13">h₂</text>
<line x1="582" y1="339" x2="804" y2="228" stroke="#55c555" stroke-width="2" stroke-dasharray="5,3"/>
<text x="640" y="244" text-anchor="middle" fill="#55c555" font-size="13">h₁ − 2h₂ = 0.5</text>
<circle cx="540" cy="330" r="8" fill="#e05555"/>
<circle cx="660" cy="330" r="8" fill="#7ec8e3"/>
<circle cx="780" cy="210" r="8" fill="#e05555"/>
<text x="554" y="370" fill="#888" font-size="13">(0,0)</text>
<text x="660" y="370" text-anchor="middle" fill="#888" font-size="13">(0,1)·(1,0) → (1,0)</text>
<text x="770" y="184" text-anchor="middle" fill="#888" font-size="13">(1,1) → (2,1)</text>
<circle cx="360" cy="422" r="7" fill="#7ec8e3"/><text x="374" y="427" fill="#888" font-size="13">XOR = 1</text>
<circle cx="470" cy="422" r="7" fill="#e05555"/><text x="484" y="427" fill="#888" font-size="13">XOR = 0</text>
</svg>
