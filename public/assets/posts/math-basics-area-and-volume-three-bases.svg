<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="430" rx="12" fill="#0a0a0a"/>
  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">밑변을 바꾸면 높이도 바뀐다</text>
  <text x="60" y="82" font-size="13" fill="#888">세 변이 3, 4, 5인 같은 직각삼각형 — 어느 변을 밑변으로 잡아도 넓이는 6</text>
  <polygon points="120,320 240,320 120,160" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <polyline points="120,306 134,306 134,320" fill="none" stroke="#e8e8e8" stroke-width="1.5"/>
  <line x1="120" y1="320" x2="240" y2="320" stroke="#e8e8e8" stroke-width="4"/>
  <line x1="120" y1="160" x2="120" y2="320" stroke="#7777cc" stroke-width="3"/>
  <text x="180" y="346" font-size="13" fill="#e8e8e8" text-anchor="middle">밑변 3</text>
  <text x="108" y="244" font-size="13" fill="#7777cc" text-anchor="end">높이 4</text>
  <text x="192" y="232" font-size="13" fill="#888">5</text>
  <text x="180" y="390" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">3 × 4 ÷ 2 = 6</text>

  <polygon points="350,320 510,320 350,200" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <polyline points="350,306 364,306 364,320" fill="none" stroke="#e8e8e8" stroke-width="1.5"/>
  <line x1="350" y1="320" x2="510" y2="320" stroke="#e8e8e8" stroke-width="4"/>
  <line x1="350" y1="200" x2="350" y2="320" stroke="#7777cc" stroke-width="3"/>
  <text x="430" y="346" font-size="13" fill="#e8e8e8" text-anchor="middle">밑변 4</text>
  <text x="340" y="264" font-size="13" fill="#7777cc" text-anchor="end">높이 3</text>
  <text x="440" y="250" font-size="13" fill="#888">5</text>
  <text x="430" y="390" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">4 × 3 ÷ 2 = 6</text>

  <polygon points="600,320 800,320 672,224" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="600" y1="320" x2="800" y2="320" stroke="#e8e8e8" stroke-width="4"/>
  <line x1="672" y1="224" x2="672" y2="320" stroke="#7777cc" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polyline points="672,306 686,306 686,320" fill="none" stroke="#7777cc" stroke-width="1.5"/>
  <text x="700" y="346" font-size="13" fill="#e8e8e8" text-anchor="middle">밑변 5</text>
  <text x="684" y="280" font-size="13" fill="#7777cc">높이 2.4</text>
  <text x="622" y="262" font-size="13" fill="#888">3</text>
  <text x="744" y="262" font-size="13" fill="#888">4</text>
  <text x="700" y="390" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">5 × 2.4 ÷ 2 = 6</text>
</svg>
