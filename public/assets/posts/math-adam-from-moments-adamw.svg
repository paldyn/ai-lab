<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 450">
<rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>
<defs><marker id="aw1" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/></marker></defs>
<defs><marker id="aw2" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/></marker></defs>
<text x="60" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">가중치 감쇠가 들어가는 자리가 다르다</text>
<text x="60" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">왼쪽은 손실에 더하는 L2 정규화, 오른쪽은 갱신에서 따로 빼는 AdamW</text>
<text x="60" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e05555">L2 정규화</text>
<rect x="60" y="130" width="350" height="60" rx="8" fill="#111827" stroke="#e05555" stroke-width="1.5"/>
<text x="78" y="154" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">gₜ = ∇L(θ) + λθ</text>
<text x="78" y="174" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">감쇠 항이 그래디언트 안으로 들어간다</text>
<rect x="60" y="220" width="350" height="60" rx="8" fill="#111827" stroke="#e05555" stroke-width="1.5"/>
<text x="78" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">vₜ 에도 λθ 가 섞인다</text>
<text x="78" y="264" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">규모를 재는 값이 감쇠 항까지 같이 잰다</text>
<rect x="60" y="310" width="350" height="60" rx="8" fill="#111827" stroke="#e05555" stroke-width="1.5"/>
<text x="78" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">θ ← θ − η Mₜ ÷ (√Vₜ + ε)</text>
<text x="78" y="354" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">감쇠도 √Vₜ 로 나뉜다</text>
<line x1="235" y1="190" x2="235" y2="218" stroke="#e05555" stroke-width="2" marker-end="url(#aw1)"/>
<line x1="235" y1="280" x2="235" y2="308" stroke="#e05555" stroke-width="2" marker-end="url(#aw1)"/>
<text x="60" y="412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">그래디언트가 큰 파라미터일수록 √Vₜ 가 커서</text>
<text x="60" y="432" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">감쇠가 약해진다 — 규제 세기가 제멋대로다</text>
<text x="470" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">AdamW (분리형 감쇠)</text>
<rect x="470" y="130" width="350" height="60" rx="8" fill="#111827" stroke="#55c555" stroke-width="1.5"/>
<text x="488" y="154" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">gₜ = ∇L(θ)</text>
<text x="488" y="174" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">감쇠 항이 그래디언트에 없다</text>
<rect x="470" y="220" width="350" height="60" rx="8" fill="#111827" stroke="#55c555" stroke-width="1.5"/>
<text x="488" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">vₜ 는 손실의 그래디언트만 잰다</text>
<text x="488" y="264" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">규모를 재는 값이 오염되지 않는다</text>
<rect x="470" y="310" width="350" height="60" rx="8" fill="#111827" stroke="#55c555" stroke-width="1.5"/>
<text x="488" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">θ ← θ − η Mₜ ÷ (√Vₜ + ε) − ηλθ</text>
<text x="488" y="354" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">감쇠는 √Vₜ 를 거치지 않는다</text>
<line x1="645" y1="190" x2="645" y2="218" stroke="#55c555" stroke-width="2" marker-end="url(#aw2)"/>
<line x1="645" y1="280" x2="645" y2="308" stroke="#55c555" stroke-width="2" marker-end="url(#aw2)"/>
<text x="470" y="412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">모든 파라미터가 스텝마다 같은 비율 ηλ 로</text>
<text x="470" y="432" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">줄어든다 — λ 가 뜻대로 동작한다</text>
</svg>
