  <rect x="50" y="374" width="780" height="68" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="74" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">배치는 검색을 고치는 방법이 아니라 이미 뽑은 것을 덜 낭비하는 방법이다</text>
  <text x="74" y="422" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#9aa4b8">조각이 서넛뿐이면 셋의 차이는 거의 없다 — 개수가 열을 넘어갈 때부터 벌어진다</text>
