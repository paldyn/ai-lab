<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="440" rx="12" fill="#0a0a0a"/>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">한 칸 어긋나게 놓고 빼면 가운데가 통째로 지워진다</text>
  <text x="60" y="74" font-size="13" fill="#888">r 을 곱하면 모든 항이 오른쪽으로 한 칸 밀린다</text>

  <text x="60" y="180" font-size="14" font-weight="600" fill="#e8e8e8">Sₙ</text>
  <rect x="120" y="150" width="100" height="50" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.8"/>
  <text x="170" y="181" font-size="15" fill="#55c555" text-anchor="middle">a</text>
  <rect x="230" y="150" width="100" height="50" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="280" y="181" font-size="15" fill="#777" text-anchor="middle">ar</text>
  <rect x="340" y="150" width="100" height="50" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="390" y="181" font-size="15" fill="#777" text-anchor="middle">ar²</text>
  <rect x="450" y="150" width="100" height="50" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="500" y="181" font-size="15" fill="#777" text-anchor="middle">⋯</text>
  <rect x="560" y="150" width="100" height="50" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="610" y="181" font-size="15" fill="#777" text-anchor="middle">arⁿ⁻¹</text>

  <text x="60" y="260" font-size="14" font-weight="600" fill="#e8e8e8">r Sₙ</text>
  <rect x="230" y="230" width="100" height="50" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="280" y="261" font-size="15" fill="#777" text-anchor="middle">ar</text>
  <rect x="340" y="230" width="100" height="50" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="390" y="261" font-size="15" fill="#777" text-anchor="middle">ar²</text>
  <rect x="450" y="230" width="100" height="50" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="500" y="261" font-size="15" fill="#777" text-anchor="middle">⋯</text>
  <rect x="560" y="230" width="100" height="50" rx="6" fill="#101010" stroke="#444" stroke-width="1"/>
  <text x="610" y="261" font-size="15" fill="#777" text-anchor="middle">arⁿ⁻¹</text>
  <rect x="670" y="230" width="100" height="50" rx="6" fill="#101010" stroke="#e05555" stroke-width="1.8"/>
  <text x="720" y="261" font-size="15" fill="#e05555" text-anchor="middle">arⁿ</text>

  <line x1="240" y1="215" x2="650" y2="215" stroke="#7777cc" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="445" y="128" font-size="13" fill="#7777cc" text-anchor="middle">이 네 칸은 위아래가 같다 — 빼면 전부 사라진다</text>

  <line x1="120" y1="312" x2="820" y2="312" stroke="#333" stroke-width="1"/>
  <text x="120" y="348" font-size="20" fill="#e8e8e8">Sₙ − r Sₙ =</text>
  <text x="290" y="348" font-size="20" fill="#55c555">a</text>
  <text x="315" y="348" font-size="20" fill="#e8e8e8">−</text>
  <text x="345" y="348" font-size="20" fill="#e05555">arⁿ</text>

  <rect x="60" y="374" width="760" height="44" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="402" font-size="13" fill="#e8e8e8">남는 것은 왼쪽 끝의 a 와 오른쪽 끝의 arⁿ 둘뿐이다. 여기서 Sₙ 을 풀어내면 공식이 나온다.</text>
</svg>
