<svg xmlns="http://www.w3.org/2000/svg" width="880" height="466" viewBox="0 0 880 466" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="466" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">여러 고객사를 담는 세 가지 모양</text>
  <text x="60" y="72" font-size="13" fill="#888">격리가 셀수록 비용이 오르고 담을 수 있는 고객사 수가 줄어든다. 셋을 섞어 쓰는 것이 보통이다.</text>
  <rect x="60" y="100" width="213" height="46" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="166" y="128" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">고객사마다 색인 하나</text>
  <rect x="333" y="100" width="213" height="46" rx="8" fill="#101418" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="439" y="128" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">한 색인, 고객사마다 칸</text>
  <rect x="606" y="100" width="214" height="46" rx="8" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="713" y="128" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">한 색인, 값으로만 구분</text>
