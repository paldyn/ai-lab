  <text x="712" y="280" font-size="11.5" fill="#888" text-anchor="middle">색 = tenant 값</text>
  <text x="60" y="308" font-size="12" font-weight="600" fill="#888">격리</text>
  <text x="60" y="326" font-size="12.5" fill="#e8e8e8">물리적으로 갈라진다</text>
  <text x="333" y="308" font-size="12" font-weight="600" fill="#888">격리</text>
  <text x="333" y="326" font-size="12.5" fill="#e8e8e8">같은 파일, 칸이 다르다</text>
  <text x="606" y="308" font-size="12" font-weight="600" fill="#888">격리</text>
  <text x="606" y="326" font-size="12.5" fill="#e8e8e8">조건 하나에 달렸다</text>
  <text x="60" y="350" font-size="12" font-weight="600" fill="#888">비용</text>
  <text x="60" y="368" font-size="12.5" fill="#e8e8e8">고객사 수만큼 붙는다</text>
  <text x="333" y="350" font-size="12" font-weight="600" fill="#888">비용</text>
  <text x="333" y="368" font-size="12.5" fill="#e8e8e8">칸마다 조금씩 붙는다</text>
  <text x="606" y="350" font-size="12" font-weight="600" fill="#888">비용</text>
  <text x="606" y="368" font-size="12.5" fill="#e8e8e8">거의 안 붙는다</text>
  <text x="60" y="392" font-size="12" font-weight="600" fill="#888">한계</text>
  <text x="60" y="410" font-size="12.5" fill="#e8e8e8">수백 개가 벽이다</text>
  <text x="333" y="392" font-size="12" font-weight="600" fill="#888">한계</text>
  <text x="333" y="410" font-size="12.5" fill="#e8e8e8">수만 개까지 간다</text>
  <text x="606" y="392" font-size="12" font-weight="600" fill="#888">한계</text>
  <text x="606" y="410" font-size="12.5" fill="#e8e8e8">조건을 빼면 곧바로 샌다</text>
  <text x="60" y="444" font-size="13" fill="#7ec8e3">큰 고객사만 전용 색인으로 떼고 나머지는 한 색인에 담는 식으로 나누는 경우가 많다.</text>
