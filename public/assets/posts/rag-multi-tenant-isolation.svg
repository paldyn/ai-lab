  <text x="166" y="231" font-size="12.5" fill="#e8e8e8" text-anchor="middle">고객사 B 색인</text>
  <rect x="76" y="252" width="181" height="36" rx="6" fill="#0d1014" stroke="#55c555" stroke-width="1.5"/>
  <text x="166" y="275" font-size="12.5" fill="#e8e8e8" text-anchor="middle">고객사 C 색인</text>
