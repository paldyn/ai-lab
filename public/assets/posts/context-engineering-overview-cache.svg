  <rect x="366" y="152" width="145" height="64" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="438" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
