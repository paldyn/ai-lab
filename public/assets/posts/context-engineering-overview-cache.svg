  <text x="744" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">매번 새로</text>

  <text x="60" y="240" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888">첫 요청은 쓰기 1.25배, 다음부터 읽기 0.1배 — 같은 앞부분으로 두 번만 보내도 이득이다.</text>

  <!-- 무효화 -->
  <text x="60" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e05555">② 시스템 프롬프트에 현재 시각을 넣으면</text>

  <rect x="60" y="300" width="145" height="64" rx="8" fill="#0f1f0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="132" y="326" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8" text-anchor="middle">도구 정의</text>
  <text x="132" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#55c555" text-anchor="middle">여기까지만 산다</text>

  <rect x="213" y="300" width="145" height="64" rx="8" fill="#1f0f0f" stroke="#e05555" stroke-width="1.5"/>
  <text x="285" y="326" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8" text-anchor="middle">시스템 프롬프트</text>
  <text x="285" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e05555" text-anchor="middle">매분 바뀐다</text>

  <rect x="366" y="300" width="145" height="64" rx="8" fill="#1a1a1a" stroke="#e05555" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="438" y="326" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">대화 이력</text>
  <text x="438" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e05555" text-anchor="middle">무효</text>

  <rect x="519" y="300" width="145" height="64" rx="8" fill="#1a1a1a" stroke="#e05555" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="591" y="326" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">검색 문서</text>
  <text x="591" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e05555" text-anchor="middle">무효</text>

  <rect x="672" y="300" width="145" height="64" rx="8" fill="#1a1a1a" stroke="#e05555" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="744" y="326" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">이번 질문</text>
  <text x="744" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#e05555" text-anchor="middle">무효</text>

  <text x="60" y="388" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888">오류는 안 난다 — 값이 그냥 원래대로 나온다. 캐시로 읽은 토큰 수를 확인해야 안다.</text>
</svg>
