  <rect x="213" y="152" width="145" height="64" rx="8" fill="#0f1f0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="285" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8" text-anchor="middle">시스템 프롬프트</text>
  <text x="285" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
