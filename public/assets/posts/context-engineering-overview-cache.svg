  <text x="438" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">매번 새로</text>

  <rect x="519" y="152" width="145" height="64" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="591" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8" text-anchor="middle">검색 문서</text>
  <text x="591" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">매번 새로</text>

  <rect x="672" y="152" width="145" height="64" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="744" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
