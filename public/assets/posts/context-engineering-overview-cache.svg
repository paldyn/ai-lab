<svg xmlns="http://www.w3.org/2000/svg" width="880" height="448" viewBox="0 0 880 448">
  <defs>
    <marker id="ord" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="880" height="448" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">프리픽스 캐싱과 무효화</text>
  <text x="440" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#888" text-anchor="middle">앞부분이 한 바이트라도 달라지면 그 뒤가 통째로 무효가 된다</text>

  <text x="60" y="100" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888">요청이 조립되는 순서</text>
  <line x1="60" y1="114" x2="810" y2="114" stroke="#666" stroke-width="2" marker-end="url(#ord)"/>

  <!-- 정상 배치 -->
  <text x="60" y="140" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#55c555">① 안 바뀌는 것을 앞에</text>

  <rect x="60" y="152" width="145" height="64" rx="8" fill="#0f1f0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="132" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#e8e8e8" text-anchor="middle">도구 정의</text>
  <text x="132" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
