<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">대각합과 행렬식만 보고 고윳값의 갈래를 읽는다</text>

  <line x1="70" y1="300" x2="800" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="300" y1="390" x2="300" y2="56" stroke="#888" stroke-width="1.5"/>
  <text x="796" y="322" font-size="13" fill="#888">tr A</text>
  <text x="312" y="66" font-size="13" fill="#888">det A</text>

  <polyline points="90,120 125,175 160,220 195,255 230,280 265,295 300,300 335,295 370,280 405,255 440,220 475,175 510,120 541,62"
            fill="none" stroke="#7777cc" stroke-width="2.5"/>
  <text x="556" y="92" font-size="13" font-weight="600" fill="#7777cc">(tr A)² = 4 det A</text>

  <text x="120" y="120" font-size="14" font-weight="600" fill="#e05555">판별식 &lt; 0</text>
  <text x="120" y="144" font-size="13" fill="#9aa4b8">실수 고윳값이 없다</text>
  <text x="600" y="240" font-size="14" font-weight="600" fill="#55c555">판별식 &gt; 0</text>
  <text x="600" y="264" font-size="13" fill="#9aa4b8">실수 고윳값이 둘</text>
  <text x="600" y="352" font-size="13" fill="#9aa4b8">det A &lt; 0 이면 두 값의 부호가 다르다</text>

  <circle cx="440" cy="240" r="5" fill="#e8e8e8"/>
  <text x="458" y="228" font-size="13" fill="#e8e8e8">열 (2,1),(1,2) — 합 4, 곱 3</text>

  <circle cx="370" cy="280" r="5" fill="#e8e8e8"/>
  <text x="386" y="308" font-size="13" fill="#e8e8e8">전단 — 합 2, 곱 1 (곡선 위)</text>

  <circle cx="300" cy="280" r="5" fill="#e8e8e8"/>
  <text x="200" y="200" text-anchor="end" font-size="13" fill="#e8e8e8">90도 회전 — 합 0, 곱 1</text>
  <line x1="206" y1="196" x2="292" y2="272" stroke="#555" stroke-width="1"/>

  <circle cx="475" cy="340" r="5" fill="#e8e8e8"/>
  <text x="490" y="346" font-size="13" fill="#e8e8e8">열 (1,3),(2,4) — 합 5, 곱 −2</text>

  <rect x="60" y="396" width="760" height="40" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="82" y="422" font-size="14" fill="#e8e8e8">곡선 위는 중근이다. 합이 0인데 곱이 양수인 자리처럼, 실수 둘로는 만들 수 없는 조합이 곡선 위쪽이다.</text>
</svg>
