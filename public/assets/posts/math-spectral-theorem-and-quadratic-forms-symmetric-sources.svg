<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">AI에서 고윳값을 보는 행렬은 세 갈래로 나오고, 셋 다 대칭이다</text>
  <text x="60" y="70" font-size="13" fill="#888">공통점은 하나 — 「둘 사이의 관계」를 재는 양이라 i와 j를 바꿔도 값이 같다</text>

  <rect x="60" y="98" width="240" height="188" rx="10" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="82" y="130" font-size="16" font-weight="600" fill="#e8e8e8">그람 행렬</text>
  <text x="82" y="158" font-size="15" fill="#7ec8e3">XᵀX</text>
  <text x="82" y="188" font-size="13" fill="#9aa4b8">(i, j) 성분은</text>
  <text x="82" y="208" font-size="13" fill="#9aa4b8">i번 열과 j번 열의 내적</text>
  <text x="82" y="240" font-size="13" fill="#e8e8e8">(XᵀX)ᵀ = XᵀX</text>
  <text x="82" y="266" font-size="13" fill="#55c555">내적은 순서가 없다</text>

  <rect x="320" y="98" width="240" height="188" rx="10" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="342" y="130" font-size="16" font-weight="600" fill="#e8e8e8">공분산 행렬</text>
  <text x="342" y="158" font-size="15" fill="#7ec8e3">(1/n) XᵀX</text>
  <text x="342" y="188" font-size="13" fill="#9aa4b8">(i, j) 성분은</text>
  <text x="342" y="208" font-size="13" fill="#9aa4b8">i번 특성과 j번 특성의 공분산</text>
  <text x="342" y="240" font-size="13" fill="#e8e8e8">Cov(i, j) = Cov(j, i)</text>
  <text x="342" y="266" font-size="13" fill="#55c555">함께 움직인 정도는 하나다</text>

  <rect x="580" y="98" width="240" height="188" rx="10" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="602" y="130" font-size="16" font-weight="600" fill="#e8e8e8">헤세 행렬</text>
  <text x="602" y="158" font-size="15" fill="#7ec8e3">∂²L / ∂wᵢ∂wⱼ</text>
  <text x="602" y="188" font-size="13" fill="#9aa4b8">(i, j) 성분은</text>
  <text x="602" y="208" font-size="13" fill="#9aa4b8">두 파라미터로 차례로 미분</text>
  <text x="602" y="240" font-size="13" fill="#e8e8e8">∂ᵢ∂ⱼL = ∂ⱼ∂ᵢL</text>
  <text x="602" y="266" font-size="13" fill="#55c555">미분 순서를 바꿔도 같다</text>

  <rect x="60" y="312" width="760" height="60" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="82" y="338" font-size="14" fill="#e8e8e8">그래서 앞 글에서 본 「대각화가 안 되는 사고」— 전단처럼 방향이 모자라거나 회전처럼</text>
  <text x="82" y="358" font-size="14" fill="#e8e8e8">실수 방향이 없는 경우 — 는 이 세 자리에서 일어나지 않는다.</text>
</svg>
