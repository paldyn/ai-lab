  <text x="427" y="160" font-size="13" fill="#7ec8e3">9·12·15</text>
  <text x="269" y="430" font-size="13" fill="#888" text-anchor="middle">모눈 한 칸이 길이 1</text>

  <rect x="510" y="170" width="310" height="152" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="534" y="196" font-size="14" font-weight="600" fill="#e8e8e8">세 빗변이 한 직선 위에 있다</text>
  <text x="534" y="222" font-size="13" fill="#888">가로 4칸 갈 때 세로 3칸</text>
  <text x="534" y="246" font-size="13" fill="#888">가로 8칸 갈 때 세로 6칸</text>
  <text x="534" y="270" font-size="13" fill="#888">가로 12칸 갈 때 세로 9칸</text>
  <text x="534" y="302" font-size="14" fill="#7ec8e3">크기가 달라도 계단은 같다</text>
