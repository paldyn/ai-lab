  <circle cx="212" cy="210" r="5" fill="#55c555" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="72" cy="330" r="5" fill="#e05555"/><text x="86" y="335" font-size="13" fill="#e8e8e8">가장 높은 칸의 중심</text>
  <circle cx="72" cy="356" r="5" fill="#55c555"/><text x="86" y="361" font-size="13" fill="#e8e8e8">이웃 칸으로 ¼칸 옮긴 자리</text>
  <text x="62" y="392" font-size="13" fill="#888">오른쪽·아래 이웃이 왼쪽·위보다 높다</text>
  <text x="62" y="412" font-size="13" fill="#888">→ 참 봉우리는 칸 중심보다 그쪽에 있다</text>
  <rect x="400" y="100" width="418" height="84" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="424" y="128" font-size="15" font-weight="600" fill="#e8e8e8">① 해상도의 상한</text>
  <text x="424" y="150" font-size="12" fill="#9aa4b8">입력 256×192 → 히트맵 64×48, 한 칸 = 원본 4픽셀</text>
  <text x="424" y="168" font-size="12" fill="#9aa4b8">칸 중심만 쓰면 가로·세로로 최대 2픽셀씩 어긋난다</text>
  <rect x="400" y="200" width="418" height="84" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="424" y="228" font-size="15" font-weight="600" fill="#e8e8e8">② 이웃과 견주기</text>
  <text x="424" y="250" font-size="12" fill="#9aa4b8">가장 높은 칸의 좌우·상하 이웃 값을 비교한다</text>
  <text x="424" y="268" font-size="12" fill="#9aa4b8">높은 쪽으로 ¼칸(원본 1픽셀) 옮기는 것이 흔한 보정</text>
  <rect x="400" y="300" width="418" height="84" rx="8" fill="#12151c" stroke="#e05555" stroke-width="1.5"/>
  <text x="424" y="328" font-size="15" font-weight="600" fill="#e8e8e8">③ 두 봉우리</text>
  <text x="424" y="350" font-size="12" fill="#9aa4b8">비슷한 높이의 봉우리가 둘이면 모델이 헷갈리는 중</text>
  <text x="424" y="368" font-size="12" fill="#9aa4b8">좌표만 내는 회귀에는 이 정보가 남지 않는다</text>
