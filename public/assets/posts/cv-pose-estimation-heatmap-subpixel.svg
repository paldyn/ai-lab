  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">히트맵 봉우리와 소수점 보정</text>
  <text x="62" y="68" font-size="13" fill="#888">손목 하나의 히트맵 일부 — 한 칸이 원본 4픽셀이다. 진할수록 「여기일 확률」이 높다.</text>
