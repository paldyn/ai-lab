<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="tr-arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">번역하면 안 되는 것은 빼 두고 되돌린다</text>

  <text x="60" y="84" font-size="13" fill="#888">1. 원문</text>
  <rect x="60" y="94" width="760" height="46" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="123" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">Click </tspan><tspan fill="#ce9178">`Save Draft`</tspan><tspan fill="#ffffff"> to keep </tspan><tspan fill="#b5cea8">{doc_title}</tspan><tspan fill="#ffffff"> in </tspan><tspan fill="#ce9178">Atlas Search</tspan><tspan fill="#ffffff">.</tspan></text>

  <line x1="440" y1="143" x2="440" y2="172" stroke="#7777cc" stroke-width="2" marker-end="url(#tr-arr)"/>
  <text x="452" y="164" font-size="13" fill="#7777cc">mask() — 긴 것부터 치환</text>

  <text x="60" y="196" font-size="13" fill="#888">2. 가린 뒤 (모델에 넘어가는 것)</text>
  <rect x="60" y="206" width="760" height="46" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="235" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">Click </tspan><tspan fill="#7ec8e3" font-weight="600">⟦0⟧</tspan><tspan fill="#ffffff"> to keep </tspan><tspan fill="#7ec8e3" font-weight="600">⟦1⟧</tspan><tspan fill="#ffffff"> in </tspan><tspan fill="#7ec8e3" font-weight="600">⟦2⟧</tspan><tspan fill="#ffffff">.</tspan></text>

  <line x1="440" y1="255" x2="440" y2="284" stroke="#7777cc" stroke-width="2" marker-end="url(#tr-arr)"/>
  <text x="452" y="276" font-size="13" fill="#7777cc">번역 — 자리 표시는 건드리지 않는다</text>

  <text x="60" y="308" font-size="13" fill="#888">3. 번역문</text>
  <rect x="60" y="318" width="760" height="46" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="347" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">⟦1⟧</tspan><tspan fill="#ffffff">을(를) </tspan><tspan fill="#7ec8e3" font-weight="600">⟦2⟧</tspan><tspan fill="#ffffff">에 보관하려면 </tspan><tspan fill="#7ec8e3" font-weight="600">⟦0⟧</tspan><tspan fill="#ffffff">을(를) 누르세요.</tspan></text>

  <rect x="60" y="384" width="370" height="46" rx="8" fill="#12141a" stroke="#55c555" stroke-width="1.5"/>
  <text x="78" y="412" font-size="13" fill="#55c555">unmask() 후 검사: 넣은 3개 = 되돌린 3개</text>

  <rect x="450" y="384" width="370" height="46" rx="8" fill="#12141a" stroke="#e05555" stroke-width="1.5"/>
  <text x="468" y="412" font-size="13" fill="#e05555">⟦ 또는 ⟧ 가 남아 있으면 자동 통과 금지</text>
</svg>
