<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <defs>
    <style>
      text { font-family: 'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif; }
      .event-date { font-size: 13px; font-weight: 700; fill: #e8e8e8; }
      .event-name { font-size: 13px; font-weight: 600; fill: #b8b8b8; }
      .event-note { font-size: 12px; fill: #888888; }
      .band-name { font-size: 14px; font-weight: 700; fill: #e8e8e8; }
      .band-range { font-size: 12px; fill: #aaaaaa; }
    </style>
    <marker id="timelineArrow" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#0a0a0a" rx="12"/>

  <text x="60" y="52" font-size="22" font-weight="700" fill="#e8e8e8">AI 발전 타임라인</text>
  <text x="60" y="80" font-size="15" fill="#888888">AI 안에 ML, DL, LLM이 차례로 등장했습니다</text>

  <!-- 주요 사건 -->
  <text x="96" y="126" class="event-date" text-anchor="middle">1950s</text>
  <text x="96" y="150" class="event-name" text-anchor="middle">AI 탄생</text>
  <text x="96" y="172" class="event-note" text-anchor="middle">(규칙 기반)</text>

  <text x="232" y="126" class="event-date" text-anchor="middle">1980s</text>
  <text x="232" y="150" class="event-name" text-anchor="middle">신경망 이론</text>
  <text x="232" y="172" class="event-note" text-anchor="middle">(미실용)</text>

  <text x="368" y="126" class="event-date" text-anchor="middle">1997</text>
  <text x="368" y="150" class="event-name" text-anchor="middle">딥블루</text>
  <text x="368" y="172" class="event-note" text-anchor="middle">(체스 우승)</text>

  <text x="504" y="126" class="event-date" text-anchor="middle">2012</text>
  <text x="504" y="150" class="event-name" text-anchor="middle">AlexNet</text>
  <text x="504" y="172" class="event-note" text-anchor="middle">(DL 실용화)</text>

  <text x="640" y="126" class="event-date" text-anchor="middle">2017</text>
  <text x="640" y="150" class="event-name" text-anchor="middle">Transformer</text>
  <text x="640" y="172" class="event-note" text-anchor="middle">(LLM의 기반)</text>

  <text x="776" y="126" class="event-date" text-anchor="middle">2022</text>
  <text x="776" y="150" class="event-name" text-anchor="middle">ChatGPT</text>
  <text x="776" y="172" class="event-note" text-anchor="middle">(LLM 대중화)</text>

  <line x1="60" y1="206" x2="820" y2="206" stroke="#888888" stroke-width="2"
        marker-end="url(#timelineArrow)"/>
  <circle cx="96" cy="206" r="6" fill="#0a0a0a" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="232" cy="206" r="6" fill="#0a0a0a" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="368" cy="206" r="6" fill="#0a0a0a" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="504" cy="206" r="7" fill="#101820" stroke="#7ec8e3" stroke-width="2"/>
  <circle cx="640" cy="206" r="7" fill="#121020" stroke="#a79dff" stroke-width="2"/>
  <circle cx="776" cy="206" r="7" fill="#101c16" stroke="#55c555" stroke-width="2"/>

  <!-- 각 흐름이 본격화된 뒤에도 바깥 분야 안에 함께 남습니다 -->
  <rect x="60" y="250" width="760" height="34" rx="6" fill="#12161c" stroke="#555555" stroke-width="1"/>
  <text x="80" y="272" class="band-name">AI</text>
  <text x="800" y="272" class="band-range" text-anchor="end">1950s —</text>

  <rect x="296" y="294" width="524" height="34" rx="6" fill="#111a20" stroke="#667788" stroke-width="1"/>
  <text x="316" y="316" class="band-name">ML 주류화</text>
  <text x="800" y="316" class="band-range" text-anchor="end">1990s —</text>

  <rect x="504" y="338" width="316" height="34" rx="6" fill="#111822" stroke="#7ec8e3" stroke-width="1"/>
  <text x="524" y="360" class="band-name">DL</text>
  <text x="800" y="360" class="band-range" text-anchor="end">2012 —</text>

  <rect x="640" y="382" width="180" height="34" rx="6" fill="#151426" stroke="#a79dff" stroke-width="1"/>
  <text x="660" y="404" class="band-name">현대 LLM 기반</text>
  <text x="800" y="404" class="band-range" text-anchor="end">2017 —</text>
</svg>
