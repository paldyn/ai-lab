<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <defs>
    <marker id="arrBeam" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>

  <text x="60" y="52" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">Beam Search — 빔 넓이 4</text>
  <text x="60" y="80" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">스텝마다 4 × V 개의 후보를 만들고 누적 로그 확률 상위 4개만 남긴다</text>

  <text x="60" y="128" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">Step 1 — SOS 뒤의 V개 중 4개</text>
  <text x="470" y="128" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">Step 2 — 4 × V개 중 4개</text>

  <rect x="60" y="150" width="350" height="40" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="80" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">A</text>
  <text x="330" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555">0.60</text>

  <rect x="60" y="202" width="350" height="40" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="80" y="228" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">B</text>
  <text x="330" y="228" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555">0.30</text>

  <rect x="60" y="254" width="350" height="40" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="80" y="280" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">C</text>
  <text x="330" y="280" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555">0.08</text>

  <rect x="60" y="306" width="350" height="40" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="80" y="332" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">D</text>
  <text x="330" y="332" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555">0.02</text>

  <text x="60" y="378" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">나머지 V − 4개는 여기서 버려진다</text>

  <line x1="410" y1="248" x2="470" y2="248" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrBeam)"/>

  <rect x="470" y="150" width="350" height="40" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="490" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">B → Y</text>
  <text x="740" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555">0.27</text>

  <rect x="470" y="202" width="350" height="40" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="490" y="228" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">A → X</text>
  <text x="740" y="228" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555">0.06</text>

  <rect x="470" y="254" width="350" height="40" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="490" y="280" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">A → Z</text>
  <text x="740" y="280" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555">0.05</text>

  <rect x="470" y="306" width="350" height="40" rx="6" fill="#111111" stroke="#55c555" stroke-width="1.5"/>
  <text x="490" y="332" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e8e8e8">C → W</text>
  <text x="740" y="332" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555">0.04</text>

  <text x="470" y="378" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">D로 시작한 가설은 여기서 모두 밀려났다</text>

  <rect x="60" y="410" width="760" height="56" rx="6" fill="#111111" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="434" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e05555">탐욕 디코딩이 놓치는 것</text>
  <text x="84" y="456" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">Step 1에서 A 하나만 남기므로 B로 시작해 0.27에 닿는 경로를 볼 수 없다</text>
</svg>
