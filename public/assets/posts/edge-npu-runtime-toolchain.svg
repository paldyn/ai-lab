<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="404" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="np-blue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="np-red" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">NPU는 미리 컴파일한 것만 실행한다</text>
  <text x="62" y="72" font-size="13" fill="#888">GPU처럼 모델 파일을 그냥 올려서 돌리는 경로가 없다. 빌드 때 끝내는 일과 기기에서 하는 일이 갈린다.</text>

  <rect x="62" y="104" width="756" height="140" rx="8" fill="#0d1117" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="82" y="130" font-size="16" font-weight="600" fill="#7ec8e3">빌드 시점 — 개발자 기계에서</text>

  <rect x="82" y="146" width="156" height="76" rx="6" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="160" y="172" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">학습된 모델</text>
  <text x="160" y="192" font-size="11" fill="#aaaaaa" text-anchor="middle">PyTorch · ONNX</text>
  <text x="160" y="210" font-size="11" fill="#aaaaaa" text-anchor="middle">부동소수점</text>

  <line x1="238" y1="184" x2="290" y2="184" stroke="#7ec8e3" stroke-width="2" marker-end="url(#np-blue)"/>

  <rect x="296" y="146" width="156" height="76" rx="6" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="374" y="172" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">양자화</text>
  <text x="374" y="192" font-size="11" fill="#aaaaaa" text-anchor="middle">INT8 고정 스케일</text>
  <text x="374" y="210" font-size="11" fill="#aaaaaa" text-anchor="middle">보정 데이터가 필요</text>

  <line x1="452" y1="184" x2="504" y2="184" stroke="#7ec8e3" stroke-width="2" marker-end="url(#np-blue)"/>

  <rect x="510" y="146" width="156" height="76" rx="6" fill="#2a2414" stroke="#c8a33e" stroke-width="1.5"/>
  <text x="588" y="172" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">벤더 컴파일러</text>
  <text x="588" y="192" font-size="11" fill="#aaaaaa" text-anchor="middle">연산자를 검사한다</text>
  <text x="588" y="210" font-size="11" fill="#c8a33e" text-anchor="middle">여기서 대부분 막힌다</text>

  <line x1="666" y1="184" x2="718" y2="184" stroke="#7ec8e3" stroke-width="2" marker-end="url(#np-blue)"/>

  <rect x="724" y="146" width="76" height="76" rx="6" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="762" y="180" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">전용</text>
  <text x="762" y="200" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">바이너리</text>

  <path d="M 588 222 L 588 254 L 374 254 L 374 268" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#np-red)"/>
  <text x="606" y="238" font-size="12" fill="#e05555">지원 안 하는 연산자가 있으면</text>

  <rect x="62" y="274" width="624" height="66" rx="6" fill="#2a1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="374" y="300" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">모델 구조를 고쳐서 다시 학습하거나, 그 층만 CPU로 뺀다</text>
  <text x="374" y="322" font-size="11" fill="#aaaaaa" text-anchor="middle">CPU로 빼면 층마다 메모리를 오가느라 NPU를 쓰는 이득이 사라지기도 한다</text>

  <rect x="62" y="356" width="756" height="34" rx="6" fill="#0d1117" stroke="#3a4a6e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="440" y="378" font-size="13" fill="#e8e8e8" text-anchor="middle">기기에서 — 바이너리를 불러 실행만 한다. 여기서는 모델을 못 바꾼다</text>
</svg>
