<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arrR" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>
  <text x="440" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">평가의 두 주기</text>

  <!-- 변경 -->
  <rect x="60" y="100" width="150" height="64" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="135" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">프롬프트 변경</text>
  <text x="135" y="148" text-anchor="middle" font-size="13" fill="#888">모델·도구 정의 포함</text>

  <!-- 빠른 세트 -->
  <rect x="290" y="92" width="200" height="80" rx="8" fill="#0f1a20" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="390" y="120" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">빠른 세트</text>
  <text x="390" y="140" text-anchor="middle" font-size="13" fill="#888">수십 건 · 반복 3회</text>
  <text x="390" y="158" text-anchor="middle" font-size="13" fill="#888">코드 판정만 · 몇 분</text>

  <!-- 전체 세트 -->
  <rect x="570" y="92" width="250" height="80" rx="8" fill="#0f1a20" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="695" y="120" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">전체 세트</text>
  <text x="695" y="140" text-anchor="middle" font-size="13" fill="#888">수백 건 · 반복 5회</text>
  <text x="695" y="158" text-anchor="middle" font-size="13" fill="#888">LLM 평가자 포함 · 배포 전</text>

  <line x1="210" y1="132" x2="290" y2="132" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="132" x2="570" y2="132" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="530" y="114" text-anchor="middle" font-size="13" fill="#55c555">통과</text>

  <!-- 빠른 세트 실패 → 변경으로 되돌림 -->
  <path d="M 390 172 C 390 222, 135 222, 135 164" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrR)"/>
  <text x="262" y="244" text-anchor="middle" font-size="13" fill="#e05555">나빠짐 → 다시 고친다</text>

  <!-- 배포 -->
  <rect x="620" y="270" width="150" height="60" rx="8" fill="#14141c" stroke="#55c555" stroke-width="1.5"/>
  <text x="695" y="306" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">배포</text>
  <line x1="695" y1="172" x2="695" y2="270" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- 운영 로그 -->
  <rect x="340" y="370" width="200" height="80" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="440" y="398" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">운영 실패 수집</text>
  <text x="440" y="418" text-anchor="middle" font-size="13" fill="#888">싫어요 · 사람 인계</text>
  <text x="440" y="436" text-anchor="middle" font-size="13" fill="#888">루프 탐지</text>
  <path d="M 695 330 L 695 410 L 540 410" fill="none" stroke="#7777cc" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 사람이 기대값 → 회귀 세트 -->
  <rect x="60" y="370" width="200" height="80" rx="8" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="160" y="398" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">기대값 붙이기</text>
  <text x="160" y="418" text-anchor="middle" font-size="13" fill="#888">사람이 주 1회</text>
  <text x="160" y="436" text-anchor="middle" font-size="13" fill="#888">회귀 세트에 추가</text>
  <line x1="340" y1="410" x2="260" y2="410" stroke="#7777cc" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 회귀 세트 → 두 세트 -->
  <path d="M 160 370 L 160 310 L 470 310 L 470 172" fill="none" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <text x="315" y="296" text-anchor="middle" font-size="13" fill="#888">세트가 약점을 따라간다</text>
</svg>
