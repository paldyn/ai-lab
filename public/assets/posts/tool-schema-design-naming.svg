<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530">
  <rect x="0" y="0" width="880" height="530" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">모델이 도구를 고르는 재료는 스키마 텍스트뿐이다</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">구현이 아무리 정확해도, 설명에 안 적힌 조건은 모델이 알 방법이 없다</text>

  <text x="50" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e05555">고르기 어려운 스키마</text>

  <rect x="50" y="126" width="370" height="150" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text xml:space="preserve" x="66" y="152" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">name: <tspan fill="#ce9178">"search"</tspan></text>
  <text xml:space="preserve" x="66" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">desc: <tspan fill="#ce9178">"검색합니다"</tspan></text>
  <text xml:space="preserve" x="66" y="192" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">params:</text>
  <text xml:space="preserve" x="66" y="212" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    q: <tspan fill="#7ec8e3" font-weight="600">string</tspan></text>
  <text xml:space="preserve" x="66" y="232" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    t: <tspan fill="#7ec8e3" font-weight="600">string</tspan></text>
  <text xml:space="preserve" x="66" y="252" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">    # t가 무엇인지 어디에도 없다</text>

  <text x="50" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e05555">이름이 범위를 안 알려 준다 — 무엇을 검색하는가</text>
  <text x="50" y="326" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e05555">약어 인자는 모델이 형식을 지어내게 만든다</text>
  <text x="50" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#e05555">언제 쓰지 말아야 하는지가 없다</text>

  <text x="480" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">고르기 쉬운 스키마</text>

  <rect x="480" y="126" width="350" height="150" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text xml:space="preserve" x="496" y="152" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">name: <tspan fill="#ce9178">"search_orders"</tspan></text>
  <text xml:space="preserve" x="496" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">desc: <tspan fill="#ce9178">"주문 이력 검색."</tspan></text>
  <text xml:space="preserve" x="496" y="192" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">      <tspan fill="#ce9178">"배송 상태는 못 본다."</tspan></text>
  <text xml:space="preserve" x="496" y="212" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">params:</text>
  <text xml:space="preserve" x="496" y="232" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    keyword: <tspan fill="#7ec8e3" font-weight="600">string</tspan></text>
  <text xml:space="preserve" x="496" y="252" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    since: <tspan fill="#7ec8e3" font-weight="600">date</tspan> <tspan fill="#9aa4b8"># YYYY-MM-DD</tspan></text>

  <text x="480" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#55c555">이름만 읽어도 대상이 정해진다</text>
  <text x="480" y="326" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#55c555">인자 이름이 곧 형식 힌트다</text>
  <text x="480" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#55c555">경계를 한 문장 적어 오용을 줄인다</text>

  <rect x="50" y="386" width="780" height="76" rx="8" fill="#12121a" stroke="#2a2a35" stroke-width="1"/>
  <text x="74" y="416" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">스키마는 문서가 아니라 프롬프트다</text>
  <text x="74" y="442" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11.5" fill="#888">매 요청마다 통째로 컨텍스트에 실려 들어가고, 매 요청마다 값을 치른다</text>

  <text x="50" y="500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">호출 실패를 프롬프트로 고치기 전에, 그 도구의 설명문부터 다시 읽어 볼 것.</text>
</svg>
