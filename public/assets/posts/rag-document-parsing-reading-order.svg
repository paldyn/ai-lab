  <text x="84" y="332" font-size="13" font-weight="600" fill="#e05555">문장 한가운데가 옆 단으로 넘어간다</text>
  <text x="84" y="352" font-size="11.5" fill="#888">청킹 이전에 이미 글이 망가진 상태다</text>

  <rect x="480" y="310" width="340" height="56" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1"/>
  <text x="504" y="332" font-size="13" font-weight="600" fill="#55c555">한 단을 끝까지 읽고 다음 단으로</text>
  <text x="504" y="352" font-size="11.5" fill="#888">문단 경계도 살아 있어 청킹이 제 일을 한다</text>

  <text x="60" y="396" font-size="13" fill="#888">머리말·꼬리말·쪽 번호가 본문 사이에 섞여 들어오는 것도 같은 원인이다.</text>
