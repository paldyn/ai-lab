<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">분모끼리 더하면 왜 안 되는가</text>
  <text x="60" y="82" font-size="13" fill="#888">조각의 크기가 다르면 개수를 셀 수 없다 — 같은 크기로 다시 자르는 것이 통분이다</text>

  <text x="60" y="132" font-size="16" font-weight="600" fill="#e8e8e8">자른 크기가 다른 채로</text>

  <rect x="60" y="152" width="240" height="56" rx="4" fill="none" stroke="#666" stroke-width="1.5"/>
  <rect x="60" y="152" width="120" height="56" fill="#7ec8e3" fill-opacity="0.18"/>
  <line x1="180" y1="152" x2="180" y2="208" stroke="#666" stroke-width="1.5"/>
  <text x="120" y="186" font-size="14" fill="#7ec8e3" text-anchor="middle">1/2</text>

  <text x="322" y="186" font-size="18" fill="#e8e8e8" text-anchor="middle">+</text>

  <rect x="344" y="152" width="240" height="56" rx="4" fill="none" stroke="#666" stroke-width="1.5"/>
  <rect x="344" y="152" width="80" height="56" fill="#7777cc" fill-opacity="0.25"/>
  <line x1="424" y1="152" x2="424" y2="208" stroke="#666" stroke-width="1.5"/>
  <line x1="504" y1="152" x2="504" y2="208" stroke="#666" stroke-width="1.5"/>
  <text x="384" y="186" font-size="14" fill="#9aa4cc" text-anchor="middle">1/3</text>

  <text x="620" y="180" font-size="15" fill="#e05555">= 2/5 라고 적으면</text>
  <text x="620" y="200" font-size="13" fill="#888">2/5 는 1/2 보다 작다 — 더했는데 줄었다</text>

  <text x="60" y="272" font-size="16" font-weight="600" fill="#e8e8e8">둘 다 6등분으로 다시 잘라 두면</text>

  <rect x="60" y="292" width="240" height="56" rx="4" fill="none" stroke="#666" stroke-width="1.5"/>
  <rect x="60" y="292" width="120" height="56" fill="#7ec8e3" fill-opacity="0.18"/>
  <line x1="100" y1="292" x2="100" y2="348" stroke="#666" stroke-width="1.5"/>
  <line x1="140" y1="292" x2="140" y2="348" stroke="#666" stroke-width="1.5"/>
  <line x1="180" y1="292" x2="180" y2="348" stroke="#666" stroke-width="1.5"/>
  <line x1="220" y1="292" x2="220" y2="348" stroke="#666" stroke-width="1.5"/>
  <line x1="260" y1="292" x2="260" y2="348" stroke="#666" stroke-width="1.5"/>
  <text x="120" y="326" font-size="14" fill="#7ec8e3" text-anchor="middle">3/6</text>

  <text x="322" y="326" font-size="18" fill="#e8e8e8" text-anchor="middle">+</text>

  <rect x="344" y="292" width="240" height="56" rx="4" fill="none" stroke="#666" stroke-width="1.5"/>
  <rect x="344" y="292" width="80" height="56" fill="#7777cc" fill-opacity="0.25"/>
  <line x1="384" y1="292" x2="384" y2="348" stroke="#666" stroke-width="1.5"/>
  <line x1="424" y1="292" x2="424" y2="348" stroke="#666" stroke-width="1.5"/>
  <line x1="464" y1="292" x2="464" y2="348" stroke="#666" stroke-width="1.5"/>
  <line x1="504" y1="292" x2="504" y2="348" stroke="#666" stroke-width="1.5"/>
  <line x1="544" y1="292" x2="544" y2="348" stroke="#666" stroke-width="1.5"/>
  <text x="384" y="326" font-size="14" fill="#9aa4cc" text-anchor="middle">2/6</text>

  <text x="620" y="320" font-size="15" fill="#55c555">= 5/6</text>
  <text x="620" y="340" font-size="13" fill="#888">1/6 짜리가 3개와 2개 — 이제 셀 수 있다</text>

  <rect x="60" y="386" width="760" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="410" font-size="13" font-weight="600" fill="#e8e8e8">분모는 조각의 크기이고 분자는 그 개수다</text>
  <text x="84" y="430" font-size="13" fill="#888">개수는 크기가 같을 때만 더할 수 있다. 통분은 크기를 맞추는 작업이지 값을 바꾸는 작업이 아니다</text>
</svg>
