<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <defs>
    <marker id="arrEvalFlow" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888888"/>
    </marker>
    <marker id="arrEvalOrder" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect width="880" height="400" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">RAG 평가의 두 단계</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#888">같은 증상, 반대 원인 — 검색을 먼저 재고 그다음에 생성을 잰다</text>

  <rect x="60" y="100" width="360" height="164" rx="8" fill="#0d1520" stroke="#7ec8e3" stroke-width="2"/>
  <text x="240" y="128" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3">1단계 · 검색</text>
  <text x="240" y="150" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">질문 → 색인 → 상위 k개 조각</text>

  <rect x="84" y="166" width="312" height="34" rx="6" fill="#111" stroke="#333"/>
  <text x="100" y="188" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">Recall@k · 정답이 상위 k 안에 들어왔나</text>

  <rect x="84" y="208" width="312" height="34" rx="6" fill="#111" stroke="#333"/>
  <text x="100" y="230" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">MRR · 몇 번째로 들어왔나</text>

  <rect x="460" y="100" width="360" height="164" rx="8" fill="#0d1a10" stroke="#55c555" stroke-width="2"/>
  <text x="640" y="128" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">2단계 · 생성</text>
  <text x="640" y="150" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">조각 → 프롬프트 → 답변</text>

  <rect x="484" y="166" width="312" height="34" rx="6" fill="#111" stroke="#333"/>
  <text x="500" y="188" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">Faithfulness · 조각에 근거했나</text>

  <rect x="484" y="208" width="312" height="34" rx="6" fill="#111" stroke="#333"/>
  <text x="500" y="230" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">Answer Relevance · 질문에 답했나</text>

  <line x1="420" y1="182" x2="460" y2="182" stroke="#888888" stroke-width="2" marker-end="url(#arrEvalFlow)"/>

  <rect x="60" y="292" width="360" height="64" rx="6" fill="#111" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="316" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#e05555">검색 실패</text>
  <text x="84" y="336" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">청크 크기 · 쿼리 재작성 · 리랭킹을 본다</text>

  <rect x="460" y="292" width="360" height="64" rx="6" fill="#111" stroke="#e05555" stroke-width="1.5"/>
  <text x="484" y="316" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#e05555">생성 실패</text>
  <text x="484" y="336" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">프롬프트 지시 · 온도 · 모델을 본다</text>

  <path d="M 240 264 L 240 292" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrEvalOrder)"/>
  <path d="M 640 264 L 640 292" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrEvalOrder)"/>

  <text x="440" y="382" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7777cc">검색이 실패한 질문은 생성 지표 평균에서 뺀다 — 섞으면 두 점수가 서로를 가린다</text>
</svg>
