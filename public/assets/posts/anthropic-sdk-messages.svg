<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <rect width="880" height="520" rx="12" fill="#0a0a0a"/>
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">Anthropic SDK — messages.create() 구조</text>

  <!-- Request box -->
  <rect x="60" y="70" width="360" height="240" rx="8" fill="#1a2535" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="240" y="96" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="700" fill="#7ec8e3" text-anchor="middle">요청 파라미터</text>

  <!-- model -->
  <rect x="76" y="108" width="328" height="34" rx="4" fill="#0d1a2b" stroke="#2a3a5e" stroke-width="1"/>
  <text x="92" y="130" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#9aa4b8">model</tspan><tspan fill="#ce9178">      &quot;claude-sonnet-4-6&quot;</tspan></text>

  <!-- messages -->
  <rect x="76" y="150" width="328" height="56" rx="4" fill="#0d1a2b" stroke="#2a3a5e" stroke-width="1"/>
  <text x="92" y="170" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#9aa4b8">messages</tspan><tspan fill="#ffffff">    [{&quot;role&quot;: </tspan></text>
  <text x="296" y="170" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#ce9178">&quot;user&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="192" y="188" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#ffffff">  &quot;content&quot;: </tspan><tspan fill="#ce9178">   &quot;...&quot;}]</tspan></text>

  <!-- system -->
  <rect x="76" y="214" width="328" height="34" rx="4" fill="#0d1a2b" stroke="#2a3a5e" stroke-width="1"/>
  <text x="92" y="236" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#9aa4b8">system</tspan><tspan fill="#ce9178">    &quot;You are a helpful assistant.&quot;</tspan></text>

  <!-- max_tokens -->
  <rect x="76" y="256" width="328" height="34" rx="4" fill="#0d1a2b" stroke="#2a3a5e" stroke-width="1"/>
  <text x="92" y="278" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#9aa4b8">max_tokens</tspan><tspan fill="#b5cea8">     1024</tspan></text>

  <!-- Arrow -->
  <line x1="420" y1="190" x2="458" y2="190" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
  <text x="439" y="182" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">HTTPS</text>

  <!-- Response box -->
  <rect x="460" y="70" width="360" height="240" rx="8" fill="#1a2c1a" stroke="#3a6e3a" stroke-width="1.5"/>
  <text x="640" y="96" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="700" fill="#55c555" text-anchor="middle">응답 객체 (Message)</text>

  <!-- id -->
  <rect x="476" y="108" width="328" height="34" rx="4" fill="#0d1a2b" stroke="#1a3a1a" stroke-width="1"/>
  <text x="492" y="130" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#9aa4b8">id</tspan><tspan fill="#ce9178">  &quot;msg_01XFDUDYJgAACzvnptvVoYEL&quot;</tspan></text>

  <!-- content -->
  <rect x="476" y="150" width="328" height="56" rx="4" fill="#0d1a2b" stroke="#1a3a1a" stroke-width="1"/>
  <text x="492" y="170" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#9aa4b8">content</tspan><tspan fill="#ffffff">    [TextBlock(type=</tspan></text>
  <text x="724" y="170" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#ce9178">&quot;text&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="568" y="188" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#ffffff">  text=</tspan><tspan fill="#ce9178">&quot;답변 내용...&quot;)]</tspan></text>

  <!-- stop_reason -->
  <rect x="476" y="214" width="328" height="34" rx="4" fill="#0d1a2b" stroke="#1a3a1a" stroke-width="1"/>
  <text x="492" y="236" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#9aa4b8">stop_reason</tspan><tspan fill="#ce9178">     &quot;end_turn&quot;</tspan></text>

  <!-- usage -->
  <rect x="476" y="256" width="328" height="34" rx="4" fill="#0d1a2b" stroke="#1a3a1a" stroke-width="1"/>
  <text x="492" y="278" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="12" xml:space="preserve"><tspan fill="#9aa4b8">usage</tspan><tspan fill="#ffffff">   Usage(input_tokens=</tspan><tspan fill="#b5cea8">42</tspan><tspan fill="#ffffff">, ...)</tspan></text>

  <!-- Models row -->
  <text x="60" y="340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e8e8e8">주요 모델 ID</text>

  <rect x="60" y="352" width="230" height="60" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="175" y="375" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" font-weight="600" fill="#c77ec8" text-anchor="middle">claude-opus-4-7</text>
  <text x="175" y="395" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">가장 강력 · 복잡한 태스크</text>

  <rect x="310" y="352" width="260" height="60" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="440" y="375" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" font-weight="600" fill="#7ec8e3" text-anchor="middle">claude-sonnet-4-6</text>
  <text x="440" y="395" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">성능·속도·비용 균형</text>

  <rect x="590" y="352" width="230" height="60" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="705" y="375" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" font-weight="600" fill="#55c555" text-anchor="middle">claude-haiku-4-5-20251001</text>
  <text x="705" y="395" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">빠른 응답 · 저비용</text>

  <!-- Code block -->
  <rect x="60" y="432" width="760" height="72" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="452" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" font-weight="600" xml:space="preserve"><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> anthropic</tspan></text>
  <text x="76" y="472" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">client = anthropic.Anthropic()</text>
  <text x="76" y="492" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#ffffff">msg = client.messages.create(model=</tspan><tspan fill="#ce9178">&quot;claude-sonnet-4-6&quot;</tspan><tspan fill="#ffffff">, max_tokens=</tspan><tspan fill="#b5cea8">1024</tspan><tspan fill="#ffffff">, messages=[...])</tspan></text>
</svg>
