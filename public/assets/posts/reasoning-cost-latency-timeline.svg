  <rect x="624" y="200" width="120" height="44" rx="4" fill="#16301a" stroke="#55c555" stroke-width="1"/>
  <text x="684" y="228" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">2.0초</text>

  <line x1="624" y1="200" x2="624" y2="188" stroke="#9aa4b8" stroke-width="1.5"/>

