  <text x="50" y="402" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">스트리밍으로도 가릴 수 없는 침묵 구간이라, 지연 예산은 답변 길이가 아니라 사고 길이로 잡아야 한다.</text>
