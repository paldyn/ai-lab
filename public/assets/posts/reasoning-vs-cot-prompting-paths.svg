<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490">
  <defs>
    <marker id="vcArrB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="vcArrP" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="490" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">같은 단계적 사고가 어디에 놓이는가</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">CoT 프롬프팅은 사고를 출력 안에 쓰고, 추론 모델은 학습된 사고를 답변 앞 구간에 따로 둔다</text>

  <text x="232" y="112" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3">CoT 프롬프팅 · 일반 모델</text>
  <text x="648" y="112" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7777cc">추론 모델</text>

  <rect x="82" y="134" width="300" height="42" rx="6" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="232" y="159" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">프롬프트 + 단계적 사고 지시문</text>
  <rect x="498" y="134" width="300" height="42" rx="6" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="648" y="159" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">프롬프트만</text>

  <line x1="232" y1="176" x2="232" y2="196" stroke="#7ec8e3" stroke-width="2" marker-end="url(#vcArrB)"/>
  <line x1="648" y1="176" x2="648" y2="196" stroke="#7777cc" stroke-width="2" marker-end="url(#vcArrP)"/>

  <rect x="82" y="196" width="300" height="64" rx="6" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="232" y="222" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">출력 토큰 안에 추론 과정</text>
  <text x="232" y="242" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">사용자에게 그대로 노출된다</text>

  <rect x="498" y="196" width="300" height="64" rx="6" fill="#12121a" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="648" y="222" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">사고 토큰 구간</text>
  <text x="648" y="242" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">보통 비노출 · 과금은 그대로</text>

  <line x1="232" y1="260" x2="232" y2="280" stroke="#7ec8e3" stroke-width="2" marker-end="url(#vcArrB)"/>
  <line x1="648" y1="260" x2="648" y2="280" stroke="#7777cc" stroke-width="2" marker-end="url(#vcArrP)"/>

  <rect x="82" y="280" width="300" height="42" rx="6" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="232" y="305" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">최종 답</text>
  <rect x="498" y="280" width="300" height="42" rx="6" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="648" y="305" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">최종 답</text>

  <rect x="82" y="352" width="300" height="82" rx="8" fill="#12121a" stroke="#2a2a35" stroke-width="1"/>
  <text x="100" y="378" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">문구 한 줄에 품질이 흔들린다</text>
  <text x="100" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">사고 길이를 직접 정할 수 없다</text>
  <text x="100" y="416" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">어떤 모델에도 즉시 적용된다</text>

  <rect x="498" y="352" width="300" height="82" rx="8" fill="#12121a" stroke="#2a2a35" stroke-width="1"/>
  <text x="516" y="378" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">사고 습관이 훈련으로 굳어 있다</text>
  <text x="516" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">예산 파라미터로 길이를 조절</text>
  <text x="516" y="416" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">쉬운 질문에도 비용이 붙는다</text>

  <text x="50" y="466" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">얕은 정리면 프롬프팅으로 충분하고, 검증 가능한 정답이 있는 문제에서 추론 모델이 앞선다.</text>
</svg>
