<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="430" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">어떤 행렬이든 단위원을 타원으로 보낸다</text>
  <text x="60" y="70" font-size="13" fill="#888">Vᵀ와 U는 돌리기만 하고 길이를 안 바꾼다. 늘이는 일은 가운데 Σ 혼자 한다.</text>

  <defs>
    <marker id="svd-g" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="50" y="100" width="165" height="200" rx="10" fill="#101820" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="132" cy="212" r="52" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="132" y1="212" x2="177" y2="186" stroke="#55c555" stroke-width="2.5"/>
  <line x1="132" y1="212" x2="158" y2="257" stroke="#e05555" stroke-width="2.5"/>
  <text x="180" y="180" font-size="13" font-weight="600" fill="#55c555">v₁</text>
  <text x="162" y="274" font-size="13" font-weight="600" fill="#e05555">v₂</text>
  <text x="132" y="290" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">단위원</text>

  <rect x="255" y="100" width="165" height="200" rx="10" fill="#101820" stroke="#7777cc" stroke-width="1.5"/>
  <circle cx="337" cy="212" r="52" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="337" y1="212" x2="389" y2="212" stroke="#55c555" stroke-width="2.5"/>
  <line x1="337" y1="212" x2="337" y2="264" stroke="#e05555" stroke-width="2.5"/>
  <text x="394" y="208" font-size="13" font-weight="600" fill="#55c555">v₁</text>
  <text x="343" y="278" font-size="13" font-weight="600" fill="#e05555">v₂</text>
  <text x="337" y="290" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">축에 맞춰 돌린 원</text>

  <rect x="460" y="100" width="165" height="200" rx="10" fill="#101820" stroke="#7777cc" stroke-width="1.5"/>
  <ellipse cx="542" cy="212" rx="72" ry="30" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="542" y1="212" x2="614" y2="212" stroke="#55c555" stroke-width="2.5"/>
  <line x1="542" y1="212" x2="542" y2="242" stroke="#e05555" stroke-width="2.5"/>
  <text x="560" y="196" font-size="13" font-weight="600" fill="#55c555">σ₁</text>
  <text x="550" y="258" font-size="13" font-weight="600" fill="#e05555">σ₂</text>
  <text x="542" y="290" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">축마다 σ배 — 타원</text>

  <rect x="665" y="100" width="165" height="200" rx="10" fill="#101820" stroke="#55c555" stroke-width="1.5"/>
  <g transform="rotate(-32 747 212)">
    <ellipse cx="747" cy="212" rx="72" ry="30" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="2.5"/>
    <line x1="747" y1="212" x2="819" y2="212" stroke="#55c555" stroke-width="2.5"/>
    <line x1="747" y1="212" x2="747" y2="242" stroke="#e05555" stroke-width="2.5"/>
  </g>
  <text x="800" y="152" font-size="13" font-weight="600" fill="#55c555">σ₁u₁</text>
  <text x="686" y="278" font-size="13" font-weight="600" fill="#e05555">σ₂u₂</text>
  <text x="747" y="290" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">되돌려 놓은 타원</text>

  <line x1="221" y1="200" x2="249" y2="200" stroke="#888" stroke-width="2" marker-end="url(#svd-g)"/>
  <text x="235" y="186" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">Vᵀ</text>
  <line x1="426" y1="200" x2="454" y2="200" stroke="#888" stroke-width="2" marker-end="url(#svd-g)"/>
  <text x="440" y="186" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">Σ</text>
  <line x1="631" y1="200" x2="659" y2="200" stroke="#888" stroke-width="2" marker-end="url(#svd-g)"/>
  <text x="645" y="186" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">U</text>

  <rect x="50" y="330" width="780" height="76" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="74" y="356" font-size="14" fill="#e8e8e8">타원의 반지름이 특잇값이고, 그 방향이 왼쪽 특이벡터 u다.</text>
  <text x="74" y="378" font-size="13" fill="#9aa4b8">σ 하나가 0이면 그 축이 완전히 눌려 타원이 선분으로 납작해진다 — 랭크가 하나 모자란 것이다.</text>
  <text x="74" y="398" font-size="13" fill="#9aa4b8">정사각형이 아닌 행렬도 같다. 차원이 달라질 뿐 돌리고 늘이고 돌리는 구조는 그대로다.</text>
</svg>
