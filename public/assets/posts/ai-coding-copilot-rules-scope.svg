<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 450"
     font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="rule-arr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect width="880" height="450" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">규칙이 붙는 네 가지 방식</text>
  <text x="440" y="72" text-anchor="middle" font-size="13" fill="#888">frontmatter 세 칸을 어떻게 채우느냐가 정한다</text>

  <!-- 1 -->
  <rect x="60" y="112" width="300" height="56" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="145" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">alwaysApply</tspan><tspan fill="#ffffff">: true</tspan></text>
  <line x1="360" y1="140" x2="480" y2="140" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rule-arr)"/>
  <rect x="480" y="112" width="340" height="56" rx="8" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
  <text x="504" y="134" font-size="14" fill="#e8e8e8">모든 대화에 붙는다</text>
  <text x="504" y="154" font-size="12" fill="#888">스택 · 명명 규칙</text>

  <!-- 2 -->
  <rect x="60" y="184" width="300" height="56" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="217" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">globs</tspan><tspan fill="#ffffff">: tests/**</tspan></text>
  <line x1="360" y1="212" x2="480" y2="212" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rule-arr)"/>
  <rect x="480" y="184" width="340" height="56" rx="8" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
  <text x="504" y="206" font-size="14" fill="#e8e8e8">그 패턴의 파일을 만질 때</text>
  <text x="504" y="226" font-size="12" fill="#888">테스트 · 마이그레이션 규칙</text>

  <!-- 3 -->
  <rect x="60" y="256" width="300" height="56" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="289" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">description</tspan><tspan fill="#ffffff">: ...</tspan></text>
  <line x1="360" y1="284" x2="480" y2="284" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rule-arr)"/>
  <rect x="480" y="256" width="340" height="56" rx="8" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
  <text x="504" y="289" font-size="14" fill="#e8e8e8">모델이 관련 있다고 판단할 때</text>

  <!-- 4 -->
  <rect x="60" y="328" width="300" height="56" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="361" font-size="13" fill="#9aa4b8">세 칸 모두 비움</text>
  <line x1="360" y1="356" x2="480" y2="356" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rule-arr)"/>
  <rect x="480" y="328" width="340" height="56" rx="8" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
  <text x="504" y="361" font-size="14" fill="#e8e8e8">채팅에서 @로 부를 때만</text>
</svg>
