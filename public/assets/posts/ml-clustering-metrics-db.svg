<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 590" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
<rect width="880" height="590" rx="12" fill="#0a0a0a"/>
<text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">군집마다 가장 닮은 상대 하나</text>
<text x="440" y="72" text-anchor="middle" fill="#888" font-size="13">중심 0 · 4 · 10, 퍼짐 σ = 1 · 1 · 3 — 원의 반지름이 σ다</text>
<circle cx="150" cy="250" r="40" fill="#7ec8e3" fill-opacity="0.15" stroke="#7ec8e3" stroke-width="2"/>
<circle cx="150" cy="250" r="4" fill="#7ec8e3"/>
<text x="150" y="198" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="600">군집 1</text>
<text x="150" y="272" text-anchor="middle" fill="#888" font-size="13">σ=1</text>
<circle cx="310" cy="250" r="40" fill="#7777cc" fill-opacity="0.15" stroke="#7777cc" stroke-width="2"/>
<circle cx="310" cy="250" r="4" fill="#7777cc"/>
<text x="310" y="198" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="600">군집 2</text>
<text x="310" y="272" text-anchor="middle" fill="#888" font-size="13">σ=1</text>
<circle cx="550" cy="250" r="120" fill="#e05555" fill-opacity="0.15" stroke="#e05555" stroke-width="2"/>
<circle cx="550" cy="250" r="4" fill="#e05555"/>
<text x="550" y="118" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="600">군집 3</text>
<text x="550" y="272" text-anchor="middle" fill="#888" font-size="13">σ=3</text>
<defs><marker id="a" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/></marker></defs>
<line x1="150" y1="400" x2="310" y2="400" stroke="#888" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="230.0" y="390" text-anchor="middle" fill="#888" font-size="13">d = 4</text>
<line x1="310" y1="400" x2="550" y2="400" stroke="#888" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="430.0" y="390" text-anchor="middle" fill="#888" font-size="13">d = 6</text>
<line x1="150" y1="428" x2="550" y2="428" stroke="#888" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="350" y="450" text-anchor="middle" fill="#888" font-size="13">d = 10</text>
<rect x="60" y="470" width="760" height="96" rx="8" fill="#111111" stroke="#2a2a2a"/>
<text x="90" y="500" fill="#e8e8e8" font-size="14">R₁₂ = (1 + 1) / 4 = 0.50</text>
<text x="90" y="524" fill="#e8e8e8" font-size="14">R₁₃ = (1 + 3) / 10 = 0.40</text>
<text x="90" y="548" fill="#e05555" font-size="14">R₂₃ = (1 + 3) / 6 = 0.67</text>
<text x="430" y="500" fill="#888" font-size="13">군집마다 가장 큰 R을 고른다</text>
<text x="430" y="524" fill="#e8e8e8" font-size="14">군집 1 → 0.50 · 군집 2 → 0.67 · 군집 3 → 0.67</text>
<text x="430" y="548" fill="#55c555" font-size="14" font-weight="600">DB = (0.50 + 0.67 + 0.67) / 3 = 0.61</text>
</svg>
