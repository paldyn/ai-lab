<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="tkArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="390" rx="12" fill="#0a0a0a"/>

  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">입구만 다르고 안은 같다</text>
  <text x="62" y="68" font-size="13" fill="#888">토큰으로 바꾸는 방법이 모달리티마다 다를 뿐, 들어오면 전부 번호의 줄이다.</text>

  <rect x="62" y="100" width="220" height="116" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="80" y="124" font-size="13" font-weight="600" fill="#7ec8e3">텍스트</text>
  <text x="80" y="150" font-size="11" fill="#9aa4b8">부분 낱말로 쪼갠다</text>
  <text x="80" y="168" font-size="11" fill="#9aa4b8">처음부터 번호라서</text>
  <text x="80" y="186" font-size="11" fill="#9aa4b8">따로 바꿀 것이 없다</text>
  <text x="80" y="204" font-size="11" fill="#9aa4b8">어휘 수만 개</text>

  <rect x="330" y="100" width="220" height="116" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="348" y="124" font-size="13" font-weight="600" fill="#7777cc">이미지</text>
  <text x="348" y="150" font-size="11" fill="#9aa4b8">격자 조각으로 자르고</text>
  <text x="348" y="168" font-size="11" fill="#9aa4b8">코드북에서 가장 가까운</text>
  <text x="348" y="186" font-size="11" fill="#9aa4b8">항목 번호로 바꾼다</text>
  <text x="348" y="204" font-size="11" fill="#9aa4b8">한 장에 수백~수천 개</text>

  <rect x="598" y="100" width="220" height="116" rx="8" fill="#12151c" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="616" y="124" font-size="13" font-weight="600" fill="#55c555">오디오</text>
  <text x="616" y="150" font-size="11" fill="#9aa4b8">코덱이 프레임마다</text>
  <text x="616" y="168" font-size="11" fill="#9aa4b8">번호를 겹겹이 낸다</text>
  <text x="616" y="186" font-size="11" fill="#9aa4b8">첫 겹이 큰 줄기이고</text>
  <text x="616" y="204" font-size="11" fill="#9aa4b8">뒷 겹이 오차를 메운다</text>

  <line x1="172" y1="216" x2="172" y2="250" stroke="#888888" stroke-width="2" marker-end="url(#tkArr)"/>
  <line x1="440" y1="216" x2="440" y2="250" stroke="#888888" stroke-width="2" marker-end="url(#tkArr)"/>
  <line x1="708" y1="216" x2="708" y2="250" stroke="#888888" stroke-width="2" marker-end="url(#tkArr)"/>

  <rect x="62" y="250" width="756" height="48" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="80" y="280" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">&lt;img&gt;</tspan><tspan fill="#7777cc"> 4102 887 3390 61 </tspan><tspan fill="#9aa4b8">&lt;/img&gt;</tspan><tspan fill="#ffffff"> 이 그림 왼쪽에 있는 것 </tspan><tspan fill="#9aa4b8">&lt;aud&gt;</tspan><tspan fill="#55c555"> 51 902 44 </tspan><tspan fill="#9aa4b8">&lt;/aud&gt;</tspan></text>

  <text x="62" y="330" font-size="12" fill="#9aa4b8">합쳐지면 이렇게 한 줄이 된다. 모델이 보는 것은 이 줄뿐이고, 소리인지 그림인지는 경계 표시로만 남는다.</text>
  <text x="62" y="352" font-size="12" fill="#9aa4b8">그래서 조각 하나가 몇 토큰을 먹는지가 곧 비용이다 — 그림 한 장이 긴 문단 하나와 맞먹는다.</text>
</svg>
