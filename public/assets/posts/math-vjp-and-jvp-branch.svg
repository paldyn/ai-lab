<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="bF" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="bB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">갈라진 값의 VJP는 더해진다</text>
  <text x="60" y="76" font-size="13" fill="#888">a = 2x, b = x², L = ab 에서 x = 3 — 파란 선은 순전파, 붉은 점선은 되돌아오는 VJP</text>

  <rect x="60" y="200" width="140" height="64" rx="8" fill="#000000" stroke="#55c555" stroke-width="1.5"/>
  <text x="130" y="227" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">x = 3</text>
  <text x="130" y="249" font-size="13" fill="#55c555" text-anchor="middle">18 + 36 = 54</text>

  <rect x="370" y="110" width="140" height="64" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="440" y="137" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">a = 2x = 6</text>
  <text x="440" y="159" font-size="13" fill="#888" text-anchor="middle">받은 값 9</text>

  <rect x="370" y="290" width="140" height="64" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="440" y="317" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">b = x² = 9</text>
  <text x="440" y="339" font-size="13" fill="#888" text-anchor="middle">받은 값 6</text>

  <rect x="680" y="200" width="140" height="64" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="750" y="227" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">L = ab = 54</text>
  <text x="750" y="249" font-size="13" fill="#888" text-anchor="middle">u = 1 에서 출발</text>

  <line x1="200" y1="214" x2="370" y2="150" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#bF)"/>
  <line x1="200" y1="250" x2="370" y2="314" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#bF)"/>
  <line x1="510" y1="150" x2="680" y2="214" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#bF)"/>
  <line x1="510" y1="314" x2="680" y2="250" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#bF)"/>

  <path d="M 680 196 Q 600 130 510 128" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#bB)"/>
  <path d="M 680 268 Q 600 334 510 336" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#bB)"/>
  <path d="M 370 128 Q 250 110 200 196" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#bB)"/>
  <path d="M 370 336 Q 250 354 200 268" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#bB)"/>

  <text x="620" y="106" font-size="13" font-weight="600" fill="#e05555">∂L/∂a = b = 9</text>
  <text x="620" y="368" font-size="13" font-weight="600" fill="#e05555">∂L/∂b = a = 6</text>
  <text x="160" y="110" font-size="13" font-weight="600" fill="#e05555">9 × 2 = 18</text>
  <text x="140" y="386" font-size="13" font-weight="600" fill="#e05555">6 × 2x = 36</text>

  <text x="60" y="410" font-size="14" font-weight="600" fill="#e8e8e8">앞으로 복사하면 뒤로는 더한다 — 해석적 미분 6x² = 54 와 같다</text>
</svg>
