<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="530" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">한 변수를 고정하면 두 변수 함수가 1변수 곡선이 된다</text>
  <text x="60" y="82" font-size="13" fill="#888">y를 하나로 묶어 두고 x만 남기면, 그 단면은 이미 그릴 줄 아는 그래프다</text>

  <text x="240" y="124" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">위에서 본 등고선</text>
  <text x="240" y="146" font-size="13" fill="#888" text-anchor="middle">z = x² + y², 자르는 선은 y = y₀</text>

  <line x1="100" y1="310" x2="380" y2="310" stroke="#888" stroke-width="1.5"/>
  <line x1="240" y1="440" x2="240" y2="180" stroke="#888" stroke-width="1.5"/>
  <circle cx="240" cy="310" r="28.3" fill="none" stroke="#7ec8e3" stroke-width="2.2"/>
  <circle cx="240" cy="310" r="56.6" fill="none" stroke="#7ec8e3" stroke-width="2.2"/>
  <circle cx="240" cy="310" r="80.0" fill="none" stroke="#7ec8e3" stroke-width="2.2"/>
  <circle cx="240" cy="310" r="98.0" fill="none" stroke="#7ec8e3" stroke-width="2.2"/>
  <circle cx="240" cy="310" r="113.1" fill="none" stroke="#7ec8e3" stroke-width="2.2"/>
  <circle cx="240" cy="310" r="126.5" fill="none" stroke="#7ec8e3" stroke-width="2.2"/>
  <g>
    <line x1="100" y1="390" x2="380" y2="390" stroke="#e05555" stroke-width="2.5"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-40; 0,-80; 0,-120; 0,-160; 0,-120; 0,-80; 0,-40; 0,0" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <text x="660" y="124" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">잘라 낸 단면</text>
  <text x="660" y="146" font-size="13" fill="#888" text-anchor="middle">z = x² + y₀², x만 남은 1변수 함수</text>

  <line x1="540" y1="430" x2="780" y2="430" stroke="#888" stroke-width="1.5"/>
  <line x1="660" y1="446" x2="660" y2="185" stroke="#888" stroke-width="1.5"/>
  <text x="794" y="435" font-size="13" fill="#888">x</text>
  <text x="650" y="181" font-size="13" fill="#888" text-anchor="end">z</text>
  <g>
    <polyline points="556.0,281.3 558.6,288.6 561.2,295.8 563.8,302.8 566.4,309.5 569.0,316.1 571.6,322.5 574.2,328.8 576.8,334.8 579.4,340.7 582.0,346.3 584.6,351.8 587.2,357.1 589.8,362.2 592.4,367.2 595.0,371.9 597.6,376.5 600.2,380.8 602.8,385.0 605.4,389.0 608.0,392.8 610.6,396.4 613.2,399.9 615.8,403.1 618.4,406.2 621.0,409.1 623.6,411.8 626.2,414.3 628.8,416.6 631.4,418.8 634.0,420.7 636.6,422.5 639.2,424.1 641.8,425.4 644.4,426.7 647.0,427.7 649.6,428.5 652.2,429.2 654.8,429.6 657.4,429.9 660.0,430.0 662.6,429.9 665.2,429.6 667.8,429.2 670.4,428.5 673.0,427.7 675.6,426.7 678.2,425.4 680.8,424.1 683.4,422.5 686.0,420.7 688.6,418.8 691.2,416.6 693.8,414.3 696.4,411.8 699.0,409.1 701.6,406.2 704.2,403.1 706.8,399.9 709.4,396.4 712.0,392.8 714.6,389.0 717.2,385.0 719.8,380.8 722.4,376.5 725.0,371.9 727.6,367.2 730.2,362.2 732.8,357.1 735.4,351.8 738.0,346.3 740.6,340.7 743.2,334.8 745.8,328.8 748.4,322.5 751.0,316.1 753.6,309.5 756.2,302.8 758.8,295.8 761.4,288.6 764.0,281.3" fill="none" stroke="#e05555" stroke-width="2.5"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,-88; 0,-22; 0,0; 0,-22; 0,-88; 0,-22; 0,0; 0,-22; 0,-88" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <text x="60" y="486" font-size="13" fill="#9aa4b8">모양은 y₀와 상관없이 늘 같은 포물선이고, 바뀌는 것은 바닥 높이 y₀² 하나뿐이다.</text>
  <text x="60" y="508" font-size="13" fill="#9aa4b8">이 단면 곡선 위에서 기울기를 재는 것이 곧 x에 대한 편미분이다.</text>
</svg>
