<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="440" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">밑이 1보다 큰가 작은가로 운명이 갈린다</text>
  <text x="60" y="82" font-size="13" fill="#888">같은 열 번을 곱했을 뿐인데 한쪽은 천 배가 되고 한쪽은 천분의 일이 된다</text>

  <rect x="60" y="120" width="360" height="240" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="240" y="150" font-size="16" font-weight="600" fill="#55c555" text-anchor="middle">밑 = 2 (1보다 크다)</text>
  <text x="100" y="184" font-size="14" fill="#888">2¹</text>
  <text x="380" y="184" font-size="14" fill="#e8e8e8" text-anchor="end">2</text>
  <text x="100" y="212" font-size="14" fill="#888">2⁵</text>
  <text x="380" y="212" font-size="14" fill="#e8e8e8" text-anchor="end">32</text>
  <text x="100" y="240" font-size="14" fill="#888">2¹⁰</text>
  <text x="380" y="240" font-size="14" fill="#e8e8e8" text-anchor="end">1024</text>
  <text x="100" y="268" font-size="14" fill="#888">2²⁰</text>
  <text x="380" y="268" font-size="14" fill="#e8e8e8" text-anchor="end">1048576</text>
  <text x="100" y="296" font-size="14" fill="#888">2³⁰</text>
  <text x="380" y="296" font-size="14" fill="#e8e8e8" text-anchor="end">1073741824</text>
  <line x1="90" y1="312" x2="390" y2="312" stroke="#333" stroke-width="1"/>
  <text x="100" y="340" font-size="13" fill="#7ec8e3">열 번마다 약 1000 배</text>

  <rect x="460" y="120" width="360" height="240" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="640" y="150" font-size="16" font-weight="600" fill="#e05555" text-anchor="middle">밑 = 0.5 (1보다 작다)</text>
  <text x="500" y="184" font-size="14" fill="#888">0.5¹</text>
  <text x="780" y="184" font-size="14" fill="#e8e8e8" text-anchor="end">0.5</text>
  <text x="500" y="212" font-size="14" fill="#888">0.5⁵</text>
  <text x="780" y="212" font-size="14" fill="#e8e8e8" text-anchor="end">0.03125</text>
  <text x="500" y="240" font-size="14" fill="#888">0.5¹⁰</text>
  <text x="780" y="240" font-size="14" fill="#e8e8e8" text-anchor="end">0.000977</text>
  <text x="500" y="268" font-size="14" fill="#888">0.5²⁰</text>
  <text x="780" y="268" font-size="14" fill="#e8e8e8" text-anchor="end">0.00000095</text>
  <text x="500" y="296" font-size="14" fill="#888">0.5³⁰</text>
  <text x="780" y="296" font-size="14" fill="#e8e8e8" text-anchor="end">0.00000000093</text>
  <line x1="490" y1="312" x2="790" y2="312" stroke="#333" stroke-width="1"/>
  <text x="500" y="340" font-size="13" fill="#7ec8e3">열 번마다 약 1000 분의 1</text>

  <rect x="60" y="380" width="760" height="46" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="408" font-size="14" font-weight="600" fill="#e8e8e8">2¹⁰ = 1024 ≈ 10³ — 이 어림 하나면 2의 거듭제곱을 10의 거듭제곱으로 바꿔 크기를 가늠할 수 있다</text>
</svg>
