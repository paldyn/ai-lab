  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">파라미터 하나가 그래프에 하는 일</text>
  <text x="60" y="82" font-size="13" fill="#888">희미한 곡선이 원래 모양이고, 밝은 곡선이 파라미터를 움직인 결과다</text>

  <text x="220" y="124" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">y = f(x − a) + b</text>
  <text x="220" y="148" font-size="13" fill="#888" text-anchor="middle">모양은 그대로, 자리만 오른쪽·위로</text>

