  <text x="60" y="440" font-size="13" fill="#9aa4b8">보라색 점선은 원래 곡선의 점근선 y = 1이다. 평행이동은 곡선과 함께 점근선도 올리고, 가로 확대는 점근선을 그대로 둔다.</text>
  <text x="60" y="466" font-size="13" fill="#9aa4b8">둘 다 곡선의 모양 자체는 바꾸지 않는다 — 바뀌는 것은 자리와 가로 눈금뿐이다.</text>
