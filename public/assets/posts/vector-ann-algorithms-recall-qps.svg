<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <defs>
    <marker id="ax" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#0a0a0a" rx="12"/>
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">재현율과 처리량의 곡선</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">손잡이(ef·nprobe)를 바꿔 찍은 점을 잇는다 — 개념도</text>

  <line x1="120" y1="400" x2="800" y2="400" stroke="#888" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="120" y1="400" x2="120" y2="100" stroke="#888" stroke-width="2" marker-end="url(#ax)"/>
  <text x="800" y="430" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">재현율 →</text>
  <text x="132" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">처리량(QPS)</text>
  <text x="300" y="420" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0.80</text>
  <text x="560" y="420" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0.95</text>
  <text x="720" y="420" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0.99</text>

  <!-- HNSW curve -->
  <path d="M 180 150 C 400 165, 600 210, 740 370" fill="none" stroke="#7777cc" stroke-width="3"/>
  <!-- IVF curve -->
  <path d="M 180 130 C 360 160, 500 250, 680 385" fill="none" stroke="#7ec8e3" stroke-width="3"/>
  <!-- fixed recall line -->
  <line x1="560" y1="130" x2="560" y2="400" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="572" y="146" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">재현율 0.95에 못 박고 비교</text>
  <circle cx="560" cy="226" r="6" fill="#7777cc"/>
  <circle cx="560" cy="292" r="6" fill="#7ec8e3"/>
  <text x="610" y="236" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">HNSW</text>
  <text x="440" y="296" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">IVF</text>
  <text x="140" y="380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">낮은 재현율에서는 IVF가 앞서기도 한다</text>
</svg>
