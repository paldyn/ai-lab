<text x="440" y="300" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">그래서 절대오차는 값에 비례해 커지고, 상대오차만 어디서나 같다 — 그 상한이 머신 엡실론의 절반이다</text>
<text x="440" y="326" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">fp32에서 1 근처의 간격은 1.2e−07이지만 1e8 근처에서는 8이다</text>
