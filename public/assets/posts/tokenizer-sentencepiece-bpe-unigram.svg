<svg xmlns="http://www.w3.org/2000/svg" width="880" height="590" viewBox="0 0 880 590">
  <defs>
    <marker id="step" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="880" height="590" rx="12" fill="#0a0a0a"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">BPE와 Unigram: 어휘를 만드는 두 방향</text>
  <text x="440" y="74" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#888" text-anchor="middle">산출물이 다르고, 그래서 인코딩에서 분할을 고르는 방법도 갈린다</text>

  <!-- BPE 모드 -->
  <rect x="60" y="96" width="360" height="456" rx="10" fill="#111" stroke="#222"/>
  <text x="240" y="122" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="700" fill="#7ec8e3" text-anchor="middle">BPE 모드</text>
  <text x="240" y="143" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">아래에서 위로 붙인다</text>

  <rect x="145" y="158" width="190" height="50" rx="6" fill="#101820" stroke="#2a3a55"/>
  <text x="240" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">문자 낱개</text>
  <text x="240" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">가장 작은 어휘</text>

  <line x1="240" y1="208" x2="240" y2="238" stroke="#666" stroke-width="2" marker-end="url(#step)"/>

  <rect x="108" y="238" width="264" height="50" rx="6" fill="#101820" stroke="#2a3a55"/>
  <text x="240" y="260" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">인접한 쌍을 병합</text>
  <text x="240" y="278" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">자주 붙는 쌍부터 하나로</text>

  <line x1="240" y1="288" x2="240" y2="318" stroke="#666" stroke-width="2" marker-end="url(#step)"/>

  <rect x="75" y="318" width="330" height="50" rx="6" fill="#101820" stroke="#2a3a55"/>
  <text x="240" y="340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">목표 크기에서 멈춤</text>
  <text x="240" y="358" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#888" text-anchor="middle">vocab_size = 32,000</text>

  <rect x="76" y="386" width="328" height="46" rx="5" fill="#0a0a0a" stroke="#1e1e28"/>
  <text x="92" y="404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">산출물</text>
  <text x="92" y="423" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12.5" fill="#e8e8e8">순서 있는 병합 규칙 목록</text>

  <rect x="76" y="438" width="328" height="46" rx="5" fill="#0a0a0a" stroke="#1e1e28"/>
  <text x="92" y="456" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">인코딩</text>
  <text x="92" y="475" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12.5" fill="#e8e8e8">규칙 순서대로 적용 · 분할이 하나로</text>

  <rect x="76" y="490" width="328" height="46" rx="5" fill="#0a0a0a" stroke="#1e1e28"/>
  <text x="92" y="508" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">쓰는 모델</text>
  <text x="92" y="527" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12.5" fill="#e8e8e8">LLaMA 2</text>

  <!-- Unigram 모드 -->
  <rect x="460" y="96" width="360" height="456" rx="10" fill="#111" stroke="#222"/>
  <text x="640" y="122" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="700" fill="#55c555" text-anchor="middle">Unigram 모드</text>
  <text x="640" y="143" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">위에서 아래로 깎는다</text>

  <rect x="475" y="158" width="330" height="50" rx="6" fill="#101a10" stroke="#2a4a2a"/>
  <text x="640" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">크고 넉넉한 초기 어휘</text>
  <text x="640" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">가능한 조각을 다 담는다</text>

  <line x1="640" y1="208" x2="640" y2="238" stroke="#666" stroke-width="2" marker-end="url(#step)"/>

  <rect x="508" y="238" width="264" height="50" rx="6" fill="#101a10" stroke="#2a4a2a"/>
  <text x="640" y="260" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">우도를 덜 떨어뜨리는 것부터 삭제</text>
  <text x="640" y="278" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">말뭉치 우도 기준</text>

  <line x1="640" y1="288" x2="640" y2="318" stroke="#666" stroke-width="2" marker-end="url(#step)"/>

  <rect x="545" y="318" width="190" height="50" rx="6" fill="#101a10" stroke="#2a4a2a"/>
  <text x="640" y="340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">목표 크기에서 멈춤</text>
  <text x="640" y="358" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">같은 크기, 다른 어휘</text>

  <rect x="476" y="386" width="328" height="46" rx="5" fill="#0a0a0a" stroke="#1e1e28"/>
  <text x="492" y="404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">산출물</text>
  <text x="492" y="423" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12.5" fill="#e8e8e8">각 조각과 그 확률의 표</text>

  <rect x="476" y="438" width="328" height="46" rx="5" fill="#0a0a0a" stroke="#1e1e28"/>
  <text x="492" y="456" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">인코딩</text>
  <text x="492" y="475" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12.5" fill="#e8e8e8">Viterbi로 확률 최대 분할</text>

  <rect x="476" y="490" width="328" height="46" rx="5" fill="#0a0a0a" stroke="#1e1e28"/>
  <text x="492" y="508" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">쓰는 모델</text>
  <text x="492" y="527" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12.5" fill="#e8e8e8">T5, ALBERT, XLNet</text>
</svg>
