<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="400" fill="#0a0a0a" rx="12"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">막대의 합도 1, 곡선 아래 넓이도 1</text>

  <text x="230" y="92" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">pmf — 높이가 곧 확률</text>
  <text x="650" y="92" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">pdf — 넓이가 확률</text>

  <line x1="70" y1="290" x2="400" y2="290" stroke="#888" stroke-width="1.5"/>
  <line x1="90" y1="130" x2="90" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="90" y1="140" x2="400" y2="140" stroke="#444" stroke-width="1"/>
  <text x="80" y="144" font-size="13" fill="#888" text-anchor="end">1.0</text>
  <text x="80" y="294" font-size="13" fill="#888" text-anchor="end">0</text>

  <rect x="120" y="252.5" width="56" height="37.5" fill="#7ec8e3" fill-opacity="0.85"/>
  <rect x="200" y="222.5" width="56" height="67.5" fill="#7ec8e3" fill-opacity="0.85"/>
  <rect x="280" y="245" width="56" height="45" fill="#7ec8e3" fill-opacity="0.85"/>
  <text x="148" y="240" font-size="13" fill="#e8e8e8" text-anchor="middle">0.25</text>
  <text x="228" y="210" font-size="13" fill="#e8e8e8" text-anchor="middle">0.45</text>
  <text x="308" y="232" font-size="13" fill="#e8e8e8" text-anchor="middle">0.30</text>
  <text x="148" y="312" font-size="13" fill="#888" text-anchor="middle">0</text>
  <text x="228" y="312" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="308" y="312" font-size="13" fill="#888" text-anchor="middle">2</text>
  <text x="230" y="346" font-size="14" fill="#55c555" text-anchor="middle">합 = 1, 높이는 절대 1을 안 넘는다</text>

  <line x1="490" y1="290" x2="820" y2="290" stroke="#888" stroke-width="1.5"/>
  <line x1="520" y1="130" x2="520" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="520" y1="215" x2="820" y2="215" stroke="#444" stroke-width="1"/>
  <line x1="520" y1="140" x2="820" y2="140" stroke="#444" stroke-width="1"/>
  <text x="510" y="219" font-size="13" fill="#888" text-anchor="end">1.0</text>
  <text x="510" y="144" font-size="13" fill="#888" text-anchor="end">2.0</text>
  <text x="510" y="294" font-size="13" fill="#888" text-anchor="end">0</text>

  <rect x="520" y="140" width="150" height="150" fill="#7ec8e3" fill-opacity="0.18"/>
  <line x1="520" y1="140" x2="670" y2="140" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="670" y1="140" x2="670" y2="290" stroke="#7ec8e3" stroke-width="2.5"/>
  <text x="595" y="178" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">넓이 = 2 × 0.5</text>
  <text x="595" y="204" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">= 1</text>
  <text x="520" y="312" font-size="13" fill="#888" text-anchor="middle">0</text>
  <text x="670" y="312" font-size="13" fill="#888" text-anchor="middle">0.5</text>
  <text x="694" y="136" font-size="13" fill="#7ec8e3">f(x) = 2</text>
  <text x="650" y="346" font-size="14" fill="#e05555" text-anchor="middle">밀도는 1을 넘어도 된다</text>

  <text x="60" y="382" font-size="13" fill="#888">[0, 0.5] 위에 고르게 퍼진 분포. 구간이 좁으니 넓이를 1로 채우려면 높이가 2여야 한다.</text>
</svg>
