<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
  <defs>
    <marker id="arrTC" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">수식을 한 줄로 펴면 괄호를 적어야 한다</text>
  <text x="60" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888888">손으로 쓴 모양</text>
  <text x="430" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888888">한 줄 코드</text>

  <!-- row 1: fraction -->
  <text x="60" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">분수선</text>
  <text x="100" y="134" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="17" fill="#e8e8e8">a + b</text>
  <line x1="94" y1="144" x2="184" y2="144" stroke="#7ec8e3" stroke-width="2"/>
  <text x="134" y="170" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="17" fill="#e8e8e8">2</text>
  <line x1="330" y1="142" x2="430" y2="142" stroke="#888888" stroke-width="2" marker-end="url(#arrTC)"/>
  <rect x="430" y="110" width="390" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="446" y="137" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">(a + b) / 2</text>
  <text x="446" y="157" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">a + b / 2</tspan><tspan fill="#9aa4b8">      # 다른 식</tspan></text>

  <!-- row 2: radical -->
  <text x="60" y="222" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">근호</text>
  <text x="96" y="264" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="24" fill="#e8e8e8">&#8730;</text>
  <line x1="114" y1="242" x2="196" y2="242" stroke="#7ec8e3" stroke-width="2"/>
  <text x="120" y="262" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="17" fill="#e8e8e8">a + b</text>
  <line x1="330" y1="254" x2="430" y2="254" stroke="#888888" stroke-width="2" marker-end="url(#arrTC)"/>
  <rect x="430" y="222" width="390" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="446" y="249" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">sqrt(a + b)</text>
  <text x="446" y="269" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">sqrt(a) + b</tspan><tspan fill="#9aa4b8">    # 다른 식</tspan></text>

  <!-- row 3: subscript and superscript -->
  <text x="60" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">아래첨자와 위첨자</text>
  <text x="100" y="372" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="17" fill="#e8e8e8">a</text>
  <text x="111" y="378" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7ec8e3">n</text>
  <text x="170" y="372" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="17" fill="#e8e8e8">a</text>
  <text x="181" y="362" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7ec8e3">n</text>
  <line x1="330" y1="366" x2="430" y2="366" stroke="#888888" stroke-width="2" marker-end="url(#arrTC)"/>
  <rect x="430" y="334" width="390" height="64" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="446" y="361" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">a[n]</tspan><tspan fill="#9aa4b8">      # 이름표</tspan></text>
  <text x="446" y="381" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">a ** n</tspan><tspan fill="#9aa4b8">    # 거듭제곱</tspan></text>
</svg>
