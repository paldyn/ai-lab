<text x="84.0" y="358.0" font-size="16" fill="#e8e8e8" text-anchor="start" font-weight="600">SAC 정책 개선</text>
<text x="84.0" y="380.0" font-size="13" fill="#888" text-anchor="start">기저 측도 h : 행동 공간의 균등 측도</text>
<text x="84.0" y="399.0" font-size="13" fill="#888" text-anchor="start">충분통계량 T : Q(s, ·)</text>
<text x="84.0" y="418.0" font-size="13" fill="#888" text-anchor="start">자연 파라미터 η : 1/α</text>
<rect x="460" y="330" width="360" height="100" rx="8" fill="#111827" stroke="#7ec8e3" stroke-width="1.5"/>
