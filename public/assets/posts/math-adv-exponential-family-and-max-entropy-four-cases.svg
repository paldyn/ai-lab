<text x="440.0" y="470.0" font-size="13" fill="#888" text-anchor="middle">바탕과 통계량만 바꿔 끼운 같은 지수 기울임이고, 정규화 상수 A(η) = log Z 가 평균과 분산을 쥔다</text>
