<text x="484.0" y="130.0" font-size="13" fill="#888" text-anchor="start">기저 측도 h : π_ref</text>
<text x="484.0" y="149.0" font-size="13" fill="#888" text-anchor="start">충분통계량 T : 보상 r</text>
<text x="484.0" y="168.0" font-size="13" fill="#888" text-anchor="start">자연 파라미터 η : 1/β</text>
