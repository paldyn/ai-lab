<text x="484.0" y="399.0" font-size="13" fill="#888" text-anchor="start">충분통계량 T : −E_θ(x)</text>
<text x="484.0" y="418.0" font-size="13" fill="#888" text-anchor="start">자연 파라미터 η : 1</text>
