<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="crarr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">연쇄법칙: 겉을 미분하고 속을 미분해 곱한다</text>

  <rect x="60" y="88" width="300" height="70" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="118" font-size="16" font-weight="600" fill="#e8e8e8">주어진 식  (2x+1)⁵</text>
  <text x="84" y="140" font-size="13" fill="#888">껍질이 두 겹입니다.</text>

  <line x1="360" y1="123" x2="446" y2="123" stroke="#888" stroke-width="2" marker-end="url(#crarr)"/>

  <rect x="452" y="88" width="368" height="70" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="476" y="118" font-size="16" font-weight="600" fill="#7ec8e3">① 겉과 속을 가른다</text>
  <text x="476" y="140" font-size="13" fill="#888">겉 : u⁵          속 : u = 2x+1</text>

  <rect x="60" y="192" width="360" height="70" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="222" font-size="16" font-weight="600" fill="#7ec8e3">② 겉을 미분한다</text>
  <text x="84" y="244" font-size="13" fill="#888">u⁵ → 5u⁴, 속을 도로 넣어 5(2x+1)⁴</text>

  <rect x="460" y="192" width="360" height="70" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="484" y="222" font-size="16" font-weight="600" fill="#7ec8e3">③ 속을 미분한다</text>
  <text x="484" y="244" font-size="13" fill="#888">u = 2x+1 → 2</text>

  <line x1="240" y1="262" x2="240" y2="290" stroke="#888" stroke-width="2"/>
  <line x1="640" y1="262" x2="640" y2="290" stroke="#888" stroke-width="2"/>
  <path d="M 240 290 L 440 290 L 640 290" stroke="#888" stroke-width="2" fill="none"/>
  <line x1="440" y1="290" x2="440" y2="306" stroke="#888" stroke-width="2" marker-end="url(#crarr)"/>

  <rect x="220" y="318" width="440" height="56" rx="8" fill="#0e1b12" stroke="#55c555" stroke-width="1.5"/>
  <text x="244" y="353" font-size="16" font-weight="600" fill="#55c555">④ 둘을 곱한다 :  5(2x+1)⁴ × 2 = 10(2x+1)⁴</text>
</svg>
