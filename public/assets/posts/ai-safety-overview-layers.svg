<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <style>text { font-family: 'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif; }</style>
  </defs>

  <rect width="880" height="420" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">AI 안전성 방어 레이어</text>

  <!-- L5: 가장 넓은 제도적 경계 -->
  <rect x="60" y="72" width="760" height="316" rx="12" fill="none" stroke="#8b96a8" stroke-width="2" stroke-dasharray="7,4"/>
  <rect x="76" y="80" width="326" height="28" rx="6" fill="#151922" stroke="#8b96a8" stroke-width="1"/>
  <text x="90" y="99" font-size="14" font-weight="600" fill="#cbd2dc">L5 · 규제·법률</text>
  <text x="206" y="99" font-size="13" fill="#aeb7c4">EU AI Act · 저작권법</text>

  <!-- L4: 조직과 정책 -->
  <rect x="90" y="116" width="700" height="260" rx="11" fill="none" stroke="#55c555" stroke-width="1.75" stroke-dasharray="6,4"/>
  <rect x="106" y="123" width="354" height="28" rx="6" fill="#102014" stroke="#55c555" stroke-width="1"/>
  <text x="120" y="142" font-size="14" font-weight="600" fill="#72d278">L4 · 조직·정책</text>
  <text x="242" y="142" font-size="13" fill="#a9c9ae">사용 가이드라인 · 레드팀</text>

  <!-- L3: 모델 밖 시스템 설계 -->
  <rect x="120" y="158" width="640" height="206" rx="10" fill="none" stroke="#7ec8e3" stroke-width="1.75" stroke-dasharray="5,3"/>
  <rect x="136" y="165" width="444" height="28" rx="6" fill="#101d24" stroke="#7ec8e3" stroke-width="1"/>
  <text x="150" y="184" font-size="14" font-weight="600" fill="#8dd5ef">L3 · 시스템 설계</text>
  <text x="286" y="184" font-size="13" fill="#abc6d0">입력 검증 · 출력 필터 · 사람 검토</text>

  <!-- L2: 안전 행동을 만드는 학습 -->
  <rect x="150" y="200" width="580" height="152" rx="10" fill="none" stroke="#8585d6" stroke-width="1.75" stroke-dasharray="4,3"/>
  <rect x="166" y="207" width="430" height="28" rx="6" fill="#17172a" stroke="#8585d6" stroke-width="1"/>
  <text x="180" y="226" font-size="14" font-weight="600" fill="#9a9ae5">L2 · 모델 학습</text>
  <text x="296" y="226" font-size="13" fill="#b5b5d4">RLHF · Constitutional AI · DPO</text>

  <!-- L1: 모델 코어 -->
  <rect x="190" y="242" width="500" height="98" rx="10" fill="#19192b" stroke="#9a9ae5" stroke-width="2"/>
  <text x="440" y="270" font-size="16" font-weight="700" fill="#aaaaf0" text-anchor="middle">L1 · 모델 코어 안전성</text>
  <text x="440" y="296" font-size="13" fill="#c4c4d8" text-anchor="middle">유해 요청 감지 · 안전한 거절 행동</text>
  <text x="440" y="319" font-size="13" fill="#a8a8bd" text-anchor="middle">학습된 원칙을 실제 응답에 적용</text>
</svg>
