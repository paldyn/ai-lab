<text x="60" y="410" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">KL(q‖p)는 p가 거의 0인 곳에 q를 두지 못하게 막아 봉우리 하나에 들어앉는다 — 왼쪽 봉우리는 통째로 버린다.</text>
<text x="60" y="432" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">KL(p‖q)는 p가 있는 곳을 q가 다 덮게 만들어 두 봉우리를 감싸고, 그 대가로 아무것도 없는 z = 0에 밀도를 쏟는다.</text>
