<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">이미지를 다리로 삼는 정렬</text>
  <text x="60" y="72" font-size="13" fill="#888">실선은 학습한 짝, 점선은 학습하지 않았는데 생기는 간접 연결이다.</text>

  <rect x="350" y="180" width="180" height="70" rx="10" fill="#0d1117" stroke="#7ec8e3" stroke-width="2"/>
  <text x="440" y="211" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">이미지</text>
  <text x="440" y="233" font-size="13" fill="#888" text-anchor="middle">중심 모달리티</text>

  <rect x="80" y="110" width="160" height="56" rx="10" fill="#0d1117" stroke="#7777cc" stroke-width="1.5"/>
  <text x="160" y="134" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">텍스트</text>
  <text x="160" y="154" font-size="12" fill="#888" text-anchor="middle">CLIP에서 가져와 고정</text>

  <rect x="80" y="270" width="160" height="56" rx="10" fill="#0d1117" stroke="#7777cc" stroke-width="1.5"/>
  <text x="160" y="294" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">오디오</text>
  <text x="160" y="314" font-size="12" fill="#888" text-anchor="middle">영상의 프레임과 소리</text>

  <rect x="640" y="110" width="160" height="56" rx="10" fill="#0d1117" stroke="#7777cc" stroke-width="1.5"/>
  <text x="720" y="134" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">깊이 맵</text>
  <text x="720" y="154" font-size="12" fill="#888" text-anchor="middle">RGB-D 촬영</text>

  <rect x="640" y="270" width="160" height="56" rx="10" fill="#0d1117" stroke="#7777cc" stroke-width="1.5"/>
  <text x="720" y="294" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">열화상 · IMU</text>
  <text x="720" y="314" font-size="12" fill="#888" text-anchor="middle">같은 장면의 사진</text>

  <line x1="240" y1="146" x2="350" y2="196" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="240" y1="290" x2="350" y2="236" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="640" y1="146" x2="530" y2="196" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="640" y1="290" x2="530" y2="236" stroke="#7ec8e3" stroke-width="2"/>

  <line x1="160" y1="166" x2="160" y2="270" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="176" y="222" font-size="13" fill="#e05555">간접 연결</text>

  <text x="60" y="368" font-size="13" fill="#7ec8e3">오디오-텍스트 짝은 학습하지 않았지만, 둘 다 이미지 쪽으로 정렬돼 있어 가까이 놓인다.</text>
</svg>
