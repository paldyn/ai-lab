<svg xmlns="http://www.w3.org/2000/svg" width="880" height="424" viewBox="0 0 880 424">
  <rect x="0" y="0" width="880" height="424" rx="12" fill="#0a0a0a"/>

  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">등차는 직선 위에, 등비는 휘며 벌어진다</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">가로가 n, 세로가 그 자리의 값</text>

  <!-- 축 -->
  <line x1="150" y1="100" x2="150" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="110" y1="370" x2="800" y2="370" stroke="#888" stroke-width="1.5"/>
  <text x="812" y="375" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">n</text>
  <text x="150" y="92" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">값</text>

  <!-- 세로 눈금 -->
  <line x1="144" y1="323.6" x2="156" y2="323.6" stroke="#444" stroke-width="1.5"/>
  <line x1="144" y1="277.1" x2="156" y2="277.1" stroke="#444" stroke-width="1.5"/>
  <line x1="144" y1="230.7" x2="156" y2="230.7" stroke="#444" stroke-width="1.5"/>
  <line x1="144" y1="184.3" x2="156" y2="184.3" stroke="#444" stroke-width="1.5"/>
  <line x1="144" y1="137.9" x2="156" y2="137.9" stroke="#444" stroke-width="1.5"/>
  <text x="136" y="375" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0</text>
  <text x="136" y="328" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">10</text>
  <text x="136" y="282" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">20</text>
  <text x="136" y="235" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">30</text>
  <text x="136" y="189" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">40</text>
  <text x="136" y="142" text-anchor="end" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">50</text>

  <!-- 가로 눈금 -->
  <line x1="220" y1="364" x2="220" y2="376" stroke="#444" stroke-width="1.5"/>
  <line x1="380" y1="364" x2="380" y2="376" stroke="#444" stroke-width="1.5"/>
  <line x1="540" y1="364" x2="540" y2="376" stroke="#444" stroke-width="1.5"/>
  <line x1="700" y1="364" x2="700" y2="376" stroke="#444" stroke-width="1.5"/>
  <text x="220" y="396" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">1</text>
  <text x="380" y="396" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">2</text>
  <text x="540" y="396" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">3</text>
  <text x="700" y="396" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">4</text>

  <!-- 등비 곡선 2, 6, 18, 54 -->
  <polyline points="220,360.7 300,353.9 380,342.1 460,323.4 540,286.4 620,225.2 700,119.3" fill="none" stroke="#55c555" stroke-width="2.5"/>
  <circle cx="220" cy="360.7" r="5" fill="#55c555"/>
  <circle cx="380" cy="342.1" r="5" fill="#55c555"/>
  <circle cx="540" cy="286.4" r="5" fill="#55c555"/>
  <circle cx="700" cy="119.3" r="5" fill="#55c555"/>
  <text x="718" y="124" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555">54</text>

  <!-- 등차 직선 3, 7, 11, 15 -->
  <line x1="180" y1="360.8" x2="712" y2="299.2" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="220" cy="356.1" r="5" fill="#7ec8e3"/>
  <circle cx="380" cy="337.5" r="5" fill="#7ec8e3"/>
  <circle cx="540" cy="318.9" r="5" fill="#7ec8e3"/>
  <circle cx="700" cy="300.4" r="5" fill="#7ec8e3"/>
  <text x="718" y="305" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#7ec8e3">15</text>

  <!-- 범례 -->
  <circle cx="212" cy="126" r="5" fill="#7ec8e3"/>
  <text x="230" y="131" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8">등차 3, 7, 11, 15 — 한 칸에 4를 더한다</text>
  <circle cx="212" cy="158" r="5" fill="#55c555"/>
  <text x="230" y="163" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8">등비 2, 6, 18, 54 — 한 칸에 3배가 된다</text>
</svg>
