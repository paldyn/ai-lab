<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 510" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="510" rx="12" fill="#0a0a0a"/>

  <text x="440" y="46" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700" xml:space="preserve">슬라이딩 윈도우와 창 경계</text>
  <text x="440" y="70" text-anchor="middle" fill="#888" font-size="13" xml:space="preserve">max_length 384 · stride 128 — 창이 256토큰씩 앞으로 나아간다</text>

  <!-- 문서 -->
  <text x="60" y="94" fill="#888" font-size="11" xml:space="preserve">문서 전체</text>
  <text x="361" y="94" text-anchor="middle" fill="#55c555" font-size="11" xml:space="preserve">정답 스팬</text>
  <rect x="60" y="100" width="720" height="28" rx="4" fill="#101010" stroke="#333"/>
  <rect x="345" y="100" width="32" height="204" fill="#55c555" opacity="0.12"/>
  <rect x="345" y="100" width="32" height="28" fill="#55c555" opacity="0.75"/>

  <!-- 창 1 -->
  <rect x="60" y="150" width="307" height="46" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="72" y="170" fill="#e8e8e8" font-size="13" font-weight="600" xml:space="preserve">창 1</text>
  <text x="72" y="187" fill="#e05555" font-size="11" xml:space="preserve">정답이 창 경계에 걸침 → 답 없음으로 라벨</text>

  <!-- 창 2 -->
  <rect x="265" y="204" width="307" height="46" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="277" y="224" fill="#e8e8e8" font-size="13" font-weight="600" xml:space="preserve">창 2</text>
  <text x="277" y="241" fill="#55c555" font-size="11" xml:space="preserve">정답이 온전히 들어감 → 시작·끝 위치를 라벨</text>

  <!-- 창 3 -->
  <rect x="470" y="258" width="307" height="46" rx="6" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="482" y="278" fill="#e8e8e8" font-size="13" font-weight="600" xml:space="preserve">창 3</text>
  <text x="482" y="295" fill="#888" font-size="11" xml:space="preserve">정답 없음 → 답 없음으로 라벨</text>

  <!-- 진행과 겹침 -->
  <line x1="60" y1="326" x2="265" y2="326" stroke="#888"/>
  <line x1="60" y1="320" x2="60" y2="332" stroke="#888"/>
  <line x1="265" y1="320" x2="265" y2="332" stroke="#888"/>
  <text x="162" y="346" text-anchor="middle" fill="#888" font-size="11" xml:space="preserve">창당 진행 256토큰</text>

  <line x1="265" y1="326" x2="367" y2="326" stroke="#7ec8e3"/>
  <line x1="367" y1="320" x2="367" y2="332" stroke="#7ec8e3"/>
  <text x="316" y="346" text-anchor="middle" fill="#7ec8e3" font-size="11" xml:space="preserve">겹침 128토큰</text>

  <rect x="60" y="384" width="760" height="60" rx="8" fill="#0d0d0d" stroke="#333"/>
  <text x="84" y="408" fill="#e8e8e8" font-size="13" xml:space="preserve">겹침이 없으면 창 경계에 걸친 답은 어느 창에서도 온전히 보이지 않는다</text>
  <text x="84" y="430" fill="#888" font-size="12" xml:space="preserve">추론에서는 창마다 후보를 뽑아 원문 문자 위치로 되돌린 뒤 로짓 합으로 견준다</text>
</svg>
