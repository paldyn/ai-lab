<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">난수 10만 번이 사 주는 자릿수</text>
  <text x="60" y="70" font-size="13" fill="#888">N번 돌려 얻는 상대오차는 대략 1 / √N 이다</text>

  <rect x="60" y="96" width="760" height="52" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="84" y="127" font-size="15" fill="#e8e8e8">N = 10 000</text>
  <text x="330" y="127" font-size="15" fill="#888">상대오차 ≈ 1 %</text>
  <text x="600" y="127" font-size="15" fill="#7ec8e3">두 자리쯤</text>

  <rect x="60" y="158" width="760" height="52" rx="8" fill="#0f1a10" stroke="#55c555" stroke-width="2"/>
  <text x="84" y="189" font-size="15" fill="#e8e8e8">N = 100 000</text>
  <text x="330" y="189" font-size="15" fill="#888">상대오차 ≈ 0.3 %</text>
  <text x="600" y="189" font-size="15" fill="#55c555">두세 자리</text>

  <rect x="60" y="220" width="760" height="52" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="84" y="251" font-size="15" fill="#e8e8e8">N = 10 000 000</text>
  <text x="330" y="251" font-size="15" fill="#888">상대오차 ≈ 0.03 %</text>
  <text x="600" y="251" font-size="15" fill="#7ec8e3">서너 자리</text>

  <rect x="60" y="296" width="760" height="80" rx="8" fill="#1a0f0f" stroke="#e05555" stroke-width="2"/>
  <text x="84" y="322" font-size="15" font-weight="600" fill="#e8e8e8">그래서 로또 1등은 이 방법으로 안 잡힌다</text>
  <text x="84" y="344" font-size="13" fill="#888">확률이 1.2 × 10⁻⁷ 이라 10만 번의 기댓값이 0.012회 — 거의 언제나 0회가 나온다.</text>
  <text x="84" y="366" font-size="13" fill="#888">재려는 확률의 역수(약 800만)보다 훨씬 많이 뽑아야 잴 수 있다.</text>
</svg>
