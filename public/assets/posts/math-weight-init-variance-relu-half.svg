<text x="300" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888" text-anchor="middle">0</text>
<text x="175.2" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">음수 — 전부 0 이 된다</text>
<text x="398.8" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">양수 — 그대로 통과</text>
<rect x="560" y="120" width="260" height="60" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="578" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">들어오는 값: 분산 σ²</text>
<text x="578" y="164" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">평균 0 인 대칭 분포라고 두면</text>
<rect x="560" y="200" width="260" height="60" rx="8" fill="#0f1a0f" stroke="#55c555" stroke-width="1.5"/>
<text x="578" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">나가는 값: E[relu(z)²] = σ²/2</text>
<text x="578" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">절반이 0 이 되고 나머지 절반만 남는다</text>
<rect x="560" y="280" width="260" height="60" rx="8" fill="#1a140a" stroke="#e0a355" stroke-width="1.5"/>
<text x="578" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">그래서 이득에 1/2 이 붙는다</text>
<text x="578" y="324" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="400" fill="#9aa4b8">이 1/2 을 되돌리는 것이 He 초기화다</text>
<text x="60" y="386" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">tanh 는 원점 근처에서 기울기가 1 이라 이 1/2 이 붙지 않는다 — Xavier 와 He 가 갈리는 자리가 여기다.</text>
</svg>
