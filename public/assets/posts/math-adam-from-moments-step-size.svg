<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 480">
<defs><marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/></marker></defs>
<rect x="0" y="0" width="880" height="480" rx="12" fill="#0a0a0a"/>
<text x="60" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">그래디언트가 커져도 Adam의 걸음은 그대로다</text>
<text x="60" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">가로축은 그래디언트 성분의 크기 |g|, 세로축은 한 스텝에 파라미터가 움직이는 거리. 두 축 모두 로그 눈금</text>
<text x="60" y="90" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">같은 그래디언트가 이어지는 경우 — SGD는 η = 0.1, Adam은 η = 3×10⁻⁴</text>
