<text x="629.9" y="226.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7777cc">SGD — 걸음 = 0.1 × |g|</text>
<text x="688.3" y="314.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">Adam — 걸음 ≈ 3×10⁻⁴</text>
<circle cx="294.9" cy="326.0" r="5" fill="#e8e8e8"/>
<text x="308.9" y="350.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">|g| = 0.003 에서 같다</text>
<circle cx="353.3" cy="303.3" r="5" fill="#e05555"/>
<circle cx="576.7" cy="216.7" r="5" fill="#e05555"/>
<path d="M 353.3 303.3 L 353.3 216.7 L 569.7 216.7" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<text x="343.3" y="202.7" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">|g| 100배 → SGD 걸음 100배</text>
<text x="60" y="456" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">빨간 점은 |g| = 0.01 과 1. SGD는 걸음이 0.001 에서 0.1 로 뛰고, Adam의 선은 어느 자리에서나 같은 높이다.</text>
