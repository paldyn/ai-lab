<text x="800" y="432" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="end">그래디언트 크기 |g|</text>
<line x1="130.0" y1="390.0" x2="800.0" y2="130.0" stroke="#7777cc" stroke-width="2.5"/>
