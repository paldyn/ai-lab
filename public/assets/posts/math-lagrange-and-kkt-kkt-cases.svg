<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="470" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">제약이 느슨할 때와 팽팽할 때</text>
  <text x="60" y="72" font-size="14" fill="#888">f(x) = −(x−3)² 를 x ≤ c 아래에서 최대화한다. 회색 칸은 갈 수 없는 자리.</text>

  <text x="70" y="112" font-size="16" font-weight="600" fill="#55c555">c = 5 · 제약이 남아돈다</text>
  <rect x="353" y="140" width="57" height="220" fill="#333333" fill-opacity="0.5"/>
  <line x1="70" y1="360" x2="410" y2="360" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="360" x2="70" y2="140" stroke="#888" stroke-width="1.5"/>
  <polyline points="70,360 98,304 127,258 155,223 183,197 212,182 240,177 268,182 297,197 325,223 353,258 382,304 410,360"
            fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="353" y1="140" x2="353" y2="360" stroke="#e05555" stroke-width="2"/>
  <text x="336" y="382" font-size="14" fill="#e05555">c = 5</text>
  <circle cx="240" cy="177" r="6" fill="#55c555"/>
  <line x1="240" y1="183" x2="240" y2="360" stroke="#555" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="212" y="382" font-size="14" fill="#55c555">x* = 3</text>
  <text x="128" y="164" font-size="14" fill="#55c555">제약 없는 최적점이</text>
  <text x="128" y="144" font-size="14" fill="#55c555">이미 안쪽에 있다 · λ = 0</text>

  <text x="480" y="112" font-size="16" font-weight="600" fill="#e05555">c = 1.5 · 제약이 팽팽하다</text>
  <rect x="565" y="140" width="255" height="220" fill="#333333" fill-opacity="0.5"/>
  <line x1="480" y1="360" x2="820" y2="360" stroke="#888" stroke-width="1.5"/>
  <line x1="480" y1="360" x2="480" y2="140" stroke="#888" stroke-width="1.5"/>
  <polyline points="480,360 508,304 537,258 565,223 593,197 622,182 650,177 678,182 707,197 735,223 763,258 792,304 820,360"
            fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="565" y1="140" x2="565" y2="360" stroke="#e05555" stroke-width="2"/>
  <text x="540" y="382" font-size="14" fill="#e05555">c = 1.5</text>
  <circle cx="565" cy="223" r="6" fill="#e05555"/>
  <circle cx="650" cy="177" r="5" fill="none" stroke="#888" stroke-width="2"/>
  <text x="668" y="166" font-size="13" fill="#888">가고 싶은 자리</text>
  <text x="590" y="252" font-size="14" fill="#e05555">x* = 1.5 로 밀려난다</text>
  <text x="590" y="276" font-size="14" fill="#e8e8e8">λ = 2(3 − 1.5) = 3</text>

  <rect x="60" y="404" width="760" height="52" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="428" font-size="14" font-weight="600" fill="#e8e8e8">상보 여유  λ · ( g(x*) − c ) = 0 이 두 경우를 한 줄로 묶는다</text>
  <text x="84" y="448" font-size="13" fill="#888">왼쪽은 λ = 0 이라 첫 인수가 0이고, 오른쪽은 x* = c 라 둘째 인수가 0이다.</text>
</svg>
