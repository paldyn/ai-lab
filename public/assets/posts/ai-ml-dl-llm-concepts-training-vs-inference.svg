<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512">
  <defs>
    <style>
      text { font-family: 'Wanted Sans Variable', 'Wanted Sans', -apple-system, sans-serif; }
      .h1 { font-size: 22px; font-weight: 700; fill: #e8e8e8; }
      .sub { font-size: 13px; fill: #8a8a8a; }
      .band-name { font-size: 16px; font-weight: 600; fill: #e8e8e8; }
      .band-en { font-size: 10px; letter-spacing: 0.12em; }
      .meta { font-size: 12px; fill: #7a7a7a; }
      .b-t { font-size: 13px; font-weight: 600; fill: #e8e8e8; }
      .b-s { font-size: 11px; fill: #8a8a8a; }
      .edge { font-size: 11px; fill: #6e6e6e; }
      .note { font-size: 11px; fill: #6e6e6e; }
    </style>
    <marker id="ar" markerWidth="14" markerHeight="14" refX="13" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,9 L13,4.5 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect width="880" height="512" fill="#0a0a0a" rx="12"/>

  <text x="50" y="48" class="h1">학습과 추론</text>
  <text x="50" y="74" class="sub">학습은 파라미터를 정하고, 추론은 정해진 파라미터를 쓴다</text>

  <!-- 학습 -->
  <rect x="50" y="100" width="780" height="124" rx="8" fill="#0e0e0e" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="74" y="126" class="band-name">학습</text>
  <text x="114" y="126" class="band-en" fill="#7777cc">TRAINING</text>
  <text x="806" y="126" class="meta" text-anchor="end">한 번 · GPU 대량 · 몇 시간에서 몇 달 · 큰 목돈</text>

  <rect x="74" y="144" width="156" height="60" rx="6" fill="#171717" stroke="#333333" stroke-width="1"/>
  <text x="152" y="168" class="b-t" text-anchor="middle">학습 데이터</text>
  <text x="152" y="188" class="b-s" text-anchor="middle">정답이 붙은 예시</text>

  <line x1="230" y1="174" x2="272" y2="174" stroke="#3f3f3f" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="272" y="144" width="264" height="60" rx="6" fill="#171717" stroke="#333333" stroke-width="1"/>
  <text x="404" y="168" class="b-t" text-anchor="middle">오차를 재고 파라미터를 옮긴다</text>
  <text x="404" y="188" class="b-s" text-anchor="middle">이 과정을 수만 번</text>

  <line x1="536" y1="174" x2="578" y2="174" stroke="#3f3f3f" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="578" y="144" width="228" height="60" rx="6" fill="#171717" stroke="#333333" stroke-width="1"/>
  <text x="692" y="168" class="b-t" text-anchor="middle">파라미터가 정해진다</text>
  <text x="692" y="188" class="b-s" text-anchor="middle">더 이상 바뀌지 않는다</text>

  <!-- 학습 → 모델 -->
  <line x1="440" y1="224" x2="440" y2="254" stroke="#3f3f3f" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="458" y="243" class="edge">값이 고정된다</text>

  <!-- 모델 -->
  <rect x="140" y="254" width="600" height="52" rx="8" fill="#141414" stroke="#4a4a4a" stroke-width="1.5"/>
  <rect x="140" y="254" width="600" height="4" rx="2" fill="#3a3a3a"/>
  <text x="440" y="286" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">학습된 모델 = 정해진 숫자 뭉치</text>

  <!-- 모델 → 추론 -->
  <line x1="440" y1="306" x2="440" y2="336" stroke="#3f3f3f" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="458" y="325" class="edge">그 값을 읽기만 한다</text>

  <!-- 추론 -->
  <rect x="50" y="336" width="780" height="124" rx="8" fill="#0e0e0e" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="74" y="362" class="band-name">추론</text>
  <text x="114" y="362" class="band-en" fill="#7ec8e3">INFERENCE</text>
  <text x="806" y="362" class="meta" text-anchor="end">요청마다 반복 · 쓰는 내내 · 계속 나가는 운영비</text>

  <rect x="74" y="380" width="156" height="60" rx="6" fill="#171717" stroke="#333333" stroke-width="1"/>
  <text x="152" y="404" class="b-t" text-anchor="middle">사용자 요청</text>
  <text x="152" y="424" class="b-s" text-anchor="middle">질문 하나</text>

  <line x1="230" y1="410" x2="272" y2="410" stroke="#3f3f3f" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="272" y="380" width="264" height="60" rx="6" fill="#171717" stroke="#333333" stroke-width="1"/>
  <text x="404" y="404" class="b-t" text-anchor="middle">그 숫자로 계산만 한다</text>
  <text x="404" y="424" class="b-s" text-anchor="middle">값을 바꾸지 않는다</text>

  <line x1="536" y1="410" x2="578" y2="410" stroke="#3f3f3f" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="578" y="380" width="228" height="60" rx="6" fill="#171717" stroke="#333333" stroke-width="1"/>
  <text x="692" y="404" class="b-t" text-anchor="middle">답</text>
  <text x="692" y="424" class="b-s" text-anchor="middle">밀리초 ~ 몇 초</text>

  <text x="50" y="490" class="note">챗봇이 내 이름을 기억하는 것은 학습이 아니라, 그 문장이 매 요청마다 입력에 다시 들어가기 때문입니다</text>
</svg>
