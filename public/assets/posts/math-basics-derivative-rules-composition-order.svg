<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="350" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="coarr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">합성은 순서를 바꾸면 다른 함수가 된다</text>

  <text x="60" y="86" font-size="16" font-weight="600" fill="#7ec8e3">g(f(x)) — f 를 먼저 먹인다</text>
  <rect x="60" y="96" width="70" height="56" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="95" y="130" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">2</text>
  <line x1="130" y1="124" x2="168" y2="124" stroke="#888" stroke-width="2" marker-end="url(#coarr)"/>
  <rect x="172" y="96" width="180" height="56" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="262" y="130" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">f : 제곱한다</text>
  <line x1="352" y1="124" x2="390" y2="124" stroke="#888" stroke-width="2" marker-end="url(#coarr)"/>
  <rect x="394" y="96" width="70" height="56" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="429" y="130" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">4</text>
  <line x1="464" y1="124" x2="502" y2="124" stroke="#888" stroke-width="2" marker-end="url(#coarr)"/>
  <rect x="506" y="96" width="180" height="56" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="596" y="130" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">g : 1을 더한다</text>
  <line x1="686" y1="124" x2="724" y2="124" stroke="#888" stroke-width="2" marker-end="url(#coarr)"/>
  <rect x="728" y="96" width="70" height="56" rx="8" fill="#0e1b12" stroke="#55c555" stroke-width="1.5"/>
  <text x="763" y="130" font-size="16" font-weight="600" fill="#55c555" text-anchor="middle">5</text>

  <text x="60" y="196" font-size="16" font-weight="600" fill="#7ec8e3">f(g(x)) — g 를 먼저 먹인다</text>
  <rect x="60" y="206" width="70" height="56" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="95" y="240" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">2</text>
  <line x1="130" y1="234" x2="168" y2="234" stroke="#888" stroke-width="2" marker-end="url(#coarr)"/>
  <rect x="172" y="206" width="180" height="56" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="262" y="240" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">g : 1을 더한다</text>
  <line x1="352" y1="234" x2="390" y2="234" stroke="#888" stroke-width="2" marker-end="url(#coarr)"/>
  <rect x="394" y="206" width="70" height="56" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="429" y="240" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">3</text>
  <line x1="464" y1="234" x2="502" y2="234" stroke="#888" stroke-width="2" marker-end="url(#coarr)"/>
  <rect x="506" y="206" width="180" height="56" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="596" y="240" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">f : 제곱한다</text>
  <line x1="686" y1="234" x2="724" y2="234" stroke="#888" stroke-width="2" marker-end="url(#coarr)"/>
  <rect x="728" y="206" width="70" height="56" rx="8" fill="#2a1214" stroke="#e05555" stroke-width="1.5"/>
  <text x="763" y="240" font-size="16" font-weight="600" fill="#e05555" text-anchor="middle">9</text>

  <text x="60" y="306" font-size="13" fill="#888">넣은 수가 같은 2인데 나온 값이 5와 9로 다릅니다. 그래서 어느 쪽이 겉이고 어느 쪽이 속인지를 먼저 갈라야 합니다.</text>
</svg>
