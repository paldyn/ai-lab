<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="412" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">상한은 한 겹이 아니라 세 겹으로 건다</text>
  <text x="60" y="72" font-size="13" fill="#888">안쪽이 터지면 걸음 하나가 줄어들고, 바깥이 터지면 새 작업을 안 받는다.</text>

  <rect x="60" y="100" width="760" height="250" rx="12" fill="#0d1117" stroke="#e05555" stroke-width="1.5"/>
  <text x="80" y="126" font-size="13" font-weight="600" fill="#e05555">하루 예산 — 테넌트·서비스 전체</text>
  <text x="80" y="336" font-size="12" fill="#888">넘으면 새 작업을 안 받는다. 이미 돌던 것은 마저 끝낸다.</text>

  <rect x="120" y="140" width="640" height="170" rx="10" fill="#101418" stroke="#7777cc" stroke-width="1.5"/>
  <text x="140" y="166" font-size="13" font-weight="600" fill="#7777cc">작업 하나 — 걸음 수와 총 토큰</text>
  <text x="140" y="296" font-size="12" fill="#888">넘으면 상태를 남기고 그 작업만 멈춘다. 다른 작업은 계속 돈다.</text>

  <rect x="180" y="180" width="520" height="90" rx="8" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="208" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">걸음 하나 — 도구 결과의 크기</text>
  <text x="440" y="232" font-size="12" fill="#888" text-anchor="middle">조회 결과가 크면 잘라서 문맥에 넣는다</text>
  <text x="440" y="252" font-size="12" fill="#888" text-anchor="middle">넘어도 작업은 멈추지 않는다</text>

  <text x="60" y="386" font-size="13" fill="#7ec8e3">한 겹만 걸면 둘 중 하나다 — 너무 자주 멈추거나, 청구서가 온 뒤에야 안다.</text>
</svg>
