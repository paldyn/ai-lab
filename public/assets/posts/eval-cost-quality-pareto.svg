<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="430" rx="12" fill="#0a0a0a"/>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">돈을 더 쓴다고 다 좋아지지는 않는다</text>
  <text x="62" y="72" font-size="13" fill="#888">같은 과제를 여섯 가지 구성으로 돌려 비용과 품질을 함께 찍은 모습이다.</text>

  <text x="62" y="118" font-size="12" font-weight="600" fill="#888">품질 점수</text>

  <line x1="140" y1="273" x2="820" y2="273" stroke="#222" stroke-width="1"/>
  <line x1="140" y1="216" x2="820" y2="216" stroke="#222" stroke-width="1"/>
  <line x1="140" y1="159" x2="820" y2="159" stroke="#222" stroke-width="1"/>
  <line x1="140" y1="130" x2="140" y2="330" stroke="#555" stroke-width="1.5"/>
  <line x1="140" y1="330" x2="820" y2="330" stroke="#555" stroke-width="1.5"/>

  <text x="130" y="334" font-size="11" fill="#888" text-anchor="end">60</text>
  <text x="130" y="277" font-size="11" fill="#888" text-anchor="end">70</text>
  <text x="130" y="220" font-size="11" fill="#888" text-anchor="end">80</text>
  <text x="130" y="163" font-size="11" fill="#888" text-anchor="end">90</text>

  <text x="140" y="350" font-size="11" fill="#888" text-anchor="middle">0</text>
  <text x="276" y="350" font-size="11" fill="#888" text-anchor="middle">2×</text>
  <text x="412" y="350" font-size="11" fill="#888" text-anchor="middle">4×</text>
  <text x="548" y="350" font-size="11" fill="#888" text-anchor="middle">6×</text>
  <text x="684" y="350" font-size="11" fill="#888" text-anchor="middle">8×</text>
  <text x="820" y="350" font-size="11" fill="#888" text-anchor="middle">10×</text>
  <text x="480" y="376" font-size="12" fill="#888" text-anchor="middle">요청당 비용 (가장 싼 구성 대비)</text>

  <polyline points="174,284 222,250 310,204 453,181 752,164" fill="none" stroke="#55c555" stroke-width="2.5"/>

  <circle cx="174" cy="284" r="7" fill="#12261a" stroke="#55c555" stroke-width="2"/>
  <text x="186" y="304" font-size="12" fill="#e8e8e8">소형 모델</text>

  <circle cx="222" cy="250" r="7" fill="#12261a" stroke="#55c555" stroke-width="2"/>
  <text x="234" y="270" font-size="12" fill="#e8e8e8">소형 + 프롬프트 개선</text>

  <circle cx="310" cy="204" r="7" fill="#12261a" stroke="#55c555" stroke-width="2"/>
  <text x="322" y="224" font-size="12" fill="#e8e8e8">중형 모델</text>

  <circle cx="453" cy="181" r="7" fill="#12261a" stroke="#55c555" stroke-width="2"/>
  <text x="465" y="175" font-size="12" fill="#e8e8e8">중형 + 자기검증 2회</text>

  <circle cx="562" cy="193" r="7" fill="#2a1414" stroke="#e05555" stroke-width="2"/>
  <text x="574" y="213" font-size="12" fill="#e05555">대형 기본 (열등)</text>

  <circle cx="752" cy="164" r="7" fill="#12261a" stroke="#55c555" stroke-width="2"/>
  <text x="752" y="150" font-size="12" fill="#e8e8e8" text-anchor="middle">대형 + 큰 추론 예산</text>

  <text x="62" y="406" font-size="13" fill="#e8e8e8">초록 선 위의 다섯이 파레토 프론티어다. 붉은 점은 더 싸면서 더 좋은 구성이 있으므로 고를 이유가 없다.</text>
</svg>
