<text x="440" y="386" text-anchor="middle" font-size="13" fill="#888">∇L = (2, 0.6). 공 위에서 ⟨∇L, Δ⟩ 가 가장 작은 점이 최급강하 방향이다</text>
<text x="440" y="408" text-anchor="middle" font-size="13" fill="#888">행렬에 스펙트럴 노름의 공을 쓰면 그 점이 −UVᵀ 이고, 그것이 Muon 의 갱신이다</text>
