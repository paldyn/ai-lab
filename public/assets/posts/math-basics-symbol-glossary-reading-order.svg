<svg xmlns="http://www.w3.org/2000/svg" width="880" height="604" viewBox="0 0 880 604" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="604" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">수식 한 줄을 왼쪽부터 소리 내어 읽기</text>
  <text x="60" y="82" font-size="13" fill="#888">읽지 못하는 기호가 하나라도 있으면 그 줄은 통째로 넘어가게 된다</text>

  <rect x="60" y="104" width="760" height="52" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="440" y="137" font-size="18" fill="#ffffff" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve">L(θ) = −(1/N) Σ log pθ(yᵢ | xᵢ)</text>

  <rect x="60" y="180" width="250" height="56" rx="6" fill="#101010" stroke="#3a4a6e" stroke-width="1"/>
  <text x="185" y="213" font-size="17" fill="#7ec8e3" text-anchor="middle">L(θ)</text>
  <text x="336" y="202" font-size="15" font-weight="600" fill="#e8e8e8">엘 세타</text>
  <text x="336" y="223" font-size="13" fill="#888">θ는 파라미터 전체를 한 글자로 부른 것</text>

  <rect x="60" y="244" width="250" height="56" rx="6" fill="#101010" stroke="#3a4a6e" stroke-width="1"/>
  <text x="185" y="277" font-size="17" fill="#7ec8e3" text-anchor="middle">−</text>
  <text x="336" y="266" font-size="15" font-weight="600" fill="#e8e8e8">마이너스</text>
  <text x="336" y="287" font-size="13" fill="#888">최대화를 최소화로 뒤집는 부호</text>

  <rect x="60" y="308" width="250" height="56" rx="6" fill="#101010" stroke="#3a4a6e" stroke-width="1"/>
  <text x="185" y="341" font-size="17" fill="#7ec8e3" text-anchor="middle">1/N</text>
  <text x="336" y="330" font-size="15" font-weight="600" fill="#e8e8e8">엔분의 일</text>
  <text x="336" y="351" font-size="13" fill="#888">표본 N개로 나눈 평균</text>

  <rect x="60" y="372" width="250" height="56" rx="6" fill="#101010" stroke="#3a4a6e" stroke-width="1"/>
  <text x="185" y="405" font-size="17" fill="#7ec8e3" text-anchor="middle">Σ (i = 1 … N)</text>
  <text x="336" y="394" font-size="15" font-weight="600" fill="#e8e8e8">시그마, 아이는 1부터 N까지</text>
  <text x="336" y="415" font-size="13" fill="#888">아래·위 첨자는 더하는 범위다</text>

  <rect x="60" y="436" width="250" height="56" rx="6" fill="#101010" stroke="#3a4a6e" stroke-width="1"/>
  <text x="185" y="469" font-size="17" fill="#7ec8e3" text-anchor="middle">log</text>
  <text x="336" y="458" font-size="15" font-weight="600" fill="#e8e8e8">로그</text>
  <text x="336" y="479" font-size="13" fill="#888">밑이 안 적혀 있으면 자연로그 ln</text>

  <rect x="60" y="500" width="250" height="56" rx="6" fill="#101010" stroke="#3a4a6e" stroke-width="1"/>
  <text x="185" y="533" font-size="17" fill="#7ec8e3" text-anchor="middle">pθ(y | x)</text>
  <text x="336" y="522" font-size="15" font-weight="600" fill="#e8e8e8">피 세타, 와이 기븐 엑스</text>
  <text x="336" y="543" font-size="13" fill="#888">세로줄은 나눗셈이 아니라 조건부</text>

  <text x="60" y="584" font-size="13" fill="#9aa4b8">여섯 조각을 이어 읽으면 「표본 N개에 대한 음의 로그가능도 평균」이 된다</text>
</svg>
