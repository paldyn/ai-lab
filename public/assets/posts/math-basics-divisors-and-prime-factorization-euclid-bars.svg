<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="500" rx="12" fill="#0a0a0a"/>

  <text x="60" y="52" font-size="22" font-weight="700" fill="#e8e8e8">120과 72에 유클리드 호제법 세 걸음</text>
  <text x="60" y="78" font-size="13" fill="#888">긴 막대를 짧은 막대로 재고, 남은 조각이 다음 걸음의 짧은 막대가 된다</text>

  <text x="140" y="130" font-size="16" font-weight="600" fill="#e8e8e8">① 120 = 72 × 1 + 48</text>
  <text x="740" y="130" font-size="13" fill="#888" text-anchor="end">남은 48로 72를 잰다</text>
  <rect x="140" y="144" width="360" height="44" rx="4" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="500" y="144" width="240" height="44" rx="4" fill="#7777cc" fill-opacity="0.3" stroke="#7777cc" stroke-width="1.5"/>
  <text x="320" y="172" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">72</text>
  <text x="620" y="172" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">48</text>

  <text x="140" y="240" font-size="16" font-weight="600" fill="#e8e8e8">② 72 = 48 × 1 + 24</text>
  <text x="740" y="240" font-size="13" fill="#888" text-anchor="end">남은 24로 48을 잰다</text>
  <rect x="140" y="254" width="240" height="44" rx="4" fill="#7ec8e3" fill-opacity="0.18" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="380" y="254" width="120" height="44" rx="4" fill="#7777cc" fill-opacity="0.3" stroke="#7777cc" stroke-width="1.5"/>
  <text x="260" y="282" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">48</text>
  <text x="440" y="282" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">24</text>

  <text x="140" y="350" font-size="16" font-weight="600" fill="#e8e8e8">③ 48 = 24 × 2 + 0</text>
  <text x="740" y="350" font-size="13" fill="#888" text-anchor="end">남는 조각이 없다</text>
  <rect x="140" y="364" width="120" height="44" rx="4" fill="#55c555" fill-opacity="0.2" stroke="#55c555" stroke-width="1.5"/>
  <rect x="260" y="364" width="120" height="44" rx="4" fill="#55c555" fill-opacity="0.2" stroke="#55c555" stroke-width="1.5"/>
  <text x="200" y="392" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">24</text>
  <text x="320" y="392" font-size="16" font-weight="700" fill="#e8e8e8" text-anchor="middle">24</text>

  <rect x="140" y="432" width="600" height="44" rx="6" fill="#101010" stroke="#55c555" stroke-width="1.5"/>
  <text x="440" y="459" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">나머지가 0이 된 걸음의 나누는 수 24가 최대공약수다</text>
</svg>
