<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600">
  <defs>
    <style>
      text { font-family: 'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif; }
      .level-name { font-size: 18px; font-weight: 700; fill: #e8e8e8; }
      .level-en { font-size: 12px; font-weight: 600; fill: #aaaaaa; letter-spacing: 0.1em; }
      .level-desc { font-size: 13px; fill: #aaaaaa; }
      .example { font-size: 12px; font-weight: 600; fill: #e8e8e8; }
    </style>
  </defs>

  <rect width="880" height="600" fill="#0a0a0a" rx="12"/>

  <text x="60" y="52" font-size="22" font-weight="700" fill="#e8e8e8">AI · ML · DL · LLM 포함 관계</text>
  <text x="60" y="80" font-size="15" fill="#888888">LLM ⊂ DL ⊂ ML ⊂ AI — 역은 성립하지 않습니다</text>

  <!-- AI -->
  <rect x="60" y="108" width="760" height="432" rx="10" fill="#0d1014" stroke="#555555" stroke-width="1.5"/>
  <text x="84" y="142" class="level-name">AI</text>
  <text x="120" y="142" class="level-en">ARTIFICIAL INTELLIGENCE</text>
  <text x="84" y="166" class="level-desc">기계가 스스로 판단하고 행동하도록 만드는 연구 분야 전체</text>

  <!-- ML -->
  <rect x="100" y="180" width="680" height="342" rx="9" fill="#0e1419" stroke="#667788" stroke-width="1.5"/>
  <text x="124" y="214" class="level-name">ML</text>
  <text x="164" y="214" class="level-en">MACHINE LEARNING</text>
  <text x="124" y="238" class="level-desc">데이터에서 패턴을 스스로 학습하는 방법론</text>

  <!-- DL -->
  <rect x="140" y="252" width="600" height="252" rx="9" fill="#101722" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="164" y="286" class="level-name">DL</text>
  <text x="200" y="286" class="level-en">DEEP LEARNING</text>
  <text x="164" y="310" class="level-desc">다층 신경망 구조로 특징까지 스스로 학습하는 ML의 하위 기술</text>

  <!-- LLM -->
  <rect x="180" y="324" width="520" height="162" rx="9" fill="#151426" stroke="#a79dff" stroke-width="1.5"/>
  <text x="204" y="358" class="level-name">LLM</text>
  <text x="254" y="358" class="level-en">LARGE LANGUAGE MODEL</text>
  <text x="204" y="382" class="level-desc">방대한 텍스트로 학습한 언어 특화 초대형 딥러닝 모델</text>

  <text x="204" y="430" font-size="13" font-weight="600" fill="#aaaaaa">예시</text>
  <rect x="250" y="404" width="70" height="40" rx="8" fill="#1d1c34" stroke="#7777cc" stroke-width="1"/>
  <text x="285" y="429" class="example" text-anchor="middle">GPT-4o</text>
  <rect x="330" y="404" width="70" height="40" rx="8" fill="#1d1c34" stroke="#7777cc" stroke-width="1"/>
  <text x="365" y="429" class="example" text-anchor="middle">Claude</text>
  <rect x="410" y="404" width="70" height="40" rx="8" fill="#1d1c34" stroke="#7777cc" stroke-width="1"/>
  <text x="445" y="429" class="example" text-anchor="middle">Gemini</text>
  <rect x="490" y="404" width="70" height="40" rx="8" fill="#1d1c34" stroke="#7777cc" stroke-width="1"/>
  <text x="525" y="429" class="example" text-anchor="middle">Llama</text>
  <rect x="570" y="404" width="70" height="40" rx="8" fill="#1d1c34" stroke="#7777cc" stroke-width="1"/>
  <text x="605" y="429" class="example" text-anchor="middle">Mistral</text>
</svg>
