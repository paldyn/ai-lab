<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="pjT" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e8e8e8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">nn.Linear(768, 64) 한 줄이 하는 일</text>

  <text x="127" y="98" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">토큰 벡터</text>
  <rect x="100" y="116" width="54" height="200" rx="6" fill="#101820" stroke="#7ec8e3" stroke-width="2"/>
  <text x="127" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#7ec8e3">x</text>
  <text x="127" y="340" text-anchor="middle" font-size="13" fill="#888">768개 성분</text>

  <line x1="180" y1="216" x2="290" y2="216" stroke="#e8e8e8" stroke-width="2.5" marker-end="url(#pjT)"/>

  <text x="420" y="98" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">선형사상 하나</text>
  <rect x="312" y="146" width="216" height="140" rx="8" fill="#0f1a10" stroke="#55c555" stroke-width="2"/>
  <text x="420" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e8e8">W_Q</text>
  <text x="420" y="220" text-anchor="middle" font-size="13" fill="#55c555">64행 × 768열</text>
  <text x="420" y="248" text-anchor="middle" font-size="13" fill="#9aa4b8">열마다 e_i 가 간 자리</text>
  <text x="420" y="272" text-anchor="middle" font-size="13" fill="#9aa4b8">768개가 적혀 있다</text>

  <line x1="554" y1="216" x2="664" y2="216" stroke="#e8e8e8" stroke-width="2.5" marker-end="url(#pjT)"/>

  <text x="713" y="98" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">질의 벡터</text>
  <rect x="686" y="182" width="54" height="68" rx="6" fill="#101820" stroke="#7777cc" stroke-width="2"/>
  <text x="713" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#7777cc">q</text>
  <text x="713" y="340" text-anchor="middle" font-size="13" fill="#888">64개 성분</text>

  <rect x="60" y="356" width="760" height="34" rx="8" fill="#1a0d0d" stroke="#e05555" stroke-width="1.5"/>
  <text x="82" y="379" font-size="14" fill="#e8e8e8">되돌릴 수 없다 — 나온 것이 64차원이라 서로 다른 x 가 같은 q 로 가는 일이 반드시 생긴다.</text>
</svg>
