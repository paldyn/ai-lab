<text x="440" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">폭이 커질 때 학습이 갈리는 네 갈래</text>
<text x="440" y="66" text-anchor="middle" font-size="13" fill="#888">위에서부터 묻고 처음 「예」가 나온 곳에서 멈춘다</text>
