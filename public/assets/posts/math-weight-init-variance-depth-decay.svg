<text x="60" y="396" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">한 층의 이득이 g 이면 L 층 뒤의 값은 g^(L/2) 배다. g 가 1 에서 조금만 벗어나도 깊이가 그 오차를 거듭제곱한다.</text>
<text x="60" y="418" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">Xavier 를 ReLU 에 쓰면 g = 1/2 이라 층마다 √2 씩 줄어든다 — 50 층이면 2⁻²⁵ 이다.</text>
