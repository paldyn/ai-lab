<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 14 14" refX="13" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 14 14" refX="13" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">문구를 프롬프트가 쥐면 무엇이 나갔는지 남지 않는다</text>
  <text x="60" y="72" font-size="13" fill="#888">모델은 판정과 근거 추출까지만 하고, 사용자에게 보이는 문장은 애플리케이션 층에서 만든다.</text>

  <text x="60" y="102" font-size="13" font-weight="600" fill="#e05555">프롬프트가 문구를 쥔 경우</text>

  <rect x="60" y="114" width="160" height="70" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="140" y="143" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">거절 판정</text>
  <text x="140" y="163" font-size="12" fill="#888" text-anchor="middle">두 길의 출발점</text>

  <rect x="260" y="114" width="160" height="70" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="340" y="143" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">프롬프트 속 문구</text>
  <text x="340" y="163" font-size="12" fill="#888" text-anchor="middle">문장이 박혀 있다</text>

  <rect x="460" y="114" width="160" height="70" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="540" y="143" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">모델이 쓴 문장</text>
  <text x="540" y="163" font-size="12" fill="#888" text-anchor="middle">매번 조금씩 다르다</text>

  <rect x="660" y="114" width="160" height="70" rx="8" fill="#2e1414" stroke="#e05555" stroke-width="1.5"/>
  <text x="740" y="143" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">화면</text>
  <text x="740" y="163" font-size="12" fill="#888" text-anchor="middle">사용자가 읽는다</text>

  <line x1="220" y1="149" x2="260" y2="149" stroke="#e05555" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="420" y1="149" x2="460" y2="149" stroke="#e05555" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="620" y1="149" x2="660" y2="149" stroke="#e05555" stroke-width="2" marker-end="url(#arr-red)"/>

  <text x="340" y="208" font-size="12" fill="#888" text-anchor="middle">한 글자 바꿔도 배포</text>
  <text x="540" y="208" font-size="12" fill="#888" text-anchor="middle">없는 정책을 지어낸다</text>
  <text x="740" y="208" font-size="12" fill="#888" text-anchor="middle">기록이 안 남는다</text>

  <line x1="60" y1="240" x2="820" y2="240" stroke="#2a2a2a" stroke-width="1"/>

  <text x="60" y="274" font-size="13" font-weight="600" fill="#55c555">코드가 문구를 쥔 경우</text>

  <rect x="60" y="286" width="160" height="70" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="140" y="315" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">거절 판정</text>
  <text x="140" y="335" font-size="12" fill="#888" text-anchor="middle">두 길의 출발점</text>

  <rect x="260" y="286" width="160" height="70" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="340" y="315" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">사유 코드</text>
  <text x="340" y="335" font-size="12" fill="#888" text-anchor="middle">시스템이 정한다</text>

  <rect x="460" y="286" width="160" height="70" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="540" y="315" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">문구 템플릿</text>
  <text x="540" y="335" font-size="12" fill="#888" text-anchor="middle">코드가 쥔다</text>

  <rect x="660" y="286" width="160" height="70" rx="8" fill="#16301a" stroke="#55c555" stroke-width="1.5"/>
  <text x="740" y="315" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">화면</text>
  <text x="740" y="335" font-size="12" fill="#888" text-anchor="middle">같은 문장이 나간다</text>

  <line x1="220" y1="321" x2="260" y2="321" stroke="#55c555" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="420" y1="321" x2="460" y2="321" stroke="#55c555" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="620" y1="321" x2="660" y2="321" stroke="#55c555" stroke-width="2" marker-end="url(#arr-green)"/>

  <text x="340" y="380" font-size="12" fill="#888" text-anchor="middle">점수·임계값과 함께 남는다</text>
  <text x="540" y="380" font-size="12" fill="#888" text-anchor="middle">값만 모델이 채운다</text>
  <text x="740" y="380" font-size="12" fill="#888" text-anchor="middle">언어별로 다시 쓴다</text>

  <text x="60" y="416" font-size="13" fill="#888">값을 모델이 뽑는 예외에서도 문장 틀은 코드가 쥔다 — 길이를 제한하고 정해진 형태만 받는다.</text>
</svg>
