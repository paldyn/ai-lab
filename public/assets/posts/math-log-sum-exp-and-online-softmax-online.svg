<svg xmlns="http://www.w3.org/2000/svg" width="880" height="556" viewBox="0 0 880 556">
<rect width="880" height="556" rx="12" fill="#0a0a0a"/>
<text x="440" y="42" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">부분합 둘을 이어 붙이는 법</text>
<text x="440" y="68" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">각 블록이 들고 가는 것은 (m, ℓ, õ) 셋뿐이다</text>
<defs><marker id="a4" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker></defs>
<rect x="70" y="120" width="320" height="132" rx="8" fill="#000000" stroke="#7777cc" stroke-width="1.5"/>
<text x="230" y="150" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">블록 1   x = (800, 799)</text>
<text x="230" y="182" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#7777cc" text-anchor="middle">m₁ = 800</text>
<text x="230" y="208" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">ℓ₁ = 1 + e⁻¹ = 1.367879</text>
<text x="230" y="234" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">õ₁ = Σ e^(x−m₁) v</text>
<rect x="490" y="120" width="320" height="132" rx="8" fill="#000000" stroke="#7777cc" stroke-width="1.5"/>
<text x="650" y="150" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">블록 2   x = (795)</text>
<text x="650" y="182" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#7777cc" text-anchor="middle">m₂ = 795</text>
<text x="650" y="208" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">ℓ₂ = 1.000000</text>
<text x="650" y="234" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">õ₂ = Σ e^(x−m₂) v</text>
<path d="M 230 252 L 230 288 L 440 288 L 440 314" stroke="#7ec8e3" stroke-width="2.5" fill="none" marker-end="url(#a4)"/>
<path d="M 650 252 L 650 288 L 440 288" stroke="#7ec8e3" stroke-width="2.5" fill="none"/>
<rect x="180" y="316" width="520" height="152" rx="8" fill="#000000" stroke="#55c555" stroke-width="1.5"/>
<text x="440" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555" font-weight="600" text-anchor="middle">m = max(m₁, m₂) = 800</text>
<text x="440" y="378" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">ℓ = e^(m₁−m) ℓ₁ + e^(m₂−m) ℓ₂ = 1.374617</text>
<text x="440" y="408" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">õ = e^(m₁−m) õ₁ + e^(m₂−m) õ₂</text>
<text x="440" y="440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle">출력은 마지막에 한 번 나눈다 —  o = õ ⁄ ℓ</text>
<text x="440" y="504" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">한 번에 계산한 값과 소수점 열여섯째 자리까지 같다 — 근사가 아니라 같은 수다</text>
<text x="440" y="528" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">블록을 몇 개로 쪼개든, 어떤 순서로 합치든 결과가 바뀌지 않는다</text>
</svg>
