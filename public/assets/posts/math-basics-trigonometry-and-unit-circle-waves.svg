<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="480" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="wvAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="wvL" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="wvLs" viewBox="0 0 14 14" refX="2" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 14 0 L 1 7 L 14 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">원을 한 바퀴 돌리면 물결 하나가 그려진다</text>
  <text x="60" y="74" font-size="13" fill="#888">한 바퀴가 끝나면 같은 자리로 돌아오므로 같은 모양이 되풀이된다</text>

  <line x1="130" y1="250" x2="762" y2="250" stroke="#888" stroke-width="1.5" marker-end="url(#wvAx)"/>
  <line x1="160" y1="340" x2="160" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#wvAx)"/>
  <text x="768" y="268" font-size="13" fill="#888">x</text>
  <text x="166" y="164" font-size="13" fill="#888">y</text>

  <line x1="154" y1="180" x2="166" y2="180" stroke="#444" stroke-width="1.5"/>
  <line x1="154" y1="320" x2="166" y2="320" stroke="#444" stroke-width="1.5"/>
  <text x="148" y="184" font-size="12" fill="#888" text-anchor="end">1</text>
  <text x="148" y="324" font-size="12" fill="#888" text-anchor="end">−1</text>

  <line x1="300" y1="244" x2="300" y2="256" stroke="#888" stroke-width="1.5"/>
  <line x1="440" y1="244" x2="440" y2="256" stroke="#888" stroke-width="1.5"/>
  <line x1="580" y1="244" x2="580" y2="256" stroke="#888" stroke-width="1.5"/>
  <line x1="720" y1="244" x2="720" y2="256" stroke="#888" stroke-width="1.5"/>

  <polyline points="160,250 195,223.2 230,200.5 265,185.3 300,180 335,185.3 370,200.5 405,223.2 440,250 475,276.8 510,299.5 545,314.7 580,320 615,314.7 650,299.5 685,276.8 720,250" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <polyline points="160,180 195,185.3 230,200.5 265,223.2 300,250 335,276.8 370,299.5 405,314.7 440,320 475,314.7 510,299.5 545,276.8 580,250 615,223.2 650,200.5 685,185.3 720,180" fill="none" stroke="#7777cc" stroke-width="2.5"/>

  <rect x="282" y="259" width="36" height="18" fill="#0a0a0a"/>
  <text x="300" y="273" font-size="12" fill="#888" text-anchor="middle">π/2</text>
  <rect x="428" y="259" width="24" height="18" fill="#0a0a0a"/>
  <text x="440" y="273" font-size="12" fill="#888" text-anchor="middle">π</text>
  <rect x="558" y="259" width="44" height="18" fill="#0a0a0a"/>
  <text x="580" y="273" font-size="12" fill="#888" text-anchor="middle">3π/2</text>
  <rect x="702" y="259" width="36" height="18" fill="#0a0a0a"/>
  <text x="720" y="273" font-size="12" fill="#888" text-anchor="middle">2π</text>

  <text x="732" y="232" font-size="14" fill="#7ec8e3">y = sin x</text>
  <text x="732" y="176" font-size="14" fill="#7777cc">y = cos x</text>

  <line x1="160" y1="368" x2="720" y2="368" stroke="#888" stroke-width="2" marker-start="url(#wvLs)" marker-end="url(#wvL)"/>
  <text x="440" y="392" font-size="13" fill="#888" text-anchor="middle">주기 2π</text>

  <rect x="60" y="414" width="760" height="44" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="442" font-size="13" fill="#e8e8e8">cos 는 sin 을 왼쪽으로 π/2 옮긴 것이다 — 두 물결은 모양이 같고 출발 자리만 다르다.</text>
</svg>
