<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arr2" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="12" fill="#0a0a0a"/>
  <g font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
    <text x="60" y="52" font-size="22" font-weight="700" fill="#e8e8e8">부모-자식 청킹: 찾는 단위와 넘기는 단위</text>

    <!-- 질문 -->
    <rect x="60" y="96" width="200" height="60" rx="8" fill="#111" stroke="#7777cc" stroke-width="1.5"/>
    <text x="160" y="120" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">질문</text>
    <text x="160" y="140" font-size="13" fill="#888" text-anchor="middle">「3년 근속 연차는?」</text>

    <!-- 벡터 DB: 자식 -->
    <rect x="340" y="80" width="480" height="92" rx="8" fill="#111" stroke="#7ec8e3" stroke-width="1.5"/>
    <text x="364" y="104" font-size="15" font-weight="600" fill="#e8e8e8">벡터 DB · 자식 조각 300자</text>
    <rect x="364" y="120" width="96" height="36" rx="5" fill="#0a0a0a" stroke="#555" stroke-width="1"/>
    <text x="412" y="143" font-size="13" fill="#888" text-anchor="middle">자식 1</text>
    <rect x="474" y="120" width="96" height="36" rx="5" fill="#16303a" stroke="#7ec8e3" stroke-width="2"/>
    <text x="522" y="143" font-size="13" fill="#e8e8e8" text-anchor="middle">자식 2</text>
    <rect x="584" y="120" width="96" height="36" rx="5" fill="#0a0a0a" stroke="#555" stroke-width="1"/>
    <text x="632" y="143" font-size="13" fill="#888" text-anchor="middle">자식 3</text>
    <rect x="694" y="120" width="102" height="36" rx="5" fill="#0a0a0a" stroke="#555" stroke-width="1"/>
    <text x="745" y="143" font-size="13" fill="#888" text-anchor="middle">… 자식 7</text>

    <line x1="260" y1="126" x2="340" y2="126" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
    <text x="300" y="112" font-size="13" fill="#7ec8e3" text-anchor="middle">① 검색</text>

    <!-- 문서 저장소: 부모 -->
    <rect x="340" y="232" width="480" height="92" rx="8" fill="#111" stroke="#55c555" stroke-width="1.5"/>
    <text x="364" y="256" font-size="15" font-weight="600" fill="#e8e8e8">문서 저장소 · 부모 조각 2,000자</text>
    <rect x="364" y="272" width="432" height="36" rx="5" fill="#15301a" stroke="#55c555" stroke-width="2"/>
    <text x="580" y="295" font-size="13" fill="#e8e8e8" text-anchor="middle">부모 A = 자식 1 ~ 자식 7을 품은 원문 한 덩어리</text>

    <line x1="522" y1="156" x2="522" y2="232" stroke="#888" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="536" y="210" font-size="13" fill="#888">② 자식 2의 부모 id로 찾기</text>

    <!-- LLM -->
    <rect x="60" y="250" width="200" height="60" rx="8" fill="#111" stroke="#55c555" stroke-width="1.5"/>
    <text x="160" y="274" font-size="15" font-weight="600" fill="#e8e8e8">LLM 프롬프트</text>
    <text x="160" y="294" font-size="13" fill="#888" text-anchor="middle">부모 A 2,000자</text>

    <line x1="340" y1="280" x2="260" y2="280" stroke="#55c555" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="300" y="266" font-size="13" fill="#55c555" text-anchor="middle">③ 반환</text>

    <text x="60" y="372" font-size="13" fill="#888">자식은 질문과 겨루는 데만 쓰고, 모델이 읽는 것은 자식을 둘러싼 부모 전체다.</text>
    <text x="60" y="394" font-size="13" fill="#888">자식 300자 다섯 개 = 1,500자, 부모 2,000자 다섯 개 = 최대 10,000자.</text>
  </g>
</svg>
