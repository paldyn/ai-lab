<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="352" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="wg-blue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">첫 방문과 두 번째 방문이 전혀 다르다</text>
  <text x="62" y="72" font-size="13" fill="#888">첫 방문은 내려받기와 셰이더 컴파일을 다 치른다. 두 번째부터는 캐시에서 꺼내 쓴다.</text>

  <text x="62" y="108" font-size="16" font-weight="600" fill="#e8e8e8">첫 방문</text>

  <rect x="62" y="124" width="176" height="68" rx="6" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="150" y="148" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">가중치 내려받기</text>
  <text x="150" y="168" font-size="11" fill="#aaaaaa" text-anchor="middle">1~4GB</text>
  <text x="150" y="184" font-size="11" fill="#e05555" text-anchor="middle">회선에 따라 수십 초</text>
  <rect x="62" y="124" width="176" height="68" rx="6" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.16;0.16;0;0" keyTimes="0;0.03;0.3;0.34;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <line x1="238" y1="158" x2="306" y2="158" stroke="#7ec8e3" stroke-width="2" marker-end="url(#wg-blue)"/>

  <rect x="312" y="124" width="176" height="68" rx="6" fill="#101418" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="400" y="148" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">캐시에 저장</text>
  <text x="400" y="168" font-size="11" fill="#aaaaaa" text-anchor="middle">Cache API · OPFS</text>
  <text x="400" y="184" font-size="11" fill="#aaaaaa" text-anchor="middle">1~3초</text>
  <rect x="312" y="124" width="176" height="68" rx="6" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.16;0.16;0;0" keyTimes="0;0.36;0.4;0.56;0.6;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <line x1="488" y1="158" x2="556" y2="158" stroke="#7ec8e3" stroke-width="2" marker-end="url(#wg-blue)"/>

  <rect x="562" y="124" width="176" height="68" rx="6" fill="#2a2414" stroke="#c8a33e" stroke-width="1.5"/>
  <text x="650" y="148" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">셰이더 컴파일</text>
  <text x="650" y="168" font-size="11" fill="#aaaaaa" text-anchor="middle">GPU 커널을 만든다</text>
  <text x="650" y="184" font-size="11" fill="#c8a33e" text-anchor="middle">5~20초</text>
  <rect x="562" y="124" width="176" height="68" rx="6" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.16;0.16;0" keyTimes="0;0.62;0.66;0.94;0.98" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="758" y="152" font-size="13" font-weight="600" fill="#e05555">합쳐서</text>
  <text x="758" y="172" font-size="13" font-weight="600" fill="#e05555">1분 안팎</text>

  <text x="62" y="240" font-size="16" font-weight="600" fill="#e8e8e8">두 번째 방문</text>

  <rect x="62" y="256" width="176" height="52" rx="6" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="150" y="278" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">캐시에서 읽기</text>
  <text x="150" y="296" font-size="11" fill="#55c555" text-anchor="middle">내려받기 없음</text>

  <line x1="238" y1="282" x2="306" y2="282" stroke="#7ec8e3" stroke-width="2" marker-end="url(#wg-blue)"/>

  <rect x="312" y="256" width="176" height="52" rx="6" fill="#1a2a1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="400" y="278" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">GPU에 올리기</text>
  <text x="400" y="296" font-size="11" fill="#55c555" text-anchor="middle">2~5초</text>

  <text x="524" y="288" font-size="13" font-weight="600" fill="#55c555">셰이더 캐시가 살아 있으면 컴파일을 건너뛴다</text>

  <text x="62" y="338" font-size="12" fill="#888">첫 방문의 1분을 사용자가 어떻게 보내게 할지가 이 기술을 쓸 수 있느냐를 거의 결정한다.</text>
</svg>
