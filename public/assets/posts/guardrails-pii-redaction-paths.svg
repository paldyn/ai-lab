<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="piiArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#8a8a8a"/>
    </marker>
    <marker id="piiArrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">입구에서 한 번 지우면 뒤의 모든 저장소가 깨끗해진다</text>

  <rect x="60" y="120" width="80" height="60" rx="8" fill="#1c1010" stroke="#e05555" stroke-width="1.5"/>
  <text x="100" y="156" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">원문</text>

  <rect x="190" y="120" width="140" height="60" rx="8" fill="#101c10" stroke="#55c555" stroke-width="1.5"/>
  <text x="260" y="144" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">치환</text>
  <text x="260" y="164" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">이름을 자리표로</text>

  <rect x="380" y="120" width="100" height="60" rx="8" fill="#12161c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="430" y="156" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">모델</text>

  <rect x="530" y="120" width="140" height="60" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="600" y="144" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">복원</text>
  <text x="600" y="164" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">메모리 안에서만</text>

  <rect x="720" y="120" width="100" height="60" rx="8" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="770" y="156" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">사용자</text>

  <line x1="140" y1="150" x2="190" y2="150" stroke="#e05555" stroke-width="1.5" marker-end="url(#piiArr)"/>
  <line x1="330" y1="150" x2="380" y2="150" stroke="#55c555" stroke-width="1.5" marker-end="url(#piiArrG)"/>
  <line x1="480" y1="150" x2="530" y2="150" stroke="#55c555" stroke-width="1.5" marker-end="url(#piiArrG)"/>
  <line x1="670" y1="150" x2="720" y2="150" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#piiArr)"/>

  <rect x="190" y="250" width="520" height="100" rx="8" fill="#0d120d" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="210" y="274" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">여기부터 뒤로는 자리표만 흐른다</text>

  <rect x="210" y="286" width="140" height="46" rx="6" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="280" y="315" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">앱 로그</text>

  <rect x="370" y="286" width="150" height="46" rx="6" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="445" y="315" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">트레이스 · 프롬프트 캐시</text>

  <rect x="540" y="286" width="150" height="46" rx="6" fill="#12161c" stroke="#555555" stroke-width="1.5"/>
  <text x="615" y="315" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">분석 · 학습 데이터</text>

  <line x1="260" y1="180" x2="260" y2="250" stroke="#55c555" stroke-width="1.5" marker-end="url(#piiArrG)"/>
  <line x1="430" y1="180" x2="430" y2="250" stroke="#55c555" stroke-width="1.5" marker-end="url(#piiArrG)"/>

  <text x="60" y="392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">출력에서만 지우면 왼쪽 붉은 구간의 원문이 이미 로그와 트레이스에 복사된 뒤다.</text>
