<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="480" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">에이전트 한 번 도는 것을 어떻게 남기는가</text>
  <text x="60" y="72" font-size="13" fill="#888">작업 하나가 트레이스 하나, 걸음마다 구간 하나, 그 안에 모델 호출과 도구 호출이 들어간다.</text>

  <line x1="280" y1="104" x2="820" y2="104" stroke="#2a2a2a" stroke-width="1"/>
  <text x="820" y="98" font-size="12" fill="#888" text-anchor="end">시간 →</text>

  <text x="60" y="135" font-size="12.5" fill="#e8e8e8">작업 (트레이스)</text>
  <rect x="280" y="118" width="540" height="24" rx="4" fill="#16202c" stroke="#7ec8e3" stroke-width="1.5"/>

  <text x="78" y="167" font-size="12.5" fill="#e8e8e8">걸음 1</text>
  <rect x="280" y="150" width="160" height="24" rx="4" fill="#101820" stroke="#4a6a86" stroke-width="1"/>
  <text x="96" y="199" font-size="12.5" fill="#888">모델 호출</text>
  <rect x="288" y="182" width="70" height="24" rx="4" fill="#1f3a5f" stroke="#7ec8e3" stroke-width="1"/>
  <text x="96" y="231" font-size="12.5" fill="#888">도구 search</text>
  <rect x="368" y="214" width="62" height="24" rx="4" fill="#2a2450" stroke="#7777cc" stroke-width="1"/>

  <text x="78" y="263" font-size="12.5" fill="#e8e8e8">걸음 2</text>
  <rect x="450" y="246" width="190" height="24" rx="4" fill="#101820" stroke="#4a6a86" stroke-width="1"/>
  <text x="96" y="295" font-size="12.5" fill="#888">모델 호출</text>
  <rect x="458" y="278" width="80" height="24" rx="4" fill="#1f3a5f" stroke="#7ec8e3" stroke-width="1"/>
  <text x="96" y="327" font-size="12.5" fill="#888">도구 write</text>
  <rect x="548" y="310" width="84" height="24" rx="4" fill="#4a1f1f" stroke="#e05555" stroke-width="1.5"/>
  <text x="644" y="327" font-size="12" fill="#e05555">타임아웃</text>

  <text x="78" y="359" font-size="12.5" fill="#e8e8e8">걸음 3</text>
  <rect x="650" y="342" width="170" height="24" rx="4" fill="#101820" stroke="#4a6a86" stroke-width="1"/>
  <text x="96" y="391" font-size="12.5" fill="#888">도구 write</text>
  <rect x="660" y="374" width="90" height="24" rx="4" fill="#1a3d1a" stroke="#55c555" stroke-width="1.5"/>
  <text x="762" y="391" font-size="12" fill="#55c555">재시도 성공</text>

  <rect x="60" y="422" width="14" height="14" rx="3" fill="#1f3a5f" stroke="#7ec8e3" stroke-width="1"/>
  <text x="82" y="434" font-size="12" fill="#888">모델 호출</text>
  <rect x="170" y="422" width="14" height="14" rx="3" fill="#2a2450" stroke="#7777cc" stroke-width="1"/>
  <text x="192" y="434" font-size="12" fill="#888">도구 호출</text>
  <rect x="280" y="422" width="14" height="14" rx="3" fill="#4a1f1f" stroke="#e05555" stroke-width="1"/>
  <text x="302" y="434" font-size="12" fill="#888">실패</text>

  <text x="60" y="464" font-size="13" fill="#7ec8e3">이 그림에서 「어디가 느렸나」는 눈으로 보인다. 「왜 그랬나」는 구간마다 입출력을 붙여야 보인다.</text>
</svg>
