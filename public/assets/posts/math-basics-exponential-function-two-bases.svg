<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="expAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">밑이 1보다 크면 오르고, 1보다 작으면 내린다</text>
  <text x="60" y="74" font-size="13" fill="#888">두 곡선은 y 축을 거울로 서로를 비춘 모습이다</text>

  <line x1="230" y1="350" x2="660" y2="350" stroke="#888" stroke-width="1.5" marker-end="url(#expAx)"/>
  <line x1="440" y1="380" x2="440" y2="100" stroke="#888" stroke-width="1.5" marker-end="url(#expAx)"/>
  <text x="666" y="354" font-size="13" fill="#888">x</text>
  <text x="446" y="104" font-size="13" fill="#888">y</text>

  <line x1="260" y1="344" x2="260" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="320" y1="344" x2="320" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="380" y1="344" x2="380" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="500" y1="344" x2="500" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="560" y1="344" x2="560" y2="356" stroke="#888" stroke-width="1.5"/>
  <line x1="620" y1="344" x2="620" y2="356" stroke="#888" stroke-width="1.5"/>
  <text x="260" y="370" font-size="12" fill="#888" text-anchor="middle">−3</text>
  <text x="320" y="370" font-size="12" fill="#888" text-anchor="middle">−2</text>
  <text x="380" y="370" font-size="12" fill="#888" text-anchor="middle">−1</text>
  <text x="500" y="370" font-size="12" fill="#888" text-anchor="middle">1</text>
  <text x="560" y="370" font-size="12" fill="#888" text-anchor="middle">2</text>
  <text x="620" y="370" font-size="12" fill="#888" text-anchor="middle">3</text>

  <line x1="434" y1="290" x2="446" y2="290" stroke="#444" stroke-width="1.5"/>
  <line x1="434" y1="230" x2="446" y2="230" stroke="#444" stroke-width="1.5"/>
  <line x1="434" y1="110" x2="446" y2="110" stroke="#444" stroke-width="1.5"/>
  <text x="428" y="294" font-size="12" fill="#888" text-anchor="end">2</text>
  <text x="428" y="234" font-size="12" fill="#888" text-anchor="end">4</text>
  <text x="428" y="114" font-size="12" fill="#888" text-anchor="end">8</text>

  <polyline points="260,346.3 320,342.5 380,335 440,320 470,307.6 500,290 530,265.2 560,230 590,180.3 620,110" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <polyline points="260,110 290,180.3 320,230 350,265.2 380,290 410,307.6 440,320 500,335 560,342.5 620,346.3" fill="none" stroke="#7777cc" stroke-width="2.5"/>

  <circle cx="440" cy="320" r="5" fill="#e8e8e8"/>
  <rect x="448" y="324" width="62" height="18" fill="#0a0a0a"/>
  <text x="452" y="338" font-size="13" fill="#e8e8e8">(0, 1)</text>

  <text x="628" y="128" font-size="14" fill="#7ec8e3">y = 2ˣ</text>
  <text x="252" y="128" font-size="14" fill="#7777cc" text-anchor="end">y = (1/2)ˣ</text>
  <text x="252" y="148" font-size="12" fill="#888" text-anchor="end">= 2⁻ˣ</text>

  <text x="666" y="338" font-size="12" fill="#888">y = 0</text>

  <rect x="60" y="400" width="760" height="44" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="428" font-size="13" fill="#e8e8e8">값은 언제나 양수다 · 밑이 무엇이든 (0, 1)을 지난다 · x 축(y = 0)에 한없이 가까워지지만 닿지 않는다</text>
</svg>
