<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="360" fill="#0a0a0a" rx="12"/>
  <text x="60" y="46" fill="#e8e8e8" font-size="22" font-weight="700">가설검정 다섯 걸음</text>
  <text x="60" y="72" fill="#888" font-size="13">동전 20번 던져 앞면 15번이 나왔을 때 이 절차로 판정합니다</text>

  <defs>
    <marker id="arrp" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <!-- 5 boxes horizontal, each 140 wide 90 tall, y=140 -->
  <g>
    <rect x="60" y="120" width="140" height="150" fill="#111827" stroke="#3a4a6e" stroke-width="1" rx="8"/>
    <text x="130" y="146" fill="#7ec8e3" font-size="13" font-weight="700" text-anchor="middle">1. 가설 세우기</text>
    <text x="130" y="172" fill="#e8e8e8" font-size="12" text-anchor="middle">H₀: 공정하다</text>
    <text x="130" y="192" fill="#e8e8e8" font-size="12" text-anchor="middle">H₁: 편향되었다</text>
    <text x="130" y="226" fill="#888" font-size="11" text-anchor="middle">차이가 없다는</text>
    <text x="130" y="244" fill="#888" font-size="11" text-anchor="middle">쪽에서 시작</text>
  </g>

  <line x1="200" y1="195" x2="212" y2="195" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrp)"/>

  <g>
    <rect x="226" y="120" width="140" height="150" fill="#111827" stroke="#3a4a6e" stroke-width="1" rx="8"/>
    <text x="296" y="146" fill="#7ec8e3" font-size="13" font-weight="700" text-anchor="middle">2. α 정하기</text>
    <text x="296" y="176" fill="#e8e8e8" font-size="16" text-anchor="middle">α = 0.05</text>
    <text x="296" y="216" fill="#888" font-size="11" text-anchor="middle">얼마나 드물면</text>
    <text x="296" y="234" fill="#888" font-size="11" text-anchor="middle">우연이 아니라고</text>
    <text x="296" y="252" fill="#888" font-size="11" text-anchor="middle">할지 미리 정함</text>
  </g>

  <line x1="366" y1="195" x2="378" y2="195" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrp)"/>

  <g>
    <rect x="392" y="120" width="140" height="150" fill="#111827" stroke="#3a4a6e" stroke-width="1" rx="8"/>
    <text x="462" y="146" fill="#7ec8e3" font-size="13" font-weight="700" text-anchor="middle">3. 통계량</text>
    <text x="462" y="176" fill="#e8e8e8" font-size="14" text-anchor="middle">X = 앞면 개수</text>
    <text x="462" y="200" fill="#e8e8e8" font-size="16" text-anchor="middle">관측: 15</text>
    <text x="462" y="234" fill="#888" font-size="11" text-anchor="middle">가설이 참이라면</text>
    <text x="462" y="252" fill="#888" font-size="11" text-anchor="middle">분포를 안다</text>
  </g>

  <line x1="532" y1="195" x2="544" y2="195" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrp)"/>

  <g>
    <rect x="558" y="120" width="140" height="150" fill="#111827" stroke="#3a4a6e" stroke-width="1" rx="8"/>
    <text x="628" y="146" fill="#7ec8e3" font-size="13" font-weight="700" text-anchor="middle">4. p값 계산</text>
    <text x="628" y="176" fill="#e8e8e8" font-size="12" text-anchor="middle">P(X ≥ 15 | H₀)</text>
    <text x="628" y="204" fill="#e05555" font-size="16" font-weight="700" text-anchor="middle">≈ 0.021</text>
    <text x="628" y="238" fill="#888" font-size="11" text-anchor="middle">관측만큼 극단적인</text>
    <text x="628" y="256" fill="#888" font-size="11" text-anchor="middle">일이 날 확률</text>
  </g>

  <line x1="698" y1="195" x2="710" y2="195" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrp)"/>

  <g>
    <rect x="724" y="120" width="140" height="150" fill="#111827" stroke="#3a4a6e" stroke-width="1" rx="8"/>
    <text x="794" y="146" fill="#7ec8e3" font-size="13" font-weight="700" text-anchor="middle">5. 판정</text>
    <text x="794" y="176" fill="#e8e8e8" font-size="12" text-anchor="middle">0.021 &lt; 0.05</text>
    <text x="794" y="204" fill="#e05555" font-size="14" font-weight="700" text-anchor="middle">H₀ 기각</text>
    <text x="794" y="238" fill="#888" font-size="11" text-anchor="middle">p값이 α 미만이면</text>
    <text x="794" y="256" fill="#888" font-size="11" text-anchor="middle">귀무가설을 버림</text>
  </g>
</svg>
