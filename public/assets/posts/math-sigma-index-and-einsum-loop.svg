<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="340" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="same" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">Σ 는 for 루프를 한 글자로 줄인 것이다</text>
  <text x="60" y="82" font-size="13" fill="#888">밑에 적힌 것이 시작값, 위에 적힌 것이 끝값, 오른쪽이 루프 몸통이다</text>

  <text x="120" y="190" font-size="46" fill="#e8e8e8">Σ</text>
  <text x="112" y="228" font-size="16" fill="#7ec8e3">i = 1</text>
  <text x="122" y="146" font-size="16" fill="#e05555">n</text>
  <text x="185" y="190" font-size="24" fill="#e8e8e8">xᵢ</text>

  <path d="M 128 244 L 128 268 L 330 268" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#same)"/>
  <path d="M 128 132 L 128 112 L 330 112" fill="none" stroke="#e05555" stroke-width="2" marker-end="url(#same)"/>
  <path d="M 200 206 L 200 224 L 330 224" fill="none" stroke="#888" stroke-width="2" marker-end="url(#same)"/>

  <rect x="350" y="94" width="470" height="180" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="370" y="126" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#9aa4b8" xml:space="preserve"># 끝값</text>
  <text x="370" y="152" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#ffffff" xml:space="preserve">total = 0</text>
  <text x="370" y="178" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#ffffff" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">for</tspan> i <tspan fill="#7ec8e3" font-weight="600">in</tspan> range(<tspan fill="#b5cea8">1</tspan>, n + <tspan fill="#b5cea8">1</tspan>):</text>
  <text x="370" y="204" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#ffffff" xml:space="preserve">    total += x[i]</text>
  <text x="370" y="238" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" fill="#9aa4b8" xml:space="preserve"># 시작값 · 몸통</text>

  <text x="60" y="310" font-size="14" fill="#7777cc">루프 변수 i 는 밖으로 안 나온다. 첨자 가운데 어느 것이 이 i 이고 어느 것이 결과에 남는지가 다음 절의 이야기다</text>
</svg>
