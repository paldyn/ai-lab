<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="500" rx="12" fill="#0a0a0a"/>
  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">거리 하나와 각 하나로 나무의 높이를 잰다</text>
  <text x="60" y="74" font-size="13" fill="#888">떨어진 거리가 밑변, 나무가 높이인 직각삼각형 — 높이는 각의 맞은편이라 탄젠트를 쓴다</text>

  <line x1="80" y1="420" x2="800" y2="420" stroke="#888" stroke-width="1.5"/>
  <ellipse cx="640" cy="202.9" rx="46" ry="60" fill="#55c555" fill-opacity="0.18" stroke="#55c555" stroke-width="1.5"/>
  <line x1="640" y1="420" x2="640" y2="142.9" stroke="#55c555" stroke-width="3"/>
  <polyline points="624,420 624,404 640,404" fill="none" stroke="#888" stroke-width="1.5"/>

  <line x1="160" y1="420" x2="640" y2="420" stroke="#7ec8e3" stroke-width="4"/>
  <line x1="160" y1="420" x2="640" y2="142.9" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M 230 420 A 70 70 0 0 0 220.6 385.0" fill="none" stroke="#e05555" stroke-width="2"/>
  <text x="242" y="410" font-size="14" font-weight="600" fill="#e05555">30°</text>

  <circle cx="160" cy="420" r="5" fill="#e8e8e8"/>
  <text x="160" y="450" font-size="13" fill="#e8e8e8" text-anchor="middle">서 있는 자리</text>
  <circle cx="640" cy="142.9" r="5" fill="#e8e8e8"/>
  <text x="624" y="128.9" font-size="13" fill="#e8e8e8" text-anchor="end">꼭대기</text>
  <text x="400.0" y="450" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">밑변 20 m</text>
  <text x="370.0" y="257.4" font-size="13" fill="#888" text-anchor="middle">시선</text>

  <text x="704" y="270" font-size="14" font-weight="600" fill="#55c555">높이</text>
  <text x="704" y="296" font-size="14" fill="#e8e8e8">20 × tan 30°</text>
  <text x="704" y="322" font-size="14" fill="#e8e8e8">≈ 11.5 m</text>

  <text x="60" y="470" font-size="13" fill="#7777cc">tan 30° = 1/√3 ≈ 0.577 이므로 높이는 20의 약 0.577배다</text>
</svg>
