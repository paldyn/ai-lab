<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="hyb-a" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="hyb-b" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>

  <text x="60" y="42" font-size="22" font-weight="700" fill="#e8e8e8">전사 병행 절충 — 소리는 바로 나가고 글자는 기록에 남는다</text>

  <rect x="60" y="76" width="140" height="70" rx="8" fill="#111318" stroke="#3a4a6e" stroke-width="1"/>
  <text x="130" y="106" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">들어온 소리</text>
  <text x="130" y="126" font-size="11" fill="#9aa4b8" text-anchor="middle">사용자 발화</text>

  <rect x="260" y="76" width="200" height="70" rx="8" fill="#111318" stroke="#55c555" stroke-width="1"/>
  <text x="360" y="106" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">직결형 모델</text>
  <text x="360" y="126" font-size="11" fill="#9aa4b8" text-anchor="middle">소리 토큰과 전사를 함께 낸다</text>

  <rect x="660" y="76" width="160" height="70" rx="8" fill="#111318" stroke="#55c555" stroke-width="1"/>
  <text x="740" y="106" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">나가는 소리</text>
  <text x="740" y="126" font-size="11" fill="#9aa4b8" text-anchor="middle">사용자에게 바로</text>

  <rect x="660" y="186" width="160" height="70" rx="8" fill="#111318" stroke="#7777cc" stroke-width="1"/>
  <text x="740" y="216" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">전사 로그</text>
  <text x="740" y="236" font-size="11" fill="#9aa4b8" text-anchor="middle">사후 점검 · 원인 추적</text>

  <line x1="200" y1="111" x2="260" y2="111" stroke="#55c555" stroke-width="2" marker-end="url(#hyb-a)"/>
  <line x1="460" y1="111" x2="660" y2="111" stroke="#55c555" stroke-width="2" marker-end="url(#hyb-a)"/>
  <path d="M 360 146 L 360 221 L 660 221" fill="none" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#hyb-b)"/>
  <text x="380" y="186" font-size="13" fill="#7777cc">전사는 옆으로 빠진다</text>

  <text x="60" y="300" font-size="16" font-weight="600" fill="#e8e8e8">한 문장이 나가는 시간</text>

  <text x="60" y="336" font-size="13" fill="#9aa4b8">소리</text>
  <rect x="140" y="322" width="80" height="22" rx="4" fill="#55c555" opacity="0.8"/>
  <rect x="224" y="322" width="80" height="22" rx="4" fill="#55c555" opacity="0.8"/>
  <rect x="308" y="322" width="80" height="22" rx="4" fill="#55c555" opacity="0.8"/>
  <rect x="392" y="322" width="80" height="22" rx="4" fill="#55c555" opacity="0.8"/>

  <text x="60" y="376" font-size="13" fill="#9aa4b8">전사</text>
  <rect x="392" y="362" width="160" height="22" rx="4" fill="#7777cc" opacity="0.8"/>

  <line x1="560" y1="314" x2="560" y2="392" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="576" y="342" font-size="13" fill="#e05555">필터가 글자를 읽을 때면</text>
  <text x="576" y="362" font-size="13" fill="#e05555">소리는 이미 다 나갔다</text>

  <text x="60" y="418" font-size="13" fill="#888">막으려면 문장이 끝날 때까지 소리를 붙잡아야 하고, 그 순간 지연의 이점이 사라진다</text>
</svg>
