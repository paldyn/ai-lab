<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="480" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="crtAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">실수 계수 다항식의 허수 근은 가로축을 거울로 마주 본다</text>
  <text x="60" y="74" font-size="13" fill="#888">x³ − 3x² + 7x − 5 = (x − 1)(x² − 2x + 5) 의 세 근</text>

  <line x1="90" y1="270" x2="400" y2="270" stroke="#888" stroke-width="1.5" marker-end="url(#crtAx)"/>
  <line x1="200" y1="440" x2="200" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#crtAx)"/>
  <text x="408" y="274" font-size="13" fill="#888">실수부</text>
  <text x="208" y="114" font-size="13" fill="#888">허수부</text>

  <line x1="260" y1="266" x2="260" y2="274" stroke="#444" stroke-width="1.5"/>
  <line x1="320" y1="266" x2="320" y2="274" stroke="#444" stroke-width="1.5"/>
  <text x="320" y="292" font-size="12" fill="#888" text-anchor="middle">2</text>
  <line x1="196" y1="210" x2="204" y2="210" stroke="#444" stroke-width="1.5"/>
  <line x1="196" y1="150" x2="204" y2="150" stroke="#444" stroke-width="1.5"/>
  <line x1="196" y1="330" x2="204" y2="330" stroke="#444" stroke-width="1.5"/>
  <line x1="196" y1="390" x2="204" y2="390" stroke="#444" stroke-width="1.5"/>
  <text x="188" y="214" font-size="12" fill="#888" text-anchor="end">1</text>
  <text x="188" y="154" font-size="12" fill="#888" text-anchor="end">2</text>
  <text x="188" y="334" font-size="12" fill="#888" text-anchor="end">−1</text>
  <text x="188" y="394" font-size="12" fill="#888" text-anchor="end">−2</text>

  <line x1="260" y1="150" x2="260" y2="390" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>

  <circle cx="260" cy="150" r="5" fill="#7ec8e3"/>
  <text x="276" y="146" font-size="13" fill="#7ec8e3">1 + 2i</text>
  <circle cx="260" cy="390" r="5" fill="#7ec8e3"/>
  <text x="276" y="402" font-size="13" fill="#7ec8e3">1 − 2i</text>
  <circle cx="260" cy="270" r="5" fill="#55c555"/>
  <text x="274" y="258" font-size="13" fill="#55c555">1</text>

  <rect x="480" y="130" width="340" height="270" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="504" y="160" font-size="14" font-weight="600" fill="#e8e8e8">세 근이 서는 자리</text>
  <line x1="504" y1="174" x2="796" y2="174" stroke="#333" stroke-width="1"/>
  <text x="504" y="200" font-size="13" fill="#7ec8e3">1 ± 2i — 켤레쌍</text>
  <text x="504" y="222" font-size="13" fill="#888">x² − 2x + 5 = 0 의 두 근</text>
  <text x="504" y="244" font-size="13" fill="#888">허수부의 부호만 다르다</text>
  <line x1="504" y1="262" x2="796" y2="262" stroke="#333" stroke-width="1"/>
  <text x="504" y="288" font-size="13" fill="#55c555">1 — 짝이 없는 근</text>
  <text x="504" y="310" font-size="13" fill="#888">가로축 위에 선다, 곧 실수</text>
  <line x1="504" y1="328" x2="796" y2="328" stroke="#333" stroke-width="1"/>
  <text x="504" y="354" font-size="13" fill="#e8e8e8">z 가 근이면 z̄ 도 근이다</text>
  <text x="504" y="376" font-size="13" fill="#888">켤레가 곱셈과 덧셈을 통과하므로</text>
</svg>
