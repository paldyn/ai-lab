<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
  <rect width="880" height="380" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">Prompt Caching으로 컨텍스트 비용 절감</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">긴 문서를 캐시하고 반복 호출 비용 90% 절감</text>

  <!-- Code block -->
  <rect x="60" y="88" width="760" height="252" rx="6" fill="#000000" stroke="#3a4a6e"/>

  <text x="76" y="110" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># 긴 문서(계약서)를 한 번 캐시 → 여러 질문에 재사용</text>
  <text x="76" y="128" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">def</tspan><tspan fill="#ffffff"> qa_with_cache(document: </tspan><tspan fill="#7ec8e3">str</tspan><tspan fill="#ffffff">, questions: </tspan><tspan fill="#7ec8e3">list</tspan><tspan fill="#ffffff">[</tspan><tspan fill="#7ec8e3">str</tspan><tspan fill="#ffffff">]) -&gt; </tspan><tspan fill="#7ec8e3">list</tspan><tspan fill="#ffffff">:</tspan></text>

  <text x="76" y="146" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    answers = []</text>
  <text x="76" y="164" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">    for</tspan><tspan fill="#ffffff"> q in questions:</tspan></text>
  <text x="76" y="182" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">        resp = client.messages.create(</text>
  <text x="76" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">            model=</tspan><tspan fill="#ce9178">&quot;claude-opus-4-7&quot;</tspan><tspan fill="#ffffff">, max_tokens=</tspan><tspan fill="#b5cea8">512</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="76" y="218" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">            messages=[</text>
  <text x="76" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">              {</tspan><tspan fill="#ce9178">&quot;role&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;user&quot;</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">&quot;content&quot;</tspan><tspan fill="#ffffff">: [</tspan></text>
  <text x="76" y="254" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">                {</tspan><tspan fill="#ce9178">&quot;type&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;text&quot;</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">&quot;text&quot;</tspan><tspan fill="#ffffff">: document,</tspan></text>
  <text x="76" y="272" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#55c555">                 &quot;cache_control&quot;</tspan><tspan fill="#ffffff">: {</tspan><tspan fill="#ce9178">&quot;type&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;ephemeral&quot;</tspan><tspan fill="#ffffff">}},</tspan></text>
  <text x="76" y="290" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">                {</tspan><tspan fill="#ce9178">&quot;type&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;text&quot;</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">&quot;text&quot;</tspan><tspan fill="#ffffff">: q}]}])</tspan></text>
  <text x="76" y="308" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">        answers.append(resp.content[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">].text)</tspan></text>
  <text x="76" y="326" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">    return</tspan><tspan fill="#ffffff"> answers</tspan></text>

  <!-- Note at bottom -->
  <rect x="60" y="354" width="760" height="16" rx="4" fill="none"/>
  <text x="440" y="367" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555">첫 번째 호출: 캐시 미스 (정상 비용) → 이후 호출: 캐시 히트 (문서 부분 90% 절감)</text>
</svg>
