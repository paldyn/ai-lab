<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker>
    <marker id="arr-g" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/></marker>
    <marker id="arr-o" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#ce9178"/></marker>
  </defs>
  <rect width="880" height="430" fill="#0a0a0a" rx="12"/>
  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">도구 호출 루프</text>
  <rect x="60" y="80" width="180" height="80" rx="8" fill="#0a1020" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="150.0" y="104" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">1. 요청</text>
  <text x="150.0" y="125" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0" text-anchor="middle">messages + tools</text>
  <text x="150.0" y="143" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0" text-anchor="middle">쌓인 이력 전체</text>
  <rect x="300" y="80" width="200" height="80" rx="8" fill="#1a0a1a" stroke="#6e3a6e" stroke-width="1.5"/>
  <text x="400.0" y="104" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#9a9ae8" text-anchor="middle">2. finish_reason</text>
  <text x="400.0" y="125" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0" text-anchor="middle">tool_calls면 3으로</text>
  <text x="400.0" y="143" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0" text-anchor="middle">그 밖이면 답을 반환</text>
  <rect x="560" y="80" width="260" height="80" rx="8" fill="#0f1a0f" stroke="#3a6e3a" stroke-width="1.5"/>
  <text x="690.0" y="104" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">3. 도구를 전부 실행</text>
  <text x="690.0" y="125" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0" text-anchor="middle">for tc in tool_calls</text>
  <text x="690.0" y="143" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0" text-anchor="middle">실패도 {"error": …}로 돌려준다</text>
  <rect x="560" y="250" width="260" height="80" rx="8" fill="#1a0f0a" stroke="#6e5a3a" stroke-width="1.5"/>
  <text x="690.0" y="274" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#ce9178" text-anchor="middle">4. 결과 되붙이기</text>
  <text x="690.0" y="295" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0" text-anchor="middle">assistant 메시지 + tool 메시지</text>
  <text x="690.0" y="313" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0" text-anchor="middle">tool_call_id를 하나씩 맞춘다</text>
  <rect x="300" y="200" width="200" height="44" rx="8" fill="#0f1a0f" stroke="#3a6e3a" stroke-width="1.5"/>
  <text x="400.0" y="227.0" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">최종 답</text>
  <line x1="240" y1="120" x2="300" y2="120" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="120" x2="560" y2="120" stroke="#55c555" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="400" y1="160" x2="400" y2="200" stroke="#55c555" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="690" y1="160" x2="690" y2="250" stroke="#ce9178" stroke-width="2" marker-end="url(#arr-o)"/>
  <path d="M 560 290 L 150 290 L 150 160" fill="none" stroke="#ce9178" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
  <text x="355" y="316" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#b0b0b0" text-anchor="middle">왕복 수가 MAX_ROUNDS 미만이면 1로</text>
  <rect x="60" y="350" width="760" height="50" rx="8" fill="#1a0a0a" stroke="#6e3a3a" stroke-width="1.5"/>
  <text x="440" y="380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8" text-anchor="middle">상한에 닿으면 예외로 끝낸다 — 같은 도구를 되풀이해 불러도 요금이 끝없이 나가지 않게</text>
</svg>
