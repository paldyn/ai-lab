<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 550"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <defs>
    <marker id="nsDown" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
    <marker id="nsCall" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="nsBack" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <rect width="880" height="550" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">뉴로-기호 AI — 도구를 부르는 LLM</text>
  <text x="440" y="74" text-anchor="middle" font-size="13" fill="#888">언어는 학습이 하고 계산은 규칙이 한다</text>

  <!-- Question -->
  <text x="60" y="98" font-size="12" fill="#888">사용자 질문</text>
  <rect x="60" y="108" width="760" height="54" rx="8" fill="#141414" stroke="#333" stroke-width="1"/>
  <text x="440" y="138" text-anchor="middle" font-size="14" fill="#e8e8e8">「7.3% 복리로 15년 뒤 원금 1000만 원이 얼마인가」</text>
  <line x1="440" y1="162" x2="440" y2="190" stroke="#888" stroke-width="2" marker-end="url(#nsDown)"/>

  <!-- Stage 1: neural -->
  <rect x="60" y="190" width="210" height="140" rx="8" fill="#0e2010" stroke="#55c555" stroke-width="1.5"/>
  <text x="165" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#55c555">신경망</text>
  <line x1="82" y1="238" x2="248" y2="238" stroke="#1e3a1e" stroke-width="1"/>
  <text x="165" y="264" text-anchor="middle" font-size="13" fill="#e8e8e8">질문을 읽고 무엇을</text>
  <text x="165" y="286" text-anchor="middle" font-size="13" fill="#e8e8e8">계산할지 정한다</text>
  <text x="165" y="306" text-anchor="middle" font-size="12" fill="#888">데이터가 만든 지식</text>

  <!-- Stage 2: symbolic tool -->
  <rect x="335" y="190" width="210" height="140" rx="8" fill="#111122" stroke="#7777cc" stroke-width="1.5"/>
  <text x="440" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#7777cc">계산기</text>
  <line x1="357" y1="238" x2="523" y2="238" stroke="#252545" stroke-width="1"/>
  <text x="440" y="264" text-anchor="middle" font-size="13" fill="#e8e8e8">1.073의 15제곱을</text>
  <text x="440" y="286" text-anchor="middle" font-size="13" fill="#e8e8e8">정확히 구한다</text>
  <text x="440" y="306" text-anchor="middle" font-size="12" fill="#888">규칙이 하는 지식</text>

  <!-- Stage 3: neural again -->
  <rect x="610" y="190" width="210" height="140" rx="8" fill="#0e2010" stroke="#55c555" stroke-width="1.5"/>
  <text x="715" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#55c555">신경망</text>
  <line x1="632" y1="238" x2="798" y2="238" stroke="#1e3a1e" stroke-width="1"/>
  <text x="715" y="264" text-anchor="middle" font-size="13" fill="#e8e8e8">받은 값을 문장으로</text>
  <text x="715" y="286" text-anchor="middle" font-size="13" fill="#e8e8e8">돌려준다</text>
  <text x="715" y="306" text-anchor="middle" font-size="12" fill="#888">데이터가 만든 지식</text>

  <!-- Flow arrows -->
  <line x1="270" y1="260" x2="335" y2="260" stroke="#7777cc" stroke-width="2" marker-end="url(#nsCall)"/>
  <text x="302" y="244" text-anchor="middle" font-size="12" fill="#888">도구 호출</text>
  <line x1="545" y1="260" x2="610" y2="260" stroke="#55c555" stroke-width="2" marker-end="url(#nsBack)"/>
  <text x="577" y="244" text-anchor="middle" font-size="12" fill="#888">결과</text>

  <!-- Takeaway band -->
  <rect x="60" y="380" width="760" height="110" rx="8" fill="#141414" stroke="#333" stroke-width="1"/>
  <text x="440" y="412" text-anchor="middle" font-size="15" font-weight="600" fill="#e8e8e8">각자 못하는 것을 상대가 메운다</text>
  <line x1="88" y1="428" x2="792" y2="428" stroke="#222" stroke-width="1"/>
  <text x="440" y="450" text-anchor="middle" font-size="13" fill="#888">무엇을 계산해야 하는지 아는 일은 데이터가 만든 지식이고</text>
  <text x="440" y="472" text-anchor="middle" font-size="13" fill="#888">소수점 아래까지 정확히 구하는 일은 규칙이 하는 지식이다</text>
</svg>
