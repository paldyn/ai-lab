<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">같은 청크인데 한쪽만 걸린다</text>
  <text x="60" y="72" font-size="13" fill="#888">청크는 문서에서 잘려 나온 조각이라 「이번 분기」가 몇 분기인지, 누구 매출인지가 안에 없다.</text>

  <text x="60" y="106" font-size="14" font-weight="600" fill="#e05555">자른 그대로 색인한 청크</text>
  <text x="480" y="106" font-size="14" font-weight="600" fill="#55c555">맥락 한 줄을 앞에 붙인 청크</text>

  <rect x="60" y="120" width="360" height="96" rx="8" fill="#101418" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="150" font-size="13" fill="#e8e8e8"><tspan fill="#e05555">이번 분기</tspan> 매출은 전년 대비 3% 늘었습니다.</text>
  <text x="84" y="174" font-size="13" fill="#e8e8e8">주된 요인은 갱신률 개선이며, 신규 유입은</text>
  <text x="84" y="198" font-size="13" fill="#e8e8e8">전 분기와 비슷한 수준을 유지했습니다.</text>

  <rect x="480" y="120" width="360" height="120" rx="8" fill="#101418" stroke="#55c555" stroke-width="1.5"/>
  <text x="504" y="150" font-size="13" font-weight="600" fill="#55c555">팔딘 2026년 2분기 실적 보고서 · 구독 부문</text>
  <text x="504" y="174" font-size="13" fill="#e8e8e8">이번 분기 매출은 전년 대비 3% 늘었습니다.</text>
  <text x="504" y="198" font-size="13" fill="#e8e8e8">주된 요인은 갱신률 개선이며, 신규 유입은</text>
  <text x="504" y="222" font-size="13" fill="#e8e8e8">전 분기와 비슷한 수준을 유지했습니다.</text>

  <text x="440" y="272" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">질의 — 「팔딘 2026년 2분기 구독 매출」</text>

  <rect x="60" y="292" width="360" height="64" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1"/>
  <text x="84" y="317" font-size="13" font-weight="600" fill="#e05555">키워드도 벡터도 못 건진다</text>
  <text x="84" y="337" font-size="11.5" fill="#888">「2026」·「2분기」·「구독」이 청크 안에 한 글자도 없다</text>

  <rect x="480" y="292" width="360" height="64" rx="8" fill="#101418" stroke="#3a4a6e" stroke-width="1"/>
  <text x="504" y="317" font-size="13" font-weight="600" fill="#55c555">양쪽 다 건진다</text>
  <text x="504" y="337" font-size="11.5" fill="#888">연도·분기·부문이 글자로도 있고 벡터에도 담긴다</text>

  <text x="60" y="386" font-size="13" fill="#888">고친 것은 검색기가 아니라 색인에 넣는 글자다 — 그래서 키워드 검색과 벡터 검색이 함께 좋아진다.</text>
</svg>
