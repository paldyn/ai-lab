<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410">
<rect width="880" height="410" rx="12" fill="#0a0a0a"/>
<text x="440" y="42" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">fp16의 0 근처 눈금</text>
<text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">가수 비트를 줄여 그린 개념도 — 실제 fp16은 구간마다 눈금이 1,024개다</text>
<rect x="80" y="142" width="180.0" height="30" rx="6" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="5,3"/>
<text x="170.0" y="162" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">flush-to-zero면 전부 0</text>
<line x1="80" y1="200" x2="800" y2="200" stroke="#888" stroke-width="1.5"/>
