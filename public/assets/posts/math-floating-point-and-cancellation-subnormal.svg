<line x1="305.0" y1="191" x2="305.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="327.5" y1="191" x2="327.5" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="350.0" y1="191" x2="350.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="372.5" y1="191" x2="372.5" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="395.0" y1="191" x2="395.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="417.5" y1="191" x2="417.5" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="485.0" y1="191" x2="485.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="530.0" y1="191" x2="530.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="575.0" y1="191" x2="575.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="620.0" y1="191" x2="620.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="665.0" y1="191" x2="665.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="710.0" y1="191" x2="710.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="755.0" y1="191" x2="755.0" y2="209" stroke="#7ec8e3" stroke-width="2"/>
<line x1="80.0" y1="180" x2="80.0" y2="220" stroke="#e8e8e8" stroke-width="2"/>
<text x="80.0" y="242" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">0</text>
<line x1="260.0" y1="180" x2="260.0" y2="220" stroke="#e8e8e8" stroke-width="2"/>
<text x="260.0" y="242" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">2⁻¹⁴ ≈ 6.10e−5</text>
<line x1="440.0" y1="180" x2="440.0" y2="220" stroke="#e8e8e8" stroke-width="2"/>
<text x="440.0" y="242" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">2⁻¹³</text>
<line x1="800.0" y1="180" x2="800.0" y2="220" stroke="#e8e8e8" stroke-width="2"/>
<text x="800.0" y="242" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">2⁻¹²</text>
<text x="170.0" y="270" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7777cc">비정규수</text>
<text x="170.0" y="290" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">0.f × 2⁻¹⁴</text>
<text x="350.0" y="270" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">첫 정규수 구간</text>
<text x="350.0" y="290" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">1.f × 2⁻¹⁴</text>
<text x="620.0" y="270" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">다음 정규수 구간</text>
<text x="620.0" y="290" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">1.f × 2⁻¹³</text>
<text x="440" y="356" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">맨 앞의 1을 0으로 바꿔 0까지 같은 간격으로 눈금을 잇는다</text>
<text x="440" y="382" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">2⁻²⁵ ≈ 2.98e−8 미만은 가장 가까운 눈금이 0이라 언더플로한다</text>
<text x="170.0" y="310" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">간격 2⁻²⁴ ≈ 5.96e−8</text>
<text x="350.0" y="310" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">간격 그대로 2⁻²⁴</text>
<text x="620.0" y="310" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">간격 두 배 2⁻²³</text>
</svg>
