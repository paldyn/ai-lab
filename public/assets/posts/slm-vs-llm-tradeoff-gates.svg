<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="gateArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="failArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">네 관문을 다 통과해야 내려도 된다</text>

  <rect x="60" y="90" width="170" height="86" rx="8" fill="#12161c" stroke="#55c555" stroke-width="1.5"/>
  <text x="145" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">① 일이 좁은가</text>
  <text x="145" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">입력과 출력의</text>
  <text x="145" y="164" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">형태가 정해졌다</text>

  <rect x="260" y="90" width="170" height="86" rx="8" fill="#12161c" stroke="#55c555" stroke-width="1.5"/>
  <text x="345" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">② 평가셋이 있는가</text>
  <text x="345" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">자기 데이터로</text>
  <text x="345" y="164" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">만든 200건</text>

  <rect x="460" y="90" width="170" height="86" rx="8" fill="#12161c" stroke="#55c555" stroke-width="1.5"/>
  <text x="545" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">③ 실패가 보이는가</text>
  <text x="545" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">틀린 답을 그 자리에서</text>
  <text x="545" y="164" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">가려낼 수 있다</text>

  <rect x="660" y="90" width="170" height="86" rx="8" fill="#12161c" stroke="#55c555" stroke-width="1.5"/>
  <text x="745" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">④ 되돌릴 길이 있나</text>
  <text x="745" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">큰 모델로 넘기는</text>
  <text x="745" y="164" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">경로가 있다</text>

  <line x1="230" y1="133" x2="260" y2="133" stroke="#55c555" stroke-width="2" marker-end="url(#gateArr)"/>
  <line x1="430" y1="133" x2="460" y2="133" stroke="#55c555" stroke-width="2" marker-end="url(#gateArr)"/>
  <line x1="630" y1="133" x2="660" y2="133" stroke="#55c555" stroke-width="2" marker-end="url(#gateArr)"/>

  <line x1="145" y1="176" x2="145" y2="286" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#failArr)"/>
  <line x1="345" y1="176" x2="345" y2="286" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#failArr)"/>
  <line x1="545" y1="176" x2="545" y2="286" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#failArr)"/>
  <line x1="745" y1="176" x2="745" y2="286" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#failArr)"/>

  <rect x="60" y="288" width="770" height="56" rx="8" fill="#2a1a1a" stroke="#e05555" stroke-width="1.5"/>
  <text x="445" y="322" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">하나라도 아니면 큰 모델을 그대로 둔다</text>

  <text x="60" y="378" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">②를 건너뛰고 내리는 것이 가장 흔한 실수다. 재 보지 않으면 품질이 떨어진 사실 자체를 모른다.</text>
</svg>
