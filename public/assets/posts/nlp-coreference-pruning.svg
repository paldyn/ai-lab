<svg width="880" height="494" viewBox="0 0 880 494"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="494" rx="12" fill="#0a0a0a"/>

  <defs>
    <marker id="prunearr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">멘션 후보를 줄이는 세 번의 제한</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">500토큰짜리 문서 하나 기준</text>

  <rect x="80" y="100" width="720" height="62" rx="8" fill="#0f0f1a" stroke="#7777cc" stroke-width="1.5"/>
  <text x="104" y="138" fill="#e8e8e8" font-size="14">모든 연속 구간</text>
  <text x="776" y="138" text-anchor="end" fill="#7777cc" font-size="16" font-weight="600">125,250개</text>

  <line x1="440" y1="164" x2="440" y2="188" stroke="#888" stroke-width="2" marker-end="url(#prunearr)"/>
  <text x="600" y="182" fill="#888" font-size="12">① 길이 10토큰 이하만 남긴다</text>

  <rect x="200" y="192" width="480" height="62" rx="8" fill="#0f1a1a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="224" y="230" fill="#e8e8e8" font-size="14">길이 제한 통과</text>
  <text x="656" y="230" text-anchor="end" fill="#7ec8e3" font-size="16" font-weight="600">4,955개</text>

  <line x1="440" y1="256" x2="440" y2="280" stroke="#888" stroke-width="2" marker-end="url(#prunearr)"/>
  <text x="600" y="274" fill="#888" font-size="12">② 멘션 점수 상위 0.4n개만 남긴다</text>

  <rect x="300" y="284" width="280" height="62" rx="8" fill="#1a1a0f" stroke="#e8c84e" stroke-width="1.5"/>
  <text x="324" y="322" fill="#e8e8e8" font-size="14">멘션 후보</text>
  <text x="556" y="322" text-anchor="end" fill="#e8c84e" font-size="16" font-weight="600">200개</text>

  <line x1="440" y1="348" x2="440" y2="372" stroke="#888" stroke-width="2" marker-end="url(#prunearr)"/>
  <text x="600" y="366" fill="#888" font-size="12">③ 선행사 후보를 앞쪽 50개로 제한한다</text>

  <rect x="300" y="376" width="280" height="62" rx="8" fill="#0f1a0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="324" y="414" fill="#e8e8e8" font-size="14">실제로 채점하는 쌍</text>
  <text x="556" y="414" text-anchor="end" fill="#55c555" font-size="16" font-weight="600">1만 쌍</text>

  <text x="440" y="470" text-anchor="middle" fill="#888" font-size="12">제한이 없으면 따져야 할 쌍이 78억이다. 세 번의 제한이 계산을 성립하게 만든다.</text>
</svg>
