<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="430" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">3 ÷ 1/2 은 3 안에 1/2 이 몇 개 들어가는가</text>
  <text x="60" y="82" font-size="13" fill="#888">나누는 수가 1보다 작으면 몫이 나뉘는 수보다 커진다 — 이상한 일이 아니다</text>

  <text x="60" y="132" font-size="16" font-weight="600" fill="#e8e8e8">길이 3 짜리 막대</text>

  <rect x="60" y="152" width="720" height="52" rx="4" fill="#7ec8e3" fill-opacity="0.18" stroke="#666" stroke-width="1.5"/>
  <line x1="300" y1="152" x2="300" y2="204" stroke="#888" stroke-width="1.5"/>
  <line x1="540" y1="152" x2="540" y2="204" stroke="#888" stroke-width="1.5"/>
  <text x="180" y="184" font-size="14" fill="#e8e8e8" text-anchor="middle">1</text>
  <text x="420" y="184" font-size="14" fill="#e8e8e8" text-anchor="middle">1</text>
  <text x="660" y="184" font-size="14" fill="#e8e8e8" text-anchor="middle">1</text>

  <text x="60" y="252" font-size="16" font-weight="600" fill="#e8e8e8">1/2 짜리로 끊어 보면</text>

  <rect x="60" y="272" width="720" height="52" rx="4" fill="none" stroke="#666" stroke-width="1.5"/>
  <line x1="180" y1="272" x2="180" y2="324" stroke="#7777cc" stroke-width="2"/>
  <line x1="300" y1="272" x2="300" y2="324" stroke="#7777cc" stroke-width="2"/>
  <line x1="420" y1="272" x2="420" y2="324" stroke="#7777cc" stroke-width="2"/>
  <line x1="540" y1="272" x2="540" y2="324" stroke="#7777cc" stroke-width="2"/>
  <line x1="660" y1="272" x2="660" y2="324" stroke="#7777cc" stroke-width="2"/>
  <text x="120" y="304" font-size="14" fill="#9aa4cc" text-anchor="middle">1</text>
  <text x="240" y="304" font-size="14" fill="#9aa4cc" text-anchor="middle">2</text>
  <text x="360" y="304" font-size="14" fill="#9aa4cc" text-anchor="middle">3</text>
  <text x="480" y="304" font-size="14" fill="#9aa4cc" text-anchor="middle">4</text>
  <text x="600" y="304" font-size="14" fill="#9aa4cc" text-anchor="middle">5</text>
  <text x="720" y="304" font-size="14" fill="#9aa4cc" text-anchor="middle">6</text>

  <rect x="60" y="346" width="760" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="370" font-size="13" font-weight="600" fill="#55c555">3 ÷ 1/2 = 6 이고, 3 × 2 도 6 이다</text>
  <text x="84" y="390" font-size="13" fill="#888">1 안에 1/2 이 2 개 들어가므로 3 안에는 그 3 배가 들어간다 — 뒤집어 곱하는 규칙이 여기서 나온다</text>
</svg>
