<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="pt1" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="pt2" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">블록 테이블이 흩어진 자리를 하나로 이어 준다</text>
  <text x="60" y="72" font-size="13" fill="#888">요청이 보는 순서와 GPU 안의 실제 위치가 따로 논다.</text>

  <text x="145" y="112" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">요청 A가 보는 순서</text>

  <rect x="60" y="130" width="170" height="32" rx="6" fill="#0d1117" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="145" y="151" font-size="12.5" fill="#e8e8e8" text-anchor="middle">논리 블록 0</text>
  <rect x="60" y="170" width="170" height="32" rx="6" fill="#0d1117" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="145" y="191" font-size="12.5" fill="#e8e8e8" text-anchor="middle">논리 블록 1</text>
  <rect x="60" y="210" width="170" height="32" rx="6" fill="#0d1117" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="145" y="231" font-size="12.5" fill="#e8e8e8" text-anchor="middle">논리 블록 2</text>
  <rect x="60" y="250" width="170" height="32" rx="6" fill="#0d1117" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="145" y="271" font-size="12.5" fill="#e8e8e8" text-anchor="middle">논리 블록 3</text>

  <line x1="230" y1="146" x2="300" y2="146" stroke="#7ec8e3" stroke-width="2" marker-end="url(#pt1)"/>
  <line x1="230" y1="186" x2="300" y2="186" stroke="#7ec8e3" stroke-width="2" marker-end="url(#pt1)"/>
  <line x1="230" y1="226" x2="300" y2="226" stroke="#7ec8e3" stroke-width="2" marker-end="url(#pt1)"/>
  <line x1="230" y1="266" x2="300" y2="266" stroke="#7ec8e3" stroke-width="2" marker-end="url(#pt1)"/>

  <text x="390" y="112" font-size="13" font-weight="600" fill="#7777cc" text-anchor="middle">블록 테이블</text>
  <rect x="300" y="126" width="180" height="160" rx="10" fill="#0d1117" stroke="#7777cc" stroke-width="1.5"/>
  <text x="390" y="151" font-size="12.5" fill="#e8e8e8" text-anchor="middle">0 → 물리 7</text>
  <text x="390" y="191" font-size="12.5" fill="#e8e8e8" text-anchor="middle">1 → 물리 2</text>
  <text x="390" y="231" font-size="12.5" fill="#e8e8e8" text-anchor="middle">2 → 물리 9</text>
  <text x="390" y="271" font-size="12.5" fill="#e8e8e8" text-anchor="middle">3 → 물리 4</text>

  <line x1="480" y1="206" x2="558" y2="206" stroke="#55c555" stroke-width="2" marker-end="url(#pt2)"/>
  <text x="519" y="188" font-size="11.5" fill="#55c555" text-anchor="middle">찾아간다</text>

  <text x="690" y="112" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">GPU 안의 물리 블록 풀</text>

  <rect x="560" y="120" width="60" height="40" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="590" y="145" font-size="12" fill="#888" text-anchor="middle">0</text>
  <rect x="626" y="120" width="60" height="40" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="656" y="145" font-size="12" fill="#888" text-anchor="middle">1</text>
  <rect x="692" y="120" width="60" height="40" rx="6" fill="#22401f" stroke="#55c555" stroke-width="1.5"/>
  <text x="722" y="145" font-size="12" fill="#e8e8e8" text-anchor="middle">2</text>
  <rect x="758" y="120" width="60" height="40" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="788" y="145" font-size="12" fill="#888" text-anchor="middle">3</text>

  <rect x="560" y="170" width="60" height="40" rx="6" fill="#22401f" stroke="#55c555" stroke-width="1.5"/>
  <text x="590" y="195" font-size="12" fill="#e8e8e8" text-anchor="middle">4</text>
  <rect x="626" y="170" width="60" height="40" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="656" y="195" font-size="12" fill="#888" text-anchor="middle">5</text>
  <rect x="692" y="170" width="60" height="40" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="722" y="195" font-size="12" fill="#888" text-anchor="middle">6</text>
  <rect x="758" y="170" width="60" height="40" rx="6" fill="#22401f" stroke="#55c555" stroke-width="1.5"/>
  <text x="788" y="195" font-size="12" fill="#e8e8e8" text-anchor="middle">7</text>

  <rect x="560" y="220" width="60" height="40" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="590" y="245" font-size="12" fill="#888" text-anchor="middle">8</text>
  <rect x="626" y="220" width="60" height="40" rx="6" fill="#22401f" stroke="#55c555" stroke-width="1.5"/>
  <text x="656" y="245" font-size="12" fill="#e8e8e8" text-anchor="middle">9</text>
  <rect x="692" y="220" width="60" height="40" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="722" y="245" font-size="12" fill="#888" text-anchor="middle">10</text>
  <rect x="758" y="220" width="60" height="40" rx="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <text x="788" y="245" font-size="12" fill="#888" text-anchor="middle">11</text>

  <text x="60" y="320" font-size="13" fill="#888">회색은 비었거나 다른 요청이 쓰는 블록이다. 요청이 한 칸 길어지면 빈 블록 하나를 더 빌려 표에 줄을 더한다.</text>
</svg>
