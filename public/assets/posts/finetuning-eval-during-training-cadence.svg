<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0a0a0a"/>

  <text x="62" y="46" font-size="22" font-weight="700" fill="#e8e8e8">평가를 한 종류만 두면 자주 못 돌거나 아무것도 못 잡는다</text>
  <text x="62" y="72" font-size="13" fill="#888">싼 것은 자주, 비싼 것은 드물게. 층을 나누면 둘 다 할 수 있다.</text>

  <line x1="360" y1="133" x2="818" y2="133" stroke="#222222" stroke-width="1"/>
  <text x="62" y="124" font-size="13" font-weight="600" fill="#e8e8e8">매 50스텝 · 검증 손실</text>
  <text x="62" y="144" font-size="11" fill="#888">1초 미만 · 순전파만 돌면 된다</text>
  <circle cx="360" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="387" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="414" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="441" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="468" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="495" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="522" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="549" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="576" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="603" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="630" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="657" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="684" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="711" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="738" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="764" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="791" cy="133" r="4" fill="#7ec8e3"/>
  <circle cx="818" cy="133" r="4" fill="#7ec8e3"/>

  <line x1="360" y1="203" x2="818" y2="203" stroke="#222222" stroke-width="1"/>
  <text x="62" y="194" font-size="13" font-weight="600" fill="#e8e8e8">매 500스텝 · 골든 100문제</text>
  <text x="62" y="214" font-size="11" fill="#888">2~4분 · 실제로 생성해 봐야 한다</text>
  <circle cx="360" cy="203" r="7" fill="#55c555"/>
  <circle cx="474" cy="203" r="7" fill="#55c555"/>
  <circle cx="589" cy="203" r="7" fill="#55c555"/>
  <circle cx="703" cy="203" r="7" fill="#55c555"/>
  <circle cx="818" cy="203" r="7" fill="#55c555"/>

  <line x1="360" y1="273" x2="818" y2="273" stroke="#222222" stroke-width="1"/>
  <text x="62" y="264" font-size="13" font-weight="600" fill="#e8e8e8">에폭 끝 · 전체 평가 스위트</text>
  <text x="62" y="284" font-size="11" fill="#888">30분 이상 · 사람 검수가 섞인다</text>
  <circle cx="589" cy="273" r="10" fill="#7777cc"/>
  <circle cx="818" cy="273" r="10" fill="#7777cc"/>

  <line x1="360" y1="312" x2="818" y2="312" stroke="#555555" stroke-width="1.5"/>
  <text x="360" y="332" font-size="11" fill="#888">학습 시작</text>
  <text x="818" y="332" font-size="11" fill="#888" text-anchor="end">학습 끝</text>

  <text x="62" y="360" font-size="13" fill="#e8e8e8">위 두 층은 자동으로 돌고, 맨 아래 한 층만 사람이 본다.</text>
</svg>
