<svg width="880" height="398" viewBox="0 0 880 398"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">

  <rect width="880" height="398" rx="12" fill="#0a0a0a"/>

  <defs>
    <marker id="upG" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="dnR" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <text x="440" y="44" text-anchor="middle" fill="#e8e8e8" font-size="22" font-weight="700">베이스라인이 바꾸는 것</text>
  <text x="440" y="68" text-anchor="middle" fill="#888" font-size="13">같은 상태에서 세 행동을 했고 리턴이 102 · 100 · 98로 나왔다</text>

  <text x="240" y="110" text-anchor="middle" fill="#e05555" font-size="16" font-weight="600">베이스라인 없음</text>
  <text x="640" y="110" text-anchor="middle" fill="#55c555" font-size="16" font-weight="600">베이스라인 b = 100</text>

  <!-- Left panel -->
  <rect x="60" y="124" width="360" height="200" rx="8" fill="#0f0f1a" stroke="#333"/>
  <text x="88" y="152" fill="#888" font-size="12">행동</text>
  <text x="250" y="152" text-anchor="end" fill="#888" font-size="12">리턴 G</text>
  <text x="392" y="152" text-anchor="end" fill="#888" font-size="12">확률 변화</text>
  <line x1="84" y1="164" x2="396" y2="164" stroke="#2a2a2a" stroke-width="1"/>

  <text x="88" y="200" fill="#e8e8e8" font-size="14">a₁</text>
  <text x="250" y="200" text-anchor="end" fill="#e8e8e8" font-size="14">+102</text>
  <line x1="340" y1="208" x2="340" y2="182" stroke="#55c555" stroke-width="2.5" marker-end="url(#upG)"/>

  <text x="88" y="250" fill="#e8e8e8" font-size="14">a₂</text>
  <text x="250" y="250" text-anchor="end" fill="#e8e8e8" font-size="14">+100</text>
  <line x1="340" y1="258" x2="340" y2="233" stroke="#55c555" stroke-width="2.5" marker-end="url(#upG)"/>

  <text x="88" y="300" fill="#e8e8e8" font-size="14">a₃</text>
  <text x="250" y="300" text-anchor="end" fill="#e8e8e8" font-size="14">+98</text>
  <line x1="340" y1="308" x2="340" y2="284" stroke="#55c555" stroke-width="2.5" marker-end="url(#upG)"/>

  <!-- Right panel -->
  <rect x="460" y="124" width="360" height="200" rx="8" fill="#0f1a0f" stroke="#55c555"/>
  <text x="488" y="152" fill="#888" font-size="12">행동</text>
  <text x="650" y="152" text-anchor="end" fill="#888" font-size="12">G − b</text>
  <text x="792" y="152" text-anchor="end" fill="#888" font-size="12">확률 변화</text>
  <line x1="484" y1="164" x2="796" y2="164" stroke="#2a2a2a" stroke-width="1"/>

  <text x="488" y="200" fill="#e8e8e8" font-size="14">a₁</text>
  <text x="650" y="200" text-anchor="end" fill="#55c555" font-size="14">+2</text>
  <line x1="740" y1="208" x2="740" y2="182" stroke="#55c555" stroke-width="2.5" marker-end="url(#upG)"/>

  <text x="488" y="250" fill="#e8e8e8" font-size="14">a₂</text>
  <text x="650" y="250" text-anchor="end" fill="#888" font-size="14">0</text>
  <line x1="726" y1="245" x2="754" y2="245" stroke="#888" stroke-width="2.5"/>

  <text x="488" y="300" fill="#e8e8e8" font-size="14">a₃</text>
  <text x="650" y="300" text-anchor="end" fill="#e05555" font-size="14">−2</text>
  <line x1="740" y1="284" x2="740" y2="310" stroke="#e05555" stroke-width="2.5" marker-end="url(#dnR)"/>

  <text x="440" y="354" text-anchor="middle" fill="#888" font-size="12">왼쪽은 세 행동의 확률이 거의 같은 크기로 전부 올라간다 — 방향이 아니라 크기 차이로만 학습한다.</text>
  <text x="440" y="378" text-anchor="middle" fill="#888" font-size="12">상태에만 의존하는 값을 빼므로 기대값은 그대로이고 분산만 줄어든다.</text>
</svg>
