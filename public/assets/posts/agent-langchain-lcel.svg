<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <rect width="880" height="440" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">LCEL과 RAG 체인 구현</text>

  <!-- 왼쪽: LCEL 기본 -->
  <rect x="30" y="64" width="390" height="352" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="50" y="86" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># LCEL (LangChain Expression Language)</tspan></text>
  <text x="50" y="106" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> langchain_anthropic </tspan><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> ChatAnthropic</tspan></text>
  <text x="50" y="126" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> langchain_core.prompts </tspan><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="50" y="146" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    ChatPromptTemplate)</tspan></text>
  <text x="50" y="166" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> langchain_core.output_parsers </tspan><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="50" y="186" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    StrOutputParser)</tspan></text>
  <text x="50" y="210" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># | (pipe) 연산자로 잇는다</tspan></text>
  <text x="50" y="230" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">llm = ChatAnthropic(model=</tspan><tspan fill="#ce9178">&quot;claude-sonnet-4-6&quot;</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="50" y="250" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">prompt = ChatPromptTemplate.from_messages([</tspan></text>
  <text x="50" y="270" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    (</tspan><tspan fill="#ce9178">&quot;system&quot;</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">&quot;당신은 {role}입니다.&quot;</tspan><tspan fill="#ffffff">),</tspan></text>
  <text x="50" y="290" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    (</tspan><tspan fill="#ce9178">&quot;human&quot;</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">&quot;{question}&quot;</tspan><tspan fill="#ffffff">),</tspan></text>
  <text x="50" y="310" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">])</tspan></text>
  <text x="50" y="330" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">chain = prompt | llm | StrOutputParser()</tspan></text>
  <text x="50" y="354" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">for</tspan><tspan fill="#ffffff"> chunk </tspan><tspan fill="#7ec8e3">in</tspan><tspan fill="#ffffff"> chain.stream({</tspan><tspan fill="#9aa4b8">  # 스트리밍</tspan></text>
  <text x="50" y="374" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    </tspan><tspan fill="#ce9178">&quot;role&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;파이썬 전문가&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="50" y="394" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    </tspan><tspan fill="#ce9178">&quot;question&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#ce9178">&quot;데코레이터란?&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="50" y="414" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">}): print(chunk, end=</tspan><tspan fill="#ce9178">&quot;&quot;</tspan><tspan fill="#ffffff">, flush=</tspan><tspan fill="#b5cea8">True</tspan><tspan fill="#ffffff">)</tspan></text>

  <!-- 오른쪽: RAG 체인 -->
  <rect x="450" y="64" width="400" height="352" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="470" y="86" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8"># LangChain RAG 체인</tspan></text>
  <text x="470" y="106" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> langchain_chroma </tspan><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> Chroma</tspan></text>
  <text x="470" y="126" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> langchain_openai </tspan><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> OpenAIEmbeddings</tspan></text>
  <text x="470" y="146" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">from</tspan><tspan fill="#ffffff"> langchain_core.runnables </tspan><tspan fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="470" y="166" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    RunnablePassthrough)</tspan></text>
  <text x="470" y="188" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">vectorstore = Chroma(</tspan><tspan fill="#9aa4b8">  # 벡터 스토어</tspan></text>
  <text x="470" y="208" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    persist_directory=</tspan><tspan fill="#ce9178">&quot;./chroma_db&quot;</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="470" y="228" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    embedding_function=OpenAIEmbeddings()</tspan></text>
  <text x="470" y="248" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">)</tspan></text>
  <text x="470" y="270" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">retriever = vectorstore.as_retriever(</tspan></text>
  <text x="470" y="290" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    search_kwargs={</tspan><tspan fill="#ce9178">&quot;k&quot;</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#b5cea8">4</tspan><tspan fill="#ffffff">})</tspan></text>
  <text x="470" y="312" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">rag_chain = (</tspan><tspan fill="#9aa4b8">          # RAG 체인</tspan></text>
  <text x="470" y="332" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    {</tspan><tspan fill="#ce9178">&quot;context&quot;</tspan><tspan fill="#ffffff">: retriever,</tspan></text>
  <text x="470" y="352" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">     </tspan><tspan fill="#ce9178">&quot;question&quot;</tspan><tspan fill="#ffffff">: RunnablePassthrough()}</tspan></text>
  <text x="470" y="372" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    | rag_prompt | llm | StrOutputParser()</tspan></text>
  <text x="470" y="392" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">)</tspan></text>
  <text x="470" y="412" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">print(rag_chain.invoke(</tspan><tspan fill="#ce9178">&quot;MCP란?&quot;</tspan><tspan fill="#ffffff">))</tspan></text>
</svg>
