<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="cca-arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <text x="60" y="48" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">압축은 조립하는 한 곳에서</text>
  <text x="60" y="74" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">도구 응답은 원문 그대로 저장하고, 보내기 직전에 한 함수가 단계를 차례로 적용한다</text>

  <rect x="60" y="120" width="190" height="56" rx="8" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <text x="80" y="153" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">검색 도구 응답</text>
  <rect x="60" y="196" width="190" height="56" rx="8" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <text x="80" y="229" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">이슈 조회 응답</text>
  <rect x="60" y="272" width="190" height="56" rx="8" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <text x="80" y="305" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">대화 이력</text>

  <line x1="250" y1="148" x2="320" y2="200" stroke="#7777cc" stroke-width="2" marker-end="url(#cca-arr)"/>
  <line x1="250" y1="224" x2="320" y2="224" stroke="#7777cc" stroke-width="2" marker-end="url(#cca-arr)"/>
  <line x1="250" y1="300" x2="320" y2="248" stroke="#7777cc" stroke-width="2" marker-end="url(#cca-arr)"/>

  <rect x="320" y="110" width="250" height="228" rx="10" fill="#14141c" stroke="#7777cc" stroke-width="1.5"/>
  <text x="344" y="140" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">조립 함수</text>
  <text x="344" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">예산에 들 때까지 차례로</text>
  <text x="344" y="196" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">1 필드 선별</text>
  <text x="344" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">2 형식 교체</text>
  <text x="344" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">3 오래된 결과 축약</text>
  <text x="344" y="280" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">4 요약</text>
  <text x="344" y="314" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">닿으면 멈춘다</text>

  <line x1="570" y1="180" x2="630" y2="180" stroke="#7777cc" stroke-width="2" marker-end="url(#cca-arr)"/>
  <line x1="570" y1="290" x2="630" y2="290" stroke="#7777cc" stroke-width="2" marker-end="url(#cca-arr)"/>

  <rect x="630" y="150" width="190" height="60" rx="8" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <text x="650" y="176" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">모델 요청</text>
  <text x="650" y="196" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">예산 안의 컨텍스트</text>
  <rect x="630" y="260" width="190" height="60" rx="8" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
  <text x="650" y="286" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">로그</text>
  <text x="650" y="306" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">멈춘 단계·도구별 토큰</text>

  <text x="60" y="386" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">원문은 저장소에 남으므로 3단계에서 내린 결과도 같은 조회로 되살릴 수 있다</text>
</svg>
