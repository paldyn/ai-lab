<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="390" rx="12" fill="#0a0a0a"/>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">교차엔트로피 = 엔트로피 + KL 발산</text>
  <text x="60" y="100" font-size="16" font-weight="600" fill="#e8e8e8">H(p, q) = H(p) + D_KL(p ‖ q)</text>

  <rect x="600" y="88" width="14" height="14" fill="#55c555"/>
  <text x="622" y="100" font-size="13" fill="#888">H(p)</text>
  <rect x="690" y="88" width="14" height="14" fill="#e05555"/>
  <text x="712" y="100" font-size="13" fill="#888">KL 발산</text>

  <!-- row 1 : uniform model -->
  <text x="190" y="163" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="end">q 균등</text>
  <text x="190" y="185" font-size="13" fill="#888" text-anchor="end">H(p, q) = 2.0</text>
  <rect x="200" y="140" width="350" height="60" fill="#55c555"/>
  <rect x="550" y="140" width="50" height="60" fill="#e05555"/>
  <text x="375" y="176" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="middle">H(p) = 1.75</text>
  <line x1="575" y1="132" x2="575" y2="140" stroke="#e05555" stroke-width="1.5"/>
  <text x="575" y="126" font-size="13" fill="#e05555" text-anchor="middle">KL = 0.25</text>

  <!-- row 2 : reversed model -->
  <text x="190" y="263" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="end">q 거꾸로</text>
  <text x="190" y="285" font-size="13" fill="#888" text-anchor="end">H(p, q) = 2.625</text>
  <rect x="200" y="240" width="350" height="60" fill="#55c555"/>
  <rect x="550" y="240" width="175" height="60" fill="#e05555"/>
  <text x="375" y="276" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="middle">H(p) = 1.75</text>
  <text x="637" y="276" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="middle">KL = 0.875</text>

  <!-- scale -->
  <line x1="200" y1="326" x2="800" y2="326" stroke="#888" stroke-width="1.5"/>
  <line x1="200" y1="326" x2="200" y2="334" stroke="#444" stroke-width="1.5"/>
  <line x1="400" y1="326" x2="400" y2="334" stroke="#444" stroke-width="1.5"/>
  <line x1="600" y1="326" x2="600" y2="334" stroke="#444" stroke-width="1.5"/>
  <line x1="800" y1="326" x2="800" y2="334" stroke="#444" stroke-width="1.5"/>
  <text x="200" y="348" font-size="13" fill="#888" text-anchor="middle">0</text>
  <text x="400" y="348" font-size="13" fill="#888" text-anchor="middle">1</text>
  <text x="600" y="348" font-size="13" fill="#888" text-anchor="middle">2</text>
  <text x="800" y="348" font-size="13" fill="#888" text-anchor="middle">3</text>
  <text x="812" y="331" font-size="13" fill="#888">비트</text>

  <text x="60" y="376" font-size="13" fill="#888">p 가 고정이면 H(p) 는 상수다 — 그래서 교차엔트로피를 줄이는 것과 KL을 줄이는 것이 같은 일이 된다</text>
</svg>
