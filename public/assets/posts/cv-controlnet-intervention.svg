<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <defs>
    <marker id="arrO" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#ce9178"/>
    </marker>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">확산 루프에 개입하는 두 지점</text>
  <text x="440" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">제어는 매 스텝을 밀고, 편집은 출발점을 바꾼다</text>

  <!-- (1) ControlNet band -->
  <rect x="60" y="104" width="760" height="60" rx="10" fill="#2a1a0a" stroke="#ce9178" stroke-width="1.5"/>
  <text x="440" y="128" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#ce9178" text-anchor="middle">① ControlNet — 매 스텝의 노이즈 예측을 민다</text>
  <text x="440" y="148" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">제어 이미지에서 뽑은 값을 U-Net 중간 특징에 더한다 · 50스텝을 도는 동안 50번</text>

  <line x1="282" y1="164" x2="282" y2="200" stroke="#ce9178" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="440" y1="164" x2="440" y2="200" stroke="#ce9178" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="598" y1="164" x2="598" y2="200" stroke="#ce9178" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- denoising chain -->
  <rect x="60" y="200" width="128" height="60" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="124" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">x_T</text>
  <text x="124" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">순수 노이즈</text>

  <rect x="218" y="200" width="128" height="60" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="282" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">x_t</text>
  <text x="282" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">노이즈 예측</text>

  <rect x="376" y="200" width="128" height="60" rx="8" fill="#12212b" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">x_t-1</text>
  <text x="440" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">한 걸음 복원</text>

  <rect x="534" y="200" width="128" height="60" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="598" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">···</text>
  <text x="598" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">50스텝 반복</text>

  <rect x="692" y="200" width="128" height="60" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="756" y="224" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="middle">x_0</text>
  <text x="756" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">완성 이미지</text>

  <line x1="188" y1="230" x2="218" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrGr)"/>
  <line x1="346" y1="230" x2="376" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrGr)"/>
  <line x1="504" y1="230" x2="534" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrGr)"/>
  <line x1="662" y1="230" x2="692" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrGr)"/>

  <!-- (2) editing band -->
  <line x1="440" y1="316" x2="440" y2="260" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="468" y="294" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888">출발점을 여기로</text>

  <rect x="60" y="316" width="760" height="64" rx="10" fill="#0d1b24" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="342" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">② 편집 — 어디서 출발할지를 바꾼다</text>
  <text x="440" y="362" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">원본 이미지를 잠재로 넣고 노이즈를 씌운 지점에서 시작한다 · 마스크는 「이 영역만」을 더 얹는다</text>

  <text x="440" y="412" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">제어는 형태를, 마스크는 영역을, 역전은 배치와 정체성을 지킨다</text>
</svg>
