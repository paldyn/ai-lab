<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="330" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">분모는 조각의 크기, 분자는 그 개수</text>
  <text x="60" y="82" font-size="13" fill="#888">같은 하나를 몇 조각으로 잘랐는지가 분모, 그중 몇 개를 잡았는지가 분자다</text>

  <text x="60" y="130" font-size="17" font-weight="700" fill="#7ec8e3">3/4</text>
  <rect x="140" y="110" width="600" height="52" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="140" y="110" width="150" height="52" fill="#7ec8e3" fill-opacity="0.22"/>
  <rect x="290" y="110" width="150" height="52" fill="#7ec8e3" fill-opacity="0.22"/>
  <rect x="440" y="110" width="150" height="52" fill="#7ec8e3" fill-opacity="0.22"/>
  <line x1="290" y1="110" x2="290" y2="162" stroke="#888" stroke-width="1"/>
  <line x1="440" y1="110" x2="440" y2="162" stroke="#888" stroke-width="1"/>
  <line x1="590" y1="110" x2="590" y2="162" stroke="#888" stroke-width="1"/>
  <text x="770" y="142" font-size="13" fill="#888">넷으로 잘라 셋</text>

  <text x="60" y="220" font-size="17" font-weight="700" fill="#7777cc">3/8</text>
  <rect x="140" y="200" width="600" height="52" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="140" y="200" width="75" height="52" fill="#7777cc" fill-opacity="0.25"/>
  <rect x="215" y="200" width="75" height="52" fill="#7777cc" fill-opacity="0.25"/>
  <rect x="290" y="200" width="75" height="52" fill="#7777cc" fill-opacity="0.25"/>
  <line x1="215" y1="200" x2="215" y2="252" stroke="#888" stroke-width="1"/>
  <line x1="290" y1="200" x2="290" y2="252" stroke="#888" stroke-width="1"/>
  <line x1="365" y1="200" x2="365" y2="252" stroke="#888" stroke-width="1"/>
  <line x1="440" y1="200" x2="440" y2="252" stroke="#888" stroke-width="1"/>
  <line x1="515" y1="200" x2="515" y2="252" stroke="#888" stroke-width="1"/>
  <line x1="590" y1="200" x2="590" y2="252" stroke="#888" stroke-width="1"/>
  <line x1="665" y1="200" x2="665" y2="252" stroke="#888" stroke-width="1"/>
  <text x="770" y="232" font-size="13" fill="#888">여덟으로 잘라 셋</text>

  <text x="60" y="296" font-size="14" fill="#7777cc">분자가 같아도 조각이 작으면 값이 작다. 그래서 더하고 빼기 전에 조각의 크기부터 맞춘다 — 그것이 통분이다</text>
</svg>
