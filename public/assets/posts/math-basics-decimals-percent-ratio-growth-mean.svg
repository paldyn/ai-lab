  <text x="750" y="390" font-size="13" fill="#888" text-anchor="middle">2년 뒤</text>
  <rect x="60" y="406" width="760" height="50" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="436" font-size="13" font-weight="600" fill="#e8e8e8">1.2 × 1.2 = 1.44 로 어긋나고, 1.196 × 1.196 ≈ 1.43 으로 실제와 맞는다</text>
