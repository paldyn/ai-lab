  <text x="420" y="128" font-size="13" fill="#7ec8e3" text-anchor="middle">× 1.1</text>
  <line x1="590" y1="140" x2="690" y2="140" stroke="#888" stroke-width="2" marker-end="url(#gmArr)"/>
  <text x="640" y="128" font-size="13" fill="#7ec8e3" text-anchor="middle">× 1.3</text>
  <text x="60" y="226" font-size="16" font-weight="600" fill="#e8e8e8">산술평균</text>
