  <line x1="590" y1="230" x2="690" y2="230" stroke="#888" stroke-width="2" marker-end="url(#gmArr)"/>
  <text x="640" y="218" font-size="13" fill="#7ec8e3" text-anchor="middle">× 1.2</text>
  <text x="60" y="316" font-size="16" font-weight="600" fill="#e8e8e8">기하평균</text>
  <text x="60" y="336" font-size="13" fill="#888">19.6%씩 두 번</text>
  <rect x="250" y="292" width="120" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="310" y="328" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">100</text>
  <rect x="470" y="292" width="120" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="530" y="328" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">119.6</text>
  <rect x="690" y="292" width="120" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="750" y="328" font-size="20" font-weight="700" fill="#55c555" text-anchor="middle">143.0</text>
  <line x1="370" y1="320" x2="470" y2="320" stroke="#888" stroke-width="2" marker-end="url(#gmArr)"/>
