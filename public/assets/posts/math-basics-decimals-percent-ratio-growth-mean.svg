  <rect x="250" y="112" width="120" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="310" y="148" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">100</text>
  <rect x="470" y="112" width="120" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
  <text x="530" y="148" font-size="20" font-weight="700" fill="#e8e8e8" text-anchor="middle">110</text>
  <rect x="690" y="112" width="120" height="56" rx="6" fill="#101010" stroke="#333" stroke-width="1.5"/>
