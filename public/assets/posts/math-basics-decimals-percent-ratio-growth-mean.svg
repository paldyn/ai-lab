  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">두 해 성장률의 평균 — 더하지 말고 곱으로 잇는다</text>
  <text x="60" y="82" font-size="13" fill="#888">10% 오르고 30% 오른 두 해를 한 가지 비율로 두 번 이어 보면</text>
  <text x="60" y="136" font-size="16" font-weight="600" fill="#e8e8e8">실제</text>
