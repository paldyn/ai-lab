<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#0a0a0a"/>
  <text x="60" y="44" font-size="22" font-weight="700" fill="#e8e8e8">볼록함수 — 현이 언제나 그래프 위에 있다</text>

  <line x1="100" y1="70" x2="100" y2="340" stroke="#888" stroke-width="1.5"/>
  <line x1="100" y1="340" x2="800" y2="340" stroke="#888" stroke-width="1.5"/>
  <text x="808" y="345" font-size="13" fill="#888">x</text>
  <text x="92" y="64" font-size="13" fill="#888">y</text>

  <path d="M 154 93.4 Q 440 566.6 726 93.4" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="220" y1="190" x2="704" y2="128" stroke="#7777cc" stroke-width="2.5"/>

  <line x1="462" y1="159" x2="462" y2="329" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="220" y1="190" x2="220" y2="340" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="704" y1="128" x2="704" y2="340" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="462" y1="329" x2="462" y2="340" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>

  <circle cx="220" cy="190" r="5" fill="#e8e8e8"/>
  <circle cx="704" cy="128" r="5" fill="#e8e8e8"/>
  <circle cx="462" cy="329" r="5" fill="#7ec8e3"/>
  <circle cx="462" cy="159" r="5" fill="#7777cc"/>

  <text x="196" y="178" font-size="13" fill="#888" text-anchor="end">f(a)</text>
  <text x="728" y="120" font-size="13" fill="#888">f(b)</text>
  <text x="520" y="118" font-size="14" font-weight="600" fill="#7777cc" text-anchor="end">현 — 두 점을 이은 직선</text>
  <text x="170" y="80" font-size="14" font-weight="600" fill="#7ec8e3">f</text>
  <text x="474" y="205" font-size="13" fill="#e05555">차이</text>

  <text x="220" y="362" font-size="13" fill="#888" text-anchor="middle">a</text>
  <text x="462" y="362" font-size="13" fill="#888" text-anchor="middle">λa + (1−λ)b</text>
  <text x="704" y="362" font-size="13" fill="#888" text-anchor="middle">b</text>

  <text x="60" y="398" font-size="13" fill="#888">f(λa + (1−λ)b) ≤ λf(a) + (1−λ)f(b)  —  왼쪽이 그래프의 높이, 오른쪽이 같은 자리에서 잰 현의 높이다</text>
</svg>
