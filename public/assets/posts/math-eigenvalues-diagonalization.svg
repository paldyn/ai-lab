<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="dgT" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e8e8e8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">대각화 — 고유기저에서 보면 곱셈 두 번이 전부다</text>

  <rect x="60" y="150" width="150" height="82" rx="8" fill="#101820" stroke="#555" stroke-width="1.5"/>
  <text x="135" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e8e8">x</text>
  <text x="135" y="212" text-anchor="middle" font-size="13" fill="#9aa4b8">원래 좌표</text>

  <line x1="218" y1="191" x2="252" y2="191" stroke="#e8e8e8" stroke-width="2.5" marker-end="url(#dgT)"/>
  <text x="235" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#7ec8e3">P⁻¹</text>

  <rect x="260" y="150" width="150" height="82" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="335" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e8e8">c</text>
  <text x="335" y="212" text-anchor="middle" font-size="13" fill="#9aa4b8">고유기저 좌표</text>

  <line x1="418" y1="191" x2="452" y2="191" stroke="#e8e8e8" stroke-width="2.5" marker-end="url(#dgT)"/>
  <text x="435" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#55c555">Λ</text>

  <rect x="460" y="150" width="150" height="82" rx="8" fill="#0f1a10" stroke="#55c555" stroke-width="2"/>
  <text x="535" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e8e8">Λc</text>
  <text x="535" y="212" text-anchor="middle" font-size="13" fill="#9aa4b8">축마다 λ배</text>

  <line x1="618" y1="191" x2="652" y2="191" stroke="#e8e8e8" stroke-width="2.5" marker-end="url(#dgT)"/>
  <text x="635" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#7ec8e3">P</text>

  <rect x="660" y="150" width="150" height="82" rx="8" fill="#101820" stroke="#555" stroke-width="1.5"/>
  <text x="735" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e8e8">Ax</text>
  <text x="735" y="212" text-anchor="middle" font-size="13" fill="#9aa4b8">원래 좌표로</text>

  <text x="60" y="106" font-size="14" fill="#9aa4b8">가운데 칸에서는 축끼리 섞이지 않는다. 그래서 A를 k번 곱하는 일이 λ를 k번 곱하는 일이 된다.</text>

  <rect x="60" y="266" width="750" height="70" rx="8" fill="#101820" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="82" y="294" font-size="14" font-weight="600" fill="#e8e8e8">A = 열 (2,1),(1,2) 이면 P 의 열은 (1,1) 과 (1,−1), Λ 는 3 과 1 을 대각에 놓은 것.</text>
  <text x="82" y="320" font-size="13" fill="#9aa4b8">8번 글에서 좌표를 다시 읽어 본 그 기저가 여기서 이 행렬의 고유기저로 다시 나온다.</text>
</svg>
