<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#0a0a0a" rx="12"/>
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">2단계 검색: 넓게 뽑고 좁게 고른다</text>
  <text x="440" y="72" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888">문서 100만 건 · 후보 k=50 · 최종 n=5 예시</text>

  <!-- stage boxes: y 110..200 -->
  <rect x="60" y="110" width="150" height="90" rx="8" fill="#141420" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="135" y="146" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3">질의</text>
  <text x="135" y="172" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#aaa">인코딩 1회</text>

  <rect x="250" y="110" width="170" height="90" rx="8" fill="#141420" stroke="#7777cc" stroke-width="1.5"/>
  <text x="335" y="138" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#9999dd">1단계 검색</text>
  <text x="335" y="162" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#aaa">바이인코더 + ANN</text>
  <text x="335" y="184" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#aaa">100만 → 50건</text>

  <rect x="460" y="110" width="170" height="90" rx="8" fill="#0d1a0d" stroke="#55c555" stroke-width="2"/>
  <text x="545" y="138" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#55c555">리랭커</text>
  <text x="545" y="162" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#aaa">크로스 인코더</text>
  <text x="545" y="184" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#aaa">짝 50개 채점 → 5건</text>

  <rect x="670" y="110" width="150" height="90" rx="8" fill="#141420" stroke="#e05555" stroke-width="1.5"/>
  <text x="745" y="146" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e05555">LLM 생성</text>
  <text x="745" y="172" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#aaa">컨텍스트 5건</text>

  <line x1="210" y1="155" x2="250" y2="155" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="155" x2="460" y2="155" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="630" y1="155" x2="670" y2="155" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <!-- comparison panels -->
  <rect x="60" y="232" width="360" height="100" rx="8" fill="#111" stroke="#333"/>
  <text x="84" y="260" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#9999dd">바이인코더</text>
  <text x="84" y="286" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#aaa">질의·문서를 따로 인코딩, 벡터끼리 견줌</text>
  <text x="84" y="310" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">문서 벡터를 미리 색인 · 전체에 쓸 수 있음</text>

  <rect x="460" y="232" width="360" height="100" rx="8" fill="#111" stroke="#333"/>
  <text x="484" y="260" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555">크로스 인코더</text>
  <text x="484" y="286" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#aaa">질의+문서를 한 줄로 넣어 점수 하나</text>
  <text x="484" y="310" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">미리 할 일 없음 · 후보 몇십 건에만</text>

  <!-- ceiling note -->
  <rect x="60" y="352" width="760" height="44" rx="8" fill="#1a1508" stroke="#d9a441" stroke-width="1"/>
  <text x="440" y="380" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8d09a">상한: 리랭킹 뒤 recall@5 ≤ 1단계 recall@50 — 리랭커는 목록 밖 문서를 데려오지 못한다</text>
</svg>
