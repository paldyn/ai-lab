<text x="60" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">표본 1,000개를 뽑아도 실제로 일하는 것은 아래 개수뿐이다 (단위 분산 정규분포 두 개, 평균 차이 Δ)</text>
