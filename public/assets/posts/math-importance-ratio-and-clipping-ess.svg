<text x="60" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">Var(w) = e^(Δ²) − 1 이고 유효 표본 비율은 e^(−Δ²)다.</text>
<text x="60" y="420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">KL은 Δ²/2 로 천천히 자라는데 대가는 그 제곱의 지수로 자란다.</text>
