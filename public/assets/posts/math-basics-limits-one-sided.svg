<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="450" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="osAx" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#e8e8e8">양쪽에서 다가가 보면 갈리는 두 자리</text>
  <text x="60" y="74" font-size="13" fill="#888">빈 동그라미는 그 점이 그래프에 없다는 표시다</text>

  <text x="240" y="116" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">좌극한과 우극한이 다르다</text>

  <line x1="110" y1="320" x2="390" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#osAx)"/>
  <line x1="240" y1="370" x2="240" y2="150" stroke="#888" stroke-width="1.5" marker-end="url(#osAx)"/>
  <text x="396" y="324" font-size="13" fill="#888">x</text>
  <line x1="236" y1="220" x2="244" y2="220" stroke="#444" stroke-width="1.5"/>
  <text x="222" y="274" font-size="12" fill="#888" text-anchor="end">1</text>
  <text x="228" y="224" font-size="12" fill="#888" text-anchor="end">2</text>
  <text x="246" y="340" font-size="12" fill="#888">0</text>

  <line x1="130" y1="270" x2="240" y2="270" stroke="#55c555" stroke-width="2.5"/>
  <line x1="240" y1="220" x2="360" y2="220" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="240" cy="270" r="6" fill="#0a0a0a" stroke="#55c555" stroke-width="2.5"/>
  <circle cx="240" cy="220" r="6" fill="#7ec8e3"/>

  <text x="130" y="294" font-size="13" fill="#55c555">좌극한 1</text>
  <text x="350" y="200" font-size="13" fill="#7ec8e3" text-anchor="end">우극한 2</text>
  <text x="240" y="384" font-size="13" fill="#e05555" text-anchor="middle">둘이 달라 x → 0 의 극한이 없다</text>

  <text x="640" y="116" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">극한과 함숫값이 다르다</text>

  <line x1="510" y1="320" x2="790" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#osAx)"/>
  <line x1="580" y1="370" x2="580" y2="150" stroke="#888" stroke-width="1.5" marker-end="url(#osAx)"/>
  <text x="796" y="324" font-size="13" fill="#888">x</text>
  <line x1="620" y1="316" x2="620" y2="324" stroke="#444" stroke-width="1.5"/>
  <text x="620" y="340" font-size="12" fill="#888" text-anchor="middle">1</text>
  <line x1="576" y1="160" x2="584" y2="160" stroke="#444" stroke-width="1.5"/>
  <text x="568" y="164" font-size="12" fill="#888" text-anchor="end">4</text>

  <line x1="540" y1="320" x2="680" y2="180" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="620" cy="240" r="6" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="620" cy="160" r="6" fill="#e05555"/>
  <text x="634" y="156" font-size="13" fill="#e05555">f(1) = 4 로 정해 두어도</text>

  <line x1="612" y1="240" x2="572" y2="240" stroke="#7ec8e3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="564" y="245" font-size="13" fill="#7ec8e3" text-anchor="end">극한은 2</text>

  <text x="640" y="384" font-size="13" fill="#888" text-anchor="middle">극한은 다가가는 동안의 이야기다</text>

  <rect x="60" y="404" width="760" height="34" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="84" y="426" font-size="13" fill="#e8e8e8">좌극한과 우극한이 같을 때만 극한이 있다고 한다. 그리고 그 값은 f(a) 와 무관하다.</text>
</svg>
