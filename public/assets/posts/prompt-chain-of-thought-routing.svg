<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#666666"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">CoT 라우팅</text>
  <text x="440" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#e8e8e8">질문을 먼저 가르고, 필요한 곳에만 추론을 붙인다</text>

  <rect x="320" y="96" width="240" height="48" rx="8" fill="#111827" stroke="#3a4a6e"/>
  <text x="440" y="125" text-anchor="middle" font-size="15" fill="#e8e8e8">들어온 질문</text>
  <line x1="440" y1="144" x2="440" y2="172" stroke="#666666" stroke-width="2" marker-end="url(#arrR)"/>

  <rect x="260" y="172" width="360" height="60" rx="8" fill="#1a1a2e" stroke="#7777cc"/>
  <text x="440" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#7777cc">분류</text>
  <text x="440" y="218" text-anchor="middle" font-size="13" fill="#888">여러 걸음이 필요한가 · 정확한 계산인가</text>

  <path d="M 340 232 L 340 252 L 180 252 L 180 290" fill="none" stroke="#666666" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="440" y1="232" x2="440" y2="290" stroke="#666666" stroke-width="2" marker-end="url(#arrR)"/>
  <path d="M 540 232 L 540 252 L 700 252 L 700 290" fill="none" stroke="#666666" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- 갈래 1 -->
  <rect x="60" y="290" width="240" height="70" rx="8" fill="#111111" stroke="#7ec8e3"/>
  <text x="180" y="319" text-anchor="middle" font-size="15" font-weight="600" fill="#7ec8e3">바로 답</text>
  <text x="180" y="341" text-anchor="middle" font-size="13" fill="#e8e8e8">사실 조회 · 짧은 분류</text>
  <text x="180" y="390" text-anchor="middle" font-size="13" fill="#888">출력 짧음 · 지연 작음</text>

  <!-- 갈래 2 -->
  <rect x="320" y="290" width="240" height="70" rx="8" fill="#0d1117" stroke="#55c555"/>
  <text x="440" y="319" text-anchor="middle" font-size="15" font-weight="600" fill="#55c555">CoT</text>
  <text x="440" y="341" text-anchor="middle" font-size="13" fill="#e8e8e8">여러 조건 · 여러 걸음</text>
  <text x="440" y="390" text-anchor="middle" font-size="13" fill="#888">출력 수백 토큰 · 지연 큼</text>

  <!-- 갈래 3 -->
  <rect x="580" y="290" width="240" height="70" rx="8" fill="#111111" stroke="#e0a055"/>
  <text x="700" y="319" text-anchor="middle" font-size="15" font-weight="600" fill="#e0a055">코드 실행</text>
  <text x="700" y="341" text-anchor="middle" font-size="13" fill="#e8e8e8">정확한 수치 계산</text>
  <text x="700" y="390" text-anchor="middle" font-size="13" fill="#888">계산은 실행기가 맡는다</text>

  <text x="440" y="440" text-anchor="middle" font-size="13" fill="#888">분류 호출은 작은 모델로 예/아니오만 받는다 — 그 비용이 CoT를 덜어 낸 몫보다 작아야 한다</text>
</svg>
