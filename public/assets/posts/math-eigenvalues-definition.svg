<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="egG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="egA" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="410" rx="12" fill="#0a0a0a"/>

  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">A = 열 (2,1), (1,2) 가 두 벡터에 하는 일</text>

  <!-- left: ordinary vector -->
  <text x="250" y="88" text-anchor="middle" font-size="16" font-weight="600" fill="#e05555">보통 벡터 — 방향이 바뀐다</text>
  <line x1="140" y1="300" x2="410" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="200" y1="320" x2="200" y2="150" stroke="#888" stroke-width="1.5"/>
  <line x1="200" y1="300" x2="280" y2="300" stroke="#7777cc" stroke-width="2.5" marker-end="url(#egG)"/>
  <line x1="200" y1="300" x2="360" y2="220" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#egA)"/>
  <text x="238" y="322" font-size="14" font-weight="600" fill="#7777cc">x = (2, 0)</text>
  <text x="300" y="204" font-size="14" font-weight="600" fill="#7ec8e3">Ax = (4, 2)</text>
  <text x="250" y="356" text-anchor="middle" font-size="13" fill="#888">가리키는 쪽 자체가 달라졌다</text>

  <!-- right: eigenvector -->
  <text x="650" y="88" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">고유벡터 — 방향이 그대로다</text>
  <line x1="540" y1="300" x2="810" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="600" y1="320" x2="600" y2="150" stroke="#888" stroke-width="1.5"/>
  <line x1="588" y1="312" x2="740" y2="160" stroke="#55c555" stroke-width="6" opacity="0.28"/>
  <line x1="600" y1="300" x2="640" y2="260" stroke="#7777cc" stroke-width="2.5" marker-end="url(#egG)"/>
  <line x1="600" y1="300" x2="720" y2="180" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#egA)"/>
  <text x="648" y="284" font-size="14" font-weight="600" fill="#7777cc">v = (1, 1)</text>
  <text x="730" y="176" font-size="14" font-weight="600" fill="#7ec8e3">Av = (3, 3)</text>
  <text x="650" y="356" text-anchor="middle" font-size="13" fill="#55c555">같은 직선 위에 남고 길이만 3배</text>

  <text x="60" y="392" font-size="14" font-weight="600" fill="#e8e8e8">Av = λv 를 만족하는 0이 아닌 v 가 고유벡터, 그때의 λ 가 고윳값이다.</text>
</svg>
