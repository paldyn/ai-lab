<text x="230" y="255" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#e8e8e8" text-anchor="middle">j</text>
<path d="M 124 238 Q 170 205 216 238" fill="none" stroke="#7ec8e3" stroke-width="2.5" marker-end="url(#arrb)"/>
<text x="170" y="206" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">i → j  0.8</text>
<path d="M 216 262 Q 170 295 124 262" fill="none" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrr)"/>
<text x="170" y="306" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">j → i  0.3</text>
<text x="170" y="332" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">가장 가까운 이웃은 1</text>

<line x1="280" y1="230" x2="330" y2="230" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

<rect x="330" y="110" width="220" height="240" rx="10" fill="#111" stroke="#3a4a6e" stroke-width="1"/>
<text x="440" y="140" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">② 대칭화</text>
<text x="440" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">두 방향을 하나로 합친다</text>
<text x="440" y="206" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8e8e8" text-anchor="middle">0.8 + 0.3 − 0.8 × 0.3</text>
<text x="440" y="232" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#55c555" text-anchor="middle">= 0.86</text>
