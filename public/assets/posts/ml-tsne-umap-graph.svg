<text x="380" y="291" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#e8e8e8" text-anchor="middle">i</text>
<circle cx="500" cy="286" r="18" fill="#0d1a2a" stroke="#7ec8e3" stroke-width="2"/>
<text x="500" y="291" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#e8e8e8" text-anchor="middle">j</text>
<line x1="398" y1="286" x2="482" y2="286" stroke="#55c555" stroke-width="3"/>
<text x="440" y="332" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">한쪽만 이어져도 선이 남는다</text>

<line x1="550" y1="230" x2="600" y2="230" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

<rect x="600" y="110" width="220" height="240" rx="10" fill="#111" stroke="#3a4a6e" stroke-width="1"/>
<text x="710" y="140" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8" text-anchor="middle">③ 2차원 배치</text>
<text x="710" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">교차 엔트로피를 줄인다</text>
<circle cx="650" cy="220" r="5" fill="#7ec8e3"/><circle cx="664" cy="212" r="5" fill="#7ec8e3"/><circle cx="660" cy="232" r="5" fill="#7ec8e3"/><circle cx="676" cy="226" r="5" fill="#7ec8e3"/><circle cx="670" cy="244" r="5" fill="#7ec8e3"/>
<circle cx="752" cy="276" r="5" fill="#e05555"/><circle cx="766" cy="268" r="5" fill="#e05555"/><circle cx="760" cy="290" r="5" fill="#e05555"/><circle cx="776" cy="284" r="5" fill="#e05555"/><circle cx="744" cy="292" r="5" fill="#e05555"/>
<circle cx="760" cy="206" r="5" fill="#55c555"/><circle cx="774" cy="214" r="5" fill="#55c555"/><circle cx="752" cy="220" r="5" fill="#55c555"/><circle cx="768" cy="228" r="5" fill="#55c555"/>
<text x="710" y="332" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">min_dist가 뭉침을 정한다</text>
