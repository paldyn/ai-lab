<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="npArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">음수끼리 곱하면 왜 양수가 되는가</text>
  <text x="60" y="82" font-size="13" fill="#888">규칙이라서가 아니라, 앞에서 하던 계산이 계속 맞으려면 그럴 수밖에 없다</text>

  <rect x="280" y="110" width="320" height="52" rx="6" fill="#101010" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="142" font-size="18" font-weight="700" fill="#e8e8e8" text-anchor="middle">(−3) × (4 + (−4))</text>

  <line x1="400" y1="162" x2="270" y2="210" stroke="#888" stroke-width="2" marker-end="url(#npArr)"/>
  <line x1="480" y1="162" x2="610" y2="210" stroke="#888" stroke-width="2" marker-end="url(#npArr)"/>

  <rect x="90" y="210" width="320" height="76" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="250" y="238" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">괄호 안을 먼저 계산하면</text>
  <text x="250" y="266" font-size="17" fill="#7ec8e3" text-anchor="middle">(−3) × 0 = 0</text>

  <rect x="470" y="210" width="320" height="76" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="630" y="238" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">분배법칙으로 풀면</text>
  <text x="630" y="266" font-size="17" fill="#7ec8e3" text-anchor="middle">−12 + (−3) × (−4)</text>

  <line x1="250" y1="286" x2="380" y2="330" stroke="#888" stroke-width="2" marker-end="url(#npArr)"/>
  <line x1="630" y1="286" x2="500" y2="330" stroke="#888" stroke-width="2" marker-end="url(#npArr)"/>

  <rect x="230" y="330" width="420" height="80" rx="6" fill="#101010" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="358" font-size="15" font-weight="600" fill="#e8e8e8" text-anchor="middle">두 값은 같아야 하므로</text>
  <text x="440" y="390" font-size="20" font-weight="700" fill="#7ec8e3" text-anchor="middle">(−3) × (−4) = 12</text>
</svg>
