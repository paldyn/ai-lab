<svg xmlns="http://www.w3.org/2000/svg" width="880" height="576" viewBox="0 0 880 576">
<rect width="880" height="576" rx="12" fill="#0a0a0a"/>
<text x="440" y="42" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">0 을 곱하는 것과 −inf 를 더하는 것</text>
<defs><marker id="a3r" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/></marker><marker id="a3g" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/></marker></defs>
<text x="240" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#e05555" font-weight="600" text-anchor="middle">softmax 뒤에 0 을 곱하면</text>
<text x="640" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" fill="#55c555" font-weight="600" text-anchor="middle">softmax 앞에 −inf 를 더하면</text>
<rect x="60" y="132" width="340" height="58" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="230" y="157" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">점수  (2, 1, 900, 0.5)</text>
<text x="230" y="177" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8" text-anchor="middle">네 번째까지 그대로 들어간다</text>
<rect x="480" y="132" width="340" height="58" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="650" y="157" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">점수  (2, 1, −inf, −inf)</text>
<text x="650" y="177" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8" text-anchor="middle">가릴 자리에 −inf 를 더했다</text>
<line x1="230" y1="190" x2="230" y2="210" stroke="#e05555" stroke-width="2" marker-end="url(#a3r)"/>
<line x1="650" y1="190" x2="650" y2="210" stroke="#55c555" stroke-width="2" marker-end="url(#a3g)"/>
<rect x="60" y="212" width="340" height="58" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="230" y="237" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">m = 900 을 뺀다</text>
<text x="230" y="257" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8" text-anchor="middle">2−900 = −898 → e^(−898) = 0.0</text>
<rect x="480" y="212" width="340" height="58" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="650" y="237" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">m = 2 를 뺀다</text>
<text x="650" y="257" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8" text-anchor="middle">2−2 = 0 → e^0 = 1</text>
<line x1="230" y1="270" x2="230" y2="290" stroke="#e05555" stroke-width="2" marker-end="url(#a3r)"/>
<line x1="650" y1="270" x2="650" y2="290" stroke="#55c555" stroke-width="2" marker-end="url(#a3g)"/>
<rect x="60" y="292" width="340" height="58" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="230" y="317" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">softmax = (0, 0, 1, 0)</text>
<text x="230" y="337" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555" text-anchor="middle">살릴 자리가 전부 0 으로 잘렸다</text>
<rect x="480" y="292" width="340" height="58" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="650" y="317" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">e^(−inf) = 0 (정확히)</text>
<text x="650" y="337" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555" text-anchor="middle">분모에 아예 안 들어간다</text>
<line x1="230" y1="350" x2="230" y2="370" stroke="#e05555" stroke-width="2" marker-end="url(#a3r)"/>
<line x1="650" y1="350" x2="650" y2="370" stroke="#55c555" stroke-width="2" marker-end="url(#a3g)"/>
<rect x="60" y="372" width="340" height="58" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="230" y="397" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">마스크를 곱한다 → (0, 0, 0, 0)</text>
<text x="230" y="417" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555" text-anchor="middle">합이 0</text>
<rect x="480" y="372" width="340" height="58" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="650" y="397" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">softmax = (0.7311, 0.2689, 0, 0)</text>
<text x="650" y="417" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555" text-anchor="middle">합이 1</text>
<line x1="230" y1="430" x2="230" y2="450" stroke="#e05555" stroke-width="2" marker-end="url(#a3r)"/>
<line x1="650" y1="430" x2="650" y2="450" stroke="#55c555" stroke-width="2" marker-end="url(#a3g)"/>
<rect x="60" y="452" width="340" height="58" rx="8" fill="#000000" stroke="#e05555" stroke-width="1.5"/>
<text x="230" y="477" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">재정규화 → 0 ÷ 0</text>
<text x="230" y="497" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555" text-anchor="middle">NaN</text>
<rect x="480" y="452" width="340" height="58" rx="8" fill="#000000" stroke="#55c555" stroke-width="1.5"/>
<text x="650" y="477" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">끝</text>
<text x="650" y="497" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555" text-anchor="middle">따로 정규화할 것이 없다</text>
<text x="440" y="546" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">가려야 할 점수가 커도 −inf 쪽은 아무 일이 없다 — 최댓값 자리를 빼앗기지 않기 때문이다</text>
</svg>
