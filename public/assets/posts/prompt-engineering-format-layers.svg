<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460">
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="880" height="460" fill="#0a0a0a" rx="12"/>
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">형식을 강제하는 세 층</text>
  <text x="440" y="72" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">아래로 갈수록 확실하다</text>

  <rect x="60" y="100" width="560" height="90" rx="10" fill="#141414" stroke="#e05555" stroke-width="1.5"/>
  <text x="84" y="134" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e05555">① 부탁 — 지시문에 적는다</text>
  <text x="84" y="164" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#bbbbbb">「JSON으로만 답하라」 · 머리말·코드 펜스·빠진 키가 섞인다</text>

  <rect x="60" y="220" width="560" height="90" rx="10" fill="#141414" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="84" y="254" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#7ec8e3">② 예시 — 원하는 객체를 보여 준다</text>
  <text x="84" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#bbbbbb">키 이름과 중첩이 안정된다 · 여전히 확률적이다</text>

  <rect x="60" y="340" width="560" height="90" rx="10" fill="#141414" stroke="#55c555" stroke-width="1.5"/>
  <text x="84" y="374" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#55c555">③ 스키마 — 디코딩에서 막는다</text>
  <text x="84" y="404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#bbbbbb">벗어나는 토큰을 못 고른다 · 모양만 보장, 값은 아니다</text>

  <line x1="340" y1="190" x2="340" y2="220" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="310" x2="340" y2="340" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="660" y="100" width="160" height="330" rx="10" fill="#141414" stroke="#3a4a6e" stroke-width="1"/>
  <text x="740" y="134" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#e8e8e8">가령 하루 10만 건</text>
  <text x="740" y="200" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">99%가 맞으면</text>
  <text x="740" y="222" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">매일 1,000건 깨짐</text>
  <text x="740" y="268" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">재시도 비용</text>
  <text x="740" y="290" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">지연이 붙는다</text>
  <text x="740" y="374" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">형태 오류 0</text>
  <text x="740" y="396" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">값 검증은 따로</text>
</svg>
