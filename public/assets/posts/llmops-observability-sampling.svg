<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="490" rx="12" fill="#0a0a0a"/>

  <text x="50" y="44" font-size="22" font-weight="700" fill="#e8e8e8">무작위 1%와 끝난 뒤 고르는 규칙</text>
  <text x="50" y="72" font-size="13" fill="#888">하루 10만 요청, 오류 500건(0.5%), p95를 넘는 느린 요청 5,000건일 때 남는 것</text>

  <text x="230" y="110" font-size="16" font-weight="600" fill="#e05555" text-anchor="middle">무작위 1% 샘플링</text>
  <text x="650" y="110" font-size="16" font-weight="600" fill="#55c555" text-anchor="middle">끝난 뒤에 고르는 규칙</text>

  <rect x="50" y="126" width="360" height="60" rx="8" fill="#101820" stroke="#e05555" stroke-width="1.5"/>
  <text x="74" y="150" font-size="14" font-weight="600" fill="#e8e8e8">오류 500건 → 5건</text>
  <text x="74" y="170" font-size="12" fill="#9aa4b8">신고받은 요청이 남아 있을 확률도 1%</text>

  <rect x="50" y="198" width="360" height="60" rx="8" fill="#101820" stroke="#555" stroke-width="1"/>
  <text x="74" y="222" font-size="14" font-weight="600" fill="#e8e8e8">정상 99,500건 → 995건</text>
  <text x="74" y="242" font-size="12" fill="#9aa4b8">거의 똑같은 성공 트레이스 천 건</text>

  <rect x="470" y="126" width="360" height="60" rx="8" fill="#101820" stroke="#55c555" stroke-width="1.5"/>
  <text x="494" y="150" font-size="14" font-weight="600" fill="#e8e8e8">오류 500건 → 500건</text>
  <text x="494" y="170" font-size="12" fill="#9aa4b8">전부 남긴다</text>

  <rect x="470" y="198" width="360" height="60" rx="8" fill="#101820" stroke="#55c555" stroke-width="1.5"/>
  <text x="494" y="222" font-size="14" font-weight="600" fill="#e8e8e8">느린 요청 5,000건 → 5,000건</text>
  <text x="494" y="242" font-size="12" fill="#9aa4b8">p95를 넘는 것 전부</text>

  <rect x="470" y="270" width="360" height="60" rx="8" fill="#101820" stroke="#555" stroke-width="1"/>
  <text x="494" y="294" font-size="14" font-weight="600" fill="#e8e8e8">정상 94,500건 → 1,890건</text>
  <text x="494" y="314" font-size="12" fill="#9aa4b8">평상시를 아는 데 필요한 2%만</text>

  <rect x="50" y="352" width="360" height="66" rx="8" fill="#1a1010" stroke="#e05555" stroke-width="1.5"/>
  <text x="74" y="379" font-size="17" font-weight="700" fill="#e05555">1,000건 남는다 (1%)</text>
  <text x="74" y="402" font-size="12" fill="#9aa4b8">정작 볼 가치가 있는 것이 거의 다 빠졌다</text>

  <rect x="470" y="352" width="360" height="66" rx="8" fill="#101a10" stroke="#55c555" stroke-width="1.5"/>
  <text x="494" y="379" font-size="17" font-weight="700" fill="#55c555">7,400건 남는다 (7.4%)</text>
  <text x="494" y="402" font-size="12" fill="#9aa4b8">저장량은 일곱 배, 오류 트레이스는 백 배</text>

  <text x="50" y="452" font-size="13" fill="#888">시작 시점에는 이 요청이 느릴지 실패할지 알 수 없지만, 끝난 뒤에는 알 수 있다.</text>
</svg>
