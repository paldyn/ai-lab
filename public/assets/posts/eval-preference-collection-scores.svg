  <text x="674" y="300" font-size="12" fill="#888" text-anchor="middle">+0.10</text>

  <circle cx="762" cy="250" r="7" fill="#55c555"/>
  <text x="762" y="232" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">A</text>
  <text x="762" y="300" font-size="12" fill="#888" text-anchor="middle">+0.73</text>

  <path d="M 674 214 L 674 190 L 762 190 L 762 214" fill="none" stroke="#c58a55" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#pfArr)"/>
  <text x="718" y="176" font-size="12" fill="#c58a55" text-anchor="middle">차이 0.63 — A가 이길 확률 65%</text>

  <text x="60" y="366" font-size="13" fill="#e8e8e8">점수 차이가 곧 이길 확률이다. 0.63 차이면 약 65%, 1.4 차이면 약 80%다. 축을 통째로 옮겨도 차이는 그대로라 기준점은 아무 데나 두면 된다.</text>
