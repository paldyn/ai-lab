  <line x1="413" y1="400" x2="413" y2="410" stroke="#444" stroke-width="1"/>
  <line x1="507" y1="400" x2="507" y2="410" stroke="#444" stroke-width="1"/>
  <line x1="601" y1="400" x2="601" y2="410" stroke="#444" stroke-width="1"/>
