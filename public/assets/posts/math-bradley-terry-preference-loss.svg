  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">벌어진 쌍은 거의 밀지 않는다</text>
  <text x="60" y="72" font-size="14" fill="#888">가로축은 점수차 Δ = r(고른 답) − r(버린 답). 위는 손실, 아래는 기울기의 크기.</text>

  <text x="60" y="106" font-size="15" font-weight="600" fill="#7ec8e3">손실  −log σ(Δ)</text>
  <line x1="130" y1="250" x2="790" y2="250" stroke="#888" stroke-width="1.5"/>
  <line x1="130" y1="250" x2="130" y2="118" stroke="#888" stroke-width="1.5"/>
  <line x1="130" y1="130" x2="790" y2="130" stroke="#444" stroke-width="1"/>
  <line x1="130" y1="190" x2="790" y2="190" stroke="#444" stroke-width="1"/>
  <text x="100" y="135" font-size="13" fill="#888">3</text>
  <text x="100" y="195" font-size="13" fill="#888">1.5</text>
  <text x="106" y="255" font-size="13" fill="#888">0</text>
  <polyline points="130,128 154,138 177,147 201,156 224,165 248,174 271,182 295,190 319,197 342,205 366,211 389,217 413,222 436,227 460,231 484,235 507,237 531,240 554,242 578,244 601,245 625,246 649,247 672,248 696,248 719,248 743,249 766,249 790,249"
