  <text x="806" y="405" font-size="13" fill="#888">Δ</text>

  <text x="60" y="456" font-size="13" fill="#888">뒤집혀 있는 쌍(Δ &lt; 0)은 세게 밀고, 이미 크게 벌어진 쌍은 거의 밀지 않는다.</text>
