  <line x1="413" y1="250" x2="413" y2="118" stroke="#555" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="413" cy="222" r="5" fill="#55c555"/>
  <text x="430" y="212" font-size="13" fill="#55c555">Δ=0 → 0.693</text>

  <text x="60" y="300" font-size="15" font-weight="600" fill="#e05555">기울기의 크기  σ(−Δ)</text>
  <line x1="130" y1="400" x2="790" y2="400" stroke="#888" stroke-width="1.5"/>
  <line x1="130" y1="400" x2="130" y2="316" stroke="#888" stroke-width="1.5"/>
  <line x1="130" y1="320" x2="790" y2="320" stroke="#444" stroke-width="1"/>
