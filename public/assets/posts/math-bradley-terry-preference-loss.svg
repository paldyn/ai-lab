  <circle cx="413" cy="360" r="5" fill="#55c555"/>
  <circle cx="696" cy="396" r="5" fill="#55c555"/>
  <text x="430" y="350" font-size="13" fill="#55c555">Δ=0 → 0.500</text>
  <text x="620" y="378" font-size="13" fill="#55c555">Δ=3 → 0.047</text>

  <line x1="130" y1="400" x2="130" y2="410" stroke="#444" stroke-width="1"/>
  <line x1="224" y1="400" x2="224" y2="410" stroke="#444" stroke-width="1"/>
