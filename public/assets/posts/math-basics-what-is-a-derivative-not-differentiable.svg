<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#e8e8e8">정의식의 극한이 없는 세 모양</text>

  <text x="60" y="104" font-size="16" font-weight="600" fill="#e8e8e8">① 꺾인 점</text>
  <text x="327" y="104" font-size="16" font-weight="600" fill="#e8e8e8">② 수직 접선</text>
  <text x="594" y="104" font-size="16" font-weight="600" fill="#e8e8e8">③ 끊긴 점</text>

  <!-- panel 1 -->
  <line x1="93" y1="270" x2="253" y2="270" stroke="#888" stroke-width="1.5"/>
  <line x1="173" y1="150" x2="173" y2="300" stroke="#888" stroke-width="1.5"/>
  <path d="M 113 210 L 173 270 L 233 210" stroke="#7ec8e3" stroke-width="2.5" fill="none"/>
  <circle cx="173" cy="270" r="5" fill="#e05555"/>
  <text x="60" y="322" font-size="13" fill="#888">y = |x| 의 x=0 입니다. 왼쪽에서</text>
  <text x="60" y="342" font-size="13" fill="#888">−1, 오른쪽에서 1로 갈립니다.</text>

  <!-- panel 2 -->
  <line x1="360" y1="270" x2="520" y2="270" stroke="#888" stroke-width="1.5"/>
  <line x1="440" y1="150" x2="440" y2="300" stroke="#888" stroke-width="1.5"/>
  <path d="M 385 312 C 425 306, 434 279, 440 270 C 446 261, 455 234, 495 228" stroke="#7ec8e3" stroke-width="2.5" fill="none"/>
  <line x1="440" y1="182" x2="440" y2="290" stroke="#55c555" stroke-width="2.5" stroke-dasharray="5,3"/>
  <circle cx="440" cy="270" r="5" fill="#e05555"/>
  <text x="327" y="322" font-size="13" fill="#888">접선이 세로로 서서 기울기가</text>
  <text x="327" y="342" font-size="13" fill="#888">수로 나오지 않습니다.</text>

  <!-- panel 3 -->
  <line x1="627" y1="270" x2="787" y2="270" stroke="#888" stroke-width="1.5"/>
  <line x1="707" y1="150" x2="707" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="647" y1="290" x2="703" y2="283" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="705" cy="283" r="5" fill="#0a0a0a" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="711" y1="222" x2="767" y2="215" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="709" cy="222" r="5" fill="#7ec8e3"/>
  <text x="594" y="322" font-size="13" fill="#888">한 점에서 값이 뛰어 있습니다.</text>
  <text x="594" y="342" font-size="13" fill="#888">끊긴 자리는 미분되지 않습니다.</text>
</svg>
