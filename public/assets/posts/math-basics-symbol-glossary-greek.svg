<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">그리스 문자 스물넷 — 뜻이 아니라 이름</text>
  <text x="60" y="82" font-size="13" fill="#888">한 번에 외우지 말고, 뒤에서 만날 때마다 돌아와 소리 내어 읽으면 된다</text>

  <text x="70" y="130" font-size="20" fill="#7ec8e3">α</text>
  <text x="98" y="130" font-size="14" fill="#888">알파</text>
  <text x="270" y="130" font-size="20" fill="#7ec8e3">β</text>
  <text x="298" y="130" font-size="14" fill="#888">베타</text>
  <text x="470" y="130" font-size="20" fill="#7ec8e3">γ</text>
  <text x="498" y="130" font-size="14" fill="#888">감마</text>
  <text x="670" y="130" font-size="20" fill="#7ec8e3">δ</text>
  <text x="698" y="130" font-size="14" fill="#888">델타</text>

  <text x="70" y="172" font-size="20" fill="#7ec8e3">ε</text>
  <text x="98" y="172" font-size="14" fill="#888">엡실론</text>
  <text x="270" y="172" font-size="20" fill="#7ec8e3">ζ</text>
  <text x="298" y="172" font-size="14" fill="#888">제타</text>
  <text x="470" y="172" font-size="20" fill="#7ec8e3">η</text>
  <text x="498" y="172" font-size="14" fill="#888">에타</text>
  <text x="670" y="172" font-size="20" fill="#7ec8e3">θ</text>
  <text x="698" y="172" font-size="14" fill="#888">세타</text>

  <text x="70" y="214" font-size="20" fill="#7ec8e3">ι</text>
  <text x="98" y="214" font-size="14" fill="#888">이오타</text>
  <text x="270" y="214" font-size="20" fill="#7ec8e3">κ</text>
  <text x="298" y="214" font-size="14" fill="#888">카파</text>
  <text x="470" y="214" font-size="20" fill="#7ec8e3">λ</text>
  <text x="498" y="214" font-size="14" fill="#888">람다</text>
  <text x="670" y="214" font-size="20" fill="#7ec8e3">μ</text>
  <text x="698" y="214" font-size="14" fill="#888">뮤</text>

  <text x="70" y="256" font-size="20" fill="#7ec8e3">ν</text>
  <text x="98" y="256" font-size="14" fill="#888">뉴</text>
  <text x="270" y="256" font-size="20" fill="#7ec8e3">ξ</text>
  <text x="298" y="256" font-size="14" fill="#888">크시</text>
  <text x="470" y="256" font-size="20" fill="#7ec8e3">ο</text>
  <text x="498" y="256" font-size="14" fill="#888">오미크론</text>
  <text x="670" y="256" font-size="20" fill="#7ec8e3">π</text>
  <text x="698" y="256" font-size="14" fill="#888">파이</text>

  <text x="70" y="298" font-size="20" fill="#7ec8e3">ρ</text>
  <text x="98" y="298" font-size="14" fill="#888">로</text>
  <text x="270" y="298" font-size="20" fill="#7ec8e3">σ</text>
  <text x="298" y="298" font-size="14" fill="#888">시그마</text>
  <text x="470" y="298" font-size="20" fill="#7ec8e3">τ</text>
  <text x="498" y="298" font-size="14" fill="#888">타우</text>
  <text x="670" y="298" font-size="20" fill="#7ec8e3">υ</text>
  <text x="698" y="298" font-size="14" fill="#888">입실론</text>

  <text x="70" y="340" font-size="20" fill="#7ec8e3">φ</text>
  <text x="98" y="340" font-size="14" fill="#e05555">피</text>
  <text x="270" y="340" font-size="20" fill="#7ec8e3">χ</text>
  <text x="298" y="340" font-size="14" fill="#888">카이</text>
  <text x="470" y="340" font-size="20" fill="#7ec8e3">ψ</text>
  <text x="498" y="340" font-size="14" fill="#888">프시</text>
  <text x="670" y="340" font-size="20" fill="#7ec8e3">ω</text>
  <text x="698" y="340" font-size="14" fill="#888">오메가</text>

  <text x="60" y="382" font-size="13" fill="#e05555">π 와 φ 를 둘 다 「파이」라 부르면 섞인다. 뒤엣것은 「피」라고 읽으면 갈린다</text>
</svg>
