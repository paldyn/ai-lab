<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect x="0" y="0" width="880" height="350" rx="12" fill="#0a0a0a"/>
  <text x="62" y="42" font-size="22" font-weight="700" fill="#e8e8e8">CFG를 올린다고 프롬프트를 잘 따르는 것은 아니다</text>
  <text x="62" y="68" font-size="13" fill="#888">낮으면 프롬프트를 흘리고, 높으면 그림이 탄다.</text>

  <rect x="100" y="106" width="200" height="59" rx="6" fill="#e05555" fill-opacity="0.12" stroke="#e05555" stroke-width="1.5"/>
  <text x="120" y="130" font-size="13" font-weight="600" fill="#e05555">너무 낮다</text>
  <text x="120" y="150" font-size="11" fill="#9aa4b8">프롬프트를 흘린다</text>

  <rect x="300" y="106" width="260" height="59" rx="6" fill="#55c555" fill-opacity="0.12" stroke="#55c555" stroke-width="1.5"/>
  <text x="320" y="130" font-size="13" font-weight="600" fill="#55c555">쓸 만한 구간</text>
  <text x="320" y="150" font-size="11" fill="#9aa4b8">모델·샘플러마다 자리가 다르다</text>

  <rect x="560" y="106" width="240" height="59" rx="6" fill="#e05555" fill-opacity="0.12" stroke="#e05555" stroke-width="1.5"/>
  <text x="580" y="130" font-size="13" font-weight="600" fill="#e05555">너무 높다</text>
  <text x="580" y="150" font-size="11" fill="#9aa4b8">색이 타고 윤곽이 뭉개진다</text>

  <line x1="100" y1="184" x2="810" y2="184" stroke="#3a4a6e" stroke-width="1.5"/>
  <line x1="100" y1="184" x2="100" y2="192" stroke="#3a4a6e" stroke-width="1.5"/>
  <line x1="300" y1="184" x2="300" y2="192" stroke="#3a4a6e" stroke-width="1.5"/>
  <line x1="430" y1="184" x2="430" y2="192" stroke="#3a4a6e" stroke-width="1.5"/>
  <line x1="560" y1="184" x2="560" y2="192" stroke="#3a4a6e" stroke-width="1.5"/>
  <line x1="800" y1="184" x2="800" y2="192" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="100" y="210" text-anchor="middle" font-size="11" fill="#5a6472">1</text>
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#5a6472">5</text>
  <text x="430" y="210" text-anchor="middle" font-size="11" fill="#5a6472">8</text>
  <text x="560" y="210" text-anchor="middle" font-size="11" fill="#5a6472">12</text>
  <text x="800" y="210" text-anchor="middle" font-size="11" fill="#5a6472">20</text>
  <text x="62" y="188" font-size="11" fill="#5a6472">CFG</text>

  <text x="62" y="252" font-size="12" fill="#9aa4b8">같은 시드·같은 프롬프트로 CFG만 바꿔 다섯 장을 뽑아 보면 그 모델의 구간이 보인다.</text>
  <text x="62" y="272" font-size="12" fill="#9aa4b8">모델이 바뀌면 구간도 통째로 바뀐다. 증류로 단계를 줄인 빠른 모델은 1~2에서 가장 좋다.</text>
  <text x="62" y="292" font-size="12" fill="#9aa4b8">프롬프트를 안 따른다고 CFG부터 올리는 것이 가장 흔한 잘못된 반응이다.</text>
</svg>
