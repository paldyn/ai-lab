<svg xmlns="http://www.w3.org/2000/svg" width="880" height="590" viewBox="0 0 880 590" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="dpvArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#6a7180"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="590" fill="#0a0a0a" rx="12"/>

  <text x="60" y="52" font-size="22" font-weight="700" fill="#e8e8e8">DPO 변형의 계보</text>
  <text x="60" y="78" font-size="14" fill="#9aa4b8">손실 함수를 바꿔 단계를 하나씩 덜어 낸다</text>

  <!-- RLHF -->
  <rect x="315" y="110" width="250" height="64" rx="8" fill="#12161d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="331" y="138" font-size="15" font-weight="700" fill="#7ec8e3">RLHF (PPO)</text>
  <text x="331" y="159" font-size="11" fill="#9aa4b8">정책 · 기준 · 보상 · 가치 — 모델 넷</text>

  <line x1="440" y1="174" x2="440" y2="212" stroke="#6a7180" stroke-width="2" marker-end="url(#dpvArr)"/>

  <!-- DPO -->
  <rect x="315" y="212" width="250" height="64" rx="8" fill="#12161d" stroke="#55c555" stroke-width="1.5"/>
  <text x="331" y="240" font-size="15" font-weight="700" fill="#55c555">DPO</text>
  <text x="331" y="261" font-size="11" fill="#9aa4b8">보상 모델을 지운다 — 모델 둘</text>

  <!-- 갈래 -->
  <line x1="440" y1="276" x2="440" y2="306" stroke="#6a7180" stroke-width="2"/>
  <line x1="176" y1="306" x2="704" y2="306" stroke="#6a7180" stroke-width="2"/>
  <line x1="176" y1="306" x2="176" y2="344" stroke="#6a7180" stroke-width="2" marker-end="url(#dpvArr)"/>
  <line x1="440" y1="306" x2="440" y2="344" stroke="#6a7180" stroke-width="2" marker-end="url(#dpvArr)"/>
  <line x1="704" y1="306" x2="704" y2="344" stroke="#6a7180" stroke-width="2" marker-end="url(#dpvArr)"/>

  <!-- IPO -->
  <rect x="60" y="344" width="232" height="96" rx="8" fill="#111318" stroke="#7777cc" stroke-width="1.5"/>
  <text x="76" y="376" font-size="14" font-weight="700" fill="#7777cc">IPO</text>
  <text x="76" y="400" font-size="11.5" fill="#e8e8e8">시그모이드 → 제곱 오차</text>
  <text x="76" y="422" font-size="11" fill="#9aa4b8">목표값에 맞춰 과적합을 막는다</text>

  <!-- SimPO -->
  <rect x="324" y="344" width="232" height="96" rx="8" fill="#111318" stroke="#7777cc" stroke-width="1.5"/>
  <text x="340" y="376" font-size="14" font-weight="700" fill="#7777cc">SimPO</text>
  <text x="340" y="400" font-size="11.5" fill="#e8e8e8">기준 모델을 지운다</text>
  <text x="340" y="422" font-size="11" fill="#9aa4b8">길이로 정규화한 평균 로그 확률</text>

  <!-- ORPO -->
  <rect x="588" y="344" width="232" height="96" rx="8" fill="#111318" stroke="#7777cc" stroke-width="1.5"/>
  <text x="604" y="376" font-size="14" font-weight="700" fill="#7777cc">ORPO</text>
  <text x="604" y="400" font-size="11.5" fill="#e8e8e8">SFT 단계를 합친다</text>
  <text x="604" y="422" font-size="11" fill="#9aa4b8">언어 모델 손실 + 선호 손실</text>

  <!-- 요약 -->
  <rect x="60" y="470" width="760" height="56" rx="8" fill="#0f1218" stroke="#2a2f3a" stroke-width="1"/>
  <text x="440" y="503" font-size="13" fill="#e8e8e8" text-anchor="middle">RLHF에서 보상 모델을, DPO에서 기준 모델을, 마지막에 SFT 단계를 덜어 냈다</text>
</svg>
