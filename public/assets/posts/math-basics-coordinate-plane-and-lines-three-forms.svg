<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>

  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">셋은 같은 직선을 다르게 적은 것이다</text>
  <text x="60" y="82" font-size="13" fill="#888">기울기 2이고 (1, 3) 을 지나는 직선 하나를 세 꼴로 적는다</text>

  <line x1="100" y1="300" x2="400" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="140" y1="120" x2="140" y2="330" stroke="#888" stroke-width="1.5"/>
  <text x="410" y="305" font-size="13" fill="#888">x</text>
  <text x="146" y="122" font-size="13" fill="#888">y</text>
  <line x1="200" y1="295" x2="200" y2="305" stroke="#888" stroke-width="1"/>
  <text x="200" y="324" font-size="13" fill="#888" text-anchor="middle">1</text>
  <line x1="135" y1="240" x2="145" y2="240" stroke="#888" stroke-width="1"/>
  <text x="128" y="245" font-size="13" fill="#888" text-anchor="end">3</text>
  <line x1="135" y1="280" x2="145" y2="280" stroke="#888" stroke-width="1"/>
  <text x="128" y="285" font-size="13" fill="#888" text-anchor="end">1</text>

  <line x1="140" y1="280" x2="380" y2="160" stroke="#7ec8e3" stroke-width="2.5"/>
  <circle cx="200" cy="240" r="5" fill="#e8e8e8"/>
  <text x="214" y="234" font-size="13" fill="#e8e8e8">(1, 3)</text>
  <line x1="260" y1="210" x2="320" y2="210" stroke="#7777cc" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="320" y1="210" x2="320" y2="180" stroke="#7777cc" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="290" y="204" font-size="12" fill="#7777cc" text-anchor="middle">1</text>
  <text x="334" y="200" font-size="12" fill="#7777cc">2</text>

  <rect x="460" y="120" width="360" height="66" rx="8" fill="none" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="480" y="150" font-size="17" fill="#e8e8e8">y = 2x + 1</text>
  <text x="480" y="174" font-size="13" fill="#888">기울기와 절편 — 그래프를 그릴 때</text>

  <rect x="460" y="200" width="360" height="66" rx="8" fill="none" stroke="#7777cc" stroke-width="1.5"/>
  <text x="480" y="230" font-size="17" fill="#e8e8e8">y − 3 = 2(x − 1)</text>
  <text x="480" y="254" font-size="13" fill="#888">점과 기울기 — 지나는 점 하나를 알 때</text>

  <rect x="460" y="280" width="360" height="66" rx="8" fill="none" stroke="#55c555" stroke-width="1.5"/>
  <text x="480" y="310" font-size="17" fill="#e8e8e8">2x − y + 1 = 0</text>
  <text x="480" y="334" font-size="13" fill="#888">일반형 — 세로선까지 예외 없이 담는다</text>

  <text x="60" y="362" font-size="13" fill="#7777cc">x = 3 같은 세로선은 Δx 가 0이라 기울기를 못 적는다. 일반형에서는 b = 0 인 경우일 뿐이다</text>
</svg>
