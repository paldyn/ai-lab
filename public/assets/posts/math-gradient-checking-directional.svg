<rect x="90" y="354" width="700" height="66" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1.5"/>
<text x="440" y="381" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">수치 쪽: ( u·f(x + h·v) − u·f(x − h·v) ) ÷ 2h      해석 쪽: uᵀ J v</text>
<text x="440" y="404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">두 수가 맞으면 모든 칸이 한꺼번에 한 번 검사된 것이다 — 다만 칸 하나의 실수는 묽어진다</text>
