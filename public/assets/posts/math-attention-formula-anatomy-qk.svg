<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="350" rx="12" fill="#0a0a0a"/>
  <text x="60" y="56" font-size="22" font-weight="700" fill="#e8e8e8">QKᵀ의 모양 — 안쪽 64가 맞아야 곱이 선다</text>
  <text x="60" y="84" font-size="13" fill="#888">토큰 10개, dₖ = 64 — 칠한 행과 열이 만나 칸 하나가 된다</text>
  <rect x="60" y="164" width="128" height="80" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="60" y="188" width="128" height="8" fill="#7ec8e3" fill-opacity="0.45"/>
  <text x="124" y="272" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">Q  10×64</text>
  <text x="124" y="292" font-size="13" fill="#888" text-anchor="middle">행 i = qᵢ</text>
  <text x="214" y="210" font-size="22" fill="#e8e8e8" text-anchor="middle">·</text>
  <rect x="240" y="140" width="80" height="128" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <rect x="288" y="140" width="8" height="128" fill="#7777cc" fill-opacity="0.6"/>
  <text x="280" y="296" font-size="14" font-weight="600" fill="#e8e8e8" text-anchor="middle">Kᵀ  64×10</text>
  <text x="280" y="316" font-size="13" fill="#888" text-anchor="middle">열 j = kⱼ</text>
  <text x="350" y="210" font-size="22" fill="#e8e8e8" text-anchor="middle">=</text>
  <rect x="380" y="164" width="80" height="80" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <line x1="388" y1="164" x2="388" y2="244" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="172" x2="460" y2="172" stroke="#222" stroke-width="1"/>
  <line x1="396" y1="164" x2="396" y2="244" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="180" x2="460" y2="180" stroke="#222" stroke-width="1"/>
  <line x1="404" y1="164" x2="404" y2="244" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="188" x2="460" y2="188" stroke="#222" stroke-width="1"/>
  <line x1="412" y1="164" x2="412" y2="244" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="196" x2="460" y2="196" stroke="#222" stroke-width="1"/>
  <line x1="420" y1="164" x2="420" y2="244" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="204" x2="460" y2="204" stroke="#222" stroke-width="1"/>
  <line x1="428" y1="164" x2="428" y2="244" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="212" x2="460" y2="212" stroke="#222" stroke-width="1"/>
  <line x1="436" y1="164" x2="436" y2="244" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="220" x2="460" y2="220" stroke="#222" stroke-width="1"/>
  <line x1="444" y1="164" x2="444" y2="244" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="228" x2="460" y2="228" stroke="#222" stroke-width="1"/>
  <line x1="452" y1="164" x2="452" y2="244" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="236" x2="460" y2="236" stroke="#222" stroke-width="1"/>
  <rect x="428" y="188" width="8" height="8" fill="#e8e8e8"/>
  <text x="420" y="272" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">QKᵀ  10×10</text>
  <text x="420" y="292" font-size="13" fill="#888" text-anchor="middle">칸 (i, j)</text>
  <rect x="520" y="144" width="300" height="120" rx="6" fill="#101010" stroke="#333" stroke-width="1"/>
  <text x="544" y="175" font-size="15" font-weight="600" fill="#e8e8e8">칸 (i, j) = qᵢ · kⱼ</text>
  <text x="544" y="197" font-size="13" font-weight="400" fill="#e8e8e8">64개의 곱을 더한 수 — t가 사라진다</text>
  <text x="544" y="219" font-size="13" font-weight="400" fill="#888">칸 100개 × 곱 64번 = 곱셈 6,400번</text>
  <text x="544" y="241" font-size="13" font-weight="400" fill="#888">QK로 쓰면 안쪽이 64와 10 — 곱이 없다</text>
</svg>
