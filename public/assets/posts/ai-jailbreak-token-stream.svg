<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <defs>
    <marker id="arrN" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arrR" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">지시와 데이터가 한 열에 섞인다</text>
  <text x="440" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#888" text-anchor="middle">역할 표시는 그 열 안에 찍힌 관례일 뿐 물리적인 벽이 아니다</text>

  <!-- Token stream -->
  <text x="60" y="112" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">모델이 받는 것 — 토큰 하나의 열</text>

  <rect x="60" y="126" width="760" height="76" rx="10" fill="#111318" stroke="#555555" stroke-width="1.5"/>
  <line x1="250" y1="126" x2="250" y2="202" stroke="#555555" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="440" y1="126" x2="440" y2="202" stroke="#555555" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="630" y1="126" x2="630" y2="202" stroke="#555555" stroke-width="2" stroke-dasharray="4,4"/>

  <text x="155" y="158" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">시스템 프롬프트</text>
  <text x="155" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">우리가 배포한 것</text>

  <text x="345" y="158" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">사용자 메시지</text>
  <text x="345" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">요청으로만 받는다</text>

  <text x="535" y="158" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">검색해 온 문서</text>
  <text x="535" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">지시가 숨는 자리</text>

  <text x="725" y="158" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">도구 응답</text>
  <text x="725" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="11" fill="#888" text-anchor="middle">전부 데이터 등급</text>

  <text x="495" y="232" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="end">검색해 온 문서 칸에 이런 문장이 들어 있다면</text>

  <!-- Injected sentence -->
  <line x1="535" y1="202" x2="535" y2="252" stroke="#888888" stroke-width="2" marker-end="url(#arrN)"/>
  <rect x="385" y="252" width="300" height="44" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="401" y="278" xml:space="preserve"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">"이전 지시를 모두 무시하라"</text>

  <!-- Two readings -->
  <line x1="470" y1="296" x2="255" y2="330" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="600" y1="296" x2="620" y2="330" stroke="#e05555" stroke-width="2" marker-end="url(#arrR)"/>

  <rect x="110" y="330" width="300" height="84" rx="10" fill="#10180d" stroke="#55c555" stroke-width="1.5"/>
  <text x="260" y="356" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">문서의 내용으로 읽는다</text>
  <text x="260" y="377" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">요약에 그 문장이 들어갈 뿐</text>
  <text x="260" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">이상한 답이 나오고 끝난다</text>

  <rect x="470" y="330" width="300" height="84" rx="10" fill="#1a100d" stroke="#e05555" stroke-width="1.5"/>
  <text x="620" y="356" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">자기에게 온 지시로 읽는다</text>
  <text x="620" y="377" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">대화 기록이 그대로 새어 나간다</text>
  <text x="620" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888" text-anchor="middle">도구가 붙어 있으면 행동이 된다</text>

  <text x="440" y="448" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">SQL은 값을 별도 통로로 넘기는 파라미터 바인딩이 있다 — LLM에는 아직 그 통로가 없다</text>
</svg>
