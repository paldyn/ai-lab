<text x="423.0" y="205.4" font-size="14" fill="#55c555" text-anchor="start" font-weight="600">최소노름 해 w* = (1, 2)</text>
<text x="423.0" y="225.0" font-size="13" fill="#55c555" text-anchor="start">‖w*‖ = √5 ≈ 2.24</text>
<line x1="417.4" y1="216.6" x2="339.0" y2="254.4" stroke="#55c555" stroke-width="1.5"/>
<text x="486.0" y="308.0" font-size="13" fill="#e8e8e8" text-anchor="start">다른 보간 해 (3, 1)</text>
<text x="486.0" y="325.0" font-size="13" fill="#888" text-anchor="start">‖w‖ = √10 ≈ 3.16</text>
<text x="584.0" y="456.0" font-size="13" fill="#7ec8e3" text-anchor="start">해 집합 { w : w₁ + 2w₂ = 5 }</text>
<text x="206.0" y="488.0" font-size="13" fill="#7777cc" text-anchor="end">행공간 span{x}</text>
<text x="157.0" y="515.5" font-size="13" fill="#888" text-anchor="start"></text>
<rect x="600" y="92" width="250" height="96" rx="8" fill="#111" stroke="#333"/>
<text x="618.0" y="120.0" font-size="13" fill="#e8e8e8" text-anchor="start">표본 하나: x = (1, 2), y = 5</text>
<text x="618.0" y="144.0" font-size="13" fill="#888" text-anchor="start">w* = xᵀ(x xᵀ)⁻¹ y = (1, 2)·5/5</text>
<text x="618.0" y="166.0" font-size="13" fill="#888" text-anchor="start">원이 해 집합에 처음 닿는 점</text>
