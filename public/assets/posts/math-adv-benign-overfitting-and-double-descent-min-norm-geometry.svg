<rect x="0" y="0" width="880" height="560" rx="12" fill="#0a0a0a"/>
<text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">최소노름 해: 원점에서 해 집합에 내린 수선의 발</text>
