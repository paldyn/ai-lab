<line x1="584" y1="274" x2="796" y2="274" stroke="#2a2a2a" stroke-width="1"/>
<text x="584" y="298" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">x = 15 일 때</text>
<text x="584" y="320" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">평균 10 + 0.6 × 5 = 13</text>
<text x="584" y="342" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">분산 25 − 15²/25 = 16</text>
<text x="584" y="364" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">표준편차 4 → 9 ~ 17</text>
<text x="584" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">x = 5 일 때</text>
<text x="584" y="420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">평균 10 + 0.6 × (−5) = 7</text>
<text x="584" y="442" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#888">분산은 그대로 16 → 3 ~ 11</text>
